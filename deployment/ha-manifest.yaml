schema_version: 2
release: "2026-10-02-fbb3-dashboard"

home_assistant_packages:
  - source: home-assistant/packages/ecco_pro.yaml
    destination: /config/packages/ecco_pro.yaml
    method: ssh_file_copy
    restart_required: true
  - source: home-assistant/packages/ecco_runtime_config.yaml
    destination: /config/packages/ecco_runtime_config.yaml
    method: ssh_file_copy
    restart_required: true
  # R9 (r9; scheduled Charge Battery, not live-proven): a missed scheduled run is never started after a Home Assistant restart.
  # Install this package with a FULL Home Assistant restart, not a package or YAML reload. The captured Home Assistant start time
  # is written only on the start event, so after a reload it is unknown and every guard fails closed: the schedule watchdog then
  # will NOT rescue a lost start. A restart that happens after the planned start time never starts that run; it is recorded as
  # missed (MISSED - not started after a Home Assistant restart), notified and disarmed.
  - source: home-assistant/packages/ecco_free_power_schedule.yaml
    destination: /config/packages/ecco_free_power_schedule.yaml
    method: ssh_file_copy
    restart_required: true
  # Manual Dump-to-Grid V1 scheduler (NOT live-proven). Only meaningful
  # alongside the Dump-to-Grid firmware; its arm validation also reads
  # ecco_free_power_schedule.yaml's helpers for the schedule-overlap check.
  # R9 (r9; scheduled Export to Grid, not live-proven): a missed scheduled run is never started after a Home Assistant restart.
  # Install this package with a FULL Home Assistant restart, not a package or YAML reload. The captured Home Assistant start time
  # is written only on the start event, so after a reload it is unknown and every guard fails closed: the schedule watchdog then
  # will NOT rescue a lost start. A restart that happens after the planned start time never starts that run; it is recorded as
  # missed (MISSED - not started after a Home Assistant restart), notified and disarmed.
  # Stage 3 (epc2; offline, not live-proven). HELPER DEPENDENCY: this package now needs ecco_plan_helpers.yaml installed in the SAME
  # deployment, before the ONE full Home Assistant restart (the R9 note above: a FULL restart, not a reload). The order of the stanzas in
  # this list does not matter: the deploy tool copies every package, checks the configuration, and restarts Home Assistant only as a
  # separately approved step. Until the plan helpers are installed and Home Assistant has restarted fully, every scheduled start is refused
  # (reason OVERRIDE_UNREADABLE) and every guarded start is refused, because the plan sensors cannot be read.
  # ACTIVE-OVERRIDE WARNING: while a Hold battery, Skip tonight or Prepare for power cut override is active, or the plan records cannot be
  # read, or the effective reserve is not a valid number, every scheduled start and every guarded manual start is REFUSED. The owner sees this
  # only at the start time, through the blocked alert and the last-result text, not when the override is set: check before an armed start time.
  - source: home-assistant/packages/ecco_dump_to_grid_schedule.yaml
    destination: /config/packages/ecco_dump_to_grid_schedule.yaml
    method: ssh_file_copy
    restart_required: true
  - source: home-assistant/packages/ecco_battery_outlook_influx.yaml
    destination: /config/packages/ecco_battery_outlook_influx.yaml
    method: ssh_file_copy
    restart_required: true
  - source: home-assistant/packages/ecco_canonical_telemetry.yaml
    destination: /config/packages/ecco_canonical_telemetry.yaml
    method: ssh_file_copy
    restart_required: true
  - source: home-assistant/packages/ecco_system_health.yaml
    destination: /config/packages/ecco_system_health.yaml
    method: ssh_file_copy
    restart_required: true
  - source: home-assistant/packages/ecco_manual_controls_helpers.yaml
    destination: /config/packages/ecco_manual_controls_helpers.yaml
    method: ssh_file_copy
    restart_required: true
  # HA supervision heartbeat - PR A, OBSERVE-ONLY (NOT live-proven). Only
  # meaningful alongside firmware that provides the ha_supervision_heartbeat
  # API action; against older firmware its call simply fails (continue_on_error).
  - source: home-assistant/packages/ecco_supervision_heartbeat.yaml
    destination: /config/packages/ecco_supervision_heartbeat.yaml
    method: ssh_file_copy
    restart_required: true
  # Fallback Profile / supervision display layer (FB-B3; read-only, NOT live-proven until the FB-B3
  # live proof). Requires firmware with the FB-B1/FB-B2/FB-B3 entities.
  - source: home-assistant/packages/ecco_fallback_status.yaml
    destination: /config/packages/ecco_fallback_status.yaml
    method: ssh_file_copy
    restart_required: true
  # Operator-only wrappers for esphome.<node>_fallback_profile_execute (FB-B3). Never called by
  # automations; only the dashboard's human-pressed buttons reach them.
  - source: home-assistant/packages/ecco_fallback_profile_actions.yaml
    destination: /config/packages/ecco_fallback_profile_actions.yaml
    method: ssh_file_copy
    restart_required: true
  # Battery time to reserve - FE1 (read-only estimate for the Energy Flow card's battery node;
  # no service call, no control; NOT live-proven). Deploy before dashboard 7.21.0.
  - source: home-assistant/packages/ecco_battery_runtime.yaml
    destination: /config/packages/ecco_battery_runtime.yaml
    method: ssh_file_copy
    restart_required: true

  # Advanced Configuration Stage 0 - ACS0 (owner edit of ONE TOU slot's target SOC through the existing, verified manual
  # TOU firmware path; review + typed confirmation; NOT live-proven - see docs/dev/advanced-config/stage0-live-proof-procedure.md).
  - source: home-assistant/packages/ecco_tou_target_soc_edit.yaml
    destination: /config/packages/ecco_tou_target_soc_edit.yaml
    method: ssh_file_copy
    restart_required: true

  # Dump to Grid operating limits, owner view - FCC1 (describes the fcp1 / fcp2 firmware's limits state; template entities, one
  # notification-only automation; writes nothing to the dongle). Deploy only with or after the fcp2 firmware.
  - source: home-assistant/packages/ecco_dump_limits.yaml
    destination: /config/packages/ecco_dump_limits.yaml
    method: ssh_file_copy
    restart_required: true

  # Restore the owner's manual Dump to Grid / Free Power request values after a scheduled start - SMR1 (saves each value a
  # scheduled start replaces; one verified restore once nothing owns control; writes only its helpers and the five request
  # numbers, never the inverter). Deploy with or after the two schedule packages.
  - source: home-assistant/packages/ecco_schedule_manual_restore.yaml
    destination: /config/packages/ecco_schedule_manual_restore.yaml
    method: ssh_file_copy
    restart_required: true

  # ECCO Intelligence SHADOW v0.1 - isp1 (advice only; applies nothing). The presentation package (the pause helper, the dead-man
  # watchdog and three notification-only alerts) and the raise-only reserve helper: install both BEFORE the integration and turn
  # the pause helper on before the integration first starts (the install runbook, gate G8). The integration itself
  # (custom_components/ecco_intelligence) installs by its own kit route and is not listed here.
  - source: home-assistant/packages/ecco_intelligence.yaml
    destination: /config/packages/ecco_intelligence.yaml
    method: ssh_file_copy
    restart_required: true
  - source: home-assistant/packages/ecco_intelligence_prefs.yaml
    destination: /config/packages/ecco_intelligence_prefs.yaml
    method: ssh_file_copy
    restart_required: true
  # The ECCO Intelligence dashboard's registration (one YAML-mode lovelace dashboards entry, nothing else). Deploy it after the
  # dashboard file (intelligence_dashboard below).
  - source: home-assistant/packages/ecco_intelligence_dashboard.yaml
    destination: /config/packages/ecco_intelligence_dashboard.yaml
    method: ssh_file_copy
    restart_required: true

  # ECCO plan overrides - epc2 (stage 3 of the two-master-card energy-control work; NOT installed, NOT live-proven). The plan helper
  # package: the owner's limits, the plan revision, the override records, the two guarded scripts (the only writers of the records;
  # they never call a charge, discharge, TOU, inverter or dongle service) and the export-hold / effective-reserve sensors. Install it in
  # the SAME deployment as the guarded start below and the changed ecco_dump_to_grid_schedule.yaml, before the ONE full Home Assistant
  # restart (the order of the stanzas in this list does not matter): both refuse every start while these sensors cannot be read. The
  # first Home Assistant start writes the owner's accepted limits once; the confirmation switch stays off.
  - source: home-assistant/packages/ecco_plan_helpers.yaml
    destination: /config/packages/ecco_plan_helpers.yaml
    method: ssh_file_copy
    restart_required: true
  # The guarded manual Dump to Grid start the Energy Actions card calls when it is configured with dump_to_grid.guarded_start. It
  # presses the same dongle start button, but only while no override holds export and the staged Stop SOC is at least the effective
  # reserve. Needs ecco_plan_helpers.yaml installed in the SAME deployment, before the ONE full Home Assistant restart (the order of the
  # stanzas in this list does not matter). Until the plan helpers are installed and Home Assistant has restarted fully, every guarded start
  # is refused. While an override is active, or the plan records cannot be read, or the effective reserve or the staged Stop SOC is invalid,
  # it refuses, says why in the plan last-result text and raises one notification, and presses nothing.
  # The dongle's own Start button is not bound by these protections (unresolved; it needs a firmware gate, approved separately).
  - source: home-assistant/packages/ecco_dump_to_grid_guarded_start.yaml
    destination: /config/packages/ecco_dump_to_grid_guarded_start.yaml
    method: ssh_file_copy
    restart_required: true

  # Start bypass detector - bpd1 (detect and alert only; NOT installed, NOT live-proven). Notices a Dump to Grid or Charge Battery session that turned active
  # without ECCO's own record of the start (the scheduled run's STARTED OK, or the guarded start), always records an incident in its own helpers and raises a
  # persistent notification (Dump to Grid on every such start; Charge Battery only when an export hold is active or a plan reading is unreadable). It writes
  # nothing but those helpers and the notification (no dongle, inverter, TOU or ECCO control), PREVENTS NOTHING and is blind while
  # Home Assistant is down. It reads the plan sensors, the two schedule packages' result texts and the guarded start script: install it in the SAME deployment as,
  # or after, ecco_plan_helpers.yaml, ecco_dump_to_grid_guarded_start.yaml and the two schedule packages (the ONE full Home Assistant restart covers it; installed
  # alone later it needs no restart: reload the four helper domains and automations, never "reload all").
  - source: home-assistant/packages/ecco_start_bypass_detector.yaml
    destination: /config/packages/ecco_start_bypass_detector.yaml
    method: ssh_file_copy
    restart_required: true

  # Time trust - ttr1 (READ-ONLY; NOT installed, NOT LIVE-PROVEN). Template entities only: a trust state for each of three clocks (Home Assistant, the dongle's NTP time, the inverter's),
  # the worst of the three, and three yes/no consumers (lease ends and schedule starts, Home Assistant schedules, slot-time edits), each failing safe (an unreadable input is never TRUSTED).
  # It reads eight entities the dongle already publishes and writes nothing: no automation, helper, script or service call, and nothing is wired to a gate yet. Install = copy the
  # file, check the configuration and RELOAD the template entities (Developer tools, YAML): no restart and no other package, which is why restart_required is false here (the packages that
  # carry helpers, automations or a start-time capture are installed with a restart). Delete the file and reload to remove it.
  - source: home-assistant/packages/ecco_time_trust.yaml
    destination: /config/packages/ecco_time_trust.yaml
    method: ssh_file_copy
    restart_required: false

  # Start gate - sgt1 (NOT installed, NOT LIVE-PROVEN). Item N2 of the architecture reconciliation. Two template binary sensors, binary_sensor.ecco_charge_start_allowed and binary_sensor.ecco_export_start_allowed:
  # ONE shared start gate for Charge Battery (Free Power) and Export to Grid (Dump to Grid), built only from facts ECCO already has (time trust, telemetry, no open recovery obligation, the other function not running;
  # for Export the Stage 3 hold, reserve, Stop SOC and plan revision; for Charge a grid-import headroom check that is OFF until the owner sets input_number.ecco_grid_import_ceiling_w, a helper with no initial value:
  # only a readable 0 means none configured, a ceiling that cannot be read closes the gate). Every missing, unavailable or unknown input closes the gate and is named in its reasons. Also
  # script.ecco_free_power_start_guarded: a guarded Free Power start bound to the gate (a NEW start path; the Energy Actions card is NOT changed in this step and still presses the dongle's start button directly, and
  # the start bypass detector would record a start of it as a bypass; a refused explicit request puts the staged values it replaced back). THE GATE IS SOFT: the dongle's own Start button bypasses it until a firmware gate
  # exists. Nothing calls the script and nothing writes to the inverter. Install = copy the file, check the configuration, then reload the input_number helpers first, then the template entities, then the scripts,
  # one at a time (never "reload all"): no restart, which is why restart_required is false. It needs ecco_time_trust.yaml, ecco_plan_helpers.yaml and the two schedule packages. Delete the file and reload the
  # same three to remove it.
  - source: home-assistant/packages/ecco_start_gate.yaml
    destination: /config/packages/ecco_start_gate.yaml
    method: ssh_file_copy
    restart_required: false
  # Lease guard, Dump to Grid - sgt1 (NOT installed, NOT LIVE-PROVEN). THIS GUARD NEEDS THE OWNER'S SEPARATE INSTALL AUTHORISATION. One automation that only ever presses END DUMP TO GRID - RESTORE NOW: it ends a Dump
  # to Grid lease when a Hold battery, Skip tonight or Prepare for power cut turns on, or the effective reserve rises above the Stop SOC the lease latched. The Dump End is not an operator retry in the firmware (it clears
  # no lockout and resets no backoff), so the guard needs no precondition beyond an active lease. It starts, arms and writes nothing, acts only on a change from a reading (never at a Home Assistant start, a reload or a
  # reconnect) and is SOFT (it runs in Home Assistant). Install = copy the file, check the configuration, reload the automations: no restart. Delete the file and reload to remove it.
  - source: home-assistant/packages/ecco_lease_guard_dump.yaml
    destination: /config/packages/ecco_lease_guard_dump.yaml
    method: ssh_file_copy
    restart_required: false
  # Lease guard, Free Power time trust - sgt1 (NOT installed, NOT LIVE-PROVEN). THIS GUARD NEEDS THE OWNER'S SEPARATE INSTALL AUTHORISATION. One automation that only ever presses END FREE POWER - RESTORE NOW, when
  # binary_sensor.ecco_time_trusted_for_leases has not read on for 5 minutes. THAT PRESS IS THE OPERATOR'S END (in the firmware the press that retries a restore and clears the operator-decision lockout), so it is made only
  # for a lease verified running normally (status ACTIVE - VERIFIED OK, no start or restore in progress, an end time in the future) and at most once per lease, and it says why when it declines. It starts, arms and writes
  # nothing, acts only on a change from a reading (never at a Home Assistant start, a reload or a reconnect) and is SOFT (it runs in Home Assistant). It reads ecco_time_trust.yaml (it is on that package's READERS
  # allow-list). Install = copy the file, check the configuration, reload the automations: no restart. Delete the file and reload to remove it.
  - source: home-assistant/packages/ecco_lease_guard_free_power_time.yaml
    destination: /config/packages/ecco_lease_guard_free_power_time.yaml
    method: ssh_file_copy
    restart_required: false
  # Lease guard, Free Power grid import - sgt1 (NOT installed, NOT LIVE-PROVEN). THIS GUARD NEEDS THE OWNER'S SEPARATE INSTALL AUTHORISATION. One automation that only ever presses END FREE POWER - RESTORE NOW, when the
  # measured grid import stays above the configured ceiling (input_number.ecco_grid_import_ceiling_w, of the start gate) for 30 seconds. THAT PRESS IS THE OPERATOR'S END, so it is made only for a lease verified running
  # normally and at most once per lease, and it says why when it declines. A second small automation in the same file only raises a notification, and never presses, when the ceiling cannot be read (the guard is then
  # inert). They start, arm and write nothing and are SOFT (they run in Home Assistant). Install = copy the file, check the configuration, reload the automations: no restart. Delete the file and reload to remove it.
  - source: home-assistant/packages/ecco_lease_guard_free_power_import.yaml
    destination: /config/packages/ecco_lease_guard_free_power_import.yaml
    method: ssh_file_copy
    restart_required: false

  # Export coordinator - exc1 (READ-ONLY SHADOW; NOT installed, NOT LIVE-PROVEN). Item N3 of the architecture reconciliation. Nine template sensors and nothing else: from MEASURED values (no forecast entity is read)
  # a proposal for an Export to Grid start (the Stop SOC floor, the usable energy above it, the expected battery power, the net export target and the duration, with a state VALID / INVALID / UNVERIFIED / HOLD and every
  # blocking cause named), a re-target shadow (would a change be allowed now: an END plus a guarded re-START, at most one per 30 minutes, only reported) and a comparison with the running lease's latched values. No
  # automation, script, helper, trigger or service call, and nothing reads the sensors yet. THE GATES ARE SOFT: the dongle's own Start button bypasses them. It does not read the start gate or the time trust input (both
  # packages pin who may read them: that wiring is a separate step with its own approval). Install = copy the file, check the configuration and reload the template entities (Developer tools, YAML): no restart, which
  # is why restart_required is false; it needs the owner's go. It needs ecco_plan_helpers.yaml, ecco_dump_limits.yaml, ecco_dump_to_grid_schedule.yaml, ecco_canonical_telemetry.yaml and ecco_battery_runtime.yaml. Delete
  # the file and reload to remove it.
  - source: home-assistant/packages/ecco_export_coordinator.yaml
    destination: /config/packages/ecco_export_coordinator.yaml
    method: ssh_file_copy
    restart_required: false

dashboard:
  source: home-assistant/dashboards/ecco_pro.yaml
  destination: /config/ecco/dashboards/ecco_pro.yaml
  method: ssh_file_copy_staged
  restart_required: false
  activation_required: true

# ECCO Intelligence SHADOW v0.1 - isp1: the standalone ECCO Intelligence dashboard (YAML mode, read-only apart from the pause
# tile). It is separate from the production dashboard above and never changes it; ecco_intelligence_dashboard.yaml registers it,
# which takes effect at a Home Assistant restart.
intelligence_dashboard:
  source: home-assistant/dashboards/ecco_intelligence.yaml
  destination: /config/ecco/dashboards/ecco_intelligence.yaml
  method: ssh_file_copy
  restart_required: false
  activation_required: true

# Committed Lovelace custom-card dist assets. Only the Energy Actions card
# is listed here for now - the already-working Energy Flow asset/resource
# path is deliberately left as-is and not migrated in this pass.
frontend_assets:
  - source: frontend/ecco-energy-actions-card/dist/ecco-energy-actions-card.js
    destination: /config/www/ecco/ecco-energy-actions-card.js
    method: ssh_file_copy
    restart_required: false
    resource_registration: manual
    resource_url: /local/ecco/ecco-energy-actions-card.js
  # Fallback / Recovery card - FB-B1 (read-only review of the inverter fallback-profile
  # registers). NOT deployed: listed for the deploy tooling only; copying the file and
  # registering the resource stay deliberate manual steps. A single dependency-free ES
  # module (no dist build step).
  - source: frontend/ecco-fallback-recovery-card/ecco-fallback-recovery-card.js
    destination: /config/www/ecco/ecco-fallback-recovery-card.js
    method: ssh_file_copy
    restart_required: false
    resource_registration: manual
    resource_url: /local/ecco/ecco-fallback-recovery-card.js
  # Advanced / Experimental Configuration card - ACFG1 (read-only register catalogue with
  # the Global Power / Export Limit register 245 panel; it cannot write). Copying the file
  # and registering the resource stay deliberate manual steps.
  - source: frontend/ecco-advanced-config-card/dist/ecco-advanced-config-card.js
    destination: /config/www/ecco/ecco-advanced-config-card.js
    method: ssh_file_copy
    restart_required: false
    resource_registration: manual
    resource_url: /local/ecco/ecco-advanced-config-card.js
  # ECCO TOU Settings card - ACU1 (the six live TOU slots and a guarded editor that calls only the
  # installed ACS1 editor scripts; no write path of its own). Copying the file and registering the
  # resource stay deliberate manual steps.
  - source: frontend/ecco-tou-settings-card/dist/ecco-tou-settings-card.js
    destination: /config/www/ecco/ecco-tou-settings-card.js
    method: ssh_file_copy
    restart_required: false
    resource_registration: manual
    resource_url: /local/ecco/ecco-tou-settings-card.js
  # ECCO Intelligence card - isp1 (read-only display of the ecco-intel-entities/1 output; no write path of any kind).
  # A single dependency-free ES module (no dist build step). Copying the file and registering the resource stay
  # deliberate manual steps.
  - source: frontend/ecco-intelligence-card/ecco-intelligence-card.js
    destination: /config/www/ecco/ecco-intelligence-card.js
    method: ssh_file_copy
    restart_required: false
    resource_registration: manual
    resource_url: /local/ecco/ecco-intelligence-card.js

firmware:
  source: firmware/ecco_clock_dongle_stage3_4_free_power.yaml
  destination: esphome_device_builder
  method: manual_device_builder
  hardware_write_capable: true

influxdb:
  - source: influxdb/tasks/ecco_battery_outlook_5m.flux
    destination: influxdb_task_ecco_battery_outlook_5m
    method: manual_task_editor
  - source: influxdb/tasks/ecco_battery_outlook_score_daily.flux
    destination: influxdb_task_ecco_battery_outlook_daily_score
    method: manual_task_editor
  - source: influxdb/ecco_influxdb_options_v1_3.yaml
    destination: home_assistant_influx_export_configuration
    method: reference_only

deployment:
  ssh_alias: ecco-ha
  backup_root: /config/ecco-backups
  validation_command: ha core check
  automatic_restart: false
  automatic_inverter_writes: false

notes:
  - Home Assistant package deployment is now prepared for local key-authenticated SSH/SFTP using tools/deploy-ha.ps1.
  - Every SSH file deployment is staged to a temporary path, SHA256-verified, backed up, checked with ha core check, and rolled back on failure.
  - Home Assistant is not restarted unless -Restart is explicitly supplied.
  - The dashboard can be staged at /config/ecco/dashboards/ecco_pro.yaml, but storage-mode Lovelace is not replaced automatically; YAML dashboard registration remains a deliberate one-time configuration step.
  - ESPHome firmware and InfluxDB tasks remain deliberate/manual deployment paths.
  - Install ecco_runtime_config.yaml before deploying portable Battery Outlook tasks; it supplies fresh sensor.ecco_config_* values to InfluxDB.
  - ecco_system_health.yaml is Phase 1 only: read-only, partial, and not a complete manual-control readiness gate.
  - Never include secrets.yaml, API tokens, Wi-Fi credentials, Home Assistant auth tokens or SSH private keys in a deployment bundle.
  - Fallback packages require firmware with FB-B1/FB-B2/FB-B3 entities; deploy firmware first, then packages, then the dashboard.
