name: Bug report
description: Report a reproducible ECCO-Pro problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please remove secrets, serial numbers, account identifiers, private IP addresses, and household telemetry before posting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and expected behaviour.
    validations:
      required: true
  - type: input
    id: inverter
    attributes:
      label: Inverter model
      placeholder: e.g. supported Deye/Sunsynk model
  - type: input
    id: firmware
    attributes:
      label: Inverter firmware
  - type: input
    id: ecco
    attributes:
      label: ECCO-Pro version or commit
  - type: input
    id: esphome
    attributes:
      label: ESPHome version
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitised logs
      description: Remove secrets, identifiers, private addresses and personal data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, account identifiers, private network details and household-specific data.
          required: true
