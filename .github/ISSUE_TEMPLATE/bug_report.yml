name: Bug report
description: A reproducible problem in ECCO. Sanitise everything you paste.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste** secrets, serial numbers, MPAN / MPRN, meter serials, account or tariff ids (they can be inside entity ids),
        IP / MAC addresses, locations or household telemetry. See SUPPORT.md for how to sanitise logs.
        **If ECCO wrote something unexpected to your inverter, stop here** and use private reporting (SECURITY.md) instead.
  - type: dropdown
    id: unexpected_write
    attributes:
      label: Did ECCO write something unexpected to the inverter?
      options: ["No", "Not sure", "Yes - I will use private reporting instead"]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: running
    attributes:
      label: What was armed or running?
      multiple: true
      options: ["Nothing (read-only)", "Free Power", "Dump-to-Grid", "Manual TOU", "Export mode (244)", "Fallback profile", "RTC correction", "Other"]
    validations:
      required: true
  - type: input
    id: inverter
    attributes:
      label: Inverter make, model, phase type and battery type ("unknown" is allowed)
    validations:
      required: true
  - type: textarea
    id: inverter_firmware
    attributes:
      label: Every firmware / version string the inverter shows ("unknown" is allowed)
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller board (classic ESP32 or ESP32-S3) and RS485 adapter
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: ECCO version or commit, firmware YAML, ESPHome version, Home Assistant version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant, sanitised log excerpt
      render: text
  - type: textarea
    id: local_changes
    attributes:
      label: Local modifications to ECCO files (if any)
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, serials, MPAN / meter / account ids, addresses and household data.
          required: true
