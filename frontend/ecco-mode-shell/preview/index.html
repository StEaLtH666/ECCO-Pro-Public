<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECCO Mode Shell preview</title>
<!--
  Development preview for ecco-mode-shell.js. It runs the real card against a stand-in `hass` object that holds only
  `states`, `locale` and `themes`, built from the SYNTHETIC test fixtures read in place (../test/fixtures). The card has no
  write path, so there is nothing to log or reject. The two child cards on this page are demo stand-ins defined below: the
  "advice" card only reads hass.states, the "pause" tile is a local no-op that stands in for the dashboard's real pause
  tile (it never touches hass).

  Browsers refuse ES module imports and fetches from file:// pages, so serve the REPOSITORY ROOT (the fixtures live in the
  card folder) on the loopback address, then open the preview:

      python -m http.server 8765 --bind 127.0.0.1
      http://127.0.0.1:8765/frontend/ecco-mode-shell/preview/?s=normal&theme=dark

  Query: s = scenario (normal, stale, down, alert, large, hostile, invalid, nocatalogue), theme = dark | light, w = card width
  in px, mode = geek (clicks the Geek button after load, as a user would), expand = an entity id to open, raw = 1 to open its raw
  view, q = text to type into the search, chrome = 0 hides the option panel (for screenshots). No network, no CDN, no fonts.
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px/1.45 "Segoe UI", Roboto, Arial, sans-serif; background: #0b1220; color: #e8edf4; }
  body.dark { --primary-text-color: #e8edf4; --secondary-text-color: #aab5c4; --card-background-color: #172133; --divider-color: rgba(255, 255, 255, 0.18); }
  body.light { color-scheme: light; background: #eef1f6; color: #1b2330; --primary-text-color: #1b2330; --secondary-text-color: #4a5565; --card-background-color: #ffffff; --divider-color: rgba(80, 90, 110, 0.32); }
  [hidden] { display: none !important; }
  .wrap { padding: 12px 0 40px; }
  .panel { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 12px 10px; padding: 8px 10px; border: 1px dashed rgba(128, 128, 160, 0.6); border-radius: 10px; }
  .panel span { width: 100%; font-size: 11px; font-weight: 700; text-transform: uppercase; opacity: 0.75; }
  .panel button { font: inherit; font-size: 12px; min-height: 32px; padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(128, 128, 160, 0.6); background: transparent; color: inherit; cursor: pointer; }
  .panel button[aria-pressed="true"] { background: rgba(128, 110, 230, 0.3); }
  #stage { margin: 0 12px; display: grid; gap: 12px; }
  #log { margin: 10px 12px 0; font: 12px/1.4 ui-monospace, Consolas, monospace; opacity: 0.85; white-space: pre-wrap; }
  #err { margin: 12px; color: #ff8a80; white-space: pre-wrap; }
  ecco-demo-advice, ecco-demo-pause { display: block; }
</style>
</head>
<body class="dark">
<div class="wrap">
  <div class="panel" id="scen" role="group" aria-label="Scenario"><span>Scenario (synthetic)</span></div>
  <div class="panel" id="opts" role="group" aria-label="Options"><span>Options</span></div>
  <div id="stage"></div>
  <div id="log" aria-live="polite"></div>
  <pre id="err" hidden></pre>
</div>
<script type="module">
import '../ecco-mode-shell.js';

const FX = '../test/fixtures/';
const SCENARIOS = ['normal', 'stale', 'down', 'alert', 'large', 'hostile', 'invalid', 'nocatalogue'];
const q = new URLSearchParams(location.search);
const state = {
  s: SCENARIOS.includes(q.get('s')) ? q.get('s') : 'normal',
  theme: q.get('theme') === 'light' ? 'light' : 'dark',
  w: Number(q.get('w')) || 0,
};
if (q.get('chrome') === '0') { document.getElementById('scen').hidden = true; document.getElementById('opts').hidden = true; }
const log = (t) => { document.getElementById('log').textContent = t; };

// ---- two demo child cards (stand-ins for the real Intelligence card and its pause tile) ----
class DemoAdvice extends HTMLElement {
  setConfig(c) { this._c = c; }
  set hass(h) {
    const s = h && h.states ? h.states : {};
    const v = (id) => (s[id] && s[id].state !== 'unavailable' && s[id].state !== 'unknown' ? s[id].state : 'not available');
    const box = this.shadowRoot || this.attachShadow({ mode: 'open' });
    box.replaceChildren();
    const st = document.createElement('style');
    st.textContent = '.c{padding:14px 16px;border-radius:16px;border:1px solid var(--divider-color);background:var(--card-background-color);color:var(--primary-text-color);display:grid;gap:6px}'
      + '.h{font-weight:700}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.f{display:grid}.f b{font-size:1.5rem}.f small{opacity:.75}.b{font-size:.8rem;opacity:.8}';
    const c = document.createElement('div');
    c.className = 'c';
    const head = document.createElement('div');
    head.className = 'h';
    head.textContent = 'ECCO Intelligence (SHADOW, advice only)';
    const g = document.createElement('div');
    g.className = 'g';
    for (const [label, id, unit] of [['Charge target', 'sensor.ecco_intel_charge_target', '%'], ['Solar tomorrow', 'sensor.ecco_intel_pv_tomorrow', ' kWh'], ['Status', 'sensor.ecco_intel_status', '']]) {
      const f = document.createElement('div');
      f.className = 'f';
      const b = document.createElement('b');
      const val = v(id);
      b.textContent = val === 'not available' ? 'not available' : `${val}${unit}`;
      const sm = document.createElement('small');
      sm.textContent = label;
      f.append(b, sm);
      g.appendChild(f);
    }
    const note = document.createElement('div');
    note.className = 'b';
    note.textContent = 'Demo stand-in for the real Intelligence card. Advice only: nothing is applied.';
    c.append(head, g, note);
    box.append(st, c);
  }
}
class DemoPause extends HTMLElement {
  setConfig(c) { this._c = c; this._on = false; this._draw(); }
  set hass(_h) { this._draw(); }
  _draw() {
    const box = this.shadowRoot || this.attachShadow({ mode: 'open' });
    box.replaceChildren();
    const st = document.createElement('style');
    st.textContent = 'button{display:flex;gap:10px;align-items:center;width:100%;min-height:56px;padding:10px 14px;border-radius:16px;border:1px solid var(--divider-color);background:var(--card-background-color);color:var(--primary-text-color);font:inherit;text-align:left;cursor:pointer}'
      + 'b{display:block}small{opacity:.75}';
    const b = document.createElement('button');
    b.type = 'button';
    const w = document.createElement('span');
    const t = document.createElement('b');
    t.textContent = 'Pause ECCO Intelligence (advice only)';
    const s = document.createElement('small');
    s.textContent = this._on ? 'Paused (demo: local only)' : 'Running (demo: tap to pause, local only)';
    w.append(t, s);
    b.appendChild(w);
    b.addEventListener('click', () => { this._on = !this._on; log('The demo pause tile was tapped. In the real dashboard this toggles input_boolean.ecco_intel_paused. Here it is a local no-op.'); this._draw(); });
    box.append(st, b);
  }
}
customElements.define('ecco-demo-advice', DemoAdvice);
customElements.define('ecco-demo-pause', DemoPause);

// ---- the mock hass ----
const iso = (ms) => new Date(ms).toISOString();
function statesFrom(raw, now, mutate) {
  const out = {};
  for (const [id, e] of Object.entries(raw)) {
    if (id.startsWith('_')) continue;
    out[id] = { entity_id: id, state: e.state, attributes: structuredClone(e.attributes || {}), last_changed: iso(now - (e.age_s || 0) * 1000), last_updated: iso(now - (e.age_s || 0) * 1000) };
  }
  if (mutate) mutate(out, now);
  return out;
}
const age = (s, id, secs, now) => { s[id].last_updated = iso(now - secs * 1000); s[id].last_changed = s[id].last_updated; };

let cache = null;
async function load() {
  if (cache) return cache;
  const [cat, st, hostile] = await Promise.all(['mini.catalogue.json', 'mini.states.json', 'hostile.states.json'].map(async (n) => (await fetch(FX + n)).json()));
  cache = { cat, st, hostile };
  return cache;
}

async function build(name) {
  const { cat, st, hostile } = await load();
  const now = Date.now();
  let catalogue = structuredClone(cat);
  let states = statesFrom(st, now);
  if (name === 'stale') for (const id of Object.keys(states)) if (id.includes('ecco_intel_') && st[id].age_s < 1000) age(states, id, 1200 + (id.length % 7) * 400, now);
  if (name === 'down') { states['sensor.ecco_intel_status'].state = 'unavailable'; states['sensor.ecco_intel_charge_target'].state = 'unknown'; delete states['binary_sensor.ecco_intel_watchdog_fresh']; }
  if (name === 'alert') { states['sensor.ecco_intel_status'].state = 'SELF_TEST_FAILED'; states['binary_sensor.ecco_intel_watchdog_fresh'].state = 'off'; states['input_boolean.ecco_intel_paused'].state = 'on'; }
  if (name === 'large') {
    for (let i = 0; i < 5000; i += 1) {
      const id = `sensor.ecco_intel_synth_${String(i).padStart(5, '0')}`;
      states[id] = { entity_id: id, state: String(i), attributes: { friendly_name: `Synthetic ${i}`, unit_of_measurement: 'kWh', advice: { a: i, b: 'text' } }, last_changed: iso(now - 30000), last_updated: iso(now - 30000) };
    }
  }
  if (name === 'hostile') Object.assign(states, statesFrom(hostile, now));
  if (name === 'invalid') { catalogue.sources[2].entity_id = 5; }
  if (name === 'nocatalogue') catalogue = undefined;
  return { catalogue, states };
}

let el = null;
let current = null;
async function show() {
  document.body.className = state.theme;
  const stage = document.getElementById('stage');
  stage.replaceChildren();
  stage.style.width = state.w ? `${state.w}px` : '';
  stage.style.margin = state.w ? '0 0 0 0' : '0 12px';
  current = await build(state.s);
  el = document.createElement('ecco-mode-shell');
  el.setConfig({ type: 'custom:ecco-mode-shell', view_id: 'intelligence', title: 'ECCO Intelligence', catalogue: current.catalogue, page_size: 25,
    always: [{ type: 'custom:ecco-demo-advice' }], production: [{ type: 'custom:ecco-demo-pause' }] });
  el.hass = { states: current.states, locale: { language: 'en-GB' }, themes: { darkMode: state.theme === 'dark' } };
  stage.appendChild(el);
  window.__eccoShell = el;
  // the same clicks a user would make
  const root = el.shadowRoot;
  if (q.get('mode') === 'geek') root.querySelector('[data-mode-option="geek"]').click();
  if (q.get('q')) { const i = root.querySelector('[data-inspector-search]'); if (i) { i.value = q.get('q'); i.dispatchEvent(new Event('input')); } }
  const ex = q.get('expand');
  if (ex) {
    const row = [...root.querySelectorAll('[data-inspector-row]')].find((r) => r.getAttribute('data-entity-id') === ex);
    if (row) row.querySelector('[data-row-toggle]').click();
    if (q.get('raw') === '1') {
      const row2 = [...root.querySelectorAll('[data-inspector-row]')].find((r) => r.getAttribute('data-entity-id') === ex);
      const rb = row2 && row2.querySelector('[data-raw-toggle]');
      if (rb) rb.click();
    }
  }
  log(`Scenario ${state.s}: the card gets ${Object.keys(current.states).length} states and reads only hass.states, hass.locale and hass.themes.`);
}

function buttons(host, items, key, label) {
  for (const it of items) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = it;
    b.setAttribute('aria-pressed', String(state[key] === it));
    b.addEventListener('click', () => { state[key] = it; for (const x of host.querySelectorAll('button[data-k="' + key + '"]')) x.setAttribute('aria-pressed', String(x === b)); show().catch(fail); });
    b.dataset.k = key;
    host.appendChild(b);
  }
}
buttons(document.getElementById('scen'), SCENARIOS, 's');
const opts = document.getElementById('opts');
buttons(opts, ['dark', 'light'], 'theme');
const change = document.createElement('button');
change.type = 'button';
change.textContent = 'simulate a data change';
change.addEventListener('click', () => {
  const s = { ...current.states };
  const id = 'sensor.ecco_intel_pv_tomorrow';
  if (s[id]) s[id] = { ...s[id], state: (Number(s[id].state) + 1).toFixed(1), last_updated: iso(Date.now()), last_changed: iso(Date.now()) };
  current.states = s;
  el.hass = { states: s, locale: { language: 'en-GB' }, themes: { darkMode: state.theme === 'dark' } };
  log('hass.states replaced: Solar tomorrow changed. The summary, tiles, rows and the demo advice card all follow the same snapshot.');
});
opts.appendChild(change);
function fail(e) { const p = document.getElementById('err'); p.hidden = false; p.textContent = String(e && e.stack ? e.stack : e); }
window.onerror = (m) => fail(m);
show().catch(fail);
</script>
</body>
</html>
