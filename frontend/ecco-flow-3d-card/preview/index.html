<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ECCO 3D Energy Flow preview</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #05080f;
        font-family: "Segoe UI", Roboto, system-ui, sans-serif;
        color: #c8d2e6;
      }
      ha-card {
        display: block;
      }
      .frame {
        max-width: var(--frame, 430px);
        margin: 0 auto;
        padding: 16px 12px 40px;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 10px 12px;
        font-size: 12px;
        border-bottom: 1px solid #1a2233;
        position: sticky;
        top: 0;
        background: #05080fdd;
        backdrop-filter: blur(6px);
        z-index: 2;
      }
      .bar a,
      .bar button {
        color: #9fb4d9;
        text-decoration: none;
        border: 1px solid #243049;
        border-radius: 999px;
        padding: 4px 10px;
        background: #0b1220;
        font: inherit;
        cursor: pointer;
      }
      .bar a.on {
        color: #fff;
        border-color: #5aa9ff;
      }
      .bar.hidden {
        display: none;
      }
      .note {
        font-size: 11px;
        color: #6f7f9c;
        padding: 8px 12px 0;
        text-align: center;
      }
    </style>
    <!-- The built card bundle: the same file Home Assistant would load as a Lovelace resource. -->
    <script type="module" src="../dist/ecco-flow-3d-card.js"></script>
  </head>
  <body>
    <nav class="bar" id="bar"></nav>
    <div class="frame" id="frame"></div>
    <div class="note" id="note"></div>
    <script type="module">
      import { buildStates, SCENARIOS } from "./mock.js";

      const params = new URLSearchParams(location.search);
      const scenario = params.get("s") ?? "day-export";
      const width = params.get("w");
      const chrome = params.get("chrome") !== "0";
      if (width) document.documentElement.style.setProperty("--frame", `${width}px`);

      const bar = document.getElementById("bar");
      if (!chrome) {
        bar.classList.add("hidden");
        document.getElementById("frame").style.margin = "0";
      }
      for (const s of SCENARIOS) {
        const a = document.createElement("a");
        a.href = `?s=${s}${width ? `&w=${width}` : ""}`;
        a.textContent = s;
        if (s === scenario) a.classList.add("on");
        bar.appendChild(a);
      }
      for (const w of [360, 430, 600, 900, 1200]) {
        const a = document.createElement("a");
        a.href = `?s=${scenario}&w=${w}`;
        a.textContent = `${w}px`;
        if (String(w) === width) a.classList.add("on");
        bar.appendChild(a);
      }

      // The ECCO example configuration, loaded from examples/ecco-example.yaml
      // through a deliberately small YAML subset parser (maps, lists, scalars,
      // comments) so the preview exercises the SAME file a user would paste.
      const yaml = await (await fetch("../examples/ecco-example.yaml")).text();
      const config = parseYaml(yaml);

      await customElements.whenDefined("ecco-flow-3d-card");
      const card = document.createElement("ecco-flow-3d-card");
      card.setConfig(config);
      card.hass = { states: buildStates(scenario) };
      card.addEventListener("hass-more-info", (e) => {
        document.getElementById("note").textContent = `more-info requested for ${e.detail.entityId} (Home Assistant would open its dialogue here)`;
      });
      document.getElementById("frame").appendChild(card);
      window.__eccoCard = card;
      window.__eccoScenario = (name) => {
        card.hass = { states: buildStates(name) };
      };

      function parseYaml(text) {
        const lines = text.split(/\r?\n/).filter((l) => l.trim() !== "" && !l.trim().startsWith("#"));
        let i = 0;
        const indentOf = (l) => l.match(/^ */)[0].length;
        const scalar = (v) => {
          v = v.trim();
          if (/^".*"$/.test(v)) return v.slice(1, -1);
          if (v === "true") return true;
          if (v === "false") return false;
          if (/^-?\d+(\.\d+)?$/.test(v)) return Number(v);
          return v;
        };
        const parseBlock = (indent) => {
          const first = lines[i];
          if (first === undefined) return null;
          if (first.trim().startsWith("- ")) {
            const arr = [];
            while (i < lines.length && indentOf(lines[i]) === indent && lines[i].trim().startsWith("- ")) {
              const content = lines[i].trim().slice(2);
              if (content.includes(": ") || content.endsWith(":")) {
                // Object item: rewrite the first line as a map line at indent + 2.
                lines[i] = " ".repeat(indent + 2) + content;
                arr.push(parseBlock(indent + 2));
              } else {
                arr.push(scalar(content));
                i++;
              }
            }
            return arr;
          }
          const obj = {};
          while (i < lines.length && indentOf(lines[i]) === indent && !lines[i].trim().startsWith("- ")) {
            const line = lines[i].trim();
            const m = line.match(/^([^:]+):\s*(.*)$/);
            if (!m) throw new Error(`Unparsable line: ${line}`);
            const key = m[1].trim();
            const rest = m[2].replace(/\s+#.*$/, "");
            i++;
            if (rest === "") {
              const next = lines[i];
              if (next !== undefined && indentOf(next) > indent) obj[key] = parseBlock(indentOf(next));
              else obj[key] = null;
            } else {
              obj[key] = scalar(rest);
            }
          }
          return obj;
        };
        return parseBlock(0);
      }
    </script>
  </body>
</html>
