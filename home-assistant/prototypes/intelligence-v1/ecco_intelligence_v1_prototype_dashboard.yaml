# ECCO Intelligence V1 - PROTOTYPE DASHBOARD (LOCAL ONLY, NOT DEPLOYED)
#
# A standalone dashboard file with ONE view, "Intelligence V1", styled with the production ECCO dashboard's own
# button-card templates, colours and card types (button-card, apexcharts-card, heading badges). It is NOT the
# production dashboard: it is not referenced by deployment/ha-manifest.yaml, not under home-assistant/dashboards/,
# and nothing in this repo deploys it. To preview it later the owner would add it as a SEPARATE YAML dashboard
# (e.g. /config/ecco/dashboards/ecco_intelligence_v1_prototype.yaml) - never by editing ecco_pro.yaml.
#
# ABSOLUTELY READ-ONLY: every card has tap_action none or more-info. There is no call-service, no button.press, no
# switch/script/automation reference. The only 'Apply' control is a DISABLED HTML button with a caption.
#
# DATA
#   ACTUAL      real, existing ECCO entities (sensor.ecco_battery_soc, sensor.ecco_house_power, sensor.ecco_pv_power,
#               sensor.ecco_grid_power, sensor.ecco_clock_dongle_ecco_battery_output_power, tariff and forecast
#               helpers from home-assistant/packages/ecco_pro.yaml, input_number.ecco_minimum_reserve_soc).
#   PREDICTED / RECOMMENDED / CONFIDENCE / accuracy
#               sensor.ecco_intelligence_{status,predicted,recommended,trajectory,accuracy}: DO NOT EXIST in production.
#               home-assistant/prototypes/intelligence-v1/ecco_intelligence_v1_mock_package.yaml defines them as
#               template sensors holding a FROZEN engine report (synthetic household) (generated by
#               intelligence/tools/render_ha_prototype.py). Because the sample is frozen, the trajectory and
#               accuracy charts are time-shifted in the browser so the sample starts at "now"; this is labelled
#               on screen ("FROZEN SAMPLE").
#
# Cards that need custom integrations already used by the production dashboard: button-card, apexcharts-card.

button_card_templates:
  ecco_stat:
    section_mode: true
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    styles:
      card:
        - border-radius: 18px
        - padding: 18px
        - background: linear-gradient(145deg, rgba(20,28,45,0.98), rgba(10,15,27,0.98))
        - border: 1px solid rgba(255,255,255,0.08)
        - box-shadow: 0 10px 30px rgba(0,0,0,0.22)
      grid:
        - grid-template-areas: '"i n" "i s" "i l"'
        - grid-template-columns: 54px 1fr
        - grid-template-rows: min-content min-content 1fr
        - column-gap: 14px
      img_cell:
        - justify-self: start
        - align-self: start
        - width: 46px
        - height: 46px
        - border-radius: 14px
      icon:
        - width: 30px
      name:
        - justify-self: start
        - align-self: end
        - font-size: 13px
        - font-weight: 700
        - color: rgba(255,255,255,0.92)
      state:
        - justify-self: start
        - font-size: 32px
        - font-weight: 700
        - letter-spacing: -0.5px
      label:
        - justify-self: start
        - font-size: 11px
        - font-weight: 500
        - color: rgba(255,255,255,0.60)

  # Block card: one icon + title row, then a free-form HTML body in custom_fields.body
  ecco_intel_block:
    section_mode: true
    show_icon: true
    show_name: true
    show_state: false
    tap_action:
      action: none
    styles:
      card:
        - border-radius: 18px
        - padding: 18px
        - background: linear-gradient(145deg, rgba(20,28,45,0.98), rgba(10,15,27,0.98))
        - border: 1px solid rgba(255,255,255,0.08)
        - box-shadow: 0 10px 30px rgba(0,0,0,0.22)
      grid:
        - grid-template-areas: '"i n" "body body"'
        - grid-template-columns: 34px 1fr
        - grid-template-rows: min-content 1fr
        - row-gap: 10px
        - column-gap: 10px
      img_cell:
        - justify-self: start
      icon:
        - width: 24px
      name:
        - justify-self: start
        - font-size: 13px
        - font-weight: 800
        - letter-spacing: 0.6px
        - text-transform: uppercase
      custom_fields:
        body:
          - justify-self: stretch
          - font-size: 12px
          - line-height: 1.55
          - color: rgba(255,255,255,0.78)

views:
  - title: Intelligence V1
    path: ecco-intelligence-v1-prototype
    icon: mdi:brain
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      # ------------------------------------------------------------------------------------------------ header
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: ECCO Pro • Intelligence V1 (SHADOW PROTOTYPE)
            heading_style: title
            icon: mdi:brain
            badges:
              - type: entity
                entity: sensor.ecco_intelligence_status
                name: Model
                show_state: true
              - type: entity
                entity: sensor.ecco_supervision_status
                name: Supervision
                show_state: true
                color: green
              - type: entity
                entity: binary_sensor.ecco_clock_dongle_telemetry_online
                name: Telemetry
                show_state: true
                color: green
            grid_options:
              columns: 48
              rows: auto

          # ---- SHADOW banner + learning state ----
          - type: custom:button-card
            section_mode: true
            name: SHADOW MODE
            icon: mdi:shield-lock-outline
            show_name: true
            show_icon: true
            show_state: false
            tap_action:
              action: none
            grid_options:
              columns: 48
              rows: auto
            styles:
              card:
                - border-radius: 18px
                - padding: 14px 18px
                - background: linear-gradient(145deg, rgba(60,44,12,0.55), rgba(20,16,8,0.7))
                - border: 1px solid rgba(255,189,61,0.45)
              grid:
                - grid-template-areas: '"i n" "i detail"'
                - grid-template-columns: 38px 1fr
                - column-gap: 12px
              icon:
                - color: '#ffbd3d'
                - width: 28px
              name:
                - justify-self: start
                - font-size: 15px
                - font-weight: 800
                - letter-spacing: 0.8px
                - color: '#ffbd3d'
              custom_fields:
                detail:
                  - justify-self: stretch
                  - font-size: 12px
                  - line-height: 1.6
                  - color: rgba(255,255,255,0.8)
            custom_fields:
              detail: >
                [[[
                  const st = states['sensor.ecco_intelligence_status'];
                  const a = st?.attributes ?? {};
                  if (!st) {
                    return `<b>ECCO Intelligence is not running.</b> This prototype needs the five
                      sensor.ecco_intelligence_* sensors (see ecco_intelligence_v1_mock_package.yaml).`;
                  }
                  const label = {
                    LEARNING_NORMALLY: ['Learning normally', '#39d27a'],
                    LEARNING: ['Learning (limited history)', '#7ab8ff'],
                    INSUFFICIENT_HISTORY: ['Insufficient history: retaining battery', '#ff6376'],
                    ABNORMAL_DAY: ['Abnormal day detected', '#ffbd3d'],
                    DATA_STALE: ['Data stale: advice withheld', '#ff6376'],
                    PV_UNDERPERFORMING: ['PV underperforming forecast', '#ffbd3d']
                  }[st.state] ?? [st.state, '#7ab8ff'];
                  const conf = a.confidence ?? {};
                  const when = a.generated_for ? new Date(a.generated_for) : null;
                  const whenTxt = when ? when.toLocaleString([], {weekday:'short', hour:'2-digit', minute:'2-digit'}) : '--';
                  const frozen = a.frozen_sample
                    ? `<span style="color:#ffbd3d;font-weight:800;"> • FROZEN SAMPLE REPORT (prototype): shown time-shifted to now</span>` : '';
                  return `<b>Advice only. Nothing is applied.</b> ECCO Intelligence never writes to the inverter; the
                    deterministic ESP safety layer stays in charge. Nothing is ever advised below the Minimum Battery Reserve (default 40%, set per installation).<br>
                    <span style="display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:4px 10px;
                      border-radius:999px;background:${label[1]}1f;border:1px solid ${label[1]}55;color:${label[1]};
                      font-weight:700;">
                      <span style="width:8px;height:8px;border-radius:50%;background:${label[1]};"></span>${label[0]}</span>
                    <span style="margin-left:8px;color:rgba(255,255,255,0.6);">
                      confidence <b>${conf.label ?? '--'}</b> (${conf.overall ?? '--'}) • history ${conf.history_days ?? '--'} days •
                      model ${a.model_version ?? '--'} • report for ${whenTxt}</span>${frozen}`;
                ]]]

          # ---- ECCO expects ... (sentences built from the report, never hard-coded) ----
          - type: custom:button-card
            section_mode: true
            name: ECCO expects...
            icon: mdi:crystal-ball
            show_name: true
            show_icon: true
            show_state: false
            tap_action:
              action: none
            grid_options:
              columns: 48
              rows: auto
            styles:
              card:
                - border-radius: 18px
                - padding: 18px
                - background: linear-gradient(145deg, rgba(34,24,56,0.9), rgba(12,12,27,0.98))
                - border: 1px dashed rgba(179,108,255,0.55)
              grid:
                - grid-template-areas: '"i n" "body body"'
                - grid-template-columns: 38px 1fr
                - row-gap: 8px
              icon:
                - color: '#b36cff'
                - width: 28px
              name:
                - justify-self: start
                - font-size: 17px
                - font-weight: 800
              custom_fields:
                body:
                  - justify-self: stretch
                  - font-size: 14px
                  - line-height: 1.7
            custom_fields:
              body: >
                [[[
                  const A = (id) => states[id]?.attributes ?? {};
                  const f = A('sensor.ecco_intelligence_predicted').forecasts ?? {};
                  const rec = A('sensor.ecco_intelligence_recommended');
                  const pv = A('sensor.ecco_intelligence_predicted').pv_days ?? {};
                  const tgt = rec.target ?? {};
                  const ps = rec.predicted_soc ?? {};
                  const sx = rec.safe_export ?? {};
                  const insufficient = (A('sensor.ecco_intelligence_status').confidence?.label === 'INSUFFICIENT');
                  const hhmm = (iso) => iso ? new Date(iso).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '--';
                  const band = (b) => b ? `<b>${b[1].toFixed(1)} kWh</b> <span style="color:rgba(255,255,255,0.55)">(${b[0].toFixed(1)}–${b[2].toFixed(1)})</span>` : '--';
                  const lines = [];
                  if (f.overnight) lines.push(`Overnight (sunset→sunrise) demand: ${band(f.overnight)}.`);
                  const up = f.to_useful_pv_from_now ?? f.to_useful_pv;
                  if (up) lines.push(`Demand before useful solar: ${band(up)}.`);
                  if (f.day) lines.push(`Whole-day demand: ${band(f.day)}.`);
                  const days = Object.keys(pv).sort();
                  const t = pv[days[days.length - 1]];
                  if (t && t.raw != null && t.ratio != null && !insufficient) lines.push(`Solar tomorrow: provider says ${t.raw.toFixed(0)} kWh, ECCO expects <b>${t.p50.toFixed(0)} kWh</b> (learned ×${t.ratio?.toFixed(2)}).`);
                  if (ps.soc_at_useful_pv_median != null && !insufficient) lines.push(`Battery at useful solar: <b>${Math.round(ps.soc_at_useful_pv_median)}%</b> predicted <span style="color:rgba(255,255,255,0.55)">(if the recommended target is followed)</span>.`);
                  if (tgt.recommended_target_soc_pct != null && insufficient)
                    lines.push(`Not enough history yet: ECCO simply recommends keeping the battery full (<b style="color:#ffbd3d">${tgt.recommended_target_soc_pct}%</b>).`);
                  else if (tgt.recommended_target_soc_pct != null)
                    lines.push(`Recommended overnight target: <b style="color:#ffbd3d">${tgt.recommended_target_soc_pct}%</b> <span style="color:rgba(255,255,255,0.55)">(median case ${tgt.median_case_target_soc_pct}%, pessimistic ${tgt.pessimistic_case_target_soc_pct}%)</span>.`);
                  if (sx.kwh != null && !sx.withheld_because) lines.push(`Safe export now: <b>${sx.kwh.toFixed(1)} kWh</b> while keeping the reserve.`);
                  if (sx.withheld_because) lines.push(`No export advice: ${sx.withheld_because}.`);
                  if (!lines.length) return 'No report available yet.';
                  return lines.map(l => `<div>• ${l}</div>`).join('');
                ]]]

      # --------------------------------------------------------------- ACTUAL / PREDICTED / RECOMMENDED / CONFIDENCE
      - type: grid
        column_span: 4
        cards:
          # ===== ACTUAL (solid cyan: measured values only) =====
          - type: custom:button-card
            template: ecco_intel_block
            name: Actual
            icon: mdi:gauge
            grid_options:
              columns: 12
              rows: auto
            styles:
              card:
                - border: 1px solid rgba(66,170,255,0.55)
              icon:
                - color: '#42aaff'
              name:
                - color: '#42aaff'
            custom_fields:
              body: >
                [[[
                  const n = (id) => Number(states[id]?.state);
                  const ok = (v) => Number.isFinite(v);
                  const kw = (w) => ok(w) ? (w / 1000).toFixed(2) + ' kW' : '--';
                  const soc = n('sensor.ecco_battery_soc');
                  const rows = [
                    ['Battery SOC', ok(soc) ? Math.round(soc) + ' %' : '--'],
                    ['House load', kw(n('sensor.ecco_house_power'))],
                    ['Solar', kw(n('sensor.ecco_pv_power'))],
                    ['Grid (+import / −export)', kw(n('sensor.ecco_grid_power'))],
                    ['Battery (+discharge)', kw(n('sensor.ecco_clock_dongle_ecco_battery_output_power'))],
                    ['Import rate now', ok(n('sensor.ecco_import_rate')) ? n('sensor.ecco_import_rate').toFixed(1) + ' p/kWh' : '--']
                  ];
                  return `<div style="font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:4px;">MEASURED NOW • live sensors</div>` +
                    rows.map(([k, v]) => `<div style="display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.06);padding:3px 0;">
                      <span style="color:rgba(255,255,255,0.6)">${k}</span><b style="color:#fff">${v}</b></div>`).join('');
                ]]]

          # ===== PREDICTED (dashed violet: model output with bands) =====
          - type: custom:button-card
            template: ecco_intel_block
            name: Predicted
            icon: mdi:chart-bell-curve-cumulative
            grid_options:
              columns: 12
              rows: auto
            styles:
              card:
                - border: 1px dashed rgba(179,108,255,0.6)
              icon:
                - color: '#b36cff'
              name:
                - color: '#b36cff'
            custom_fields:
              body: >
                [[[
                  const A = (id) => states[id]?.attributes ?? {};
                  const f = A('sensor.ecco_intelligence_predicted').forecasts ?? {};
                  const pv = A('sensor.ecco_intelligence_predicted').pv_days ?? {};
                  const chip = (l) => ({HIGH:'#39d27a', MEDIUM:'#ffbd3d', LOW:'#ff9d3d', INSUFFICIENT:'#8b93a5'}[l] ?? '#8b93a5');
                  const row = (name, b) => !b ? '' : `<div style="display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(255,255,255,0.06);padding:3px 0;opacity:${b[3]==='INSUFFICIENT'||b[3]==='LOW'?0.55:1}">
                    <span style="color:rgba(255,255,255,0.6)">${name}</span>
                    <span><b>${b[1].toFixed(1)}</b> <span style="color:rgba(255,255,255,0.5)">${b[0].toFixed(1)}–${b[2].toFixed(1)} kWh</span>
                    <span style="color:${chip(b[3])};font-size:10px;font-weight:800">${b[3]}</span></span></div>`;
                  const days = Object.keys(pv).sort();
                  const pvRows = days.filter(d => pv[d].raw != null && pv[d].ratio != null && pv[d].label !== 'INSUFFICIENT').map(d => {
                    const p = pv[d];
                    return `<div style="border-bottom:1px solid rgba(255,255,255,0.06);padding:3px 0;">
                      <span style="color:rgba(255,255,255,0.6)">Solar ${d.slice(5)}</span>
                      <b> ${p.p50.toFixed(0)} kWh</b> <span style="color:rgba(255,255,255,0.5)">(${p.p10.toFixed(0)}–${p.p90.toFixed(0)})</span><br>
                      <span style="font-size:10px;color:rgba(255,255,255,0.5)">${p.source} says ${p.raw?.toFixed(0)} kWh • learned ×${p.ratio?.toFixed(2)}</span></div>`;
                  }).join('');
                  return `<div style="font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:4px;">MODEL OUTPUT • p50 and p10–p90 band</div>` +
                    row('Next hour', f.next_1h) + row('To useful solar', f.to_useful_pv_from_now ?? f.to_useful_pv) +
                    row('Tonight (sun down→up)', f.overnight) + row('Cheap window', f.cheap_window) + row('Whole day', f.day) +
                    row('To next cheap window', f.to_next_cheap) + pvRows;
                ]]]

          # ===== RECOMMENDED (amber, SHADOW tag, disabled Apply) =====
          - type: custom:button-card
            template: ecco_intel_block
            name: Recommended
            icon: mdi:lightbulb-on-outline
            grid_options:
              columns: 12
              rows: auto
            styles:
              card:
                - border: 1px solid rgba(255,189,61,0.6)
              icon:
                - color: '#ffbd3d'
              name:
                - color: '#ffbd3d'
            custom_fields:
              body: >
                [[[
                  const A = (id) => states[id]?.attributes ?? {};
                  const rec = A('sensor.ecco_intelligence_recommended');
                  const tgt = rec.target ?? {};
                  const sx = rec.safe_export ?? {};
                  const ss = rec.saving_session;
                  const insufficient = (A('sensor.ecco_intelligence_status').confidence?.label === 'INSUFFICIENT');
                  const hhmm = (iso) => new Date(iso).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                  const row = (k, v) => `<div style="display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.06);padding:3px 0;">
                    <span style="color:rgba(255,255,255,0.6)">${k}</span><b style="color:#fff">${v}</b></div>`;
                  let out = `<div style="font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:2px;">ADVICE ONLY • SHADOW • not applied</div>
                    <div style="font-size:30px;font-weight:800;color:#ffbd3d;letter-spacing:-0.5px;">${tgt.recommended_target_soc_pct ?? '--'}%
                      <span style="font-size:12px;font-weight:600;color:rgba(255,255,255,0.6)">overnight target</span></div>`;
                  if (insufficient) {
                    out += `<div style="font-size:11px;color:rgba(255,255,255,0.6);margin:4px 0;">Insufficient history: the model's own estimates are not shown. Keep the battery full until ECCO has learned more.</div>`;
                  } else {
                    out += row('Median-case need', (tgt.median_case_target_soc_pct ?? '--') + ' %');
                    out += row('Pessimistic-case need', (tgt.pessimistic_case_target_soc_pct ?? '--') + ' %');
                    out += row('Grid charge (median)', tgt.grid_charge_needed ? (tgt.grid_charge_kwh_median ?? 0).toFixed(1) + ' kWh' : 'not needed');
                  }
                  out += row('Safe export now', sx.withheld_because ? 'withheld' : ((sx.kwh ?? 0).toFixed(1) + ' kWh'));
                  if (sx.withheld_because) out += `<div style="font-size:11px;color:rgba(255,255,255,0.6)">Because ${sx.withheld_because}.</div>`;
                  if ((sx.reduced_for ?? []).length) out += `<div style="font-size:11px;color:#ffbd3d">Reduced for: ${sx.reduced_for.join(', ')}.</div>`;
                  if (ss) out += row('Saving Session', `${hhmm(ss.start)}–${hhmm(ss.end)} ${ss.covered_from_battery_pessimistic ? 'covered' : 'NOT covered'}`);
                  out += `<div style="margin-top:10px;">
                    <button disabled title="Not connected: ECCO Intelligence never writes to the inverter. The deterministic ESP safety layer stays in charge."
                      style="width:100%;padding:9px 10px;border-radius:10px;border:1px dashed rgba(255,255,255,0.25);background:rgba(255,255,255,0.04);
                      color:rgba(255,255,255,0.4);font-weight:700;cursor:not-allowed;">Apply (disabled • shadow only)</button>
                    <div style="font-size:10px;color:rgba(255,255,255,0.45);margin-top:4px;">Not connected: ECCO Intelligence never writes to the inverter.</div></div>`;
                  return out;
                ]]]

          # ===== CONFIDENCE =====
          - type: custom:button-card
            template: ecco_intel_block
            name: Confidence
            icon: mdi:shield-check-outline
            grid_options:
              columns: 12
              rows: auto
            styles:
              card:
                - border: 1px solid rgba(139,147,165,0.5)
              icon:
                - color: '#8b93a5'
              name:
                - color: '#c3cad8'
            custom_fields:
              body: >
                [[[
                  const A = (id) => states[id]?.attributes ?? {};
                  const a = A('sensor.ecco_intelligence_status');
                  const c = a.confidence ?? {};
                  const col = {HIGH:'#39d27a', MEDIUM:'#ffbd3d', LOW:'#ff9d3d', INSUFFICIENT:'#8b93a5'}[c.label] ?? '#8b93a5';
                  const pct = Math.round((c.overall ?? 0) * 100);
                  const issues = [];
                  (a.uncertainty ?? []).forEach(u => issues.push(u.text));
                  (a.notes ?? []).forEach(n => issues.push(n));
                  Object.values(A('sensor.ecco_intelligence_predicted').pv_days ?? {}).forEach(p => (p.notes ?? []).forEach(n => issues.push(n)));
                  const uniq = [...new Set(issues)].slice(0, 5);
                  return `<div style="font-size:11px;color:rgba(255,255,255,0.5);">HOW MUCH TO TRUST THIS</div>
                    <div style="font-size:26px;font-weight:800;color:${col};">${c.label ?? '--'}
                      <span style="font-size:12px;color:rgba(255,255,255,0.6);font-weight:600">${pct}/100</span></div>
                    <div style="height:8px;border-radius:6px;background:rgba(255,255,255,0.08);overflow:hidden;margin:4px 0 8px;">
                      <div style="width:${pct}%;height:100%;background:${col};"></div></div>
                    <div style="display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:11px;">
                      <span style="color:rgba(255,255,255,0.6)">Usage forecast</span><b>${Math.round((c.usage ?? 0)*100)}</b>
                      <span style="color:rgba(255,255,255,0.6)">Solar forecast</span><b>${Math.round((c.pv ?? 0)*100)}</b>
                      <span style="color:rgba(255,255,255,0.6)">Days of history</span><b>${c.history_days ?? '--'}</b></div>
                    ${uniq.length ? '<div style="margin-top:8px;font-size:11px;color:rgba(255,255,255,0.6)">Why not higher:</div>' +
                      uniq.map(t => `<div style="font-size:11px;color:rgba(255,255,255,0.72)">• ${t}</div>`).join('') : ''}`;
                ]]]

      # ------------------------------------------------------------------------------------------- SOC trajectory
      - type: grid
        column_span: 4
        cards:
          - type: custom:apexcharts-card
            section_mode: true
            grid_options:
              columns: 48
              rows: 9
            header:
              show: true
              title: Battery SOC • actual (solid) vs predicted IF the recommended target is followed (dashed) • minimum battery reserve 40% in this sample • FROZEN SAMPLE
              show_states: false
            graph_span: 48h
            span:
              start: hour
              offset: '-12h'
            yaxis:
              - min: 0
                max: 100
                decimals: 0
                apex_config:
                  tickAmount: 5
                  title:
                    text: SOC (%)
            apex_config:
              annotations:
                yaxis:
                  - y: 40
                    borderColor: '#ff6376'
                    strokeDashArray: 0
                    label:
                      text: 'Minimum battery reserve 40% (sample value; default 40%)'
                      style:
                        color: '#fff'
                        background: '#ff6376'
                  - y: 45
                    borderColor: '#ffbd3d'
                    strokeDashArray: 4
                    label:
                      text: 'Comfort margin 45%'
                      position: left
                      style:
                        color: '#000'
                        background: '#ffbd3d'
            all_series_config:
              extend_to: false
            series:
              - entity: sensor.ecco_battery_soc
                name: ACTUAL SOC
                type: line
                color: '#42aaff'
                stroke_width: 3
                extend_to: now
                group_by:
                  func: last
                  duration: 10min
                  fill: last
              - entity: sensor.ecco_intelligence_trajectory
                name: PREDICTED median
                type: line
                color: '#b36cff'
                stroke_width: 3
                show:
                  in_header: false
                data_generator: |
                  const a = entity.attributes ?? {};
                  const pts = a.points ?? [];
                  const st = hass.states['sensor.ecco_intelligence_status']?.attributes ?? {};
                  const shift = st.frozen_sample && st.generated_for ? (Date.now() - new Date(st.generated_for).getTime()) : 0;
                  return pts.map(p => [new Date(p[0]).getTime() + shift, p[1]]);
              - entity: sensor.ecco_intelligence_trajectory
                name: PREDICTED pessimistic path
                type: line
                color: '#b36cff'
                opacity: 0.45
                stroke_width: 1
                show:
                  in_header: false
                data_generator: |
                  const pts = entity.attributes?.points ?? [];
                  const st = hass.states['sensor.ecco_intelligence_status']?.attributes ?? {};
                  const shift = st.frozen_sample && st.generated_for ? (Date.now() - new Date(st.generated_for).getTime()) : 0;
                  return pts.map(p => [new Date(p[0]).getTime() + shift, p[2]]);
              - entity: sensor.ecco_intelligence_trajectory
                name: PREDICTED optimistic path
                type: line
                color: '#b36cff'
                opacity: 0.45
                stroke_width: 1
                show:
                  in_header: false
                data_generator: |
                  const pts = entity.attributes?.points ?? [];
                  const st = hass.states['sensor.ecco_intelligence_status']?.attributes ?? {};
                  const shift = st.frozen_sample && st.generated_for ? (Date.now() - new Date(st.generated_for).getTime()) : 0;
                  return pts.map(p => [new Date(p[0]).getTime() + shift, p[3]]);

      # ------------------------------------------------------------------ why, anomalies, technical detail, accuracy
      - type: grid
        column_span: 4
        cards:
          - type: custom:button-card
            template: ecco_intel_block
            name: Why
            icon: mdi:comment-question-outline
            grid_options:
              columns: 24
              rows: auto
            custom_fields:
              body: >
                [[[
                  const a = states['sensor.ecco_intelligence_status']?.attributes ?? {};
                  const li = (t) => `<div style="padding:2px 0;">• ${t}</div>`;
                  const reasons = (a.reasons ?? []).map(li).join('') || 'No reasons recorded.';
                  const an = (a.anomalies ?? []).map(x => `<div style="padding:5px 8px;margin:3px 0;border-radius:8px;
                    background:${x.severity==='ABNORMAL'?'rgba(255,99,118,0.12)':'rgba(255,189,61,0.08)'};
                    border:1px solid ${x.severity==='ABNORMAL'?'rgba(255,99,118,0.4)':'rgba(255,189,61,0.25)'};">
                    <b>${x.severity}</b> ${x.text}</div>`).join('') || '<div style="color:rgba(255,255,255,0.55)">No unusual load detected.</div>';
                  const unc = (a.uncertainty ?? []).map(u => li(u.text)).join('');
                  const ass = (a.assumptions ?? []).map(li).join('');
                  return `<div style="font-weight:800;margin-bottom:2px;">Reasons</div>${reasons}
                    <div style="font-weight:800;margin:8px 0 2px;">Unusual load</div>${an}
                    ${unc ? '<div style="font-weight:800;margin:8px 0 2px;">Major uncertainty factors</div>' + unc : ''}
                    <details style="margin-top:8px;"><summary style="cursor:pointer;font-weight:700;color:rgba(255,255,255,0.7)">Assumptions</summary>${ass}</details>`;
                ]]]

          - type: custom:button-card
            template: ecco_intel_block
            name: Learning and accuracy
            icon: mdi:school-outline
            grid_options:
              columns: 24
              rows: auto
            custom_fields:
              body: >
                [[[
                  const A = (id) => states[id]?.attributes ?? {};
                  const acc = A('sensor.ecco_intelligence_accuracy');
                  const l7 = acc.last_7_days ?? {};
                  const names = {'load_kwh:day':'Whole-day demand', 'load_kwh:cheap_window':'Cheap-window demand',
                                 'load_kwh:next_1h':'Next hour', 'pv_kwh:day':'Solar (day ahead)'};
                  const rows = Object.keys(names).filter(k => l7[k]).map(k => {
                    const m = l7[k];
                    const cov = m.coverage == null ? '--' : Math.round(m.coverage * 100) + '%';
                    const covBad = m.coverage != null && m.coverage < 0.65;
                    return `<tr><td>${names[k]}</td><td style="text-align:right">${m.mae.toFixed(2)}</td>
                      <td style="text-align:right">${m.bias > 0 ? '+' : ''}${m.bias.toFixed(2)}</td>
                      <td style="text-align:right;color:${covBad ? '#ffbd3d' : 'inherit'}">${cov}${covBad ? ' ▼' : ''}</td><td style="text-align:right">${m.n}</td></tr>`;
                  }).join('');
                  // actual vs predicted, last 14 nights: inline SVG (predicted = dashed band + dot, actual = filled marker, miss = ring)
                  const ser = (acc.series_last_14 ?? {})['load_kwh:day'] ?? [];
                  let svg = '';
                  if (ser.length) {
                    const W = 340, H = 120, pad = 22;
                    const lo = Math.min(...ser.map(s => Math.min(s.lo, s.a))) - 1;
                    const hi = Math.max(...ser.map(s => Math.max(s.hi, s.a))) + 1;
                    const x = (i) => pad + i * (W - 2 * pad) / Math.max(1, ser.length - 1);
                    const y = (v) => H - pad - (v - lo) / (hi - lo) * (H - 2 * pad);
                    const parts = ser.map((s, i) => `
                      <line x1="${x(i)}" x2="${x(i)}" y1="${y(s.hi)}" y2="${y(s.lo)}" stroke="#b36cff" stroke-width="5" stroke-opacity="0.28" stroke-linecap="round"/>
                      <circle cx="${x(i)}" cy="${y(s.p)}" r="3" fill="none" stroke="#b36cff" stroke-width="1.6"/>
                      <rect x="${x(i) - 3.5}" y="${y(s.a) - 3.5}" width="7" height="7" fill="#42aaff" ${s.ok ? '' : 'stroke="#ff6376" stroke-width="2"'}/>`).join('');
                    svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Predicted versus actual whole-day demand, last 14 nights">
                      <text x="2" y="12" fill="rgba(255,255,255,0.5)" font-size="9">kWh/day</text>${parts}
                      <text x="${pad}" y="${H - 4}" fill="rgba(255,255,255,0.5)" font-size="9">older</text>
                      <text x="${W - pad - 18}" y="${H - 4}" fill="rgba(255,255,255,0.5)" font-size="9">latest</text></svg>
                      <div style="font-size:10px;color:rgba(255,255,255,0.55)">◯ predicted + p10–p90 band (violet) • ■ actual (blue) • red outline = outside the band</div>`;
                  }
                  const ins = (acc.insights ?? []).map(t => `<div>• ${t}</div>`).join('') || '<div style="color:rgba(255,255,255,0.55)">No systematic bias found yet.</div>';
                  return `<table style="width:100%;border-collapse:collapse;font-size:11px;">
                    <tr style="color:rgba(255,255,255,0.5)"><th style="text-align:left">Last 7 days</th><th>MAE kWh</th><th>Bias</th><th>In band (goal 80%)</th><th>n</th></tr>${rows}</table>
                    <div style="margin:8px 0 2px;">${svg}</div>
                    <div style="font-weight:800;margin:6px 0 2px;">What I have learned about my own errors</div>${ins}`;
                ]]]

          - type: custom:button-card
            template: ecco_intel_block
            name: Technical detail
            icon: mdi:code-json
            grid_options:
              columns: 48
              rows: auto
            custom_fields:
              body: >
                [[[
                  const A = (id) => states[id]?.attributes ?? {};
                  const st = A('sensor.ecco_intelligence_status');
                  const f = A('sensor.ecco_intelligence_predicted').forecasts ?? {};
                  const rows = Object.keys(f).filter(k => f[k]).map(k => `<tr><td>${k}</td>
                    <td style="text-align:right">${f[k][0]}</td><td style="text-align:right"><b>${f[k][1]}</b></td><td style="text-align:right">${f[k][2]}</td>
                    <td>${f[k][3]}</td><td style="text-align:right">${f[k][4] ?? '--'}</td><td style="text-align:right">${f[k][5] ?? '--'}</td></tr>`).join('');
                  const we = st.weekday_effect ?? {};
                  const rs = st.reserve ?? {};
                  return `<details><summary style="cursor:pointer;font-weight:700;">Forecast table, model and data-quality facts</summary>
                    <table style="width:100%;border-collapse:collapse;font-size:11px;margin-top:6px;">
                      <tr style="color:rgba(255,255,255,0.5)"><th style="text-align:left">forecast</th><th>p10</th><th>p50</th><th>p90</th><th style="text-align:left">label</th><th>n resid.</th><th>coverage</th></tr>${rows}</table>
                    <div style="margin-top:8px;">model <b>${st.model_version}</b> • config <b>${st.config_hash}</b> • mode <b>${st.mode}</b> • applies nothing: <b>${st.applies_nothing}</b></div>
                    <div>Minimum Battery Reserve <b>${rs.user_reserve_pct ?? '--'}%</b> <span style="color:rgba(255,255,255,0.55)">(default 40%)</span> • technical minimum <b>${rs.technical_min_pct ?? '--'}%</b> • effective minimum <b>${st.floor_pct}%</b> • comfort margin to <b>${st.desired_min_pct}%</b></div>
                    ${rs.override_reason ? `<div style="color:#ffbd3d;margin-top:2px;">${rs.override_reason}</div>` : ''}
                    <div>weekday effect material: <b>${we.material}</b> (explains ${we.explained_variance != null ? Math.round(we.explained_variance * 100) : '--'}% of variance)</div>
                    <div style="color:rgba(255,255,255,0.55);margin-top:4px;">HA minimum-reserve helper currently reads
                      <b>${states['input_number.ecco_minimum_reserve_soc']?.state ?? '--'}%</b>; Intelligence takes the highest of your reserve, the technical minimum and that helper (it can only raise the minimum).</div></details>`;
                ]]]
