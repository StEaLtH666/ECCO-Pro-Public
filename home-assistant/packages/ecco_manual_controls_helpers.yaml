automation:
  # ---- ESPHome staging number -> friendly helper (3 field types) ----
  - id: ecco_manual_tou_sync_hhmm_to_time_helper
    alias: "ECCO Manual TOU - sync numeric HHMM staging to time helper"
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id:
          - number.ecco_clock_dongle_manual_slot_1_start_hhmm
          - number.ecco_clock_dongle_manual_slot_2_start_hhmm
          - number.ecco_clock_dongle_manual_slot_3_start_hhmm
          - number.ecco_clock_dongle_manual_slot_4_start_hhmm
          - number.ecco_clock_dongle_manual_slot_5_start_hhmm
          - number.ecco_clock_dongle_manual_slot_6_start_hhmm
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state is not none and trigger.to_state.state not in ['unknown','unavailable'] }}"
    actions:
      - variables:
          slot_num: "{{ trigger.entity_id.split('_slot_')[1].split('_')[0] }}"
          raw: "{{ trigger.to_state.state | int(0) }}"
          hh: "{{ (raw // 100) | int(0) }}"
          mm: "{{ (raw % 100) | int(0) }}"
          target: "input_datetime.ecco_manual_slot_{{ slot_num }}_start_time"
          new_time: "{{ '%02d:%02d:00' | format(hh, mm) }}"
      - condition: template
        value_template: "{{ states(target) != new_time }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: "{{ target }}"
        data:
          time: "{{ new_time }}"

  - id: ecco_manual_tou_sync_power_to_helper
    alias: "ECCO Manual TOU - sync numeric Power staging to box helper"
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id:
          - number.ecco_clock_dongle_manual_slot_1_power
          - number.ecco_clock_dongle_manual_slot_2_power
          - number.ecco_clock_dongle_manual_slot_3_power
          - number.ecco_clock_dongle_manual_slot_4_power
          - number.ecco_clock_dongle_manual_slot_5_power
          - number.ecco_clock_dongle_manual_slot_6_power
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state is not none and trigger.to_state.state not in ['unknown','unavailable'] }}"
    actions:
      - variables:
          slot_num: "{{ trigger.entity_id.split('_slot_')[1].split('_')[0] }}"
          target: "input_number.ecco_manual_slot_{{ slot_num }}_power_staged"
          new_val: "{{ trigger.to_state.state | int(0) }}"
      - condition: template
        value_template: "{{ (states(target) | int(-1)) != new_val }}"
      - action: input_number.set_value
        target:
          entity_id: "{{ target }}"
        data:
          value: "{{ new_val }}"

  - id: ecco_manual_tou_sync_soc_to_helper
    alias: "ECCO Manual TOU - sync numeric Target SOC staging to box helper"
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id:
          - number.ecco_clock_dongle_manual_slot_1_target_soc
          - number.ecco_clock_dongle_manual_slot_2_target_soc
          - number.ecco_clock_dongle_manual_slot_3_target_soc
          - number.ecco_clock_dongle_manual_slot_4_target_soc
          - number.ecco_clock_dongle_manual_slot_5_target_soc
          - number.ecco_clock_dongle_manual_slot_6_target_soc
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state is not none and trigger.to_state.state not in ['unknown','unavailable'] }}"
    actions:
      - variables:
          slot_num: "{{ trigger.entity_id.split('_slot_')[1].split('_')[0] }}"
          target: "input_number.ecco_manual_slot_{{ slot_num }}_soc_staged"
          new_val: "{{ trigger.to_state.state | int(0) }}"
      - condition: template
        value_template: "{{ (states(target) | int(-1)) != new_val }}"
      - action: input_number.set_value
        target:
          entity_id: "{{ target }}"
        data:
          value: "{{ new_val }}"

  # ---- Friendly helper -> ESPHome staging number (3 field types) ----
  - id: ecco_manual_tou_sync_time_helper_to_hhmm
    alias: "ECCO Manual TOU - sync time helper to numeric HHMM staging"
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id:
          - input_datetime.ecco_manual_slot_1_start_time
          - input_datetime.ecco_manual_slot_2_start_time
          - input_datetime.ecco_manual_slot_3_start_time
          - input_datetime.ecco_manual_slot_4_start_time
          - input_datetime.ecco_manual_slot_5_start_time
          - input_datetime.ecco_manual_slot_6_start_time
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state is not none and trigger.to_state.state not in ['unknown','unavailable'] }}"
    actions:
      - variables:
          slot_num: "{{ trigger.entity_id.split('_slot_')[1].split('_')[0] }}"
          hh: "{{ trigger.to_state.attributes.hour | int(0) }}"
          mm: "{{ trigger.to_state.attributes.minute | int(0) }}"
          hhmm: "{{ hh * 100 + mm }}"
          target: "number.ecco_clock_dongle_manual_slot_{{ slot_num }}_start_hhmm"
      # Reject (do not silently round) any time not on a 5-minute
      # boundary: revert the helper to the last valid staged time and
      # stop, so an invalid HHMM never reaches the staging number that
      # apply_manual_slotN reads. Firmware's valid_hhmm() stays the
      # final defence regardless.
      - if:
          - condition: template
            value_template: "{{ (mm % 5) != 0 }}"
        then:
          - variables:
              current_raw: "{{ states(target) | int(0) }}"
              current_hh: "{{ (current_raw // 100) | int(0) }}"
              current_mm: "{{ (current_raw % 100) | int(0) }}"
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ trigger.entity_id }}"
            data:
              time: "{{ '%02d:%02d:00' | format(current_hh, current_mm) }}"
          - stop: "Rejected: TOU start minutes must be a multiple of 5 - helper reverted to the last valid staged time."
      - condition: template
        value_template: "{{ (states(target) | int(-1)) != hhmm }}"
      - action: number.set_value
        target:
          entity_id: "{{ target }}"
        data:
          value: "{{ hhmm }}"

  - id: ecco_manual_tou_sync_power_helper_to_number
    alias: "ECCO Manual TOU - sync Power box helper to numeric staging"
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id:
          - input_number.ecco_manual_slot_1_power_staged
          - input_number.ecco_manual_slot_2_power_staged
          - input_number.ecco_manual_slot_3_power_staged
          - input_number.ecco_manual_slot_4_power_staged
          - input_number.ecco_manual_slot_5_power_staged
          - input_number.ecco_manual_slot_6_power_staged
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state is not none and trigger.to_state.state not in ['unknown','unavailable'] }}"
    actions:
      - variables:
          slot_num: "{{ trigger.entity_id.split('_slot_')[1].split('_')[0] }}"
          target: "number.ecco_clock_dongle_manual_slot_{{ slot_num }}_power"
          new_val: "{{ trigger.to_state.state | int(0) }}"
      - condition: template
        value_template: "{{ (states(target) | int(-1)) != new_val }}"
      - action: number.set_value
        target:
          entity_id: "{{ target }}"
        data:
          value: "{{ new_val }}"

  - id: ecco_manual_tou_sync_soc_helper_to_number
    alias: "ECCO Manual TOU - sync Target SOC box helper to numeric staging"
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id:
          - input_number.ecco_manual_slot_1_soc_staged
          - input_number.ecco_manual_slot_2_soc_staged
          - input_number.ecco_manual_slot_3_soc_staged
          - input_number.ecco_manual_slot_4_soc_staged
          - input_number.ecco_manual_slot_5_soc_staged
          - input_number.ecco_manual_slot_6_soc_staged
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state is not none and trigger.to_state.state not in ['unknown','unavailable'] }}"
    actions:
      - variables:
          slot_num: "{{ trigger.entity_id.split('_slot_')[1].split('_')[0] }}"
          target: "number.ecco_clock_dongle_manual_slot_{{ slot_num }}_target_soc"
          new_val: "{{ trigger.to_state.state | int(0) }}"
      - condition: template
        value_template: "{{ (states(target) | int(-1)) != new_val }}"
      - action: number.set_value
        target:
          entity_id: "{{ target }}"
        data:
          value: "{{ new_val }}"

  - id: ecco_manual_tou_refresh_helpers_on_startup
    alias: "ECCO Manual TOU - refresh friendly helpers on Home Assistant startup"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      # ESPHome entities may briefly read unavailable while the API
      # connection re-establishes after a restart; wait (bounded) for
      # the staging entities to be readable before refreshing, rather
      # than refreshing helpers from placeholder "unavailable" state.
      - wait_template: >
          {{ states('number.ecco_clock_dongle_manual_slot_1_start_hhmm') not in ['unknown', 'unavailable'] and
             states('number.ecco_clock_dongle_manual_slot_6_start_hhmm') not in ['unknown', 'unavailable'] }}
        timeout: "00:03:00"
        continue_on_timeout: true
      - action: script.ecco_refresh_manual_control_helpers

  - id: ecco_manual_tou_refresh_helpers_after_load
    alias: "ECCO Manual TOU - refresh friendly helpers after a Load button is pressed"
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id:
          - button.ecco_clock_dongle_load_current_slot_1_to_manual_staging
          - button.ecco_clock_dongle_load_current_slot_2_to_manual_staging
          - button.ecco_clock_dongle_load_current_slot_3_to_manual_staging
          - button.ecco_clock_dongle_load_current_slot_4_to_manual_staging
          - button.ecco_clock_dongle_load_current_slot_5_to_manual_staging
          - button.ecco_clock_dongle_load_current_slot_6_to_manual_staging
          - button.ecco_clock_dongle_load_all_current_tou_slots_to_manual_staging
    actions:
      # Give the ESPHome staging entities a moment to report their
      # newly-loaded values before pulling them into the helpers.
      - delay: "00:00:02"
      - action: script.ecco_refresh_manual_control_helpers

script:
  ecco_refresh_manual_control_helpers:
    alias: "ECCO Manual Controls - Refresh friendly helpers from live ESPHome staging"
    mode: single
    icon: mdi:refresh
    sequence:
      # Explicit, unconditional pull of the current ESPHome staging
      # values into all 18 friendly helpers (6 start-time, 6 power, 6
      # SOC). Unlike the bidirectional state-triggered automations
      # above (which only fire when a value actually CHANGES after
      # this script runs), this script always re-reads the current
      # ESPHome state regardless of whether it "changed" from HA's
      # point of view - the correct behaviour right after Home
      # Assistant startup (helpers only have their placeholder
      # `initial:` values so far) and right after Load/Load ALL
      # (whose target values may happen to equal what was already
      # staged, in which case no state-changed event would otherwise
      # fire). Still only ever reads the same ESPHome number entities
      # apply_manual_slotN reads - no new write path.
      - repeat:
          for_each: [1, 2, 3, 4, 5, 6]
          sequence:
            - variables:
                n: "{{ repeat.item }}"
                hhmm_source: "number.ecco_clock_dongle_manual_slot_{{ n }}_start_hhmm"
                power_source: "number.ecco_clock_dongle_manual_slot_{{ n }}_power"
                soc_source: "number.ecco_clock_dongle_manual_slot_{{ n }}_target_soc"
            - if:
                - condition: template
                  value_template: "{{ states(hhmm_source) not in ['unknown', 'unavailable', 'none', None] }}"
              then:
                - variables:
                    raw: "{{ states(hhmm_source) | int(0) }}"
                    hh: "{{ (raw // 100) | int(0) }}"
                    mm: "{{ (raw % 100) | int(0) }}"
                - action: input_datetime.set_datetime
                  target:
                    entity_id: "input_datetime.ecco_manual_slot_{{ n }}_start_time"
                  data:
                    time: "{{ '%02d:%02d:00' | format(hh, mm) }}"
            - if:
                - condition: template
                  value_template: "{{ states(power_source) not in ['unknown', 'unavailable', 'none', None] }}"
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "input_number.ecco_manual_slot_{{ n }}_power_staged"
                  data:
                    value: "{{ states(power_source) | int(0) }}"
            - if:
                - condition: template
                  value_template: "{{ states(soc_source) not in ['unknown', 'unavailable', 'none', None] }}"
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "input_number.ecco_manual_slot_{{ n }}_soc_staged"
                  data:
                    value: "{{ states(soc_source) | int(0) }}"
