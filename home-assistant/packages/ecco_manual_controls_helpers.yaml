# ECCO Pro - Manual Controls V1 friendly-input helpers
#
# Presentation-layer helpers only. This file does NOT write Deye
# registers and does NOT touch the manual-write transaction
# architecture - it exists purely so the TOU matrix dashboard can show
# a real 24-hour HH:MM time editor and compact numeric Power/SOC boxes
# instead of raw HHMM integers and long sliders, following the exact
# same input_datetime/input_number(mode: box) + bidirectional-sync-
# automation pattern already proven live by ecco_free_power_schedule.yaml.
#
# Architecture:
#   ESPHome staging entity (authoritative) <-> HA helper (friendly display/edit)
#   number.ecco_clock_dongle_manual_slot_N_start_hhmm  <-> input_datetime.ecco_manual_slot_N_start_time
#   number.ecco_clock_dongle_manual_slot_N_power       <-> input_number.ecco_manual_slot_N_power_staged
#   number.ecco_clock_dongle_manual_slot_N_target_soc  <-> input_number.ecco_manual_slot_N_soc_staged
#
# The ESPHome number entities remain the ONLY thing apply_manual_slotN
# reads when Apply is pressed - these helpers are kept in sync with them
# by the automations below, in both directions:
#   - ESPHome number changes (e.g. "Load Current -> Staging" pressed,
#     or the entity edited directly) -> helper is updated to match.
#   - Helper edited by the user (time picker / numeric box) -> the
#     underlying ESPHome number is set to match, so Apply picks up
#     exactly what the user entered, converted to the register's own
#     HHMM representation. No new Modbus register, no new write path -
#     Apply still only ever reads the same number entities it always did.
#
# Time representation: ECCO firmware stores TOU start times as plain
# 24-hour numeric HHMM (e.g. 530 = 05:30). No AM/PM register or bit has
# ever been identified in this repository's evidence - see
# docs/SMARTDEYE_READONLY_PARITY_AUDIT.md and the capability registry.
# input_datetime with has_time only (no date) is used here purely as a
# convenient native 24-hour-capable time-of-day picker widget; it does
# not imply the inverter has any date/AM-PM concept. Whether the picker
# itself DISPLAYS as 24-hour or 12-hour AM/PM text is controlled by each
# viewer's own Home Assistant profile time-format setting, same as any
# other input_datetime/time entity in HA - this file cannot force that
# at the dashboard-YAML level.
#
# Every sync automation is guarded by a template condition that only
# writes the target when its value would actually change, so a settled
# pair never loops (A changes B, B's new value already matches what A
# would compute, so B's own sync automation has nothing to do).
#
# `initial:` below is NOT an authoritative default - HA requires some
# value at entity-creation time, but on every Home Assistant startup
# (and after "Load Current"/"Load ALL Current TOU Slots -> Staging" is
# pressed) script.ecco_refresh_manual_control_helpers unconditionally
# overwrites every helper from the live ESPHome staging entities. A
# helper only shows its `initial:` value transiently, before that first
# refresh runs; it must never be read as "the current staged value".
#
# 5-minute TOU boundary: input_datetime has no native minute-step, so a
# user can pick a non-5-minute time (e.g. 07:33) in the picker. The
# helper -> ESPHome sync automation below refuses to forward such a
# value into the authoritative staging number - it reverts the helper
# to the last valid staged time and stops, so an invalid time can never
# reach the number entity apply_manual_slotN reads, let alone Modbus.
# Firmware's own valid_hhmm() (mm % 5 == 0, from commit 806a6600) is
# kept unchanged as the final defence either way.

input_datetime:
  ecco_manual_slot_1_start_time:
    name: ECCO Manual Slot 1 Start Time
    has_time: true
    has_date: false
    initial: "00:35:00"
  ecco_manual_slot_2_start_time:
    name: ECCO Manual Slot 2 Start Time
    has_time: true
    has_date: false
    initial: "05:25:00"
  ecco_manual_slot_3_start_time:
    name: ECCO Manual Slot 3 Start Time
    has_time: true
    has_date: false
    initial: "11:05:00"
  ecco_manual_slot_4_start_time:
    name: ECCO Manual Slot 4 Start Time
    has_time: true
    has_date: false
    initial: "12:55:00"
  ecco_manual_slot_5_start_time:
    name: ECCO Manual Slot 5 Start Time
    has_time: true
    has_date: false
    initial: "23:45:00"
  ecco_manual_slot_6_start_time:
    name: ECCO Manual Slot 6 Start Time
    has_time: true
    has_date: false
    initial: "00:25:00"

