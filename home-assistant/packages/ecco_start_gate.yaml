# ECCO Pro - the shared START GATE for Charge Battery (Free Power) and Export to Grid (Dump to Grid), and a GUARDED FREE POWER START
#
# NOT INSTALLED, NOT LIVE-PROVEN. Offline only; see home-assistant/packages/README.md ("Start gate and lease guards").
#
# WHY. The same reserve and hold checks exist four times and Free Power has none, time trust is not read by any start, and the dongle's own Start buttons bypass every Home
# Assistant gate (release gate RG-ST3). Item N2 of the architecture reconciliation asks for ONE start gate for both functions, built only from facts ECCO already has, and a
# start path bound to it. This package is that gate (read only) and a guarded Free Power start, the analogue of the guarded Dump to Grid start
# (ecco_dump_to_grid_guarded_start.yaml). The in-lease END guards are a SEPARATE package (ecco_lease_guards.yaml): each part can be installed or left out on its own.
#
# THE GATE IS SOFT. HA GATES ARE SOFT: the dongle's own Start button (button.ecco_clock_dongle_start_free_power_charge_now, button.ecco_clock_dongle_start_dump_to_grid_now)
# can still be pressed from Home Assistant or by an assistant, past every check in this file, until a firmware gate binds it (a flash, approved separately; item N6). Nothing
# here is a lock: it protects ECCO's own starts and anything wired to it, not an administrator, an assistant or a press of the dongle's own button. THE CARD IS NOT CHANGED IN
# THIS STEP: the Energy Actions card's Free Power Start still presses the dongle's start button directly (and its Dump Start is guarded only where dump_to_grid.guarded_start is
# set); pointing the card's Free Power Start at script.ecco_free_power_start_guarded is a separate card change, with its own approval.
#
# WHAT IT PROVIDES (two template entities, one helper and one script; no automation):
#   binary_sensor.ecco_charge_start_allowed   on only when a Charge Battery (Free Power) start would pass every check below
#   binary_sensor.ecco_export_start_allowed   on only when an Export to Grid (Dump to Grid) start would pass every check below
#   input_number.ecco_grid_import_ceiling_w   the owner's grid-import SAFETY ceiling in watts; no initial value; 0, unknown or unavailable means NO CEILING CONFIGURED
#   script.ecco_free_power_start_guarded      the guarded Free Power start (below): a NEW START PATH BOUND TO THE GATE
# Each gate sensor has two attributes: `reasons` (a list; every blocking cause as "<CODE>: <text>" naming the entity and what it reads, then any "NOTE <CODE>: <text>" that does
# not block, or "ALLOWED: every check passed" first when nothing blocks) and `blocked_by` (the list of the blocking CODES only; empty while the gate is on). The two are produced
# by the same rule block, repeated in the state and in each attribute template, and a static check of the suite proves the repeats are identical.
#
# THE CHECKS, in the order of `blocked_by` (each reads only facts that already exist; nothing here measures anything):
#   Both gates
#     TIME_LEASES, TIME_SCHEDULES   binary_sensor.ecco_time_trusted_for_leases and ..._for_ha_schedules (ecco_time_trust.yaml) must read on
#     TELEMETRY_OFFLINE             binary_sensor.ecco_clock_dongle_telemetry_online must read on
#     CONFIGURATION_OFFLINE         binary_sensor.ecco_clock_dongle_configuration_online must read on
#     TELEMETRY_STALE               sensor.ecco_clock_dongle_last_telemetry_update (the dongle's text, published only after a COMPLETE poll) must be a time, in the firmware's exact
#                                   form YYYY-MM-DD HH:MM:SS, within 300 s of Home Assistant's clock. The proof is the VALUE of the text, never its arrival: Home Assistant resets a state's
#                                   last_changed on a restart and on every reconnect of the dongle's API, so a copy of any age arrives "now". 300 s is thirty missed 10 s polls and equals the
#                                   largest skew the time trust package still calls DEGRADED; a Home Assistant clock that far out can block here as well, which fails safe
#     FREE_POWER_ACTIVE, FREE_POWER_OPERATION, FREE_POWER_SNAPSHOT   the three Free Power flags (a lease, a start or restore in progress, a saved snapshot waiting to be restored: the
#                                   open recovery obligation; no separate lock entity exists today, the durable R12 lock is a firmware item not yet built) must each read off. For Charge Battery
#                                   that is "already running or owed"; for Export to Grid it is "the other function"
#     DUMP_ACTIVE, DUMP_OPERATION, DUMP_SNAPSHOT   the same three for Dump to Grid, read the same way: "the other function" for Charge Battery, "already running or owed" for Export
#     MANUAL_WRITE                  binary_sensor.ecco_clock_dongle_manual_write_in_progress must read off (a manual inverter write holds the inverter write mutex)
#   Export to Grid only: the Stage 3 facts of ecco_plan_helpers.yaml, read exactly as the guarded Dump start and the schedules read them
#     OVERRIDE_ACTIVE, OVERRIDE_UNREADABLE   sensor.ecco_plan_export_hold must read clear (held = a Hold battery, Skip tonight or Prepare for power cut is active; anything else
#                                   than held or clear = the records cannot be read: refused)
#     RESERVE_UNKNOWN, RESERVE_INVALID   sensor.ecco_plan_effective_reserve must be a finite number from 0 to 100, tested as a positive range (a comparison with nan is always false)
#     STOP_SOC_UNREADABLE, STOP_SOC_BELOW_RESERVE   number.ecco_clock_dongle_dump_to_grid_stop_soc, the Stop SOC the next start would request, must be a number from 0 to 100 and not
#                                   below the effective reserve (refused, never changed: the owner sees and sets the staged value)
#     REVISION_UNREADABLE           input_number.ecco_plan_revision must be a whole number from 0 up (the plan's compare-and-set counter; unreadable = the records are not trustworthy)
#   Charge Battery only: the grid-import HEADROOM check, DISABLED until the owner supplies a ceiling
#     input_number.ecco_grid_import_ceiling_w has NO initial value. 0, unknown, unavailable or missing means NO CEILING CONFIGURED: the check then reports NOT_CONFIGURED, does NOT
#     block, and says so in `reasons` ("NOTE IMPORT_NOT_CONFIGURED: ..."). A configured ceiling is a SAFETY ceiling, never a target: it is the most the grid may supply at the
#     moment, it is never aimed at. With a ceiling from 1 to 100000 W the check needs the measured grid import (sensor.ecco_clock_dongle_ecco_grid_power_ct_clamp, the
#     dongle's CT reading, positive = importing) and the staged request (number.ecco_clock_dongle_free_power_max_charge_power), and refuses when
#     request + max(import, 0) > ceiling (IMPORT_HEADROOM). It refuses a value that is not a number from 1 to 100000 (IMPORT_CEILING_INVALID: never "no ceiling"), an unreadable
#     import (IMPORT_UNREADABLE) and an unreadable request (REQUEST_UNREADABLE). NO charger-loss factor and NO margin is applied: none is established (control-authority rung R5
#     measures them), so a request that just fits can still breach by the charger's losses; the in-lease guard in ecco_lease_guards.yaml ends a lease on a measured breach.
#
# FAIL SAFE. Any input that is missing, unavailable, unknown or not a number (or not finite) blocks (the gate reads off) and is NAMED in `reasons`; the one deliberate exception is the
# ceiling helper above, whose unset states mean "no ceiling" by the owner's rule, while a value that cannot be a ceiling blocks. Every template is total: a garbage, missing or huge
# input yields a block, never a template error. A consumer must test is_state('binary_sensor.ecco_charge_start_allowed', 'on') and never "not off" or "not unavailable": an entity
# that does not exist yet, or is unavailable, is not on.
#
# THE GUARDED FREE POWER START (script.ecco_free_power_start_guarded) is the exact analogue of the guarded Dump start, which presses the dongle's start button only after its checks.
# Differences, all stated: (1) it STAGES the request the way the scheduled start does when it is given values (optional fields power_w and duration_minutes; with none it starts
# the request already staged on the dongle, as the card does), and it arms and presses; (2) its checks are the gate above plus the script's own (the effective grid charge
# limit, no scheduled Free Power start running, whole steps), tested again just before the press; (3) it ends the Free Power write enable OFF on every path, as the scheduled start
# does, and tries ONCE: a manual start has no retry loop, the owner presses again.
#   Order: the gate and the script's own checks (a closed gate refuses first, before anything is staged; a gate closed only by the request-dependent codes IMPORT_HEADROOM or
#   REQUEST_UNREADABLE is judged again after an explicit request is staged), stage power then duration (number.set_value, only a value that differs from what is staged), arm (switch.turn_on) and wait up to 5 s for the
#   dongle to confirm the arm and both values, read the gate AGAIN, press the start button once, wait for the dongle's answer, classify it, end the write enable off.
#   Its services are exactly those of the scheduled start and the guarded Dump start: number.set_value on the two request numbers, switch.turn_on and switch.turn_off on the Free
#   Power write enable, button.press on the Free Power start button, input_text.set_value on input_text.ecco_plan_last_result, persistent_notification.create and .dismiss with one
#   fixed id (ecco_free_power_start_blocked). It adds NO helper (the result text is the one the guarded Dump start uses: input_text.ecco_plan_last_result, written "REFUSED <CODE> - <text>"
#   for a refusal, "FAILED <CODE> - <text>" after a press that did not start Free Power and "STARTED free_power ..." on success). It does NOT reuse the Free Power schedule's result text
#   (the last-result helper of the Free Power schedule package): that text belongs to the schedule's own state machine (its status sensor, its retry loop, the R9 recovery and its end-of-run alert
#   read its prefixes) and the start bypass detector reads "STARTED OK - <n>W for <m> min" in it as the PROOF of a SCHEDULED run: a manual start must neither overwrite a scheduled run's
#   outcome nor forge that proof.
#   Refusal codes: GATE_UNREADABLE, GATE_BLOCKED, SCHEDULED_START_RUNNING, LIMIT_UNREADABLE, POWER_INVALID, DURATION_INVALID before anything is staged; GATE_CLOSED,
#   SCHEDULED_START_RUNNING, NOT_CONFIRMED, LIMIT_LOWERED at the press-time check (nothing is pressed); FAILED codes after the press: FIRMWARE_REFUSED (the dongle's own gate refused the
#   press: nothing written), START_FAILED (a start transaction began and Free Power did not become active: the firmware restores its saved snapshot itself) and NO_ANSWER (the dongle did not
#   answer: the outcome is unconfirmed and is never retried).
#
# WHAT IT DOES NOT DO, AND ITS LIMITS (stated plainly; nothing here is a lock).
#   - The start bypass detector (the package of post-export entry bpd1, pinned) knows only the scheduled run's STARTED OK and the guarded Dump start as ECCO's own records of a start. A start made
#     by this script is therefore recorded by the detector as a start with no ECCO record (the incident record and counter are written; a popup is raised only when an override is active or a
#     plan reading is unreadable, as for any Charge Battery start). Teaching the detector about this script is an edit of a pinned package and is NOT made here.
#   - smr1 (ecco_schedule_manual_restore.yaml) puts the owner's request numbers back only after a SCHEDULED start. A start of this script that is given explicit values replaces the owner's
#     staged request on the dongle and nothing restores it; a start with no values changes nothing.
#   - The schedule scripts and the card do not read the gate: nothing is wired to it except this script. The gate says whether a start WOULD pass; it stops nothing by itself.
#   - The grid-import check judges one instant (the house load now plus the request); a load that rises later is the job of the in-lease guard, which is soft too (it presses the End
#     button; it is not a firmware limit, and a dead dongle or a dead Home Assistant ends nothing).
#   - Time-zone assumption: the poll text is the dongle's local time with no offset and is read as local time in Home Assistant's own zone, as in ecco_time_trust.yaml and R9; if the zones
#     differ the text is hours away and the gate blocks (TELEMETRY_STALE, and TIME_LEASES from time trust), never allows.
#   - Recalled from Home Assistant core, NOT verified on a real Home Assistant (the offline model of them is in the suite): that states['<entity id>'] and state_attr() behave as modelled, that a
#     template using now() is re-rendered at the start of each minute, that a list rendered by an attribute template arrives as a list, that a script field that was not given reads as undefined
#     (so default() applies), that button.press is accepted by a button entity that is available, and that the effective grid charge limit and the request numbers read as numbers.
#
# INSTALL. One file copy to /config/packages/ecco_start_gate.yaml, a configuration check, then reload three things, one at a time (Developer tools, YAML): the template entities, the
# input_number helpers and the scripts. No restart. Never "reload all". It needs ecco_time_trust.yaml (the time sensors), ecco_plan_helpers.yaml (the plan sensors and the last-result text) and the
# schedule packages (the scheduled start script it checks); without them the gate reads off and the script refuses (fail closed). It changes no existing entity. Remove: delete the file and
# reload the same three. Nothing here is meant to be exposed to a voice assistant. The lease guards (ecco_lease_guards.yaml) are installed separately and need the owner's separate authorisation.

input_number:
  # The owner's grid-import SAFETY ceiling. No `initial`: a fresh helper reads its minimum, 0, which means "no ceiling configured" (the check is off and says so). Set it to the supply
  # limit (the main fuse or the supply agreement) to switch the Charge Battery headroom check and the in-lease import guard on.
  ecco_grid_import_ceiling_w:
    name: ECCO grid import ceiling (a safety ceiling, never a target; 0 = none configured)
    icon: mdi:transmission-tower-import
    min: 0
    max: 100000
    step: 10
    mode: box
    unit_of_measurement: W

template:
  - binary_sensor:
      - name: ECCO Charge Start Allowed
        unique_id: ecco_charge_start_allowed
        icon: mdi:battery-charging-high
        # on only while a Charge Battery (Free Power) start passes every check of the header. SOFT: the dongle's own Start button is not bound by it.
        state: >-
          {%- set bad = ['unknown', 'unavailable', 'none', ''] -%}
          {%- set tl = states('binary_sensor.ecco_time_trusted_for_leases') -%}
          {%- set ts = states('binary_sensor.ecco_time_trusted_for_ha_schedules') -%}
          {%- set tel = states('binary_sensor.ecco_clock_dongle_telemetry_online') -%}
          {%- set cfg = states('binary_sensor.ecco_clock_dongle_configuration_online') -%}
          {%- set pt = states('sensor.ecco_clock_dongle_last_telemetry_update') -%}
          {%- set pdt = strptime(pt, '%Y-%m-%d %H:%M:%S', none) if pt not in bad else none -%}
          {%- set pskew = ((as_timestamp(now()) - as_timestamp(pdt)) | round(0)) if pdt is not none else none -%}
          {%- set ns = namespace(c=[], b=[], n=[]) -%}
          {%- for code, hit, text in [
          ('TIME_LEASES', tl != 'on', 'binary_sensor.ecco_time_trusted_for_leases reads ' ~ tl ~ ' (it must read on): the dongle NTP time and the Home Assistant clock are not shown to agree, so the end of a lease cannot be relied on'),
          ('TIME_SCHEDULES', ts != 'on', 'binary_sensor.ecco_time_trusted_for_ha_schedules reads ' ~ ts ~ ' (it must read on): the Home Assistant clock is not shown to be right'),
          ('TELEMETRY_OFFLINE', tel != 'on', 'binary_sensor.ecco_clock_dongle_telemetry_online reads ' ~ tel ~ ' (it must read on): the inverter telemetry is not arriving'),
          ('CONFIGURATION_OFFLINE', cfg != 'on', 'binary_sensor.ecco_clock_dongle_configuration_online reads ' ~ cfg ~ ' (it must read on): the inverter configuration readback is not arriving'),
          ('TELEMETRY_STALE', pskew is none or (pskew | abs) > 300, 'sensor.ecco_clock_dongle_last_telemetry_update ' ~ ('cannot be read (' ~ pt ~ ')' if pt in bad else ('is not a time (' ~ pt ~ ')' if pdt is none else 'is ' ~ ((pskew | abs) | int(0)) ~ ' s from the Home Assistant clock (limit 300 s)')) ~ ': the inverter data are not shown to be fresh')
          ] if hit -%}
          {%- set ns.c = ns.c + [code] -%}
          {%- set ns.b = ns.b + [code ~ ': ' ~ text] -%}
          {%- endfor -%}
          {%- for e, code, what in [
          ('binary_sensor.ecco_clock_dongle_free_power_active', 'FREE_POWER_ACTIVE', 'a Free Power lease is running'),
          ('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress', 'FREE_POWER_OPERATION', 'a Free Power start or restore is in progress'),
          ('binary_sensor.ecco_clock_dongle_free_power_snapshot_valid', 'FREE_POWER_SNAPSHOT', 'a saved Free Power snapshot is waiting to be restored'),
          ('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'DUMP_ACTIVE', 'a Dump to Grid lease is running'),
          ('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress', 'DUMP_OPERATION', 'a Dump to Grid start or restore is in progress'),
          ('binary_sensor.ecco_clock_dongle_dump_to_grid_snapshot_valid', 'DUMP_SNAPSHOT', 'a saved Dump to Grid snapshot is waiting to be restored'),
          ('binary_sensor.ecco_clock_dongle_manual_write_in_progress', 'MANUAL_WRITE', 'a manual inverter write is in progress')
          ] -%}
          {%- set v = states(e) -%}
          {%- if v != 'off' -%}
          {%- set ns.c = ns.c + [code] -%}
          {%- set ns.b = ns.b + [code ~ ': ' ~ (e ~ ' reads on: ' ~ what if v == 'on' else e ~ ' reads ' ~ v ~ ', so it is not known whether ' ~ what)] -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set cr = states('input_number.ecco_grid_import_ceiling_w') -%}
          {%- set cf = cr | float(none) -%}
          {%- set c_unset = cr in bad or (cf is number and cf == 0) -%}
          {%- set c_ok = cf is number and cf == cf and cf >= 1 and cf <= 100000 -%}
          {%- set graw = states('sensor.ecco_clock_dongle_ecco_grid_power_ct_clamp') -%}
          {%- set gi = graw | float(none) -%}
          {%- set gi_ok = gi is number and gi == gi and (gi | abs) < 1000000000 -%}
          {%- set rqraw = states('number.ecco_clock_dongle_free_power_max_charge_power') -%}
          {%- set rq = rqraw | float(none) -%}
          {%- set rq_ok = rq is number and rq == rq and rq > 0 and rq < 1000000000 -%}
          {%- set head = (cf - ([gi, 0] | max)) if (c_ok and gi_ok) else none -%}
          {%- for code, hit, text in [
          ('IMPORT_CEILING_INVALID', (not c_unset) and (not c_ok), 'input_number.ecco_grid_import_ceiling_w reads ' ~ cr ~ ', which is not a number from 1 to 100000 W (set it to 0 to switch the import check off)'),
          ('IMPORT_UNREADABLE', c_ok and (not gi_ok), 'sensor.ecco_clock_dongle_ecco_grid_power_ct_clamp reads ' ~ graw ~ ', so the headroom under the grid-import ceiling cannot be checked'),
          ('REQUEST_UNREADABLE', c_ok and (not rq_ok), 'number.ecco_clock_dongle_free_power_max_charge_power reads ' ~ rqraw ~ ', so the staged charge request cannot be compared with the grid-import headroom'),
          ('IMPORT_HEADROOM', c_ok and gi_ok and rq_ok and rq > head, 'the staged charge request (' ~ (rq | int(0)) ~ ' W) does not fit under the grid-import ceiling (' ~ (cf | int(0)) ~ ' W) with the house already importing ' ~ ((([gi, 0] | max) | int(0)) if gi_ok else 0) ~ ' W: the headroom is ' ~ (head | int(0)) ~ ' W')
          ] if hit -%}
          {%- set ns.c = ns.c + [code] -%}
          {%- set ns.b = ns.b + [code ~ ': ' ~ text] -%}
          {%- endfor -%}
          {%- if c_unset -%}
          {%- set ns.n = ns.n + ['NOTE IMPORT_NOT_CONFIGURED: no grid-import ceiling is configured (input_number.ecco_grid_import_ceiling_w reads ' ~ cr ~ '), so no import headroom is checked and none can block; set it to the supply limit to switch the check on'] -%}
          {%- endif -%}
          {{ (ns.c | length) == 0 }}
        attributes:
          reasons: >-
            {%- set bad = ['unknown', 'unavailable', 'none', ''] -%}
            {%- set tl = states('binary_sensor.ecco_time_trusted_for_leases') -%}
            {%- set ts = states('binary_sensor.ecco_time_trusted_for_ha_schedules') -%}
            {%- set tel = states('binary_sensor.ecco_clock_dongle_telemetry_online') -%}
            {%- set cfg = states('binary_sensor.ecco_clock_dongle_configuration_online') -%}
            {%- set pt = states('sensor.ecco_clock_dongle_last_telemetry_update') -%}
            {%- set pdt = strptime(pt, '%Y-%m-%d %H:%M:%S', none) if pt not in bad else none -%}
            {%- set pskew = ((as_timestamp(now()) - as_timestamp(pdt)) | round(0)) if pdt is not none else none -%}
            {%- set ns = namespace(c=[], b=[], n=[]) -%}
            {%- for code, hit, text in [
            ('TIME_LEASES', tl != 'on', 'binary_sensor.ecco_time_trusted_for_leases reads ' ~ tl ~ ' (it must read on): the dongle NTP time and the Home Assistant clock are not shown to agree, so the end of a lease cannot be relied on'),
            ('TIME_SCHEDULES', ts != 'on', 'binary_sensor.ecco_time_trusted_for_ha_schedules reads ' ~ ts ~ ' (it must read on): the Home Assistant clock is not shown to be right'),
            ('TELEMETRY_OFFLINE', tel != 'on', 'binary_sensor.ecco_clock_dongle_telemetry_online reads ' ~ tel ~ ' (it must read on): the inverter telemetry is not arriving'),
            ('CONFIGURATION_OFFLINE', cfg != 'on', 'binary_sensor.ecco_clock_dongle_configuration_online reads ' ~ cfg ~ ' (it must read on): the inverter configuration readback is not arriving'),
            ('TELEMETRY_STALE', pskew is none or (pskew | abs) > 300, 'sensor.ecco_clock_dongle_last_telemetry_update ' ~ ('cannot be read (' ~ pt ~ ')' if pt in bad else ('is not a time (' ~ pt ~ ')' if pdt is none else 'is ' ~ ((pskew | abs) | int(0)) ~ ' s from the Home Assistant clock (limit 300 s)')) ~ ': the inverter data are not shown to be fresh')
            ] if hit -%}
            {%- set ns.c = ns.c + [code] -%}
            {%- set ns.b = ns.b + [code ~ ': ' ~ text] -%}
            {%- endfor -%}
            {%- for e, code, what in [
            ('binary_sensor.ecco_clock_dongle_free_power_active', 'FREE_POWER_ACTIVE', 'a Free Power lease is running'),
            ('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress', 'FREE_POWER_OPERATION', 'a Free Power start or restore is in progress'),
            ('binary_sensor.ecco_clock_dongle_free_power_snapshot_valid', 'FREE_POWER_SNAPSHOT', 'a saved Free Power snapshot is waiting to be restored'),
            ('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'DUMP_ACTIVE', 'a Dump to Grid lease is running'),
            ('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress', 'DUMP_OPERATION', 'a Dump to Grid start or restore is in progress'),
            ('binary_sensor.ecco_clock_dongle_dump_to_grid_snapshot_valid', 'DUMP_SNAPSHOT', 'a saved Dump to Grid snapshot is waiting to be restored'),
            ('binary_sensor.ecco_clock_dongle_manual_write_in_progress', 'MANUAL_WRITE', 'a manual inverter write is in progress')
            ] -%}
            {%- set v = states(e) -%}
            {%- if v != 'off' -%}
            {%- set ns.c = ns.c + [code] -%}
            {%- set ns.b = ns.b + [code ~ ': ' ~ (e ~ ' reads on: ' ~ what if v == 'on' else e ~ ' reads ' ~ v ~ ', so it is not known whether ' ~ what)] -%}
            {%- endif -%}
            {%- endfor -%}
            {%- set cr = states('input_number.ecco_grid_import_ceiling_w') -%}
            {%- set cf = cr | float(none) -%}
            {%- set c_unset = cr in bad or (cf is number and cf == 0) -%}
            {%- set c_ok = cf is number and cf == cf and cf >= 1 and cf <= 100000 -%}
            {%- set graw = states('sensor.ecco_clock_dongle_ecco_grid_power_ct_clamp') -%}
            {%- set gi = graw | float(none) -%}
            {%- set gi_ok = gi is number and gi == gi and (gi | abs) < 1000000000 -%}
            {%- set rqraw = states('number.ecco_clock_dongle_free_power_max_charge_power') -%}
            {%- set rq = rqraw | float(none) -%}
            {%- set rq_ok = rq is number and rq == rq and rq > 0 and rq < 1000000000 -%}
            {%- set head = (cf - ([gi, 0] | max)) if (c_ok and gi_ok) else none -%}
            {%- for code, hit, text in [
            ('IMPORT_CEILING_INVALID', (not c_unset) and (not c_ok), 'input_number.ecco_grid_import_ceiling_w reads ' ~ cr ~ ', which is not a number from 1 to 100000 W (set it to 0 to switch the import check off)'),
            ('IMPORT_UNREADABLE', c_ok and (not gi_ok), 'sensor.ecco_clock_dongle_ecco_grid_power_ct_clamp reads ' ~ graw ~ ', so the headroom under the grid-import ceiling cannot be checked'),
            ('REQUEST_UNREADABLE', c_ok and (not rq_ok), 'number.ecco_clock_dongle_free_power_max_charge_power reads ' ~ rqraw ~ ', so the staged charge request cannot be compared with the grid-import headroom'),
            ('IMPORT_HEADROOM', c_ok and gi_ok and rq_ok and rq > head, 'the staged charge request (' ~ (rq | int(0)) ~ ' W) does not fit under the grid-import ceiling (' ~ (cf | int(0)) ~ ' W) with the house already importing ' ~ ((([gi, 0] | max) | int(0)) if gi_ok else 0) ~ ' W: the headroom is ' ~ (head | int(0)) ~ ' W')
            ] if hit -%}
            {%- set ns.c = ns.c + [code] -%}
            {%- set ns.b = ns.b + [code ~ ': ' ~ text] -%}
            {%- endfor -%}
            {%- if c_unset -%}
            {%- set ns.n = ns.n + ['NOTE IMPORT_NOT_CONFIGURED: no grid-import ceiling is configured (input_number.ecco_grid_import_ceiling_w reads ' ~ cr ~ '), so no import headroom is checked and none can block; set it to the supply limit to switch the check on'] -%}
            {%- endif -%}
            {{ (ns.b + ns.n) if (ns.c | length) > 0 else (['ALLOWED: every check passed'] + ns.n) }}
          blocked_by: >-
            {%- set bad = ['unknown', 'unavailable', 'none', ''] -%}
