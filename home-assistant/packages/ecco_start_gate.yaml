script:
  ecco_free_power_start_guarded:
    alias: "ECCO - Start Free Power (Charge Battery), guarded by the start gate"
    description: >-
      Presses the Free Power start button only while binary_sensor.ecco_charge_start_allowed reads on (and again, just before the press). With power_w or
      duration_minutes it first stages that request, as the scheduled start does; with neither it starts the request already staged on the dongle. It arms
      the Free Power write enable, presses the start button once and always ends the write enable off. A refusal presses nothing, writes the plan
      last-result text and raises ONE persistent notification. The firmware still owns every start interlock.
    mode: single
    fields:
      power_w:
        description: "Optional: the charge request in watts to stage (a multiple of 100 from 500 to the effective grid charge limit). Omit it to start the request already staged on the dongle."
      duration_minutes:
        description: "Optional: the duration in whole minutes to stage (1 to 240). Omit it to start the duration already staged on the dongle."
    sequence:
      - variables:
          gate_state: "{{ states('binary_sensor.ecco_charge_start_allowed') }}"
          gate_codes: "{{ state_attr('binary_sensor.ecco_charge_start_allowed', 'blocked_by') }}"
          gate_text: "{{ state_attr('binary_sensor.ecco_charge_start_allowed', 'reasons') }}"
          scheduled_state: "{{ states('script.ecco_free_power_start_scheduled') }}"
          # A value that was not given reads as undefined; an empty one counts as not given.
          power_given: "{{ (power_w | default('') | string | trim) != '' }}"
          duration_given: "{{ (duration_minutes | default('') | string | trim) != '' }}"
          # The request numbers on the dongle, the effective grid charge limit and a request that is given: each a number from 0 up, or -1 (cannot be read, not a number, nan, infinite or
          # negative). Nothing below compares or prints a bad number: the offline interpreter keeps nan and infinity as text, so every comparison with one would raise.
          staged_power: >-
            {%- set x = states('number.ecco_clock_dongle_free_power_max_charge_power') | float(-1) -%}
            {{ x if (x >= 0 and x <= 1000000) else -1 }}
          staged_duration: >-
            {%- set x = states('number.ecco_clock_dongle_free_power_duration') | float(-1) -%}
            {{ x if (x >= 0 and x <= 1000000) else -1 }}
          limit: >-
            {%- set x = states('sensor.ecco_config_maximum_grid_charge_power') | float(-1) -%}
            {{ x if (x >= 0 and x <= 1000000) else -1 }}
          req_power: >-
            {%- set x = (power_w | default('') | string | trim) | float(-1) -%}
            {{ (x if (x >= 0 and x <= 1000000) else -1) if power_given else staged_power }}
          req_duration: >-
            {%- set x = (duration_minutes | default('') | string | trim) | float(-1) -%}
            {{ (x if (x >= 0 and x <= 1000000) else -1) if duration_given else staged_duration }}
          power_shown: "{{ (power_w | default('') | string | trim) if power_given else (staged_power | int(0)) }}"
          duration_shown: "{{ (duration_minutes | default('') | string | trim) if duration_given else (staged_duration | int(0)) }}"
          # The gate closed ONLY by a code that depends on the request is judged again after an explicit request is staged: the gate reads the staged request.
          gate_deferrable: >-
            {{ gate_state == 'off' and power_given and req_power != staged_power and gate_codes is iterable and gate_codes is not string and (gate_codes | length) > 0
               and (gate_codes | reject('in', ['IMPORT_HEADROOM', 'REQUEST_UNREADABLE']) | list | length) == 0 }}
          gate_detail: >-
            {{ (gate_text | join(' ')) if (gate_text is iterable and gate_text is not string) else 'the reasons cannot be read' }}
          gate_code_list: >-
            {{ (gate_codes | join(', ')) if (gate_codes is iterable and gate_codes is not string) else 'unreadable' }}
          refusal: >-
            {%- if gate_state not in ['on', 'off'] -%}GATE_UNREADABLE|The start gate (binary_sensor.ecco_charge_start_allowed) cannot be read ({{ gate_state }}), so Charge Battery was not started (it fails closed).
            {%- elif gate_state == 'off' and not gate_deferrable -%}GATE_BLOCKED|The start gate is closed ({{ gate_code_list }}), so Charge Battery was not started. {{ gate_detail }}
            {%- elif scheduled_state != 'off' -%}SCHEDULED_START_RUNNING|A scheduled Free Power start is running or cannot be read ({{ scheduled_state }}), so Charge Battery was not started; wait for it to finish.
            {%- elif not (limit >= 500 and limit <= 100000) -%}LIMIT_UNREADABLE|The effective grid charge limit cannot be read, so Charge Battery was not started (it fails closed).
            {%- elif not (req_power >= 500 and req_power <= limit and (req_power % 100) == 0) -%}POWER_INVALID|The charge request ({{ power_shown }} W) must be a multiple of 100 W from 500 W up to the effective grid charge limit ({{ limit | int(0) }} W), so Charge Battery was not started.
            {%- elif not (req_duration >= 1 and req_duration <= 240 and (req_duration % 1) == 0) -%}DURATION_INVALID|The duration ({{ duration_shown }} min) must be a whole number of minutes from 1 to 240, so Charge Battery was not started.
            {%- endif -%}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ refusal | trim != '' }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.ecco_plan_last_result
                data:
                  value: "{{ ('REFUSED ' ~ refusal.split('|')[0] ~ ' - ' ~ refusal.split('|')[1])[:250] }}"
              - action: persistent_notification.create
                data:
                  notification_id: ecco_free_power_start_blocked
                  title: "ECCO: Charge Battery (Free Power) was not started"
                  message: "{{ refusal.split('|')[1] }} (reason {{ refusal.split('|')[0] }})"
        default:
          # Stage the request the way the scheduled start does: the power, then the duration, only a value that differs from what is staged.
          - if:
              - condition: template
                value_template: "{{ req_power != staged_power }}"
            then:
              - action: number.set_value
                continue_on_error: true
                target:
                  entity_id: number.ecco_clock_dongle_free_power_max_charge_power
                data:
                  value: "{{ req_power | int(0) }}"
          - if:
              - condition: template
                value_template: "{{ req_duration != staged_duration }}"
            then:
              - action: number.set_value
                continue_on_error: true
                target:
                  entity_id: number.ecco_clock_dongle_free_power_duration
                data:
                  value: "{{ req_duration | int(0) }}"
          - action: switch.turn_on
            continue_on_error: true
            target:
              entity_id: switch.ecco_clock_dongle_free_power_write_enable
          # Press only once the dongle has confirmed the arm and both staged values.
          - wait_template: >-
              {{ is_state('switch.ecco_clock_dongle_free_power_write_enable', 'on')
                 and (states('number.ecco_clock_dongle_free_power_duration') | float(-1)) == (req_duration | float(-2))
                 and (states('number.ecco_clock_dongle_free_power_max_charge_power') | float(-1)) == (req_power | float(-2)) }}
            timeout: "00:00:05"
            continue_on_timeout: true
          - delay:
              seconds: 1
          # Press-time check: the gate is read AGAIN (this run staged and waited since it read it, and an explicit request is only now what the gate reads), then the script's own
          # conditions. press_block is empty (press) or "CODE|text" (nothing is pressed).
          - variables:
              press_block: >-
                {%- set g = states('binary_sensor.ecco_charge_start_allowed') -%}
                {%- if g != 'on' -%}GATE_CLOSED|The start gate reads {{ g }} just before the press ({{ state_attr('binary_sensor.ecco_charge_start_allowed', 'blocked_by') }}), so Charge Battery was not started and nothing was pressed.
                {%- elif states('script.ecco_free_power_start_scheduled') != 'off' -%}SCHEDULED_START_RUNNING|A scheduled Free Power start began while this start was being staged, so nothing was pressed.
                {%- elif not (is_state('switch.ecco_clock_dongle_free_power_write_enable', 'on') and (states('number.ecco_clock_dongle_free_power_duration') | float(-1)) == (req_duration | float(-2)) and (states('number.ecco_clock_dongle_free_power_max_charge_power') | float(-1)) == (req_power | float(-2))) -%}NOT_CONFIRMED|The dongle did not confirm the arm and the staged request within 5 seconds, so nothing was pressed.
                {%- elif not ((states('sensor.ecco_config_maximum_grid_charge_power') | float(-1)) >= req_power) -%}LIMIT_LOWERED|The effective grid charge limit fell below the request while this start was being staged, so nothing was pressed.
                {%- endif -%}
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (press_block | string | trim) != '' }}"
                sequence:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ecco_plan_last_result
                    data:
                      value: "{{ ('REFUSED ' ~ press_block.split('|')[0] ~ ' - ' ~ press_block.split('|')[1])[:250] }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: ecco_free_power_start_blocked
                      title: "ECCO: Charge Battery (Free Power) was not started"
                      message: "{{ press_block.split('|')[1] }} (reason {{ press_block.split('|')[0] }})"
            default:
              - action: button.press
                continue_on_error: true
                target:
                  entity_id: button.ecco_clock_dongle_start_free_power_charge_now
              # The firmware publishes its status and then disarms the switch in BOTH branches of its gate. The switch was seen ON just before this press, so seeing it OFF
              # now is this press's answer, and the status already holds its reason.
              - wait_template: >-
                  {{ is_state('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress', 'on')
                     or is_state('binary_sensor.ecco_clock_dongle_free_power_active', 'on')
                     or is_state('switch.ecco_clock_dongle_free_power_write_enable', 'off') }}
                timeout: "00:00:15"
                continue_on_timeout: true
              - delay:
                  seconds: 2
              - variables:
                  answered: "{{ is_state('switch.ecco_clock_dongle_free_power_write_enable', 'off') }}"
                  began: >-
                    {{ is_state('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress', 'on')
                       or is_state('binary_sensor.ecco_clock_dongle_free_power_active', 'on')
                       or (is_state('switch.ecco_clock_dongle_free_power_write_enable', 'off')
                           and not states('sensor.ecco_clock_dongle_free_power_status').startswith('REJECTED')) }}
                  status_now: "{{ states('sensor.ecco_clock_dongle_free_power_status')[:120] }}"
              - choose:
                  # The gate passed: a start transaction began. Wait for its own verified outcome. Never retried: on failure the firmware restores its saved snapshot itself.
                  - conditions:
                      - condition: template
                        value_template: "{{ began }}"
                    sequence:
                      - wait_template: >-
                          {{ is_state('binary_sensor.ecco_clock_dongle_free_power_active', 'on')
                             or is_state('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress', 'off') }}
                        timeout: "00:02:00"
                        continue_on_timeout: true
                      - if:
                          - condition: state
                            entity_id: binary_sensor.ecco_clock_dongle_free_power_active
                            state: "on"
                        then:
                          - action: input_text.set_value
                            target:
                              entity_id: input_text.ecco_plan_last_result
                            data:
                              value: "{{ ('STARTED free_power at ' ~ (req_power | int(0)) ~ ' W for ' ~ (req_duration | int(0)) ~ ' min (guarded start).')[:250] }}"
                          - action: persistent_notification.dismiss
                            data:
                              notification_id: ecco_free_power_start_blocked
                        else:
                          - action: input_text.set_value
                            target:
                              entity_id: input_text.ecco_plan_last_result
                            data:
                              value: "{{ ('FAILED START_FAILED - a start transaction began but Free Power did not become active (' ~ states('sensor.ecco_clock_dongle_free_power_status')[:120] ~ '); the firmware restores its saved snapshot itself. Check Charge Battery before pressing again.')[:250] }}"
                          - action: persistent_notification.create
                            data:
                              notification_id: ecco_free_power_start_blocked
                              title: "ECCO: Charge Battery (Free Power) did not start"
                              message: "A start transaction began but Free Power did not become active ({{ states('sensor.ecco_clock_dongle_free_power_status')[:120] }}). The firmware restores its saved snapshot itself; check Charge Battery and its recovery state before pressing Start again. (reason START_FAILED)"
                  # Refused at the dongle's own gate (nothing written): the owner decides.
                  - conditions:
                      - condition: template
                        value_template: "{{ answered and not began }}"
                    sequence:
                      - action: input_text.set_value
                        target:
                          entity_id: input_text.ecco_plan_last_result
                        data:
                          value: "{{ ('FAILED FIRMWARE_REFUSED - the dongle gate refused the press (' ~ status_now ~ '); nothing was written. Press Start again when the reason is cleared.')[:250] }}"
                      - action: persistent_notification.create
                        data:
                          notification_id: ecco_free_power_start_blocked
                          title: "ECCO: Charge Battery (Free Power) was refused by the dongle"
                          message: "The dongle gate refused the press: {{ status_now }}. Nothing was written. Press Start again when the reason is cleared. (reason FIRMWARE_REFUSED)"
                default:
                  # No answer to this press (the switch still reads ON): disarm and look, never retry.
                  - action: switch.turn_off
                    continue_on_error: true
                    target:
                      entity_id: switch.ecco_clock_dongle_free_power_write_enable
                  - wait_template: "{{ is_state('switch.ecco_clock_dongle_free_power_write_enable', 'off') }}"
                    timeout: "00:00:10"
                    continue_on_timeout: true
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ecco_plan_last_result
                    data:
                      value: "{{ ('FAILED NO_ANSWER - no answer from the dongle to the press; the outcome is unconfirmed and is not retried (' ~ status_now ~ '). Check Charge Battery before pressing again.')[:250] }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: ecco_free_power_start_blocked
                      title: "ECCO: Charge Battery (Free Power) start unconfirmed"
                      message: "There was no answer from the dongle to the press, so it is not known whether Free Power started ({{ status_now }}). It is not retried. Check Charge Battery before pressing Start again. (reason NO_ANSWER)"
      # The write enable always ends off (the safe state: it only permits a START).
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.ecco_clock_dongle_free_power_write_enable
