# ECCO Pro - Scheduled Dump to Grid V1
# Home Assistant scheduling layer around the Manual Dump-to-Grid V1 firmware
# feature - mirrors home-assistant/packages/ecco_free_power_schedule.yaml
# exactly, with one extra staged value (Stop SOC) that Free Power has no
# analogue for. This file does NOT write Deye registers directly. It stages
# the existing ECCO Dump-to-Grid controls, arms the dedicated Dump-to-Grid
# write enable, and presses the verified START button. The ESPHome firmware
# remains responsible for snapshot, verified writes, timer and exact restore.
#
# NOT LIVE-PROVEN - see docs/DUMP_TO_GRID_V1.md.
#
# DGS1 (2026-10-12 review, after the 11 Oct scheduled Free Power incident, FPS1): the Dump to Grid
# start gate is the same shape as Free Power's. It refuses a press at once, with no side effect
# (one status text, the write enable turned off, no Modbus I/O, no counter), while any Modbus frame
# is queued or awaiting its reply; the routine 10 s telemetry poll keeps the bus busy about 20 % of
# the time. The old fixed timing (press at +2 s, one retry at +35 s) is locked to that 10 s cycle,
# and the old retry also pressed again after a start transaction had begun. Now:
#   - a refusal AT THE GATE for a transient reason is retried, bounded and with uneven spacing. A
#     refusal counts only when the switch was seen ON before THIS press and is then seen OFF (the
#     firmware's answer). Every retry re-stages, re-arms, and the firmware re-checks every interlock;
#   - nothing is retried once a start transaction has begun (the firmware then owns restore), and an
#     outcome that cannot be confirmed is reported, never retried;
#   - nothing is staged or pressed while a Dump / Free Power / manual write is in progress, while the
#     dongle is offline, or once the schedule has been cancelled (armed off, or disarmed and re-armed
#     since the run began); the press waits for the arm and all three staged values to be confirmed;
#   - a start counts only on positive confirmation (Dump to Grid Active on);
#   - each run retries for at most 10 minutes and never in the last 30 s of the window; the staged
#     duration is min(requested, floor((window end - now + 20 s) / 60 s)): an on-time start keeps its
#     full duration, a late start ends within about a minute of the window end;
#   - a readiness check 5 min before, a missed-trigger watchdog 3 min after, restart recovery, and a
#     persistent notification for every failure or miss; the write enable always ends off.
#
# R9 (2026-11, owner requirement of 12 Nov): a missed scheduled run is never started after a Home Assistant restart. A start
# time earlier than the captured Home Assistant start (or any start time while that capture is unknown or stale: fail closed)
# is recorded as `MISSED - not started after a Home Assistant restart`, notified and disarmed by BOTH the watchdog and the
# startup recovery; a future occurrence stays armed and starts on time. Header text above predates R9: where it speaks of the
# watchdog or restart recovery starting a late run, read R9.
# DEVIATION (deliberate): the captured Home Assistant start means 'when the clock was first trusted', which can be seconds to
# minutes after the true boot. A start in that gap counts as missed (fail closed): if its on-time trigger fired it runs normally;
# only a LOST on-time trigger is refused by the watchdog. The dongle's NTP Time text carries local time without an offset, so the
# check assumes Home Assistant's time zone is Europe/London (otherwise the capture stays unknown and everything fails closed); an
# unambiguous comparison needs a future firmware change to publish an offset or an epoch.
# DEPLOY: install this change with a FULL Home Assistant restart (not a package reload). The capture runs only on the start
# event, so after a reload the captured start stays unknown and every guard fails closed: the watchdog will NOT rescue a lost
# on-time start until the next full restart. The capture also waits (up to 10 minutes) for the dongle's NTP to be synced and
# for Home Assistant's clock to agree with it; if that never happens the capture stays unknown (fail closed).
#
# PLAN (stage 3, home-assistant/packages/ecco_plan_helpers.yaml, which must be installed with or before this file): the start also
# refuses, with its own BLOCKED result text (the end-of-run alert below raises the persistent notification) and with nothing
# staged or pressed,
#   - while a Hold battery, Skip tonight or Prepare for power cut is active (sensor.ecco_plan_export_hold reads held), and while that
#     cannot be read (unknown, unavailable or the entity missing: it fails closed);
#   - while the effective reserve (sensor.ecco_plan_effective_reserve: the larger of the owner's reserve and a running power-cut reserve)
#     cannot be read (reason RESERVE_UNKNOWN), is not a finite number from 0 to 100 (reason RESERVE_INVALID), or leaves no room under
#     the 90 % Stop SOC limit (reason RESERVE_TOO_HIGH). The reserve passes only as a finite number from 0 to 100, tested as a positive
#     range: nan, infinity and anything else is refused before anything is staged, so a bad reading fails closed;
# and it raises the Stop SOC it stages to at least the effective reserve (rounded up), never lowers it. The scheduled start is the
# trusted backend: the dashboard and the card are not what keeps an override.
#
# PLAN, press-time recheck: a run can wait up to 10 minutes for the dongle (offline, or another write in progress), and the owner can start
# a Hold battery, Skip tonight or Prepare for power cut in that time. So the hold and the reserve are read AGAIN immediately before the
# press. If the hold is no longer clear (held, or cannot be read), or the reserve can no longer be read or is not a finite number from 0
# to 100, or the Stop SOC staged for THIS run is below the rounded-up reserve of that moment, the run ends as a BLOCKED result with the
# same reason codes (RESERVE_TOO_HIGH for the staged Stop SOC) that says it happened while the run was waiting, nothing is pressed, the
# write enable ends off, it is never retried, and the end-of-run alert raises the notification, also when Dump to Grid is found active when
# the loop ends (see the last point below). The re-read is a moment before the press,
# not part of it: an override started in that moment is not seen. What else the recheck does and does not do:
#   - It runs on EVERY attempt, the first included: after the staging (up to about six seconds: three numbers, the arm and its
#     confirmation) and before the press. A "while this run was waiting" text can therefore also come from a change during that staging.
#   - It fails closed, and that has a cost: a hold or reserve sensor that is momentarily unknown or unavailable at that moment (a
#     template reload, a Home Assistant start) ends the run as BLOCKED, alerts and disarms the schedule, so that night's scheduled
#     export is lost until the owner arms it again. It is not refused for good: the next armed run reads the sensors afresh.
#   - The staging of that attempt stays on the dongle (export power, Stop SOC and duration) with the write enable off; nothing starts
#     without arming again and pressing, as after any other failed attempt.
#   - Fixed 19 Nov 2026 (owner decision r14: a refusal stays a refusal): this BLOCKED text is written inside the retry loop, so, unlike
#     the start-time BLOCKED results, the steps after the loop still run. They no longer overwrite it: a result that starts with BLOCKED
#     is never replaced by "STARTED OK - Dump to Grid is active; this run could not confirm the start as its own ...", also when Dump to
#     Grid is active when the loop ends (started from the dongle's own Start button, which no override binds (RG-ST3), or by a manual
#     start). The end-of-run alert is raised as for any BLOCKED result, the schedule notifications are not dismissed, and the alert says
#     that Dump to Grid is active now and that this run did not start it: check it, and the plan overrides, before assuming it is held.
#     This script presses nothing in that case.
#   - Fixed 19 Nov 2026 (owner decision r15: every final status reflects the actual outcome): the steps after the loop never write a success
#     text. A FAILED or CANCELLED result is final too: it stays exactly as written when Dump to Grid is active (started some other way), and
#     so does a BLOCKED one. A result that is still STARTING when Dump to Grid is found active has no verified start of this run: it becomes
#     CANCELLED if the owner cancelled the schedule, else a FAILED TO START text that says the retries ended, repeats the last status and says
#     that Dump to Grid is active now and that this run did not confirm that it started it. STARTED OK is written only inside the loop, after
#     this run's own press, a start transaction that began and Dump to Grid active; that path is unchanged. A result this script did not write
#     (ARMED, REJECTED, MISSED) is left alone. The alert's sentence says "this run did not start it" for a BLOCKED result only (nothing was
#     pressed); for a FAILED result it says this run did not CONFIRM that it started it, because an unconfirmed outcome can be a late start of
#     this run's own press. Still true: such a FAILED text can be a false negative (the dongle started late after a start transaction that
#     began); the alert flags it. Nothing is pressed after the loop, the write enable ends off, and nothing changes while Dump to Grid is not active.

input_boolean:
  ecco_dump_to_grid_schedule_armed:
    name: ECCO Scheduled Dump to Grid Armed
    icon: mdi:calendar-check

input_datetime:
  ecco_dump_to_grid_schedule_start:
    name: ECCO Dump to Grid Schedule Start
    has_date: true
    has_time: true

  # R9 (no automatic start of a missed run after a Home Assistant restart): the time Home Assistant last
  # started, written ONLY by ecco_dump_to_grid_ha_start_capture on the `homeassistant` start event. Never edit
  # it by hand. Helpers are restored across a restart, so a value this boot did not write is stale: the guards
  # then treat the start as unknown and fail closed (nothing starts).
  ecco_dump_to_grid_ha_start:
    name: ECCO Dump to Grid HA Start (captured)
    has_date: true
    has_time: true

input_number:
  ecco_dump_to_grid_schedule_duration:
    name: ECCO Scheduled Dump to Grid Duration
    min: 1
    max: 240
    step: 1
    unit_of_measurement: min
    mode: slider

  ecco_dump_to_grid_schedule_power:
    name: ECCO Scheduled Dump to Grid Export Power
    min: 500
    max: 8000
    step: 100
    unit_of_measurement: W
    mode: box

  ecco_dump_to_grid_schedule_stop_soc:
    name: ECCO Scheduled Dump to Grid Stop SOC
    min: 10
    max: 90
    step: 1
    unit_of_measurement: "%"
    mode: box

input_text:
  ecco_dump_to_grid_schedule_last_result:
    name: ECCO Dump to Grid Schedule Last Result
    max: 255

script:
  ecco_dump_to_grid_start_scheduled:
    alias: "ECCO - Start scheduled Dump to Grid"
    description: >-
      Stages and starts the Dump-to-Grid V1 override inside its authorised window while the schedule
      stays armed. A start-gate refusal for a transient reason is retried (bounded); nothing is retried
      once a start transaction has begun; a failure raises a persistent notification.
    mode: single
    fields:
      duration_minutes:
        description: "Duration to stage into the ESPHome Dump-to-Grid controller"
      power_w:
        description: "Requested export power in watts"
      stop_soc:
        description: "Requested Stop SOC floor in percent"
      window_end_ts:
        description: "End of the authorised window (epoch seconds); nothing starts or runs after it"
    sequence:
      - variables:
          requested_duration: "{{ duration_minutes | int(1) }}"
          requested_power: "{{ power_w | int(500) }}"
          # The plan's hold and reserve, read at the start of the run. A run can then wait up to 10 minutes (dongle offline or another
          # write in progress), so both are read AGAIN immediately before the press (press_block, in the retry loop below): a change that
          # came in while the run waited ends THIS run, it does not wait for the next one.
          plan_hold: "{{ states('sensor.ecco_plan_export_hold') }}"
          # The reserve must be a finite number from 0 to 100, tested as a positive range: a comparison with nan is always false, so a test
          # that only refused a too-big value would let nan through, and float() also accepts nan, inf and -inf (inf cannot be rounded, and
          # the offline interpreter keeps nan and inf as text, so every comparison then raises). A value outside the range is therefore
          # replaced here by a negative code, and nothing below ever compares, rounds or stages a bad reserve:
          # -1 = cannot be read, or below 0 (RESERVE_UNKNOWN); -2 = not a finite number from 0 to 100 (RESERVE_INVALID).
          plan_reserve: >-
            {%- set r = states('sensor.ecco_plan_effective_reserve') | float(-1) -%}
            {%- if r >= 0 and r <= 100 -%}{{ r }}
            {%- elif r < 0 -%}-1
            {%- else -%}-2
            {%- endif -%}
          requested_stop_soc_raw: "{{ stop_soc | int(25) }}"
          # Raise-only: at least the effective reserve, rounded up; never below what the owner asked for.
          requested_stop_soc: "{{ [stop_soc | int(25), (plan_reserve | round(0, 'ceil') | int) if plan_reserve >= 0 else 0] | max }}"
          window_end: >-
            {% set w = window_end_ts | float(0) %}
            {{ w if w > 0 else as_timestamp(now()) + (duration_minutes | int(1)) * 60 }}
          retry_until: "{{ [as_timestamp(now()) + 600, (window_end | float(0)) - 30] | min }}"
          max_attempts: 60
          # A cancel - or a cancel and a re-arm - after this instant ends this run (armed's last_changed moves).
          run_started: "{{ as_timestamp(now()) }}"
      - choose:
          # PLAN: an active Hold battery / Skip tonight / Prepare for power cut holds the start. (The alert at the end of this script
          # already raises one persistent notification, with this text, for every BLOCKED result.)
          - conditions:
              - condition: template
                value_template: "{{ plan_hold == 'held' }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                data:
                  value: >-
                    BLOCKED - a Hold battery, Skip tonight or Prepare for power cut is active ({{ state_attr('sensor.ecco_plan_export_hold', 'held_by') }});
                    nothing started (reason OVERRIDE_ACTIVE). Cancel it on the Energy Actions card to allow this start.
          # PLAN: the override records cannot be read (or the plan helper package is not installed): fail closed.
          - conditions:
              - condition: template
                value_template: "{{ plan_hold != 'clear' }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                data:
                  value: >-
                    BLOCKED - the plan override records cannot be read ({{ plan_hold }}); nothing started (reason OVERRIDE_UNREADABLE).
                    Check that the ECCO plan helper package is installed and its helpers are available.
          # PLAN: no known effective reserve, or one that is not a finite number from 0 to 100: fail closed (plan_reserve is negative for
          # both, so this one branch refuses both; the text says which).
          - conditions:
              - condition: template
                value_template: "{{ plan_reserve < 0 }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                data:
                  value: >-
                    {%- if plan_reserve == -2 -%}BLOCKED - the effective reserve is not a number from 0 to 100; nothing started (reason RESERVE_INVALID)
                    {%- else -%}BLOCKED - the effective reserve cannot be read; nothing started (reason RESERVE_UNKNOWN)
                    {%- endif -%}
          # PLAN: the reserve the Stop SOC must respect leaves no room under the 90 % limit.
          - conditions:
              - condition: template
                value_template: "{{ (requested_stop_soc | int(0)) > 90 and (requested_stop_soc_raw | int(0)) <= 90 }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                data:
                  value: "BLOCKED - the effective reserve ({{ plan_reserve | round(0) | int }}%) leaves no room under the 90% Stop SOC limit; nothing started (reason RESERVE_TOO_HIGH)"
          - conditions:
              - condition: template
                value_template: >-
                  {{ (requested_power | int(0)) < 500 or (requested_power | int(0)) > 8000 }}
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                data:
                  value: >-
                    BLOCKED - requested {{ requested_power }}W outside safe range 500-8000W
          - conditions:
              - condition: template
                value_template: >-
                  {{ (requested_stop_soc | int(0)) < 10 or (requested_stop_soc | int(0)) > 90 }}
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                data:
                  value: >-
                    BLOCKED - requested Stop SOC {{ requested_stop_soc }}% outside safe range 10-90%
          - conditions:
              - condition: state
                entity_id: binary_sensor.ecco_clock_dongle_dump_to_grid_active
                state: "on"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                data:
                  value: "BLOCKED - Dump to Grid already active"
        default:
          - action: input_text.set_value
            target:
              entity_id: input_text.ecco_dump_to_grid_schedule_last_result
            data:
              value: >-
                STARTING - {{ requested_power }}W, Stop SOC {{ requested_stop_soc }}%{{ ' (raised from ' ~ requested_stop_soc_raw ~ '% to the effective reserve)' if (requested_stop_soc | int(0)) > (requested_stop_soc_raw | int(0)) else '' }}, until
                {{ (window_end | float(0)) | timestamp_custom('%H:%M') }}
          - repeat:
              sequence:
                - variables:
                    duration_now: >-
                      {{ [requested_duration | int(1),
                          (((window_end | float(0)) - as_timestamp(now()) + 20) / 60) | round(0, 'floor') | int(0)] | min }}
                - choose:
                    # Cancelled by the owner (no longer armed, or disarmed and re-armed since this run began):
                    # never press again.
                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ not (is_state('input_boolean.ecco_dump_to_grid_schedule_armed', 'on')
                                    and as_timestamp(states.input_boolean.ecco_dump_to_grid_schedule_armed.last_changed, 0)
                                        <= (run_started | float(0))) }}
                      sequence:
                        - action: input_text.set_value
                          target:
                            entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                          data:
                            value: "CANCELLED - scheduled Dump to Grid cancelled before it started"
                    # The authorised window is (nearly) over: never start.
                    - conditions:
                        - condition: template
                          value_template: "{{ (duration_now | int(0)) < 1 or as_timestamp(now()) >= (window_end | float(0)) - 30 }}"
                      sequence:
                        - action: input_text.set_value
                          target:
                            entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                          data:
                            value: >-
                              FAILED TO START - authorised window ends {{ (window_end | float(0)) | timestamp_custom('%H:%M') }};
                              not started ({{ states('sensor.ecco_clock_dongle_dump_to_grid_status')[:120] }})
                    # Not ready to press: the dongle is offline, or a Dump / Free Power / manual write is in
                    # progress (a transaction that will end by itself). Stage nothing, press nothing; look again.
                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ not is_state('binary_sensor.ecco_clock_dongle_telemetry_online', 'on')
                               or not is_state('binary_sensor.ecco_clock_dongle_configuration_online', 'on')
                               or states('switch.ecco_clock_dongle_dump_to_grid_write_enable') not in ['on', 'off']
                               or states('binary_sensor.ecco_clock_dongle_dump_to_grid_active') not in ['on', 'off']
                               or is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress', 'on')
                               or is_state('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress', 'on')
                               or is_state('binary_sensor.ecco_clock_dongle_manual_write_in_progress', 'on') }}
                      sequence:
                        - action: input_text.set_value
                          target:
                            entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                          data:
                            value: >-
                              STARTING - attempt {{ repeat.index }} waiting: dongle offline or another write in progress;
                              retrying until {{ (retry_until | float(0)) | timestamp_custom('%H:%M') }}
                        - delay:
                            seconds: 10
                  default:
                    - action: number.set_value
                      continue_on_error: true
                      target:
                        entity_id: number.ecco_clock_dongle_dump_to_grid_export_power
                      data:
                        value: "{{ requested_power }}"
                    - action: number.set_value
                      continue_on_error: true
                      target:
                        entity_id: number.ecco_clock_dongle_dump_to_grid_stop_soc
                      data:
                        value: "{{ requested_stop_soc }}"
                    - action: number.set_value
                      continue_on_error: true
                      target:
                        entity_id: number.ecco_clock_dongle_dump_to_grid_duration
                      data:
                        value: "{{ duration_now }}"
                    - action: switch.turn_on
                      continue_on_error: true
                      target:
                        entity_id: switch.ecco_clock_dongle_dump_to_grid_write_enable
                    # Press only once the dongle has confirmed the arm and all three staged values.
                    - wait_template: >-
                        {{ is_state('switch.ecco_clock_dongle_dump_to_grid_write_enable', 'on')
                           and (states('number.ecco_clock_dongle_dump_to_grid_duration') | float(-1)) == (duration_now | float(-2))
                           and (states('number.ecco_clock_dongle_dump_to_grid_export_power') | float(-1)) == (requested_power | float(-2))
                           and (states('number.ecco_clock_dongle_dump_to_grid_stop_soc') | float(-1)) == (requested_stop_soc | float(-2)) }}
                      timeout: "00:00:05"
                      continue_on_timeout: true
                    - delay:
                        seconds: 1
                    # PLAN (press-time recheck): this run may have waited (dongle offline or another write in progress, up to 10 minutes) since it
                    # read the plan at its start, and the owner may have started a Hold battery, Skip tonight or Prepare for power cut in the
                    # meantime. The hold and the reserve are therefore read AGAIN here, immediately before the press, and sanitised as at the
                    # start (the reserve passes only as a finite number from 0 to 100: below 0 is RESERVE_UNKNOWN, nan or anything above 100 is
                    # RESERVE_INVALID). press_block is empty (press, exactly as before) or the reason: OVERRIDE_ACTIVE (held), OVERRIDE_UNREADABLE
                    # (anything but held or clear), RESERVE_UNKNOWN, RESERVE_INVALID, or RESERVE_TOO_HIGH (the Stop SOC staged for THIS run is
                    # below the rounded-up reserve of now: never press with a Stop SOC below the reserve).
                    - variables:
                        press_block: >-
                          {%- set h = states('sensor.ecco_plan_export_hold') -%}
                          {%- set r = states('sensor.ecco_plan_effective_reserve') | float(-1) -%}
                          {%- if h == 'held' -%}OVERRIDE_ACTIVE
                          {%- elif h != 'clear' -%}OVERRIDE_UNREADABLE
                          {%- elif r < 0 -%}RESERVE_UNKNOWN
                          {%- elif not (r >= 0 and r <= 100) -%}RESERVE_INVALID
                          {%- elif (r | round(0, 'ceil') | int) > (requested_stop_soc | int(0)) -%}RESERVE_TOO_HIGH
                          {%- endif -%}
                    - if:
                        - condition: template
                          value_template: >-
                            {{ is_state('switch.ecco_clock_dongle_dump_to_grid_write_enable', 'on')
                               and (states('number.ecco_clock_dongle_dump_to_grid_duration') | float(-1)) == (duration_now | float(-2))
                               and (states('number.ecco_clock_dongle_dump_to_grid_export_power') | float(-1)) == (requested_power | float(-2))
                               and (states('number.ecco_clock_dongle_dump_to_grid_stop_soc') | float(-1)) == (requested_stop_soc | float(-2))
                               and is_state('input_boolean.ecco_dump_to_grid_schedule_armed', 'on')
                               and as_timestamp(states.input_boolean.ecco_dump_to_grid_schedule_armed.last_changed, 0) <= (run_started | float(0)) }}
                        # PLAN (press-time recheck): nothing is pressed while the hold or the reserve read just above says no.
                        - condition: template
                          value_template: "{{ (press_block | string | trim) == '' }}"
                      then:
                        # The firmware counts a start attempt only when its gate passes (published every 30 s).
                        - variables:
                            attempts_before: "{{ states('sensor.ecco_clock_dongle_dump_to_grid_start_attempts_since_boot') }}"
                        - action: button.press
                          continue_on_error: true
                          target:
                            entity_id: button.ecco_clock_dongle_start_dump_to_grid_now
                        # The firmware publishes its status and then disarms the switch in BOTH branches of its
                        # gate. The switch was seen ON just before this press, so seeing it OFF now is this
                        # press's answer, and the status already holds its reason (an identical refusal text is
                        # not re-sent by ESPHome, so the text itself cannot prove freshness).
                        - wait_template: >-
                            {{ is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress', 'on')
                               or is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'on')
                               or is_state('switch.ecco_clock_dongle_dump_to_grid_write_enable', 'off') }}
                          timeout: "00:00:15"
                          continue_on_timeout: true
                        - delay:
                            seconds: 2
                        - variables:
                            answered: "{{ is_state('switch.ecco_clock_dongle_dump_to_grid_write_enable', 'off') }}"
                            began: >-
                              {{ is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress', 'on')
                                 or is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'on')
                                 or (is_state('switch.ecco_clock_dongle_dump_to_grid_write_enable', 'off')
                                     and not states('sensor.ecco_clock_dongle_dump_to_grid_status').startswith('REJECTED')) }}
                            status_now: "{{ states('sensor.ecco_clock_dongle_dump_to_grid_status')[:120] }}"
                        - choose:
                            # Refused AT THE GATE (nothing written), answered, for a transient reason: retry.
                            - conditions:
                                - condition: template
                                  value_template: >-
                                    {% set s = states('sensor.ecco_clock_dongle_dump_to_grid_status') %}
                                    {{ answered and not began
                                       and is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_snapshot_valid', 'off')
                                       and (s.startswith('REJECTED - Modbus bus busy with another transaction')
                                            or s.startswith('REJECTED - RTC correction currently active')
                                            or s.startswith('REJECTED - another inverter write is active')
                                            or s.startswith('REJECTED - inverter configuration offline')
                                            or s.startswith('REJECTED - valid NTP time required')
                                            or s.startswith('REJECTED - plausible live battery voltage required')
                                            or s.startswith('REJECTED - plausible live battery SOC required')
                                            or s.startswith('REJECTED - battery SOC telemetry is stale')
                                            or s.startswith('REJECTED - no fresh inverter configuration readback yet')
                                            or s.startswith('REJECTED - grid CT telemetry is not fresh/plausible')
                                            or s.startswith('REJECTED - arm Dump to Grid Write Enable first')) }}
                              sequence:
                                - action: input_text.set_value
                                  target:
                                    entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                                  data:
                                    value: >-
                                      STARTING - attempt {{ repeat.index }} refused at the start gate ({{ status_now }});
                                      nothing written; retrying until {{ (retry_until | float(0)) | timestamp_custom('%H:%M') }}
                                # Uneven spacing never locks to the 10 s poll: about 6 / 7 / 9 / 10.5 s per attempt
                                # for the first 8, then about 16-21 s. The deadline, not the count, ends the retries.
                                - delay:
                                    seconds: "{{ (2.3 if repeat.index <= 8 else 12.6) + 1.7 * (repeat.index % 4) }}"
                            # Refused at the gate for a reason that needs the owner: stop, no retry.
                            - conditions:
                                - condition: template
                                  value_template: "{{ answered and not began }}"
                              sequence:
                                - action: input_text.set_value
                                  target:
                                    entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                                  data:
                                    value: "FAILED TO START - {{ status_now }} (attempt {{ repeat.index }}; nothing written)"
                            # The gate passed: a start transaction began. Wait for its own verified outcome.
                            # Never retried: on failure the firmware keeps or restores its saved snapshot itself.
                            - conditions:
                                - condition: template
                                  value_template: "{{ began }}"
                              sequence:
                                - wait_template: >-
                                    {{ is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'on')
                                       or is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress', 'off') }}
                                  timeout: "00:02:00"
                                  continue_on_timeout: true
                                - if:
                                    - condition: state
                                      entity_id: binary_sensor.ecco_clock_dongle_dump_to_grid_active
                                      state: "on"
                                  then:
                                    - action: input_text.set_value
                                      target:
                                        entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                                      data:
                                        value: >-
                                          STARTED OK - {{ requested_power }}W for {{ duration_now }} min, Stop SOC {{ requested_stop_soc }}%
                                          (attempt {{ repeat.index }}; ends by {{ (window_end | float(0)) | timestamp_custom('%H:%M') }})
                                  else:
                                    - action: input_text.set_value
                                      target:
                                        entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                                      data:
                                        value: >-
                                          FAILED TO START - {{ states('sensor.ecco_clock_dongle_dump_to_grid_status')[:120] }}
                                          (start transaction began on attempt {{ repeat.index }}; not retried)
                          # No answer to this press (the switch still reads ON). Either the press never reached the
                          # firmware (or its single-mode start script was still running and dropped it), or Home
                          # Assistant's view stopped updating. Prove which before anything else: disarm and SEE the
                          # switch go off (the dongle is answering again), then wait for the firmware's gate-pass
                          # counter. Retry only if it did not move and nothing is in progress, active or pending
                          # restore; otherwise the outcome is unconfirmed and is never retried.
                          default:
                            - action: switch.turn_off
                              continue_on_error: true
                              target:
                                entity_id: switch.ecco_clock_dongle_dump_to_grid_write_enable
                            - wait_template: "{{ is_state('switch.ecco_clock_dongle_dump_to_grid_write_enable', 'off') }}"
                              timeout: "00:00:10"
                              continue_on_timeout: true
                            - delay:
                                seconds: 35
                            - if:
                                - condition: template
                                  value_template: >-
                                    {% set now_a = states('sensor.ecco_clock_dongle_dump_to_grid_start_attempts_since_boot') | float(-1) %}
                                    {{ is_state('switch.ecco_clock_dongle_dump_to_grid_write_enable', 'off')
                                       and now_a >= 0 and now_a == (attempts_before | float(-2))
                                       and is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress', 'off')
                                       and is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'off')
                                       and is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_snapshot_valid', 'off') }}
                              then:
                                - action: input_text.set_value
                                  target:
                                    entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                                  data:
                                    value: >-
                                      STARTING - attempt {{ repeat.index }} never reached the dongle (no start counted);
                                      retrying until {{ (retry_until | float(0)) | timestamp_custom('%H:%M') }}
                              else:
                                - action: input_text.set_value
                                  target:
                                    entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                                  data:
                                    value: >-
                                      FAILED TO START - no answer from the dongle to attempt {{ repeat.index }}; outcome
                                      unconfirmed, not retried (last status: {{ status_now }})
                      else:
                        # The dongle never confirmed the arm or the staged values, or the schedule was cancelled in
                        # the meantime: nothing was pressed. Disarm and look again (the loop top sees a cancel).
                        - action: switch.turn_off
                          continue_on_error: true
                          target:
                            entity_id: switch.ecco_clock_dongle_dump_to_grid_write_enable
                        - action: input_text.set_value
                          target:
                            entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                          data:
                            value: >-
                              STARTING - attempt {{ repeat.index }}: arm or staged values not confirmed; nothing pressed;
                              retrying until {{ (retry_until | float(0)) | timestamp_custom('%H:%M') }}
                        - delay:
                            seconds: 5
                    # PLAN (press-time recheck): the plan changed while this run waited. This ends THIS run for good: the BLOCKED text below is one
                    # of the results the loop's `until` stops on (the write enable was turned off just above, nothing was pressed, and the end-of-run
                    # alert raises the notification), so no later attempt stages or presses anything.
                    - if:
                        - condition: template
                          value_template: "{{ (press_block | string | trim) != '' }}"
                      then:
                        - action: input_text.set_value
                          target:
                            entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                          data:
                            value: >-
                              {%- if press_block == 'OVERRIDE_ACTIVE' -%}BLOCKED - a Hold battery, Skip tonight or Prepare for power cut became active while this run was waiting ({{ state_attr('sensor.ecco_plan_export_hold', 'held_by') }}); nothing started (reason OVERRIDE_ACTIVE)
                              {%- elif press_block == 'OVERRIDE_UNREADABLE' -%}BLOCKED - the plan override records could not be read while this run was waiting; nothing started (reason OVERRIDE_UNREADABLE)
                              {%- elif press_block == 'RESERVE_UNKNOWN' -%}BLOCKED - the effective reserve could not be read while this run was waiting; nothing started (reason RESERVE_UNKNOWN)
                              {%- elif press_block == 'RESERVE_INVALID' -%}BLOCKED - the effective reserve was not a number from 0 to 100 while this run was waiting; nothing started (reason RESERVE_INVALID)
                              {%- elif press_block == 'RESERVE_TOO_HIGH' -%}BLOCKED - the effective reserve rose above the Stop SOC staged for this run ({{ requested_stop_soc }}%) while it was waiting; nothing started (reason RESERVE_TOO_HIGH)
                              {%- else -%}BLOCKED - the plan could not be checked while this run was waiting; nothing started (reason OVERRIDE_UNREADABLE)
                              {%- endif -%}
              until:
                - condition: or
                  conditions:
                    - condition: state
                      entity_id: binary_sensor.ecco_clock_dongle_dump_to_grid_active
                      state: "on"
                    - condition: template
                      value_template: >-
                        {% set r = states('input_text.ecco_dump_to_grid_schedule_last_result') %}
                        {{ r.startswith('STARTED') or r.startswith('FAILED') or r.startswith('CANCELLED') or r.startswith('BLOCKED') }}
                    - condition: template
                      value_template: >-
                        {{ repeat.index >= (max_attempts | int(60))
                           or as_timestamp(now()) >= (retry_until | float(0))
                           or not is_state('input_boolean.ecco_dump_to_grid_schedule_armed', 'on')
                           or as_timestamp(states.input_boolean.ecco_dump_to_grid_schedule_armed.last_changed, 0) > (run_started | float(0)) }}
          - if:
              - condition: template
                value_template: >-
                  {% set r = states('input_text.ecco_dump_to_grid_schedule_last_result') %}
                  {{ not is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'on')
                     and not r.startswith('STARTED') and not r.startswith('FAILED') and not r.startswith('BLOCKED')
                     and not r.startswith('ARMED')
                     and not (is_state('input_boolean.ecco_dump_to_grid_schedule_armed', 'on')
                              and as_timestamp(states.input_boolean.ecco_dump_to_grid_schedule_armed.last_changed, 0)
                                  <= (run_started | float(0))) }}
            then:
              - action: input_text.set_value
                target:
                  entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                data:
                  value: "CANCELLED - scheduled Dump to Grid cancelled before it started"
          # Owner decision r15 (19 Nov 2026): the steps after the loop never turn a result into a success. STARTED OK is written only inside the loop,
          # by this run's own verified start (its press, a start transaction that began, then Dump to Grid active). A FAILED, CANCELLED or BLOCKED result
          # stays exactly as written, whatever Dump to Grid is doing (started some other way: the dongle's own Start button, which is not bound by
          # any override (RG-ST3), or by hand); the alert below then says so. A result that is still STARTING when Dump to Grid is found active was not confirmed by
          # this run: it becomes CANCELLED if the owner cancelled the schedule, else a FAILED TO START text that says Dump to Grid is active now and that
          # this run did not confirm that it started it. A result this script did not write (ARMED, REJECTED, MISSED) is left alone.
          - if:
              - condition: template
                value_template: >-
                  {% set r = states('input_text.ecco_dump_to_grid_schedule_last_result') %}
                  {{ is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'on') and r.startswith('STARTING') }}
            then:
              - choose:
                  # Cancelled by the owner (tested as the loop top and the step above test it): the run reads CANCELLED, not failed.
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ not (is_state('input_boolean.ecco_dump_to_grid_schedule_armed', 'on')
                                  and as_timestamp(states.input_boolean.ecco_dump_to_grid_schedule_armed.last_changed, 0)
                                      <= (run_started | float(0))) }}
                    sequence:
                      - action: input_text.set_value
                        target:
                          entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                        data:
                          value: "CANCELLED - scheduled Dump to Grid cancelled before it started"
                default:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                    data:
                      value: >-
                        FAILED TO START - retries ended at {{ now().strftime('%H:%M') }}:
                        {{ states('sensor.ecco_clock_dongle_dump_to_grid_status')[:120] }};
                        Dump to Grid is active now, but this run did not confirm that it started it
          - if:
              - condition: template
                value_template: >-
                  {% set r = states('input_text.ecco_dump_to_grid_schedule_last_result') %}
                  {{ not is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'on')
                     and not r.startswith('STARTED') and not r.startswith('FAILED') and not r.startswith('CANCELLED')
                     and not r.startswith('BLOCKED')
                     and is_state('input_boolean.ecco_dump_to_grid_schedule_armed', 'on')
                     and as_timestamp(states.input_boolean.ecco_dump_to_grid_schedule_armed.last_changed, 0) <= (run_started | float(0)) }}
            then:
              - action: input_text.set_value
                target:
                  entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                data:
                  value: >-
                    FAILED TO START - retries ended at {{ now().strftime('%H:%M') }}:
                    {{ states('sensor.ecco_clock_dongle_dump_to_grid_status')[:120] }}
      # The write enable always ends off (the safe state: it only permits a START).
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.ecco_clock_dongle_dump_to_grid_write_enable
      # The owner hears about every failure at once; a later success clears the alert.
      - if:
          - condition: template
            value_template: >-
              {% set r = states('input_text.ecco_dump_to_grid_schedule_last_result') %}
              {{ r.startswith('FAILED') or (r.startswith('BLOCKED') and 'already active' not in r)
                 or not (r.startswith('STARTED') or r.startswith('CANCELLED') or r.startswith('BLOCKED')
                         or r.startswith('ARMED') or is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'on')) }}
        then:
          - action: persistent_notification.create
            data:
              notification_id: ecco_dump_to_grid_schedule
              title: "ECCO: scheduled Dump to Grid did NOT start"
              # Owner decision r14: while Dump to Grid is active at this moment the notice says so. Owner decision r15: for a BLOCKED result (nothing was
              # pressed) it says this run did not start it; for any other result (a FAILED one) it says only that this run did not CONFIRM that it started it,
              # because an unconfirmed outcome can be a late start of this run's own press.
              message: >-
                {{ states('input_text.ecco_dump_to_grid_schedule_last_result') }}
                {%- if is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'on') %}

                {% if states('input_text.ecco_dump_to_grid_schedule_last_result').startswith('BLOCKED') -%}
                Dump to Grid is active now, and this run did not start it (it may have been started from the dongle's own Start button or by hand).
                Check it, and the plan overrides, before assuming it is held.
                {%- else -%}
                Dump to Grid is active now, but this run did not confirm that it started it (it may have been started from the dongle's own Start button or by hand, or, if a start transaction had begun, late by this run's own press).
                Check it, and the plan overrides, before assuming it is held.
                {%- endif %}
                {%- endif %}

                Authorised window ends {{ (window_end | float(0)) | timestamp_custom('%H:%M') }}.
                If time remains and the reason is cleared, use Dump to Grid now in Energy Actions.
                If a start transaction began or the outcome is unconfirmed, check the Dump to Grid status
                and recovery state first.
        else:
          - if:
              - condition: state
                entity_id: binary_sensor.ecco_clock_dongle_dump_to_grid_active
                state: "on"
            then:
              - action: persistent_notification.dismiss
                data:
                  notification_id: ecco_dump_to_grid_schedule
              - action: persistent_notification.dismiss
                data:
                  notification_id: ecco_dump_to_grid_schedule_readiness

  ecco_dump_to_grid_cancel_schedule:
    alias: "ECCO - Cancel scheduled Dump to Grid"
    description: "Cancels a future scheduled Dump to Grid event. It does not stop an already-active run."
    mode: single
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ecco_dump_to_grid_schedule_armed
      - action: input_text.set_value
        target:
          entity_id: input_text.ecco_dump_to_grid_schedule_last_result
        data:
          value: "CANCELLED - scheduled event disarmed"

automation:
  - id: ecco_dump_to_grid_schedule_arm_validation
    alias: "ECCO - Validate scheduled Dump to Grid arm"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.ecco_dump_to_grid_schedule_armed
        to: "on"
    actions:
      - variables:
          start_ts: "{{ as_timestamp(states('input_datetime.ecco_dump_to_grid_schedule_start'), 0) }}"
          scheduled_power: "{{ states('input_number.ecco_dump_to_grid_schedule_power') | int(0) }}"
          scheduled_stop_soc: "{{ states('input_number.ecco_dump_to_grid_schedule_stop_soc') | int(0) }}"
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ (scheduled_power | int(0)) < 500 or (scheduled_power | int(0)) > 8000 }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.ecco_dump_to_grid_schedule_armed
              - action: input_text.set_value
                target:
                  entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                data:
                  value: >-
                    REJECTED - scheduled {{ scheduled_power }}W outside safe range 500-8000W
          - conditions:
              - condition: template
                value_template: >-
                  {{ (scheduled_stop_soc | int(0)) < 10 or (scheduled_stop_soc | int(0)) > 90 }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.ecco_dump_to_grid_schedule_armed
              - action: input_text.set_value
                target:
                  entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                data:
                  value: >-
                    REJECTED - scheduled Stop SOC {{ scheduled_stop_soc }}% outside safe range 10-90%
          - conditions:
              - condition: template
                value_template: "{{ start_ts <= as_timestamp(now()) }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.ecco_dump_to_grid_schedule_armed
              - action: input_text.set_value
                target:
                  entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                data:
                  value: "REJECTED - scheduled start must be in the future"
          # 2026-09-26 pre-live hardening: early UX check - refuse to arm
          # when an ARMED Scheduled Free Power window overlaps this one
          # (2-minute buffer either side for start retry / restore). The
          # firmware's mutual-exclusion gates stay authoritative regardless
          # (the second START would be rejected with zero Modbus I/O).
          - conditions:
              - condition: state
                entity_id: input_boolean.ecco_free_power_schedule_armed
                state: "on"
              - condition: template
                value_template: >-
                  {% set d_start = start_ts | float(0) %}
                  {% set d_end = d_start + (states('input_number.ecco_dump_to_grid_schedule_duration') | int(0)) * 60 %}
                  {% set f_start = as_timestamp(states('input_datetime.ecco_free_power_schedule_start'), 0) %}
                  {% set f_end = f_start + (states('input_number.ecco_free_power_schedule_duration') | int(0)) * 60 %}
                  {{ d_start < f_end + 120 and f_start < d_end + 120 }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.ecco_dump_to_grid_schedule_armed
              - action: input_text.set_value
                target:
                  entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                data:
                  value: >-
                    REJECTED - overlaps the armed Scheduled Free Power window
                    ({{ states('input_datetime.ecco_free_power_schedule_start') }}); cancel it first
          # 2026-09-26 pre-live hardening: early UX mirror of the firmware's
          # START-time TOU slot refusal (start_dump_to_grid_override) - a
          # window overlapping any TOU slot with a charge source set (e.g. the
          # overnight slot-1 grid-charge window) would be refused at fire time
          # anyway. Same slot model as the dashboard's "Current Plan": slot i
          # runs from its time to slot i+1's, slot 6 wrapping to slot 1. Only
          # ever refuses; if the slot sensors are unavailable it defers to the
          # firmware's own check.
          - conditions:
              - condition: template
                value_template: >-
                  {% set ns = namespace(ok=true, starts=[], charges=[], hit=0) %}
                  {% for i in range(1, 7) %}
                    {% set t = states('sensor.ecco_clock_dongle_ecco_timezone' ~ i ~ '_time') %}
                    {% set c = states('sensor.ecco_clock_dongle_ecco_timezone' ~ i ~ '_charge') %}
                    {% if t is match('^\\d{1,2}:\\d{2}$') and c not in ['unknown', 'unavailable', ''] %}
                      {% set ns.starts = ns.starts + [ (t.split(':')[0] | int) * 60 + (t.split(':')[1] | int) ] %}
                      {% set ns.charges = ns.charges + [c] %}
                    {% else %}
                      {% set ns.ok = false %}
                    {% endif %}
                  {% endfor %}
                  {% if ns.ok and (start_ts | float(0)) > 0 %}
                    {% set st = (start_ts | float(0)) | timestamp_local %}
                    {% set m0 = (st[11:13] | int) * 60 + (st[14:16] | int) %}
                    {% set dur = states('input_number.ecco_dump_to_grid_schedule_duration') | int(0) %}
                    {% for k in range(0, dur + 1) %}
                      {% set m = (m0 + k) % 1440 %}
                      {% for i in range(0, 6) %}
                        {% set s = ns.starts[i] %}
                        {% set e = ns.starts[(i + 1) % 6] %}
                        {% set inside = (e > s and m >= s and m < e) or (e < s and (m >= s or m < e)) %}
                        {% if ns.hit == 0 and inside and ns.charges[i] != 'None' %}
                          {% set ns.hit = i + 1 %}
                        {% endif %}
                      {% endfor %}
                    {% endfor %}
                  {% endif %}
                  {{ ns.hit > 0 }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.ecco_dump_to_grid_schedule_armed
              - action: input_text.set_value
                target:
                  entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                data:
                  value: >-
                    REJECTED - window overlaps a TOU slot with a charge source set
                    (e.g. the overnight grid-charge slot); Dump V1 will not start there
        default:
          - action: input_text.set_value
            target:
              entity_id: input_text.ecco_dump_to_grid_schedule_last_result
            data:
              value: >-
                ARMED - {{ states('input_datetime.ecco_dump_to_grid_schedule_start') }} •
                {{ states('input_number.ecco_dump_to_grid_schedule_duration') | int }} min •
                {{ states('input_number.ecco_dump_to_grid_schedule_power') | int }}W •
                Stop SOC {{ states('input_number.ecco_dump_to_grid_schedule_stop_soc') | int }}%
          - action: persistent_notification.dismiss
            data:
              notification_id: ecco_dump_to_grid_schedule
          - action: persistent_notification.dismiss
            data:
              notification_id: ecco_dump_to_grid_schedule_readiness

  - id: ecco_dump_to_grid_schedule_fire
    alias: "ECCO - Fire scheduled Dump to Grid"
    # single + silent: a watchdog tick that arrives while the start is still retrying is dropped.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time
        at: input_datetime.ecco_dump_to_grid_schedule_start
        id: start
      # Readiness: from 5 minutes before the start (now() templates re-render every minute).
      - trigger: template
        id: readiness
        value_template: >-
          {% set s = as_timestamp(states('input_datetime.ecco_dump_to_grid_schedule_start'), 0) %}
          {{ is_state('input_boolean.ecco_dump_to_grid_schedule_armed', 'on') and s > 0
             and 0 < s - as_timestamp(now()) <= 300 }}
      # Watchdog: still armed 3 minutes after the start means the start never ran.
      - trigger: template
        id: watchdog
        value_template: >-
          {% set s = as_timestamp(states('input_datetime.ecco_dump_to_grid_schedule_start'), 0) %}
          {{ is_state('input_boolean.ecco_dump_to_grid_schedule_armed', 'on') and s > 0
             and as_timestamp(now()) - s >= 180
             and as_timestamp(states.input_boolean.ecco_dump_to_grid_schedule_armed.last_changed, 0) < s }}
    conditions:
      - condition: state
        entity_id: input_boolean.ecco_dump_to_grid_schedule_armed
        state: "on"
    actions:
      - variables:
          fired_for: "{{ states('input_datetime.ecco_dump_to_grid_schedule_start') }}"
          start_ts: "{{ as_timestamp(states('input_datetime.ecco_dump_to_grid_schedule_start'), 0) }}"
          end_ts: "{{ (start_ts | float(0)) + (states('input_number.ecco_dump_to_grid_schedule_duration') | int(1)) * 60 }}"
          # R9: a start time earlier than the captured Home Assistant start is a missed run, and so is any start
          # time while the capture is unknown or stale (fail closed). Compared directly, never via last_changed.
          ha_start_ts: "{{ as_timestamp(states('input_datetime.ecco_dump_to_grid_ha_start'), 0) }}"
          ha_start_known: >-
            {% set c = states('input_datetime.ecco_dump_to_grid_ha_start') %}
            {% set cs = as_timestamp(c, 0) %}
            {% set o = states.input_datetime.ecco_dump_to_grid_ha_start %}
            {% set u = as_timestamp(o.last_updated, 0) if o is not none else 0 %}
            {{ o is not none and c not in ['unknown', 'unavailable', ''] and cs > 1000000000
               and cs <= as_timestamp(now()) and u > 0 and (u - cs) | abs <= 10 }}
          missed_run: "{{ not ha_start_known or (start_ts | float(0)) <= (ha_start_ts | float(0)) }}"
      - choose:
          - conditions:
              - condition: trigger
                id: readiness
            sequence:
              - variables:
                  blockers: >-
                    {% set r = namespace(v=[]) %}
                    {% if not is_state('binary_sensor.ecco_clock_dongle_telemetry_online', 'on') %}{% set r.v = r.v + ['telemetry offline'] %}{% endif %}
                    {% if not is_state('binary_sensor.ecco_clock_dongle_configuration_online', 'on') %}{% set r.v = r.v + ['inverter configuration offline'] %}{% endif %}
                    {% if not is_state('binary_sensor.ecco_clock_dongle_ntp_synced', 'on') %}{% set r.v = r.v + ['dongle NTP time not synced'] %}{% endif %}
                    {% if states('switch.ecco_clock_dongle_dump_to_grid_write_enable') not in ['on', 'off'] %}{% set r.v = r.v + ['dongle unavailable'] %}{% endif %}
                    {% if is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'on') %}{% set r.v = r.v + ['Dump to Grid already active'] %}{% endif %}
                    {% if is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_snapshot_valid', 'on') %}{% set r.v = r.v + ['a saved Dump to Grid snapshot is pending restore'] %}{% endif %}
                    {% if is_state('binary_sensor.ecco_clock_dongle_free_power_active', 'on') or is_state('binary_sensor.ecco_clock_dongle_free_power_snapshot_valid', 'on') %}{% set r.v = r.v + ['Free Power owns the inverter settings'] %}{% endif %}
                    {% set soc = states('sensor.ecco_clock_dongle_ecco_battery_soc') | float(-1) %}
                    {% set floor_ = states('input_number.ecco_dump_to_grid_schedule_stop_soc') | float(0) %}
                    {% if soc >= 0 and soc <= floor_ %}{% set r.v = r.v + ['battery SOC ' ~ (soc | int) ~ '% is at or below the Stop SOC ' ~ (floor_ | int) ~ '%'] %}{% endif %}
                    {{ r.v | join('; ') }}
              # Let the arm validation finish first: a schedule it refuses gets no readiness alert.
              - delay:
                  seconds: 2
              - if:
                  - condition: template
                    value_template: "{{ blockers | length > 0 }}"
                  - condition: state
                    entity_id: input_boolean.ecco_dump_to_grid_schedule_armed
                    state: "on"
                then:
                  - action: persistent_notification.create
                    data:
                      notification_id: ecco_dump_to_grid_schedule_readiness
                      title: "ECCO: scheduled Dump to Grid is not ready"
                      message: >-
                        Dump to Grid is due at {{ (start_ts | float(0)) | timestamp_custom('%H:%M') }} but would be refused now:
                        {{ blockers }}. ECCO will still try at the start time (and retry transient refusals for
                        up to 10 minutes), but clear these first if you can.
          # R9: a start time that fell before Home Assistant started (or while its start is unknown) is a missed
          # run. It is recorded, notified and disarmed, never started. Listed BEFORE the watchdog's start below.
          - conditions:
              - condition: trigger
                id: watchdog
              - condition: state
                entity_id: script.ecco_dump_to_grid_start_scheduled
                state: "off"
              - condition: template
                value_template: "{{ missed_run }}"
            sequence:
              - action: persistent_notification.create
                data:
                  notification_id: ecco_dump_to_grid_schedule
                  title: "ECCO: scheduled Dump to Grid was missed"
                  message: >-
                    The {{ (start_ts | float(0)) | timestamp_custom('%H:%M') }} scheduled Dump to Grid start
                    {{ 'fell before Home Assistant started.' if ha_start_known else
                    'was not started: the Home Assistant start time was unknown, so ECCO could not tell whether it fell before Home Assistant started (failed closed).' }}
                    It was NOT started and the schedule is disarmed. Arm a new schedule if you still want it.
              # Disarm only the schedule this miss was for (the owner may have re-armed a new one).
              - if:
                  - condition: template
                    value_template: "{{ states('input_datetime.ecco_dump_to_grid_schedule_start') == fired_for }}"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.ecco_dump_to_grid_schedule_armed
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                    data:
                      value: >-
                        {{ 'MISSED - not started after a Home Assistant restart' if ha_start_known else
                        'MISSED - not started: the Home Assistant start time was unknown, so ECCO could not tell whether the start fell before it (failed closed)' }}
          - conditions:
              - condition: trigger
                id: watchdog
              # A start still retrying (for example after a restart recovery) is not a missed start.
              - condition: state
                entity_id: script.ecco_dump_to_grid_start_scheduled
                state: "off"
              # R9 guard: never the start of a missed run (the branch above records it).
              - condition: template
                value_template: "{{ not missed_run }}"
            sequence:
              - action: persistent_notification.create
                data:
                  notification_id: ecco_dump_to_grid_schedule
                  title: "ECCO: scheduled Dump to Grid start was missed"
                  message: >-
                    The {{ (start_ts | float(0)) | timestamp_custom('%H:%M') }} start never ran (still armed at
                    {{ now().strftime('%H:%M') }}). ECCO is starting it now for the rest of the window, ending by
                    {{ (end_ts | float(0)) | timestamp_custom('%H:%M') }}.
              - action: script.ecco_dump_to_grid_start_scheduled
                continue_on_error: true
                data:
                  duration_minutes: "{{ states('input_number.ecco_dump_to_grid_schedule_duration') | int(1) }}"
                  power_w: "{{ states('input_number.ecco_dump_to_grid_schedule_power') | int(500) }}"
                  stop_soc: "{{ states('input_number.ecco_dump_to_grid_schedule_stop_soc') | int(25) }}"
                  window_end_ts: "{{ end_ts }}"
              # Disarm only the schedule this run was for (the owner may have re-armed a new one).
              - if:
                  - condition: template
                    value_template: "{{ states('input_datetime.ecco_dump_to_grid_schedule_start') == fired_for }}"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.ecco_dump_to_grid_schedule_armed
          # Only the start trigger starts on time; a readiness or watchdog tick never falls through to here.
          - conditions:
              - condition: trigger
                id: start
            sequence:
              - action: script.ecco_dump_to_grid_start_scheduled
                continue_on_error: true
                data:
                  duration_minutes: "{{ states('input_number.ecco_dump_to_grid_schedule_duration') | int(1) }}"
                  power_w: "{{ states('input_number.ecco_dump_to_grid_schedule_power') | int(500) }}"
                  stop_soc: "{{ states('input_number.ecco_dump_to_grid_schedule_stop_soc') | int(25) }}"
                  window_end_ts: "{{ end_ts }}"
              - if:
                  - condition: template
                    value_template: "{{ states('input_datetime.ecco_dump_to_grid_schedule_start') == fired_for }}"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.ecco_dump_to_grid_schedule_armed

  # R9: capture the time Home Assistant started, once per start, so the two start paths that run after a
  # restart (the startup recovery and the watchdog) can tell a missed run from a start that fell while Home
  # Assistant was running. Written nowhere else; never derived from any entity's last_changed.
  - id: ecco_dump_to_grid_ha_start_capture
    alias: "ECCO - Capture Home Assistant start time (Dump to Grid)"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      # The clock must be trustworthy before it is captured: a host without an RTC can boot with a clock that is behind, and a capture
      # of that early time would pass the staleness check (last_updated is stamped by the same clock). Wait (bounded) until the dongle's
      # NTP is synced and Home Assistant's time agrees with the dongle's NTP time (published about once a minute, so 120 s is allowed).
      # If that never happens the helper is left alone: unknown or stale, and every guard fails closed.
      - wait_template: >-
          {% set n = states('sensor.ecco_clock_dongle_ntp_time') %}
          {{ is_state('binary_sensor.ecco_clock_dongle_ntp_synced', 'on')
             and (as_timestamp(now()) - as_timestamp(n, 0)) | abs <= 120 }}
        timeout: "00:10:00"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ wait.completed }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.ecco_dump_to_grid_ha_start
            data:
              timestamp: "{{ as_timestamp(now()) | int }}"

  - id: ecco_dump_to_grid_schedule_startup_recovery
    alias: "ECCO - Recover scheduled Dump to Grid after Home Assistant restart"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:20"
      # Give the dongle time to reconnect before judging its state (bounded).
      - wait_template: "{{ states('binary_sensor.ecco_clock_dongle_dump_to_grid_active') in ['on', 'off'] }}"
        timeout: "00:03:00"
        continue_on_timeout: true
      # A restart between an arm and its press must not leave the write enable on (unless a start is running).
      - if:
          - condition: state
            entity_id: script.ecco_dump_to_grid_start_scheduled
            state: "off"
        then:
          - action: switch.turn_off
            continue_on_error: true
            target:
              entity_id: switch.ecco_clock_dongle_dump_to_grid_write_enable
      # R9: give the capture (it waits for a trustworthy clock) a bounded time before judging; unknown after that fails closed.
      - wait_template: >-
          {% set c = states('input_datetime.ecco_dump_to_grid_ha_start') %}
          {% set cs = as_timestamp(c, 0) %}
          {% set o = states.input_datetime.ecco_dump_to_grid_ha_start %}
          {% set u = as_timestamp(o.last_updated, 0) if o is not none else 0 %}
          {{ o is not none and c not in ['unknown', 'unavailable', ''] and cs > 1000000000
             and cs <= as_timestamp(now()) and u > 0 and (u - cs) | abs <= 10 }}
        timeout: "00:03:00"
        continue_on_timeout: true
      - variables:
          fired_for: "{{ states('input_datetime.ecco_dump_to_grid_schedule_start') }}"
          start_ts: "{{ as_timestamp(states('input_datetime.ecco_dump_to_grid_schedule_start'), 0) }}"
          duration_min: "{{ states('input_number.ecco_dump_to_grid_schedule_duration') | int(1) }}"
          power_w: "{{ states('input_number.ecco_dump_to_grid_schedule_power') | int(500) }}"
          stop_soc: "{{ states('input_number.ecco_dump_to_grid_schedule_stop_soc') | int(25) }}"
          end_ts: "{{ start_ts + (duration_min * 60) }}"
          now_ts: "{{ as_timestamp(now()) }}"
          # R9: same definition as the fire automation's guard (the package test pins them identical).
          ha_start_ts: "{{ as_timestamp(states('input_datetime.ecco_dump_to_grid_ha_start'), 0) }}"
          ha_start_known: >-
            {% set c = states('input_datetime.ecco_dump_to_grid_ha_start') %}
            {% set cs = as_timestamp(c, 0) %}
            {% set o = states.input_datetime.ecco_dump_to_grid_ha_start %}
            {% set u = as_timestamp(o.last_updated, 0) if o is not none else 0 %}
            {{ o is not none and c not in ['unknown', 'unavailable', ''] and cs > 1000000000
               and cs <= as_timestamp(now()) and u > 0 and (u - cs) | abs <= 10 }}
          missed_run: "{{ not ha_start_known or (start_ts | float(0)) <= (ha_start_ts | float(0)) }}"
      - choose:
          # Not armed any more, or the on-time start is already running: nothing to recover.
          - conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity_id: input_boolean.ecco_dump_to_grid_schedule_armed
                    state: "off"
                  - condition: state
                    entity_id: script.ecco_dump_to_grid_start_scheduled
                    state: "on"
            sequence: []
          - conditions:
              - condition: template
                value_template: "{{ now_ts < start_ts }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                data:
                  value: >-
                    ARMED AFTER RESTART - waiting for {{ states('input_datetime.ecco_dump_to_grid_schedule_start') }}
          # Restarted while the session runs: it started; record it and disarm.
          - conditions:
              - condition: template
                value_template: "{{ now_ts < end_ts }}"
              - condition: state
                entity_id: binary_sensor.ecco_clock_dongle_dump_to_grid_active
                state: "on"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                data:
                  value: "STARTED OK - running (Home Assistant restarted during the session)"
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.ecco_dump_to_grid_schedule_armed
          # R9: a start time between the Home Assistant start and this evaluation is not a missed run: the normal
          # triggers own it (the on-time start fired, or is still to fire); this recovery neither starts nor disarms it.
          - conditions:
              - condition: template
                value_template: "{{ not missed_run and now_ts < end_ts }}"
            sequence: []
          # R9: a start time before the Home Assistant start (or an unknown / stale capture: fail closed) with the
          # window still open is a missed run. It is NOT started: recorded, notified, and only it is disarmed.
          - conditions:
              - condition: template
                value_template: "{{ now_ts < end_ts }}"
            sequence:
              - action: persistent_notification.create
                data:
                  notification_id: ecco_dump_to_grid_schedule
                  title: "ECCO: scheduled Dump to Grid was missed"
                  message: >-
                    The {{ (start_ts | float(0)) | timestamp_custom('%H:%M') }} scheduled Dump to Grid start
                    {{ 'fell before Home Assistant started.' if ha_start_known else
                    'was not started: the Home Assistant start time was unknown, so ECCO could not tell whether it fell before Home Assistant started (failed closed).' }}
                    It was NOT started and the schedule is disarmed. Arm a new schedule if you still want it.
              - if:
                  - condition: template
                    value_template: "{{ states('input_datetime.ecco_dump_to_grid_schedule_start') == fired_for }}"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.ecco_dump_to_grid_schedule_armed
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ecco_dump_to_grid_schedule_last_result
                    data:
                      value: >-
                        {{ 'MISSED - not started after a Home Assistant restart' if ha_start_known else
                        'MISSED - not started: the Home Assistant start time was unknown, so ECCO could not tell whether the start fell before it (failed closed)' }}
        default:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ecco_dump_to_grid_schedule_armed
          - action: input_text.set_value
            target:
              entity_id: input_text.ecco_dump_to_grid_schedule_last_result
            data:
              value: "MISSED - scheduled Dump to Grid window already expired"
          - action: persistent_notification.create
            data:
              notification_id: ecco_dump_to_grid_schedule
              title: "ECCO: scheduled Dump to Grid was missed"
              message: >-
                Home Assistant was not running for the whole scheduled Dump to Grid window
                (ended {{ (end_ts | float(0)) | timestamp_custom('%H:%M') }}). Nothing was started.

template:
  - sensor:
      - name: ECCO Dump to Grid Schedule Status
        unique_id: ecco_dump_to_grid_schedule_status
        icon: mdi:calendar-clock
        # ACTIVE / STARTING / ARMED / FAILED / COMPLETED / IDLE. FAILED and COMPLETED describe the
        # last scheduled run until the schedule is armed again.
        state: >-
          {% set r = states('input_text.ecco_dump_to_grid_schedule_last_result') %}
          {% if is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'on') %}
            ACTIVE
          {% elif is_state('script.ecco_dump_to_grid_start_scheduled', 'on') %}
            STARTING
          {% elif is_state('input_boolean.ecco_dump_to_grid_schedule_armed', 'on') %}
            ARMED
          {% elif r.startswith('FAILED') or r.startswith('MISSED')
                  or (r.startswith('BLOCKED') and 'already active' not in r) %}
            FAILED
          {% elif r.startswith('STARTED') %}
            COMPLETED
          {% else %}
            IDLE
          {% endif %}
        attributes:
          scheduled_start: "{{ states('input_datetime.ecco_dump_to_grid_schedule_start') }}"
          duration_minutes: "{{ states('input_number.ecco_dump_to_grid_schedule_duration') | int(0) }}"
          requested_power_w: "{{ states('input_number.ecco_dump_to_grid_schedule_power') | int(0) }}"
          requested_stop_soc: "{{ states('input_number.ecco_dump_to_grid_schedule_stop_soc') | int(0) }}"
          last_result: "{{ states('input_text.ecco_dump_to_grid_schedule_last_result') }}"
