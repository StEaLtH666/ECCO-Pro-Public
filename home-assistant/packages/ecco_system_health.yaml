  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: binary_sensor.ecco_clock_dongle_manual_configuration_raw_cache_valid
    sensor:
      - name: "ECCO Health Configuration"
        unique_id: ecco_health_configuration
        # Implements registry/system_health_checks.yaml's config_cache_valid
        # check only (subsystem inverter_configuration). configuration_freshness
        # and configuration_failures_recent (same subsystem) remain
        # unrepresented here - configuration_freshness is already partially
        # covered, in simplified online/offline form, by the Phase 1
        # sensor.ecco_health_communications entity.
        state: >-
          {% set e = 'binary_sensor.ecco_clock_dongle_manual_configuration_raw_cache_valid' %}
          {% set s = states(e) %}
          {% if s in ['unknown', 'unavailable', ''] %}
            UNKNOWN
          {% elif s == 'off' %}
            WARNING
          {% else %}
            HEALTHY
          {% endif %}
        attributes:
          subsystem: inverter_configuration
          partial_implementation: true
          sufficient_for_control_decision: false
          represented_checks: "{{ ['config_cache_valid'] }}"
          not_yet_implemented_checks: >-
            configuration_freshness (partially covered in simplified
            online/offline form by sensor.ecco_health_communications, not the
            full 180s/600s two-tier design); configuration_failures_recent
            (needs a persisted failure-counter baseline mechanism, same
            limitation as manual_write_failures_recent).
          source_entity: binary_sensor.ecco_clock_dongle_manual_configuration_raw_cache_valid
          reason_codes: >-
            {% set s = states('binary_sensor.ecco_clock_dongle_manual_configuration_raw_cache_valid') %}
            {% if s == 'off' %}
              ['CONFIG_CACHE_INVALID']
            {% else %}
              []
            {% endif %}
          blocks_manual_control: >-
            {{ states('binary_sensor.ecco_clock_dongle_manual_configuration_raw_cache_valid') != 'on' }}
          summary: >-
            {% set s = states('binary_sensor.ecco_clock_dongle_manual_configuration_raw_cache_valid') %}
            {% if s in ['unknown', 'unavailable', ''] %}
              Configuration raw-cache validity is unknown/unavailable.
            {% elif s == 'off' %}
              Configuration raw cache is not currently valid - a manual TOU write would be rejected by the firmware.
            {% else %}
              Configuration raw cache is valid.
            {% endif %}
          refreshed_at: "{{ now().isoformat() }}"

  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - sensor.ecco_clock_dongle_ecco_inverter_system_state
          - sensor.ecco_clock_dongle_ecco_inverter_warning
          - sensor.ecco_clock_dongle_ecco_inverter_fault
          - binary_sensor.ecco_clock_dongle_ecco_grid_connected
    sensor:
      - name: "ECCO Health Inverter Telemetry"
        unique_id: ecco_health_inverter_telemetry
        # Implements two registry/system_health_checks.yaml checks:
        # inverter_alarm_fault (text_state on ecco_inverter_system_state,
        # failure_values [alarm, fault]) and inverter_grid_connected
        # (boolean_expected true on the live register-194 binary sensor).
        # telemetry_freshness and telemetry_failures_recent remain
        # unrepresented - telemetry_freshness is already partially covered,
        # in simplified online/offline form, by the Phase 1
        # sensor.ecco_health_communications entity. inverter_grid_connected
        # is represented here using the already-live-proven register-194
        # binary sensor used by the production dashboard.
        state: >-
          {% set e1 = 'sensor.ecco_clock_dongle_ecco_inverter_system_state' %}
          {% set raw1 = states(e1) %}
          {% set s1 = raw1 | lower %}
          {% if raw1 in ['unknown', 'unavailable', ''] %}
            {% set rank1 = 2 %}{% set state1 = 'UNKNOWN' %}
          {% elif s1 in ['alarm', 'fault'] %}
            {% set rank1 = 3 %}{% set state1 = 'FAILED' %}
          {% else %}
            {% set rank1 = 0 %}{% set state1 = 'HEALTHY' %}
          {% endif %}
          {% set e2 = 'binary_sensor.ecco_clock_dongle_ecco_grid_connected' %}
          {% set s2 = states(e2) %}
          {% if s2 in ['unknown', 'unavailable', ''] %}
            {% set rank2 = 2 %}{% set state2 = 'UNKNOWN' %}
          {% elif s2 == 'off' %}
            {% set rank2 = 2 %}{% set state2 = 'WARNING' %}
          {% else %}
            {% set rank2 = 0 %}{% set state2 = 'HEALTHY' %}
          {% endif %}
          {% set max_rank = [rank1, rank2] | max %}
          {% set definite = {0: 'HEALTHY', 1: 'DEGRADED', 2: 'WARNING', 3: 'FAILED'}[max_rank] %}
          {% set states_at_max = [] %}
          {% if rank1 == max_rank %}{% set states_at_max = states_at_max + [state1] %}{% endif %}
          {% if rank2 == max_rank %}{% set states_at_max = states_at_max + [state2] %}{% endif %}
          {% if definite in states_at_max %}
            {{ definite }}
          {% elif 'UNKNOWN' in states_at_max %}
            UNKNOWN
          {% else %}
            {{ definite }}
          {% endif %}
        attributes:
          subsystem: inverter_telemetry
          partial_implementation: true
          sufficient_for_control_decision: false
          represented_checks: "{{ ['inverter_alarm_fault', 'inverter_grid_connected'] }}"
          not_yet_implemented_checks: >-
            telemetry_freshness (partially covered in simplified
            online/offline form by sensor.ecco_health_communications, not the
            full 60s/180s two-tier design); telemetry_failures_recent (needs
            a persisted failure-counter baseline mechanism).
          source_entities: >-
            {{ ['sensor.ecco_clock_dongle_ecco_inverter_system_state',
                'binary_sensor.ecco_clock_dongle_ecco_grid_connected'] }}
          inverter_warning_text_informational: "{{ states('sensor.ecco_clock_dongle_ecco_inverter_warning') }}"
          inverter_fault_text_informational: "{{ states('sensor.ecco_clock_dongle_ecco_inverter_fault') }}"
          informational_note: >-
            The warning/fault text attributes above are surfaced for
            visibility only - they are not part of the registered
            inverter_alarm_fault check (which evaluates the system-state
            enum only, per registry/system_health_checks.yaml) and do not
            independently affect this sensor's state.
          reason_codes: >-
            {% set e = 'sensor.ecco_clock_dongle_ecco_inverter_system_state' %}
            {% set raw = states(e) %}
            {% set s = raw | lower %}
            {% set codes = [] %}
            {% if raw not in ['unknown', 'unavailable', ''] and s in ['alarm', 'fault'] %}
              {% set codes = codes + ['INVERTER_ALARM_OR_FAULT'] %}
            {% endif %}
            {% if states('binary_sensor.ecco_clock_dongle_ecco_grid_connected') == 'off' %}
              {% set codes = codes + ['INVERTER_GRID_DISCONNECTED'] %}
            {% endif %}
            {{ codes }}
          blocks_manual_control: >-
            {% set e = 'sensor.ecco_clock_dongle_ecco_inverter_system_state' %}
            {% set raw = states(e) %}
            {{ raw in ['unknown', 'unavailable', ''] or (raw | lower) in ['alarm', 'fault'] }}
          refreshed_at: "{{ now().isoformat() }}"

  # ===========================================================================
  # PHASE 4 (FB-B3) - supervision / fallback. STAGED / NOT LIVE-PROVEN.
  # Inputs are the display-layer sensors in ecco_fallback_status.yaml.
  # ===========================================================================

  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sensor.ecco_supervision_status
    sensor:
      - name: "ECCO Health Supervision"
        unique_id: ecco_health_supervision
        state: >-
          {%- set d = states('sensor.ecco_supervision_status') -%}
          {%- if d == 'Healthy' -%}HEALTHY
          {%- elif d in ['Recovering', 'Awaiting Heartbeat'] -%}DEGRADED
          {%- elif d == 'Suspect' -%}WARNING
          {%- elif d == 'Lost' -%}WARNING
          {%- else -%}UNKNOWN
          {%- endif -%}
        attributes:
          subsystem: supervision
          partial_implementation: true
          sufficient_for_control_decision: false
          reason_codes: >-
            {%- set d = states('sensor.ecco_supervision_status') -%}
            {%- if d == 'Healthy' -%}[]
            {%- elif d == 'Recovering' -%}['SUPERVISION_NOT_STABLE']
            {%- elif d == 'Awaiting Heartbeat' -%}['SUPERVISION_STARTING']
            {%- elif d == 'Suspect' -%}['SUPERVISION_SUSPECT']
            {%- elif d == 'Lost' -%}['SUPERVISION_LOST']
            {%- else -%}['SUPERVISION_UNAVAILABLE']
            {%- endif -%}
          represented_checks: "{{ ['supervision_status_available', 'supervision_startup', 'supervision_not_stable', 'supervision_suspect', 'supervision_lost'] }}"
          source_entity: sensor.ecco_supervision_status
          blocks_manual_control: false
          affects_forecast: false
          summary: "{{ state_attr('sensor.ecco_supervision_status', 'subline') }}"

  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sensor.ecco_fallback_status_code
      - trigger: time_pattern
        minutes: "/1"
    sensor:
      - name: "ECCO Health Fallback"
        unique_id: ecco_health_fallback
        # lease_restoring is DEGRADED while a temporary operation finishes
        # restoring, and escalates to WARNING once the status code has held
        # that value for 10 minutes (last_changed basis; see file header).
        state: >-
          {%- set c = states('sensor.ecco_fallback_status_code') -%}
          {%- if c in ['match', 'paused'] -%}HEALTHY
          {%- elif c in ['not_captured', 'invalidated', 'drift_values'] -%}DEGRADED
          {%- elif c == 'lease_restoring' -%}
            {%- if (as_timestamp(now()) - as_timestamp(states['sensor.ecco_fallback_status_code'].last_changed)) >= 600 -%}WARNING
            {%- else -%}DEGRADED
            {%- endif -%}
          {%- elif c in ['drift_context', 'drift_export', 'profile_unusable', 'save_unconfirmed', 'profile_regressed', 'live_out_of_domain', 'lease_unreadable', 'lease_lockout', 'shadow_episode'] -%}WARNING
          {%- else -%}UNKNOWN
          {%- endif -%}
        attributes:
          subsystem: fallback
          partial_implementation: true
          sufficient_for_control_decision: false
          represented_checks: "{{ ['fallback_status_available', 'fallback_live_unknown', 'fallback_not_captured', 'fallback_invalidated', 'fallback_drifted', 'fallback_context_changed', 'fallback_export_enabled', 'fallback_unusable', 'fallback_save_unconfirmed', 'fallback_profile_regressed', 'fallback_live_out_of_domain', 'fallback_blocked_by_lease', 'fallback_shadow_episode'] }}"
          not_yet_implemented_checks: >-
            The FB-E/F recovery-record checks are reserved and not
            registered until those stages land.
          source_entity: sensor.ecco_fallback_status_code
          reason_codes: >-
            {%- set c = states('sensor.ecco_fallback_status_code') -%}
            {%- if c in ['match', 'paused'] -%}[]
            {%- elif c == 'live_unknown' -%}['FALLBACK_LIVE_UNKNOWN']
            {%- elif c == 'not_captured' -%}['FALLBACK_NOT_CAPTURED']
            {%- elif c == 'invalidated' -%}['FALLBACK_INVALIDATED']
            {%- elif c == 'drift_values' -%}['FALLBACK_DRIFTED']
            {%- elif c == 'drift_context' -%}['FALLBACK_CONTEXT_CHANGED']
            {%- elif c == 'drift_export' -%}['FALLBACK_EXPORT_ENABLED']
            {%- elif c == 'profile_unusable' -%}['FALLBACK_UNUSABLE']
            {%- elif c == 'save_unconfirmed' -%}['FALLBACK_SAVE_UNCONFIRMED']
            {%- elif c == 'profile_regressed' -%}['FALLBACK_REGRESSED']
            {%- elif c == 'live_out_of_domain' -%}['FALLBACK_LIVE_OUT_OF_DOMAIN']
            {%- elif c in ['lease_unreadable', 'lease_lockout', 'lease_restoring'] -%}['FALLBACK_BLOCKED_BY_LEASE']
            {%- elif c == 'shadow_episode' -%}['FAILBACK_SHADOW_EPISODE']
            {%- else -%}['FALLBACK_STATUS_UNAVAILABLE']
            {%- endif -%}
          blocks_manual_control: false
          affects_forecast: false
          summary: "{{ state_attr('sensor.ecco_fallback_status', 'subline') }}"
