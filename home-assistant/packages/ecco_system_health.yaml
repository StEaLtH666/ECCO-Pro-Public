# ECCO Pro - System Health (Task 006)
#
# *** PHASE 1 LIVE-PROVEN 2026-09-18 - READ-ONLY PARTIAL HEALTH SURFACE ***
#
# Phase 1 is intentionally limited to three read-only entities whose
# dependencies are already used by live ECCO packages. Task 007 / Phase 3
# stages five additional read-only subsystem sensors below. The package is
# referenced by deployment/ha-manifest.yaml and MUST NOT be interpreted as
# complete system health or as permission to perform inverter writes.
#
# READ ONLY. Every sensor below is a template sensor/binary_sensor
# whose state/availability is a pure Jinja expression over existing
# entities. This file contains:
#   - no service calls (no modbus_client/esphome/button.press)
#   - no shell_command:/command_line: platforms
#   - no homeassistant.restart or config-reload calls
#   - no automation: blocks (nothing here can change another entity's state)
#
# This is a DELIBERATELY PARTIAL implementation of the full design in
# docs/SYSTEM_HEALTH_ARCHITECTURE.md and docs/SYSTEM_HEALTH_HA_DESIGN.md
# - only the three entities below could be written against entities
# this repository's OWN other packages already define with confidence.
# The full 43-check design remains data-only in
# registry/system_health_checks.yaml until the entity IDs it also
# depends on (ESPHome auto-generated ids for manual_write_in_progress,
# correction_in_progress, free_power_operation_in_progress,
# free_power_snapshot_valid, rtc_stall_detected, etc.) are live-verified
# - see docs/SYSTEM_HEALTH_HA_DESIGN.md "Live validation checklist".
#
# *** TASK 007 / PHASE 3 - LIVE-PROVEN NORMAL PATHS 2026-09-19 ***
#
# The five sensors below (ecco_health_manual_write_system, ecco_health_rtc,
# ecco_health_free_power, ecco_health_configuration,
# ecco_health_inverter_telemetry) are NEW as of Task 007 and consume the five
# Phase 2 firmware diagnostics (live-proven 2026-09-18) plus rtc_stall_detected,
# ntp_synced and the inverter system-state text sensor (all already live per
# docs/SYSTEM_HEALTH_HA_DESIGN.md). They implement the exact checks already
# specified in registry/system_health_checks.yaml /
# registry/health_reason_codes.yaml - see docs/SYSTEM_HEALTH_ARCHITECTURE.md
# "Phase 3" section for which check ids each sensor represents and which
# remain unrepresented.
#
# STATUS: LIVE-PROVEN for deployment/registration, idle evaluation, and
# normal RTC-correction, manual-write, and Free-Power transaction cycles on
# 2026-09-19. The deliberate 60s/180s stuck-duration failure thresholds have
# NOT been forced and remain unproven. See docs/SYSTEM_HEALTH_HA_DESIGN.md.
#
# Every new sensor here is READ-ONLY (template sensor, no service calls) and
# NON-AUTHORITATIVE for control - none of them is, feeds, or gates
# binary_sensor.ecco_manual_control_ready, which remains absent from this
# file. Each new sensor carries partial_implementation: true and an explicit
# list of which checks of its subsystem it does and does not represent.
#
# Current-operation duration (manual write, RTC correction, Free Power
# operation, Free Power snapshot recovery) is computed from
# states.<entity>.last_changed via as_timestamp(now()) - as_timestamp(...).
# This is NOT proven restart-safe: if Home Assistant restarts, or the
# ESPHome device disconnects/reconnects, while one of these booleans is
# already "on", last_changed reflects when the entity's state was
# re-established after that event, not necessarily the true original start
# of the underlying firmware transaction - so a duration computed this way
# can UNDER-report how long a transaction has really been running across
# such an event. No undocumented history/recorder API is used; this is the
# entity's own current-state metadata only. See docs/SYSTEM_HEALTH_HA_DESIGN.md
# "Phase 3" section for the full caveat. Every sensor below surfaces
# unknown/unavailable source-entity states as its own UNKNOWN state rather
# than silently treating them as healthy.
#
# REVIEW HARDENING: the three duration-based trigger-template sensors also
# receive a once-per-minute time_pattern trigger. Trigger-based Template
# entities only re-render when one of their explicit triggers fires, so a
# state-only trigger would never cross the 60s/180s stuck thresholds while
# the underlying boolean remained continuously ON. The one-minute cadence is
# diagnostic only; blocking begins immediately from the source-state trigger.
# The duration-based sensors deliberately do not carry a refreshed_at=now()
# attribute, avoiding a forced recorder-visible attribute change every minute
# while the underlying subsystem is idle.
#
# *** TASK 006A SAFETY FIX ***
# There is deliberately NO entity named binary_sensor.ecco_manual_control_ready
# in this file. That is the FINAL, complete-gate entity name reserved by
# docs/SYSTEM_HEALTH_HA_DESIGN.md's entity plan, and it must never exist
# until every required blocking precondition (see
# health/system_health.py's required_control_checks()) is implemented
# and live-verified - not just the four this partial package evaluates.
# The entity below uses unique_id ecco_manual_control_ready_reference.
# Home Assistant generates a deliberately verbose entity_id from its display
# name, so it cannot be mistaken for the reserved final gate by a future
# automation/dashboard author.
# DO NOT USE THIS ENTITY TO DECIDE WHETHER TO ENABLE ANY MANUAL INVERTER
# CONTROL. It evaluates 4 of the required checks only; see its own
# `unevaluated_required_preconditions` attribute for the rest.
#
# *** PHASE 4 (FB-B3) - STAGED / NOT LIVE-PROVEN ***
#
# ecco_health_supervision and ecco_health_fallback (end of file) are the two
# FB-B3 health sensors. They are read-only relabels of the display layer in
# ecco_fallback_status.yaml (sensor.ecco_supervision_status and
# sensor.ecco_fallback_status_code) onto the health vocabulary - never of the
# firmware UPPER_SNAKE enums directly, so no reason-code-shaped literal can
# collide with a firmware value. Both subsystems (supervision, fallback) are
# STANDARD tier (supervision Lost reports WARNING, per FINAL 9.7; it becomes
# FAILED only when the subsystem becomes CRITICAL at FB-F). Neither blocks
# manual control and neither is part of binary_sensor.ecco_manual_control_ready.
# The fallback sensor carries a time_pattern trigger only so lease_restoring
# can escalate DEGRADED -> WARNING after 10 minutes (same last_changed caveat
# as the Phase 3 duration sensors: NOT proven restart-safe, can under-report).
#
# FB-C3 (STAGED / NOT LIVE-PROVEN): the display cause shadow_episode (an open supervision-loss SHADOW episode,
# diagnostic only, nothing was written) reports WARNING with the single reason code FAILBACK_SHADOW_EPISODE and the
# check fallback_shadow_episode. A shadow verdict (BLOCKED_* / WAIT_* / WOULD_*) never reaches this file: only the
# canonical status code does, and a shadow BLOCKED_* verdict never makes it Blocked (S5 Part A H4).

template:
  # Keep the partial reference gate state-based. It only derives state from
  # existing Home Assistant entities, so explicit triggers add no value here;
  # state-based template entities automatically re-render when referenced
  # entities change. This also avoids the live-observed 2026-09-18 behaviour
  # where the trigger-based form passed ha core check but did not register an
  # entity, with no related template error in the Home Assistant log.
  - binary_sensor:
      - name: "ECCO Manual Control Ready (PARTIAL - REFERENCE ONLY, DO NOT USE TO GATE CONTROLS)"
        unique_id: ecco_manual_control_ready_reference
        device_class: connectivity
        # Task 006A fail-closed fix: this partial implementation only
        # evaluates 4 of the checks health/system_health.py's
        # required_control_checks() identifies as capable of blocking
        # manual control (see registry/system_health_checks.yaml and
        # registry/health_reason_codes.yaml for the full required set -
        # every check with a blocks_manual_control: true outcome). Per
        # the fail-closed rule (docs/SYSTEM_HEALTH_ARCHITECTURE.md
        # section 12), a missing/unevaluated required precondition must
        # never be silently treated as satisfied - so this entity is
        # DELIBERATELY NOT named ecco_manual_control_ready, is marked
        # sufficient_for_control_decision: false unconditionally, and
        # its `state` reflects only "the 4 checked preconditions are
        # fine", never "manual control is ready" as a whole.
        state: >-
          {% set runtime_ready = states('binary_sensor.ecco_runtime_configuration_ready') == 'on' %}
          {% set limit_available = states('sensor.ecco_config_maximum_grid_charge_power') not in ['unknown','unavailable','none',''] %}
          {% set telemetry_online = states('binary_sensor.ecco_clock_dongle_telemetry_online') == 'on' %}
          {% set config_online = states('binary_sensor.ecco_clock_dongle_configuration_online') == 'on' %}
          {{ runtime_ready and limit_available and telemetry_online and config_online }}
        attributes:
          sufficient_for_control_decision: false
          warning: >-
            DO NOT USE THIS ENTITY TO ENABLE OR GATE ANY MANUAL INVERTER
            CONTROL. It is a partial reference implementation evaluating
            4 of the required preconditions only - see
            unevaluated_required_preconditions.
          evaluated_preconditions: >-
            {{ ['runtime_configuration_ready',
                'grid_charge_limit_available',
                'telemetry_online',
                'configuration_online'] }}
          unevaluated_required_preconditions: >-
            manual_write_in_progress (and its stuck-duration tier),
            correction_in_progress (and its stuck-duration tier),
            free_power_operation_in_progress (and its stuck-duration tier),
            free_power_snapshot_pending_recovery / free_power_active,
            inverter_alarm_or_fault, config_cache_valid - see
            docs/SYSTEM_HEALTH_HA_DESIGN.md "Live validation checklist"
            item 1 for why these are not yet evaluated by this partial
            implementation. Per the fail-closed rule, treat ANY of these
            as blocking until they are actually implemented and checked.
          partial_implementation: true
          refreshed_at: "{{ now().isoformat() }}"

  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - binary_sensor.ecco_clock_dongle_telemetry_online
          - binary_sensor.ecco_clock_dongle_configuration_online
          - sensor.ecco_clock_dongle_last_telemetry_update
          - sensor.ecco_clock_dongle_last_configuration_update
    sensor:
      - name: "ECCO Health Communications"
        unique_id: ecco_health_communications
        # Implements the telemetry_freshness / configuration_freshness
        # checks (registry/system_health_checks.yaml) directly - the
        # one subsystem whose HA entities this audit is most confident
        # about, since they are the same raw dongle sensors every other
        # ECCO HA package already depends on.
        state: >-
          {% set telemetry_online = states('binary_sensor.ecco_clock_dongle_telemetry_online') == 'on' %}
          {% set config_online = states('binary_sensor.ecco_clock_dongle_configuration_online') == 'on' %}
          {% if not telemetry_online or not config_online %}
            FAILED
          {% else %}
            HEALTHY
          {% endif %}
        attributes:
          reason_codes: >-
            {% set telemetry_online = states('binary_sensor.ecco_clock_dongle_telemetry_online') == 'on' %}
            {% set config_online = states('binary_sensor.ecco_clock_dongle_configuration_online') == 'on' %}
            {% set codes = [] %}
            {% if not telemetry_online %}{% set codes = codes + ['MODBUS_TELEMETRY_STALE'] %}{% endif %}
            {% if not config_online %}{% set codes = codes + ['MODBUS_CONFIG_STALE'] %}{% endif %}
            {{ codes }}
          summary: >-
            {% set telemetry_online = states('binary_sensor.ecco_clock_dongle_telemetry_online') == 'on' %}
            {% set config_online = states('binary_sensor.ecco_clock_dongle_configuration_online') == 'on' %}
            {% if telemetry_online and config_online %}
              Telemetry and configuration polling both online.
            {% elif not telemetry_online and not config_online %}
              Both telemetry and configuration polling are offline.
            {% elif not telemetry_online %}
              Telemetry polling offline; configuration polling online.
            {% else %}
              Configuration polling offline; telemetry polling online.
            {% endif %}
          last_telemetry_update: "{{ states('sensor.ecco_clock_dongle_last_telemetry_update') }}"
          last_configuration_update: "{{ states('sensor.ecco_clock_dongle_last_configuration_update') }}"
          blocks_manual_control: true
          note: >-
            This entity reports online/offline only (a binary online
            flag, not the two-tier 60s/180s and 180s/600s age brackets
            from docs/SYSTEM_HEALTH_ARCHITECTURE.md section 5) - Home
            Assistant templates do not have a clean way to compute "age
            since a text-formatted timestamp string" without a
            reference-vs-now duration helper this design has not yet
            live-verified; the full DEGRADED/FAILED two-tier version is
            DESIGNED, not implemented here.
          refreshed_at: "{{ now().isoformat() }}"

  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: binary_sensor.ecco_runtime_configuration_ready
    sensor:
      - name: "ECCO Health Runtime Configuration"
        unique_id: ecco_health_runtime_configuration
        # Thin relabel of the already-existing, already-live
        # binary_sensor.ecco_runtime_configuration_ready
        # (home-assistant/packages/ecco_runtime_config.yaml) onto the
        # health-subsystem vocabulary - demonstrates runtime_config_ready
        # (registry/system_health_checks.yaml) without new logic.
        state: >-
          {% if states('binary_sensor.ecco_runtime_configuration_ready') == 'on' %}
            HEALTHY
          {% elif states('binary_sensor.ecco_runtime_configuration_ready') in ['unknown','unavailable'] %}
            UNKNOWN
          {% else %}
            FAILED
          {% endif %}
        attributes:
          reason_codes: >-
            {% if states('binary_sensor.ecco_runtime_configuration_ready') == 'on' %}
              []
            {% elif states('binary_sensor.ecco_runtime_configuration_ready') in ['unknown','unavailable'] %}
              ['RUNTIME_CONFIG_UNAVAILABLE']
            {% else %}
              ['RUNTIME_CONFIG_NOT_READY']
            {% endif %}
          source_entity: binary_sensor.ecco_runtime_configuration_ready
          blocks_manual_control: true
          affects_forecast: true
          refreshed_at: "{{ now().isoformat() }}"

  # ===========================================================================
  # TASK 007 / PHASE 3 - LIVE-PROVEN NORMAL PATHS. See the file header comment
  # and docs/SYSTEM_HEALTH_HA_DESIGN.md "Phase 3" section.
  # ===========================================================================

  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: binary_sensor.ecco_clock_dongle_manual_write_in_progress
      - trigger: time_pattern
        minutes: "/1"
    sensor:
      - name: "ECCO Health Manual Write System"
        unique_id: ecco_health_manual_write_system
        # Implements registry/system_health_checks.yaml's manual_write_duration
        # check (subsystem manual_write_system) only. Duration is computed from
        # states.<entity>.last_changed - see the file header's restart/reconnect
        # caveat. manual_write_failures_recent and manual_write_arm_unexpected
        # (same subsystem) are NOT represented - see
        # not_yet_implemented_checks below.
        state: >-
          {% set e = 'binary_sensor.ecco_clock_dongle_manual_write_in_progress' %}
          {% set s = states(e) %}
          {% if s in ['unknown', 'unavailable', ''] %}
            UNKNOWN
          {% elif s == 'off' %}
            HEALTHY
          {% else %}
            {% set duration = as_timestamp(now()) - as_timestamp(states[e].last_changed) %}
            {% if duration >= 180 %}
              FAILED
            {% else %}
              WARNING
            {% endif %}
          {% endif %}
        attributes:
          subsystem: manual_write_system
          partial_implementation: true
          sufficient_for_control_decision: false
          represented_checks: "{{ ['manual_write_duration'] }}"
          not_yet_implemented_checks: >-
            manual_write_failures_recent (needs a persisted failure-counter
            baseline mechanism across Home Assistant restarts - not yet
            designed/verified, see docs/SYSTEM_HEALTH_HA_DESIGN.md live
            validation checklist item 3); manual_write_arm_unexpected (needs
            manual_config_write_enable duration tracking against
            manual_write_in_progress - not yet implemented).
          source_entity: binary_sensor.ecco_clock_dongle_manual_write_in_progress
          reason_codes: >-
            {% set e = 'binary_sensor.ecco_clock_dongle_manual_write_in_progress' %}
            {% set s = states(e) %}
            {% if s in ['unknown', 'unavailable', ''] %}
              []
            {% elif s == 'off' %}
              []
            {% else %}
              {% set duration = as_timestamp(now()) - as_timestamp(states[e].last_changed) %}
              {% if duration >= 180 %}
                ['MANUAL_WRITE_STUCK']
              {% else %}
                ['MANUAL_WRITE_ACTIVE']
              {% endif %}
            {% endif %}
          blocks_manual_control: >-
            {{ states('binary_sensor.ecco_clock_dongle_manual_write_in_progress') != 'off' }}
          current_operation_duration_seconds: >-
            {% set e = 'binary_sensor.ecco_clock_dongle_manual_write_in_progress' %}
            {% if states(e) == 'on' %}
              {{ (as_timestamp(now()) - as_timestamp(states[e].last_changed)) | round(0) }}
            {% else %}
              none
            {% endif %}
          duration_basis: "states.<entity>.last_changed - see file header for the restart/reconnect caveat; NOT proven restart-safe."
          summary: >-
            {% set e = 'binary_sensor.ecco_clock_dongle_manual_write_in_progress' %}
            {% set s = states(e) %}
            {% if s in ['unknown', 'unavailable', ''] %}
              Manual write state is unknown/unavailable.
            {% elif s == 'off' %}
              No manual write in progress.
            {% else %}
              {% set duration = as_timestamp(now()) - as_timestamp(states[e].last_changed) %}
              {% if duration >= 180 %}
                Manual write has been in progress for {{ duration | round(0) }}s - beyond the 180s expected worst case.
              {% else %}
                Manual write in progress for {{ duration | round(0) }}s - within normal range.
              {% endif %}
            {% endif %}

  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - binary_sensor.ecco_clock_dongle_rtc_correction_in_progress
          - binary_sensor.ecco_clock_dongle_rtc_stall_detected
          - binary_sensor.ecco_clock_dongle_ntp_synced
      - trigger: time_pattern
        minutes: "/1"
      # rtc_correction_failures_recent (FB-D1 follow-up): a change of the
      # firmware's cumulative "Failed Corrections Since Boot" counter. Only
      # a numeric-to-numeric INCREASE seen on this trigger is a failure (see
      # the entity comment below); the id is what the templates test.
      - trigger: state
        id: rtc_failed_corrections_changed
        entity_id: sensor.ecco_clock_dongle_failed_corrections_since_boot
      # Re-renders exactly 1800 s after the counter's last change, so the
      # warning window closes on time without waiting for another counter
      # update. The one-minute time_pattern above is the backstop (for
      # example after a Home Assistant restart, which cancels this timer).
      - trigger: state
        id: rtc_failure_window_elapsed
        entity_id: sensor.ecco_clock_dongle_failed_corrections_since_boot
        for:
          seconds: 1800
    sensor:
      - name: "ECCO Health RTC"
        unique_id: ecco_health_rtc
        # Implements four registry checks under subsystem rtc_time:
        # rtc_correction_duration (transaction_state, 180s stuck bracket),
        # rtc_stall_detected (boolean_expected: false), rtc_ntp_synced
        # (boolean_expected: true) and rtc_correction_failures_recent
        # (failure_counter_delta, 1800 s window, WARNING). Aggregates using
        # the same rank/tie-break rule as health/system_health.py's
        # evaluate_subsystem() / _resolve_flavor_at_rank(): the worst
        # severity rank wins, and at a shared rank a real finding
        # (WARNING/FAILED/DEGRADED) always beats UNKNOWN. rtc_read_freshness
        # and rtc_drift_uncorrected (same subsystem) are deliberately NOT
        # represented - see not_yet_implemented_checks. Correction COUNT
        # alone is never evaluated here - only correction_in_progress's
        # CURRENT duration and the FAILED-correction counter - per Task
        # 007's explicit instruction that frequent successful corrections
        # are expected on this installation and must not be treated as a
        # fault.
        #
        # rtc_correction_failures_recent: the firmware increments
        # failed_corrections when a correction fails after its retries,
        # fails on communication errors, or is released by the 90 s RTC
        # deadline breaker ("ABORTED - correction exceeded its deadline").
        # Its sensor publishes every 60 s and restarts at 0 on every ESP
        # boot. A failure is ONLY an observed numeric-to-numeric increase
        # on the rtc_failed_corrections_changed trigger: a reboot reset
        # (N -> 0, or N -> unavailable -> 0) and the first value after a
        # Home Assistant restart (from unknown or none) never count. The
        # time Home Assistant saw the increase is kept in last_failure_at
        # (trigger-based template entities restore their state and
        # attributes after a Home Assistant restart), and the check reports
        # WARNING / RTC_CORRECTION_FAILURES_RECENT while less than 1800 s
        # have passed since it; each further increase restarts the window.
        # An unreadable counter with no failure in the window is UNKNOWN,
        # never HEALTHY. Not observable, so never reported: a failure that
        # happens while the counter is unavailable to Home Assistant, or
        # while Home Assistant is down. last_failure_at can trail the
        # firmware event by up to the sensor's 60 s publish interval.
        state: >-
          {% set e1 = 'binary_sensor.ecco_clock_dongle_rtc_correction_in_progress' %}
          {% set s1 = states(e1) %}
          {% if s1 in ['unknown', 'unavailable', ''] %}
            {% set rank1 = 2 %}{% set state1 = 'UNKNOWN' %}
          {% elif s1 == 'off' %}
            {% set rank1 = 0 %}{% set state1 = 'HEALTHY' %}
          {% else %}
            {% set dur1 = as_timestamp(now()) - as_timestamp(states[e1].last_changed) %}
            {% if dur1 >= 180 %}
              {% set rank1 = 3 %}{% set state1 = 'FAILED' %}
            {% else %}
              {% set rank1 = 2 %}{% set state1 = 'WARNING' %}
            {% endif %}
          {% endif %}
          {% set e2 = 'binary_sensor.ecco_clock_dongle_rtc_stall_detected' %}
          {% set s2 = states(e2) %}
          {% if s2 in ['unknown', 'unavailable', ''] %}
            {% set rank2 = 2 %}{% set state2 = 'UNKNOWN' %}
          {% elif s2 == 'on' %}
            {% set rank2 = 2 %}{% set state2 = 'WARNING' %}
          {% else %}
            {% set rank2 = 0 %}{% set state2 = 'HEALTHY' %}
          {% endif %}
          {% set e3 = 'binary_sensor.ecco_clock_dongle_ntp_synced' %}
          {% set s3 = states(e3) %}
          {% if s3 in ['unknown', 'unavailable', ''] %}
            {% set rank3 = 2 %}{% set state3 = 'UNKNOWN' %}
          {% elif s3 == 'off' %}
            {% set rank3 = 2 %}{% set state3 = 'WARNING' %}
          {% else %}
            {% set rank3 = 0 %}{% set state3 = 'HEALTHY' %}
          {% endif %}
          {% set e4 = 'sensor.ecco_clock_dongle_failed_corrections_since_boot' %}
          {% set s4 = states(e4) %}
          {% set t = trigger if trigger is defined else none %}
          {% set fresh = t is not none and t.id is defined and t.id == 'rtc_failed_corrections_changed' and t.from_state is not none and t.to_state is not none and (t.from_state.state | float(-1)) >= 0 and (t.to_state.state | float(-1)) > (t.from_state.state | float(-1)) %}
          {% set prev = this.attributes.get('last_failure_at') if this is defined else none %}
          {% set lf_ts = as_timestamp(t.to_state.last_changed) if fresh else as_timestamp(prev, none) %}
          {% if lf_ts is not none and as_timestamp(now()) - lf_ts < 1800 %}
            {% set rank4 = 2 %}{% set state4 = 'WARNING' %}
          {% elif (s4 | float(-1)) < 0 %}
            {% set rank4 = 2 %}{% set state4 = 'UNKNOWN' %}
          {% else %}
            {% set rank4 = 0 %}{% set state4 = 'HEALTHY' %}
          {% endif %}
          {% set max_rank = [rank1, rank2, rank3, rank4] | max %}
          {% set definite = {0: 'HEALTHY', 1: 'DEGRADED', 2: 'WARNING', 3: 'FAILED'}[max_rank] %}
          {% set states_at_max = [] %}
          {% if rank1 == max_rank %}{% set states_at_max = states_at_max + [state1] %}{% endif %}
          {% if rank2 == max_rank %}{% set states_at_max = states_at_max + [state2] %}{% endif %}
          {% if rank3 == max_rank %}{% set states_at_max = states_at_max + [state3] %}{% endif %}
          {% if rank4 == max_rank %}{% set states_at_max = states_at_max + [state4] %}{% endif %}
          {% if definite in states_at_max %}
            {{ definite }}
          {% elif 'UNKNOWN' in states_at_max %}
            UNKNOWN
          {% else %}
            {{ definite }}
          {% endif %}
        attributes:
          subsystem: rtc_time
          partial_implementation: true
          sufficient_for_control_decision: false
          represented_checks: "{{ ['rtc_correction_duration', 'rtc_stall_detected', 'rtc_ntp_synced', 'rtc_correction_failures_recent'] }}"
          not_yet_implemented_checks: >-
            rtc_read_freshness (needs a live clock_difference_valid
            age/timestamp entity, not confirmed available);
            rtc_drift_uncorrected (needs live correction_threshold and
            cooldown_until_ms entities, neither of which is currently exposed
            to Home Assistant - the raw clock_difference value is surfaced
            below as an informational attribute only, NOT evaluated against a
            threshold here).
          correction_count_note: >-
            Correction COUNT/frequency is intentionally never evaluated by
            this sensor - frequent successful corrections are expected on
            this installation and are not a fault by themselves. Only
            correction_in_progress's current duration is evaluated.
          source_entities: >-
            {{ ['binary_sensor.ecco_clock_dongle_rtc_correction_in_progress',
                'binary_sensor.ecco_clock_dongle_rtc_stall_detected',
                'binary_sensor.ecco_clock_dongle_ntp_synced',
                'sensor.ecco_clock_dongle_failed_corrections_since_boot'] }}
          clock_difference_seconds_informational: "{{ states('sensor.ecco_clock_dongle_clock_difference') }}"
          # rtc_correction_failures_recent detail. last_failure_at and
          # last_result are captured when an increase is seen and kept
          # (restored after a Home Assistant restart) until the next one;
          # last_result is the firmware's "Last Correction Result" text at
          # that moment (for a deadline-breaker release it begins with
          # ABORTED). The lock max age and the counter are read live.
          last_failure_at: >-
            {% set t = trigger if trigger is defined else none %}
