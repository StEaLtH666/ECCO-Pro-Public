  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - binary_sensor.ecco_clock_dongle_free_power_operation_in_progress
          - binary_sensor.ecco_clock_dongle_free_power_active
          - binary_sensor.ecco_clock_dongle_free_power_snapshot_valid
      - trigger: time_pattern
        minutes: "/1"
    sensor:
      - name: "ECCO Health Free Power"
        unique_id: ecco_health_free_power
        # Implements three registry checks under subsystem free_power:
        # free_power_operation_duration (transaction_state, 180s stuck
        # bracket), free_power_active_state (boolean_expected: false) and
        # free_power_snapshot_recovery (derived transaction_state: snapshot
        # valid AND NOT active, 60s stuck bracket). These three inputs are
        # deliberately evaluated as separate signals and never conflated -
        # active/operation-in-progress/snapshot-valid each has its own
        # meaning per docs/SYSTEM_HEALTH_ARCHITECTURE.md section 11. This
        # sensor performs no restore action and calls no service - it only
        # observes and reports, exactly like free_power_snapshot_recovery's
        # designed semantics.
        state: >-
          {% set e1 = 'binary_sensor.ecco_clock_dongle_free_power_operation_in_progress' %}
          {% set s1 = states(e1) %}
          {% if s1 in ['unknown', 'unavailable', ''] %}
            {% set rank1 = 2 %}{% set state1 = 'UNKNOWN' %}
          {% elif s1 == 'off' %}
            {% set rank1 = 0 %}{% set state1 = 'HEALTHY' %}
          {% else %}
            {% set dur1 = as_timestamp(now()) - as_timestamp(states[e1].last_changed) %}
            {% if dur1 >= 180 %}
              {% set rank1 = 3 %}{% set state1 = 'FAILED' %}
            {% else %}
              {% set rank1 = 2 %}{% set state1 = 'WARNING' %}
            {% endif %}
          {% endif %}
          {% set e2 = 'binary_sensor.ecco_clock_dongle_free_power_active' %}
          {% set s2 = states(e2) %}
          {% if s2 in ['unknown', 'unavailable', ''] %}
            {% set rank2 = 2 %}{% set state2 = 'UNKNOWN' %}
          {% elif s2 == 'on' %}
            {% set rank2 = 2 %}{% set state2 = 'WARNING' %}
          {% else %}
            {% set rank2 = 0 %}{% set state2 = 'HEALTHY' %}
          {% endif %}
          {% set e3 = 'binary_sensor.ecco_clock_dongle_free_power_snapshot_valid' %}
          {% set s3 = states(e3) %}
          {% if s3 in ['unknown', 'unavailable', ''] or s2 in ['unknown', 'unavailable', ''] %}
            {% set rank3 = 2 %}{% set state3 = 'UNKNOWN' %}
          {% elif s3 == 'on' and s2 == 'off' %}
            {% set since3 = [as_timestamp(states[e3].last_changed), as_timestamp(states[e2].last_changed)] | max %}
            {% set dur3 = as_timestamp(now()) - since3 %}
            {% if dur3 >= 60 %}
              {% set rank3 = 3 %}{% set state3 = 'FAILED' %}
            {% else %}
              {% set rank3 = 2 %}{% set state3 = 'WARNING' %}
            {% endif %}
          {% else %}
            {% set rank3 = 0 %}{% set state3 = 'HEALTHY' %}
          {% endif %}
          {% set max_rank = [rank1, rank2, rank3] | max %}
          {% set definite = {0: 'HEALTHY', 1: 'DEGRADED', 2: 'WARNING', 3: 'FAILED'}[max_rank] %}
          {% set states_at_max = [] %}
          {% if rank1 == max_rank %}{% set states_at_max = states_at_max + [state1] %}{% endif %}
          {% if rank2 == max_rank %}{% set states_at_max = states_at_max + [state2] %}{% endif %}
          {% if rank3 == max_rank %}{% set states_at_max = states_at_max + [state3] %}{% endif %}
          {% if definite in states_at_max %}
            {{ definite }}
          {% elif 'UNKNOWN' in states_at_max %}
            UNKNOWN
          {% else %}
            {{ definite }}
          {% endif %}
        attributes:
          subsystem: free_power
          partial_implementation: true
          sufficient_for_control_decision: false
          represented_checks: "{{ ['free_power_operation_duration', 'free_power_active_state', 'free_power_snapshot_recovery'] }}"
          not_yet_implemented_checks: >-
            free_power_failures_recent (needs a persisted failure-counter
            baseline mechanism, same limitation as manual_write_failures_recent);
            free_power_state_consistency (cross_source_agreement between
            free_power_active_sensor and the free_power_status text - not
            implemented in this phase).
          conflation_note: >-
            active, operation_in_progress and snapshot_valid are evaluated as
            three independent signals, never merged into one flag - see the
            three represented_checks above and their independent
            source_entities.
          source_entities: >-
            {{ ['binary_sensor.ecco_clock_dongle_free_power_operation_in_progress',
                'binary_sensor.ecco_clock_dongle_free_power_active',
                'binary_sensor.ecco_clock_dongle_free_power_snapshot_valid'] }}
          reason_codes: >-
            {% set e1 = 'binary_sensor.ecco_clock_dongle_free_power_operation_in_progress' %}
            {% set s1 = states(e1) %}
            {% set codes = [] %}
            {% if s1 not in ['unknown', 'unavailable', '', 'off'] %}
              {% set dur1 = as_timestamp(now()) - as_timestamp(states[e1].last_changed) %}
              {% if dur1 >= 180 %}
                {% set codes = codes + ['FREE_POWER_OPERATION_STUCK'] %}
              {% else %}
                {% set codes = codes + ['FREE_POWER_OPERATION_ACTIVE'] %}
              {% endif %}
            {% endif %}
            {% if states('binary_sensor.ecco_clock_dongle_free_power_active') == 'on' %}
              {% set codes = codes + ['FREE_POWER_ACTIVE'] %}
            {% endif %}
            {% set s2 = states('binary_sensor.ecco_clock_dongle_free_power_active') %}
            {% set s3 = states('binary_sensor.ecco_clock_dongle_free_power_snapshot_valid') %}
            {% if s3 == 'on' and s2 == 'off' %}
              {% set e2 = 'binary_sensor.ecco_clock_dongle_free_power_active' %}
              {% set e3 = 'binary_sensor.ecco_clock_dongle_free_power_snapshot_valid' %}
              {% set since3 = [states[e3].last_changed, states[e2].last_changed] | max %}
              {% set dur3 = as_timestamp(now()) - as_timestamp(since3) %}
              {% if dur3 >= 60 %}
                {% set codes = codes + ['FREE_POWER_RECOVERY_FAILED'] %}
              {% else %}
                {% set codes = codes + ['FREE_POWER_RECOVERY_REQUIRED'] %}
              {% endif %}
            {% endif %}
            {{ codes }}
          blocks_manual_control: >-
            {% set s1 = states('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress') %}
            {% set s2 = states('binary_sensor.ecco_clock_dongle_free_power_active') %}
            {% set s3 = states('binary_sensor.ecco_clock_dongle_free_power_snapshot_valid') %}
            {{ s1 != 'off' or s2 != 'off' or s3 != 'off' }}
          current_operation_duration_seconds: >-
            {% set e = 'binary_sensor.ecco_clock_dongle_free_power_operation_in_progress' %}
            {% if states(e) == 'on' %}
              {{ (as_timestamp(now()) - as_timestamp(states[e].last_changed)) | round(0) }}
            {% else %}
              none
            {% endif %}
          current_snapshot_pending_recovery_duration_seconds: >-
            {% set e2 = 'binary_sensor.ecco_clock_dongle_free_power_active' %}
            {% set e3 = 'binary_sensor.ecco_clock_dongle_free_power_snapshot_valid' %}
            {% if states(e3) == 'on' and states(e2) == 'off' %}
              {% set since3 = [as_timestamp(states[e3].last_changed), as_timestamp(states[e2].last_changed)] | max %}
              {{ (as_timestamp(now()) - since3) | round(0) }}
            {% else %}
              none
            {% endif %}
          duration_basis: >-
            states.<entity>.last_changed (for the pending-recovery duration:
            the MORE RECENT of the two contributing entities' last_changed
            values, as a documented approximation of when the combined
            condition became true) - see file header for the restart/reconnect
            caveat; NOT proven restart-safe.

  # FAILED STARTS (FB-D1 follow-up: a structured, time-limited warning for a Free Power / Dump to Grid START that failed without entering
  # recovery). The firmware counts start attempts and start successes separately (both since boot, published every 30 s); an attempt is
  # counted only AFTER every start gate has passed, so a refusal (REJECTED - ...) is never counted, and a success only when the START
  # verified ACTIVE. Unresolved attempts = attempts - successes therefore rises by one for every genuine failed START, whether or not it
  # then entered recovery. The failures-since-boot counters are NOT used: they also count failed restores, force-restores and lockouts.
  #
  # A new failed start is detected only as a rise of unresolved attempts that is still there after the counters have been quiet for
  # 240 s. The settle outlasts a start in flight AND a silent link loss: the start scripts reach success within 27 s (Free
  # Power: nine bounded 3 s Modbus waits) / 21 s (Dump to Grid: seven), each counter publishes on its own 30 s timer (so Home
  # Assistant sees the success at most 57 s after the attempt), and a silently lost ESPHome link keeps the counters available with
  # stale values for up to 110 s (aioesphomeapi 45.x: a ping every 20 s, closed 90 s after an unanswered one) before they become
  # unavailable; 57 + 110 = 167 s < 240 s. TIMING ASSUMPTION: re-check both bounds (the firmware start scripts and the live Home
  # Assistant ESPHome client) before deployment. A nonzero since-boot count, the first values seen after a Home Assistant start, a
  # reconnection or a counter
  # reset only set the baseline: they are never a failure. An unreadable or inconsistent counter pair clears the baseline (a failure
  # while it is unreadable is not observed). A LOWER unresolved count (a start's success published before its attempt, or an in-flight
  # start at baseline) moves the baseline only once the counters are quiet, so the publish-order skew never turns into a false failure.
  # The free-text status never decides anything; it is reported as information only.
  # A confirmed failure holds WARNING for 1800 s after the start attempt (the attempts counter's change time); each further failure
  # restarts that window. The window trigger fires exactly when the attempts counter has been unchanged for the whole window; the
  # one-minute refresh is the backstop (it also closes the window after a Home Assistant restart cancelled the timer).
  - triggers:
      - trigger: homeassistant
        event: start
        id: start
      - trigger: state
        id: start_counters_changed
        entity_id:
          - sensor.ecco_clock_dongle_free_power_start_attempts_since_boot
          - sensor.ecco_clock_dongle_dump_to_grid_start_attempts_since_boot
          - sensor.ecco_clock_dongle_free_power_start_successes_since_boot
          - sensor.ecco_clock_dongle_dump_to_grid_start_successes_since_boot
      - trigger: state
        id: start_counters_settled
        entity_id:
          - sensor.ecco_clock_dongle_free_power_start_attempts_since_boot
          - sensor.ecco_clock_dongle_dump_to_grid_start_attempts_since_boot
          - sensor.ecco_clock_dongle_free_power_start_successes_since_boot
          - sensor.ecco_clock_dongle_dump_to_grid_start_successes_since_boot
        for:
          seconds: 240
      - trigger: state
        id: start_failure_window_elapsed
        entity_id:
          - sensor.ecco_clock_dongle_free_power_start_attempts_since_boot
          - sensor.ecco_clock_dongle_dump_to_grid_start_attempts_since_boot
        for:
          minutes: 30
      - trigger: time_pattern
        minutes: "/1"
