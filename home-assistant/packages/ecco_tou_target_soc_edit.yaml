          # 0. acs0r1: observe the dongle's routine Modbus poll cycle BEFORE the fresh evidence below (so the cache age at the Load is
          #    unaffected): (a) one inverter clock read (Inverter Time changes; a 0.3 s frame once a minute) gives its phase clk_at;
          #    (b) two CLEAN telemetry poll completions (Last Telemetry Update, published with the poll's last frame, valid and
          #    strictly later than before - an `unavailable` blip or a reconnect's re-sent value is not a completion) give its
          #    period. Either not observed = no quiet window can be predicted: the edit fails at the fresh-evidence check below,
          #    nothing pressed (a stalled inverter clock or a dropped publish is never taken to mean "no bus user").
          - variables:
              clk_mark: "{{ states('sensor.ecco_clock_dongle_inverter_time') }}"
          - wait_template: "{{ states('sensor.ecco_clock_dongle_inverter_time') != clk_mark }}"
            timeout: "00:01:05"
            continue_on_timeout: true
          - variables:
              clk_at: >-
                {{ as_timestamp(now()) if states('sensor.ecco_clock_dongle_inverter_time') != clk_mark
                   and clk_mark not in ['unknown', 'unavailable']
                   and states('sensor.ecco_clock_dongle_inverter_time') not in ['unknown', 'unavailable'] else 0 }}
              tel_mark: "{{ states('sensor.ecco_clock_dongle_last_telemetry_update') }}"
          - wait_template: "{{ states('sensor.ecco_clock_dongle_last_telemetry_update') not in ['unknown', 'unavailable'] and tel_mark not in ['unknown', 'unavailable'] and as_timestamp(states('sensor.ecco_clock_dongle_last_telemetry_update'), 0) > as_timestamp(tel_mark, 0) }}"
            timeout: "00:00:15"
            continue_on_timeout: true
          - variables:
              tel_p0: "{{ as_timestamp(now()) if states('sensor.ecco_clock_dongle_last_telemetry_update') not in ['unknown', 'unavailable'] and tel_mark not in ['unknown', 'unavailable'] and as_timestamp(states('sensor.ecco_clock_dongle_last_telemetry_update'), 0) > as_timestamp(tel_mark, 0) else 0 }}"
              tel_mark: "{{ states('sensor.ecco_clock_dongle_last_telemetry_update') }}"
          - wait_template: "{{ tel_p0 == 0 or (states('sensor.ecco_clock_dongle_last_telemetry_update') not in ['unknown', 'unavailable'] and tel_mark not in ['unknown', 'unavailable'] and as_timestamp(states('sensor.ecco_clock_dongle_last_telemetry_update'), 0) > as_timestamp(tel_mark, 0)) }}"
            timeout: "00:00:15"
            continue_on_timeout: true
          - variables:
              tel_period: "{{ (as_timestamp(now()) - tel_p0) if tel_p0 > 0 and (states('sensor.ecco_clock_dongle_last_telemetry_update') not in ['unknown', 'unavailable'] and tel_mark not in ['unknown', 'unavailable'] and as_timestamp(states('sensor.ecco_clock_dongle_last_telemetry_update'), 0) > as_timestamp(tel_mark, 0)) else 0 }}"
          # 1. Fresh evidence, not just a connected API. (a) A live round trip (defence in depth): Home Assistant receives a NEW
          #    dongle-counted heartbeat count after the Apply began (heartbeats every 30 s; the count is published every 30 s).
          #    (b) Then a NEW configuration poll: its dongle-stamped time strictly later than the one seen after (a), and within
          #    120 s of Home Assistant's clock (a replayed or buffered value, or an unsynchronised dongle clock, fails). This bounds
          #    the cache age at the Load to seconds. The dongle's zone-less local time is read in Home Assistant's configured time
