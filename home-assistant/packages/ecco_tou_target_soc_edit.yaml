          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ not fresh or refusal2 | length > 0 or pre.fl < 0 or (pre.cur | string) != (before | string) }}"
                sequence:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ecco_cfg_edit_last_result
                    data:
                      value: >-
                        FAILED - {{ fresh_why if not fresh else (refusal2 if refusal2 else ('the slot raw flags are unavailable' if pre.fl < 0 else 'the slot changed since the review')) }}; nothing written
            default:
              # 2. Load (staging = the live slot from that read), then the helper sync must reach a fixed point.
              - action: button.press
                continue_on_error: true
                target:
                  entity_id: "{{ e.load }}"
              - delay:
                  seconds: 3
              - wait_template: >-
                  {{ (states(e.st) | float(-1)) == ((states(e.live_t) | replace(':', '')) | int(-2))
                     and (states(e.en) | float(-1)) == ((states(e.live_t_next) | replace(':', '')) | int(-2))
                     and (states(e.pw) | float(-1)) == (states(e.live_pw) | float(-2))
                     and states(e.src) == states(e.live_src) and states(e.src) in ['None', 'Grid', 'Generator', 'Grid + Generator'] and states(e.mode) == states(e.live_mode) and states(e.mode) in ['None', 'General', 'Backup', 'Charge']
                     and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') in ['on', 'off']
                     and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') == states('binary_sensor.ecco_clock_dongle_ecco_battery_grid_charge_enabled')
                     and (states(e.soc) | float(-1)) == (states(e.live_soc) | float(-2))
                     and not is_state('script.ecco_refresh_manual_control_helpers', 'on')
                     and (states(e.h_start) in ['unknown'] or states(e.h_start)[:5] | replace(':', '') | int(-1) == (states(e.st) | int(-2)))
                     and (states(e.h_pw) in ['unknown'] or (states(e.h_pw) | float(-1)) == (states(e.pw) | float(-2)))
                     and (states(e.h_soc) in ['unknown'] or (states(e.h_soc) | float(-1)) == (states(e.soc) | float(-2))) }}
                timeout: "00:00:15"
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ as_timestamp(now()) - fresh_at <= 30
                         and (states(e.st) | float(-1)) == ((states(e.live_t) | replace(':', '')) | int(-2))
                         and (states(e.en) | float(-1)) == ((states(e.live_t_next) | replace(':', '')) | int(-2))
                         and (states(e.pw) | float(-1)) == (states(e.live_pw) | float(-2))
                         and states(e.src) == states(e.live_src) and states(e.src) in ['None', 'Grid', 'Generator', 'Grid + Generator'] and states(e.mode) == states(e.live_mode) and states(e.mode) in ['None', 'General', 'Backup', 'Charge']
                         and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') in ['on', 'off']
                         and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') == states('binary_sensor.ecco_clock_dongle_ecco_battery_grid_charge_enabled')
                         and (states(e.soc) | float(-1)) == (states(e.live_soc) | float(-2))
                         and not is_state('script.ecco_refresh_manual_control_helpers', 'on')
                         and (states(e.h_start) in ['unknown'] or states(e.h_start)[:5] | replace(':', '') | int(-1) == (states(e.st) | int(-2)))
                         and (states(e.h_pw) in ['unknown'] or (states(e.h_pw) | float(-1)) == (states(e.pw) | float(-2)))
                         and (states(e.h_soc) in ['unknown'] or (states(e.h_soc) | float(-1)) == (states(e.soc) | float(-2))) }}
                then:
                  # From here the staging holds the reviewed value and the editor is about to arm. BEFORE anything is staged record what the
                  #    firmware has done so far: its gate-pass counter (att0) and a cleared 'inverter write seen' marker. A later 'nothing
                  #    pressed' is believed only if the counter is unchanged and no write was seen since (see the pre-press branch below).
                  - action: input_boolean.turn_off
                    continue_on_error: true
                    target:
                      entity_id: input_boolean.ecco_cfg_edit_write_seen
                  - variables:
                      att0: "{{ states('sensor.ecco_clock_dongle_manual_configuration_write_attempts_since_boot') | float(-1) }}"
                  # 3. Stage ONLY the edited field - the slot's target SOC, power or start time number, or its charge source select -
                  #    then wait for the sync's echo and a fixed point again.
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ setting == 'target_soc' }}"
                        sequence:
                          - action: number.set_value
                            continue_on_error: true
                            target:
                              entity_id: "{{ e.soc }}"
                            data:
                              value: "{{ want }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ setting == 'power' }}"
                        sequence:
                          - action: number.set_value
                            continue_on_error: true
                            target:
                              entity_id: "{{ e.pw }}"
                            data:
                              value: "{{ want }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ setting == 'start_time' }}"
                        sequence:
                          - action: number.set_value
                            continue_on_error: true
                            target:
                              entity_id: "{{ e.st }}"
                            data:
                              value: "{{ want }}"
                      - conditions:
                          - condition: template
                            value_template: "{{ setting == 'charge_source' and (want | string) == 'Grid' }}"
                        sequence:
                          - action: select.select_option
                            continue_on_error: true
                            target:
                              entity_id: "{{ e.src }}"
                            data:
                              option: Grid
                      - conditions:
                          - condition: template
                            value_template: "{{ setting == 'charge_source' and (want | string) == 'None' }}"
                        sequence:
                          - action: select.select_first
                            continue_on_error: true
                            target:
                              entity_id: "{{ e.src }}"
                  - delay:
                      seconds: 2
                  - wait_template: >-
                      {{ (states(e.soc) | float(-1)) == ((want | float(-2)) if setting == 'target_soc' else (states(e.live_soc) | float(-2)))
                         and (states(e.st) | float(-1)) == ((want | float(-2)) if setting == 'start_time' else ((states(e.live_t) | replace(':', '')) | int(-2)))
                         and (states(e.en) | float(-1)) == ((states(e.live_t_next) | replace(':', '')) | int(-2))
                         and (states(e.pw) | float(-1)) == ((want | float(-2)) if setting == 'power' else (states(e.live_pw) | float(-2)))
                         and states(e.src) == ((want | string) if setting == 'charge_source' else states(e.live_src)) and states(e.src) in ['None', 'Grid', 'Generator', 'Grid + Generator'] and states(e.live_src) in ['None', 'Grid', 'Generator', 'Grid + Generator']
                         and states(e.mode) == states(e.live_mode) and states(e.mode) in ['None', 'General', 'Backup', 'Charge'] and states(e.live_mode) in ['None', 'General', 'Backup', 'Charge']
                         and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') in ['on', 'off']
                         and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') == states('binary_sensor.ecco_clock_dongle_ecco_battery_grid_charge_enabled')
                         and not is_state('script.ecco_refresh_manual_control_helpers', 'on')
                         and (states(e.h_start) in ['unknown'] or states(e.h_start)[:5] | replace(':', '') | int(-1) == (states(e.st) | int(-2)))
                         and (states(e.h_pw) in ['unknown'] or (states(e.h_pw) | float(-1)) == (states(e.pw) | float(-2)))
                         and (states(e.h_soc) in ['unknown'] or (states(e.h_soc) | float(-1)) == (states(e.soc) | float(-2))) }}
                    timeout: "00:00:10"
                    continue_on_timeout: true
                  # 3b. acs0r1: the ONE press goes into a quiet gap of the dongle's Modbus poll cycle. The firmware refuses an Apply
                  #    while ANY frame is queued or in flight (tx_buffer_empty / tx_blocked), routine reads included. On 2026-10-16
                  #    two restores pressed a fixed ~5.3 s after the configuration read, at the 10 s telemetry poll's last frame,
                  #    and were refused (nothing written). No offset from the configuration read: the press follows a CLEAN
                  #    telemetry completion x by 1.5 s (the middle of the gap; a completion's publish can reach Home Assistant in
                  #    the same batch as a frame still running) and x is accepted only if the press window [x, x + 5.0 s] holds no
                  #    inverter clock read (clk_at + 60 k, 0.3 s frame) and x is at most 25 s after the fresh read (cache age at
                  #    the press under 30 s). The next telemetry frame is x + period - 2.8 s >= x + 5.2 s (period >= 8 s, measured
                  #    in step 0); this minute's configuration blocks ended before the staging, the next minute's start about
                  #    57 s after the fresh read. A second completion is tried if the first does not qualify; otherwise FAILED,
                  #    nothing pressed. Still exactly one press; a refusal is still final.
                  - variables:
                      tel_mark: "{{ states('sensor.ecco_clock_dongle_last_telemetry_update') }}"
                  - wait_template: "{{ states('sensor.ecco_clock_dongle_last_telemetry_update') not in ['unknown', 'unavailable'] and tel_mark not in ['unknown', 'unavailable'] and as_timestamp(states('sensor.ecco_clock_dongle_last_telemetry_update'), 0) > as_timestamp(tel_mark, 0) }}"
                    timeout: "00:00:15"
                    continue_on_timeout: true
                  - variables:
                      tel_b: "{{ as_timestamp(now()) if states('sensor.ecco_clock_dongle_last_telemetry_update') not in ['unknown', 'unavailable'] and tel_mark not in ['unknown', 'unavailable'] and as_timestamp(states('sensor.ecco_clock_dongle_last_telemetry_update'), 0) > as_timestamp(tel_mark, 0) else 0 }}"
                      tel_mark: "{{ states('sensor.ecco_clock_dongle_last_telemetry_update') }}"
                  - variables:
                      quiet_b: "{{ tel_b > 0 and tel_b <= fresh_at + 25 and ((clk_at - tel_b) % 60) >= 5.3 }}"
                  - wait_template: "{{ quiet_b or tel_b == 0 or (states('sensor.ecco_clock_dongle_last_telemetry_update') not in ['unknown', 'unavailable'] and tel_mark not in ['unknown', 'unavailable'] and as_timestamp(states('sensor.ecco_clock_dongle_last_telemetry_update'), 0) > as_timestamp(tel_mark, 0)) }}"
                    timeout: "00:00:15"
                    continue_on_timeout: true
                  - variables:
                      tel_c: "{{ 0 if quiet_b or tel_b == 0 else (as_timestamp(now()) if states('sensor.ecco_clock_dongle_last_telemetry_update') not in ['unknown', 'unavailable'] and tel_mark not in ['unknown', 'unavailable'] and as_timestamp(states('sensor.ecco_clock_dongle_last_telemetry_update'), 0) > as_timestamp(tel_mark, 0) else 0) }}"
                  - variables:
                      quiet_c: "{{ tel_c > 0 and tel_c <= fresh_at + 25 and ((clk_at - tel_c) % 60) >= 5.3 }}"
                      tel_at: "{{ tel_b if quiet_b else tel_c }}"
                      bus_quiet: "{{ quiet_b or quiet_c }}"
                  - delay:
                      seconds: "{{ 1.5 if bus_quiet else 0 }}"
                  - action: switch.turn_on
                    continue_on_error: true
                    target:
                      entity_id: switch.ecco_clock_dongle_manual_configuration_write_enable
                  - wait_template: "{{ is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'on') }}"
                    timeout: "00:00:05"
                    continue_on_timeout: true
                  # 4. The last check before the press: the full gate (bounds re-read), staged == live except the edited field (which
                  #    must equal the request), the helper sync at its fixed point, the arm confirmed; then ONE press.
                  - variables:
                      armed_by_us: true
                      refusal3: >-
                        {% set shutdown = states('sensor.ecco_clock_dongle_ecco_battery_shutdown') | int(-1) %}
                        {% set reserve = states('input_number.ecco_minimum_reserve_soc') | int(-1) %}
                        {% set lo = [shutdown, reserve] | max %}
                        {% set cur = ((states(e.live_soc) | int(-1) if setting == 'target_soc' else (states(e.live_pw) | float(-1) | int(-1) if setting == 'power' else ((states(e.live_t) | replace(':', '')) | int(-1) if setting == 'start_time' else states(e.live_src))))) if e else -1 %}
                        {% set tz = [states('sensor.ecco_clock_dongle_ecco_timezone1_time'), states('sensor.ecco_clock_dongle_ecco_timezone2_time'), states('sensor.ecco_clock_dongle_ecco_timezone3_time'),
                            states('sensor.ecco_clock_dongle_ecco_timezone4_time'), states('sensor.ecco_clock_dongle_ecco_timezone5_time'), states('sensor.ecco_clock_dongle_ecco_timezone6_time')] %}
                        {% set tm = namespace(v=[]) %}{% for s in tz %}{% set ok = s | length == 5 and s[2] == ':' and s[:2].isdigit() and s[3:].isdigit() and (s[:2] | int(99)) <= 23 and (s[3:] | int(99)) <= 59 %}{% set tm.v = tm.v + [((s[:2] | int(99)) * 60 + (s[3:] | int(99))) if ok else -1] %}{% endfor %}
                        {% set tt = tm.v %}
                        {% set asc = tt[0] >= 0 and tt[0] < tt[1] and tt[1] < tt[2] and tt[2] < tt[3] and tt[3] < tt[4] and tt[4] < tt[5] and tt[5] < 1440 %}
                        {% set lb = (tt[n - 2] if n > 1 else -1) if e else 0 %}
                        {% set hb = (tt[n] if n < 6 else 1440) if e else 0 %}
                        {% set cm = now().hour * 60 + now().minute + now().second / 60 %}
                        {% set bo = ((cur // 100) * 60 + cur % 100) if (setting == 'start_time' and cur >= 0) else -9999 %}
                        {% set near = setting == 'start_time' and bo >= 0 and (([(cm - bo) % 1440, (bo - cm) % 1440] | min) <= 15 or ([(cm - wmin) % 1440, (wmin - cm) % 1440] | min) <= 15) %}
                        {% set mid = setting == 'start_time' and bo >= 0 and wmin >= 0 and (((cm - (bo if wmin > bo else wmin)) % 1440) < ((wmin - bo) | abs)) %}
                        {% set invd = ((as_timestamp(states('sensor.ecco_clock_dongle_inverter_time'), 0) - as_timestamp(now())) | abs) %}
                        {% set cc = now().month in [3, 10] and now().weekday() == 6 and now().day >= 25 and now().hour < 3 %}
                        {% set lm = states('sensor.ecco_clock_dongle_ecco_fallback_profile_live_match') %}
                        {% set L = ';' ~ lm ~ ';' %}
                        {% set R = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review') ~ ';' %}
                        {% set fp_start = as_timestamp(states('input_datetime.ecco_free_power_schedule_start'), 0) %}
                        {% set dg_start = as_timestamp(states('input_datetime.ecco_dump_to_grid_schedule_start'), 0) %}
                        {% set soon = as_timestamp(now()) + 900 %}
                        {% if not is_state('input_boolean.ecco_cfg_edit_review_required', 'off') %}an earlier edit's outcome needs manual review first
                        {% elif not e %}invalid slot (1-6)
                        {% elif setting not in ['target_soc', 'power', 'start_time', 'charge_source'] %}unknown setting (target_soc, power, start_time or charge_source)
                        {% elif setting == 'target_soc' and shutdown < 0 %}inverter shutdown SOC unavailable
                        {% elif setting == 'target_soc' and reserve < 0 %}ECCO minimum battery reserve unavailable
                        {% elif setting == 'target_soc' and (want < lo or want > 100) %}target SOC must be {{ lo }}-100 % (the greater of the inverter shutdown SOC {{ shutdown }} % and the ECCO reserve {{ reserve }} %)
                        {% elif setting == 'power' and (want < 500 or want > 8000 or want % 100 != 0) %}power must be a whole number of watts, a multiple of 100, from 500 to 8000 W (below 500 W the live settings would leave the saved fallback profile's domain, and every further edit, an undo included, would be refused)
                        {% elif setting == 'start_time' and want < 0 %}start time must be HH:MM on the 5-minute grid, 00:00-23:55
                        {% elif setting == 'charge_source' and (want | string) not in ['Grid', 'None'] %}charge source must be exactly Grid or None (no generator is evidenced and the fallback domain is None or Grid)
                        {% elif setting != 'charge_source' and cur < 0 %}live slot {{ label }} unavailable
                        {% elif setting == 'power' and (states(e.live_pw) | float(-1)) % 100 != 0 %}the live slot power {{ states(e.live_pw) }} W is not a multiple of 100 W; the undo would be refused - align it first in Manual Controls
                        {% elif setting == 'charge_source' and cur not in ['None', 'Grid'] %}the live charge source of slot {{ n }} is {{ cur }}: only None and Grid can be edited
                        {% elif (cur | string) == (want | string) %}no change (slot {{ n }} is already {{ wdisp }})
                        {% elif setting == 'start_time' and not asc %}the six live slot start times are not strictly ascending (unexpected TOU layout)
                        {% elif setting == 'start_time' and not (lb < wmin and wmin < hb) %}the new start time must stay strictly after the previous slot's start and strictly before the next one
                        {% elif near %}the local time is within 15 minutes of the old or the new slot boundary
                        {% elif mid %}the current local time lies between the old and the new boundary: the edit would change which slot is active right now
                        {% elif setting == 'start_time' and invd > 120 %}the inverter clock is more than 120 s from Home Assistant's clock, or unreadable (the inverter runs its TOU slots on its own clock)
                        {% elif cc %}UK clock change night: no edit between 00:00 and 03:00 local on the last Sunday of March and of October
                        {% elif not is_state('binary_sensor.ecco_clock_dongle_telemetry_online', 'on') or not is_state('binary_sensor.ecco_clock_dongle_configuration_online', 'on')
                              or not is_state('binary_sensor.ecco_clock_dongle_manual_configuration_raw_cache_valid', 'on') %}dongle offline or configuration cache not valid
                        {% elif ((as_timestamp(now()) - as_timestamp(states('sensor.ecco_clock_dongle_last_configuration_update'), 0)) | abs) > 150 or not (0 <= (states('sensor.ecco_clock_dongle_ecco_supervision_heartbeat_age') | float(-1)) <= 60) %}the dongle's configuration time or heartbeat is not current (configuration {{ states('sensor.ecco_clock_dongle_last_configuration_update')[:19] }}, heartbeat age {{ states('sensor.ecco_clock_dongle_ecco_supervision_heartbeat_age')[:8] }} s)
                        {% elif not is_state('binary_sensor.ecco_clock_dongle_free_power_active', 'off') or not is_state('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress', 'off')
                              or not is_state('binary_sensor.ecco_clock_dongle_free_power_snapshot_valid', 'off') %}Free Power owns the TOU settings (active, starting or restore owed)
                        {% elif not is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'off') or not is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress', 'off')
                              or not is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_snapshot_valid', 'off') %}Dump to Grid owns the TOU settings (active, starting or restore owed)
                        {% elif not is_state('binary_sensor.ecco_clock_dongle_manual_write_in_progress', 'off') %}another inverter write or fallback operation in progress
                        {% elif not is_state('binary_sensor.ecco_clock_dongle_rtc_correction_in_progress', 'off') %}RTC correction in progress
                        {% elif (not (armed_by_us | default(false)) and not is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'off'))
                              or not is_state('switch.ecco_clock_dongle_free_power_write_enable', 'off')
                              or not is_state('switch.ecco_clock_dongle_free_power_recovery_arm', 'off') or not is_state('switch.ecco_clock_dongle_dump_to_grid_write_enable', 'off')
                              or not is_state('switch.ecco_clock_dongle_dump_to_grid_recovery_arm', 'off') %}a write or recovery arm is on
                        {% elif L.count(';m=') != 1 or L.count(';obl=') != 1 or L.count(';ca=') != 1 or L.count(';eh=') != 1 %}the fallback live match is unavailable or malformed ({{ lm[:60] }})
                        {% elif ';obl=FP:CR,DP:CR,R4:CR,BUS:OK;' not in L %}a lease, restore, lockout or register 244 transaction is not clear ({{ lm[:60] }})
                        {% elif ';ca=F;' not in L or ';eh=0;' not in L %}the fallback live data is not current or an export hazard is not ruled out ({{ lm[:60] }})
                        {% elif ';m=MATCH;' not in L and ';m=DRIFT;' not in L and ';m=CONTEXT;' not in L %}the fallback live match is {{ L.split(';m=')[1].split(';')[0][:16] }}: edits need a valid saved fallback profile, live settings inside its domain and export as in the profile (MATCH, DRIFT or CONTEXT)
                        {% elif R.count(';st=') != 1 or ';st=IDLE;' not in R %}a fallback profile Review or Save is in progress (or its state is unknown)
                        {% elif not is_state('binary_sensor.ecco_fallback_save_available', 'off') or not is_state('binary_sensor.ecco_fallback_replace_corrupt_available', 'off')
                              or not is_state('binary_sensor.ecco_fallback_invalidate_available', 'off') %}the fallback system is armed for an operation
                        {% elif not is_state('sensor.ecco_clock_dongle_ecco_supervision_state', 'SUPERVISED') or not is_state('binary_sensor.ecco_clock_dongle_ecco_supervision_stable', 'on')
                              or not is_state('sensor.ecco_clock_dongle_ecco_failback_shadow_state', 'SHADOW_IDLE') %}supervision not stable or a failback episode is open
                        {% elif not is_state('sensor.ecco_clock_dongle_dump_to_grid_export_containment', 'NOT_APPLICABLE')
                              or not is_state('sensor.ecco_clock_dongle_free_power_recovery_evidence_id', '-')
                              or not is_state('sensor.ecco_clock_dongle_reg244_original_snapshot', '—') %}a recovery or containment state is open
                        {% elif not is_state('sensor.ecco_clock_dongle_free_power_recovery_state', 'NONE')
                              or not (states('sensor.ecco_clock_dongle_dump_to_grid_recovery_state').startswith('NONE')
                                      or states('sensor.ecco_clock_dongle_dump_to_grid_recovery_state').startswith('ACCEPTED')) %}a Free Power or Dump recovery state is open
                        {% elif not is_state('script.ecco_free_power_start_scheduled', 'off') or not is_state('script.ecco_dump_to_grid_start_scheduled', 'off') %}a scheduled start is running
                        {% elif is_state('input_boolean.ecco_free_power_schedule_armed', 'on') and fp_start < soon %}a scheduled Free Power starts within 15 minutes
                        {% elif is_state('input_boolean.ecco_dump_to_grid_schedule_armed', 'on') and dg_start < soon %}a scheduled Dump to Grid starts within 15 minutes
                        {% endif %}
                  - if:
                      - condition: template
                        value_template: >-
                          {{ refusal3 | length == 0
                             and bus_quiet
                             and (as_timestamp(now()) - tel_at) <= 4.5
                             and is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'on')
                             and (states(e.soc) | float(-1)) == ((want | float(-2)) if setting == 'target_soc' else (states(e.live_soc) | float(-2)))
                             and (states(e.st) | float(-1)) == ((want | float(-2)) if setting == 'start_time' else ((states(e.live_t) | replace(':', '')) | int(-2)))
                             and (states(e.en) | float(-1)) == ((states(e.live_t_next) | replace(':', '')) | int(-2))
                             and (states(e.pw) | float(-1)) == ((want | float(-2)) if setting == 'power' else (states(e.live_pw) | float(-2)))
                             and states(e.src) == ((want | string) if setting == 'charge_source' else states(e.live_src)) and states(e.src) in ['None', 'Grid', 'Generator', 'Grid + Generator'] and states(e.live_src) in ['None', 'Grid', 'Generator', 'Grid + Generator']
                             and states(e.mode) == states(e.live_mode) and states(e.mode) in ['None', 'General', 'Backup', 'Charge'] and states(e.live_mode) in ['None', 'General', 'Backup', 'Charge']
                             and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') in ['on', 'off']
                             and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') == states('binary_sensor.ecco_clock_dongle_ecco_battery_grid_charge_enabled')
                             and not is_state('script.ecco_refresh_manual_control_helpers', 'on')
                             and (states(e.h_start) in ['unknown'] or states(e.h_start)[:5] | replace(':', '') | int(-1) == (states(e.st) | int(-2)))
                             and (states(e.h_pw) in ['unknown'] or (states(e.h_pw) | float(-1)) == (states(e.pw) | float(-2)))
                             and (states(e.h_soc) in ['unknown'] or (states(e.h_soc) | float(-1)) == (states(e.soc) | float(-2))) }}
                    then:
                      # The firmware counts an Apply attempt only when its gate passes (published every 30 s).
                      - variables:
                          attempts_before: "{{ states('sensor.ecco_clock_dongle_manual_configuration_write_attempts_since_boot') | float(-1) }}"
                      - action: button.press
                        continue_on_error: true
                        target:
                          entity_id: "{{ e.apply }}"
                      # The firmware disarms on every outcome and releases its write lock when done.
                      - wait_template: >-
                          {{ is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'off')
                             and is_state('binary_sensor.ecco_clock_dongle_manual_write_in_progress', 'off') }}
                        timeout: "00:00:45"
                        continue_on_timeout: true
                      # Never left on while the outcome is judged (harmless when the firmware has already disarmed: the
                      # firmware reads the write enable only at its Apply gate, so this cannot interrupt a write).
                      - action: switch.turn_off
                        continue_on_error: true
                        target:
                          entity_id: switch.ecco_clock_dongle_manual_configuration_write_enable
                      - delay:
                          seconds: 2
                      - variables:
                          fw_result: "{{ states('sensor.ecco_clock_dongle_manual_configuration_last_result')[:120] }}"
                          cfg_0: "{{ states('sensor.ecco_clock_dongle_last_configuration_update') }}"
                      # Two LATER configuration reads, compared as TIMES - a connection drop's 'unavailable' and the value a
                      # reconnect re-sends are not reads. The first may be the firmware's own post-Apply poll (published
                      # about 4 s after its verify); the firmware runs one poll at a time, so the second began after it.
                      - wait_template: >-
                          {{ as_timestamp(cfg_0, 0) > 0 and as_timestamp(states('sensor.ecco_clock_dongle_last_configuration_update'), 0) > as_timestamp(cfg_0, 0) }}
                        timeout: "00:02:30"
                        continue_on_timeout: true
                      - variables:
                          cfg_1: "{{ states('sensor.ecco_clock_dongle_last_configuration_update') }}"
                      - wait_template: >-
                          {{ as_timestamp(cfg_0, 0) > 0 and as_timestamp(cfg_1, 0) > as_timestamp(cfg_0, 0)
                             and as_timestamp(states('sensor.ecco_clock_dongle_last_configuration_update'), 0) > as_timestamp(cfg_1, 0) }}
                        timeout: "00:02:30"
                        continue_on_timeout: true
                      - delay:
                          seconds: 35
                      - variables:
                          later_read: >-
                            {{ as_timestamp(cfg_0, 0) > 0 and as_timestamp(cfg_1, 0) > as_timestamp(cfg_0, 0)
                               and as_timestamp(states('sensor.ecco_clock_dongle_last_configuration_update'), 0) > as_timestamp(cfg_1, 0)
                               and ((as_timestamp(now()) - as_timestamp(states('sensor.ecco_clock_dongle_last_configuration_update'), 0)) | abs) <= 150
                               and is_state('binary_sensor.ecco_clock_dongle_configuration_online', 'on')
                               and is_state('binary_sensor.ecco_clock_dongle_manual_configuration_raw_cache_valid', 'on') }}
                          attempts_moved: >-
                            {{ (states('sensor.ecco_clock_dongle_manual_configuration_write_attempts_since_boot') | float(-2)) != (attempts_before | float(-3))
                               or (attempts_before | float(-1)) < 0 }}
                          att_now: "{{ states('sensor.ecco_clock_dongle_manual_configuration_write_attempts_since_boot') | float(-1) }}"
                          n2_delta: "{{ (att_now - att0) if (att0 >= 0 and att_now >= 0) else 'n/a' }}"
                          n2_ok: "{{ att0 >= 0 and att_now >= 0 and (att_now - att0) == 1 }}"
                          diff: >-
                            {% set d = namespace(v=[]) %}
                            {% set flx = (pre.fl - pre.fl % 4 + (1 if (want | string) == 'Grid' else 0)) if setting == 'charge_source' else pre.fl %}
                            {% if (states(e.live_soc) | int(-1)) != (want if setting == 'target_soc' else pre.soc) %}{% set d.v = d.v + ['SOC ' ~ states(e.live_soc) ~ ' (expected ' ~ (want if setting == 'target_soc' else pre.soc) ~ ')'] %}{% endif %}
                            {% if states(e.live_t) != (wdisp if setting == 'start_time' else pre.t) %}{% set d.v = d.v + ['start ' ~ states(e.live_t) ~ ' (expected ' ~ (wdisp if setting == 'start_time' else pre.t) ~ ')'] %}{% endif %}
                            {% if states(e.live_t_next) != pre.t_next %}{% set d.v = d.v + ['end ' ~ states(e.live_t_next) ~ ' (was ' ~ pre.t_next ~ ')'] %}{% endif %}
                            {% if (states(e.live_pw) | float(-1)) != ((want | float(-1)) if setting == 'power' else pre.pw) %}{% set d.v = d.v + ['power ' ~ states(e.live_pw) ~ ' (expected ' ~ ((want | float(-1)) if setting == 'power' else pre.pw) ~ ')'] %}{% endif %}
                            {% if states(e.live_src) != ((want | string) if setting == 'charge_source' else pre.src) %}{% set d.v = d.v + ['source ' ~ states(e.live_src) ~ ' (expected ' ~ ((want | string) if setting == 'charge_source' else pre.src) ~ ')'] %}{% endif %}
                            {% if states(e.live_mode) != pre.mode %}{% set d.v = d.v + ['mode ' ~ states(e.live_mode) ~ ' (was ' ~ pre.mode ~ ')'] %}{% endif %}
                            {% if (states(e.live_flags) | float(-1)) < 0 or (states(e.live_flags) | float(-1)) != flx %}{% set d.v = d.v + ['flags ' ~ states(e.live_flags) ~ ' (expected ' ~ flx ~ ')'] %}{% endif %}
                            {% if states('binary_sensor.ecco_clock_dongle_ecco_battery_grid_charge_enabled') != pre.gc %}{% set d.v = d.v + ['grid charge ' ~ states('binary_sensor.ecco_clock_dongle_ecco_battery_grid_charge_enabled') ~ ' (was ' ~ pre.gc ~ ')'] %}{% endif %}
                            {{ d.v | join('; ') }}
                          unchanged: >-
                            {{ (states(e.live_soc) | int(-1)) == pre.soc and states(e.live_t) == pre.t and states(e.live_t_next) == pre.t_next
                               and (states(e.live_pw) | float(-1)) == pre.pw and states(e.live_src) == pre.src and states(e.live_mode) == pre.mode
                               and states(e.live_flags) == pre.flags
                               and states('binary_sensor.ecco_clock_dongle_ecco_battery_grid_charge_enabled') == pre.gc }}
                      - choose:
                          # The firmware refused at its gate - claimed only when its gate-pass counter did not move AND
                          # the two later reads show every written register still at its pre-edit value.
                          - conditions:
                              - condition: template
                                value_template: "{{ fw_result.startswith('REJECTED') and later_read and not attempts_moved and unchanged }}"
                            sequence:
                              - action: input_text.set_value
                                target:
                                  entity_id: input_text.ecco_cfg_edit_last_result
                                data:
                                  value: >-
                                    FAILED - the firmware refused the Apply ({{ fw_result }}); nothing written (counter and later reads agree)
                              - action: persistent_notification.create
                                data:
                                  notification_id: ecco_cfg_edit
                                  title: "ECCO: configuration edit refused by the dongle"
                                  message: >-
                                    {{ states('input_text.ecco_cfg_edit_last_result') }}
                        default:
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: >-
                                      {{ fw_result.startswith('VERIFIED OK - manual Slot ' ~ n ~ ' ') and later_read
                                         and diff | length == 0 and n2_ok }}
                                sequence:
                                  - action: input_text.set_value
                                    target:
                                      entity_id: input_text.ecco_cfg_last_owner_edit
                                    data:
                                      value: >-
                                        {{ now().strftime('%Y-%m-%d %H:%M:%S') }} slot {{ n }} {{ label }} (register {{ reg }}) {{ bdisp }} -> {{ wdisp }} (owner, Advanced Configuration)
                                  - action: input_text.set_value
                                    target:
                                      entity_id: input_text.ecco_cfg_edit_last_result
                                    data:
                                      value: >-
                                        APPLIED AND VERIFIED - slot {{ n }} {{ label }} {{ bdisp }} -> {{ wdisp }}: firmware readback and an independent later read of every written register agree
                                  - action: persistent_notification.dismiss
                                    data:
                                      notification_id: ecco_cfg_edit_review
                                  # F1 (acs1): a start-time edit also moved slot N-1's END (slot 1's start is slot 6's end), so slot N-1's Manual Controls staging holds
                                  #    the old boundary. ONE Load Current Slot N-1 press refreshes it. It writes no inverter register, never arms and never presses
                                  #    an Apply; the edit is already judged SUCCESSFUL and stays so whatever happens here. Pressed only when the firmware would
                                  #    accept a Load (bounded wait), and only believed when slot N-1's staged end equals the new boundary after the firmware
                                  #    reported that Load. Not retried; the notification below says plainly when the staging could not be refreshed.
                                  - variables:
                                      pn: "{{ 6 if n == 1 else n - 1 }}"
                                  - if:
                                      - condition: template
                                        value_template: "{{ setting == 'start_time' }}"
                                    then:
                                      - wait_template: >-
                                          {{ is_state('binary_sensor.ecco_clock_dongle_manual_configuration_raw_cache_valid', 'on') and is_state('binary_sensor.ecco_clock_dongle_manual_write_in_progress', 'off')
                                             and is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'off')
                                             and is_state('binary_sensor.ecco_clock_dongle_free_power_active', 'off') and is_state('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress', 'off')
                                             and is_state('binary_sensor.ecco_clock_dongle_free_power_snapshot_valid', 'off')
                                             and is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'off') and is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress', 'off')
                                             and is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_snapshot_valid', 'off')
                                             and is_state('sensor.ecco_clock_dongle_reg244_original_snapshot', '—') }}
                                        timeout: "00:01:00"
                                        continue_on_timeout: true
                                      - if:
                                          - condition: template
                                            value_template: >-
                                              {{ is_state('binary_sensor.ecco_clock_dongle_manual_configuration_raw_cache_valid', 'on') and is_state('binary_sensor.ecco_clock_dongle_manual_write_in_progress', 'off')
                                                 and is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'off')
                                                 and is_state('binary_sensor.ecco_clock_dongle_free_power_active', 'off') and is_state('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress', 'off')
                                                 and is_state('binary_sensor.ecco_clock_dongle_free_power_snapshot_valid', 'off')
                                                 and is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'off') and is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress', 'off')
                                                 and is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_snapshot_valid', 'off')
                                                 and is_state('sensor.ecco_clock_dongle_reg244_original_snapshot', '—') }}
                                        then:
                                          - action: button.press
                                            continue_on_error: true
                                            target:
                                              entity_id: "{{ e.p_load }}"
                                          - wait_template: >-
                                              {{ (states(e.p_en) | float(-1)) == (want | float(-2))
                                                 and states('sensor.ecco_clock_dongle_manual_configuration_last_result').startswith('Manual staging loaded from current inverter Slot ' ~ pn ~ ' ') }}
                                            timeout: "00:00:20"
                                            continue_on_timeout: true
                                  - variables:
                                      f1_ok: >-
                                        {{ setting == 'start_time' and (states(e.p_en) | float(-1)) == (want | float(-2))
                                          and states('sensor.ecco_clock_dongle_manual_configuration_last_result').startswith('Manual staging loaded from current inverter Slot ' ~ pn ~ ' ') }}
                                  - action: persistent_notification.create
                                    data:
                                      notification_id: ecco_cfg_edit
                                      title: "ECCO: TOU slot {{ n }} {{ label }} changed to {{ wdisp }}"
                                      message: >-
                                        Verified on the inverter (was {{ bdisp }}); every other value written with slot {{ n }} is unchanged{% if setting == 'start_time' %} (register {{ reg }} is also the end of slot {{ 6 if n == 1 else n - 1 }}, which now ends at {{ wdisp }}){% endif %}.
                                        {% if setting == 'start_time' %}The fallback profile now shows CONTEXT (slot times are context): if this is the new normal, Review and Save the fallback profile. {% if f1_ok %}Slot {{ pn }}'s Manual Controls staging was refreshed by the editor (one Load Current Slot {{ pn }} press, no register written): its staged end now holds {{ wdisp }}.{% else %}Slot {{ pn }}'s Manual Controls staging could NOT be refreshed by the editor. Before any Manual Controls Apply of slot {{ pn }}, press Load Current Slot {{ pn }} (or Load All): its staged end still holds the old {{ bdisp }}.{% endif %}{% else %}The fallback profile now differs from the inverter (Fallback status DRIFT): if this is the new normal, Review and Save the fallback profile.{% endif %}
                                        To undo, review slot {{ n }} {{ label }} back to {{ bdisp }} (setting {{ setting }}) and confirm with: SET SLOT {{ n }} {{ uphr }} REVIEW <the new review code>
                            default:
                              - action: input_text.set_value
                                target:
                                  entity_id: input_text.ecco_cfg_edit_last_result
                                data:
                                  value: >-
                                    UNCERTAIN - firmware: {{ fw_result[:60] }}; later read: {{ 'incomplete' if not later_read else (diff[:80] if diff else 'all as expected') }}{% if not n2_ok %}; gate counter {{ att0 | int(-1) }} -> {{ att_now | int(-1) }}, not +1{% endif %}
                              - action: input_boolean.turn_on
                                target:
                                  entity_id: input_boolean.ecco_cfg_edit_review_required
                              - action: persistent_notification.create
                                data:
                                  notification_id: ecco_cfg_edit
                                  title: "ECCO: configuration edit outcome NOT proven - manual review needed"
                                  message: >-
                                    Slot {{ n }} {{ label }} {{ bdisp }} -> {{ wdisp }}. Firmware said: {{ fw_result }}. Independent read: {{ 'no complete later configuration read' if not later_read else (diff if diff else 'all registers as expected, but the firmware did not confirm') }}. {% if not n2_ok %}The firmware's gate-pass counter went {{ att0 | int(-1) }} -> {{ att_now | int(-1) }} (delta {{ n2_delta }}; exactly +1 was expected for this one Apply), so another Apply - possibly of a different slot - may have run while the editor was armed or while the outcome was being judged, or the counter is unreadable or was reset. No undo is offered.{% endif %} Do NOT retry. Open Manual Controls, press Load Current Slot {{ n }}, and compare every slot {{ n }} value with the inverter's own display; correct anything wrong there deliberately. Free Power and Dump to Grid restore whatever they snapshot next, so settle the slot first. Edits stay locked until you run ECCO - Acknowledge configuration edit review.
                    else:
                      # The Apply was NOT pressed, but the write enable was ON and the firmware accepts ANY Apply press while it is on, so 'nothing pressed' is not
                      #    'nothing written': an Apply by someone else can land in the armed window. Disarm now, give the firmware's gate-pass counter time to
                      #    publish (every 30 s), and claim 'nothing written' only if the counter is unchanged since before the staging, no inverter write was
                      #    seen since (the marker, the write-in-progress flag) and the firmware's last result shows no write. Otherwise UNCERTAIN and locked.
                      - action: switch.turn_off
                        continue_on_error: true
                        target:
                          entity_id: switch.ecco_clock_dongle_manual_configuration_write_enable
                      - wait_template: "{{ is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'off') }}"
                        timeout: "00:00:10"
                        continue_on_timeout: true
                      - delay:
                          seconds: 35
                      - variables:
                          w_att: "{{ states('sensor.ecco_clock_dongle_manual_configuration_write_attempts_since_boot') | float(-1) }}"
                          w_txt: "{{ states('sensor.ecco_clock_dongle_manual_configuration_last_result')[:120] }}"
                          w_seen: >-
                            {{ not is_state('input_boolean.ecco_cfg_edit_write_seen', 'off') or not is_state('binary_sensor.ecco_clock_dongle_manual_write_in_progress', 'off')
                               or w_txt.startswith('Writing Slot') or w_txt.startswith('VERIFIED OK') or w_txt.startswith('FAILED - one or more write transactions')
                               or w_txt.startswith('VERIFY FAILED') }}
                          w_proven: "{{ att0 >= 0 and w_att >= 0 and w_att == att0 and not w_seen }}"
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ w_proven }}"
                            sequence:
                              - action: input_text.set_value
                                target:
                                  entity_id: input_text.ecco_cfg_edit_last_result
                                data:
                                  value: >-
                                    FAILED - a safety check changed just before the Apply ({{ refusal3 if refusal3 else ('no quiet Modbus window was found: no clean telemetry poll completion clear of the inverter clock read within 25 s of the fresh read' if not bus_quiet else 'the staged values, the helper sync, the arm or the quiet-window timing could not be confirmed') }}); nothing pressed, nothing written
                        default:
                          - action: input_text.set_value
                            target:
                              entity_id: input_text.ecco_cfg_edit_last_result
                            data:
                              value: >-
                                UNCERTAIN - the Apply was not pressed, but an inverter write may have happened while the editor was armed (gate counter {{ att0 }} -> {{ w_att }}, write seen {{ 'yes' if w_seen else 'no' }}, firmware: {{ w_txt[:50] }})
                          - action: input_boolean.turn_on
                            target:
                              entity_id: input_boolean.ecco_cfg_edit_review_required
                          - action: persistent_notification.create
                            data:
                              notification_id: ecco_cfg_edit
                              title: "ECCO: configuration edit outcome NOT proven - manual review needed"
                              message: >-
                                Slot {{ n }} {{ label }} {{ bdisp }} -> {{ wdisp }}. The editor stopped before it pressed Apply ({{ refusal3 if refusal3 else 'a safety check changed' }}),
                                but the Manual Configuration Write Enable was on and the firmware accepts any Apply press while it is on, so an Apply by someone else may have run.
                                Observed: firmware gate-pass counter {{ att0 }} before the staging and {{ w_att }} now; an inverter write was {{ 'seen' if w_seen else 'not seen' }}; firmware last result: {{ w_txt }}.
                                Live slot {{ n }}: start {{ states(e.live_t) }}, end {{ states(e.live_t_next) }}, power {{ states(e.live_pw) }} W, SOC {{ states(e.live_soc) }} %, charge source {{ states(e.live_src) }}, mode {{ states(e.live_mode) }}.
                                Do NOT retry. Open Manual Controls, press Load Current Slot {{ n }}, and compare every slot {{ n }} value with the inverter's own display; correct anything wrong there deliberately.
                                Free Power and Dump to Grid restore whatever they snapshot next, so settle the slot first. Edits stay locked until you run ECCO - Acknowledge configuration edit review.
                else:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ecco_cfg_edit_last_result
                    data:
                      value: >-
                        FAILED - the staged slot {{ n }} did not match the live slot after a fresh read, or the Manual Controls helpers did not settle; nothing pressed, nothing written
      # The write enable always ends off (it only permits an Apply) - and must be SEEN off.
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.ecco_clock_dongle_manual_configuration_write_enable
      - wait_template: "{{ is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'off') }}"
        timeout: "00:00:10"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'off')
                 and not states('input_text.ecco_cfg_edit_last_result').startswith('REFUSED') }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.ecco_cfg_edit_last_result
            data:
              value: >-
                UNCERTAIN - the write enable could not be confirmed off after the edit (outcome before: {{ states('input_text.ecco_cfg_edit_last_result')[:120] }})
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.ecco_cfg_edit_review_required
          - action: persistent_notification.create
            data:
              notification_id: ecco_cfg_edit
              title: "ECCO: Manual Configuration Write Enable not confirmed off"
              message: >-
                Turn it off in Manual Controls and check every TOU slot. Do NOT retry. Open Manual Controls, press Load Current Slot {{ n }}, and compare every slot {{ n }} value with the inverter's own display; correct anything wrong there deliberately. Free Power and Dump to Grid restore whatever they snapshot next, so settle the slot first. Edits stay locked until you run ECCO - Acknowledge configuration edit review.
      # F2 (acs1): slot N's Manual Controls staging holds the reviewed value once the editor staged it. It is re-Loaded (ONE Load Current Slot N
      #    press: no register written, never armed, never an Apply) ONLY after one of two PROVEN outcomes: (a) the run stopped after the staging and
      #    before the Apply press AND the pre-press branch above proved that no manual-path write happened (the firmware's gate-pass counter is
      #    unchanged since before the staging, after the time it needs to publish; no write-in-progress and no write text was seen), or (b) the
      #    firmware refused at its gate with the refusal text AND an unchanged gate-pass counter AND both later reads at the pre-edit values (the
      #    verdict above). Any other outcome is UNCERTAIN with the lock (already set, which also keeps this block off). Evaluated AFTER the write
      #    enable was confirmed off. Never clears uncertainty.
      - variables:
          f2_load: >-
            {{ is_state('input_boolean.ecco_cfg_edit_review_required', 'off')
               and (states('input_text.ecco_cfg_edit_last_result').startswith('FAILED - a safety check changed just before the Apply')
                    or states('input_text.ecco_cfg_edit_last_result').startswith('FAILED - the firmware refused the Apply')) }}
      - if:
          - condition: template
            value_template: "{{ f2_load }}"
        then:
          - wait_template: >-
              {{ is_state('binary_sensor.ecco_clock_dongle_manual_configuration_raw_cache_valid', 'on') and is_state('binary_sensor.ecco_clock_dongle_manual_write_in_progress', 'off')
                 and is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'off')
                 and is_state('binary_sensor.ecco_clock_dongle_free_power_active', 'off') and is_state('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress', 'off')
                 and is_state('binary_sensor.ecco_clock_dongle_free_power_snapshot_valid', 'off')
                 and is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'off') and is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress', 'off')
                 and is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_snapshot_valid', 'off')
                 and is_state('sensor.ecco_clock_dongle_reg244_original_snapshot', '—') }}
            timeout: "00:01:00"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: >-
                  {{ is_state('binary_sensor.ecco_clock_dongle_manual_configuration_raw_cache_valid', 'on') and is_state('binary_sensor.ecco_clock_dongle_manual_write_in_progress', 'off')
                     and is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'off')
                     and is_state('binary_sensor.ecco_clock_dongle_free_power_active', 'off') and is_state('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress', 'off')
                     and is_state('binary_sensor.ecco_clock_dongle_free_power_snapshot_valid', 'off')
                     and is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'off') and is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress', 'off')
                     and is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_snapshot_valid', 'off')
                     and is_state('sensor.ecco_clock_dongle_reg244_original_snapshot', '—') }}
            then:
              - action: button.press
                continue_on_error: true
                target:
                  entity_id: "{{ e.load }}"
              - delay:
                  seconds: 3
              - wait_template: >-
                  {{ (states(e.st) | float(-1)) == ((states(e.live_t) | replace(':', '')) | int(-2))
                     and (states(e.en) | float(-1)) == ((states(e.live_t_next) | replace(':', '')) | int(-2))
                     and (states(e.pw) | float(-1)) == (states(e.live_pw) | float(-2))
                     and states(e.src) == states(e.live_src) and states(e.src) in ['None', 'Grid', 'Generator', 'Grid + Generator'] and states(e.mode) == states(e.live_mode) and states(e.mode) in ['None', 'General', 'Backup', 'Charge']
                     and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') in ['on', 'off']
                     and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') == states('binary_sensor.ecco_clock_dongle_ecco_battery_grid_charge_enabled')
                     and (states(e.soc) | float(-1)) == (states(e.live_soc) | float(-2))
                     and not is_state('script.ecco_refresh_manual_control_helpers', 'on')
                     and (states(e.h_start) in ['unknown'] or states(e.h_start)[:5] | replace(':', '') | int(-1) == (states(e.st) | int(-2)))
                     and (states(e.h_pw) in ['unknown'] or (states(e.h_pw) | float(-1)) == (states(e.pw) | float(-2)))
                     and (states(e.h_soc) in ['unknown'] or (states(e.h_soc) | float(-1)) == (states(e.soc) | float(-2))) }}
                timeout: "00:00:15"
                continue_on_timeout: true
      - variables:
          f2_ok: >-
            {{ f2_load and (states(e.st) | float(-1)) == ((states(e.live_t) | replace(':', '')) | int(-2))
               and (states(e.en) | float(-1)) == ((states(e.live_t_next) | replace(':', '')) | int(-2))
               and (states(e.pw) | float(-1)) == (states(e.live_pw) | float(-2))
               and states(e.src) == states(e.live_src) and states(e.src) in ['None', 'Grid', 'Generator', 'Grid + Generator'] and states(e.mode) == states(e.live_mode) and states(e.mode) in ['None', 'General', 'Backup', 'Charge']
               and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') in ['on', 'off']
               and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') == states('binary_sensor.ecco_clock_dongle_ecco_battery_grid_charge_enabled')
               and (states(e.soc) | float(-1)) == (states(e.live_soc) | float(-2))
               and not is_state('script.ecco_refresh_manual_control_helpers', 'on')
               and (states(e.h_start) in ['unknown'] or states(e.h_start)[:5] | replace(':', '') | int(-1) == (states(e.st) | int(-2)))
               and (states(e.h_pw) in ['unknown'] or (states(e.h_pw) | float(-1)) == (states(e.pw) | float(-2)))
               and (states(e.h_soc) in ['unknown'] or (states(e.h_soc) | float(-1)) == (states(e.soc) | float(-2))) }}
      - if:
          - condition: template
            value_template: "{{ states('input_text.ecco_cfg_edit_last_result').startswith('FAILED') }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: ecco_cfg_edit
              title: "ECCO: configuration edit did not complete"
              message: >-
                {{ states('input_text.ecco_cfg_edit_last_result') }}{% if f2_load %} {% if f2_ok %}Slot {{ n }}'s Manual Controls staging was refreshed to the live values (one Load Current Slot {{ n }} press, no register written).{% else %}Slot {{ n }}'s Manual Controls staging may still hold the reviewed value and could NOT be refreshed: press Load Current Slot {{ n }} (or Load All) before any Manual Controls Apply of that slot.{% endif %}{% endif %}
      # Judged: out of flight (a refused run never set it, and must not clear an earlier run's marker).
      - if:
          - condition: template
            value_template: "{{ not states('input_text.ecco_cfg_edit_last_result').startswith('REFUSED') }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ecco_cfg_edit_in_flight

  ecco_cfg_acknowledge_edit_review:
    alias: "ECCO - Acknowledge configuration edit review"
    description: >-
      After checking the TOU slots by hand following an UNCERTAIN edit, unlock further edits. Writes nothing to the inverter.
    mode: single
    fields:
      confirmation:
        description: "Exactly: I HAVE CHECKED THE TOU SLOTS"
    sequence:
      # Never while an Apply runs or is in flight: refuse without touching the edit's result or its markers.
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('script.ecco_cfg_apply_tou_slot_setting', 'off') or not is_state('input_boolean.ecco_cfg_edit_in_flight', 'off') }}
        then:
          - action: persistent_notification.create
            data:
              notification_id: ecco_cfg_edit_busy
              title: "ECCO: refused - a configuration edit is being applied"
              message: >-
                A Review or Acknowledge was refused because an Advanced Configuration edit is running or has not been
                judged yet; nothing was changed. See ECCO Advanced Config Edit Last Result.
          - stop: "an edit is being applied"
      - if:
          - condition: template
            value_template: "{{ (confirmation | string) == 'I HAVE CHECKED THE TOU SLOTS' }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ecco_cfg_edit_review_required
          - action: input_text.set_value
            target:
              entity_id: input_text.ecco_cfg_edit_last_result
            data:
              value: "ACKNOWLEDGED - the owner checked the TOU slots; edits unlocked"
          - action: persistent_notification.dismiss
            data:
              notification_id: ecco_cfg_edit

automation:
  # An Apply that stopped while it was still in flight was cancelled (a Home Assistant restart, a script reload or an
  # error): its outcome was never judged. Lock and mark it UNCERTAIN at once, alert, then disarm once the dongle is
  # reachable (a service call to an unavailable entity does nothing) and confirm the write enable reads off.
  - id: ecco_cfg_edit_interrupted
    alias: "ECCO - Configuration edit interrupted"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: template
        value_template: >-
          {{ is_state('input_boolean.ecco_cfg_edit_in_flight', 'on') and is_state('script.ecco_cfg_apply_tou_slot_setting', 'off') }}
    actions:
      - if:
          - condition: template
            value_template: >-
              {{ is_state('input_boolean.ecco_cfg_edit_in_flight', 'on') and not is_state('script.ecco_cfg_apply_tou_slot_setting', 'on') }}
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.ecco_cfg_edit_review_required
          - action: input_text.set_value
            target:
              entity_id: input_text.ecco_cfg_edit_last_result
            data:
              value: "UNCERTAIN - the edit was interrupted (Home Assistant restart or script reload) before its outcome was judged"
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ecco_cfg_edit_in_flight
          - action: persistent_notification.create
            data:
              notification_id: ecco_cfg_edit
              title: "ECCO: configuration edit interrupted - manual review needed"
              message: >-
                An Advanced Configuration edit stopped before its outcome was checked. Do NOT retry. Open Manual
                Controls, Load each TOU slot and compare with the inverter's own display; turn the Manual Configuration
                Write Enable off if it is on. Edits stay locked until you run ECCO - Acknowledge configuration edit review.
          - wait_template: "{{ states('switch.ecco_clock_dongle_manual_configuration_write_enable') in ['on', 'off'] }}"
            timeout: "00:10:00"
            continue_on_timeout: true
          - action: switch.turn_off
            continue_on_error: true
            target:
              entity_id: switch.ecco_clock_dongle_manual_configuration_write_enable
          - wait_template: "{{ is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'off') }}"
            timeout: "00:00:10"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ not is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'off') }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: ecco_cfg_edit_arm
                  title: "ECCO: Manual Configuration Write Enable NOT confirmed off"
                  message: >-
                    After an interrupted configuration edit the Manual Configuration Write Enable could not be confirmed
                    off (it reads {{ states('switch.ecco_clock_dongle_manual_configuration_write_enable') }}). Turn it off in Manual Controls now, then check every TOU slot.

  # acs1: the editor's own record of an inverter write it did not make. While an edit is in flight, any sign of a manual-path write (the write-in-progress
  # flag leaving off, or the firmware's last result showing a write) sets input_boolean.ecco_cfg_edit_write_seen. The Apply clears it before it stages
  # anything and reads it when a run stops before its press: a set marker means an Apply by someone else may have run while the editor was armed.
  - id: ecco_cfg_edit_write_seen
    alias: "ECCO - Configuration edit saw an inverter write"
    mode: queued
    triggers:
      - trigger: template
        value_template: >-
          {{ not is_state('binary_sensor.ecco_clock_dongle_manual_write_in_progress', 'off')
             or states('sensor.ecco_clock_dongle_manual_configuration_last_result').startswith('Writing Slot')
             or states('sensor.ecco_clock_dongle_manual_configuration_last_result').startswith('VERIFIED OK - manual Slot')
             or states('sensor.ecco_clock_dongle_manual_configuration_last_result').startswith('FAILED - one or more write transactions')
             or states('sensor.ecco_clock_dongle_manual_configuration_last_result').startswith('VERIFY FAILED') }}
    conditions:
      - condition: template
        value_template: "{{ is_state('input_boolean.ecco_cfg_edit_in_flight', 'on') }}"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ecco_cfg_edit_write_seen
