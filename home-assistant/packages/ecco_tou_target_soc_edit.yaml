# ECCO Pro - Advanced Configuration, Stage 1 (prototype): a guarded owner edit of ONE setting of ONE TOU slot
#
# GENERATED TEXT, never hand-written: home-assistant/prototypes/acs-stage1/acs_stage1_transform.py derives this package in memory from
# the installed Stage 0 package (ecco_tou_target_soc_edit.yaml) by exact replacements. It is a drop-in SUPERSET of Stage 0 with the same
# helpers, the same acknowledge script and the same watchdog automation, and it would REPLACE Stage 0 at integration: the two packages
# can never be installed together (they declare the same helpers, the same acknowledge script and the same watchdog automation).
#
# Scope: exactly one value of one slot per request, and nothing else is staged. The settings:
#   target_soc     TOU slot N target SOC (inverter register 267+N, %), bound max(inverter shutdown SOC, ECCO reserve)..100
#   power          slot N power (register 255+N, W): a multiple of 100, 500..8000. The firmware accepts 0..8000; below 500 W the live
#                  slot would leave the saved fallback profile's domain and every further edit, an undo included, would be refused
#   start_time     slot N start (register 249+N, HH:MM on the 5-minute grid). It is ALSO slot N-1's end, and slot 1's start is slot 6's
#                  end. The six starts (each in the firmware's HH:MM form) must be strictly ascending before and after; the edit is
#                  refused within 15 minutes of the old or the new boundary, while the local time lies between the old and the new
#                  boundary (it would change the active slot now), and when the inverter's own clock (Inverter Time) is more than 120 s
#                  from Home Assistant's. Slot N-1's Manual Controls staging keeps the old end until it is Loaded again (see the notice)
#   charge_source  slot N charge source (bits 0-1 of register 273+N): None or Grid only (no generator is evidenced). The mode bits and
#                  the reserved bits are kept because the staged mode equals the live mode and the firmware keeps cache & 0xFFE0. None is
#                  staged with select.select_first (None is the select's first option) and Grid with select.select_option, because
#                  Home Assistant result-parses even static service data and would turn a static "None" into Python None
# Refused on every setting: 00:00-03:00 local on the last Sunday of March and of October (UK clock change nights).
# This package writes NO register itself: it drives the existing, live-proven firmware path once per request (Load Current Slot N To
# Manual Staging -> Manual Configuration Write Enable -> Apply Manual Slot N Settings). That path rewrites the whole slot (232 bit0, the
# slot's start/end pair, power, SOC, flags) from staging, verifies by exact readback, and has NO durable snapshot and NO rollback; this
# package therefore proves, immediately before arming, that every staged value except the edited one equals the live slot, and never
# claims success without an independent later read of every one of those registers.
#
# Stages (explicit, separate):
#   EDIT     the owner picks a slot, a setting and a value (script fields)
#   REVIEW   script.ecco_cfg_review_tou_slot_setting - writes nothing; runs the full safety gate; records the plan (register, setting,
#            old -> new) with a one-time review code (valid 10 minutes)
#   CONFIRM  the exact phrase "SET SLOT <n> TARGET SOC <x> REVIEW <code>", "SET SLOT <n> POWER <w> W REVIEW <code>",
#            "SET SLOT <n> START <HH:MM> REVIEW <code>" or "SET SLOT <n> CHARGE SOURCE <GRID|NONE> REVIEW <code>"
#   APPLY    script.ecco_cfg_apply_tou_slot_setting - re-runs the gate; waits for a fresh configuration read; re-reads the shutdown SOC
#            and the reserve; Loads; waits until the Manual Controls helper sync is at a fixed point; stages only the edited field;
#            proves staged == live for every other field; waits for a quiet gap of the dongle's Modbus poll cycle (acs0r1: 1.5 s after
#            an observed telemetry poll completion, clear of the inverter clock read, at most 25 s after the fresh read); arms;
#            re-checks; presses Apply ONCE
#   VERIFY   success only on the firmware's VERIFIED OK AND an independent later configuration read in which the edited field is the
#            request and every other written register is its pre-edit value (for the charge source: the raw flags are the pre-edit
#            flags with bits 0-1 replaced; for the start time: the slot's end, the next slot's start, is unchanged)
#   ANYTHING ELSE: stop, disarm, alert with the observed values and recovery steps, and lock further edits until the owner
#            acknowledges (script.ecco_cfg_acknowledge_edit_review). Never retried, never a compensating write.
# An Apply holds input_boolean.ecco_cfg_edit_in_flight from before its first press until its outcome is judged; a run that
# stops while it is still on (a Home Assistant restart, a script reload) is caught by the watchdog automation below, which
# locks and alerts at once and then disarms. Review and Acknowledge refuse while an Apply runs or is in flight.
# The target SOC range is max(inverter shutdown SOC, ECCO minimum battery reserve) .. 100, read fresh before the Apply; the
# reserve helper is only read, never changed.

input_text:
  ecco_cfg_edit_last_result:
    name: ECCO Advanced Config Edit Last Result
    max: 255
  ecco_cfg_last_owner_edit:
    name: ECCO Last Owner Configuration Edit
    max: 255
  ecco_cfg_edit_review:
    name: ECCO Advanced Config Edit Pending Review
    max: 255

input_boolean:
  ecco_cfg_edit_review_required:
    name: ECCO Advanced Config Edit Needs Manual Review
    icon: mdi:alert-octagon
  ecco_cfg_edit_in_flight:
    name: ECCO Advanced Config Edit In Flight
    icon: mdi:progress-wrench
  ecco_cfg_edit_write_seen:
    name: ECCO Advanced Config Edit Inverter Write Seen
    icon: mdi:eye-check

script:
  ecco_cfg_review_tou_slot_setting:
    alias: "ECCO - Review a TOU slot setting edit"
    description: >-
      REVIEW stage: writes nothing. Checks the edit of ONE setting of ONE slot (target SOC, power, start time or charge source)
      against every safety gate and records the plan with a one-time review code for script.ecco_cfg_apply_tou_slot_setting.
    mode: single
    fields:
      slot:
        description: "TOU slot 1-6"
      setting:
        description: "target_soc, power, start_time or charge_source"
      value:
        description: "New value: SOC in %, power in W (500-8000, multiple of 100), start time HH:MM (5-minute grid) or charge source Grid / None"
    sequence:
      # Never while an Apply runs or is in flight: refuse without touching the edit's result or its markers.
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('script.ecco_cfg_apply_tou_slot_setting', 'off') or not is_state('input_boolean.ecco_cfg_edit_in_flight', 'off') }}
        then:
          - action: persistent_notification.create
            data:
              notification_id: ecco_cfg_edit_busy
              title: "ECCO: refused - a configuration edit is being applied"
              message: >-
                A Review or Acknowledge was refused because an Advanced Configuration edit is running or has not been
                judged yet; nothing was changed. See ECCO Advanced Config Edit Last Result.
          - stop: "an edit is being applied"
      - variables:
          n: "{{ slot | int(0) }}"
          want: >-
            {% if setting == 'target_soc' %}{{ value | int(-1) }}{% elif setting == 'power' %}{{ (value | int(-1)) if (value | float(-1)) == (value | int(-1)) else -1 }}{% elif setting == 'start_time' %}{% set s = (value | string) %}{% set s = s[:5] if (s | length == 8 and s[5:] == ':00') else s %}{{ ((s[:2] | int(99)) * 100 + (s[3:] | int(99))) if (s | length == 5 and s[2] == ':' and s[:2].isdigit() and s[3:].isdigit() and (s[:2] | int(99)) <= 23 and (s[3:] | int(99)) <= 59 and (s[3:] | int(1)) % 5 == 0) else -1 }}{% elif setting == 'charge_source' %}{{ value | string }}{% else %}-1{% endif %}
          reg: "{{ {'target_soc': 267, 'power': 255, 'start_time': 249, 'charge_source': 273}.get(setting, 0) + n }}"
          label: "{{ {'target_soc': 'target SOC', 'power': 'power', 'start_time': 'start time', 'charge_source': 'charge source'}.get(setting, 'setting') }}"
          wdisp: >-
            {% if setting == 'target_soc' %}{{ want }} %{% elif setting == 'power' %}{{ want }} W{% elif setting == 'start_time' %}{{ '%02d:%02d' | format(want // 100, want % 100) }}{% else %}{{ want }}{% endif %}
          phr: >-
            {% if setting == 'target_soc' %}TARGET SOC {{ want }}{% elif setting == 'power' %}POWER {{ want }} W{% elif setting == 'start_time' %}START {{ wdisp }}{% else %}CHARGE SOURCE {{ want | string | upper }}{% endif %}
          wmin: "{{ ((want // 100) * 60 + want % 100) if (setting == 'start_time' and want >= 0) else -1 }}"
          e: >-
            {% set m = {
            1: {'reg_soc': 268, 'load': 'button.ecco_clock_dongle_load_current_slot_1_to_manual_staging',
                'apply': 'button.ecco_clock_dongle_apply_manual_slot_1_settings',
                'st': 'number.ecco_clock_dongle_manual_slot_1_start_hhmm', 'en': 'number.ecco_clock_dongle_manual_slot_1_end_hhmm',
                'pw': 'number.ecco_clock_dongle_manual_slot_1_power', 'soc': 'number.ecco_clock_dongle_manual_slot_1_target_soc',
                'src': 'select.ecco_clock_dongle_manual_slot_1_charge_source', 'mode': 'select.ecco_clock_dongle_manual_slot_1_mode',
                'live_t': 'sensor.ecco_clock_dongle_ecco_timezone1_time', 'live_t_next': 'sensor.ecco_clock_dongle_ecco_timezone2_time',
                'live_pw': 'sensor.ecco_clock_dongle_ecco_timezone1_power', 'live_soc': 'sensor.ecco_clock_dongle_ecco_timezone1_soc',
                'live_src': 'sensor.ecco_clock_dongle_ecco_timezone1_charge', 'live_mode': 'sensor.ecco_clock_dongle_ecco_timezone1_mode',
                'live_flags': 'sensor.ecco_clock_dongle_ecco_timezone1_raw_flags',
                'h_start': 'input_datetime.ecco_manual_slot_1_start_time',
                'h_pw': 'input_number.ecco_manual_slot_1_power_staged', 'h_soc': 'input_number.ecco_manual_slot_1_soc_staged',
                'p_load': 'button.ecco_clock_dongle_load_current_slot_6_to_manual_staging', 'p_en': 'number.ecco_clock_dongle_manual_slot_6_end_hhmm'},
            2: {'reg_soc': 269, 'load': 'button.ecco_clock_dongle_load_current_slot_2_to_manual_staging',
                'apply': 'button.ecco_clock_dongle_apply_manual_slot_2_settings',
                'st': 'number.ecco_clock_dongle_manual_slot_2_start_hhmm', 'en': 'number.ecco_clock_dongle_manual_slot_2_end_hhmm',
                'pw': 'number.ecco_clock_dongle_manual_slot_2_power', 'soc': 'number.ecco_clock_dongle_manual_slot_2_target_soc',
                'src': 'select.ecco_clock_dongle_manual_slot_2_charge_source', 'mode': 'select.ecco_clock_dongle_manual_slot_2_mode',
                'live_t': 'sensor.ecco_clock_dongle_ecco_timezone2_time', 'live_t_next': 'sensor.ecco_clock_dongle_ecco_timezone3_time',
                'live_pw': 'sensor.ecco_clock_dongle_ecco_timezone2_power', 'live_soc': 'sensor.ecco_clock_dongle_ecco_timezone2_soc',
                'live_src': 'sensor.ecco_clock_dongle_ecco_timezone2_charge', 'live_mode': 'sensor.ecco_clock_dongle_ecco_timezone2_mode',
                'live_flags': 'sensor.ecco_clock_dongle_ecco_timezone2_raw_flags',
                'h_start': 'input_datetime.ecco_manual_slot_2_start_time',
                'h_pw': 'input_number.ecco_manual_slot_2_power_staged', 'h_soc': 'input_number.ecco_manual_slot_2_soc_staged',
                'p_load': 'button.ecco_clock_dongle_load_current_slot_1_to_manual_staging', 'p_en': 'number.ecco_clock_dongle_manual_slot_1_end_hhmm'},
            3: {'reg_soc': 270, 'load': 'button.ecco_clock_dongle_load_current_slot_3_to_manual_staging',
                'apply': 'button.ecco_clock_dongle_apply_manual_slot_3_settings',
                'st': 'number.ecco_clock_dongle_manual_slot_3_start_hhmm', 'en': 'number.ecco_clock_dongle_manual_slot_3_end_hhmm',
                'pw': 'number.ecco_clock_dongle_manual_slot_3_power', 'soc': 'number.ecco_clock_dongle_manual_slot_3_target_soc',
                'src': 'select.ecco_clock_dongle_manual_slot_3_charge_source', 'mode': 'select.ecco_clock_dongle_manual_slot_3_mode',
                'live_t': 'sensor.ecco_clock_dongle_ecco_timezone3_time', 'live_t_next': 'sensor.ecco_clock_dongle_ecco_timezone4_time',
                'live_pw': 'sensor.ecco_clock_dongle_ecco_timezone3_power', 'live_soc': 'sensor.ecco_clock_dongle_ecco_timezone3_soc',
                'live_src': 'sensor.ecco_clock_dongle_ecco_timezone3_charge', 'live_mode': 'sensor.ecco_clock_dongle_ecco_timezone3_mode',
                'live_flags': 'sensor.ecco_clock_dongle_ecco_timezone3_raw_flags',
                'h_start': 'input_datetime.ecco_manual_slot_3_start_time',
                'h_pw': 'input_number.ecco_manual_slot_3_power_staged', 'h_soc': 'input_number.ecco_manual_slot_3_soc_staged',
                'p_load': 'button.ecco_clock_dongle_load_current_slot_2_to_manual_staging', 'p_en': 'number.ecco_clock_dongle_manual_slot_2_end_hhmm'},
            4: {'reg_soc': 271, 'load': 'button.ecco_clock_dongle_load_current_slot_4_to_manual_staging',
                'apply': 'button.ecco_clock_dongle_apply_manual_slot_4_settings',
                'st': 'number.ecco_clock_dongle_manual_slot_4_start_hhmm', 'en': 'number.ecco_clock_dongle_manual_slot_4_end_hhmm',
                'pw': 'number.ecco_clock_dongle_manual_slot_4_power', 'soc': 'number.ecco_clock_dongle_manual_slot_4_target_soc',
                'src': 'select.ecco_clock_dongle_manual_slot_4_charge_source', 'mode': 'select.ecco_clock_dongle_manual_slot_4_mode',
                'live_t': 'sensor.ecco_clock_dongle_ecco_timezone4_time', 'live_t_next': 'sensor.ecco_clock_dongle_ecco_timezone5_time',
                'live_pw': 'sensor.ecco_clock_dongle_ecco_timezone4_power', 'live_soc': 'sensor.ecco_clock_dongle_ecco_timezone4_soc',
                'live_src': 'sensor.ecco_clock_dongle_ecco_timezone4_charge', 'live_mode': 'sensor.ecco_clock_dongle_ecco_timezone4_mode',
                'live_flags': 'sensor.ecco_clock_dongle_ecco_timezone4_raw_flags',
                'h_start': 'input_datetime.ecco_manual_slot_4_start_time',
                'h_pw': 'input_number.ecco_manual_slot_4_power_staged', 'h_soc': 'input_number.ecco_manual_slot_4_soc_staged',
                'p_load': 'button.ecco_clock_dongle_load_current_slot_3_to_manual_staging', 'p_en': 'number.ecco_clock_dongle_manual_slot_3_end_hhmm'},
            5: {'reg_soc': 272, 'load': 'button.ecco_clock_dongle_load_current_slot_5_to_manual_staging',
                'apply': 'button.ecco_clock_dongle_apply_manual_slot_5_settings',
                'st': 'number.ecco_clock_dongle_manual_slot_5_start_hhmm', 'en': 'number.ecco_clock_dongle_manual_slot_5_end_hhmm',
                'pw': 'number.ecco_clock_dongle_manual_slot_5_power', 'soc': 'number.ecco_clock_dongle_manual_slot_5_target_soc',
                'src': 'select.ecco_clock_dongle_manual_slot_5_charge_source', 'mode': 'select.ecco_clock_dongle_manual_slot_5_mode',
                'live_t': 'sensor.ecco_clock_dongle_ecco_timezone5_time', 'live_t_next': 'sensor.ecco_clock_dongle_ecco_timezone6_time',
                'live_pw': 'sensor.ecco_clock_dongle_ecco_timezone5_power', 'live_soc': 'sensor.ecco_clock_dongle_ecco_timezone5_soc',
                'live_src': 'sensor.ecco_clock_dongle_ecco_timezone5_charge', 'live_mode': 'sensor.ecco_clock_dongle_ecco_timezone5_mode',
                'live_flags': 'sensor.ecco_clock_dongle_ecco_timezone5_raw_flags',
                'h_start': 'input_datetime.ecco_manual_slot_5_start_time',
                'h_pw': 'input_number.ecco_manual_slot_5_power_staged', 'h_soc': 'input_number.ecco_manual_slot_5_soc_staged',
                'p_load': 'button.ecco_clock_dongle_load_current_slot_4_to_manual_staging', 'p_en': 'number.ecco_clock_dongle_manual_slot_4_end_hhmm'},
            6: {'reg_soc': 273, 'load': 'button.ecco_clock_dongle_load_current_slot_6_to_manual_staging',
                'apply': 'button.ecco_clock_dongle_apply_manual_slot_6_settings',
                'st': 'number.ecco_clock_dongle_manual_slot_6_start_hhmm', 'en': 'number.ecco_clock_dongle_manual_slot_6_end_hhmm',
                'pw': 'number.ecco_clock_dongle_manual_slot_6_power', 'soc': 'number.ecco_clock_dongle_manual_slot_6_target_soc',
                'src': 'select.ecco_clock_dongle_manual_slot_6_charge_source', 'mode': 'select.ecco_clock_dongle_manual_slot_6_mode',
                'live_t': 'sensor.ecco_clock_dongle_ecco_timezone6_time', 'live_t_next': 'sensor.ecco_clock_dongle_ecco_timezone1_time',
                'live_pw': 'sensor.ecco_clock_dongle_ecco_timezone6_power', 'live_soc': 'sensor.ecco_clock_dongle_ecco_timezone6_soc',
                'live_src': 'sensor.ecco_clock_dongle_ecco_timezone6_charge', 'live_mode': 'sensor.ecco_clock_dongle_ecco_timezone6_mode',
                'live_flags': 'sensor.ecco_clock_dongle_ecco_timezone6_raw_flags',
                'h_start': 'input_datetime.ecco_manual_slot_6_start_time',
                'h_pw': 'input_number.ecco_manual_slot_6_power_staged', 'h_soc': 'input_number.ecco_manual_slot_6_soc_staged',
                'p_load': 'button.ecco_clock_dongle_load_current_slot_5_to_manual_staging', 'p_en': 'number.ecco_clock_dongle_manual_slot_5_end_hhmm'}
            } %}
            {{ m.get(n, {}) }}
      - variables:
          refusal: >-
            {% set shutdown = states('sensor.ecco_clock_dongle_ecco_battery_shutdown') | int(-1) %}
            {% set reserve = states('input_number.ecco_minimum_reserve_soc') | int(-1) %}
            {% set lo = [shutdown, reserve] | max %}
            {% set cur = ((states(e.live_soc) | int(-1) if setting == 'target_soc' else (states(e.live_pw) | float(-1) | int(-1) if setting == 'power' else ((states(e.live_t) | replace(':', '')) | int(-1) if setting == 'start_time' else states(e.live_src))))) if e else -1 %}
            {% set tz = [states('sensor.ecco_clock_dongle_ecco_timezone1_time'), states('sensor.ecco_clock_dongle_ecco_timezone2_time'), states('sensor.ecco_clock_dongle_ecco_timezone3_time'),
                states('sensor.ecco_clock_dongle_ecco_timezone4_time'), states('sensor.ecco_clock_dongle_ecco_timezone5_time'), states('sensor.ecco_clock_dongle_ecco_timezone6_time')] %}
            {% set tm = namespace(v=[]) %}{% for s in tz %}{% set ok = s | length == 5 and s[2] == ':' and s[:2].isdigit() and s[3:].isdigit() and (s[:2] | int(99)) <= 23 and (s[3:] | int(99)) <= 59 %}{% set tm.v = tm.v + [((s[:2] | int(99)) * 60 + (s[3:] | int(99))) if ok else -1] %}{% endfor %}
            {% set tt = tm.v %}
            {% set asc = tt[0] >= 0 and tt[0] < tt[1] and tt[1] < tt[2] and tt[2] < tt[3] and tt[3] < tt[4] and tt[4] < tt[5] and tt[5] < 1440 %}
            {% set lb = (tt[n - 2] if n > 1 else -1) if e else 0 %}
            {% set hb = (tt[n] if n < 6 else 1440) if e else 0 %}
            {% set cm = now().hour * 60 + now().minute + now().second / 60 %}
            {% set bo = ((cur // 100) * 60 + cur % 100) if (setting == 'start_time' and cur >= 0) else -9999 %}
            {% set near = setting == 'start_time' and bo >= 0 and (([(cm - bo) % 1440, (bo - cm) % 1440] | min) <= 15 or ([(cm - wmin) % 1440, (wmin - cm) % 1440] | min) <= 15) %}
            {% set mid = setting == 'start_time' and bo >= 0 and wmin >= 0 and (((cm - (bo if wmin > bo else wmin)) % 1440) < ((wmin - bo) | abs)) %}
            {% set invd = ((as_timestamp(states('sensor.ecco_clock_dongle_inverter_time'), 0) - as_timestamp(now())) | abs) %}
            {% set cc = now().month in [3, 10] and now().weekday() == 6 and now().day >= 25 and now().hour < 3 %}
            {% set lm = states('sensor.ecco_clock_dongle_ecco_fallback_profile_live_match') %}
            {% set L = ';' ~ lm ~ ';' %}
            {% set R = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review') ~ ';' %}
            {% set fp_start = as_timestamp(states('input_datetime.ecco_free_power_schedule_start'), 0) %}
            {% set dg_start = as_timestamp(states('input_datetime.ecco_dump_to_grid_schedule_start'), 0) %}
            {% set soon = as_timestamp(now()) + 900 %}
            {% if not is_state('input_boolean.ecco_cfg_edit_review_required', 'off') %}an earlier edit's outcome needs manual review first
            {% elif not e %}invalid slot (1-6)
            {% elif setting not in ['target_soc', 'power', 'start_time', 'charge_source'] %}unknown setting (target_soc, power, start_time or charge_source)
            {% elif setting == 'target_soc' and shutdown < 0 %}inverter shutdown SOC unavailable
            {% elif setting == 'target_soc' and reserve < 0 %}ECCO minimum battery reserve unavailable
            {% elif setting == 'target_soc' and (want < lo or want > 100) %}target SOC must be {{ lo }}-100 % (the greater of the inverter shutdown SOC {{ shutdown }} % and the ECCO reserve {{ reserve }} %)
            {% elif setting == 'power' and (want < 500 or want > 8000 or want % 100 != 0) %}power must be a whole number of watts, a multiple of 100, from 500 to 8000 W (below 500 W the live settings would leave the saved fallback profile's domain, and every further edit, an undo included, would be refused)
            {% elif setting == 'start_time' and want < 0 %}start time must be HH:MM on the 5-minute grid, 00:00-23:55
            {% elif setting == 'charge_source' and (want | string) not in ['Grid', 'None'] %}charge source must be exactly Grid or None (no generator is evidenced and the fallback domain is None or Grid)
            {% elif setting != 'charge_source' and cur < 0 %}live slot {{ label }} unavailable
            {% elif setting == 'power' and (states(e.live_pw) | float(-1)) % 100 != 0 %}the live slot power {{ states(e.live_pw) }} W is not a multiple of 100 W; the undo would be refused - align it first in Manual Controls
            {% elif setting == 'charge_source' and cur not in ['None', 'Grid'] %}the live charge source of slot {{ n }} is {{ cur }}: only None and Grid can be edited
            {% elif (cur | string) == (want | string) %}no change (slot {{ n }} is already {{ wdisp }})
            {% elif setting == 'start_time' and not asc %}the six live slot start times are not strictly ascending (unexpected TOU layout)
            {% elif setting == 'start_time' and not (lb < wmin and wmin < hb) %}the new start time must stay strictly after the previous slot's start and strictly before the next one
            {% elif near %}the local time is within 15 minutes of the old or the new slot boundary
            {% elif mid %}the current local time lies between the old and the new boundary: the edit would change which slot is active right now
            {% elif setting == 'start_time' and invd > 120 %}the inverter clock is more than 120 s from Home Assistant's clock, or unreadable (the inverter runs its TOU slots on its own clock)
            {% elif cc %}UK clock change night: no edit between 00:00 and 03:00 local on the last Sunday of March and of October
            {% elif not is_state('binary_sensor.ecco_clock_dongle_telemetry_online', 'on') or not is_state('binary_sensor.ecco_clock_dongle_configuration_online', 'on')
                  or not is_state('binary_sensor.ecco_clock_dongle_manual_configuration_raw_cache_valid', 'on') %}dongle offline or configuration cache not valid
            {% elif ((as_timestamp(now()) - as_timestamp(states('sensor.ecco_clock_dongle_last_configuration_update'), 0)) | abs) > 150 or not (0 <= (states('sensor.ecco_clock_dongle_ecco_supervision_heartbeat_age') | float(-1)) <= 60) %}the dongle's configuration time or heartbeat is not current (configuration {{ states('sensor.ecco_clock_dongle_last_configuration_update')[:19] }}, heartbeat age {{ states('sensor.ecco_clock_dongle_ecco_supervision_heartbeat_age')[:8] }} s)
            {% elif not is_state('binary_sensor.ecco_clock_dongle_free_power_active', 'off') or not is_state('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress', 'off')
                  or not is_state('binary_sensor.ecco_clock_dongle_free_power_snapshot_valid', 'off') %}Free Power owns the TOU settings (active, starting or restore owed)
            {% elif not is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'off') or not is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress', 'off')
                  or not is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_snapshot_valid', 'off') %}Dump to Grid owns the TOU settings (active, starting or restore owed)
            {% elif not is_state('binary_sensor.ecco_clock_dongle_manual_write_in_progress', 'off') %}another inverter write or fallback operation in progress
            {% elif not is_state('binary_sensor.ecco_clock_dongle_rtc_correction_in_progress', 'off') %}RTC correction in progress
            {% elif (not (armed_by_us | default(false)) and not is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'off'))
                  or not is_state('switch.ecco_clock_dongle_free_power_write_enable', 'off')
                  or not is_state('switch.ecco_clock_dongle_free_power_recovery_arm', 'off') or not is_state('switch.ecco_clock_dongle_dump_to_grid_write_enable', 'off')
                  or not is_state('switch.ecco_clock_dongle_dump_to_grid_recovery_arm', 'off') %}a write or recovery arm is on
            {% elif L.count(';m=') != 1 or L.count(';obl=') != 1 or L.count(';ca=') != 1 or L.count(';eh=') != 1 %}the fallback live match is unavailable or malformed ({{ lm[:60] }})
            {% elif ';obl=FP:CR,DP:CR,R4:CR,BUS:OK;' not in L %}a lease, restore, lockout or register 244 transaction is not clear ({{ lm[:60] }})
            {% elif ';ca=F;' not in L or ';eh=0;' not in L %}the fallback live data is not current or an export hazard is not ruled out ({{ lm[:60] }})
            {% elif ';m=MATCH;' not in L and ';m=DRIFT;' not in L and ';m=CONTEXT;' not in L %}the fallback live match is {{ L.split(';m=')[1].split(';')[0][:16] }}: edits need a valid saved fallback profile, live settings inside its domain and export as in the profile (MATCH, DRIFT or CONTEXT)
            {% elif R.count(';st=') != 1 or ';st=IDLE;' not in R %}a fallback profile Review or Save is in progress (or its state is unknown)
            {% elif not is_state('binary_sensor.ecco_fallback_save_available', 'off') or not is_state('binary_sensor.ecco_fallback_replace_corrupt_available', 'off')
                  or not is_state('binary_sensor.ecco_fallback_invalidate_available', 'off') %}the fallback system is armed for an operation
            {% elif not is_state('sensor.ecco_clock_dongle_ecco_supervision_state', 'SUPERVISED') or not is_state('binary_sensor.ecco_clock_dongle_ecco_supervision_stable', 'on')
                  or not is_state('sensor.ecco_clock_dongle_ecco_failback_shadow_state', 'SHADOW_IDLE') %}supervision not stable or a failback episode is open
            {% elif not is_state('sensor.ecco_clock_dongle_dump_to_grid_export_containment', 'NOT_APPLICABLE')
                  or not is_state('sensor.ecco_clock_dongle_free_power_recovery_evidence_id', '-')
                  or not is_state('sensor.ecco_clock_dongle_reg244_original_snapshot', '—') %}a recovery or containment state is open
            {% elif not is_state('sensor.ecco_clock_dongle_free_power_recovery_state', 'NONE')
                  or not (states('sensor.ecco_clock_dongle_dump_to_grid_recovery_state').startswith('NONE')
                          or states('sensor.ecco_clock_dongle_dump_to_grid_recovery_state').startswith('ACCEPTED')) %}a Free Power or Dump recovery state is open
            {% elif not is_state('script.ecco_free_power_start_scheduled', 'off') or not is_state('script.ecco_dump_to_grid_start_scheduled', 'off') %}a scheduled start is running
            {% elif is_state('input_boolean.ecco_free_power_schedule_armed', 'on') and fp_start < soon %}a scheduled Free Power starts within 15 minutes
            {% elif is_state('input_boolean.ecco_dump_to_grid_schedule_armed', 'on') and dg_start < soon %}a scheduled Dump to Grid starts within 15 minutes
            {% endif %}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ refusal | length > 0 }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.ecco_cfg_edit_last_result
                data:
                  value: >-
                    REVIEW REFUSED - {{ refusal }}; nothing written
        default:
          - variables:
              code: "{{ '%04d' | format((as_timestamp(now()) | int) % 10000) }}"
              before: "{{ (states(e.live_soc) | int(-1) if setting == 'target_soc' else (states(e.live_pw) | float(-1) | int(-1) if setting == 'power' else ((states(e.live_t) | replace(':', '')) | int(-1) if setting == 'start_time' else states(e.live_src)))) }}"
              bdisp: >-
                {% if setting == 'target_soc' %}{{ before }} %{% elif setting == 'power' %}{{ before }} W{% elif setting == 'start_time' %}{{ '%02d:%02d' | format(before // 100, before % 100) }}{% else %}{{ before }}{% endif %}
              lo: >-
                {{ [states('sensor.ecco_clock_dongle_ecco_battery_shutdown') | int(-1), states('input_number.ecco_minimum_reserve_soc') | int(-1)] | max }}
          - action: input_text.set_value
            target:
              entity_id: input_text.ecco_cfg_edit_review
            data:
              value: "{{ n }}|{{ setting }}|{{ want }}|{{ code }}|{{ as_timestamp(now()) | int }}|{{ before }}"
          - action: input_text.set_value
            target:
              entity_id: input_text.ecco_cfg_edit_last_result
            data:
              value: >-
                REVIEWED - slot {{ n }} {{ label }} (register {{ reg }}) {{ bdisp }} -> {{ wdisp }}; confirm with: SET SLOT {{ n }} {{ phr }} REVIEW {{ code }}
          - action: persistent_notification.create
            data:
              notification_id: ecco_cfg_edit_review
              title: "ECCO: review TOU slot {{ n }} {{ label }} {{ bdisp }} -> {{ wdisp }}"
              message: >-
                Change: register {{ reg }} (slot {{ n }} {{ label }}) {{ bdisp }} -> {{ wdisp }}.
                {% if setting == 'target_soc' %}Allowed range {{ lo }}-100 % (inverter shutdown SOC and ECCO reserve, re-read before applying). The fallback profile will then differ (DRIFT) until you Review and Save it.
                {% elif setting == 'power' %}Slot power is the per-slot battery charge/discharge power ceiling, 500-8000 W in steps of 100 W; its meaning depends on register 244 (load/export mode), and Dump to Grid and Free Power temporarily own it. The fallback profile will then differ (DRIFT) until you Review and Save it.
                {% elif setting == 'start_time' %}Register {{ reg }} is also the end of slot {{ 6 if n == 1 else n - 1 }}, which now ends at {{ wdisp }} too (slot 1's start is slot 6's end). The six start times must stay strictly ascending. The fallback profile will show CONTEXT (slot times are context) until you Review and Save it. Slot {{ 6 if n == 1 else n - 1 }}'s Manual Controls staging keeps the old end until you Load it again.
                {% else %}Only None and Grid can be set (no generator is evidenced); the mode bits and the reserved bits are kept. The fallback profile will then differ (DRIFT) until you Review and Save it.
                {% endif %}
                Unchanged and rewritten with their current values: {% if setting != 'start_time' %}start {{ states(e.live_t) }}, {% endif %}end {{ states(e.live_t_next) }}, {% if setting != 'power' %}power {{ states(e.live_pw) }} W, {% endif %}{% if setting != 'target_soc' %}target SOC {{ states(e.live_soc) }} %, {% endif %}{% if setting != 'charge_source' %}charge source {{ states(e.live_src) }}, {% endif %}mode {{ states(e.live_mode) }},
                grid charge {{ states('binary_sensor.ecco_clock_dongle_ecco_battery_grid_charge_enabled') }}.
                {% if (setting == 'charge_source' and (want | string) == 'Grid') or (setting == 'start_time' and states(e.live_src) != 'None') %}A slot with a charge source set makes a scheduled Dump to Grid whose window overlaps it refuse at start (no health alert counts that refusal).
                {% endif %}Do not use SmartDeye or the inverter's own panel until this edit is finished.
                To apply within 10 minutes, run ECCO - Apply a reviewed TOU slot setting edit with:
                SET SLOT {{ n }} {{ phr }} REVIEW {{ code }}

  ecco_cfg_apply_tou_slot_setting:
    alias: "ECCO - Apply a reviewed TOU slot setting edit"
    description: >-
      CONFIRM + APPLY stage for the plan recorded by the review. Changes only the reviewed setting of that slot through the existing
      verified firmware path; never retried; an unproven outcome locks further edits for manual review.
    mode: single
    fields:
      confirmation:
        description: "Exactly: SET SLOT <n> TARGET SOC <x> | POWER <w> W | START <HH:MM> | CHARGE SOURCE <GRID|NONE>, then REVIEW <code> (from the review)"
    sequence:
      - variables:
          rv: "{{ states('input_text.ecco_cfg_edit_review').split('|') }}"
