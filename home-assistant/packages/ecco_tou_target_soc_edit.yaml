          review_problem: >-
            {% if not is_state('input_boolean.ecco_cfg_edit_in_flight', 'off') %}an earlier edit has not been judged yet
            {% elif (states('input_text.ecco_cfg_edit_review').split('|') | count) != 6 or n < 1 %}no pending review (run the review first)
            {% elif as_timestamp(now()) - reviewed_at > 600 %}the review has expired (10 minutes); review again
            {% elif (confirmation | string) != ('SET SLOT ' ~ n ~ ' ' ~ phr ~ ' REVIEW ' ~ code) %}the confirmation phrase does not match the review
            {% elif (((states(e.live_soc) | int(-1) if setting == 'target_soc' else (states(e.live_pw) | float(-1) | int(-1) if setting == 'power' else ((states(e.live_t) | replace(':', '')) | int(-1) if setting == 'start_time' else states(e.live_src))))) | string) != (before | string) %}the slot changed since the review; review again
            {% endif %}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ review_problem | length > 0 or refusal | length > 0 }}"
            sequence:
              - action: input_text.set_value
