          code: "{{ rv[3] if rv | count == 6 else '' }}"
          reviewed_at: "{{ rv[4] | int(0) if rv | count == 6 else 0 }}"
          before: >-
            {% if rv | count != 6 %}-1{% elif rv[1] == 'charge_source' %}{{ rv[5] }}{% else %}{{ rv[5] | int(-1) }}{% endif %}
          reg: "{{ {'target_soc': 267, 'power': 255, 'start_time': 249, 'charge_source': 273}.get(setting, 0) + n }}"
          label: "{{ {'target_soc': 'target SOC', 'power': 'power', 'start_time': 'start time', 'charge_source': 'charge source'}.get(setting, 'setting') }}"
          wdisp: >-
            {% if setting == 'target_soc' %}{{ want }} %{% elif setting == 'power' %}{{ want }} W{% elif setting == 'start_time' %}{{ '%02d:%02d' | format(want // 100, want % 100) }}{% else %}{{ want }}{% endif %}
          bdisp: >-
            {% if setting == 'target_soc' %}{{ before }} %{% elif setting == 'power' %}{{ before }} W{% elif setting == 'start_time' %}{{ '%02d:%02d' | format(before // 100, before % 100) }}{% else %}{{ before }}{% endif %}
          phr: >-
            {% if setting == 'target_soc' %}TARGET SOC {{ want }}{% elif setting == 'power' %}POWER {{ want }} W{% elif setting == 'start_time' %}START {{ wdisp }}{% else %}CHARGE SOURCE {{ want | string | upper }}{% endif %}
          uphr: >-
            {% if setting == 'target_soc' %}TARGET SOC {{ before }}{% elif setting == 'power' %}POWER {{ before }} W{% elif setting == 'start_time' %}START {{ bdisp }}{% else %}CHARGE SOURCE {{ before | string | upper }}{% endif %}
          wmin: "{{ ((want // 100) * 60 + want % 100) if (setting == 'start_time' and want >= 0) else -1 }}"
      - variables:
