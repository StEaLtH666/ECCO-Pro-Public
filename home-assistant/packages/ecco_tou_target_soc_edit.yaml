                     and states(e.src) == states(e.live_src) and states(e.mode) == states(e.live_mode)
                     and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') in ['on', 'off']
                     and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') == states('binary_sensor.ecco_clock_dongle_ecco_battery_grid_charge_enabled')
                     and (states(e.soc) | float(-1)) == (states(e.live_soc) | float(-2))
                     and not is_state('script.ecco_refresh_manual_control_helpers', 'on')
                     and (states(e.h_start) in ['unknown'] or states(e.h_start)[:5] | replace(':', '') | int(-1) == (states(e.st) | int(-2)))
                     and (states(e.h_pw) in ['unknown'] or (states(e.h_pw) | float(-1)) == (states(e.pw) | float(-2)))
                     and (states(e.h_soc) in ['unknown'] or (states(e.h_soc) | float(-1)) == (states(e.soc) | float(-2))) }}
                timeout: "00:00:15"
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ as_timestamp(now()) - fresh_at <= 30
                         and (states(e.st) | float(-1)) == ((states(e.live_t) | replace(':', '')) | int(-2))
                         and (states(e.en) | float(-1)) == ((states(e.live_t_next) | replace(':', '')) | int(-2))
                         and (states(e.pw) | float(-1)) == (states(e.live_pw) | float(-2))
                         and states(e.src) == states(e.live_src) and states(e.mode) == states(e.live_mode)
                         and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') in ['on', 'off']
                         and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') == states('binary_sensor.ecco_clock_dongle_ecco_battery_grid_charge_enabled')
                         and (states(e.soc) | float(-1)) == (states(e.live_soc) | float(-2))
                         and not is_state('script.ecco_refresh_manual_control_helpers', 'on')
                         and (states(e.h_start) in ['unknown'] or states(e.h_start)[:5] | replace(':', '') | int(-1) == (states(e.st) | int(-2)))
                         and (states(e.h_pw) in ['unknown'] or (states(e.h_pw) | float(-1)) == (states(e.pw) | float(-2)))
                         and (states(e.h_soc) in ['unknown'] or (states(e.h_soc) | float(-1)) == (states(e.soc) | float(-2))) }}
                then:
                  # 3. Stage ONLY the target SOC, then wait for the sync's echo and a fixed point again.
                  - action: number.set_value
                    continue_on_error: true
                    target:
                      entity_id: "{{ e.soc }}"
                    data:
                      value: "{{ want }}"
                  - delay:
                      seconds: 2
                  - wait_template: >-
                      {{ (states(e.soc) | float(-1)) == (want | float(-2))
                         and (states(e.st) | float(-1)) == ((states(e.live_t) | replace(':', '')) | int(-2))
                         and (states(e.en) | float(-1)) == ((states(e.live_t_next) | replace(':', '')) | int(-2))
                         and (states(e.pw) | float(-1)) == (states(e.live_pw) | float(-2))
                         and states(e.src) == states(e.live_src) and states(e.mode) == states(e.live_mode)
                         and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') in ['on', 'off']
                         and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') == states('binary_sensor.ecco_clock_dongle_ecco_battery_grid_charge_enabled')
                         and not is_state('script.ecco_refresh_manual_control_helpers', 'on')
                         and (states(e.h_start) in ['unknown'] or states(e.h_start)[:5] | replace(':', '') | int(-1) == (states(e.st) | int(-2)))
                         and (states(e.h_pw) in ['unknown'] or (states(e.h_pw) | float(-1)) == (states(e.pw) | float(-2)))
                         and (states(e.h_soc) in ['unknown'] or (states(e.h_soc) | float(-1)) == (states(e.soc) | float(-2))) }}
                    timeout: "00:00:10"
                    continue_on_timeout: true
                  - action: switch.turn_on
                    continue_on_error: true
                    target:
                      entity_id: switch.ecco_clock_dongle_manual_configuration_write_enable
                  - wait_template: "{{ is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'on') }}"
                    timeout: "00:00:05"
                    continue_on_timeout: true
                  # 4. The last check before the press: the full gate (bounds re-read), staged == live except the
                  #    SOC, the helper sync at its fixed point, the arm confirmed; then ONE press.
                  - variables:
                      armed_by_us: true
                      refusal3: >-
                        {% set shutdown = states('sensor.ecco_clock_dongle_ecco_battery_shutdown') | int(-1) %}
                        {% set reserve = states('input_number.ecco_minimum_reserve_soc') | int(-1) %}
                        {% set lo = [shutdown, reserve] | max %}
                        {% set live_soc = states(e.live_soc) | int(-1) if e else -1 %}
                        {% set lm = states('sensor.ecco_clock_dongle_ecco_fallback_profile_live_match') %}
                        {% set L = ';' ~ lm ~ ';' %}
                        {% set R = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review') ~ ';' %}
                        {% set fp_start = as_timestamp(states('input_datetime.ecco_free_power_schedule_start'), 0) %}
                        {% set dg_start = as_timestamp(states('input_datetime.ecco_dump_to_grid_schedule_start'), 0) %}
                        {% set soon = as_timestamp(now()) + 900 %}
                        {% if not is_state('input_boolean.ecco_cfg_edit_review_required', 'off') %}an earlier edit's outcome needs manual review first
                        {% elif not e %}invalid slot (1-6)
                        {% elif shutdown < 0 %}inverter shutdown SOC unavailable
                        {% elif reserve < 0 %}ECCO minimum battery reserve unavailable
                        {% elif want < lo or want > 100 %}target SOC must be {{ lo }}-100 % (the greater of the inverter shutdown SOC {{ shutdown }} % and the ECCO reserve {{ reserve }} %)
                        {% elif live_soc < 0 %}live slot SOC unavailable
                        {% elif live_soc == want %}no change (slot {{ n }} is already {{ want }} %)
                        {% elif not is_state('binary_sensor.ecco_clock_dongle_telemetry_online', 'on') or not is_state('binary_sensor.ecco_clock_dongle_configuration_online', 'on')
                              or not is_state('binary_sensor.ecco_clock_dongle_manual_configuration_raw_cache_valid', 'on') %}dongle offline or configuration cache not valid
                        {% elif ((as_timestamp(now()) - as_timestamp(states('sensor.ecco_clock_dongle_last_configuration_update'), 0)) | abs) > 150 or not (0 <= (states('sensor.ecco_clock_dongle_ecco_supervision_heartbeat_age') | float(-1)) <= 60) %}the dongle's configuration time or heartbeat is not current (configuration {{ states('sensor.ecco_clock_dongle_last_configuration_update')[:19] }}, heartbeat age {{ states('sensor.ecco_clock_dongle_ecco_supervision_heartbeat_age')[:8] }} s)
                        {% elif not is_state('binary_sensor.ecco_clock_dongle_free_power_active', 'off') or not is_state('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress', 'off')
                              or not is_state('binary_sensor.ecco_clock_dongle_free_power_snapshot_valid', 'off') %}Free Power owns the TOU settings (active, starting or restore owed)
                        {% elif not is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'off') or not is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress', 'off')
                              or not is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_snapshot_valid', 'off') %}Dump to Grid owns the TOU settings (active, starting or restore owed)
                        {% elif not is_state('binary_sensor.ecco_clock_dongle_manual_write_in_progress', 'off') %}another inverter write or fallback operation in progress
                        {% elif not is_state('binary_sensor.ecco_clock_dongle_rtc_correction_in_progress', 'off') %}RTC correction in progress
                        {% elif (not (armed_by_us | default(false)) and not is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'off'))
                              or not is_state('switch.ecco_clock_dongle_free_power_write_enable', 'off')
                              or not is_state('switch.ecco_clock_dongle_free_power_recovery_arm', 'off') or not is_state('switch.ecco_clock_dongle_dump_to_grid_write_enable', 'off')
                              or not is_state('switch.ecco_clock_dongle_dump_to_grid_recovery_arm', 'off') %}a write or recovery arm is on
                        {% elif L.count(';m=') != 1 or L.count(';obl=') != 1 or L.count(';ca=') != 1 or L.count(';eh=') != 1 %}the fallback live match is unavailable or malformed ({{ lm[:60] }})
                        {% elif ';obl=FP:CR,DP:CR,R4:CR,BUS:OK;' not in L %}a lease, restore, lockout or register 244 transaction is not clear ({{ lm[:60] }})
                        {% elif ';ca=F;' not in L or ';eh=0;' not in L %}the fallback live data is not current or an export hazard is not ruled out ({{ lm[:60] }})
                        {% elif ';m=MATCH;' not in L and ';m=DRIFT;' not in L and ';m=CONTEXT;' not in L %}the fallback live match is {{ L.split(';m=')[1].split(';')[0][:16] }}: edits need a valid saved fallback profile, live settings inside its domain and export as in the profile (MATCH, DRIFT or CONTEXT)
                        {% elif R.count(';st=') != 1 or ';st=IDLE;' not in R %}a fallback profile Review or Save is in progress (or its state is unknown)
                        {% elif not is_state('binary_sensor.ecco_fallback_save_available', 'off') or not is_state('binary_sensor.ecco_fallback_replace_corrupt_available', 'off')
                              or not is_state('binary_sensor.ecco_fallback_invalidate_available', 'off') %}the fallback system is armed for an operation
                        {% elif not is_state('sensor.ecco_clock_dongle_ecco_supervision_state', 'SUPERVISED') or not is_state('binary_sensor.ecco_clock_dongle_ecco_supervision_stable', 'on')
                              or not is_state('sensor.ecco_clock_dongle_ecco_failback_shadow_state', 'SHADOW_IDLE') %}supervision not stable or a failback episode is open
                        {% elif not is_state('sensor.ecco_clock_dongle_dump_to_grid_export_containment', 'NOT_APPLICABLE')
                              or not is_state('sensor.ecco_clock_dongle_free_power_recovery_evidence_id', '-')
                              or not is_state('sensor.ecco_clock_dongle_reg244_original_snapshot', '—') %}a recovery or containment state is open
                        {% elif not is_state('sensor.ecco_clock_dongle_free_power_recovery_state', 'NONE')
                              or not (states('sensor.ecco_clock_dongle_dump_to_grid_recovery_state').startswith('NONE')
                                      or states('sensor.ecco_clock_dongle_dump_to_grid_recovery_state').startswith('ACCEPTED')) %}a Free Power or Dump recovery state is open
                        {% elif not is_state('script.ecco_free_power_start_scheduled', 'off') or not is_state('script.ecco_dump_to_grid_start_scheduled', 'off') %}a scheduled start is running
                        {% elif is_state('input_boolean.ecco_free_power_schedule_armed', 'on') and fp_start < soon %}a scheduled Free Power starts within 15 minutes
                        {% elif is_state('input_boolean.ecco_dump_to_grid_schedule_armed', 'on') and dg_start < soon %}a scheduled Dump to Grid starts within 15 minutes
                        {% endif %}
                  - if:
                      - condition: template
                        value_template: >-
                          {{ refusal3 | length == 0
                             and is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'on')
                             and (states(e.soc) | float(-1)) == (want | float(-2))
                             and (states(e.st) | float(-1)) == ((states(e.live_t) | replace(':', '')) | int(-2))
                             and (states(e.en) | float(-1)) == ((states(e.live_t_next) | replace(':', '')) | int(-2))
                             and (states(e.pw) | float(-1)) == (states(e.live_pw) | float(-2))
                             and states(e.src) == states(e.live_src) and states(e.mode) == states(e.live_mode)
                             and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') in ['on', 'off']
                             and states('switch.ecco_clock_dongle_manual_stage_grid_charge_enabled') == states('binary_sensor.ecco_clock_dongle_ecco_battery_grid_charge_enabled')
                             and not is_state('script.ecco_refresh_manual_control_helpers', 'on')
                             and (states(e.h_start) in ['unknown'] or states(e.h_start)[:5] | replace(':', '') | int(-1) == (states(e.st) | int(-2)))
                             and (states(e.h_pw) in ['unknown'] or (states(e.h_pw) | float(-1)) == (states(e.pw) | float(-2)))
                             and (states(e.h_soc) in ['unknown'] or (states(e.h_soc) | float(-1)) == (states(e.soc) | float(-2))) }}
                    then:
                      # The firmware counts an Apply attempt only when its gate passes (published every 30 s).
                      - variables:
                          attempts_before: "{{ states('sensor.ecco_clock_dongle_manual_configuration_write_attempts_since_boot') | float(-1) }}"
                      - action: button.press
                        continue_on_error: true
                        target:
                          entity_id: "{{ e.apply }}"
                      # The firmware disarms on every outcome and releases its write lock when done.
                      - wait_template: >-
                          {{ is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'off')
                             and is_state('binary_sensor.ecco_clock_dongle_manual_write_in_progress', 'off') }}
                        timeout: "00:00:45"
                        continue_on_timeout: true
                      # Never left on while the outcome is judged (harmless when the firmware has already disarmed: the
                      # firmware reads the write enable only at its Apply gate, so this cannot interrupt a write).
                      - action: switch.turn_off
                        continue_on_error: true
                        target:
                          entity_id: switch.ecco_clock_dongle_manual_configuration_write_enable
                      - delay:
                          seconds: 2
                      - variables:
                          fw_result: "{{ states('sensor.ecco_clock_dongle_manual_configuration_last_result')[:120] }}"
                          cfg_0: "{{ states('sensor.ecco_clock_dongle_last_configuration_update') }}"
                      # Two LATER configuration reads, compared as TIMES - a connection drop's 'unavailable' and the value a
                      # reconnect re-sends are not reads. The first may be the firmware's own post-Apply poll (published
                      # about 4 s after its verify); the firmware runs one poll at a time, so the second began after it.
                      - wait_template: >-
                          {{ as_timestamp(cfg_0, 0) > 0 and as_timestamp(states('sensor.ecco_clock_dongle_last_configuration_update'), 0) > as_timestamp(cfg_0, 0) }}
                        timeout: "00:02:30"
                        continue_on_timeout: true
                      - variables:
                          cfg_1: "{{ states('sensor.ecco_clock_dongle_last_configuration_update') }}"
                      - wait_template: >-
                          {{ as_timestamp(cfg_0, 0) > 0 and as_timestamp(cfg_1, 0) > as_timestamp(cfg_0, 0)
                             and as_timestamp(states('sensor.ecco_clock_dongle_last_configuration_update'), 0) > as_timestamp(cfg_1, 0) }}
                        timeout: "00:02:30"
                        continue_on_timeout: true
                      - delay:
                          seconds: 35
                      - variables:
                          later_read: >-
                            {{ as_timestamp(cfg_0, 0) > 0 and as_timestamp(cfg_1, 0) > as_timestamp(cfg_0, 0)
                               and as_timestamp(states('sensor.ecco_clock_dongle_last_configuration_update'), 0) > as_timestamp(cfg_1, 0)
                               and ((as_timestamp(now()) - as_timestamp(states('sensor.ecco_clock_dongle_last_configuration_update'), 0)) | abs) <= 150
                               and is_state('binary_sensor.ecco_clock_dongle_configuration_online', 'on')
                               and is_state('binary_sensor.ecco_clock_dongle_manual_configuration_raw_cache_valid', 'on') }}
                          attempts_moved: >-
                            {{ (states('sensor.ecco_clock_dongle_manual_configuration_write_attempts_since_boot') | float(-2)) != (attempts_before | float(-3))
                               or (attempts_before | float(-1)) < 0 }}
                          diff: >-
                            {% set d = namespace(v=[]) %}
                            {% if (states(e.live_soc) | int(-1)) != want %}{% set d.v = d.v + ['SOC ' ~ states(e.live_soc) ~ ' (expected ' ~ want ~ ')'] %}{% endif %}
                            {% if states(e.live_t) != pre.t %}{% set d.v = d.v + ['start ' ~ states(e.live_t) ~ ' (was ' ~ pre.t ~ ')'] %}{% endif %}
                            {% if states(e.live_t_next) != pre.t_next %}{% set d.v = d.v + ['end ' ~ states(e.live_t_next) ~ ' (was ' ~ pre.t_next ~ ')'] %}{% endif %}
                            {% if (states(e.live_pw) | float(-1)) != pre.pw %}{% set d.v = d.v + ['power ' ~ states(e.live_pw) ~ ' (was ' ~ pre.pw ~ ')'] %}{% endif %}
                            {% if states(e.live_src) != pre.src or states(e.live_mode) != pre.mode or states(e.live_flags) != pre.flags %}{% set d.v = d.v + ['flags ' ~ states(e.live_flags) ~ ' (was ' ~ pre.flags ~ ')'] %}{% endif %}
                            {% if states('binary_sensor.ecco_clock_dongle_ecco_battery_grid_charge_enabled') != pre.gc %}{% set d.v = d.v + ['grid charge ' ~ states('binary_sensor.ecco_clock_dongle_ecco_battery_grid_charge_enabled') ~ ' (was ' ~ pre.gc ~ ')'] %}{% endif %}
                            {{ d.v | join('; ') }}
                          unchanged: >-
                            {{ (states(e.live_soc) | int(-1)) == pre.soc and states(e.live_t) == pre.t and states(e.live_t_next) == pre.t_next
                               and (states(e.live_pw) | float(-1)) == pre.pw and states(e.live_src) == pre.src and states(e.live_mode) == pre.mode
                               and states(e.live_flags) == pre.flags
                               and states('binary_sensor.ecco_clock_dongle_ecco_battery_grid_charge_enabled') == pre.gc }}
                      - choose:
                          # The firmware refused at its gate - claimed only when its gate-pass counter did not move AND
                          # the two later reads show every written register still at its pre-edit value.
                          - conditions:
                              - condition: template
                                value_template: "{{ fw_result.startswith('REJECTED') and later_read and not attempts_moved and unchanged }}"
                            sequence:
                              - action: input_text.set_value
                                target:
                                  entity_id: input_text.ecco_cfg_edit_last_result
                                data:
                                  value: >-
                                    FAILED - the firmware refused the Apply ({{ fw_result }}); nothing written (counter and later reads agree)
                              - action: persistent_notification.create
                                data:
                                  notification_id: ecco_cfg_edit
                                  title: "ECCO: configuration edit refused by the dongle"
                                  message: >-
                                    {{ states('input_text.ecco_cfg_edit_last_result') }}
                        default:
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: >-
                                      {{ fw_result.startswith('VERIFIED OK - manual Slot ' ~ n ~ ' ') and later_read
                                         and diff | length == 0 }}
                                sequence:
                                  - action: input_text.set_value
                                    target:
                                      entity_id: input_text.ecco_cfg_last_owner_edit
                                    data:
                                      value: >-
                                        {{ now().strftime('%Y-%m-%d %H:%M:%S') }} slot {{ n }} target SOC (register {{ e.reg }}) {{ before }} -> {{ want }} % (owner, Advanced Configuration)
                                  - action: input_text.set_value
                                    target:
                                      entity_id: input_text.ecco_cfg_edit_last_result
                                    data:
                                      value: >-
                                        APPLIED AND VERIFIED - slot {{ n }} target SOC {{ before }} -> {{ want }} %: firmware readback and an independent later read of every written register agree
                                  - action: persistent_notification.dismiss
                                    data:
                                      notification_id: ecco_cfg_edit_review
                                  - action: persistent_notification.create
                                    data:
                                      notification_id: ecco_cfg_edit
                                      title: "ECCO: TOU slot {{ n }} target SOC changed to {{ want }} %"
                                      message: >-
                                        Verified on the inverter (was {{ before }} %); every other slot {{ n }} value is unchanged.
                                        The fallback profile now differs from the inverter (Fallback status DRIFT): if this is the new
                                        normal, Review and Save the fallback profile. To undo, review and apply slot {{ n }} back to
                                        {{ before }} % the same way.
                            default:
                              - action: input_text.set_value
                                target:
                                  entity_id: input_text.ecco_cfg_edit_last_result
                                data:
                                  value: >-
                                    UNCERTAIN - firmware: {{ fw_result[:60] }}; later read: {{ 'incomplete' if not later_read else (diff[:110] if diff else 'all as expected') }}
                              - action: input_boolean.turn_on
                                target:
                                  entity_id: input_boolean.ecco_cfg_edit_review_required
                              - action: persistent_notification.create
                                data:
                                  notification_id: ecco_cfg_edit
                                  title: "ECCO: configuration edit outcome NOT proven - manual review needed"
                                  message: >-
                                    Slot {{ n }} target SOC {{ before }} -> {{ want }} %. Firmware said: {{ fw_result }}. Independent read: {{ 'no complete later configuration read' if not later_read else (diff if diff else 'all registers as expected, but the firmware did not confirm') }}. Do NOT retry. Open Manual Controls, press Load Current Slot {{ n }}, and compare every slot {{ n }} value with the inverter's own display; correct anything wrong there deliberately. Free Power and Dump to Grid restore whatever they snapshot next, so settle the slot first. Edits stay locked until you run ECCO - Acknowledge configuration edit review.
                    else:
                      - action: input_text.set_value
                        target:
                          entity_id: input_text.ecco_cfg_edit_last_result
                        data:
                          value: >-
                            FAILED - a safety check changed just before the Apply ({{ refusal3 if refusal3 else 'the staged values, the helper sync or the arm could not be confirmed' }}); nothing pressed, nothing written
                else:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ecco_cfg_edit_last_result
                    data:
                      value: >-
                        FAILED - the staged slot {{ n }} did not match the live slot after a fresh read, or the Manual Controls helpers did not settle; nothing pressed, nothing written
      # The write enable always ends off (it only permits an Apply) - and must be SEEN off.
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.ecco_clock_dongle_manual_configuration_write_enable
      - wait_template: "{{ is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'off') }}"
        timeout: "00:00:10"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'off')
                 and not states('input_text.ecco_cfg_edit_last_result').startswith('REFUSED') }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.ecco_cfg_edit_last_result
            data:
              value: >-
                UNCERTAIN - the write enable could not be confirmed off after the edit (outcome before: {{ states('input_text.ecco_cfg_edit_last_result')[:120] }})
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.ecco_cfg_edit_review_required
          - action: persistent_notification.create
            data:
              notification_id: ecco_cfg_edit
              title: "ECCO: Manual Configuration Write Enable not confirmed off"
              message: >-
                Turn it off in Manual Controls and check every TOU slot. Do NOT retry. Open Manual Controls, press Load Current Slot {{ n }}, and compare every slot {{ n }} value with the inverter's own display; correct anything wrong there deliberately. Free Power and Dump to Grid restore whatever they snapshot next, so settle the slot first. Edits stay locked until you run ECCO - Acknowledge configuration edit review.
      - if:
          - condition: template
            value_template: "{{ states('input_text.ecco_cfg_edit_last_result').startswith('FAILED') }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: ecco_cfg_edit
              title: "ECCO: configuration edit did not complete"
              message: "{{ states('input_text.ecco_cfg_edit_last_result') }}"
      # Judged: out of flight (a refused run never set it, and must not clear an earlier run's marker).
      - if:
          - condition: template
            value_template: "{{ not states('input_text.ecco_cfg_edit_last_result').startswith('REFUSED') }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ecco_cfg_edit_in_flight

  ecco_cfg_acknowledge_edit_review:
    alias: "ECCO - Acknowledge configuration edit review"
    description: >-
      After checking the TOU slots by hand following an UNCERTAIN edit, unlock further edits. Writes nothing to the inverter.
    mode: single
    fields:
      confirmation:
        description: "Exactly: I HAVE CHECKED THE TOU SLOTS"
    sequence:
      # Never while an Apply runs or is in flight: refuse without touching the edit's result or its markers.
      - if:
          - condition: template
            value_template: >-
              {{ not is_state('script.ecco_cfg_apply_tou_slot_soc', 'off') or not is_state('input_boolean.ecco_cfg_edit_in_flight', 'off') }}
        then:
          - action: persistent_notification.create
            data:
              notification_id: ecco_cfg_edit_busy
              title: "ECCO: refused - a configuration edit is being applied"
              message: >-
                A Review or Acknowledge was refused because an Advanced Configuration edit is running or has not been
                judged yet; nothing was changed. See ECCO Advanced Config Edit Last Result.
          - stop: "an edit is being applied"
      - if:
          - condition: template
            value_template: "{{ (confirmation | string) == 'I HAVE CHECKED THE TOU SLOTS' }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ecco_cfg_edit_review_required
          - action: input_text.set_value
            target:
              entity_id: input_text.ecco_cfg_edit_last_result
            data:
              value: "ACKNOWLEDGED - the owner checked the TOU slots; edits unlocked"
          - action: persistent_notification.dismiss
            data:
              notification_id: ecco_cfg_edit

automation:
  # An Apply that stopped while it was still in flight was cancelled (a Home Assistant restart, a script reload or an
  # error): its outcome was never judged. Lock and mark it UNCERTAIN at once, alert, then disarm once the dongle is
  # reachable (a service call to an unavailable entity does nothing) and confirm the write enable reads off.
  - id: ecco_cfg_edit_interrupted
    alias: "ECCO - Configuration edit interrupted"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: template
        value_template: >-
          {{ is_state('input_boolean.ecco_cfg_edit_in_flight', 'on') and is_state('script.ecco_cfg_apply_tou_slot_soc', 'off') }}
    actions:
      - if:
          - condition: template
            value_template: >-
              {{ is_state('input_boolean.ecco_cfg_edit_in_flight', 'on') and not is_state('script.ecco_cfg_apply_tou_slot_soc', 'on') }}
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.ecco_cfg_edit_review_required
          - action: input_text.set_value
            target:
              entity_id: input_text.ecco_cfg_edit_last_result
            data:
              value: "UNCERTAIN - the edit was interrupted (Home Assistant restart or script reload) before its outcome was judged"
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ecco_cfg_edit_in_flight
          - action: persistent_notification.create
            data:
              notification_id: ecco_cfg_edit
              title: "ECCO: configuration edit interrupted - manual review needed"
              message: >-
                An Advanced Configuration edit stopped before its outcome was checked. Do NOT retry. Open Manual
                Controls, Load each TOU slot and compare with the inverter's own display; turn the Manual Configuration
                Write Enable off if it is on. Edits stay locked until you run ECCO - Acknowledge configuration edit review.
          - wait_template: "{{ states('switch.ecco_clock_dongle_manual_configuration_write_enable') in ['on', 'off'] }}"
            timeout: "00:10:00"
            continue_on_timeout: true
          - action: switch.turn_off
            continue_on_error: true
            target:
              entity_id: switch.ecco_clock_dongle_manual_configuration_write_enable
          - wait_template: "{{ is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'off') }}"
            timeout: "00:00:10"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ not is_state('switch.ecco_clock_dongle_manual_configuration_write_enable', 'off') }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: ecco_cfg_edit_arm
                  title: "ECCO: Manual Configuration Write Enable NOT confirmed off"
                  message: >-
                    After an interrupted configuration edit the Manual Configuration Write Enable could not be confirmed
                    off (it reads {{ states('switch.ecco_clock_dongle_manual_configuration_write_enable') }}). Turn it off in Manual Controls now, then check every TOU slot.
