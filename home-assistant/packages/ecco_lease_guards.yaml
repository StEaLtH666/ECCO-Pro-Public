# ECCO Pro - IN-LEASE END GUARDS: end a Dump to Grid lease or a Free Power lease when the plan, the time or the supply no longer allows it
#
# NOT INSTALLED, NOT LIVE-PROVEN. Offline only; see home-assistant/packages/README.md ("Start gate and lease guards").
#
# WHY. A start gate (ecco_start_gate.yaml) decides only at the START. Today nothing ends a lease when the reserve rises above the Stop SOC the dongle latched at its start, when a hold
# starts, when the time the lease ends on can no longer be trusted, or when the house and the charge together would breach the supply limit. Item N2 of the architecture reconciliation asks
# for in-lease END guards. This package is three guards, each ONE automation, and each only ever presses an existing END button; the Free Power side has two (a time guard and an import guard)
# rather than one, because each counts its own delay, 5 minutes and 30 seconds, and a run that is counting drops every trigger that arrives meanwhile (mode single): one automation would let a
# long time count hide a breach of the supply limit for minutes.
#
# EACH GUARD NEEDS THE OWNER'S SEPARATE INSTALL AUTHORISATION. The Dump guard and the two Free Power guards are authorised one at a time; they read nothing from one another (a copy of this
# file with one of them removed is a valid package, and the suite proves that each stands alone), and they are separate from the start gate, which can be installed without them.
#
# THE THREE GUARDS
#   ecco_lease_guard_dump_end  (Dump to Grid, plan facts). While a Dump to Grid lease is active, it presses END DUMP TO GRID - RESTORE NOW when
#       - a Hold battery, Skip tonight or Prepare for power cut turns on: sensor.ecco_plan_export_hold changes to held (that sensor reads held for all three); or
#       - the effective reserve rises above the Stop SOC the lease latched at its start: sensor.ecco_plan_effective_reserve changes, or the lease turns active, and the number is above
#         sensor.ecco_clock_dongle_dump_to_grid_active_stop_soc (the dongle's active Stop SOC: published only while a lease is active, unknown otherwise). That sensor updates every 5 s,
#         so when the lease has only just turned active the guard waits up to 15 s for it before it judges the reserve (a hold is judged at once).
#     The dongle enforces only that latched Stop SOC (every 15 s, firmware): a reserve that rises during the lease is not enforced by anything else.
#   ecco_lease_guard_free_power_time  (Free Power, time trust). While a Free Power lease is active and binary_sensor.ecco_time_trusted_for_leases does not read on for 5 MINUTES, it presses
#       END FREE POWER - RESTORE NOW. The lease ends on the dongle's own NTP time; if that time and Home Assistant's clock are no longer shown to agree for 5 minutes the end can no longer
#       be relied on. 5 minutes is more than the LIVE condition of the time trust package costs after a reconnect (about a minute, two at worst) and more than its 3 minutes 30 seconds
#       stall debounce, so a reconnect or a restart alone never ends a lease. The count starts when the sensor changes from on to off, or when a lease turns active while it READS off (a sensor that is unavailable, unknown or missing, for instance because the time trust package is not installed, is not a reading and never starts a count).
#   ecco_lease_guard_free_power_import  (Free Power, grid import ceiling). While a Free Power lease is active and the grid-import ceiling is configured (input_number.ecco_grid_import_ceiling_w,
#       from ecco_start_gate.yaml: 1 to 100000 W; 0, unknown or unavailable means NONE CONFIGURED and the guard is inert) and the measured grid import
#       (sensor.ecco_clock_dongle_ecco_grid_power_ct_clamp, the dongle's CT reading, positive = importing) is above it for 30 SECONDS, it presses END FREE POWER - RESTORE NOW. The ceiling is a
#       SAFETY ceiling, never a target. 30 s is three 10 s telemetry polls: a short confirmation, not an average; a kettle does not end a lease, a sustained breach does.
#   Each press is followed by a persistent notification with a fixed id that says what was ended and why (the Dump guard: ecco_lease_guard_dump_ended; the Free Power guards:
#   ecco_lease_guard_free_power_ended, one id for both), and by a one-minute pause during which the guard is busy (mode single: a trigger in that minute is dropped silently), so one
#   violation is one press.
#
# HARD RULES (each is a static check in home-assistant/tests/test_ecco_start_gate.py).
#   - The ONLY service calls are button.press on one of the two existing END buttons (the Dump guard only END DUMP, the two Free Power guards only END FREE POWER) and
#     persistent_notification.create. A guard never presses a START button, never arms or writes anything, never writes a register or a helper, and adds no helper and no template entity.
#   - END is always allowed: it asks the dongle to restore the snapshot it saved before the lease (the exact values, never a computed one); it is the same press the card's End & Restore Now makes.
#   - A guard acts only on a POSITIVE reading: a hold that reads held, a reserve and a latched Stop SOC that are both numbers, a time-trust sensor that was on and now reads off (or reads off when a lease starts), a measured import that
#     is a number above a configured ceiling. A value that is missing, unavailable or unknown never ends a lease.
#   - A restart, a template reload, a reconnect of the dongle and a boot never end a lease by themselves: every trigger must be a change FROM a reading (not from unavailable or unknown,
#     and not from nothing), nothing runs at the Home Assistant start, and a count in progress dies with a restart. A violation that already stands when Home Assistant starts is NOT acted on until
#     the next change; a lease that runs through a restart with a standing violation keeps running.
#
# WHAT THEY DO NOT DO, AND THEIR LIMITS (stated plainly; nothing here is a lock; a firmware guard is the only hard one).
#   - They are SOFT: they run in Home Assistant. A Home Assistant that is down, a dongle that is dead or in safe mode, or a press that the dongle does not act on ends nothing. They do not retry:
#     one press per violation, then the next change. The dongle's own watchdogs (the Stop SOC every 15 s, the lease's end time, the restore retries) are unchanged and still run.
#   - Charge Battery (Free Power) has no target-reached guard here: the lease runs to its end time or to the owner's End (Free Power forces every slot to 100 %). Ending at a target is a later step.
#   - A Free Power lease that turns active while the leases sensor already reads off is counted from the lease start; a lease started from the dongle's own button while a hold is active is
#     NOT ended by the Free Power guards (Charge Battery is not gated by a hold). The Dump guard also judges a lease at the moment it turns active, so a start from the dongle's own button
#     under a hold or with a Stop SOC below the reserve is ended within seconds, with the notification saying why.
#   - A standing violation at Home Assistant's start is not acted on (above), and a trigger that arrives while a guard is busy (its wait, or the minute after a press) is dropped.
#   - The notifications live in Home Assistant's memory only; a restart clears them.
#   - Recalled from Home Assistant core, NOT verified on a real Home Assistant (the offline model of them is in the suite): that a state trigger fires with trigger.from_state set to the previous
#     state object (none for an entity that did not exist), that `to: ~` fires on a change of the state and never on an attribute alone (as the schedule restore package assumes), that a template
#     trigger fires when its result changes from false to true and is not armed while it is already true, that wait_template with continue_on_timeout continues at once when its template is already
#     true, and that `mode: single` with max_exceeded silent drops a trigger while a run is busy.
#
# INSTALL. One file copy to /config/packages/ecco_lease_guards.yaml, a configuration check, then reload the AUTOMATIONS (Developer tools, YAML, Automations): no restart, no helper to create, never
# "reload all". It reads the plan sensors (ecco_plan_helpers.yaml), the time trust sensor (ecco_time_trust.yaml) and, for the import guard only, the ceiling helper of ecco_start_gate.yaml; without a
# source a guard stays inert (it never acts on a missing reading). Remove: delete the file and reload the automations. Nothing here is meant to be exposed to a voice assistant.

automation:
  - id: ecco_lease_guard_dump_end
    alias: "ECCO - Lease guard: end a Dump to Grid lease when a hold starts or the reserve rises above its Stop SOC"
    description: >-
      Presses END DUMP TO GRID - RESTORE NOW (nothing else, ever) while a Dump to Grid lease is active and a Hold battery, Skip tonight or Prepare for power cut turns on, or the
      effective reserve is above the Stop SOC the lease latched at its start. Acts only on a change from a reading, never at a restart, a reload or a reconnect. Raises one persistent
      notification that says what was ended and why. It starts, arms and writes nothing.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.ecco_plan_export_hold
        to: "held"
        id: hold
      - trigger: state
        entity_id: sensor.ecco_plan_effective_reserve
        to: ~
        id: reserve
      - trigger: state
        entity_id: binary_sensor.ecco_clock_dongle_dump_to_grid_active
        to: "on"
        id: lease_started
    conditions:
      # A change FROM A READING. A Home Assistant start, a template reload, a reconnect of the dongle (unavailable or unknown to a value) and an entity that did not exist before are never a reason.
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state not in ['unavailable', 'unknown'] }}"
      - condition: state
        entity_id: binary_sensor.ecco_clock_dongle_dump_to_grid_active
        state: "on"
    actions:
      # The dongle's active Stop SOC is published every 5 s: when the lease has only just turned active wait (at most 15 s) for it. A hold, or a lease that ends, stops the wait at once.
      - wait_template: >-
          {{ not is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'on')
             or is_state('sensor.ecco_plan_export_hold', 'held')
             or (states('sensor.ecco_clock_dongle_dump_to_grid_active_stop_soc') | float(-1)) >= 0 }}
        timeout: "00:00:15"
        continue_on_timeout: true
      - variables:
          lease: "{{ is_state('binary_sensor.ecco_clock_dongle_dump_to_grid_active', 'on') }}"
          hold: "{{ states('sensor.ecco_plan_export_hold') }}"
          # The reserve and the latched Stop SOC must each be a finite number from 0 to 100, tested as a positive range (a comparison with nan is always false): -1 = cannot be read, -2 = not such a number.
          reserve: >-
            {%- set r = states('sensor.ecco_plan_effective_reserve') | float(-1) -%}
            {{ r if (r >= 0 and r <= 100) else (-1 if r < 0 else -2) }}
          latched: >-
            {%- set s = states('sensor.ecco_clock_dongle_dump_to_grid_active_stop_soc') | float(-1) -%}
            {{ s if (s >= 0 and s <= 100) else -1 }}
          held_now: "{{ hold == 'held' }}"
          above: "{{ reserve >= 0 and latched >= 0 and reserve > latched }}"
      - condition: template
        value_template: "{{ lease and (held_now or above) }}"
      - action: button.press
        target:
          entity_id: button.ecco_clock_dongle_end_dump_to_grid_restore_now
      - action: persistent_notification.create
        data:
          notification_id: ecco_lease_guard_dump_ended
          title: "ECCO: a Dump to Grid lease was ended by the lease guard"
          message: >-
            The lease guard pressed END DUMP TO GRID - RESTORE NOW because
            {% if held_now %}a Hold battery, Skip tonight or Prepare for power cut turned on (sensor.ecco_plan_export_hold reads held: {{ state_attr('sensor.ecco_plan_export_hold', 'held_by') | default('unknown', true) }}).
            {%- else %}the effective reserve ({{ reserve | int(0) }} %) is above the Stop SOC this lease latched at its start ({{ latched | int(0) }} %).
            {%- endif %}
            The dongle now restores the settings it saved before the lease; check the Export to Grid status on the card. The guard only presses the End button: it starts and writes nothing,
            and it is soft (it runs in Home Assistant).
      - delay: "00:01:00"

  - id: ecco_lease_guard_free_power_time
    alias: "ECCO - Lease guard: end a Free Power lease when the time it ends on is not trusted for 5 minutes"
    description: >-
      Presses END FREE POWER - RESTORE NOW (nothing else, ever) when a Free Power lease is active and binary_sensor.ecco_time_trusted_for_leases has not read on for 5 minutes, counted from the
      change from on to off or from the lease turning active while it reads off. Acts only on a change from a reading, never at a restart, a reload or a reconnect. Raises one persistent notification that
      says what was ended and why. It starts, arms and writes nothing.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.ecco_time_trusted_for_leases
        to: "off"
        id: trust_lost
      - trigger: state
        entity_id: binary_sensor.ecco_clock_dongle_free_power_active
        to: "on"
        id: lease_started
    conditions:
      # A change FROM A READING (on or off), never from unavailable or unknown or from nothing.
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.from_state.state in ['on', 'off'] }}"
      - condition: state
        entity_id: binary_sensor.ecco_clock_dongle_free_power_active
        state: "on"
      # The sensor must READ off now (a trust loss, or a lease that starts while it is off): unavailable, unknown or missing is not a reading, so a missing time trust package ends nothing.
      - condition: template
        value_template: "{{ is_state('binary_sensor.ecco_time_trusted_for_leases', 'off') }}"
    actions:
      # The 5 minute debounce: end the wait at once when the lease ends or the time is trusted again.
      - wait_template: >-
          {{ not is_state('binary_sensor.ecco_clock_dongle_free_power_active', 'on')
             or is_state('binary_sensor.ecco_time_trusted_for_leases', 'on') }}
        timeout: "00:05:00"
        continue_on_timeout: true
      - condition: template
        value_template: >-
          {{ is_state('binary_sensor.ecco_clock_dongle_free_power_active', 'on')
             and not is_state('binary_sensor.ecco_time_trusted_for_leases', 'on') }}
      - action: button.press
        target:
          entity_id: button.ecco_clock_dongle_end_free_power_restore_now
      - action: persistent_notification.create
        data:
          notification_id: ecco_lease_guard_free_power_ended
          title: "ECCO: a Free Power lease was ended by the lease guard (time not trusted)"
          message: >-
            The lease guard pressed END FREE POWER - RESTORE NOW because binary_sensor.ecco_time_trusted_for_leases has not read on for 5 minutes (it reads
            {{ states('binary_sensor.ecco_time_trusted_for_leases') }}) while a Free Power lease was active: the lease ends on the dongle's own NTP time, and that time and Home Assistant's clock
            are not shown to agree. The dongle now restores the settings it saved before the lease; check the Charge Battery status on the card. The guard only presses the End button: it starts
            and writes nothing, and it is soft (it runs in Home Assistant).
      - delay: "00:01:00"

  - id: ecco_lease_guard_free_power_import
    alias: "ECCO - Lease guard: end a Free Power lease when the grid import stays above the configured ceiling for 30 seconds"
    description: >-
      Presses END FREE POWER - RESTORE NOW (nothing else, ever) when a Free Power lease is active, a grid-import ceiling is configured (input_number.ecco_grid_import_ceiling_w, 1 to 100000 W; 0 or
      unknown = none, the guard is inert) and the measured grid import stays above it for 30 seconds. Raises one persistent notification that says what was ended and why. It starts, arms and
      writes nothing.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: template
        id: import_breach
        value_template: >-
          {%- set c = states('input_number.ecco_grid_import_ceiling_w') | float(0) -%}
          {%- set g = states('sensor.ecco_clock_dongle_ecco_grid_power_ct_clamp') | float(none) -%}
          {%- set breached = is_state('binary_sensor.ecco_clock_dongle_free_power_active', 'on') and c >= 1 and c <= 100000 and g is number and g == g and g > c -%}
          {{ breached }}
    actions:
      # The 30 second confirmation: end the wait at once when the breach is over (or the lease has ended).
      - wait_template: >-
          {%- set c = states('input_number.ecco_grid_import_ceiling_w') | float(0) -%}
          {%- set g = states('sensor.ecco_clock_dongle_ecco_grid_power_ct_clamp') | float(none) -%}
          {%- set breached = is_state('binary_sensor.ecco_clock_dongle_free_power_active', 'on') and c >= 1 and c <= 100000 and g is number and g == g and g > c -%}
          {{ not breached }}
        timeout: "00:00:30"
        continue_on_timeout: true
      - condition: template
        value_template: >-
          {%- set c = states('input_number.ecco_grid_import_ceiling_w') | float(0) -%}
          {%- set g = states('sensor.ecco_clock_dongle_ecco_grid_power_ct_clamp') | float(none) -%}
          {%- set breached = is_state('binary_sensor.ecco_clock_dongle_free_power_active', 'on') and c >= 1 and c <= 100000 and g is number and g == g and g > c -%}
          {{ breached }}
      - action: button.press
        target:
          entity_id: button.ecco_clock_dongle_end_free_power_restore_now
      - action: persistent_notification.create
        data:
          notification_id: ecco_lease_guard_free_power_ended
          title: "ECCO: a Free Power lease was ended by the lease guard (grid import above the ceiling)"
          message: >-
            The lease guard pressed END FREE POWER - RESTORE NOW because the measured grid import ({{ states('sensor.ecco_clock_dongle_ecco_grid_power_ct_clamp') | float(0) | int(0) }} W) stayed above the
            grid-import ceiling ({{ states('input_number.ecco_grid_import_ceiling_w') | float(0) | int(0) }} W) for 30 seconds while a Free Power lease was active. The ceiling is a safety
            ceiling, never a target. The dongle now restores the settings it saved before the lease; check the Charge Battery status on the card. The guard only presses the End button: it starts
            and writes nothing, and it is soft (it runs in Home Assistant).
      - delay: "00:01:00"
