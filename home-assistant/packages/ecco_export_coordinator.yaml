      # The re-target shadow. ALLOWED means only that a change WOULD be allowed now; nothing acts on it. A re-target could only ever be the END of the lease plus a guarded re-START, at most one
      # per 30 minutes, bounded by the schedule's own window, and never a write by Home Assistant into a running lease. END NOW is the lease guard rule (a hold, or the reserve above the latched Stop SOC).
      - name: ECCO Export Retarget
        unique_id: ecco_export_retarget
        icon: mdi:swap-horizontal-bold
        state: >-
          {%- set m = state_attr('sensor.ecco_export_coordinator_model', 'model') -%}
          {%- set age = (as_timestamp(now()) - m.get('evaluated_ts')) if (m is mapping and m.get('evaluated_ts') is number) else none -%}
          {%- set ok = age is not none and age >= -5 and age <= 180 -%}
          {{ m.get('rt_state') if (ok and m.get('rt_state') in ['NOT RUNNING', 'UNKNOWN', 'NO CHANGE', 'WAIT', 'ALLOWED', 'END NOW']) else 'UNKNOWN' }}
        attributes:
          reasons: >-
            {%- set m = state_attr('sensor.ecco_export_coordinator_model', 'model') -%}
            {%- set age = (as_timestamp(now()) - m.get('evaluated_ts')) if (m is mapping and m.get('evaluated_ts') is number) else none -%}
            {%- set ok = age is not none and age >= -5 and age <= 180 -%}
            {{ m.get('rt_reasons') if (ok and m.get('rt_reasons') is iterable) else ['MODEL_NOT_UPDATING: sensor.ecco_export_coordinator_model has not been evaluated in the last 180 s or cannot be read'] }}
          changes: >-
            {%- set m = state_attr('sensor.ecco_export_coordinator_model', 'model') -%}
            {%- set age = (as_timestamp(now()) - m.get('evaluated_ts')) if (m is mapping and m.get('evaluated_ts') is number) else none -%}
            {%- set ok = age is not none and age >= -5 and age <= 180 -%}
            {{ m.get('rt_changes') if (ok and m.get('rt_changes') is iterable) else [] }}
          wait_until_ts: >-
            {%- set m = state_attr('sensor.ecco_export_coordinator_model', 'model') -%}
            {%- set age = (as_timestamp(now()) - m.get('evaluated_ts')) if (m is mapping and m.get('evaluated_ts') is number) else none -%}
            {%- set ok = age is not none and age >= -5 and age <= 180 -%}
            {{ m.get('rt_wait_until_ts') if ok else none }}
          last_would_change_ts: >-
            {%- set m = state_attr('sensor.ecco_export_coordinator_model', 'model') -%}
            {%- set age = (as_timestamp(now()) - m.get('evaluated_ts')) if (m is mapping and m.get('evaluated_ts') is number) else none -%}
            {%- set ok = age is not none and age >= -5 and age <= 180 -%}
            {{ m.get('rt_entry') if ok else none }}
          lease_age_min: >-
            {%- set m = state_attr('sensor.ecco_export_coordinator_model', 'model') -%}
            {%- set age = (as_timestamp(now()) - m.get('evaluated_ts')) if (m is mapping and m.get('evaluated_ts') is number) else none -%}
            {%- set ok = age is not none and age >= -5 and age <= 180 -%}
            {{ m.get('lease_age_min') if ok else none }}
          lease_origin: >-
            {%- set m = state_attr('sensor.ecco_export_coordinator_model', 'model') -%}
            {%- set age = (as_timestamp(now()) - m.get('evaluated_ts')) if (m is mapping and m.get('evaluated_ts') is number) else none -%}
            {%- set ok = age is not none and age >= -5 and age <= 180 -%}
            {{ m.get('lease_origin') if ok else '' }}
          rule: "A re-target could only ever be the END of the lease plus a guarded re-START, at most one per 30 minutes, bounded by the schedule's own window; Home Assistant never writes into a running lease. END NOW reports the lease guard rule (a hold, or the effective reserve above the Stop SOC the lease latched) outside the 30 minute rules. This sensor only reports."

