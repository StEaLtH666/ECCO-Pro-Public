          {% set ent = 'sensor.octopus_energy_electricity_your_meter_serial_your_import_mpan_current_rate' %}
          {% set c = states(ent) %}
          {% set mn = state_attr(ent, 'current_day_min_rate') %}
          {% set mx = state_attr(ent, 'current_day_max_rate') %}
          {% if c in ['unknown','unavailable','none',''] or mn is none or mx is none %}
            Unknown
          {% else %}
            {% set cv = c | float * 100 %}
            {% set minv = mn | float * 100 %}
            {% set maxv = mx | float * 100 %}
            {% if cv <= minv + 0.01 %}Cheap{% elif cv >= maxv - 0.01 %}Peak{% else %}Standard{% endif %}
          {% endif %}
        attributes:
          sampled_at: "{{ now().isoformat() }}"
