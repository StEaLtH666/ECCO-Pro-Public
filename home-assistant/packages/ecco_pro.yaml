      - name: ECCO Blend MAE
        unique_id: ecco_blend_mae
        availability: >
          {{ (states('input_number.ecco_forecast_completed_days') | int(0)) > 0 }}
        unit_of_measurement: kWh
        state_class: measurement
        state: >
          {% set n = states('input_number.ecco_forecast_completed_days') | int(0) %}
          {% set total = states('input_number.ecco_forecast_abs_error_sum_blend') | float(0) %}
          {{ (total / n) | round(3) if n > 0 else none }}
        attributes:
          metric: "Mean absolute error across completed next-day forecasts"
          sampled_at: "{{ now().isoformat() }}"

      - name: ECCO Forecast Best Source
        unique_id: ecco_forecast_best_source
        state: >
          {% set n = states('input_number.ecco_forecast_completed_days') | int(0) %}
          {% if n <= 0 %}
            Awaiting data
          {% else %}
            {% set fs = (states('input_number.ecco_forecast_abs_error_sum_forecast_solar') | float(0)) / n %}
            {% set sc = (states('input_number.ecco_forecast_abs_error_sum_solcast') | float(0)) / n %}
            {% set bl = (states('input_number.ecco_forecast_abs_error_sum_blend') | float(0)) / n %}
            {% set m = [fs, sc, bl] | min %}
            {% if m == fs %}Forecast.Solar{% elif m == sc %}Solcast{% else %}ECCO 50/50 blend{% endif %}
          {% endif %}
        attributes:
          completed_days: "{{ states('input_number.ecco_forecast_completed_days') | int(0) }}"
          method: "Lowest cumulative mean absolute error in kWh"
          sampled_at: "{{ now().isoformat() }}"

      - name: ECCO Model Phase
        unique_id: ecco_model_phase
        state: "Forecast accuracy learning - 3B.2"
        attributes:
          version: "3B.2"
          sampled_at: "{{ now().isoformat() }}"
      - name: ECCO Strategy Status
        unique_id: ecco_strategy_status
        state: >
          {% set mode = states('input_select.ecco_automation_mode') %}
          {% if mode == 'Observe Only' %}Observe only - gathering evidence{% elif mode == 'Advisory' %}Advisory - no setting writes{% elif is_state('input_boolean.ecco_automatic_setting_writes_enabled','on') %}Automatic enabled{% else %}Automatic selected - writes locked{% endif %}
        attributes:
          sampled_at: "{{ now().isoformat() }}"
          managed_tou_slot: "{{ states('input_select.ecco_managed_tou_slot') }}"
    binary_sensor:
      - name: ECCO Next Day Tariff Ready
        unique_id: ecco_next_day_tariff_ready
        state: >
          {% set rates = state_attr('event.octopus_energy_electricity_your_meter_serial_your_import_mpan_next_day_rates', 'rates') | default([], true) %}
          {{ rates | count >= 46 }}
        attributes:
          slot_count: >
            {% set rates = state_attr('event.octopus_energy_electricity_your_meter_serial_your_import_mpan_next_day_rates', 'rates') | default([], true) %}
            {{ rates | count }}
          sampled_at: "{{ now().isoformat() }}"
      - name: ECCO Next Day Export Tariff Ready
        unique_id: ecco_next_day_export_tariff_ready
        state: >
          {% set rates = state_attr('event.octopus_energy_electricity_your_meter_serial_your_export_mpan_export_next_day_rates', 'rates') | default([], true) %}
          {{ rates | count >= 46 }}
        attributes:
          slot_count: >
            {% set rates = state_attr('event.octopus_energy_electricity_your_meter_serial_your_export_mpan_export_next_day_rates', 'rates') | default([], true) %}
            {{ rates | count }}
          sampled_at: "{{ now().isoformat() }}"

      - name: ECCO Model Inputs Ready
        unique_id: ecco_model_inputs_ready
        state: >
          {{ is_state('input_boolean.ecco_defaults_initialized','on')
             and states('sensor.ecco_clock_dongle_ecco_battery_soc') not in ['unknown','unavailable','none','']
             and states('sensor.ecco_clock_dongle_ecco_battery_output_power') not in ['unknown','unavailable','none','']
             and states('sensor.ecco_clock_dongle_ecco_load_power') not in ['unknown','unavailable','none','']
             and states('sensor.ecco_clock_dongle_ecco_pv_power') not in ['unknown','unavailable','none','']
             and states('sensor.octopus_energy_electricity_your_meter_serial_your_import_mpan_current_rate') not in ['unknown','unavailable','none','']
             and states('sensor.energy_production_today_remaining') not in ['unknown','unavailable','none',''] }}
        attributes:
          sampled_at: "{{ now().isoformat() }}"
          purpose: "Gate for later learning/prediction scoring so unavailable source values are not treated as real zeros."

      - name: ECCO Forecast Comparison Valid
        unique_id: ecco_forecast_comparison_valid
        state: >
          {% set forecast_raw = states('sensor.power_production_now') %}
          {% set actual_raw = states('sensor.ecco_clock_dongle_ecco_pv_power') %}
          {% set forecast = forecast_raw | float(0) %}
          {% set floor = states('input_number.ecco_forecast_ratio_min_power') | float(300) %}
          {{ is_state('input_boolean.ecco_defaults_initialized','on')
             and forecast_raw not in ['unknown','unavailable','none','']
             and actual_raw not in ['unknown','unavailable','none','']
             and forecast >= floor }}
        attributes:
          sampled_at: "{{ now().isoformat() }}"
          minimum_forecast_power_w: "{{ states('input_number.ecco_forecast_ratio_min_power') }}"

      - name: ECCO Free Power Now
        unique_id: ecco_free_power_now
        state: >
          {% set p = states('sensor.octopus_energy_electricity_your_meter_serial_your_import_mpan_current_rate') | float(999) * 100 %}
          {% set threshold = states('input_number.ecco_free_power_threshold') | float(0) %}
          {{ p <= threshold }}
        attributes:
          sampled_at: "{{ now().isoformat() }}"
      - name: ECCO Tariff Charge Opportunity
        unique_id: ecco_tariff_charge_opportunity
        state: >
          {% set ent = 'sensor.octopus_energy_electricity_your_meter_serial_your_import_mpan_current_rate' %}
          {% set current = states(ent) | float(999) * 100 %}
          {% set peak = state_attr(ent, 'current_day_max_rate') | float(0) * 100 %}
          {% set eff = states('input_number.ecco_round_trip_efficiency') | float(90) / 100 %}
          {% set minsave = states('input_number.ecco_minimum_saving_threshold') | float(5) %}
          {% set wear = states('input_number.ecco_battery_wear_cost') | float(0) %}
          {% set delivered = current / eff if eff > 0 else 999 %}
          {{ is_state('input_boolean.ecco_grid_charging_enabled','on')
             and is_state('input_boolean.ecco_defaults_initialized','on')
             and states(ent) not in ['unknown','unavailable','none','']
             and state_attr(ent, 'current_day_max_rate') is not none
             and (peak - delivered - wear) >= minsave }}
        attributes:
          note: "Economic opportunity only; solar/load/reserve model not yet included."
          sampled_at: "{{ now().isoformat() }}"
      - name: ECCO Automatic Writes Armed
        unique_id: ecco_automatic_writes_armed
        state: >
          {{ states('input_select.ecco_automation_mode') == 'Automatic' and is_state('input_boolean.ecco_automatic_setting_writes_enabled','on') }}
        attributes:
          sampled_at: "{{ now().isoformat() }}"
