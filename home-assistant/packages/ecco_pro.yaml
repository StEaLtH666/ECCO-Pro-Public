          {% if fs_ok and sc_ok %}
            {{ (((fs_raw | float) + (sc_raw | float)) / 2) | round(3) }}
          {% elif fs_ok %}
            {{ (fs_raw | float) | round(3) }}
          {% elif sc_ok %}
            {{ (sc_raw | float) | round(3) }}
          {% else %}
            {{ none }}
          {% endif %}
        attributes:
          forecast_solar_kwh: >
            {% set v = states('sensor.energy_production_today') %}
