# ECCO Pro - CONTROL STATE: ONE READ MODEL for Charge Battery (Free Power) and Export to Grid (Dump to Grid), DISPLAY ONLY
#
# NOT INSTALLED, NOT LIVE-PROVEN. Offline only; see home-assistant/packages/README.md ("Control state").
#
# WHY. Two functions, one spine. Charge Battery (the dongle's Free Power lease) and Export to Grid (its Dump to Grid lease) share one start gate, one time trust, one effective reserve, one lease discipline and
# one END; only their policies differ. Today a person (or the Energy Actions card) has to piece together what each function is doing, why it cannot start and what to do next from a dozen entities. This package reads
# those entities and says it once, in the same words for both functions: a lifecycle state, why, the next action, what blocks a start and what the lease holds. It is the read model of the shared control
# architecture (slice S-A1 of the integration design); the card panel and the Geek Mode catalogue are built on it later.
#
# DISPLAY, NEVER A GATE. THE READ MODEL WRITES NOTHING: the file defines three template sensors and nothing else - no automation, no script, no helper, no trigger, no action, no service call, no persistent
# notification, no write of any kind to the dongle, the inverter or any entity - and NO PACKAGE MAY READ IT (the suite pins that no other package mentions these three entities), so it cannot become a second decision
# path. A start is allowed or refused by the start gate (ecco_start_gate.yaml) and by the dongle's own firmware, never by this file. THE GATES ARE SOFT: the dongle's own Start buttons can still be pressed from
# Home Assistant or by an assistant, past every check here, until a firmware gate binds them (a flash, approved separately; item N6). A state of IDLE with start_allowed true is not permission, it is what the
# gate says.
#
# WHAT IT PROVIDES (three template sensors):
#   sensor.ecco_charge_control_state   IDLE | PLANNED | ARMED | ASSISTED | RUNNING | ENDING | FAULT | UNKNOWN for Charge Battery; attributes why, next_action, blocked_by, start_allowed, start_path, end_path, lease, notes
#   sensor.ecco_export_control_state   the same for Export to Grid, plus proposal, retarget and facts (the export coordinator's proposal and re-target, the hold, the reserve, the limits)
#   sensor.ecco_control_owner          NONE | CHARGE | EXPORT | MANUAL_WRITE | RESTORE_OWED | UNKNOWN: who holds the inverter settings; attributes live_match (always NOT_READ: the saved profile's Live Match is not read here, see LIMITS) and note
#
# THE STATES (first match wins, in this order: UNKNOWN, FAULT, ENDING, RUNNING, ARMED, ASSISTED, PLANNED, IDLE; the dongle's lease flags decide, its status text refines):
#   UNKNOWN   an input the state needs cannot be read (missing, unavailable, unknown, not on or off, or a status text this model does not know): never shown as ready, the first one is named in why
#   FAULT     needs the owner: a saved snapshot waits for a restore and nothing runs (restore owed), the status text says a restore or recovery is blocked, failed or waiting for a decision, both leases read active
#             at once (the one-lease rule), or the lease reads active but the status does not confirm that it is running normally
#   ENDING    the lease is being ended and the saved inverter settings restored (an operation in progress, or a status text of the End and restore family)
#   RUNNING   the lease is active and the dongle's status says ACTIVE - VERIFIED OK (Charge Battery: the rate was fixed at the START; Export to Grid: the dongle loop works toward the net export target and ends the lease at the
#             latched Stop SOC; the loop's own word, TRACKING, SETTLING, SATURATED, TARGET INFEASIBLE or NO RESPONSE, is a note: LOOP_*). A raw Start press that the firmware refused during a healthy lease (REJECTED ... already active,
#             the lease flag and the snapshot flag on, no operation in progress) leaves its text on the status until the END: the lease still runs, RUNNING, with the note LAST_PRESS_REFUSED
#   ARMED     a start is under way: the write enable is on, or a start script (the scheduled one or the guarded one) is running, or the dongle reports a start in progress (both start paths publish the ACTIVE text before they
#             clear the operation flag: an operation in progress with the lease flag on and the ACTIVE text is the start finishing, ARMED, never ENDING)
#   ASSISTED  RESERVED: no function reads it today. It is for a start that runs a PROPOSAL of ECCO or the request the owner staged, with the gate open and nothing under way. Charge Battery would use it for the Free Power request the
#               owner staged (the guarded Start with no values runs exactly that); it has no proposal yet and never reads ASSISTED. Export to Grid never reads it, because the guarded Dump start runs the numbers STAGED on the dongle,
#               not the proposal of the export coordinator (that one is for the SCHEDULE path): ASSISTED stays RESERVED for Export until the slice S-C1 binds the Start to the proposal (staged numbers equal to it)
#   PLANNED   its schedule is armed for a later start and the start gate is open or not (see start_allowed)
#   IDLE      no lease, nothing owed, nothing under way
# start_allowed is true ONLY when the function's start gate reads on with an empty blocked_by list AND the time trust reading for leases reads on AND the other function's lease, operation and snapshot flags and the manual
# write flag all read off AND the state is IDLE, PLANNED or ASSISTED (a flag that reads on while the gate reads open is named in blocked_by and why, never "nothing is running"). It is never true while
# the gate is off, while time is not trusted, while any input is unreadable or while the state is anything else, and why says so in plain words ("Not ready: ..."). Every sentence is fixed and from a closed list: a
# measured number never appears in a sentence.
#
# WHAT IT COMBINES (read only; each is an entity that already exists and is already live or in a reviewed package):
#   both gates          binary_sensor.ecco_charge_start_allowed and binary_sensor.ecco_export_start_allowed (state and the blocked_by list of codes; the gates' number-bearing reasons are NOT copied)
#   time trust          binary_sensor.ecco_time_trusted_for_leases (the leases consumer ONLY: the pin of the time trust suite names exactly that one for this package)
#   the dongle          the lease, operation-in-progress and saved-snapshot flags of both functions, the manual write flag, both status texts, both end-time texts, both write enables, the Charge request numbers,
#                       the Export request numbers and the Stop SOC the running Dump lease latched
#   the plan            sensor.ecco_plan_export_hold (and its held_by list), sensor.ecco_plan_effective_reserve, input_number.ecco_grid_import_ceiling_w (a readable 0 = none configured, a note)
#   the schedules       both schedule status sensors, both armed helpers and both scheduled and both guarded start scripts (their state: on while running)
#   the Dump limits     sensor.ecco_dump_limits_state and sensor.ecco_dump_ceiling_assessment (words, no numbers)
#   the coordinator     sensor.ecco_export_proposal, its floor and net export, and sensor.ecco_export_retarget (all OPTIONAL: while they do not exist, or are unavailable or unknown, the proposal reads
#                       NOT_INSTALLED and a note says so; never an error). Their live figures (energy, duration, power) are NOT copied: they move with the measurements, and the coordinator publishes them itself
# Not read, on purpose: any forecast or advice entity (the Intelligence outputs stay shadow), the detector helpers, the card, anything measured live (battery power, SOC, house load, PV, the grid reading).
#
# THE INPUTS THAT MAKE IT UNKNOWN. The gate (state on or off and a blocked_by list), the leases consumer, the three flags of each function, the manual write flag, the function's status text (a text this model
# does not know counts as unreadable), its write enable, its two start scripts and its schedule armed helper. Every other input only fills in an attribute (NOT_READ when it cannot be read) and never makes the
# state UNKNOWN. blocked_by lists UNREADABLE_<INPUT> for each unreadable input first, then the gate's own codes, then TIME_LEASES when the consumer reads off and the gate does not say so, and GATE_INCONSISTENT when the
# gate's state and its list disagree (on with a cause, off with none): such a gate is never "open".
#
# THE STATUS TEXTS. The dongle's own texts are classified by prefix into families: ACTIVE (ACTIVE - VERIFIED OK), FAULT (a recovery or restore blocked, failed, refused or waiting for a decision, and a lease that
# a reboot left with its recovery pending), ENDING (RESTORING, END REQUESTED, END DEFERRED, a verified restore whose durable record is still pending ...), STARTING (STARTING, the snapshot committed) and DONE (nothing
# under way: Inactive, restored OK, a refused or failed start). The suite reads every literal the firmware can publish as these two statuses and requires each to land in exactly one family; a text that matches none
# is UNKNOWN, never ready. A stale text never decides alone: with every flag off a DONE or STARTING text is just IDLE; only a FAULT text is held against the owner until the dongle publishes another.
#
# THE ONE-LEASE RULE. Both functions never read RUNNING together: if both lease flags read on, both read FAULT (the firmware refuses a second function, so this is a contradiction, not a state), the owner reads
# UNKNOWN, and nothing is startable.
#
# NO LIVE NUMBERS, NO MOVING TIME. Attributes carry only words, codes and settings that change when a person changes them (the staged request numbers, the Stop SOC a lease latched, the effective reserve, a lease's
# end-time text): no measurement and no number a gate prints in its reasons, no sentence with a number in it, no time that moves with the clock. The templates never call now(), so nothing is rendered at the
# start of a minute and a sensor publishes a new state or attribute only when its inputs really change it: the same inputs rendered twice give the same state and attributes and write no recorder row (the suite proves
# it, also while the gates' reasons and the dongle's status text move with every poll). The Dump status text carries live figures while a lease runs; only its family is used.
#
# RESTART, RELOAD AND FIRST STATE (lab facts, 27 Nov, a real Home Assistant core 2026.11.0; recalled here, the suite models them): a template reload re-creates every template entity and, for 13 to 27 s (bound about
# 70 s), the time trust consumers and both gates read OFF: the read model then shows not ready with the gate's own codes, never a start. At a RESTART the template entities exist with their RESTORED state for tens of
# milliseconds (consumers and gates ON) before their first render: for that moment this file shows what the gate shows, and nothing may act on it, which is why nothing reads this file; anything that ever acts on a
# gate or a consumer must itself wait 60 s after a start (lab D2). The dongle's texts are parsed in the Core process time zone; this file parses none (it shows an end-time text as it is, after a check that it is a time in the
# firmware's form), so a wrong container zone cannot change it. `this` is not used (after a reload it has no attributes).
#
# THE GUARDED START AND THE PROPOSAL. The guarded Start runs the numbers staged on the dongle; the export coordinator's proposal is for the schedule path and is information only (the proposal attribute says used_by_guarded_start false and
# carries the note PROPOSAL_FOR_SCHEDULE_PATH, and the Export why and next_action say so in plain words). Export to Grid never reads ASSISTED; the suite pins it, and pins that ASSISTED stays RESERVED until the slice S-C1.
#
# THE NOTES (closed codes; each says something true of the wiring at the base of this file, and the slice that changes the wiring removes its note in the same commit): SOFT_GATE (the dongle's own Start button is not
# bound by the gate), CARD_START_NOT_GATED (the card's Start Now presses the dongle's Start directly), GUARDED_START_NOT_GATED (the guarded Dump start does not read the gate), SCHEDULE_NOT_GATED (a schedule presses the
# Start without reading the gate), RATE_FIXED_AT_START and NO_TARGET_REACHED_END (Charge Battery: nothing adapts the rate inside a lease and nothing ends it at a target), NO_END_GUARD (no guard ends an Export lease),
# IMPORT_NOT_CONFIGURED and IMPORT_CEILING_NOT_READ (the grid import ceiling is 0 = none, or cannot be read), PROPOSAL_NOT_INSTALLED, PROPOSAL_FOR_SCHEDULE_PATH (Export: the proposal is for the schedule path), SCHEDULE_LAST_RUN_FAILED,
# LAST_PRESS_REFUSED (a refused raw Start press during a healthy lease) and, for a running Export lease, LOOP_SETTLING, LOOP_TRACKING, LOOP_SATURATED_LOW, LOOP_SATURATED_HIGH, LOOP_TARGET_INFEASIBLE_LOW, LOOP_TARGET_INFEASIBLE_HIGH,
# LOOP_NO_RESPONSE or LOOP_OTHER (the dongle loop's own word in its ACTIVE text; it changes only when the loop changes regime).
#
# LIMITS, stated plainly (nothing here is a lock).
#   - It shows what the entities say; it cannot know more. A dongle that is alive but wrong, a gate that is wrong, a status text that is stale are shown as they are. It is display, never proof.
#   - The lifecycle comes from flags and status families, not from the inverter registers; a drift of the inverter settings is the saved profile's Live Match, which is not a state here and is NOT
#     READ here either: the pin on who may name that entity (registry/tests/test_fallback_live_match.py) allows only the fallback status package, the dashboard and the HA package suites, and a
#     third reader would be a pin widening that the design does not name, so `live_match` is always NOT_READ and the dashboard shows the Live Match itself.
#   - The owner sensor shows who holds the inverter settings NOW, from the flags; a persisted owner (a record that survives a reboot) comes with the firmware work F1, not here.
#   - Recalled from Home Assistant core, NOT verified on a real Home Assistant (the model of them is in the suite): that a template entity that renders to the same state and attributes writes no new state change
#     (no recorder row), that the state of a template entity is restored at a restart for a moment, that a list attribute arrives as a list and a dict as a dict, that strptime(text, format, default) is Python's, that
#     states('x') of an entity that does not exist reads unknown and state_attr of it reads none, and that a Jinja startswith with a tuple works in the template sandbox. Nothing here has run on a real Home Assistant,
#     dongle or inverter.
#
# INSTALL (needs the owner's go; not part of this step). One file copy to /config/packages/ecco_control_state.yaml, a configuration check, then reload the template entities (Developer tools, YAML, Template entities, or
# the template.reload service): no restart, no helper to create, no other file. Install ONLY with NO Dump to Grid or Free Power lease running and OUTSIDE any armed scheduled Export or charge run, from its start until
# its window end plus 10 minutes: template.reload re-creates EVERY template entity of Home Assistant, the plan's hold and effective reserve sensors included, which the Export schedule's press-time recheck reads and fails
# closed on. It needs ecco_time_trust.yaml, ecco_start_gate.yaml, ecco_plan_helpers.yaml and both schedule packages for its inputs (without them it reads UNKNOWN and says which input is missing); the export
# coordinator is optional. It changes no existing entity. Remove: delete the file and reload the template entities (the same cautions).

template:
  - sensor:
      - name: ECCO Charge Control State
        unique_id: ecco_charge_control_state
        icon: mdi:battery-charging-high
        state: >-
          {%- set bad = ['unknown', 'unavailable', 'none', ''] -%}
          {%- set g = states('binary_sensor.ecco_charge_start_allowed') -%}
          {%- set gb = state_attr('binary_sensor.ecco_charge_start_allowed', 'blocked_by') -%}
          {%- set gl = (gb | list) if (gb is iterable and gb is not string and gb is not mapping) else none -%}
          {%- set tl = states('binary_sensor.ecco_time_trusted_for_leases') -%}
          {%- set la = states('binary_sensor.ecco_clock_dongle_free_power_active') -%}
          {%- set lo = states('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress') -%}
          {%- set ls = states('binary_sensor.ecco_clock_dongle_free_power_snapshot_valid') -%}
          {%- set ya = states('binary_sensor.ecco_clock_dongle_dump_to_grid_active') -%}
          {%- set yo = states('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress') -%}
          {%- set ys = states('binary_sensor.ecco_clock_dongle_dump_to_grid_snapshot_valid') -%}
          {%- set mw = states('binary_sensor.ecco_clock_dongle_manual_write_in_progress') -%}
          {%- set t = states('sensor.ecco_clock_dongle_free_power_status') -%}
          {%- set ar = states('switch.ecco_clock_dongle_free_power_write_enable') -%}
          {%- set sc = states('script.ecco_free_power_start_scheduled') -%}
          {%- set gd = states('script.ecco_free_power_start_guarded') -%}
          {%- set sa = states('input_boolean.ecco_free_power_schedule_armed') -%}
          {%- set fam = 'ACTIVE' if t.startswith('ACTIVE - VERIFIED OK')
          else ('FAULT' if t.startswith(('OPERATOR DECISION REQUIRED', 'RECOVERY BLOCKED', 'RECOVERY REQUIRED', 'RESTORE BLOCKED', 'RESTORE WRITE FAILED', 'RESTORE VERIFY ', 'ACTIVATION VERIFY TIMEOUT', 'ACTIVATION VERIFY REFUSED', 'ACTIVATION VERIFY ERROR', 'END BLOCKED', 'FORCE RESTORE REFUSED', 'FORCE RESTORE FAILED', 'FORCE RESTORE ORIGINAL FAILED', 'ACCEPT REFUSED', 'ACCEPT FAILED', 'REJECTED - RECOVERY BLOCKED', 'ACTIVE - reboot recovery pending'))
          else ('ENDING' if (t.startswith(('RESTORING', 'END REQUESTED', 'END DEFERRED', 'FORCE RESTORE - ', 'RESTORE VERIFIED', 'RESTORE DEFERRED', 'Retrying durable', 'RECOVERY RESOLVED - ', 'RECOVERY OBLIGATION RESOLVED', 'ACTIVATION WRITE FAILED', 'ACTIVATION VERIFY FAILED', 'FORCE RESTORE ORIGINAL SUCCESS - hardware', 'ACCEPT CURRENT STATE SUCCESS - accepted')) or (t.startswith('RESTORED OK - ') and t != 'RESTORED OK - original inverter settings verified'))
          else ('STARTING' if t.startswith(('STARTING', 'Snapshot durably committed', 'SNAPSHOT DURABLY COMMITTED'))
          else ('DONE' if (t.startswith(('Inactive', 'RECOVERY RESOLVED OK', 'FORCE RESTORE ORIGINAL SUCCESS - original', 'ACCEPT CURRENT STATE SUCCESS - current', 'ACCEPTED CURRENT STATE -', 'END IGNORED', 'REJECTED', 'START FAILED')) or t == 'RESTORED OK - original inverter settings verified') else 'OTHER')))) -%}
          {%- set ns = namespace(u=[], c=[]) -%}
          {%- if g not in ['on', 'off'] or gl is none -%}{%- set ns.u = ns.u + ['UNREADABLE_GATE'] -%}{%- endif -%}
          {%- for code, v in [('TIME', tl), ('ACTIVE', la), ('OPERATION', lo), ('SNAPSHOT', ls), ('OTHER_ACTIVE', ya), ('OTHER_OPERATION', yo), ('OTHER_SNAPSHOT', ys), ('MANUAL_WRITE', mw), ('WRITE_ENABLE', ar), ('START_SCRIPT', sc), ('GUARDED_SCRIPT', gd), ('SCHEDULE_ARMED', sa)] if v not in ['on', 'off'] -%}
          {%- set ns.u = ns.u + ['UNREADABLE_' ~ code] -%}
          {%- endfor -%}
          {%- if t in bad or fam == 'OTHER' -%}{%- set ns.u = ns.u + ['UNREADABLE_STATUS'] -%}{%- endif -%}
          {%- for c in (gl if gl is not none else []) if c is string -%}{%- set ns.c = ns.c + [c[:40]] -%}{%- endfor -%}
          {%- set sn = ns.c | length -%}
          {%- set incons = g in ['on', 'off'] and gl is not none and ((g == 'on' and (gl | length) > 0) or (g == 'off' and sn == 0)) -%}
          {%- set busy = ya == 'on' or yo == 'on' or ys == 'on' or mw == 'on' -%}
          {%- set ns.c = ns.c + (['TIME_LEASES'] if (tl == 'off' and 'TIME_LEASES' not in ns.c) else []) + (['GATE_INCONSISTENT'] if incons else []) -%}
          {%- for code, v in [('DUMP_ACTIVE', ya), ('DUMP_OPERATION', yo), ('DUMP_SNAPSHOT', ys), ('MANUAL_WRITE', mw)] if v == 'on' and code not in ns.c -%}{%- set ns.c = ns.c + [code] -%}{%- endfor -%}
          {%- set unk = (ns.u | length) > 0 -%}
          {%- set open = g == 'on' and gl is not none and (gl | length) == 0 and tl == 'on' -%}
          {%- set conflict = la == 'on' and ya == 'on' -%}
          {%- set owed = ls == 'on' and la == 'off' and lo == 'off' -%}
          {%- set refused = la == 'on' and lo == 'off' and ls == 'on' and fam == 'DONE' and t.startswith('REJECTED') -%}
          {%- set assisted = false -%}
          {%- set st = 'UNKNOWN' if unk
          else ('FAULT' if (conflict or fam == 'FAULT' or owed)
          else ('ARMED' if (lo == 'on' and (fam == 'STARTING' or (la == 'on' and fam == 'ACTIVE')))
          else ('ENDING' if lo == 'on'
          else (('RUNNING' if (fam == 'ACTIVE' or refused) else ('ENDING' if fam == 'ENDING' else ('ARMED' if fam == 'STARTING' else 'FAULT'))) if la == 'on'
          else ('ARMED' if (ar == 'on' or sc == 'on' or gd == 'on')
          else ('ASSISTED' if assisted else ('PLANNED' if sa == 'on' else 'IDLE'))))))) -%}
          {%- set ok = open and not busy and st in ['IDLE', 'PLANNED', 'ASSISTED'] -%}
          {#- RULES END -#}
          {{ st }}
        attributes:
          why: >-
            {%- set bad = ['unknown', 'unavailable', 'none', ''] -%}
            {%- set g = states('binary_sensor.ecco_charge_start_allowed') -%}
            {%- set gb = state_attr('binary_sensor.ecco_charge_start_allowed', 'blocked_by') -%}
            {%- set gl = (gb | list) if (gb is iterable and gb is not string and gb is not mapping) else none -%}
            {%- set tl = states('binary_sensor.ecco_time_trusted_for_leases') -%}
            {%- set la = states('binary_sensor.ecco_clock_dongle_free_power_active') -%}
            {%- set lo = states('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress') -%}
            {%- set ls = states('binary_sensor.ecco_clock_dongle_free_power_snapshot_valid') -%}
            {%- set ya = states('binary_sensor.ecco_clock_dongle_dump_to_grid_active') -%}
            {%- set yo = states('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress') -%}
            {%- set ys = states('binary_sensor.ecco_clock_dongle_dump_to_grid_snapshot_valid') -%}
            {%- set mw = states('binary_sensor.ecco_clock_dongle_manual_write_in_progress') -%}
            {%- set t = states('sensor.ecco_clock_dongle_free_power_status') -%}
            {%- set ar = states('switch.ecco_clock_dongle_free_power_write_enable') -%}
            {%- set sc = states('script.ecco_free_power_start_scheduled') -%}
            {%- set gd = states('script.ecco_free_power_start_guarded') -%}
            {%- set sa = states('input_boolean.ecco_free_power_schedule_armed') -%}
            {%- set fam = 'ACTIVE' if t.startswith('ACTIVE - VERIFIED OK')
            else ('FAULT' if t.startswith(('OPERATOR DECISION REQUIRED', 'RECOVERY BLOCKED', 'RECOVERY REQUIRED', 'RESTORE BLOCKED', 'RESTORE WRITE FAILED', 'RESTORE VERIFY ', 'ACTIVATION VERIFY TIMEOUT', 'ACTIVATION VERIFY REFUSED', 'ACTIVATION VERIFY ERROR', 'END BLOCKED', 'FORCE RESTORE REFUSED', 'FORCE RESTORE FAILED', 'FORCE RESTORE ORIGINAL FAILED', 'ACCEPT REFUSED', 'ACCEPT FAILED', 'REJECTED - RECOVERY BLOCKED', 'ACTIVE - reboot recovery pending'))
            else ('ENDING' if (t.startswith(('RESTORING', 'END REQUESTED', 'END DEFERRED', 'FORCE RESTORE - ', 'RESTORE VERIFIED', 'RESTORE DEFERRED', 'Retrying durable', 'RECOVERY RESOLVED - ', 'RECOVERY OBLIGATION RESOLVED', 'ACTIVATION WRITE FAILED', 'ACTIVATION VERIFY FAILED', 'FORCE RESTORE ORIGINAL SUCCESS - hardware', 'ACCEPT CURRENT STATE SUCCESS - accepted')) or (t.startswith('RESTORED OK - ') and t != 'RESTORED OK - original inverter settings verified'))
            else ('STARTING' if t.startswith(('STARTING', 'Snapshot durably committed', 'SNAPSHOT DURABLY COMMITTED'))
            else ('DONE' if (t.startswith(('Inactive', 'RECOVERY RESOLVED OK', 'FORCE RESTORE ORIGINAL SUCCESS - original', 'ACCEPT CURRENT STATE SUCCESS - current', 'ACCEPTED CURRENT STATE -', 'END IGNORED', 'REJECTED', 'START FAILED')) or t == 'RESTORED OK - original inverter settings verified') else 'OTHER')))) -%}
            {%- set ns = namespace(u=[], c=[]) -%}
            {%- if g not in ['on', 'off'] or gl is none -%}{%- set ns.u = ns.u + ['UNREADABLE_GATE'] -%}{%- endif -%}
            {%- for code, v in [('TIME', tl), ('ACTIVE', la), ('OPERATION', lo), ('SNAPSHOT', ls), ('OTHER_ACTIVE', ya), ('OTHER_OPERATION', yo), ('OTHER_SNAPSHOT', ys), ('MANUAL_WRITE', mw), ('WRITE_ENABLE', ar), ('START_SCRIPT', sc), ('GUARDED_SCRIPT', gd), ('SCHEDULE_ARMED', sa)] if v not in ['on', 'off'] -%}
            {%- set ns.u = ns.u + ['UNREADABLE_' ~ code] -%}
            {%- endfor -%}
            {%- if t in bad or fam == 'OTHER' -%}{%- set ns.u = ns.u + ['UNREADABLE_STATUS'] -%}{%- endif -%}
            {%- for c in (gl if gl is not none else []) if c is string -%}{%- set ns.c = ns.c + [c[:40]] -%}{%- endfor -%}
            {%- set sn = ns.c | length -%}
            {%- set incons = g in ['on', 'off'] and gl is not none and ((g == 'on' and (gl | length) > 0) or (g == 'off' and sn == 0)) -%}
            {%- set busy = ya == 'on' or yo == 'on' or ys == 'on' or mw == 'on' -%}
            {%- set ns.c = ns.c + (['TIME_LEASES'] if (tl == 'off' and 'TIME_LEASES' not in ns.c) else []) + (['GATE_INCONSISTENT'] if incons else []) -%}
            {%- for code, v in [('DUMP_ACTIVE', ya), ('DUMP_OPERATION', yo), ('DUMP_SNAPSHOT', ys), ('MANUAL_WRITE', mw)] if v == 'on' and code not in ns.c -%}{%- set ns.c = ns.c + [code] -%}{%- endfor -%}
            {%- set unk = (ns.u | length) > 0 -%}
            {%- set open = g == 'on' and gl is not none and (gl | length) == 0 and tl == 'on' -%}
            {%- set conflict = la == 'on' and ya == 'on' -%}
            {%- set owed = ls == 'on' and la == 'off' and lo == 'off' -%}
            {%- set refused = la == 'on' and lo == 'off' and ls == 'on' and fam == 'DONE' and t.startswith('REJECTED') -%}
            {%- set assisted = false -%}
            {%- set st = 'UNKNOWN' if unk
            else ('FAULT' if (conflict or fam == 'FAULT' or owed)
            else ('ARMED' if (lo == 'on' and (fam == 'STARTING' or (la == 'on' and fam == 'ACTIVE')))
            else ('ENDING' if lo == 'on'
            else (('RUNNING' if (fam == 'ACTIVE' or refused) else ('ENDING' if fam == 'ENDING' else ('ARMED' if fam == 'STARTING' else 'FAULT'))) if la == 'on'
            else ('ARMED' if (ar == 'on' or sc == 'on' or gd == 'on')
            else ('ASSISTED' if assisted else ('PLANNED' if sa == 'on' else 'IDLE'))))))) -%}
