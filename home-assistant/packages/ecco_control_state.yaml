            {%- set sn = ns.c | length -%}
            {%- set incons = g in ['on', 'off'] and gl is not none and ((g == 'on' and (gl | length) > 0) or (g == 'off' and sn == 0)) -%}
            {%- set busy = ya == 'on' or yo == 'on' or ys == 'on' or mw == 'on' -%}
            {%- set ns.c = ns.c + (['TIME_LEASES'] if (tl == 'off' and 'TIME_LEASES' not in ns.c) else []) + (['GATE_INCONSISTENT'] if incons else []) -%}
            {%- for code, v in [('FREE_POWER_ACTIVE', ya), ('FREE_POWER_OPERATION', yo), ('FREE_POWER_SNAPSHOT', ys), ('MANUAL_WRITE', mw)] if v == 'on' and code not in ns.c -%}{%- set ns.c = ns.c + [code] -%}{%- endfor -%}
            {%- set unk = (ns.u | length) > 0 -%}
            {%- set open = g == 'on' and gl is not none and (gl | length) == 0 and tl == 'on' -%}
            {%- set conflict = la == 'on' and ya == 'on' -%}
            {%- set owed = ls == 'on' and la == 'off' and lo == 'off' -%}
            {%- set refused = la == 'on' and lo == 'off' and ls == 'on' and fam == 'DONE' and t.startswith('REJECTED') -%}
            {%- set assisted = false -%}
            {%- set st = 'UNKNOWN' if unk
            else ('FAULT' if (conflict or fam == 'FAULT' or owed)
            else ('ARMED' if (lo == 'on' and (fam == 'STARTING' or (la == 'on' and fam == 'ACTIVE')))
            else ('ENDING' if lo == 'on'
            else (('RUNNING' if (fam == 'ACTIVE' or refused) else ('ENDING' if fam == 'ENDING' else ('ARMED' if fam == 'STARTING' else 'FAULT'))) if la == 'on'
            else ('ARMED' if (ar == 'on' or sc == 'on' or gd == 'on')
            else ('ASSISTED' if assisted else ('PLANNED' if sa == 'on' else 'IDLE'))))))) -%}
            {%- set ok = open and not busy and st in ['IDLE', 'PLANNED', 'ASSISTED'] -%}
            {#- RULES END -#}
            {%- set ss = states('sensor.ecco_dump_to_grid_schedule_status') -%}
            {%- set pe = states('sensor.ecco_export_proposal') -%}
            {%- set lc = namespace(c=[]) -%}
            {%- for needle, code in [(' - SETTLING - ', 'LOOP_SETTLING'), (' - TRACKING - ', 'LOOP_TRACKING'), (' - SATURATED LOW - ', 'LOOP_SATURATED_LOW'), (' - SATURATED HIGH - ', 'LOOP_SATURATED_HIGH'), (' - TARGET INFEASIBLE LOW - ', 'LOOP_TARGET_INFEASIBLE_LOW'), (' - TARGET INFEASIBLE HIGH - ', 'LOOP_TARGET_INFEASIBLE_HIGH'), (' - NO RESPONSE - ', 'LOOP_NO_RESPONSE')] -%}
            {%- if st == 'RUNNING' and fam == 'ACTIVE' and needle in t and (lc.c | length) == 0 -%}{%- set lc.c = [code] -%}{%- endif -%}
            {%- endfor -%}
            {%- set loop = lc.c if (lc.c | length) > 0 else (['LOOP_OTHER'] if (st == 'RUNNING' and fam == 'ACTIVE') else []) -%}
            {{ ['SOFT_GATE', 'GUARDED_START_NOT_GATED', 'PROPOSAL_FOR_SCHEDULE_PATH', 'SCHEDULE_NOT_GATED', 'NO_END_GUARD'] + (['PROPOSAL_NOT_INSTALLED'] if pe in bad else []) + (['SCHEDULE_LAST_RUN_FAILED'] if ss == 'FAILED' else []) + (['LAST_PRESS_REFUSED'] if refused else []) + loop }}
          proposal: >-
            {%- set bad = ['unknown', 'unavailable', 'none', ''] -%}
            {%- set g = states('binary_sensor.ecco_export_start_allowed') -%}
            {%- set gb = state_attr('binary_sensor.ecco_export_start_allowed', 'blocked_by') -%}
            {%- set gl = (gb | list) if (gb is iterable and gb is not string and gb is not mapping) else none -%}
            {%- set tl = states('binary_sensor.ecco_time_trusted_for_leases') -%}
            {%- set la = states('binary_sensor.ecco_clock_dongle_dump_to_grid_active') -%}
            {%- set lo = states('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress') -%}
            {%- set ls = states('binary_sensor.ecco_clock_dongle_dump_to_grid_snapshot_valid') -%}
            {%- set ya = states('binary_sensor.ecco_clock_dongle_free_power_active') -%}
            {%- set yo = states('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress') -%}
            {%- set ys = states('binary_sensor.ecco_clock_dongle_free_power_snapshot_valid') -%}
            {%- set mw = states('binary_sensor.ecco_clock_dongle_manual_write_in_progress') -%}
            {%- set t = states('sensor.ecco_clock_dongle_dump_to_grid_status') -%}
            {%- set ar = states('switch.ecco_clock_dongle_dump_to_grid_write_enable') -%}
            {%- set sc = states('script.ecco_dump_to_grid_start_scheduled') -%}
            {%- set gd = states('script.ecco_dump_to_grid_start_guarded') -%}
            {%- set sa = states('input_boolean.ecco_dump_to_grid_schedule_armed') -%}
            {%- set fam = 'ACTIVE' if t.startswith('ACTIVE - VERIFIED OK')
            else ('FAULT' if t.startswith(('OPERATOR DECISION REQUIRED', 'RECOVERY BLOCKED', 'RECOVERY REQUIRED', 'RESTORE BLOCKED', 'RESTORE WRITE FAILED', 'RESTORE VERIFY ', 'ACTIVATION VERIFY TIMEOUT', 'ACTIVATION VERIFY REFUSED', 'ACTIVATION VERIFY ERROR', 'END BLOCKED', 'FORCE RESTORE REFUSED', 'FORCE RESTORE FAILED', 'FORCE RESTORE ORIGINAL FAILED', 'ACCEPT REFUSED', 'ACCEPT FAILED', 'REJECTED - RECOVERY BLOCKED', 'ACTIVE - reboot recovery pending'))
            else ('ENDING' if (t.startswith(('RESTORING', 'END REQUESTED', 'END DEFERRED', 'FORCE RESTORE - ', 'RESTORE VERIFIED', 'RESTORE DEFERRED', 'Retrying durable', 'RECOVERY RESOLVED - ', 'RECOVERY OBLIGATION RESOLVED', 'ACTIVATION WRITE FAILED', 'ACTIVATION VERIFY FAILED', 'FORCE RESTORE ORIGINAL SUCCESS - hardware', 'ACCEPT CURRENT STATE SUCCESS - accepted')) or (t.startswith('RESTORED OK - ') and t != 'RESTORED OK - original inverter settings verified'))
            else ('STARTING' if t.startswith(('STARTING', 'Snapshot durably committed', 'SNAPSHOT DURABLY COMMITTED'))
            else ('DONE' if (t.startswith(('Inactive', 'RECOVERY RESOLVED OK', 'FORCE RESTORE ORIGINAL SUCCESS - original', 'ACCEPT CURRENT STATE SUCCESS - current', 'ACCEPTED CURRENT STATE -', 'END IGNORED', 'REJECTED', 'START FAILED')) or t == 'RESTORED OK - original inverter settings verified') else 'OTHER')))) -%}
            {%- set ns = namespace(u=[], c=[]) -%}
            {%- if g not in ['on', 'off'] or gl is none -%}{%- set ns.u = ns.u + ['UNREADABLE_GATE'] -%}{%- endif -%}
            {%- for code, v in [('TIME', tl), ('ACTIVE', la), ('OPERATION', lo), ('SNAPSHOT', ls), ('OTHER_ACTIVE', ya), ('OTHER_OPERATION', yo), ('OTHER_SNAPSHOT', ys), ('MANUAL_WRITE', mw), ('WRITE_ENABLE', ar), ('START_SCRIPT', sc), ('GUARDED_SCRIPT', gd), ('SCHEDULE_ARMED', sa)] if v not in ['on', 'off'] -%}
            {%- set ns.u = ns.u + ['UNREADABLE_' ~ code] -%}
            {%- endfor -%}
            {%- if t in bad or fam == 'OTHER' -%}{%- set ns.u = ns.u + ['UNREADABLE_STATUS'] -%}{%- endif -%}
            {%- for c in (gl if gl is not none else []) if c is string -%}{%- set ns.c = ns.c + [c[:40]] -%}{%- endfor -%}
            {%- set sn = ns.c | length -%}
            {%- set incons = g in ['on', 'off'] and gl is not none and ((g == 'on' and (gl | length) > 0) or (g == 'off' and sn == 0)) -%}
            {%- set busy = ya == 'on' or yo == 'on' or ys == 'on' or mw == 'on' -%}
            {%- set ns.c = ns.c + (['TIME_LEASES'] if (tl == 'off' and 'TIME_LEASES' not in ns.c) else []) + (['GATE_INCONSISTENT'] if incons else []) -%}
            {%- for code, v in [('FREE_POWER_ACTIVE', ya), ('FREE_POWER_OPERATION', yo), ('FREE_POWER_SNAPSHOT', ys), ('MANUAL_WRITE', mw)] if v == 'on' and code not in ns.c -%}{%- set ns.c = ns.c + [code] -%}{%- endfor -%}
            {%- set unk = (ns.u | length) > 0 -%}
            {%- set open = g == 'on' and gl is not none and (gl | length) == 0 and tl == 'on' -%}
            {%- set conflict = la == 'on' and ya == 'on' -%}
            {%- set owed = ls == 'on' and la == 'off' and lo == 'off' -%}
            {%- set refused = la == 'on' and lo == 'off' and ls == 'on' and fam == 'DONE' and t.startswith('REJECTED') -%}
            {%- set assisted = false -%}
            {%- set st = 'UNKNOWN' if unk
            else ('FAULT' if (conflict or fam == 'FAULT' or owed)
            else ('ARMED' if (lo == 'on' and (fam == 'STARTING' or (la == 'on' and fam == 'ACTIVE')))
            else ('ENDING' if lo == 'on'
            else (('RUNNING' if (fam == 'ACTIVE' or refused) else ('ENDING' if fam == 'ENDING' else ('ARMED' if fam == 'STARTING' else 'FAULT'))) if la == 'on'
            else ('ARMED' if (ar == 'on' or sc == 'on' or gd == 'on')
            else ('ASSISTED' if assisted else ('PLANNED' if sa == 'on' else 'IDLE'))))))) -%}
            {%- set ok = open and not busy and st in ['IDLE', 'PLANNED', 'ASSISTED'] -%}
            {#- RULES END -#}
            {%- set ps = states('sensor.ecco_export_proposal') -%}
            {%- set pb = state_attr('sensor.ecco_export_proposal', 'blocked_by') -%}
            {%- set pf = states('sensor.ecco_export_proposal_floor') | float(none) -%}
            {%- set pn = states('sensor.ecco_export_proposal_net_export') | float(none) -%}
            {%- set pstate = 'NOT_INSTALLED' if ps in bad else (ps if ps in ['VALID', 'INVALID', 'UNVERIFIED', 'HOLD', 'NOT ALLOWED'] else 'UNKNOWN') -%}
            {%- set pcodes = namespace(l=[]) -%}
            {%- for c in ((pb | list) if (pb is iterable and pb is not string and pb is not mapping) else []) if c is string -%}{%- set pcodes.l = pcodes.l + [c[:40]] -%}{%- endfor -%}
            {{ {'state': pstate, 'used_by_guarded_start': false, 'note': 'PROPOSAL_FOR_SCHEDULE_PATH', 'blocked_by': pcodes.l, 'floor_pct': ((pf | round(0) | int) if (pf is number and pf == pf and pf >= 0 and pf <= 100) else none), 'net_export_w': ((pn | round(0) | int) if (pn is number and pn == pn and pn >= 0 and pn <= 30000) else none)} }}
          retarget: >-
            {%- set bad = ['unknown', 'unavailable', 'none', ''] -%}
            {%- set rs = states('sensor.ecco_export_retarget') -%}
            {%- set rr = state_attr('sensor.ecco_export_retarget', 'reasons') -%}
            {%- set rc = state_attr('sensor.ecco_export_retarget', 'changes') -%}
            {%- set rstate = 'NOT_INSTALLED' if rs in bad else (rs if rs in ['NOT RUNNING', 'UNKNOWN', 'NO CHANGE', 'WAIT', 'ALLOWED', 'END NOW'] else 'UNKNOWN') -%}
            {%- set rn = namespace(codes=[], kinds=[]) -%}
            {%- for r in ((rr | list) if (rr is iterable and rr is not string and rr is not mapping) else []) if r is string -%}
            {%- set k = r.split(':')[0] -%}
            {%- if k.isupper() and k.replace('_', '').isalpha() and (k | length) <= 40 -%}{%- set rn.codes = rn.codes + [k] -%}{%- endif -%}
            {%- endfor -%}
            {%- for r in ((rc | list) if (rc is iterable and rc is not string and rc is not mapping) else []) if r is string -%}
            {%- set k = r.split(' ')[0] -%}
            {%- if k in ['STOP_SOC', 'EXPORT_TARGET', 'END'] -%}{%- set rn.kinds = rn.kinds + [k] -%}{%- endif -%}
            {%- endfor -%}
            {{ {'state': rstate, 'changes': rn.kinds, 'codes': rn.codes, 'message': ('ECCO would end this export; no END guard is installed: press END.' if rstate == 'END NOW' else '')} }}
          facts: >-
            {%- set la = states('binary_sensor.ecco_clock_dongle_dump_to_grid_active') -%}
            {%- set hs = states('sensor.ecco_plan_export_hold') -%}
            {%- set hb = state_attr('sensor.ecco_plan_export_hold', 'held_by') -%}
            {%- set rv = states('sensor.ecco_plan_effective_reserve') | float(none) -%}
            {%- set lv = states('sensor.ecco_clock_dongle_dump_to_grid_active_stop_soc') | float(none) -%}
            {%- set lim = states('sensor.ecco_dump_limits_state') -%}
            {%- set cas = states('sensor.ecco_dump_ceiling_assessment') -%}
            {%- set rvn = (rv | round(0) | int) if (rv is number and rv == rv and rv >= 0 and rv <= 100) else none -%}
            {%- set lvn = (lv | round(0) | int) if (lv is number and lv == lv and lv >= 0 and lv <= 100) else none -%}
            {%- set held = ((hb.split(',') | select('in', ['hold_battery', 'skip_tonight', 'prepare_power_cut']) | list) if (hb is string) else []) -%}
            {{ {'hold': (hs if hs in ['clear', 'held'] else 'NOT_READ'), 'held_by': held, 'reserve_pct': (rvn if rvn is not none else 'NOT_READ'), 'stop_soc_latched': ('NONE' if la == 'off' else (lvn if lvn is not none else 'NOT_READ')), 'floor': ('NO_LEASE' if la == 'off' else ('NOT_READ' if (lvn is none or rvn is none) else ('OK' if lvn >= rvn else 'BELOW_RESERVE'))), 'limits': (lim if lim in ['VALID', 'NOT CONFIGURED', 'INVALID', 'AWAITING CONFIRMATION', 'UNKNOWN', 'UNAVAILABLE'] else 'NOT_READ'), 'ceiling': (cas if cas in ['ABOVE PROVEN LEVEL', 'AT PROVEN LEVEL', 'BELOW PROVEN LEVEL', 'UNAVAILABLE'] else 'NOT_READ')} }}

      - name: ECCO Control Owner
        unique_id: ecco_control_owner
        icon: mdi:shield-account-outline
        state: >-
          {%- set fa = states('binary_sensor.ecco_clock_dongle_free_power_active') -%}
          {%- set fo = states('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress') -%}
          {%- set fs = states('binary_sensor.ecco_clock_dongle_free_power_snapshot_valid') -%}
          {%- set da = states('binary_sensor.ecco_clock_dongle_dump_to_grid_active') -%}
          {%- set dq = states('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress') -%}
          {%- set ds = states('binary_sensor.ecco_clock_dongle_dump_to_grid_snapshot_valid') -%}
          {%- set mw = states('binary_sensor.ecco_clock_dongle_manual_write_in_progress') -%}
          {%- set unk = (fa not in ['on', 'off']) or (fo not in ['on', 'off']) or (fs not in ['on', 'off']) or (da not in ['on', 'off']) or (dq not in ['on', 'off']) or (ds not in ['on', 'off']) or (mw not in ['on', 'off']) -%}
          {%- set own = 'UNKNOWN' if unk else ('UNKNOWN' if ((fa == 'on' or fo == 'on') and (da == 'on' or dq == 'on')) else ('RESTORE_OWED' if ((fs == 'on' and fa == 'off' and fo == 'off') or (ds == 'on' and da == 'off' and dq == 'off')) else ('CHARGE' if (fa == 'on' or fo == 'on') else ('EXPORT' if (da == 'on' or dq == 'on') else ('MANUAL_WRITE' if mw == 'on' else 'NONE'))))) -%}
          {#- RULES END -#}
          {{ own }}
        attributes:
          live_match: NOT_READ
          note: >-
            {%- set fa = states('binary_sensor.ecco_clock_dongle_free_power_active') -%}
            {%- set fo = states('binary_sensor.ecco_clock_dongle_free_power_operation_in_progress') -%}
            {%- set fs = states('binary_sensor.ecco_clock_dongle_free_power_snapshot_valid') -%}
            {%- set da = states('binary_sensor.ecco_clock_dongle_dump_to_grid_active') -%}
            {%- set dq = states('binary_sensor.ecco_clock_dongle_dump_to_grid_operation_in_progress') -%}
            {%- set ds = states('binary_sensor.ecco_clock_dongle_dump_to_grid_snapshot_valid') -%}
            {%- set mw = states('binary_sensor.ecco_clock_dongle_manual_write_in_progress') -%}
            {%- set unk = (fa not in ['on', 'off']) or (fo not in ['on', 'off']) or (fs not in ['on', 'off']) or (da not in ['on', 'off']) or (dq not in ['on', 'off']) or (ds not in ['on', 'off']) or (mw not in ['on', 'off']) -%}
            {%- set own = 'UNKNOWN' if unk else ('UNKNOWN' if ((fa == 'on' or fo == 'on') and (da == 'on' or dq == 'on')) else ('RESTORE_OWED' if ((fs == 'on' and fa == 'off' and fo == 'off') or (ds == 'on' and da == 'off' and dq == 'off')) else ('CHARGE' if (fa == 'on' or fo == 'on') else ('EXPORT' if (da == 'on' or dq == 'on') else ('MANUAL_WRITE' if mw == 'on' else 'NONE'))))) -%}
            {#- RULES END -#}
            {%- set NOTES = {
            'NONE': 'No lease and no manual write holds the inverter settings. Only the firmware refusal keeps two functions apart; a persisted owner needs a later firmware step.',
            'CHARGE': 'Charge Battery (Free Power) holds the inverter settings; the firmware refuses Export to Grid while it does.',
            'EXPORT': 'Export to Grid (Dump to Grid) holds the inverter settings; the firmware refuses Charge Battery while it does.',
            'MANUAL_WRITE': 'A manual inverter write holds the inverter write mutex; the firmware refuses a lease start while it does.',
            'RESTORE_OWED': 'A saved snapshot of the inverter settings is waiting for a restore: the owner has to see it through before anything starts.',
            'UNKNOWN': 'A flag cannot be read, or both functions claim the inverter settings at once: nobody is shown as the owner.'
            } -%}
            {{ NOTES[own] }}
