# ECCO Pro - Fallback Profile / Supervision display layer (FB-B3)
#
# *** STAGED / NOT LIVE-PROVEN - offline Jinja matrix tests only ***
#
# READ-ONLY DISPLAY LAYER. Every entity below is a template entity (or the one
# UI helper) whose state is a pure function of existing ESPHome entities. This
# file is never a firmware safety primitive: Home Assistant is NOT a control
# authority here, and nothing in this file gates, enables or triggers any
# inverter, lease, arm or fallback behaviour. The dongle firmware re-validates
# every operator action and remains the only safety authority.
#
# This file contains:
#   - no service calls (no esphome / button / switch / modbus_client calls)
#   - no automation: or script: blocks (the operator wrappers live ONLY in
#     ecco_fallback_profile_actions.yaml)
#   - no restart / reload calls
#   - no package-level recorder: block (a package-level block can conflict
#     with the site's own recorder configuration; same precedent as
#     ecco_supervision_heartbeat.yaml)
#   - no firmware control logic
#
# Contract: docs/architecture/fallback/FINAL_FBB_FBC_ARCHITECTURE.md section 9
# (9.6 packages, 9.7 display mapping) and design/S5_ha_contract_ux_final.md
# Part A (which overrides Part B). The firmware entities consumed here are the
# ESPHome FB-B entities: B1 State, B2 Summary, B3 Review, B4 Review ID, B7/B8
# saved Slots/Context, B10 Live Match (introduced by FB-B3 firmware; until that
# firmware is deployed the Live Match entity is unavailable and a VALID profile
# displays Unknown, never Ready) and the Arm switch (read only).
#
# Entity ids use the installation's device/area slug `ecco_clock_dongle`
# (a site constant, not portable). Confirm by live discovery (LP-B3) before
# deploying; if the slug differs, fix THIS file, never the firmware names.
#
# DISPLAY PRECEDENCE of sensor.ecco_fallback_status_code (first match wins; a
# later stage inserts its rows at the marked anchors and never reorders):
#   1  not_reporting         B1 unknown/unavailable
#   -  [FB-E/F rows 2-6 insert here]
#   7  lease_unreadable      B10 obl has :UR :MC :CT or :ML  ("Do NOT restart")
#   8  lease_lockout         B10 obl has :ON :DV :LK or R4:PC
#   9  shadow_episode        FB-C Shadow State is SHADOW_EPISODE or SHADOW_EPISODE_HA_BACK (FB-C3; display words
#                            "Shadow Recovery"; ONLY the Shadow State opens this row - no shadow Verdict, Inputs or
#                            plan ever changes the canonical status, S5 Part A H4)
#   10 save_unconfirmed      B1 = SAVE_UNCONFIRMED
#   11 profile_regressed     HA generation high-water > device (detection only)
#   12 profile_unusable      B1 in UNREADABLE CORRUPT CORRUPT_DOMAIN PROFILE_LOST PROFILE_STALE
#   13 not_captured          B1 = NOT_CAPTURED
#   14 invalidated           B1 = INVALIDATED
#   15 lease_restoring       VALID and obl has :RR :PC :EN or :IF
#   16 live_out_of_domain    VALID and m = OUT_OF_DOMAIN
#   17 drift_export          VALID and m = EXPORT
#   18 drift_context         VALID and m = CONTEXT
#   19 drift_values          VALID and m = DRIFT
#   20 match                 VALID and m = MATCH
#   21 paused                VALID and m in PAUSED, PAUSED_IO
#   22 live_unknown          VALID and any other m
#   23 unexpected_state      anything else
# The profile is NEVER silently updated: drift only changes this display.
#
# OPTIONAL site-level recorder exclusions (not applied here):
#   sensor.ecco_clock_dongle_ecco_supervision_challenge
#
# Attribute names exposed for the dashboard (read-only; Part A: safety
# decoding lives in jinja-tested template attributes, never in dashboard JS):
#   sensor.ecco_fallback_status:
#     code, subline, profile_class, live_match, summary, obligations,
#     export_hazard, high_water, saved_export_mode, saved_energy_mode,
#     saved_grid_charging, saved_tou_schedule, saved_sources,
#     drift_cells, drift_count,
#     candidate_export_mode, candidate_energy_mode, candidate_grid_charging,
#     candidate_tou_schedule, candidate_sources, candidate_changed_cells,
#     next_generation, next_generation_text
#   sensor.ecco_shadow_check (FB-C3; diagnostic decoder of the five existing ECCO Failback Shadow strings; state =
#     operator wording of the current Verdict; attributes verdict, shadow_state, episode_open, status_masks_shadow,
#     canonical_status_code, verdict_scope, verdict_heading, latched, inputs, episode, soak, unknown_keys, raw,
#     scope_note, source_entities)
#   binary_sensor.ecco_shadow_episode_open (FB-C3; display flag for the dashboard banner)

template:
  - sensor:
      - name: "ECCO Supervision Status"
        unique_id: ecco_supervision_status
        icon: mdi:shield-account-outline
        state: >-
          {%- set s = states('sensor.ecco_clock_dongle_ecco_supervision_state') -%}
          {%- set st = states('binary_sensor.ecco_clock_dongle_ecco_supervision_stable') -%}
          {%- if s == 'SUPERVISED' and st == 'on' -%}Healthy
          {%- elif s == 'SUPERVISED' and st == 'off' -%}Recovering
          {%- elif s == 'SUSPECT' -%}Suspect
          {%- elif s == 'LOST' -%}Lost
          {%- elif s == 'STARTUP' -%}Awaiting Heartbeat
          {%- else -%}Unknown
          {%- endif -%}
        attributes:
          firmware_state: "{{ states('sensor.ecco_clock_dongle_ecco_supervision_state') }}"
          stable: "{{ states('binary_sensor.ecco_clock_dongle_ecco_supervision_stable') }}"
          heartbeat_age_s: "{{ states('sensor.ecco_clock_dongle_ecco_supervision_heartbeat_age') }}"
          api_client_connected: "{{ states('binary_sensor.ecco_clock_dongle_ecco_api_client_connected') }}"
          subline: >-
            {%- set s = states('sensor.ecco_clock_dongle_ecco_supervision_state') -%}
            {%- set st = states('binary_sensor.ecco_clock_dongle_ecco_supervision_stable') -%}
            {%- if s == 'SUPERVISED' and st == 'on' -%}Home Assistant heartbeat is healthy (last beat {{ states('sensor.ecco_clock_dongle_ecco_supervision_heartbeat_age') }} s ago).
            {%- elif s == 'SUPERVISED' and st == 'off' -%}Heartbeats resumed; waiting for a stable run of on-time beats.
            {%- elif s == 'SUSPECT' -%}No valid heartbeat for longer than the suspect threshold.
            {%- elif s == 'LOST' -%}No valid heartbeat within the loss threshold - check the ECCO supervision heartbeat automation.
            {%- elif s == 'STARTUP' -%}No heartbeat yet since the dongle started.
            {%- else -%}Supervision state not available.
            {%- endif -%}
          source_entities: >-
            {{ ['sensor.ecco_clock_dongle_ecco_supervision_state',
                'binary_sensor.ecco_clock_dongle_ecco_supervision_stable'] }}

      - name: "ECCO Fallback Status Code"
        unique_id: ecco_fallback_status_code
        icon: mdi:shield-star-outline
        state: >-
          {%- set P = states('sensor.ecco_clock_dongle_ecco_fallback_profile_state') -%}
          {%- set L = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_live_match') ~ ';' -%}
          {%- set m = L.split(';m=')[1].split(';')[0] if ';m=' in L else 'UNKNOWN' -%}
          {%- set obl = (L.split(';obl=')[1].split(';')[0] if ';obl=' in L else '') ~ ',' -%}
          {%- set ns = namespace(unreadable=false, lockout=false, restoring=false) -%}
          {%- for e in obl.split(',') if ':' in e -%}
            {%- set k = e.split(':')[1] -%}
            {%- if k in ['UR', 'MC', 'CT', 'ML'] -%}{%- set ns.unreadable = true -%}
            {%- elif k in ['ON', 'DV', 'LK'] or e == 'R4:PC' -%}{%- set ns.lockout = true -%}
            {%- elif k in ['RR', 'PC', 'EN', 'IF'] -%}{%- set ns.restoring = true -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set G = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_summary') ~ ';' -%}
          {%- set g = G.split(';g=')[1].split(';')[0] if ';g=' in G else '-' -%}
          {%- set hw = states('sensor.ecco_fallback_generation_high_water') | int(0) -%}
          {%- set regressed = hw > 0 and (P == 'NOT_CAPTURED' or (P in ['VALID', 'INVALIDATED'] and g.isdigit() and (g | int(0)) < hw)) -%}
          {#- C3 -#}{%- set SS = states('sensor.ecco_clock_dongle_ecco_failback_shadow_state') -%}
          {%- if P in ['unknown', 'unavailable', 'none', ''] -%}not_reporting
          {#- E/F -#}{#- FB-E/F rows 2-6 insert here, immediately after not_reporting -#}
          {%- elif ns.unreadable -%}lease_unreadable
          {%- elif ns.lockout -%}lease_lockout
          {#- C3 -#}{%- elif SS in ['SHADOW_EPISODE', 'SHADOW_EPISODE_HA_BACK'] -%}shadow_episode
          {%- elif P == 'SAVE_UNCONFIRMED' -%}save_unconfirmed
          {%- elif regressed -%}profile_regressed
          {%- elif P in ['UNREADABLE', 'CORRUPT', 'CORRUPT_DOMAIN', 'PROFILE_LOST', 'PROFILE_STALE'] -%}profile_unusable
          {%- elif P == 'NOT_CAPTURED' -%}not_captured
          {%- elif P == 'INVALIDATED' -%}invalidated
          {%- elif P == 'VALID' -%}
            {%- if ns.restoring -%}lease_restoring
            {%- elif m == 'OUT_OF_DOMAIN' -%}live_out_of_domain
            {%- elif m == 'EXPORT' -%}drift_export
            {%- elif m == 'CONTEXT' -%}drift_context
            {%- elif m == 'DRIFT' -%}drift_values
            {%- elif m == 'MATCH' -%}match
            {%- elif m in ['PAUSED', 'PAUSED_IO'] -%}paused
            {%- else -%}live_unknown
            {%- endif -%}
          {%- else -%}unexpected_state
          {%- endif -%}
        attributes:
          profile_class: "{{ states('sensor.ecco_clock_dongle_ecco_fallback_profile_state') }}"
          live_match: >-
            {%- set L = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_live_match') ~ ';' -%}
            {{ L.split(';m=')[1].split(';')[0] if ';m=' in L else 'UNKNOWN' }}
          obligations: >-
            {%- set L = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_live_match') ~ ';' -%}
            {{ L.split(';obl=')[1].split(';')[0] if ';obl=' in L else '-' }}
          export_hazard: >-
            {%- set L = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_live_match') ~ ';' -%}
            {{ L.split(';eh=')[1].split(';')[0] if ';eh=' in L else 'U' }}
          high_water: "{{ states('sensor.ecco_fallback_generation_high_water') }}"
          summary: "{{ states('sensor.ecco_clock_dongle_ecco_fallback_profile_summary') }}"

      - name: "ECCO Fallback Status"
        unique_id: ecco_fallback_status
        icon: mdi:shield-check-outline
        # Pure lookup of sensor.ecco_fallback_status_code. FB-C3 adds the
        # Shadow Recovery word; the reserved FB-E/F (Applying / Applied /
        # Needs Acknowledgement) display words are deliberately NOT in this
        # table until those stages land.
        state: >-
          {%- set c = states('sensor.ecco_fallback_status_code') -%}
          {%- set words = {
            'not_reporting': 'Unknown', 'unexpected_state': 'Unknown', 'live_unknown': 'Unknown',
            'lease_unreadable': 'Blocked', 'lease_lockout': 'Blocked', 'lease_restoring': 'Blocked',
            'save_unconfirmed': 'Blocked', 'profile_regressed': 'Blocked', 'profile_unusable': 'Blocked',
            'live_out_of_domain': 'Blocked',
            'not_captured': 'Not Captured', 'invalidated': 'Invalidated',
            'drift_export': 'Drifted', 'drift_context': 'Drifted', 'drift_values': 'Drifted',
            'match': 'Ready', 'paused': 'Ready', 'shadow_episode': 'Shadow Recovery'} -%}
          {{ words.get(c, 'Unknown') }}
        attributes:
          code: "{{ states('sensor.ecco_fallback_status_code') }}"
          subline: >-
            {%- set c = states('sensor.ecco_fallback_status_code') -%}
            {%- set P = states('sensor.ecco_clock_dongle_ecco_fallback_profile_state') -%}
            {%- set L = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_live_match') ~ ';' -%}
            {%- set G = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_summary') ~ ';' -%}
            {%- set m = L.split(';m=')[1].split(';')[0] if ';m=' in L else 'UNKNOWN' -%}
            {%- set obl = (L.split(';obl=')[1].split(';')[0] if ';obl=' in L else '') ~ ',' -%}
            {%- set eh = L.split(';eh=')[1].split(';')[0] if ';eh=' in L else 'U' -%}
            {%- set ew = L.split(';ew=')[1].split(';')[0] if ';ew=' in L else '-' -%}
            {%- set dxh = L.split(';dx=')[1].split(';')[0] if ';dx=' in L else '-' -%}
            {%- set hwd = G.split(';hw=')[1].split(';')[0] if ';hw=' in G else '-' -%}
            {%- set names = {'FP': 'Free Power', 'DP': 'Dump to Grid', 'R4': 'The register 244 test', 'BUS': 'The inverter write lock'} -%}
            {%- set kinds = {'ON': 'needs your decision', 'PC': 'needs your decision', 'UR': 'recovery state unreadable', 'MC': 'recovery metadata corrupt', 'CT': 'recovery metadata corrupt', 'ML': 'recovery metadata corrupt', 'DV': 'stored state disagrees with memory', 'LK': 'inverter write lock stuck'} -%}
            {%- set ns = namespace(uf='', uk='', lf='', lk='', rf='', af='', dump=false, n=0) -%}
            {%- for e in obl.split(',') if ':' in e -%}
              {%- set d = e.split(':')[0] -%}
              {%- set k = e.split(':')[1] -%}
              {%- if d == 'DP' and k not in ['CM', 'CA', 'CN', 'CR'] -%}{%- set ns.dump = true -%}{%- endif -%}
              {%- if k in ['UR', 'MC', 'CT', 'ML'] -%}
                {%- if ns.uf == '' -%}{%- set ns.uf = d -%}{%- set ns.uk = k -%}{%- endif -%}
              {%- elif k in ['ON', 'DV', 'LK'] or e == 'R4:PC' -%}
                {%- if ns.lf == '' -%}{%- set ns.lf = d -%}{%- set ns.lk = k -%}{%- endif -%}
              {%- elif k in ['RR', 'PC', 'EN', 'IF'] -%}
                {%- if ns.rf == '' -%}{%- set ns.rf = d -%}{%- endif -%}
              {%- elif k in ['AC', 'ST'] -%}
                {%- if ns.af == '' -%}{%- set ns.af = d -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set dxv = (dxh | int(0, 16)) if dxh != '-' else 0 -%}
            {%- for i in range(0, 19) -%}
              {%- if ((dxv // (2 ** i)) % 2) == 1 -%}{%- set ns.n = ns.n + 1 -%}{%- endif -%}
            {%- endfor -%}
            {%- set hz = (' Export is currently ENABLED while ' ~ names.get(ns.uf or ns.lf or ns.rf, 'a temporary operation') ~ ' needs recovery.') if eh == '1' else ((' Export state unknown - check the inverter.') if (eh == 'U' and ns.dump) else '') -%}
            {%- if c == 'not_reporting' -%}The ECCO dongle is not reporting its Fallback Profile status.
            {%- elif c == 'unexpected_state' -%}Unrecognised Fallback Profile state '{{ P }}' - check that firmware and dashboard versions match.
            {%- elif c == 'lease_unreadable' -%}Do NOT restart the dongle: {{ names.get(ns.uf, 'a temporary operation') }} recovery state is unreadable - follow the recovery procedure.{{ hz }}
            {%- elif c == 'lease_lockout' -%}{{ names.get(ns.lf, 'A temporary operation') }} needs attention before the profile could be used ({{ kinds.get(ns.lk, 'needs your decision') }}).{{ hz }}
            {%- elif c == 'shadow_episode' -%}ECCO recorded a loss of Home Assistant supervision. Shadow mode: nothing was written.
            {%- elif c == 'save_unconfirmed' -%}The last save could not be confirmed. Restart the dongle when no temporary operation is active; saving stays disabled until then.
            {%- elif c == 'profile_regressed' -%}The saved profile appears to have been lost or rolled back. Lease records may also be affected - check Free Power and Dump status.
            {%- elif c == 'profile_unusable' -%}
              {%- if P == 'UNREADABLE' -%}The stored profile could not be read (storage read error). Saving is disabled until the dongle next restarts.
              {%- elif P == 'CORRUPT' -%}The stored profile is damaged and cannot be used. After a review it can be replaced with the Replace damaged profile action.
              {%- elif P == 'CORRUPT_DOMAIN' -%}The stored profile holds values outside the supported range and cannot be used. Review and save a new known-good profile.
              {%- elif P == 'PROFILE_LOST' -%}The saved profile (last known generation {{ hwd }}) is missing from storage. Review and save a new known-good profile.
              {%- else -%}Saved profile is out of step with its record - review and save again.
              {%- endif -%}
            {%- elif c == 'not_captured' -%}No known-good profile saved yet. Review your current configuration and save it.
            {%- elif c == 'invalidated' -%}The saved profile was invalidated and will not be used. Review and save a new known-good profile.
            {%- elif c == 'lease_restoring' -%}Waiting for {{ names.get(ns.rf, 'a temporary operation') }} to finish restoring.{{ hz }}
            {%- elif c == 'live_out_of_domain' -%}Current inverter settings are outside what Fallback V1 supports ({{ ew.split(',')[0].split('+')[0] }}). Saving and restoring are both unavailable.
            {%- elif c == 'drift_export' -%}Export mode is Allow Export; your saved profile uses Zero Export. This setting cannot be saved as a fallback - change it back in Manual Controls.
            {%- elif c == 'drift_context' -%}Slot times or context changed since the profile was saved. Review and save again, or put them back.
            {%- elif c == 'drift_values' -%}Live settings differ from the saved profile in {{ ns.n }} {{ 'place' if ns.n == 1 else 'places' }}. Review and save if the change was intended.
            {%- elif c == 'match' -%}Live inverter settings match the saved profile.
            {%- elif c == 'paused' -%}
              {%- if m == 'PAUSED_IO' -%}Comparison paused while an inverter write or bus operation is in progress.
              {%- else -%}{{ names.get(ns.af, 'A temporary operation') }} is running - a restore would first end it
              {%- endif -%}
            {%- elif c == 'live_unknown' -%}A known-good profile is saved, but the live comparison is unavailable (configuration data not fresh).
            {%- else -%}Fallback status not available.
            {%- endif -%}
          # Saved-profile decoders (jinja-tested; the dashboard only renders
          # these strings). B7 = saved slots + b=<8HEX>, B8 = saved context.
          saved_export_mode: >-
            {%- set S = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_slots') ~ ';' -%}
            {%- set v = S.split(';244=')[1].split(';')[0] if ';244=' in S else '-' -%}
            {%- if v == '0' -%}Allow Export
            {%- elif v == '1' -%}Essentials
            {%- elif v == '2' -%}Zero Export
            {%- elif v == '-' -%}-
            {%- else -%}unrecognised ({{ v }})
            {%- endif -%}
          saved_energy_mode: >-
            {%- set C = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_context') ~ ';' -%}
            {%- set v = C.split(';243=')[1].split(';')[0] if ';243=' in C else '-' -%}
            {%- if v == '0' -%}Battery First
            {%- elif v == '1' -%}Load First
            {%- elif v == '-' -%}-
            {%- else -%}unrecognised ({{ v }})
            {%- endif -%}
          saved_grid_charging: >-
            {%- set C = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_context') ~ ';' -%}
            {%- set v = C.split(';232=')[1].split(';')[0] if ';232=' in C else '-' -%}
            {%- if v == '-' -%}-
            {%- elif ((v | int(0, 16)) % 2) == 1 -%}on
            {%- else -%}off
            {%- endif -%}
          saved_tou_schedule: >-
            {%- set C = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_context') ~ ';' -%}
            {%- set v = C.split(';248=')[1].split(';')[0] if ';248=' in C else '-' -%}
            {%- if v == '-' -%}-
            {%- elif ((v | int(0, 16)) % 2) == 1 -%}on
            {%- else -%}off
            {%- endif -%}
          saved_sources: >-
            {%- set S = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_slots') ~ ';' -%}
            {%- set base = ['None', 'Grid', 'Generator', 'Grid + Generator'] -%}
            {%- set ns = namespace(out=[]) -%}
            {%- for n in range(1, 7) -%}
              {%- set t = S.split(';' ~ n ~ '=')[1].split(';')[0] if (';' ~ n ~ '=') in S else '-' -%}
              {%- set w = (t.split('/')[3] if t.split('/') | length == 4 else '-') -%}
              {%- if w == '-' or not w.isdigit() -%}{%- set ns.out = ns.out + ['-'] -%}
              {%- else -%}
                {%- set wv = w | int(0) -%}
                {%- if wv > 31 -%}{%- set ns.out = ns.out + [('raw 0x%04X' | format(wv))] -%}
                {%- else -%}
                  {%- set label = base[wv % 4] -%}
                  {%- if (wv // 4) % 2 == 1 -%}{%- set label = label ~ ' + General' -%}{%- endif -%}
                  {%- if (wv // 8) % 2 == 1 -%}{%- set label = label ~ ' + Backup' -%}{%- endif -%}
                  {%- if (wv // 16) % 2 == 1 -%}{%- set label = label ~ ' + Charge' -%}{%- endif -%}
                  {%- set ns.out = ns.out + [label] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.out | join(' | ') }}
          # Candidate (Review) decoders: the SAME tables as the saved-profile ones above, over the candidate's
          # B5 Review Slots (244 + the six slot tuples) and B6 Review Context (232 / 243 / 248). The dashboard
          # renders these strings; it never decodes a register word itself.
          candidate_export_mode: >-
            {%- set S = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review_slots') ~ ';' -%}
            {%- set v = S.split(';244=')[1].split(';')[0] if ';244=' in S else '-' -%}
            {%- if v == '0' -%}Allow Export
            {%- elif v == '1' -%}Essentials
            {%- elif v == '2' -%}Zero Export
            {%- elif v == '-' -%}-
            {%- else -%}unrecognised ({{ v }})
            {%- endif -%}
          candidate_energy_mode: >-
            {%- set C = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review_context') ~ ';' -%}
            {%- set v = C.split(';243=')[1].split(';')[0] if ';243=' in C else '-' -%}
            {%- if v == '0' -%}Battery First
            {%- elif v == '1' -%}Load First
            {%- elif v == '-' -%}-
            {%- else -%}unrecognised ({{ v }})
            {%- endif -%}
          candidate_grid_charging: >-
            {%- set C = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review_context') ~ ';' -%}
            {%- set v = C.split(';232=')[1].split(';')[0] if ';232=' in C else '-' -%}
            {%- if v == '-' -%}-
            {%- elif ((v | int(0, 16)) % 2) == 1 -%}on
            {%- else -%}off
            {%- endif -%}
          candidate_tou_schedule: >-
            {%- set C = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review_context') ~ ';' -%}
            {%- set v = C.split(';248=')[1].split(';')[0] if ';248=' in C else '-' -%}
            {%- if v == '-' -%}-
            {%- elif ((v | int(0, 16)) % 2) == 1 -%}on
            {%- else -%}off
            {%- endif -%}
          candidate_sources: >-
            {%- set S = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review_slots') ~ ';' -%}
            {%- set base = ['None', 'Grid', 'Generator', 'Grid + Generator'] -%}
            {%- set ns = namespace(out=[]) -%}
            {%- for n in range(1, 7) -%}
              {%- set t = S.split(';' ~ n ~ '=')[1].split(';')[0] if (';' ~ n ~ '=') in S else '-' -%}
              {%- set w = (t.split('/')[3] if t.split('/') | length == 4 else '-') -%}
              {%- if w == '-' or not w.isdigit() -%}{%- set ns.out = ns.out + ['-'] -%}
              {%- else -%}
                {%- set wv = w | int(0) -%}
                {%- if wv > 31 -%}{%- set ns.out = ns.out + [('raw 0x%04X' | format(wv))] -%}
                {%- else -%}
                  {%- set label = base[wv % 4] -%}
                  {%- if (wv // 4) % 2 == 1 -%}{%- set label = label ~ ' + General' -%}{%- endif -%}
                  {%- if (wv // 8) % 2 == 1 -%}{%- set label = label ~ ' + Backup' -%}{%- endif -%}
                  {%- if (wv // 16) % 2 == 1 -%}{%- set label = label ~ ' + Charge' -%}{%- endif -%}
                  {%- set ns.out = ns.out + [label] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.out | join(' | ') }}
          candidate_changed_cells: >-
            {%- set S = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review_slots') ~ ';' -%}
            {%- set dxh = S.split(';dx=')[1].split(';')[0] if ';dx=' in S else '-' -%}
            {%- set dxv = (dxh | int(0, 16)) if dxh != '-' else 0 -%}
            {%- set ns = namespace(cells=[]) -%}
            {%- if dxv % 2 == 1 -%}{%- set ns.cells = ns.cells + ['export_mode'] -%}{%- endif -%}
            {%- for i in range(0, 6) -%}
              {%- if ((dxv // (2 ** (1 + i))) % 2) == 1 -%}{%- set ns.cells = ns.cells + ['power' ~ (i + 1)] -%}{%- endif -%}
              {%- if ((dxv // (2 ** (7 + i))) % 2) == 1 -%}{%- set ns.cells = ns.cells + ['soc' ~ (i + 1)] -%}{%- endif -%}
              {%- if ((dxv // (2 ** (13 + i))) % 2) == 1 -%}{%- set ns.cells = ns.cells + ['source' ~ (i + 1)] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.cells }}
          # The generation the NEXT save will write, for DISPLAY ONLY (never a gate; the device decides). The device's rule is
          # max(authentic generation, witness high-water, RAM floor) + 1 (FINAL 3.9). It is shown only where the published
          # evidence makes it exact: NOT_CAPTURED (nothing stored at all) is generation 1; a VALID or INVALIDATED profile whose
          # witness is consistent (B2 w=OK) is max(g, hw) + 1. In every other state the number is not derivable and the
          # neutral wording is used instead of a fabricated one.
          next_generation: >-
            {%- set P = states('sensor.ecco_clock_dongle_ecco_fallback_profile_state') -%}
            {%- set G = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_summary') ~ ';' -%}
            {%- set g = G.split(';g=')[1].split(';')[0] if ';g=' in G else '-' -%}
            {%- set hw = G.split(';hw=')[1].split(';')[0] if ';hw=' in G else '-' -%}
            {%- set w = G.split(';w=')[1].split(';')[0] if ';w=' in G else '-' -%}
            {%- if P == 'NOT_CAPTURED' -%}1
            {%- elif P in ['VALID', 'INVALIDATED'] and w == 'OK' and g.isdigit() and hw.isdigit() and (g | int(0)) < 4294967295 and (hw | int(0)) < 4294967295 -%}{{ [g | int(0), hw | int(0)] | max + 1 }}
            {%- else -%}-
            {%- endif -%}
          next_generation_text: >-
            {%- set P = states('sensor.ecco_clock_dongle_ecco_fallback_profile_state') -%}
            {%- set G = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_summary') ~ ';' -%}
            {%- set g = G.split(';g=')[1].split(';')[0] if ';g=' in G else '-' -%}
            {%- set hw = G.split(';hw=')[1].split(';')[0] if ';hw=' in G else '-' -%}
            {%- set w = G.split(';w=')[1].split(';')[0] if ';w=' in G else '-' -%}
            {%- if P == 'NOT_CAPTURED' -%}Will save generation 1
            {%- elif P in ['VALID', 'INVALIDATED'] and w == 'OK' and g.isdigit() and hw.isdigit() and (g | int(0)) < 4294967295 and (hw | int(0)) < 4294967295 -%}Will save generation {{ [g | int(0), hw | int(0)] | max + 1 }}
            {%- else -%}Will save a new generation
            {%- endif -%}
          drift_count: >-
            {%- set L = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_live_match') ~ ';' -%}
            {%- set dxh = L.split(';dx=')[1].split(';')[0] if ';dx=' in L else '-' -%}
            {%- set cxh = L.split(';cx=')[1].split(';')[0] if ';cx=' in L else '-' -%}
            {%- set ns = namespace(n=0) -%}
            {%- for h, width in [(dxh, 19), (cxh, 9)] -%}
              {%- set v = (h | int(0, 16)) if h != '-' else 0 -%}
              {%- for i in range(0, width) -%}
                {%- if ((v // (2 ** i)) % 2) == 1 -%}{%- set ns.n = ns.n + 1 -%}{%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {{ ns.n }}
          drift_cells: >-
            {%- set L = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_live_match') ~ ';' -%}
            {%- set dxh = L.split(';dx=')[1].split(';')[0] if ';dx=' in L else '-' -%}
            {%- set cxh = L.split(';cx=')[1].split(';')[0] if ';cx=' in L else '-' -%}
            {%- set dxv = (dxh | int(0, 16)) if dxh != '-' else 0 -%}
            {%- set cxv = (cxh | int(0, 16)) if cxh != '-' else 0 -%}
            {%- set ns = namespace(cells=[]) -%}
            {%- if dxv % 2 == 1 -%}{%- set ns.cells = ns.cells + ['export_mode'] -%}{%- endif -%}
            {%- for i in range(0, 6) -%}
              {%- if ((dxv // (2 ** (1 + i))) % 2) == 1 -%}{%- set ns.cells = ns.cells + ['power' ~ (i + 1)] -%}{%- endif -%}
              {%- if ((dxv // (2 ** (7 + i))) % 2) == 1 -%}{%- set ns.cells = ns.cells + ['soc' ~ (i + 1)] -%}{%- endif -%}
              {%- if ((dxv // (2 ** (13 + i))) % 2) == 1 -%}{%- set ns.cells = ns.cells + ['source' ~ (i + 1)] -%}{%- endif -%}
              {%- if ((cxv // (2 ** (3 + i))) % 2) == 1 -%}{%- set ns.cells = ns.cells + ['time' ~ (i + 1)] -%}{%- endif -%}
            {%- endfor -%}
            {%- if cxv % 2 == 1 -%}{%- set ns.cells = ns.cells + ['grid_charging'] -%}{%- endif -%}
            {%- if (cxv // 2) % 2 == 1 -%}{%- set ns.cells = ns.cells + ['energy_mode'] -%}{%- endif -%}
            {%- if (cxv // 4) % 2 == 1 -%}{%- set ns.cells = ns.cells + ['tou_schedule'] -%}{%- endif -%}
            {{ ns.cells }}

      # ---- FB-C3 SHADOW CHECK (STAGED / NOT LIVE-PROVEN; DISPLAY ONLY) --------------------------------------------------
      # A pure DECODER of the five existing firmware strings ECCO Failback Shadow State / Episode / Soak / Verdict / Inputs
      # (FB-C1 / FB-C2). It is NOT a second evaluator: the Verdict and the plan codes are the C2 evaluator's own output (a plan
      # name / a plan code), only mapped to words here. Diagnostic only - a shadow verdict never changes the canonical Fallback
      # status (only an open shadow EPISODE does, in sensor.ecco_fallback_status_code). Shadow data is RAM-only on the dongle
      # (this boot); nothing here is persisted shadow history. No service call, no write, no automation.
      # Contract = FB-C2 as merged (PR #63, remediated d172574): the Verdict is the READINESS plan of one MODE_IF_LOST
      # evaluation per tick - outside an episode what a future automatic failback would do if Home Assistant were lost now,
      # inside an episode the continuation plan - or WOULD_REMAIN_LATCHED (code 50) while the modelled FB-F latch is set.
      # NO_ACTION / WOULD_REFUSE_STARTS are never published (they show as SHADOW_IDLE / SHADOW_WATCH on the State), so they
      # are not Verdict words here: like any other unpublished value they read "not recognised" and land in `unknown_keys`.
      # Plan-code fields decode only the codes C2 publishes in them (Inputs pl / alt / pa and Episode vu: the readiness
      # codes; Episode v0: those plus 50); any other code reads '-' and is listed verbatim in `unknown_keys`.
      # Grammars (actual C2): Episode id/ph/k/tr/u0/e0/cli/rb/v0/vu/f0/dm/pre/blk/d/ret/gap/rl/vch/cl/fbf, Inputs
      # sup/st/fp/dp/r4/mt/pc/g/pb/e1/cx/in/ca/d/blk/lk/pl/rs/alt/pa (alt / pa appended, FINAL 8.5), Soak
      # b/h/mx/lg/gm/lx/wr/nc/ncm/xh/cs. Keys outside those sets (append-only additions) are listed verbatim in
      # `unknown_keys`. No RTC / cross-boot breadcrumb fields exist (S3 FINAL).
      - name: "ECCO Shadow Check"
        unique_id: ecco_shadow_check
        icon: mdi:shield-search
        state: >-
          {%- set v = states('sensor.ecco_clock_dongle_ecco_failback_shadow_verdict') -%}
          {%- set i = ';' ~ states('sensor.ecco_clock_dongle_ecco_failback_shadow_inputs') ~ ';' -%}
          {%- set d = i.split(';d=')[1].split(';')[0] if ';d=' in i else '-' -%}
          {%- set w = {'NOT_EVALUATED': 'Shadow evaluator not ready yet', 'WOULD_PREEMPT_DUMP': 'Would end Dump to Grid, then continue failback', 'WOULD_PREEMPT_FREE_POWER': 'Would end Free Power, then continue failback', 'WAIT_DUMP_RESTORE': 'Would wait for Dump to Grid to put settings back', 'WAIT_FREE_POWER_RESTORE': 'Would wait for Free Power to put settings back', 'WAIT_WRITE_IN_FLIGHT': 'Would wait: another inverter write is running', 'WAIT_LIVE_DATA': 'Would wait: live inverter settings not current', 'WAIT_MANUAL_TOU_RECOVERY': 'Would wait for Manual TOU recovery to finish', 'BLOCKED_RECOVERY_METADATA': 'Would hold: saved lease records unreadable or corrupt', 'BLOCKED_DURABLE_UNKNOWN': 'Would hold: saved lease state not confirmed', 'BLOCKED_OPERATOR_NEEDED': 'Would hold: a lease needs your decision first', 'BLOCKED_PROFILE_CORRUPT': 'Would hold: saved profile is damaged', 'BLOCKED_PROFILE_UNAVAILABLE': 'Would hold: saved profile cannot be confirmed now', 'BLOCKED_SITE_CEILING': 'Would hold: profile power above site limit', 'BLOCKED_CONTEXT_MISMATCH': 'Would hold: schedule or context changed since save', 'BLOCKED_LIVE_OUT_OF_DOMAIN': 'Would hold: live settings outside profile range', 'BLOCKED_NO_PROFILE': 'No failback possible: no known-good profile saved', 'BLOCKED_PROFILE_INVALIDATED': 'No failback possible: profile was invalidated', 'WOULD_ALREADY_MATCH': 'Would do nothing: inverter already matches profile', 'WOULD_APPLY_PROFILE': 'Would apply known-good profile', 'WOULD_REMAIN_LATCHED': 'Would stay latched: previous episode not acknowledged'} -%}
          {%- if v == 'WOULD_APPLY_PROFILE' -%}Would apply known-good profile{{ (' (' ~ d ~ (' register)' if d == '1' else ' registers)')) if d.isdigit() else '' }}
          {%- elif v in w -%}{{ w[v] }}
          {%- elif v in ['unknown', 'unavailable', 'none', ''] -%}Shadow check not available
          {%- else -%}Shadow check result not recognised
          {%- endif -%}
        attributes:
          verdict: >-
            {{ states('sensor.ecco_clock_dongle_ecco_failback_shadow_verdict') }}
          shadow_state: >-
            {{ states('sensor.ecco_clock_dongle_ecco_failback_shadow_state') }}
          episode_open: >-
            {{ states('sensor.ecco_clock_dongle_ecco_failback_shadow_state') in ['SHADOW_EPISODE', 'SHADOW_EPISODE_HA_BACK'] }}
          status_masks_shadow: >-
            {%- set c = states('sensor.ecco_fallback_status_code') -%}
            {{ c not in ['shadow_episode', 'unknown', 'unavailable', ''] and states('sensor.ecco_clock_dongle_ecco_failback_shadow_state') in ['SHADOW_EPISODE', 'SHADOW_EPISODE_HA_BACK'] }}
          canonical_status_code: >-
            {{ states('sensor.ecco_fallback_status_code') }}
