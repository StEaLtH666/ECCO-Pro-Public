          # ---- BATTERY OUTLOOK — LEARNED 5-MINUTE LOAD MODEL ----
          - type: custom:button-card
            section_mode: true
            name: Battery Outlook
            icon: mdi:battery-clock
            show_name: true
            show_icon: true
            show_state: false
            tap_action:
              action: none
            custom_fields:
              body: >
                [[[
                  const read = (id) => {
                    const raw = states[id]?.state;
                    if (raw === undefined || ['unknown','unavailable','none',''].includes(String(raw).toLowerCase())) return null;
                    const v = Number(raw);
                    return Number.isFinite(v) ? v : null;
                  };
                  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
                  const fmt = (v,d=1) => v === null ? '--' : v.toFixed(d);
                  const signed = (v,d=1) => v === null ? '--' : `${v >= 0 ? '+' : ''}${v.toFixed(d)}`;
                  const targetTimeRaw = states['sensor.ecco_config_charge_start_time']?.state;
                  const targetTime = targetTimeRaw && !['unknown','unavailable','none',''].includes(String(targetTimeRaw).toLowerCase())
                    ? String(targetTimeRaw)
                    : '--:--';
                  const toMinute = (t) => {
                    const m = String(t).match(/^(\d{1,2}):(\d{2})$/);
                    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
                  };
                  const fmtMinute = (mins) => {
                    if (mins === null) return '--:--';
                    const m = ((mins % 1440) + 1440) % 1440;
                    return `${String(Math.floor(m / 60)).padStart(2,'0')}:${String(m % 60).padStart(2,'0')}`;
                  };
                  const targetMinute = toMinute(targetTime);
                  const scoreCheckpoint = targetMinute === null ? '--:--' : fmtMinute(targetMinute - 180);

                  const currentSoc = read('sensor.ecco_battery_soc') ?? read('sensor.ecco_clock_dongle_ecco_battery_soc');
                  const predictedSoc = read('sensor.ecco_predicted_soc_0035');
                  const loadRemaining = read('sensor.ecco_expected_load_to_0035');
                  const trainingDays = read('sensor.ecco_load_model_training_days');
                  const capacity = read('sensor.ecco_battery_model_capacity');
                  const efficiencyPct = read('sensor.ecco_battery_model_efficiency');
                  const scoredPrediction = read('sensor.ecco_battery_outlook_last_scored_prediction');
                  const scoredActual = read('sensor.ecco_battery_outlook_last_actual_soc');
                  const scoredError = read('sensor.ecco_battery_outlook_last_error');
                  const scoreMae7d = read('sensor.ecco_battery_outlook_7d_mae');
                  const scoreBias7d = read('sensor.ecco_battery_outlook_7d_bias');

                  if (predictedSoc === null || loadRemaining === null) {
                    return `<div style="padding:12px 14px;border-radius:12px;background:rgba(255,189,61,.06);border:1px solid rgba(255,189,61,.18);color:rgba(255,255,255,.70);font-size:12px;line-height:1.5;">
                      <b style="color:#ffbd3d;">Learned Battery Outlook is waiting for InfluxDB data.</b><br>
                      ECCO will update automatically once the 5-minute Battery Outlook task has produced a recent result.
                    </div>`;
                  }

                  let confidence = 'LOW';
                  let confidenceColour = '#ff7a7a';
                  if (trainingDays !== null && trainingDays >= 14) {
                    confidence = 'HIGH'; confidenceColour = '#55e58e';
                  } else if (trainingDays !== null && trainingDays >= 7) {
                    confidence = 'MEDIUM'; confidenceColour = '#ffbd3d';
                  }

                  const socDrop = currentSoc !== null ? Math.max(currentSoc - predictedSoc, 0) : null;
                  const reserveKwh = capacity !== null ? predictedSoc / 100 * capacity : null;
                  const progress = clamp(predictedSoc, 0, 100);
                  const outlookColour = predictedSoc < 20 ? '#ff6376' : predictedSoc < 35 ? '#ffbd3d' : '#55e58e';

                  const stat = (label,value,colour,sub='') => `
                    <div style="padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.065);text-align:center;">
                      <div style="font-size:10px;color:rgba(255,255,255,.48);font-weight:600;">${label}</div>
                      <div style="font-size:22px;font-weight:800;color:${colour};margin-top:2px;">${value}</div>
                      ${sub ? `<div style="font-size:9px;color:rgba(255,255,255,.42);margin-top:2px;">${sub}</div>` : ''}
                    </div>`;

                  return `<div>
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
                      <div>
                        <div style="font-size:11px;color:rgba(255,255,255,.50);">Load-only floor at next TOU charge start</div>
                        <div style="font-size:34px;line-height:1.05;font-weight:900;color:${outlookColour};margin-top:2px;">${fmt(predictedSoc,1)}%</div>
                        <div style="font-size:11px;color:rgba(255,255,255,.55);margin-top:4px;">Worst-case SOC floor at <b style="color:#fff;">${targetTime}</b></div>
                      </div>
                      <div style="padding:7px 11px;border-radius:999px;background:${confidenceColour}18;border:1px solid ${confidenceColour}55;color:${confidenceColour};font-size:11px;font-weight:900;white-space:nowrap;">
                        ${confidence} CONFIDENCE
                      </div>
                    </div>

                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-top:14px;">
                      ${stat(`Expected load to ${targetTime}`,`${fmt(loadRemaining,2)} kWh`,'#42aaff','learned 5-minute load profile')}
                      ${stat('Expected SOC drop',socDrop !== null ? `${fmt(socDrop,1)}%` : '--','#ffbd3d','of battery capacity')}
                      ${stat(`Reserve at ${targetTime}`,reserveKwh !== null ? `${fmt(reserveKwh,1)} kWh` : '--','#55e58e','using model capacity')}
                      ${stat('Training history',trainingDays !== null ? `${fmt(trainingDays,1)} d` : '--',confidenceColour,'equivalent complete days')}
                    </div>

                    ${scoredPrediction !== null && scoredActual !== null ? (() => {
                      const err = scoredError;
                      const absErr = err === null ? null : Math.abs(err);
                      const scoreColour = absErr === null ? '#8f7cff' : absErr <= 2 ? '#55e58e' : absErr <= 5 ? '#ffbd3d' : '#ff7a7a';
                      const scoreWord = err === null ? 'SCORED' : err > 0.25 ? 'CONSERVATIVE' : err < -0.25 ? 'OPTIMISTIC' : 'ON TARGET';
                      const biasWord = scoreBias7d === null ? '' : scoreBias7d > 0.25 ? 'conservative bias' : scoreBias7d < -0.25 ? 'optimistic bias' : 'near-zero bias';
                      return `<div style="margin-top:12px;padding:10px 11px;border-radius:12px;background:rgba(143,124,255,.045);border:1px solid rgba(143,124,255,.16);">
                        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px;">
                          <div style="font-size:10px;color:rgba(255,255,255,.50);font-weight:700;letter-spacing:.4px;">LAST PREDICTION SCORE</div>
                          <div style="padding:4px 8px;border-radius:999px;background:${scoreColour}16;border:1px solid ${scoreColour}55;color:${scoreColour};font-size:9px;font-weight:900;">${scoreWord}</div>
                        </div>
                        <div style="display:grid;grid-template-columns:1.5fr .8fr .8fr;gap:8px;align-items:stretch;">
                          <div style="padding:8px 9px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.055);">
                            <div style="font-size:9px;color:rgba(255,255,255,.45);">${scoreCheckpoint} prediction → ${targetTime} actual</div>
                            <div style="font-size:20px;font-weight:900;color:#fff;margin-top:2px;">${fmt(scoredPrediction,1)}% <span style="color:rgba(255,255,255,.35);">→</span> ${fmt(scoredActual,1)}%</div>
                            <div style="font-size:9px;color:${scoreColour};font-weight:800;margin-top:2px;">SOC error ${signed(err,1)}%</div>
                          </div>
                          <div style="padding:8px 9px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.055);text-align:center;">
                            <div style="font-size:9px;color:rgba(255,255,255,.45);">7-day SOC MAE</div>
                            <div style="font-size:18px;font-weight:900;color:#42aaff;margin-top:3px;">${scoreMae7d === null ? '--' : `${fmt(scoreMae7d,1)}%`}</div>
                            <div style="font-size:8px;color:rgba(255,255,255,.38);margin-top:2px;">average miss</div>
                          </div>
                          <div style="padding:8px 9px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.055);text-align:center;">
                            <div style="font-size:9px;color:rgba(255,255,255,.45);">7-day SOC bias</div>
                            <div style="font-size:18px;font-weight:900;color:#b8adff;margin-top:3px;">${scoreBias7d === null ? '--' : `${signed(scoreBias7d,1)}%`}</div>
                            <div style="font-size:8px;color:rgba(255,255,255,.38);margin-top:2px;">${biasWord || 'waiting for scores'}</div>
                          </div>
                        </div>
                      </div>`;
                    })() : ''}

                    <div style="margin-top:13px;">
                      <div style="display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.50);">
                        <span>Load-only SOC floor</span><span>${fmt(predictedSoc,1)}%</span>
                      </div>
                      <div style="height:10px;margin-top:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;">
                        <div style="height:100%;width:${progress}%;background:linear-gradient(90deg,#39d27a,#8f7cff);border-radius:999px;"></div>
                      </div>
                    </div>

                    <div style="margin-top:10px;padding:9px 11px;border-radius:10px;background:rgba(184,173,255,.035);border:1px solid rgba(184,173,255,.11);font-size:10px;line-height:1.5;color:rgba(255,255,255,.48);">
                      ECCO learns house demand by 5-minute time-of-day slot from InfluxDB and recalculates every 5 minutes. This v1 floor deliberately ignores future PV, so on a sunny day it will be pessimistic.
                      ${capacity !== null ? ` Model capacity <b style="color:#fff;">${fmt(capacity,1)} kWh</b>.` : ''}
                      ${efficiencyPct !== null ? ` Discharge efficiency allowance <b style="color:#fff;">${fmt(efficiencyPct,0)}%</b>.` : ''}
                      Confidence automatically rises after 7 and 14 equivalent training days. The next model step is time-aware PV so this becomes a true expected SOC rather than a load-only floor.
                    </div>
                  </div>`;
                ]]]
            styles:
              card:
                - border-radius: 20px
                - padding: 16px 18px
                - background: linear-gradient(145deg, rgba(20,28,45,0.98), rgba(10,15,27,0.98))
                - border: 1px solid rgba(255,255,255,0.08)
                - box-shadow: 0 12px 32px rgba(0,0,0,0.22)
              grid:
                - grid-template-areas: '"i n" "body body"'
                - grid-template-columns: 32px 1fr
                - grid-template-rows: min-content 1fr
                - row-gap: 12px
              icon:
                - width: 24px
                - color: '#55e58e'
              name:
                - justify-self: start
                - font-size: 20px
                - font-weight: 700
                - color: rgba(255,255,255,0.92)
              custom_fields:
                body:
                  - width: 100%
                  - white-space: normal
                  - overflow: visible
                  - text-overflow: unset
                  - word-break: normal
                  - line-height: 1.45
            grid_options:
              columns: 16
              rows: 8

          # ---- REMAINING ENERGY BALANCE ----
          - type: custom:button-card
            section_mode: true
            name: Rest of Today
            icon: mdi:scale-balance
            show_name: true
            show_icon: true
            show_state: false
            tap_action:
              action: none
            custom_fields:
              body: >
                [[[
                  const n=(id)=>Number(states[id]?.state??0);
                  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
                  const loadToday=n('sensor.ecco_clock_dongle_ecco_day_load_energy');
                  const loadW=n('sensor.ecco_clock_dongle_ecco_load_power');
                  const pvW=n('sensor.ecco_clock_dongle_ecco_pv_power');
                  const actualPV=n('sensor.ecco_clock_dongle_ecco_day_pv_energy');
                  const soc=n('sensor.ecco_clock_dongle_ecco_battery_soc');
                  const capAh=n('sensor.ecco_clock_dongle_ecco_battery_capacity_ah')||620;
                  const capKwh=capAh*51.2/1000;

                  const sensors=Object.values(states).filter(s=>s.entity_id.startsWith('sensor.'));
                  const friendly=(s)=>String(s?.attributes?.friendly_name??s?.entity_id??'').toLowerCase();
                  const find=(need,exclude=[])=>sensors.find(s=>{
                    const x=friendly(s);return need.every(v=>x.includes(v))&&!exclude.some(v=>x.includes(v));
                  });
                  const num=(s)=>{const v=Number(s?.state);return Number.isFinite(v)?v:null;};

                  const forecast=num(states['sensor.ecco_solar_forecast_today']);
                  const remaining=num(states['sensor.ecco_solar_forecast_remaining']);
                  const forecastNow=num(states['sensor.ecco_solar_forecast_power_now']);

                  let ratio=1;
                  if(forecastNow!==null&&forecastNow>=250)ratio=clamp(pvW/forecastNow,.15,1.5);
                  let factor=forecastNow!==null&&forecastNow>=250?clamp(.65+.35*ratio,.70,1.10):1;
                  const expectedSoFar=forecast!==null&&remaining!==null?Math.max(forecast-remaining,0):0;
                  if(expectedSoFar>=2&&actualPV>=.5){
                    const dailyRatio=clamp(actualPV/expectedSoFar,.35,1.35);
                    factor=clamp(factor*.60+dailyRatio*.40,.65,1.10);
                  }

                  const now=new Date();
                  const elapsed=Math.max(now.getHours()+now.getMinutes()/60,1);
                  const hoursLeft=Math.max(24-elapsed,0);
                  const avgKw=loadToday/elapsed;
                  const liveKw=loadW/1000;
                  const runKw=clamp(avgKw*.65+liveKw*.35,.15,5);
                  const loadRemaining=runKw*hoursLeft;
                  const usefulSolar=remaining!==null?remaining*factor*.95:null;
                  const conservative=remaining!==null?remaining*Math.max(.60,factor-.15)*.95:null;
                  const balance=usefulSolar!==null?usefulSolar-loadRemaining:null;
                  const conservativeBalance=conservative!==null?conservative-loadRemaining:null;

                  const currentBattery=soc/100*capKwh;
                  const reserveTarget=capKwh*.10;
                  const likelyGrid=balance!==null?Math.max(0,reserveTarget-(currentBattery+balance)):null;
                  const consGrid=conservativeBalance!==null?Math.max(0,reserveTarget-(currentBattery+conservativeBalance)):null;

                  const colour=balance===null?'#7ab8ff':(balance>=0?'#55e58e':'#ffbd3d');
                  const headline=balance===null?'Waiting for solar forecast'
                    : conservativeBalance>=0?'Forecast comfortably covers remaining load'
                    : balance>=0?'Likely covered • conservative case uses battery'
                    :'Battery expected to cover forecast shortfall';

                  const metric=(k,v,c)=>`<div style="display:flex;justify-content:space-between;align-items:center;
                    padding:8px 0;border-bottom:1px solid rgba(255,255,255,.055);">
                    <span style="font-size:11px;color:rgba(255,255,255,.55);">${k}</span>
                    <b style="font-size:13px;color:${c};">${v}</b>
                  </div>`;

                  return `<div>
                    <div style="font-size:15px;font-weight:800;color:${colour};margin-top:2px;">${headline}</div>
                    <div style="margin-top:10px;">
                      ${metric('Estimated house use left',`${loadRemaining.toFixed(1)} kWh`,'#42aaff')}
                      ${metric('Adaptive solar still expected',usefulSolar!==null?`${usefulSolar.toFixed(1)} kWh`:'--','#ffbd3d')}
                      ${metric('Likely energy balance',balance!==null?`${balance>=0?'+':''}${balance.toFixed(1)} kWh`:'--',colour)}
                      ${metric('Conservative balance',conservativeBalance!==null?`${conservativeBalance>=0?'+':''}${conservativeBalance.toFixed(1)} kWh`:'--',conservativeBalance>=0?'#55e58e':'#ffbd3d')}
                      ${metric('Likely / conservative grid need',likelyGrid!==null?`${likelyGrid.toFixed(1)} / ${consGrid.toFixed(1)} kWh`:'--',consGrid>0?'#ff6376':'#55e58e')}
                    </div>
                    <div style="margin-top:9px;font-size:10px;color:rgba(255,255,255,.42);">
                      Solar forecast is corrected by live performance before the balance is calculated.
                    </div>
                  </div>`;
                ]]]
            styles:
              card:
                - border-radius: 20px
                - padding: 16px 18px
                - background: linear-gradient(145deg, rgba(20,28,45,0.98), rgba(10,15,27,0.98))
                - border: 1px solid rgba(255,255,255,0.08)
                - box-shadow: 0 12px 32px rgba(0,0,0,0.22)
              grid:
                - grid-template-areas: '"i n" "body body"'
                - grid-template-columns: 32px 1fr
                - grid-template-rows: min-content 1fr
                - row-gap: 12px
              icon:
                - width: 24px
                - color: '#7ab8ff'
              name:
                - justify-self: start
                - font-size: 20px
                - font-weight: 700
                - color: rgba(255,255,255,0.92)
              custom_fields:
                body:
                  - width: 100%
                  - white-space: normal
                  - overflow: visible
                  - text-overflow: unset
                  - word-break: normal
                  - line-height: 1.45
            grid_options:
              columns: 16
              rows: 8


          # ---- FORECAST LEARNING ----
          - type: custom:button-card
            section_mode: true
            name: Forecast Learning
            icon: mdi:chart-timeline-variant-shimmer
            show_name: true
            show_icon: true
            show_state: false
            tap_action:
              action: none
            custom_fields:
              body: >
                [[[
                  const num = (id) => {
                    const v = Number(states[id]?.state);
                    return Number.isFinite(v) ? v : null;
                  };
                  const fmt = (v,d=1) => v === null ? '--' : v.toFixed(d);
                  const snapshotValid = states['input_boolean.ecco_forecast_snapshot_valid']?.state === 'on';
                  const scoreValid = states['input_boolean.ecco_forecast_score_valid']?.state === 'on';
                  const forecastDate = states['input_datetime.ecco_forecast_snapshot_for_date']?.state ?? '--';
                  const scoredDate = states['input_datetime.ecco_forecast_last_scored_date']?.state ?? '--';

                  const fs = num('sensor.ecco_forecast_snapshot_forecast_solar');
                  const sc = num('sensor.ecco_forecast_snapshot_solcast');
                  const blend = num('sensor.ecco_forecast_snapshot_blend');
                  const actual = num('sensor.ecco_forecast_score_actual_pv');

                  const fsErr = num('sensor.ecco_forecast_solar_error');
                  const scErr = num('sensor.ecco_solcast_error');
                  const blendErr = num('sensor.ecco_blend_error');

                  const pct = (id) => {
                    const v = Number(states[id]?.attributes?.error_percent);
                    return Number.isFinite(v) ? v : null;
                  };
                  const fsPct = pct('sensor.ecco_forecast_solar_error');
                  const scPct = pct('sensor.ecco_solcast_error');
                  const blendPct = pct('sensor.ecco_blend_error');

                  const learnedDays = num('sensor.ecco_forecast_learning_days') ?? 0;
                  const fsMae = num('sensor.ecco_forecast_solar_mae');
                  const scMae = num('sensor.ecco_solcast_mae');
                  const blendMae = num('sensor.ecco_blend_mae');
                  const bestSource = states['sensor.ecco_forecast_best_source']?.state ?? 'Awaiting data';

                  const snapBox = (label,value,colour,sub) => `
                    <div style="padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);text-align:center;">
                      <div style="font-size:10px;color:rgba(255,255,255,.50);font-weight:600;">${label}</div>
                      <div style="font-size:22px;font-weight:800;color:${colour};margin-top:2px;">${fmt(value)} <span style="font-size:11px;">kWh</span></div>
                      <div style="font-size:10px;color:rgba(255,255,255,.45);margin-top:2px;">${sub}</div>
                    </div>`;

                  const errColour = (v) => v === null ? '#7ab8ff' : Math.abs(v) <= 5 ? '#55e58e' : Math.abs(v) <= 12 ? '#ffbd3d' : '#ff7a7a';
                  const errText = (kwh,p) => {
                    if (kwh === null || p === null) return '--';
                    const sign = kwh > 0 ? '+' : '';
                    const psign = p > 0 ? '+' : '';
                    return `${sign}${kwh.toFixed(1)} kWh / ${psign}${p.toFixed(1)}%`;
                  };

                  let score = `
                    <div style="padding:10px 12px;border-radius:12px;background:rgba(122,184,255,.05);border:1px solid rgba(122,184,255,.15);color:rgba(255,255,255,.64);font-size:11px;line-height:1.55;">
                      <b style="color:#7ab8ff;">Awaiting first completed forecast day.</b>
                      ECCO will score Forecast.Solar, Solcast and the 50/50 blend against actual PV at 23:50.
                    </div>`;

                  if (scoreValid) {
                    const entries = [
                      ['Forecast.Solar', fsErr, fsPct, '#7ab8ff'],
                      ['Solcast', scErr, scPct, '#b8adff'],
                      ['ECCO blend', blendErr, blendPct, '#ffbd3d']
                    ];
                    const valid = entries.filter(x => x[2] !== null);
                    let winner = null;
                    if (valid.length) winner = valid.reduce((a,b) => Math.abs(b[2]) < Math.abs(a[2]) ? b : a);
                    score = `
                      <div style="display:grid;grid-template-columns:170px repeat(3,minmax(0,1fr));gap:8px;align-items:stretch;">
                        <div style="padding:10px 12px;border-radius:12px;background:rgba(85,229,142,.045);border:1px solid rgba(85,229,142,.14);">
                          <div style="font-size:10px;color:rgba(255,255,255,.48);">Last scored day</div>
                          <div style="font-size:14px;font-weight:800;color:#fff;margin-top:2px;">${scoredDate}</div>
                          <div style="font-size:11px;color:rgba(255,255,255,.58);margin-top:4px;">Actual PV <b style="color:#55e58e;">${fmt(actual)} kWh</b></div>
                          ${winner ? `<div style="font-size:10px;color:#55e58e;margin-top:4px;">Best: <b>${winner[0]}</b></div>` : ''}
                        </div>
                        ${entries.map(([label,kwh,p,c]) => `
                          <div style="padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.065);text-align:center;">
                            <div style="font-size:10px;color:rgba(255,255,255,.50);">${label} error</div>
                            <div style="font-size:15px;font-weight:800;color:${errColour(p)};margin-top:4px;">${errText(kwh,p)}</div>
                          </div>`).join('')}
                      </div>`;
                  }

                  let learning = `
                    <div style="margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(184,173,255,.045);border:1px solid rgba(184,173,255,.13);font-size:11px;color:rgba(255,255,255,.58);">
                      <b style="color:#b8adff;">Long-term accuracy:</b> waiting for the first completed scored day.
                    </div>`;

                  if (learnedDays > 0) {
                    const learnBox = (label,value,colour,sub) => `
                      <div style="padding:9px 10px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.065);text-align:center;">
                        <div style="font-size:9px;color:rgba(255,255,255,.48);">${label}</div>
                        <div style="font-size:17px;font-weight:800;color:${colour};margin-top:2px;">${value}</div>
                        <div style="font-size:9px;color:rgba(255,255,255,.40);margin-top:2px;">${sub}</div>
                      </div>`;
                    learning = `
                      <div style="margin-top:10px;">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                          <div style="font-size:10px;color:rgba(255,255,255,.50);">Cumulative forecast accuracy</div>
                          <div style="font-size:10px;color:#55e58e;">Best so far: <b>${bestSource}</b></div>
                        </div>
                        <div style="display:grid;grid-template-columns:120px repeat(3,minmax(0,1fr));gap:8px;">
                          ${learnBox('Completed days',`${Math.round(learnedDays)}`,'#55e58e','scored next-day forecasts')}
                          ${learnBox('Forecast.Solar MAE',fsMae!==null?`${fsMae.toFixed(2)} kWh`:'--','#7ab8ff','mean absolute error')}
                          ${learnBox('Solcast MAE',scMae!==null?`${scMae.toFixed(2)} kWh`:'--','#b8adff','mean absolute error')}
                          ${learnBox('ECCO blend MAE',blendMae!==null?`${blendMae.toFixed(2)} kWh`:'--','#ffbd3d','mean absolute error')}
                        </div>
                      </div>`;
                  }

                  return `<div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;">
                      <div style="font-size:11px;color:rgba(255,255,255,.58);">
                        Next-day snapshot for <b style="color:#fff;">${forecastDate}</b>
                      </div>
                      <div style="font-size:10px;font-weight:700;color:${snapshotValid ? '#55e58e' : '#ff7a7a'};">
                        ${snapshotValid ? '● Snapshot stored' : '● No valid snapshot'}
                      </div>
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;">
                      ${snapBox('Forecast.Solar', fs, '#7ab8ff', 'frozen evening forecast')}
                      ${snapBox('Solcast', sc, '#b8adff', 'frozen evening forecast')}
                      ${snapBox('ECCO 50/50', blend, '#ffbd3d', 'dashboard / learning blend')}
                    </div>
                    <div style="margin-top:10px;">${score}</div>
                    ${learning}
                  </div>`;
                ]]]
            styles:
              card:
                - border-radius: 20px
                - padding: 16px 18px
                - background: linear-gradient(145deg, rgba(20,28,45,0.98), rgba(10,15,27,0.98))
                - border: 1px solid rgba(255,255,255,0.08)
