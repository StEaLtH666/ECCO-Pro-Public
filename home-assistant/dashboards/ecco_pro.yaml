              - entity: sensor.ecco_clock_dongle_ecco_battery_soc
                name: Import
                unit: p/kWh
                float_precision: 2
                type: line
                color: '#7ab8ff'
                stroke_width: 3
                show:
                  in_header: false
                data_generator: |
                  const friendly=(s)=>String(s?.attributes?.friendly_name??s?.entity_id??'').toLowerCase();
                  const ev=Object.values(hass.states).filter(s=>s.entity_id.startsWith('event.') &&
                    s.entity_id.includes('octopus_energy_electricity') &&
                    s.entity_id.includes('current_day_rates') &&
                    !(s.entity_id.includes('export')||friendly(s).includes('export')))[0];
                  let rates=Array.isArray(ev?.attributes?.rates)?ev.attributes.rates:[];
                  let out=rates.map(r=>[new Date(r.start).getTime(),Number(r.value_inc_vat)*100])
                    .filter(x=>Number.isFinite(x[1]));
                  if(rates.length){
                    const last=rates[rates.length-1];
                    out.push([new Date(last.end).getTime(),Number(last.value_inc_vat)*100]);
                  }
                  return out;
              - entity: sensor.ecco_clock_dongle_ecco_battery_soc
                name: Export
                unit: p/kWh
                float_precision: 2
                type: line
                color: '#ffbd3d'
                stroke_width: 3
                show:
                  in_header: false
                data_generator: |
                  const friendly=(s)=>String(s?.attributes?.friendly_name??s?.entity_id??'').toLowerCase();
                  const events=Object.values(hass.states).filter(s=>s.entity_id.startsWith('event.') &&
                    s.entity_id.includes('octopus_energy_electricity') &&
                    s.entity_id.includes('current_day_rates') &&
                    (s.entity_id.includes('export')||friendly(s).includes('export')));
                  const ev=events[0];
                  let rates=Array.isArray(ev?.attributes?.rates)?ev.attributes.rates:[];
                  if(rates.length){
                    let out=rates.map(r=>[new Date(r.start).getTime(),Number(r.value_inc_vat)*100])
                      .filter(x=>Number.isFinite(x[1]));
                    const last=rates[rates.length-1];
                    out.push([new Date(last.end).getTime(),Number(last.value_inc_vat)*100]);
                    return out;
                  }
                  const sensors=Object.values(hass.states).filter(s=>s.entity_id.startsWith('sensor.') &&
                    s.entity_id.includes('octopus_energy_electricity') && s.entity_id.includes('current_rate') &&
                    (s.entity_id.includes('export')||friendly(s).includes('export')));
                  const v=Number(sensors[0]?.state)*100;
                  if(!Number.isFinite(v)) return [];
                  return [[start.getTime(),v],[end.getTime(),v]];
            now:
              show: true
              color: '#6d7b91'
              label: Now
            apex_config:
              chart:
                height: 245
                toolbar:
                  show: false
              stroke:
                curve: stepline
              grid:
                borderColor: rgba(255,255,255,0.08)
              legend:
                show: true
                position: top
                horizontalAlign: left
              tooltip:
                shared: true
                intersect: false
            card_mod:
              style: |
                :host {
                  background: transparent !important;
                  background-color: transparent !important;
