              {% if src in ['Generator', 'Grid + Generator'] %}{% set ns.notes = ns.notes + ['Note: staged Slot ' ~ n ~ ' (charge source ' ~ src ~ ') is outside what Fallback V1 can save or restore.'] %}{% endif %}
