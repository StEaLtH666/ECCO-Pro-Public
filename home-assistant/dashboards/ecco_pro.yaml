            content: |
              **TOU voltage baselines**

              | Slot | Voltage |
              |:---:|---:|
              | **1** | {{ states('sensor.ecco_clock_dongle_ecco_timezone1_voltage')|float(0)|round(1) }} V |
              | **2** | {{ states('sensor.ecco_clock_dongle_ecco_timezone2_voltage')|float(0)|round(1) }} V |
              | **3** | {{ states('sensor.ecco_clock_dongle_ecco_timezone3_voltage')|float(0)|round(1) }} V |
              | **4** | {{ states('sensor.ecco_clock_dongle_ecco_timezone4_voltage')|float(0)|round(1) }} V |
              | **5** | {{ states('sensor.ecco_clock_dongle_ecco_timezone5_voltage')|float(0)|round(1) }} V |
              | **6** | {{ states('sensor.ecco_clock_dongle_ecco_timezone6_voltage')|float(0)|round(1) }} V |

              ℹ️ These are the inverter's stored voltage-mode baselines. ECCO currently uses the SOC targets for the live lithium/capacity TOU schedule; the voltage values are retained for diagnostics/reference.
            card_mod: *ecco_card_mod
  - title: Fallback / Recovery
    path: ecco-fallback-recovery
    icon: mdi:shield-refresh-outline
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      # ================= FALLBACK / RECOVERY (FB-B2: guarded Save / Invalidate) =================
      # One dedicated custom card renders the whole tab (frontend/ecco-fallback-recovery-card,
      # registered as a manual Lovelace resource). Besides the Review button it can switch the arm
      # below on and off and make one deliberate request to the dongle, ONLY from a user click on
      # the card with the ID shown on screen; no automation or script does any of that, and there
      # is no restore control. The three other write arms are listed read-only (the dongle refuses
      # a save while one is on). Every entity id comes from this config block.
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Fallback / Recovery
            heading_style: title
            icon: mdi:shield-refresh-outline
            badges:
              - type: entity
                entity: binary_sensor.ecco_clock_dongle_ecco_supervision_stable
                name: Supervision
                show_state: true
                color: green
              - type: entity
                entity: binary_sensor.ecco_clock_dongle_ntp_synced
                name: NTP
                show_state: true
                color: blue
              - type: entity
                entity: binary_sensor.ecco_clock_dongle_manual_write_in_progress
                name: Write lock
                show_state: true
                color: amber
            grid_options:
              columns: 48
              rows: auto
          - type: custom:ecco-fallback-recovery-card
            show_header: false
            entities:
              profile_state: sensor.ecco_clock_dongle_ecco_fallback_profile_state
              summary: sensor.ecco_clock_dongle_ecco_fallback_profile_summary
              review: sensor.ecco_clock_dongle_ecco_fallback_profile_review
              review_id: sensor.ecco_clock_dongle_ecco_fallback_profile_review_id
              review_slots: sensor.ecco_clock_dongle_ecco_fallback_profile_review_slots
              review_context: sensor.ecco_clock_dongle_ecco_fallback_profile_review_context
              saved_slots: sensor.ecco_clock_dongle_ecco_fallback_profile_slots
              saved_context: sensor.ecco_clock_dongle_ecco_fallback_profile_context
              last_result: sensor.ecco_clock_dongle_ecco_fallback_profile_last_action_result
              review_button: button.ecco_clock_dongle_ecco_fallback_profile_review_current_configuration
              supervision_stable: binary_sensor.ecco_clock_dongle_ecco_supervision_stable
              supervision_state: sensor.ecco_clock_dongle_ecco_supervision_state
              ntp_synced: binary_sensor.ecco_clock_dongle_ntp_synced
              write_lock: binary_sensor.ecco_clock_dongle_manual_write_in_progress
              configuration_online: binary_sensor.ecco_clock_dongle_configuration_online
              arm: switch.ecco_clock_dongle_ecco_fallback_profile_arm
              free_power_arm: switch.ecco_clock_dongle_free_power_write_enable
              dump_arm: switch.ecco_clock_dongle_dump_to_grid_write_enable
              manual_arm: switch.ecco_clock_dongle_manual_configuration_write_enable
            grid_options:
              columns: 48
              rows: auto
  - title: Safety
    path: ecco-safety
    icon: mdi:shield-home-outline
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      # ================= SAFETY (FB-B3: supervision + Known-Good Profile) =================
      # Display + operator surface for the Fallback Profile. Everything shown here is a template
      # over firmware entities (B1-B10) and the display layer in ecco_fallback_status.yaml; the
      # safety decoders (244 / 243 / source / 232 / 248, drift cells) are template ATTRIBUTES of
      # sensor.ecco_fallback_status, not dashboard logic. There are no HA saved-view copy sensors.
      # Home Assistant is NOT a control authority: the only writes reachable from this page are
      # (a) the firmware Review button (zero-write), (b) the Arm switch, toggled by a HUMAN tap
      # (it turns itself off after 2 minutes), and (c) the three operator scripts, each behind a
      # confirmation dialog and visible only while the matching *_available sensor is on. The
      # firmware re-validates arm, id, phrase, TTL and every precondition. No automation or
      # script turns the arm on. There is no restore control and no shadow-evaluator control.
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Safety
            heading_style: title
            icon: mdi:shield-home-outline
            badges:
              - type: entity
                entity: sensor.ecco_supervision_status
                name: Supervision
                show_state: true
                color: green
              - type: entity
                entity: sensor.ecco_fallback_status
                name: Fallback
                show_state: true
                color: blue
              - type: entity
                entity: binary_sensor.ecco_clock_dongle_ntp_synced
                name: NTP
                show_state: true
                color: blue
            grid_options:
              columns: 48
              rows: auto

          # ---- FB-C3 SHADOW EPISODE BANNER (DISPLAY ONLY; shown while a shadow episode is open) ----
          # Everything is a template ATTRIBUTE of sensor.ecco_shadow_check (a decoder of the five existing dongle shadow
          # strings); nothing here is decoded in the dashboard and nothing writes. It is shown whenever a shadow episode is
          # open, also when a recovery state (lease unreadable / lockout) keeps the canonical Fallback status: it is then shown
          # alongside, never in place of, that state.
          - type: markdown
            visibility:
              - condition: state
                entity: binary_sensor.ecco_shadow_episode_open
                state: 'on'
            grid_options:
              columns: 48
              rows: auto
            content: |
              {% set ep = state_attr('sensor.ecco_shadow_check', 'episode') or {} %}
              ### SHADOW CHECK - HOME ASSISTANT SUPERVISION WAS LOST

              **SHADOW mode: NOTHING WAS WRITTEN.** {{ ep.get('banner_lost', 'Home Assistant supervision was lost.') }}

              {{ ep.get('banner_would', 'If automatic failback were enabled it would have: nothing recorded.') }}

              {{ ep.get('banner_edge', '') }}
              {% if ep.get('banner_details') %}
              {{ ep.get('banner_details') }}
              {% endif %}
              Closes automatically after 5 minutes of continuous stable supervision.
              {% if state_attr('sensor.ecco_shadow_check', 'status_masks_shadow') %}

              The Fallback status above stays on **{{ state_attr('sensor.ecco_shadow_check', 'canonical_status') }}**, which takes priority over a shadow episode; this shadow information is shown alongside it.
              {% else %}

              While this episode is open the status above shows Shadow Recovery, so saved-profile warnings (drifted, lost or rolled back) are not shown there until it closes.
              {% endif %}
            card_mod: *ecco_card_mod

          # ---- 1. SUPERVISION ----
          - type: markdown
            grid_options:
              columns: 48
              rows: auto
            content: |
              {% set d = states('sensor.ecco_supervision_status') %}
              ### Home Assistant supervision: {{ d | upper }}

              {{ state_attr('sensor.ecco_supervision_status', 'subline') }}

              Stable: **{{ 'yes' if is_state('binary_sensor.ecco_clock_dongle_ecco_supervision_stable', 'on') else 'no' }}** ·
              API client connected: **{{ 'yes' if is_state('binary_sensor.ecco_clock_dongle_ecco_api_client_connected', 'on') else 'no' }}** ·
              longest gap **{{ states('sensor.ecco_clock_dongle_ecco_supervision_longest_gap') }}**
            card_mod: *ecco_card_mod

          # ---- FB-C3 SHADOW CHECK LINE (everyday; DISPLAY ONLY; S5 6.4: the operator wording of the C2 Verdict, which is the
          # READINESS plan - "if Home Assistant were lost now" outside an episode, the continuation plan inside one) ----
          - type: markdown
            grid_options:
              columns: 48
              rows: auto
            content: |
              {% set s = states('sensor.ecco_shadow_check') %}
              {% set h = state_attr('sensor.ecco_shadow_check', 'verdict_heading') %}
              **SHADOW CHECK · NO ACTION TAKEN**{{ ' — ' ~ h if h else '' }}

              {{ 'Shadow check not available' if s in ['unknown', 'unavailable', ''] else s }}
            card_mod: *ecco_card_mod

          # ---- 2. GENERATION HIGH-WATER WARNING (shown only when regressed) ----
          - type: markdown
            visibility:
              - condition: state
                entity: sensor.ecco_fallback_status_code
                state: profile_regressed
            grid_options:
              columns: 48
              rows: auto
            content: |
              ### ⚠ Saved profile may have been lost or rolled back

              The dongle reports a lower profile generation than Home Assistant has seen
              (**generation {{ states('sensor.ecco_clock_dongle_ecco_fallback_profile_summary').split(';')[0] | replace('g=', '') }}**
              on the dongle, highest seen **{{ states('sensor.ecco_fallback_generation_high_water') }}**).
              Lease records may also be affected - check Free Power and Dump to Grid status first.
              This is a detection warning only; it never blocks anything. Review your configuration and
              save again, or investigate before resetting the detection history (see Technical detail).
            card_mod: *ecco_card_mod

          # ---- 3. KNOWN-GOOD PROFILE (everyday form) ----
          - type: markdown
            grid_options:
              columns: 48
              rows: auto
            content: |
              {% set B2 = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_summary') ~ ';' %}
              {% set g = B2.split(';g=')[1].split(';')[0] if ';g=' in B2 else '-' %}
              {% set bid = B2.split(';id=')[1].split(';')[0] if ';id=' in B2 else '-' %}
              {% set at = B2.split(';at=')[1].split(';')[0] if ';at=' in B2 else '-' %}
              {% set S = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_slots') ~ ';' %}
              {% set C = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_context') ~ ';' %}
              {% set cells = state_attr('sensor.ecco_fallback_status', 'drift_cells') or [] %}
              {% set srcs = (state_attr('sensor.ecco_fallback_status', 'saved_sources') or '').split(' | ') %}
              ### Known-Good Profile: {{ states('sensor.ecco_fallback_status') | upper }}

              {{ state_attr('sensor.ecco_fallback_status', 'subline') }}

              {% if g == '-' %}**No profile saved yet.**
              {% else %}Saved **{{ 'capture time unknown' if at == '0' else (at | int(0) | timestamp_custom('%d %b %Y %H:%M')) }}** · generation **{{ g }}** · ID **{{ bid[:8] }}**
              {% endif %}
              {% if ';v=SAVED;' in S or S.startswith(';v=SAVED;') %}
              | Slot | Time | Power | Target SOC | Source |
              |:---|:---|---:|---:|:---|
              {% for n in range(1, 7) -%}
              {% set t = S.split(';' ~ n ~ '=')[1].split(';')[0] if (';' ~ n ~ '=') in S else '-' -%}
              {% set f = t.split('/') -%}
              {% set nx = S.split(';' ~ (1 if n == 6 else n + 1) ~ '=')[1].split(';')[0].split('/')[0] if (';' ~ (1 if n == 6 else n + 1) ~ '=') in S else '----' -%}
              {% if f | length == 4 -%}
              | {{ n }} | {{ f[0][:2] }}:{{ f[0][2:] }}-{{ nx[:2] }}:{{ nx[2:] }}{{ ' ◀ now ' ~ states('sensor.ecco_clock_dongle_ecco_timezone' ~ n ~ '_time') if ('time' ~ n) in cells or ('time' ~ (n - 1 if n > 1 else 6)) in cells else '' }} | {{ f[1] }} W{{ ' ◀ now ' ~ states('sensor.ecco_clock_dongle_ecco_timezone' ~ n ~ '_power') ~ ' W' if ('power' ~ n) in cells else '' }} | {{ f[2] }} %{{ ' ◀ now ' ~ states('sensor.ecco_clock_dongle_ecco_timezone' ~ n ~ '_soc') ~ ' %' if ('soc' ~ n) in cells else '' }} | {{ srcs[n - 1] if srcs | length >= n else '-' }}{{ ' ◀ now ' ~ states('sensor.ecco_clock_dongle_ecco_timezone' ~ n ~ '_charge') if ('source' ~ n) in cells else '' }} |
              {% endif -%}
              {% endfor %}
              Export mode **{{ state_attr('sensor.ecco_fallback_status', 'saved_export_mode') }}**{{ ' ◀ differs now' if 'export_mode' in cells else '' }} ·
              Energy mode **{{ state_attr('sensor.ecco_fallback_status', 'saved_energy_mode') }}**{{ ' ◀ differs now' if 'energy_mode' in cells else '' }}

              Grid charging **{{ state_attr('sensor.ecco_fallback_status', 'saved_grid_charging') }}**{{ ' ◀ differs now' if 'grid_charging' in cells else '' }} ·
              TOU schedule **{{ state_attr('sensor.ecco_fallback_status', 'saved_tou_schedule') }}**{{ ' ◀ differs now' if 'tou_schedule' in cells else '' }}

              Not restored by Fallback V1: grid charge current **{{ C.split(';230=')[1].split(';')[0] if ';230=' in C else '-' }} A** ·
              reg 245 **{{ C.split(';245=')[1].split(';')[0] if ';245=' in C else '-' }}** (not evidence of export limitation) ·
              reg 247 **0x{{ C.split(';247=')[1].split(';')[0] if ';247=' in C else '-' }}**
              {% endif %}
            card_mod: *ecco_card_mod

          # ---- 4. LIVE MATCH + READINESS ----
          - type: markdown
            grid_options:
              columns: 24
              rows: auto
            content: |
              {% set L = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_live_match') ~ ';' %}
              {% set m = L.split(';m=')[1].split(';')[0] if ';m=' in L else 'UNKNOWN' %}
              {% set elig = L.split(';elig=')[1].split(';')[0] if ';elig=' in L else 'UNK' %}
              {% set ew = L.split(';ew=')[1].split(';')[0] if ';ew=' in L else '-' %}
              {% set eh = L.split(';eh=')[1].split(';')[0] if ';eh=' in L else 'U' %}
              {% set words = {'MATCH': 'Live settings match the saved profile.', 'DRIFT': 'Live values differ from the saved profile.', 'CONTEXT': 'Slot times or context changed since the profile was saved.', 'EXPORT': 'Export mode is Allow Export; the saved profile uses Zero Export.', 'OUT_OF_DOMAIN': 'Live settings are outside what Fallback V1 supports.', 'PAUSED': 'Comparison paused while a temporary operation manages settings.', 'PAUSED_IO': 'Comparison paused while an inverter write or bus operation is in progress.', 'UNKNOWN': 'Live comparison unavailable (configuration data not fresh).', 'NO_PROFILE': 'No usable saved profile to compare with.'} %}
              ### Live match

              **{{ m }}** - {{ words.get(m, 'Unrecognised live-match state.') }}

              {% if elig == 'OK' %}Your current settings can be saved as the known-good profile.
              {% elif elig == 'NO' %}Your current settings cannot be saved in Fallback V1: {{ ew }}.
              {% elif elig == 'OVL' %}Saving is unavailable while a temporary operation manages settings.
              {% else %}Saveability is not known yet.
              {% endif %}
              {% if eh == '1' %}

              ⚠ Export is currently ENABLED while a temporary operation needs recovery.
              {% elif eh == 'U' and 'DP:' in L and ('DP:CR' not in L and 'DP:CM' not in L and 'DP:CA' not in L and 'DP:CN' not in L) %}

              ⚠ Export state unknown - check the inverter.
              {% endif %}
            card_mod: *ecco_card_mod

          - type: markdown
            grid_options:
              columns: 24
              rows: auto
            content: |
              {% set R = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review') ~ ';' %}
              {% set st = R.split(';st=')[1].split(';')[0] if ';st=' in R else 'IDLE' %}
              {% set arm = is_state('switch.ecco_clock_dongle_ecco_fallback_profile_arm', 'on') %}
              {% set sup = states('sensor.ecco_supervision_status') %}
              ### Save needs

              {{ '✓' if st == 'CANDIDATE_READY' else '◯' }} Review ·
              {{ '✓' if arm else '◯' }} Arm ·
              {{ '✓' if sup == 'Healthy' else '◯' }} Supervision stable ·
              {{ '✓' if is_state('binary_sensor.ecco_clock_dongle_ntp_synced', 'on') else '◯' }} NTP time

              {% if sup != 'Healthy' %}Save needs stable Home Assistant supervision (currently {{ sup }}).{% endif %}

              **Last action:** {{ states('sensor.ecco_clock_dongle_ecco_fallback_profile_last_action_result') }}
            card_mod: *ecco_card_mod

      # ---- REVIEW (CANDIDATE) PANEL ----
      - type: grid
        column_span: 4
        cards:
          - type: markdown
            grid_options:
              columns: 48
              rows: auto
            content: |
              {% set R = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review') ~ ';' %}
              {% set st = R.split(';st=')[1].split(';')[0] if ';st=' in R else 'IDLE' %}
              {% if st in ['IDLE', 'unknown', 'unavailable', ''] %}
              ### Review - current configuration

              No review in progress. Press **Review Current Configuration** below (read-only: it changes nothing on the inverter).
              {% else %}
              {% set prior = R.split(';prior=')[1].split(';')[0] if ';prior=' in R else '-' %}
              {% set exp = (R.split(';exp=')[1].split(';')[0] if ';exp=' in R else '-') %}
              {% set warn = (R.split(';warn=')[1].split(';')[0] if ';warn=' in R else '-') %}
              {% set rid = states('sensor.ecco_clock_dongle_ecco_fallback_profile_review_id') %}
              {% set head = {'READING': 'READING INVERTER (READ-ONLY)', 'CANDIDATE_READY': 'CANDIDATE READY', 'CANDIDATE_NOT_SAVEABLE': 'NOT SAVEABLE', 'SAVING': 'SAVING - RE-READING INVERTER'} %}
              {% set wtext = {'W1': 'Looks like a Free Power overlay - confirm this is your normal setup.', 'W2': 'All six slot powers are equal and no higher than the Dump to Grid ceiling - this resembles Dump to Grid residue; confirm.', 'W3': "TOU schedule (248) is OFF: this profile's slot settings are inactive on the inverter.", 'W4': 'Grid charging is globally disabled (232) while slots select Grid.'} %}
              {% set S = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review_slots') ~ ';' %}
              {% set C = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review_context') ~ ';' %}
              {% set SV = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_slots') ~ ';' %}
              {% set chg = state_attr('sensor.ecco_fallback_status', 'candidate_changed_cells') or [] %}
              {% set srcs = (state_attr('sensor.ecco_fallback_status', 'candidate_sources') or '').split(' | ') %}
              ### Review - current configuration: {{ head.get(st, st) }}

              Review ID **{{ rid }}**{% if exp | int(-1) >= 0 %} · expires in **{{ '%d:%02d' | format(exp | int(0) // 60, exp | int(0) % 60) }}**{% endif %}

              Replaces: **{{ prior }}**{{ ' (generation ' ~ (states('sensor.ecco_clock_dongle_ecco_fallback_profile_summary').split(';')[0] | replace('g=', '')) ~ ')' if prior == 'VALID' else '' }}

              {{ state_attr('sensor.ecco_fallback_status', 'next_generation_text') or 'Will save a new generation' }}

              | Slot | Time | Power | Target SOC | Source |
              |:---|:---|---:|---:|:---|
              {% for n in range(1, 7) -%}
              {% set t = S.split(';' ~ n ~ '=')[1].split(';')[0] if (';' ~ n ~ '=') in S else '-' -%}
              {% set f = t.split('/') -%}
              {% set tv = SV.split(';' ~ n ~ '=')[1].split(';')[0].split('/') if (';' ~ n ~ '=') in SV else [] -%}
              {% set nx = S.split(';' ~ (1 if n == 6 else n + 1) ~ '=')[1].split(';')[0].split('/')[0] if (';' ~ (1 if n == 6 else n + 1) ~ '=') in S else '----' -%}
              {% if f | length == 4 -%}
              {% set lab = srcs[n - 1] if srcs | length == 6 else '-' -%}
              | {{ n }} | {{ f[0][:2] }}:{{ f[0][2:] }}-{{ nx[:2] }}:{{ nx[2:] }} | {{ f[1] }} W{{ ' ◀ saved ' ~ tv[1] if (tv | length == 4 and ('power' ~ n) in chg) else '' }} | {{ f[2] }} %{{ ' ◀ saved ' ~ tv[2] if (tv | length == 4 and ('soc' ~ n) in chg) else '' }} | {{ lab }} |
              {% endif -%}
              {% endfor %}
              Export mode (244) **{{ state_attr('sensor.ecco_fallback_status', 'candidate_export_mode') or '-' }}** ·
              Energy mode (243) **{{ state_attr('sensor.ecco_fallback_status', 'candidate_energy_mode') or '-' }}**

              Grid charging (232) **{{ state_attr('sensor.ecco_fallback_status', 'candidate_grid_charging') or '-' }}** ·
              TOU schedule (248) **{{ state_attr('sensor.ecco_fallback_status', 'candidate_tou_schedule') or '-' }}**

              Slot times form a valid 24 h ring: **{{ 'yes' if (C.split(';ring=')[1].split(';')[0] if ';ring=' in C else '-') == 'OK' else 'NO' }}**

              Info (never restored in V1): 230 **{{ C.split(';230=')[1].split(';')[0] if ';230=' in C else '-' }}** · 245 **{{ C.split(';245=')[1].split(';')[0] if ';245=' in C else '-' }}** · 247 **0x{{ C.split(';247=')[1].split(';')[0] if ';247=' in C else '-' }}**

              {% if warn != '-' %}{% for w in warn.split(',') %}⚠ {{ w }} {{ wtext.get(w, 'Review warning.') }}

              {% endfor %}{% endif %}
              {% if st == 'CANDIDATE_NOT_SAVEABLE' %}Why: {{ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review') }} (see the Live match panel for the reasons).{% endif %}
              {% endif %}
            card_mod: *ecco_card_mod

      # ---- CONTROLS (operator-only; every write is behind its own gate) ----
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Controls
            heading_style: subtitle
            icon: mdi:gesture-tap-button
            grid_options:
              columns: 48
              rows: auto
          - type: entities
            title: Review and arm
            show_header_toggle: false
            grid_options:
              columns: 24
              rows: auto
            entities:
              - entity: button.ecco_clock_dongle_ecco_fallback_profile_review_current_configuration
                name: Review Current Configuration
              - entity: switch.ecco_clock_dongle_ecco_fallback_profile_arm
                name: Arm (turns off after 2 min)
            card_mod: *ecco_card_mod
          - type: button
            name: Save Known-Good Profile
            icon: mdi:content-save-check-outline
            show_state: false
            visibility:
              - condition: state
                entity: binary_sensor.ecco_fallback_save_available
                state: 'on'
            tap_action:
              action: perform-action
              perform_action: script.ecco_fallback_profile_save
              confirmation:
                text: Save the reviewed configuration as your known-good profile? The Review ID shown on screen is used. The inverter is not changed.
            grid_options:
              columns: 24
              rows: 2
          - type: button
            name: Replace Damaged Profile
            icon: mdi:file-replace-outline
            show_state: false
            visibility:
              - condition: state
                entity: binary_sensor.ecco_fallback_replace_corrupt_available
                state: 'on'
            tap_action:
              action: perform-action
              perform_action: script.ecco_fallback_profile_replace_corrupt
              confirmation:
                text: This replaces a damaged saved profile after logging its raw bytes. It does not erase NVS and does not change the inverter. Continue?
            grid_options:
              columns: 24
              rows: 2
          - type: button
            name: Invalidate Profile
            icon: mdi:file-cancel-outline
            show_state: false
            visibility:
              - condition: state
                entity: binary_sensor.ecco_fallback_invalidate_available
                state: 'on'
            tap_action:
              action: perform-action
              perform_action: script.ecco_fallback_profile_invalidate
              confirmation:
                text: Invalidate the known-good profile? It is kept for reference but will never be used until you save a new one. The inverter is not changed.
            grid_options:
              columns: 24
              rows: 2

      # ---- TECHNICAL DETAIL (behind the helper toggle) ----
      - type: grid
        column_span: 4
        cards:
          - type: entities
            show_header_toggle: false
            grid_options:
              columns: 48
              rows: auto
            entities:
              - entity: input_boolean.ecco_safety_show_technical_detail
                name: Show technical detail
            card_mod: *ecco_card_mod
          - type: markdown
            visibility:
              - condition: state
                entity: input_boolean.ecco_safety_show_technical_detail
                state: 'on'
            grid_options:
              columns: 48
              rows: auto
            content: |
              {% set L = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_live_match') ~ ';' %}
              {% set R = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review') ~ ';' %}
              {% set obl = (L.split(';obl=')[1].split(';')[0] if ';obl=' in L else '-') %}
              {% set dom = {'FP': 'Free Power', 'DP': 'Dump to Grid', 'R4': 'Register 244 test', 'MT': 'Manual TOU', 'FS': 'Failback record', 'BUS': 'Inverter bus'} %}
              {% set kind = {'CM': 'clear marker', 'CA': 'no record stored', 'CN': 'no durable state', 'CR': 'clear (live legs only)', 'AC': 'active', 'ST': 'starting', 'RR': 'restore required', 'PC': 'pending clear', 'EN': 'ending', 'ON': 'needs your decision', 'UR': 'recovery state unreadable', 'MC': 'recovery metadata corrupt', 'ML': 'recovery metadata corrupt', 'CT': 'recovery metadata corrupt', 'DV': 'stored state disagrees with memory', 'LK': 'inverter write lock stuck', 'NP': 'not yet checked', 'BL': 'starting up', 'IF': 'in flight', 'OK': 'idle', 'BY': 'busy'} %}
              ### Technical detail

              **Status code:** `{{ states('sensor.ecco_fallback_status_code') }}` · **Live match:** `{{ state_attr('sensor.ecco_fallback_status_code', 'live_match') }}` ·
              **Profile class:** `{{ states('sensor.ecco_clock_dongle_ecco_fallback_profile_state') }}` ·
              **Drift cells:** `{{ state_attr('sensor.ecco_fallback_status', 'drift_cells') }}` ({{ state_attr('sensor.ecco_fallback_status', 'drift_count') }})

              **Temporary operations (live obligations):**
              {% for e in (obl.split(',') if obl != '-' else []) -%}
              - {{ dom.get(e.split(':')[0], e.split(':')[0]) }}: {{ kind.get(e.split(':')[1], e.split(':')[1]) }} (`{{ e }}`)
              {% endfor %}
              **Review obligations:** `{{ R.split(';obl=')[1].split(';')[0] if ';obl=' in R else '-' }}` · probe latch `{{ R.split(';latch=')[1].split(';')[0] if ';latch=' in R else '-' }}` · saveability `{{ R.split(';sv=')[1].split(';')[0] if ';sv=' in R else '-' }}`

              **Raw strings**

              - Summary: `{{ states('sensor.ecco_clock_dongle_ecco_fallback_profile_summary') }}`
              - Review: `{{ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review') }}`
              - Review ID: `{{ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review_id') }}`
              - Review slots: `{{ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review_slots') }}`
              - Review context: `{{ states('sensor.ecco_clock_dongle_ecco_fallback_profile_review_context') }}`
              - Saved slots: `{{ states('sensor.ecco_clock_dongle_ecco_fallback_profile_slots') }}`
              - Saved context: `{{ states('sensor.ecco_clock_dongle_ecco_fallback_profile_context') }}`
              - Live match: `{{ states('sensor.ecco_clock_dongle_ecco_fallback_profile_live_match') }}`
              - Last action-result: `{{ states('sensor.ecco_clock_dongle_ecco_fallback_profile_last_action_result') }}`

              **Generation high-water (Home Assistant detection only):** `{{ states('sensor.ecco_fallback_generation_high_water') }}`
            card_mod: *ecco_card_mod
          # ---- FB-C3 SHADOW EVALUATOR DETAIL (technical detail only; DIAGNOSTIC, writes nothing) ----
          # Decoded by sensor.ecco_shadow_check from the five existing shadow strings (grammar and Verdict contract of FB-C2 as
          # merged, PR #63). Held in dongle RAM for this boot only: this is not persisted shadow history.
          - type: markdown
            visibility:
              - condition: state
                entity: input_boolean.ecco_safety_show_technical_detail
                state: 'on'
            grid_options:
              columns: 48
              rows: auto
            content: |
              {% set sc = 'sensor.ecco_shadow_check' %}
              {% set inp = state_attr(sc, 'inputs') or {} %}
              {% set ep = state_attr(sc, 'episode') or {} %}
              {% set sk = state_attr(sc, 'soak') or {} %}
              {% set hist = sk.get('gap_histogram') or {} %}
              {% set wr = sk.get('starts_seen_while_would_refuse') or {} %}
              {% set xh = sk.get('export_hazard_s') or {} %}
              {% set cs = sk.get('cache_s') or {} %}
              {% set unk = state_attr(sc, 'unknown_keys') or [] %}
              {% set raw = state_attr(sc, 'raw') or {} %}
              ### Failback shadow evaluator (diagnostic - writes nothing)

              {% set basis = {'readiness': 'if Home Assistant were lost now', 'episode': 'continuation while the shadow episode is open', 'not_evaluated': 'not evaluated yet', 'unrecognised': 'not recognised', 'not_available': 'not available'} %}
              **State:** `{{ state_attr(sc, 'shadow_state') or 'unknown' }}` · **Verdict ({{ basis.get(state_attr(sc, 'verdict_scope'), 'not available') }}):** `{{ state_attr(sc, 'verdict') or 'unknown' }}` - {{ states(sc) }}

              **Readiness plan (Inputs `pl` / `rs`):** `{{ inp.get('if_lost_plan', '-') }}` - {{ inp.get('if_lost_wording', '-') }} · reason `{{ inp.get('if_lost_reason', '-') }}`{{ ' (the plan underneath the modelled FB-F latch)' if state_attr(sc, 'latched') else '' }}

              **Inputs (last evaluation)**

              - Supervision: {{ inp.get('supervision', '-') }}, {{ inp.get('stable', '-') }}
              - Free Power: {{ inp.get('free_power', '-') }} · Dump to Grid: {{ inp.get('dump_to_grid', '-') }} · Register 244 test: {{ inp.get('register_244_test', '-') }} · Manual TOU: {{ inp.get('manual_tou', '-') }}
              - Known-good profile: {{ inp.get('profile_class', '-') }} · generation {{ inp.get('profile_generation', '-') }} · binding `{{ inp.get('profile_binding', '-') }}`
              - Live settings vs profile: {{ inp.get('e1', '-') }} · context: {{ inp.get('context', '-') }} · info registers (never restored in V1): {{ inp.get('info', '-') }}
              - Live data cache: {{ inp.get('cache', '-') }} · write locks: {{ inp.get('locks', '-') }}
              - Registers that differ: {{ inp.get('delta_count', '-') }} · projected frames: {{ (inp.get('projected_frames') or ['none']) | join(', ') }}
              - If an absent lease record were accepted as clear (`alt`): `{{ inp.get('absence_accepted_plan', '-') }}` · after the awaited pre-empt / restore (`pa`): `{{ inp.get('projected_after_plan', '-') }}`

              **Last episode** `{{ ep.get('id', '-') }}` · phase {{ ep.get('phase', '-') }} · kind {{ ep.get('kind', '-') }} · trigger {{ ep.get('trigger', '-') }}

              - Loss declared: {{ ep.get('edge_time', '-') }} (dongle uptime {{ ep.get('edge_uptime_s', '-') }} s) · API client at the edge: {{ ep.get('client_at_edge', '-') }} · no-client reboot margin: {{ 'n/a (API client connected)' if ep.get('reboot_margin_s', '-') == '-' else ep.get('reboot_margin_s') ~ ' s' }}
              - Frozen edge plan: `{{ ep.get('edge_plan', '-') }}` (underlying plan when latched: `{{ ep.get('underlying_plan', '-') }}`) · FB-A result `{{ ep.get('fba_result', '-') }}` · blocking domain: {{ ep.get('blocking_domain', '-') }}
              - Pre-empt: {{ (ep.get('preempt') or ['none']) | join(' + ') }} · projected frames: {{ (ep.get('projected_frames') or ['none']) | join(', ') }} · registers differing: {{ ep.get('delta_count', '-') }}
              - Home Assistant back after: {{ ep.get('returned_after', '-') }} (gap {{ ep.get('return_gap_s', '-') }} s) · re-lost {{ ep.get('re_lost', '-') }} · verdict changes {{ ep.get('verdict_changes', '-') }}
              - Closed after: {{ ep.get('closed_after', '-') }} · close outcome: {{ ep.get('close_outcome', '-') }}
              - A future failback would have: {{ ep.get('would_have', '-') }}

              **This boot** · boot id `{{ sk.get('boot_id', '-') }}` · episodes {{ sk.get('episodes', '-') }} · ECCO Reset Reason: {{ states('sensor.ecco_clock_dongle_ecco_reset_reason') }}

              - Heartbeat gaps: {% for k, v in hist.items() %}{{ k }}: {{ v }}{{ ' · ' if not loop.last else '' }}{% endfor %}
              - Longest gap {{ sk.get('max_gap_s', '-') }} s · last long gap {{ sk.get('last_long_gap_s', '-') }} s · gaps missed {{ sk.get('gaps_missed', '-') }}
              - Start attempts seen while a failback would refuse: Free Power {{ wr.get('free_power', '-') }} · Dump to Grid {{ wr.get('dump_to_grid', '-') }} · Register 244 test {{ wr.get('register_244_test', '-') }} · profile changes {{ wr.get('profile_changes', '-') }}
              - API client drops {{ sk.get('api_client_drops', '-') }} · longest without a client {{ sk.get('longest_no_client_s', '-') }} s
              - Export hazard seen: yes {{ xh.get('yes', '-') }} s · unknown {{ xh.get('unknown', '-') }} s
              - Live-data cache: fresh {{ cs.get('fresh', '-') }} s · pre-fence {{ cs.get('pre_fence', '-') }} s · other {{ cs.get('other', '-') }} s
              {% if unk %}
              **Unrecognised keys (shown raw):** {% for u in unk %}`{{ u }}` {% endfor %}
              {% endif %}
              **Raw strings**

              - Inputs: `{{ raw.get('inputs', '-') }}`
              - Episode: `{{ raw.get('episode', '-') }}`
              - Soak: `{{ raw.get('soak', '-') }}`

              {{ state_attr(sc, 'scope_note') or '' }}
            card_mod: *ecco_card_mod
          - type: entities
            title: Supervision diagnostics
            show_header_toggle: false
            visibility:
              - condition: state
                entity: input_boolean.ecco_safety_show_technical_detail
                state: 'on'
            grid_options:
              columns: 24
              rows: auto
            entities:
              - entity: sensor.ecco_clock_dongle_ecco_supervision_state
                name: Supervision state (firmware)
              - entity: sensor.ecco_clock_dongle_ecco_supervision_heartbeat_age
                name: Heartbeat age
              - entity: sensor.ecco_clock_dongle_ecco_supervision_last_gap
                name: Last gap
              - entity: sensor.ecco_clock_dongle_ecco_supervision_longest_gap
                name: Longest gap
              - entity: sensor.ecco_clock_dongle_ecco_supervision_valid_heartbeat_count
                name: Valid heartbeats
              - entity: sensor.ecco_clock_dongle_ecco_supervision_invalid_heartbeat_count
                name: Invalid heartbeats
              - entity: sensor.ecco_clock_dongle_ecco_supervision_last_invalid_heartbeat_reason
                name: Last invalid reason
              - entity: binary_sensor.ecco_clock_dongle_ecco_api_client_connected
                name: API client connected
            card_mod: *ecco_card_mod
          - type: button
            name: Reset detection history (Home Assistant only)
            icon: mdi:backup-restore
            show_state: false
            visibility:
              - condition: state
                entity: input_boolean.ecco_safety_show_technical_detail
                state: 'on'
            tap_action:
              action: perform-action
              perform_action: script.ecco_fallback_reset_high_water
              confirmation:
                text: Reset Home Assistant's detection history for the saved-profile generation? This resets only Home Assistant's own record of the highest generation it has seen. It does NOT change the dongle or the inverter. Operator use only, after investigating a lost or rolled-back profile warning.
            grid_options:
              columns: 24
              rows: 2
  - title: Manual Controls
    path: ecco-manual-controls
    icon: mdi:tune
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      # ================= 0. SAFETY / STATUS =================
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: ECCO Manual Controls (V1)
            heading_style: title
            icon: mdi:tune
            badges:
              - type: entity
                entity: binary_sensor.ecco_clock_dongle_configuration_online
                name: Config
                show_state: true
                color: green
              - type: entity
                entity: binary_sensor.ecco_clock_dongle_manual_write_in_progress
                name: Write In Progress
                show_state: true
                color: amber
            grid_options:
              columns: 48
              rows: auto
          # ---- FALLBACK PROFILE DRIFT BANNER (FB-B3; ADVISORY / DISPLAY ONLY) ----
          # Shown only while the saved known-good profile no longer matches the inverter. It never
          # blocks, delays or changes a Manual TOU apply; the profile does NOT update itself.
          - type: markdown
            visibility:
              - condition: state
                entity: sensor.ecco_fallback_status_code
                state:
                  - drift_values
                  - drift_context
                  - drift_export
                  - live_out_of_domain
            grid_options:
              columns: 48
              rows: auto
            content: |
              {% set c = states('sensor.ecco_fallback_status_code') %}
              {% set n = state_attr('sensor.ecco_fallback_status', 'drift_count') | int(0) %}
              {% set L = ';' ~ states('sensor.ecco_clock_dongle_ecco_fallback_profile_live_match') ~ ';' %}
              {% set ew = L.split(';ew=')[1].split(';')[0].split(',')[0].split('+')[0] if ';ew=' in L else '-' %}
              {% if c == 'drift_values' %}
              Your saved known-good profile no longer matches the inverter ({{ n }} {{ 'setting differs' if n == 1 else 'settings differ' }}). It will NOT update itself. If this change is your new normal, open the Safety tab → Review Current Configuration → Save.
              {% elif c == 'drift_context' %}
              Your saved known-good profile no longer matches the inverter. It will NOT update itself. Slot times or context changed: a restore of the saved profile would be refused until you save again or put the times back. To save the new setup, open the Safety tab → Review Current Configuration → Save.
              {% elif c == 'drift_export' %}
              Export mode is Allow Export; your saved known-good profile uses Zero Export. This setting cannot be saved as a fallback - change it back here in Manual Controls. The profile will NOT update itself; once the settings are saveable, open the Safety tab → Review Current Configuration → Save.
              {% else %}
              Current settings are outside what Fallback V1 can save or restore ({{ ew if ew not in ['-', ''] else 'see the Safety tab' }}). Change them here before saving a new profile. The saved profile will NOT update itself: Safety tab → Review Current Configuration → Save.
              {% endif %}

              Advisory only - this does not block or change Manual Controls.
            card_mod: *ecco_card_mod
          - type: markdown
            grid_options:
              columns: 48
              rows: auto
            content: |
              Automatic optimisation is **OFF** - every change on this page is manual and human-triggered
