            content: |
              | | Today | Lifetime |
              |:---|---:|---:|
              | Battery charge | {{ states('sensor.ecco_clock_dongle_ecco_day_battery_charge')|float(0)|round(2) }} kWh | {{ states('sensor.ecco_clock_dongle_ecco_total_battery_charge')|float(0)|round(1) }} kWh |
              | Battery discharge | {{ states('sensor.ecco_clock_dongle_ecco_day_battery_discharge')|float(0)|round(2) }} kWh | {{ states('sensor.ecco_clock_dongle_ecco_total_battery_discharge')|float(0)|round(1) }} kWh |
              | Grid import | {{ states('sensor.ecco_clock_dongle_ecco_day_grid_import')|float(0)|round(2) }} kWh | {{ states('sensor.ecco_clock_dongle_ecco_total_grid_import')|float(0)|round(1) }} kWh |
              | Grid export | {{ states('sensor.ecco_clock_dongle_ecco_day_grid_export')|float(0)|round(2) }} kWh | {{ states('sensor.ecco_clock_dongle_ecco_total_grid_export')|float(0)|round(1) }} kWh |
              | Load | {{ states('sensor.ecco_clock_dongle_ecco_day_load_energy')|float(0)|round(2) }} kWh | {{ states('sensor.ecco_clock_dongle_ecco_total_load_energy')|float(0)|round(1) }} kWh |
