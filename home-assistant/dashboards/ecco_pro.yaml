                ha-card {
                  font-family: "Roboto", "Segoe UI", Arial, sans-serif !important;
                  --ha-card-background: #0d1728 !important;
                  --card-background-color: #0d1728 !important;
                  border-radius: 18px;
                  border: 1px solid rgba(255,255,255,0.08);
