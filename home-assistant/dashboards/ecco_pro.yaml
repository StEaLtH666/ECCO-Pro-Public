                  box-shadow: 0 10px 30px rgba(0,0,0,0.22);
                  overflow: hidden;
                }
                #header__title {
                  color: rgba(255,255,255,0.92) !important;
                  font-family: "Roboto", "Segoe UI", Arial, sans-serif !important;
                  font-size: 20px !important;
                  font-weight: 700 !important;
                }

          # ---- DEYE / SUNSYNK INVERTER-CENTRIC LIVE FLOW (v2.8 forced blue) ----
          - type: custom:button-card
            section_mode: true
            name: Overrides & Maintenance
            icon: mdi:lightning-bolt-circle
            show_name: true
            show_icon: true
            show_state: false
            tap_action:
              action: none
            custom_fields:
              body: >
                [[[
                  const events=Object.values(states).filter(s=>s.entity_id.startsWith('event.'));
                  const friendly=(s)=>String(s?.attributes?.friendly_name??s?.entity_id??'').toLowerCase();
                  const isExport=(s)=>s.entity_id.includes('export')||friendly(s).includes('export');
                  const parseEvent=(needle)=>{
                    const ev=events.find(s=>s.entity_id.includes('octopus_energy_electricity')&&s.entity_id.includes(needle)&&!isExport(s));
                    const rs=Array.isArray(ev?.attributes?.rates)?ev.attributes.rates:[];
                    return rs.map(r=>({start:new Date(r.start),end:new Date(r.end),p:Number(r.value_inc_vat)*100}))
                      .filter(r=>Number.isFinite(r.p)&&!isNaN(r.start)&&!isNaN(r.end)).sort((a,b)=>a.start-b.start);
                  };
                  const now=new Date();
                  const today=parseEvent('current_day_rates');
                  const next=parseEvent('next_day_rates');
                  const coverage=next.reduce((s,r)=>s+Math.max((r.end-r.start)/3600000,0),0);
                  const nextReady=next.length>=6&&coverage>=3;
                  const all=[...today.filter(r=>r.end>now),...(nextReady?next:[])];
                  const free=all.find(r=>r.p<=0);
                  const tf=(d)=>d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
                  const freeText=free?`${free.p.toFixed(2)}p • ${tf(free.start)}–${tf(free.end)}`:'None published';
                  return `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
                    <div style="padding:10px 12px;border-radius:11px;background:rgba(85,229,142,.04);border:1px solid rgba(85,229,142,.14);">
                      <div style="font-size:10px;color:rgba(255,255,255,.48);">Free / negative power</div>
                      <div style="font-size:16px;font-weight:800;color:${free?'#55e58e':'rgba(255,255,255,.72)'};margin-top:3px;">${freeText}</div>
                      <div style="font-size:10px;color:rgba(255,255,255,.42);margin-top:3px;">Will become a charge override when automation is enabled.</div>
                    </div>
                    <div style="padding:10px 12px;border-radius:11px;background:rgba(143,124,255,.04);border:1px solid rgba(143,124,255,.14);">
                      <div style="font-size:10px;color:rgba(255,255,255,.48);">Weekly 100% grid charge</div>
                      <div style="font-size:16px;font-weight:800;color:#b8adff;margin-top:3px;">Tracking helper pending</div>
                      <div style="font-size:10px;color:rgba(255,255,255,.42);margin-top:3px;">Future rule: verify a grid-supplied 100% charge at least once per configured interval.</div>
                    </div>
                    <div style="padding:10px 12px;border-radius:11px;background:rgba(255,189,61,.035);border:1px solid rgba(255,189,61,.13);">
                      <div style="font-size:10px;color:rgba(255,255,255,.48);">Automatic writes</div>
                      <div style="font-size:16px;font-weight:800;color:#ffbd3d;margin-top:3px;">Observe only</div>
                      <div style="font-size:10px;color:rgba(255,255,255,.42);margin-top:3px;">No TOU settings are changed by this dashboard version.</div>
                    </div>
                  </div>`;
                ]]]
            styles:
              card:
                - border-radius: 20px
                - padding: 14px 16px
                - background: linear-gradient(145deg, rgba(20,28,45,0.98), rgba(10,15,27,0.98))
                - border: 1px solid rgba(255,255,255,0.08)
                - box-shadow: 0 12px 32px rgba(0,0,0,0.22)
              grid:
                - grid-template-areas: '"i n" "body body"'
                - grid-template-columns: 30px 1fr
                - grid-template-rows: min-content 1fr
                - row-gap: 10px
              icon:
                - width: 22px
                - color: '#ffbd3d'
              name:
                - justify-self: start
                - font-size: 19px
                - font-weight: 700
                - color: rgba(255,255,255,0.92)
              custom_fields:
                body:
                  - width: 100%
                  - white-space: normal
                  - overflow: visible
            grid_options:
              columns: 48
              rows: 4

          - type: custom:button-card
            section_mode: true
            name: Current Plan
            icon: mdi:calendar-clock
            show_name: true
            show_icon: true
            show_state: false
            tap_action:
              action: none
            custom_fields:
              mode: >
                [[[
                  const em = states['sensor.ecco_clock_dongle_ecco_energy_management_model']?.state ?? 'Unknown';
                  const tou = states['binary_sensor.ecco_clock_dongle_ecco_time_of_use_enabled']?.state === 'on';
                  return `<span style="display:inline-block;padding:5px 10px;border-radius:999px;
                    background:rgba(143,124,255,0.12);border:1px solid rgba(143,124,255,0.28);
                    color:#b8adff;font-size:12px;font-weight:700;">
                    ${em}${tou ? ' • TOU active' : ' • TOU off'}
                  </span>`;
                ]]]
              slot: >
                [[[
                  const read = (i, type) => states[`sensor.ecco_clock_dongle_ecco_timezone${i}_${type}`]?.state ?? '--';
                  const toMin = (t) => {
                    const m = String(t).match(/^(\d{1,2}):(\d{2})$/);
                    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
                  };
                  const now = new Date();
                  const cur = now.getHours()*60 + now.getMinutes();
                  const slots = [];

                  for (let i=1; i<=6; i++) {
                    const next = i === 6 ? 1 : i + 1;
                    const startText = read(i,'time');
                    const endText = read(next,'time');
                    const start = toMin(startText);
                    const end = toMin(endText);
                    if (start === null || end === null) continue;
                    const active = end > start ? (cur >= start && cur < end) : (cur >= start || cur < end);
                    slots.push({
                      i, active, startText, endText,
                      power: Number(read(i,'power')),
                      soc: Number(read(i,'soc')),
                      charge: read(i,'charge')
                    });
                  }

                  const s = slots.find(x => x.active) ?? slots[0];
                  if (!s) return 'TOU schedule unavailable';

                  const power = Number.isFinite(s.power) ? `${(s.power/1000).toFixed(1)} kW ceiling` : '';
                  const charging = s.charge !== 'None';
                  const line1 = charging ? `${s.charge} charge enabled` : 'No forced charge';
                  const line2 = charging && Number.isFinite(s.soc)
                    ? `${s.soc.toFixed(0)}% charge target${power ? ` • ${power}` : ''}`
                    : power;

                  return `<div>
                    <div style="font-size:26px;font-weight:800;color:#ffffff;">Slot ${s.i}</div>
                    <div style="font-size:14px;font-weight:700;color:#b8adff;margin-top:2px;">${s.startText}–${s.endText}</div>
                    <div style="font-size:12px;color:rgba(255,255,255,0.64);margin-top:7px;line-height:1.5;">
                      ${line1}<br>${line2}
                    </div>
                  </div>`;
                ]]]
              next: >
                [[[
                  const read = (i, type) => states[`sensor.ecco_clock_dongle_ecco_timezone${i}_${type}`]?.state ?? '--';
                  const toMin = (t) => {
                    const m = String(t).match(/^(\d{1,2}):(\d{2})$/);
                    return m ? Number(m[1])*60 + Number(m[2]) : null;
                  };
                  const now = new Date();
                  const cur = now.getHours()*60 + now.getMinutes();
                  let best = null;
                  for (let i=1; i<=6; i++) {
                    const t = read(i,'time');
                    const mins = toMin(t);
                    if (mins === null) continue;
                    let delta = mins-cur;
                    if (delta <= 0) delta += 1440;
                    if (!best || delta < best.delta) best = {i,t,delta};
                  }
                  if (!best) return '';
                  const h = Math.floor(best.delta/60), m = best.delta%60;
                  const left = h ? `${h}h ${m}m` : `${m}m`;
                  return `<div style="margin-top:10px;padding:9px 11px;border-radius:11px;
                    background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.07);
                    font-size:12px;color:rgba(255,255,255,0.67);">
                    Next transition <b style="color:#fff;">${best.t}</b> • ${left}
                  </div>`;
                ]]]
              access: >
                [[[
                  return `<div style="display:flex;align-items:center;gap:7px;margin-top:9px;
                    color:#55e58e;font-size:11px;font-weight:700;">
                    <ha-icon icon="mdi:shield-check" style="width:16px;"></ha-icon>
                    Observe only • no setting writes
                  </div>`;
                ]]]
            styles:
              card:
                - border-radius: 20px
                - padding: 16px 18px
                - background: linear-gradient(145deg, rgba(20,28,45,0.98), rgba(10,15,27,0.98))
                - border: 1px solid rgba(255,255,255,0.08)
                - box-shadow: 0 12px 32px rgba(0,0,0,0.22)
              grid:
                - grid-template-areas: '"i n" "mode mode" "slot slot" "next next" "access access"'
                - grid-template-columns: 34px 1fr
                - grid-template-rows: min-content min-content 1fr min-content min-content
                - row-gap: 8px
              icon:
                - width: 24px
                - color: '#b8adff'
              name:
                - justify-self: start
                - align-self: center
                - font-size: 20px
                - font-weight: 700
                - color: rgba(255,255,255,0.92)
              custom_fields:
                mode:
                  - justify-self: start
                slot:
                  - justify-self: stretch
                next:
                  - justify-self: stretch
                access:
                  - justify-self: stretch
            grid_options:
              columns: 16
              rows: 5

          # ---- SOLAR FORECAST ----
          - type: custom:button-card
            section_mode: true
            name: Daily Energy Totals
            show_icon: false
            show_state: false
            show_label: false
            tap_action:
              action: none
            custom_fields:
              bars: >
                [[[
                  const defs = [
                    ['PV', 'sensor.ecco_clock_dongle_ecco_day_pv_energy', '#ffbd3d', 'rgba(255,189,61,.28)'],
                    ['Load', 'sensor.ecco_clock_dongle_ecco_day_load_energy', '#42aaff', 'rgba(66,170,255,.28)'],
                    ['Import', 'sensor.ecco_clock_dongle_ecco_day_grid_import', '#ff6376', 'rgba(255,99,118,.25)'],
                    ['Export', 'sensor.ecco_clock_dongle_ecco_day_grid_export', '#b36cff', 'rgba(179,108,255,.25)'],
                    ['Batt<br>Charge', 'sensor.ecco_clock_dongle_ecco_day_battery_charge', '#39d27a', 'rgba(57,210,122,.25)'],
                    ['Batt<br>Discharge', 'sensor.ecco_clock_dongle_ecco_day_battery_discharge', '#65e39a', 'rgba(101,227,154,.25)']
                  ];
                  const vals = defs.map(d => {
                    const v = Number(states[d[1]]?.state);
                    return Number.isFinite(v) ? Math.max(v, 0) : 0;
                  });
                  const maxVal = Math.max(...vals, 1);
                  return `<div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;align-items:end;height:225px;padding:4px 4px 0 4px;">
                    ${defs.map((d,i) => {
                      const v = vals[i];
                      const pct = v <= 0 ? 1 : Math.max(6, Math.round((v / maxVal) * 100));
                      const opacity = v <= 0 ? 0.25 : 1;
                      return `<div style="height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;">
                        <div style="font-size:15px;font-weight:700;color:rgba(255,255,255,.92);margin-bottom:2px;">${v.toFixed(1)}</div>
                        <div style="font-size:10px;color:rgba(255,255,255,.52);margin-bottom:7px;">kWh</div>
                        <div style="width:62%;height:${pct}%;min-height:3px;max-height:145px;border-radius:9px 9px 3px 3px;background:${d[2]};opacity:${opacity};box-shadow:0 0 18px ${d[3]};"></div>
                        <div style="font-size:11px;font-weight:600;text-align:center;line-height:1.15;color:rgba(255,255,255,.68);margin-top:8px;min-height:27px;">${d[0]}</div>
                      </div>`;
                    }).join('')}
                  </div>`;
                ]]]
            styles:
