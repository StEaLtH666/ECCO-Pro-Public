              | Last telemetry update | {{ states('sensor.ecco_clock_dongle_last_telemetry_update') }} |
              | Last configuration update | {{ states('sensor.ecco_clock_dongle_last_configuration_update') }} |
              | Basic settings — sync clock flag | {{ states('sensor.ecco_clock_dongle_ecco_inverter_basic_settings_sync_clock') }} |
              | Basic settings — beep flag | {{ states('sensor.ecco_clock_dongle_ecco_inverter_basic_settings_beep') }} |
            card_mod: *ecco_card_mod

      # ================= 12. DIAGNOSTICS =================
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: 12 · Diagnostics
            heading_style: title
            icon: mdi:test-tube
            grid_options:
              columns: 48
