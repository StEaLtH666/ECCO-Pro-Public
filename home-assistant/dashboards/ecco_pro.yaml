      # ================= 1. TOU ENGINEERING CONTROL MATRIX =================
      - type: grid
        column_span: 4
        cards:
          - type: markdown
            grid_options:
              columns: 48
              rows: 4
            content: |
              ### ⚠ TOU ENGINEERING CONTROL

              - These six times form **one continuous 24-hour ring** - each slot **Start** is also the previous slot's **End**; there is no separate End control (Slot 6's end wraps to Slot 1's start).
              - **Load current values to staging before editing.** Changing Slot N's Start also changes Slot (N-1)'s end, because they are the same inverter register.
              - Applying a slot writes only through the existing, already-verified manual-write transaction (arm → write → reread → exact verify → disarm).
              - **Grid Charge Enabled** is global, not per-slot, and is included in every slot's Apply (see Battery section below).
              - **Voltage** is currently read-only - no proven write path exists for it.
              - **TOU times must land on a 5-minute boundary** (hardened both in the staging control's step and in the apply-time validation itself).
              - Time Of Use master: **{{ 'ENABLED' if is_state('binary_sensor.ecco_clock_dongle_ecco_time_of_use_enabled','on') else 'DISABLED' }}** (read-only for now).
              - {% if is_state('sensor.ecco_clock_dongle_ecco_load_limit_exp_ess_non_ess', 'Zero Export') %}Load Limit = **Zero Export** → **Power** below = **battery discharge limit**.{% elif is_state('sensor.ecco_clock_dongle_ecco_load_limit_exp_ess_non_ess', 'Allow Export') %}Load Limit = **Allow Export** → **Power** below = **export limit**.{% else %}Load Limit = **{{ states('sensor.ecco_clock_dongle_ecco_load_limit_exp_ess_non_ess') }}** → TOU Power behaviour in this mode is not yet fully characterised; treat as neutral **TOU power**.{% endif %}

              **LIVE WINDOW** is current inverter state. **STAGED** columns are staging values only - nothing below writes the inverter until its row's **Apply** is pressed. Each row's **Status** cell shows whether that slot's staged values currently match live inverter state.
