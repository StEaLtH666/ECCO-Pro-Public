          - type: markdown
            grid_options:
              columns: 48
              rows: 7
            content: |
              | | |
              |:---|---:|
              | Battery wake-up raw register (214) | {{ states('sensor.ecco_clock_dongle_ecco_battery_wake_up_raw') }} |
              | Gen/grid signal raw register (242) | {{ states('sensor.ecco_clock_dongle_ecco_gen_grid_signal_raw') }} |
