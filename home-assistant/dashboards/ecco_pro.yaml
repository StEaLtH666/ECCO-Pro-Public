          # ---- TEMPERATURE GRAPH ----

  - title: Tariffs
    path: ecco-tariffs
    icon: mdi:currency-gbp
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: ECCO Pro • Tariffs
            heading_style: title
            icon: mdi:currency-gbp
            grid_options:
              columns: 48
              rows: auto
          - type: custom:button-card
            section_mode: true
            name: Octopus Tariff Intelligence
            icon: mdi:octopus
            show_name: true
            show_icon: true
            show_state: false
            tap_action:
              action: none
            custom_fields:
              body: >
                [[[
                  const sensors=Object.values(states).filter(s=>s.entity_id.startsWith('sensor.'));
                  const events=Object.values(states).filter(s=>s.entity_id.startsWith('event.'));
                  const friendly=(s)=>String(s?.attributes?.friendly_name??s?.entity_id??'').toLowerCase();
                  const num=(s)=>{const v=Number(s?.state);return Number.isFinite(v)?v:null;};
                  const isExport=(s)=>s.entity_id.includes('export')||friendly(s).includes('export');
                  const tf=(d)=>d?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'--';
                  const money=(p)=>p!==null&&Number.isFinite(p)?`${p.toFixed(2)}p`:'--';

                  const rateSensors=sensors.filter(s=>
                    s.entity_id.includes('octopus_energy_electricity') &&
                    s.entity_id.includes('current_rate')
                  );
                  const imp=rateSensors.find(s=>!isExport(s));
                  const exp=rateSensors.find(s=>isExport(s));
                  const importP=num(imp)!==null?num(imp)*100:null;
                  const exportP=num(exp)!==null?num(exp)*100:null;

                  const parseEvent=(needle)=>{
                    const ev=events.find(s=>
                      s.entity_id.includes('octopus_energy_electricity') &&
                      s.entity_id.includes(needle) &&
                      !isExport(s)
                    );
                    const rs=Array.isArray(ev?.attributes?.rates)?ev.attributes.rates:[];
                    return rs.map(r=>({
                      start:new Date(r.start),
                      end:new Date(r.end),
                      p:Number(r.value_inc_vat)*100
                    })).filter(r=>Number.isFinite(r.p)&&!isNaN(r.start)&&!isNaN(r.end))
                      .sort((a,b)=>a.start-b.start);
                  };

                  const todayRates=parseEvent('current_day_rates');
                  const nextRates=parseEvent('next_day_rates');
                  const nextRateCoverageHours=nextRates.reduce((sum,r)=>sum+Math.max((r.end-r.start)/3600000,0),0);
                  const nextRatesReady=nextRates.length>=6 && nextRateCoverageHours>=3;
                  const todayMin=todayRates.length?Math.min(...todayRates.map(r=>r.p)):
                    (imp?.attributes?.current_day_min_rate!=null?Number(imp.attributes.current_day_min_rate)*100:null);
                  const todayMax=todayRates.length?Math.max(...todayRates.map(r=>r.p)):
                    (imp?.attributes?.current_day_max_rate!=null?Number(imp.attributes.current_day_max_rate)*100:null);

                  // Current band is classified against the FULL current tariff day.
                  let band='Unknown',bandColour='#7ab8ff';
                  const eps=.35;
                  if(importP!==null&&todayMin!==null&&Math.abs(importP-todayMin)<=eps){
                    band='Cheap';bandColour='#55e58e';
                  }else if(importP!==null&&todayMax!==null&&Math.abs(importP-todayMax)<=eps){
                    band='Peak';bandColour='#ff6376';
                  }else if(importP!==null){
                    band='Standard';bandColour='#ffbd3d';
                  }

                  const contiguousWindow=(rates,target,after)=>{
                    if(!rates.length||target===null)return null;
                    const hits=rates.filter(r=>r.end>after&&Math.abs(r.p-target)<=eps);
                    if(!hits.length)return null;
                    const first=hits[0];
                    let end=first.end;
                    for(const r of hits.slice(1)){
                      if(Math.abs(r.start-end)<60000) end=r.end;
                      else break;
                    }
                    return {start:first.start,end,p:target};
                  };

                  const now=new Date();
                  // Next cheap: use the rest of today only if today's actual minimum
                  // is still ahead; otherwise use published next-day rates. Never call
                  // 31p 'cheap' merely because it is the only remaining rate.
                  let nextCheap=null;
                  if(todayMin!==null){
                    nextCheap=contiguousWindow(todayRates,todayMin,now);
                  }
                  let nextDayPublished=nextRatesReady;
                  if(!nextCheap&&nextDayPublished){
                    const nextMin=Math.min(...nextRates.map(r=>r.p));
                    nextCheap=contiguousWindow(nextRates,nextMin,now);
                  }

                  const todayCheapWindow=todayMin!==null?contiguousWindow(todayRates,todayMin,new Date(0)):null;
                  const todayPeakWindow=todayMax!==null?contiguousWindow(todayRates,todayMax,new Date(0)):null;

                  const spread=importP!==null&&exportP!==null?importP-exportP:null;
                  const delivered=todayMin!==null?todayMin/.90:null;
                  const avoid=todayMax!==null&&delivered!==null?todayMax-delivered:null;

                  const stat=(label,value,colour,sub='')=>`
                    <div style="padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.065);">
                      <div style="font-size:10px;color:rgba(255,255,255,.48);">${label}</div>
                      <div style="font-size:21px;font-weight:800;color:${colour};margin-top:2px;">${value}</div>
                      ${sub?`<div style="font-size:9px;color:rgba(255,255,255,.40);margin-top:2px;">${sub}</div>`:''}
                    </div>`;

                  return `<div>
                    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:9px;">
                      ${stat('Import now',money(importP),'#7ab8ff','per kWh')}
                      ${stat('Export now',money(exportP),'#ffbd3d','per kWh')}
                      ${stat('Tariff band',band,bandColour,'vs full tariff day')}
                      ${stat('Import − export',spread!==null?money(spread):'--',spread!==null&&spread>0?'#b8adff':'#55e58e','self-use value')}
                    </div>

                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:9px;">
                      <div style="padding:10px 12px;border-radius:11px;background:rgba(85,229,142,.045);border:1px solid rgba(85,229,142,.14);">
                        <div style="font-size:10px;color:rgba(255,255,255,.48);">Today's cheap rate</div>
                        <div style="font-size:18px;font-weight:800;color:#55e58e;margin-top:2px;">${money(todayMin)}</div>
                        <div style="font-size:10px;color:rgba(255,255,255,.52);margin-top:2px;">${todayCheapWindow?`${tf(todayCheapWindow.start)}–${tf(todayCheapWindow.end)}`:'--'}</div>
                      </div>

                      <div style="padding:10px 12px;border-radius:11px;background:rgba(255,99,118,.04);border:1px solid rgba(255,99,118,.13);">
                        <div style="font-size:10px;color:rgba(255,255,255,.48);">Today's peak rate</div>
                        <div style="font-size:18px;font-weight:800;color:#ff6376;margin-top:2px;">${money(todayMax)}</div>
                        <div style="font-size:10px;color:rgba(255,255,255,.52);margin-top:2px;">${todayPeakWindow?`${tf(todayPeakWindow.start)}–${tf(todayPeakWindow.end)}`:'--'}</div>
                      </div>

                      <div style="padding:10px 12px;border-radius:11px;background:rgba(143,124,255,.05);border:1px solid rgba(143,124,255,.16);">
                        <div style="font-size:10px;color:rgba(255,255,255,.48);">Next cheap window</div>
                        <div style="font-size:18px;font-weight:800;color:#b8adff;margin-top:2px;">${nextCheap?money(nextCheap.p):'Pending'}</div>
                        <div style="font-size:10px;color:rgba(255,255,255,.52);margin-top:2px;">
                          ${nextCheap?`${tf(nextCheap.start)}–${tf(nextCheap.end)}`:(nextDayPublished?'No future cheap slot found':'Awaiting next-day rates')}
                        </div>
                      </div>
                    </div>

                    <div style="margin-top:9px;font-size:10px;line-height:1.45;color:rgba(255,255,255,.46);">
                      At 90% round-trip efficiency, today's ${money(todayMin)} cheap electricity costs about
                      <b style="color:#fff;">${money(delivered)}</b> per delivered battery kWh
                      ${avoid!==null&&avoid>0?` • potential avoided peak-import value <b style="color:#55e58e">${money(avoid)}/kWh</b>`:''}.
                    </div>
                  </div>`;
                ]]]
            styles:
              card:
                - border-radius: 20px
