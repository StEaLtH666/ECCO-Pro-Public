              | Configuration read failures since boot | {{ states('sensor.ecco_clock_dongle_configuration_read_failures_since_boot') }} |
              | RTC stall count | {{ states('sensor.ecco_clock_dongle_rtc_stall_count') }} |
              | Maximum clock error since boot | {{ states('sensor.ecco_clock_dongle_maximum_clock_error_since_boot') }} s |
              | Verified corrections since boot | {{ states('sensor.ecco_clock_dongle_verified_corrections_since_boot') }} |

              ℹ️ ECCO decodes register 214 as 0=Enable / 1=Disable. SmartDeye has historically displayed the opposite interpretation on this inverter; the raw register is shown here for reference.
            card_mod: *ecco_card_mod
          - type: markdown
            grid_options:
              columns: 48
