      # ================= 2. POWER MANAGEMENT / EXPORT =================
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Power Management / Export
            heading_style: title
            icon: mdi:transmission-tower-export
            grid_options:
              columns: 48
              rows: auto
          - type: markdown
            grid_options:
              columns: 48
              rows: 5
            content: |
              | | Current value | |
              |:---|---:|:---|
              | Energy Management Model | {{ states('sensor.ecco_clock_dongle_ecco_energy_management_model') }} | 🔒 read-only, not yet enabled |
              | Load / Export Mode | {{ states('sensor.ecco_clock_dongle_ecco_load_limit_exp_ess_non_ess') }} | ✅ live-proven writable - see Register 244 Proof control below |
              | Export Limit (dedicated inverter-wide setting) | {{ states('sensor.ecco_clock_dongle_ecco_export_limit') }} W | 🔒 read-only, not yet enabled |

              ℹ️ **Export Limit** here is the inverter's own single dedicated setting (register 245) - a
              different value from each TOU slot's own **Power** field in the TOU editor above. This
              dedicated Export Limit has no proven write path, so it stays read-only here; this page does
              not guess at SmartDeye's Allow Export / Essentials / Zero Export enum values for a selector
              that cannot yet be written. The six per-slot **TOU Power** fields are a separate matter -
              they ARE live-proven writable (registers 256-261) and are already editable in the TOU editor
              above; only this dedicated inverter-wide Export Limit is locked.
            card_mod: *ecco_manual_markdown_card_mod

      # ================= 2A. LOAD / EXPORT MODE - REGISTER 244 PROOF =================
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Load / Export Mode - Register 244 Proof
            heading_style: title
            icon: mdi:flask-outline
            grid_options:
              columns: 48
              rows: auto
          - type: markdown
            grid_options:
              columns: 48
              rows: 5
            content: |
              ⚠ **Engineering-guarded manual control - live-proven writable.** ECCO's register 244
              (Load/Export Mode) write path is live-proven on real hardware: a full 2 (Zero Export) →
              0 (Allow Export) → 2 (Zero Export) round-trip, each step exact-reread-verified, with the
              changed inverter behaviour independently confirmed - see
              `docs/stage3_3-six-slot-hardware-test.md`. This remains a manually-armed, high-impact
              control, not an automatic one: every write still requires **Manual Configuration Write
              Enable** plus **Apply Staged**, one deliberate step at a time.
              **Changing Load/Export Mode changes what the TOU Power field above means:**
              under Allow Export, TOU Power behaves as an export power cap; under Zero Export, TOU Power
              behaves as a battery discharge power cap and remaining house demand can come from grid;
              Essentials behaviour is not yet characterised. Selecting a staged option never writes
              anything - only **Apply Staged** does, and only while armed.
            card_mod: *ecco_manual_markdown_card_mod
          - type: markdown
            grid_options:
              columns: 24
              rows: 4
            content: |
              | | |
              |:---|---:|
              | Live | {{ states('sensor.ecco_clock_dongle_ecco_load_limit_exp_ess_non_ess') }} |
              | Staged | {{ states('select.ecco_clock_dongle_manual_reg244_staged_load_export_mode') }} |
              | Original Snapshot | {{ states('sensor.ecco_clock_dongle_reg244_original_snapshot') }} |
            card_mod: *ecco_manual_markdown_card_mod
          - type: entities
            title: Staged Target
            show_header_toggle: false
            grid_options:
              columns: 24
              rows: 4
            entities:
              - entity: select.ecco_clock_dongle_manual_reg244_staged_load_export_mode
                name: ""
            card_mod: *ecco_manual_entities_card_mod
          - type: markdown
            grid_options:
              columns: 48
              rows: 3
            content: |
              **Status:** {{ states('sensor.ecco_clock_dongle_reg244_test_last_result') }}
            card_mod: *ecco_manual_markdown_card_mod
          - type: entities
            title: Register 244 Proof Controls (uses Manual Configuration Write Enable arm above)
            show_header_toggle: false
            grid_options:
              columns: 48
              rows: 4
            entities:
              - entity: button.ecco_clock_dongle_load_current_reg244_to_staging
                name: Load Current
              - entity: button.ecco_clock_dongle_apply_staged_reg244_settings
                name: Apply Staged
              - entity: button.ecco_clock_dongle_restore_original_reg244
                name: Restore Original
            card_mod: *ecco_manual_entities_card_mod

