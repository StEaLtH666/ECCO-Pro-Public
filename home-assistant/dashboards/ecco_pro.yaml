            card_mod: *ecco_manual_markdown_card_mod
          - type: markdown
            grid_options:
              columns: 48
              rows: 9
            content: |
              | | Current value | |
              |:---|---:|:---|
              | Battery control mode | {{ states('sensor.ecco_clock_dongle_ecco_battery_control_mode') }} | 🔒 read-only |
              | Battery operation mode | {{ states('sensor.ecco_clock_dongle_ecco_battery_operation_mode') }} | 🔒 read-only |
              | Lithium wake-up (decoded) | {{ states('sensor.ecco_clock_dongle_ecco_battery_wake_up_lithium') }} | 🔒 read-only - kept read-only deliberately (unresolved SmartDeye vs ECCO interpretation) |
              | Generator charge current | {{ states('sensor.ecco_clock_dongle_ecco_generator_charge_current')|float(0)|round(1) }} A | 🔒 read-only, no write path |
              | Generator charge enabled | {{ 'ON' if is_state('binary_sensor.ecco_clock_dongle_ecco_battery_generator_charge_enabled','on') else 'OFF' }} | 🔒 read-only, no write path |
              | Equalisation voltage | {{ states('sensor.ecco_clock_dongle_ecco_battery_equalization_voltage')|float(0)|round(1) }} V | ⚠️ mapped, write deliberately disabled pending proof |
              | Absorption voltage | {{ states('sensor.ecco_clock_dongle_ecco_battery_absorption_voltage')|float(0)|round(1) }} V | ⚠️ mapped, write deliberately disabled pending proof |
              | Float voltage | {{ states('sensor.ecco_clock_dongle_ecco_battery_float_voltage')|float(0)|round(1) }} V | ⚠️ mapped, write deliberately disabled pending proof |
              | Capacity | {{ states('sensor.ecco_clock_dongle_ecco_battery_capacity_ah')|float(0)|round(0)|int }} Ah | ⚠️ mapped, write deliberately disabled pending proof |
              | Max charge current | {{ states('sensor.ecco_clock_dongle_ecco_battery_max_charge')|float(0)|round(1) }} A | ⚠️ mapped, write deliberately disabled pending proof |
              | Max discharge current | {{ states('sensor.ecco_clock_dongle_ecco_battery_max_discharge')|float(0)|round(1) }} A | ⚠️ mapped, write deliberately disabled pending proof |
              | Shutdown SOC | {{ states('sensor.ecco_clock_dongle_ecco_battery_shutdown')|float(0)|round(0)|int }}% | ⚠️ mapped, write deliberately disabled pending proof |
              | Restart SOC | {{ states('sensor.ecco_clock_dongle_ecco_battery_restart')|float(0)|round(0)|int }}% | ⚠️ mapped, write deliberately disabled pending proof |
              | Low warning SOC | {{ states('sensor.ecco_clock_dongle_ecco_battery_low_warning')|float(0)|round(0)|int }}% | ⚠️ mapped, write deliberately disabled pending proof |

              ℹ️ The nine ⚠️ rows above are classified **D** (mapping exists, write behaviour uncertain) in
              this task's own audit - getting these wrong can damage a battery, so V1 deliberately leaves
              them locked exactly as the registry already has them (`write_policy: W3`, `current_access:
              read_only`). This page does not change that.
            card_mod: *ecco_manual_markdown_card_mod

