              | **3** | {{ states('sensor.ecco_clock_dongle_ecco_pv3_voltage')|float(0)|round(1) }} V | {{ states('sensor.ecco_clock_dongle_ecco_pv3_current')|float(0)|round(1) }} A | {{ states('sensor.ecco_clock_dongle_ecco_pv3_power')|float(0)|round(0)|int }} W |
