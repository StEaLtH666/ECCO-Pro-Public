<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ECCO Intelligence card mock (shadow mode)</title>
<style>
/* ECCO Intelligence card mock.
   Design intent: a calm advisor's note, not a dashboard. Four kinds of statement are kept visibly apart
   by shape and texture as well as colour:
     Actual       solid ink, filled square, solid rules
     Predicted    hatched / dashed, hollow circle, blue
     Recommended  violet "shadow" tone, diamond, never applied
     Confidence   neutral scale with words under it
   Ground and radii follow the existing ECCO dashboard (navy #0d1728, 18px cards, Roboto / Segoe UI);
   this mock adds a light theme. Palette marks were run through the dataviz validator (blue / red / violet:
   CVD and normal-vision separation pass in both modes). */

:root {
  color-scheme: light;
  --page: #e8ecf2;
  --card1: #ffffff;
  --card2: #f5f7fb;
  --sunk: #eef2f8;
  --line: rgba(16, 32, 60, .16);
  --line2: rgba(16, 32, 60, .08);
  --ink: #0f1b2d;
  --ink2: #3f4f68;
  --ink3: #5a6a82;
  --pred: #1c6ad0;
  --pred-w: rgba(28, 106, 208, .12);
  --rec: #5a46c8;
  --rec-w: rgba(90, 70, 200, .09);
  --rec-ink: #4733b0;
  --floor: #c2253f;
  --floor-w: rgba(194, 37, 63, .08);
  --warn-ink: #7d5200;
  --warn-line: #b27300;
  --warn-w: rgba(178, 115, 0, .11);
  --shadow-bg: #4733b0;
  --shadow-fg: #ffffff;
  --halo: #ffffff;
  --shadow-card: 0 10px 30px rgba(16, 32, 60, .10);
  --sans: "Roboto", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #070d18;
    --card1: #111c30;
    --card2: #0b1424;
    --sunk: rgba(255, 255, 255, .035);
    --line: rgba(255, 255, 255, .14);
    --line2: rgba(255, 255, 255, .07);
    --ink: #eaf0fa;
    --ink2: #b4c0d3;
    --ink3: #8d9bb1;
    --pred: #3f93f0;
    --pred-w: rgba(63, 147, 240, .17);
    --rec: #8f82ec;
    --rec-w: rgba(143, 130, 236, .13);
    --rec-ink: #c6beff;
    --floor: #ee5a70;
    --floor-w: rgba(238, 90, 112, .12);
    --warn-ink: #ffcb69;
    --warn-line: #ffbd3d;
    --warn-w: rgba(255, 189, 61, .11);
    --shadow-bg: #3a2f86;
    --shadow-fg: #f0ecff;
    --halo: #111c30;
    --shadow-card: 0 10px 30px rgba(0, 0, 0, .28);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #070d18;
  --card1: #111c30;
  --card2: #0b1424;
  --sunk: rgba(255, 255, 255, .035);
  --line: rgba(255, 255, 255, .14);
  --line2: rgba(255, 255, 255, .07);
  --ink: #eaf0fa;
  --ink2: #b4c0d3;
  --ink3: #8d9bb1;
  --pred: #3f93f0;
  --pred-w: rgba(63, 147, 240, .17);
  --rec: #8f82ec;
  --rec-w: rgba(143, 130, 236, .13);
  --rec-ink: #c6beff;
  --floor: #ee5a70;
  --floor-w: rgba(238, 90, 112, .12);
  --warn-ink: #ffcb69;
  --warn-line: #ffbd3d;
  --warn-w: rgba(255, 189, 61, .11);
  --shadow-bg: #3a2f86;
  --shadow-fg: #f0ecff;
  --halo: #111c30;
  --shadow-card: 0 10px 30px rgba(0, 0, 0, .28);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 var(--sans); }
.wrap { max-width: 1100px; margin: 0 auto; padding: 12px 16px 48px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pred); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { display: block; }

/* ---------- mock controls (not part of the card) ---------- */
.lab { border: 1.5px dashed var(--line); border-radius: 14px; padding: 10px 12px 12px; margin: 4px 0 14px; background: var(--card2); }
.lab h1 { margin: 0 0 2px; font-size: 13px; font-weight: 700; }
.lab p { margin: 0 0 8px; font-size: 12px; color: var(--ink3); }
.lab .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
.lab .grp > .gl { font-size: 11.5px; font-weight: 700; color: var(--ink3); flex: none; margin-right: 2px; }
.chipbtn { font-size: 12px; font-weight: 600; padding: 6px 11px; min-height: 32px; border-radius: 999px; border: 1px solid var(--line); background: var(--card1); cursor: pointer; }
.chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--card1); border-color: var(--ink); }
.chipbtn.syn { border-style: dashed; }
.lab select { font: inherit; font-size: 12px; padding: 5px 8px; min-height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--card1); color: var(--ink); max-width: 100%; }
.lab label { font-size: 11.5px; font-weight: 700; color: var(--ink3); display: inline-flex; align-items: center; gap: 6px; }

/* ---------- the card ---------- */
.ecco { container-type: inline-size; container-name: ecco; background: linear-gradient(145deg, var(--card1), var(--card2)); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-card); overflow: hidden; }
.ecco-in { padding: 0 14px 18px; }
.banner { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: var(--shadow-bg); color: var(--shadow-fg); font-weight: 900; font-size: 13.5px; letter-spacing: .02em; text-transform: uppercase; position: relative; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.09) 0 8px, transparent 8px 16px); }
.banner svg { width: 20px; height: 20px; flex: none; }
.banner .sub { display: block; font-weight: 500; font-size: 11.5px; text-transform: none; letter-spacing: 0; opacity: .88; margin-top: 1px; }

.hd { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 14px 0 2px; }
.hd h2 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: .005em; }
.hd-l { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; }
.hd-r { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--ink3); }
.hd-r b { color: var(--ink2); font-weight: 600; }
.mono { font-family: var(--mono); font-size: 11.5px; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; border: 1.5px solid var(--ink3); font-size: 12px; font-weight: 700; color: var(--ink); background: transparent; white-space: nowrap; }
.pill svg { width: 14px; height: 14px; flex: none; }
.pill.t-info { border-color: var(--pred); }
.pill.t-warn { border-color: var(--warn-line); background: var(--warn-w); }
.pill.t-hold { border-color: var(--floor); background: var(--floor-w); }

.callout { display: grid; grid-template-columns: 22px 1fr; gap: 10px; margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--warn-line); background: var(--warn-w); font-size: 13px; }
.callout svg { width: 20px; height: 20px; margin-top: 1px; }
.callout b { display: block; font-size: 13.5px; }
.callout p { margin: 2px 0 0; color: var(--ink2); }
.callout.t-info { border-color: var(--pred); background: var(--pred-w); }
.callout.t-hold { border-color: var(--floor); background: var(--floor-w); }
.callout.t-quiet { border-color: var(--line); background: var(--sunk); }

/* ---------- vocabulary chips ---------- */
.vc { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; padding: 3px 10px 3px 7px; border-radius: 6px; white-space: nowrap; }
.vc svg { width: 13px; height: 13px; flex: none; }
.vc-actual { background: var(--ink); color: var(--card1); }
.vc-pred { border: 1.5px dashed var(--pred); color: var(--ink); }
.vc-pred svg { color: var(--pred); }
.vc-rec { background: var(--rec-w); border: 1.5px solid var(--rec); color: var(--rec-ink); }
.vc-conf { border: 1.5px solid var(--ink3); color: var(--ink); }
.vc small { font-weight: 500; font-size: 11.5px; opacity: .85; }
/* numbers in running text */
.np { text-decoration: underline dashed; text-decoration-color: var(--pred); text-decoration-thickness: 1.5px; text-underline-offset: 4px; font-weight: 700; white-space: nowrap; }
.nr { font-weight: 800; color: var(--rec-ink); background: linear-gradient(transparent 60%, var(--rec-w) 60%); padding: 0 2px; white-space: nowrap; }
.na { font-weight: 800; white-space: nowrap; }

/* ---------- layout ---------- */
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 14px; }
.blk { min-width: 0; border-radius: 14px; padding: 12px 12px 14px; }
.blk > .bh { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-bottom: 10px; }
.blk > .bh .hint { font-size: 12px; color: var(--ink3); }
h3 { margin: 0; font-size: 15px; font-weight: 800; }
h4 { margin: 14px 0 6px; font-size: 13px; font-weight: 800; }
.b-actual { border: 1px solid var(--line); border-left: 5px solid var(--ink); background: var(--sunk); }
.b-pred { align-self: start; border: 1.5px dashed color-mix(in srgb, var(--pred) 55%, var(--line)); background: color-mix(in srgb, var(--pred) 3%, transparent); }
.b-rec { border: 1.5px solid var(--rec); background: linear-gradient(180deg, var(--rec-w), transparent 140px); position: relative; }
.b-conf { border: 1px solid var(--line); background: var(--sunk); border-top: 4px double var(--ink3); }
.b-plain { border: 1px solid var(--line); background: var(--sunk); }
.is-old .b-pred, .is-old .b-rec, .is-old .b-chart { opacity: .5; }
.is-old .b-pred, .is-old .b-rec { filter: grayscale(1); }

/* expects */
.expects { padding: 4px 2px 0; }
.expects .lead { font: 400 19px/1.45 var(--serif); margin: 0; color: var(--ink); text-wrap: pretty; max-width: 68ch; }
.expects .lead + .lead { margin-top: 8px; }
.expects .adv { border-left: 3px solid var(--rec); padding-left: 12px; margin-top: 12px; }
.expects .adv .tag { font: 700 11.5px var(--sans); color: var(--rec-ink); display: inline-flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.expects .adv .tag svg { width: 11px; height: 11px; }
.expects .cav { font: 400 14px/1.45 var(--serif); color: var(--ink2); margin: 8px 0 0; max-width: 68ch; }
.legend-inline { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 11.5px; color: var(--ink3); margin-top: 10px; }

/* actual tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 9px; background: var(--card1); min-width: 0; }
.tile .k { font-size: 12px; color: var(--ink3); font-weight: 600; }
.tile .v { font-size: 26px; font-weight: 800; line-height: 1.1; margin-top: 2px; letter-spacing: -.01em; }
.tile .v small { font-size: 13px; font-weight: 600; color: var(--ink2); margin-left: 2px; letter-spacing: 0; }
.tile .s { font-size: 11.5px; color: var(--ink3); margin-top: 2px; }
.tile.na-tile { border-style: dashed; background: transparent; }
.tile.na-tile .v { font-size: 15px; font-weight: 600; color: var(--ink3); padding-top: 6px; }
.socbar { position: relative; height: 10px; border-radius: 3px; background: var(--line2); margin-top: 8px; border: 1px solid var(--line); }
.socbar i { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 2px 0 0 2px; }
.socbar u { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--floor); text-decoration: none; }
.socbar u.c { background: var(--ink3); width: 1px; top: -2px; bottom: -2px; }
.socleg { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink3); margin-top: 3px; }
.foot { font-size: 12px; color: var(--ink3); margin: 8px 0 0; }
.foot.warn { color: var(--warn-ink); font-weight: 600; }

/* chart */
.b-chart { border: 1px solid var(--line); background: var(--card1); }
.chwrap { position: relative; width: 100%; outline-offset: 3px; }
.chwrap svg { width: 100%; height: auto; overflow: visible; }
.tip { position: absolute; pointer-events: none; z-index: 5; min-width: 140px; max-width: 220px; padding: 7px 10px; border-radius: 8px; background: var(--card1); border: 1px solid var(--ink3); box-shadow: 0 6px 18px rgba(0,0,0,.25); font-size: 12px; line-height: 1.35; display: none; }
.tip b { font-size: 14px; display: block; }
.tip .tl { color: var(--ink3); }
.tip .sw { display: inline-block; width: 14px; height: 0; border-top: 2px dashed var(--pred); vertical-align: middle; margin-right: 5px; }
.keys { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 11.5px; color: var(--ink2); margin-top: 8px; }
.keys span { display: inline-flex; align-items: center; gap: 6px; }
.keys svg { width: 24px; height: 12px; }
.tbtn { font-size: 12px; font-weight: 600; padding: 4px 10px; min-height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--card1); cursor: pointer; margin-left: auto; }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--card1); }
.c-grid { stroke: var(--line2); stroke-width: 1; }
.c-axis { stroke: var(--line); stroke-width: 1; }
.c-txt { fill: var(--ink3); font: 11px var(--sans); }
.c-txt2 { fill: var(--ink2); font: 11px var(--sans); }
.c-lbl { fill: var(--ink); font: 600 11px var(--sans); paint-order: stroke; stroke: var(--halo); stroke-width: 3.5px; stroke-linejoin: round; }
.c-floor { stroke: var(--floor); stroke-width: 2; }
.c-comfort { stroke: var(--ink3); stroke-width: 1.25; stroke-dasharray: 2 4; }
.c-window { fill: var(--ink); opacity: .07; }
.c-med { fill: none; stroke: var(--pred); stroke-width: 2; stroke-dasharray: 7 5; stroke-linecap: round; stroke-linejoin: round; }
.c-band { fill: var(--pred-w); }
.c-hatch { stroke: var(--pred); stroke-width: 1; opacity: .55; }
.c-now { stroke: var(--ink); stroke-width: 1.5; }
.c-dot { fill: var(--ink); stroke: var(--halo); stroke-width: 2; }
.c-rec { fill: var(--rec); stroke: var(--halo); stroke-width: 2; }
.c-sun { fill: none; stroke: var(--ink2); stroke-width: 1.4; stroke-linecap: round; }
.c-pvbar { stroke: var(--ink2); stroke-width: 1.5; }
.c-cross { stroke: var(--ink2); stroke-width: 1; }
.weak .c-med, .weak .c-hatch { stroke: var(--ink3); }
.weak .c-band { fill: var(--line2); }
.weak-note { font-size: 12px; color: var(--warn-ink); font-weight: 600; margin: 6px 0 0; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { font-size: 12px; font-weight: 700; color: var(--ink3); text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line); vertical-align: bottom; }
td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line2); vertical-align: top; }
th.n, td.n { text-align: right; font-variant-numeric: tabular-nums; padding-left: 8px; }
.tw { overflow-x: auto; max-width: 100%; }
.tw table { min-width: 460px; }
caption { text-align: left; font-size: 12px; color: var(--ink3); padding-bottom: 6px; caption-side: top; }

/* predicted rows */
.rows { display: grid; gap: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 9px 0; border-top: 1px solid var(--line2); }
.row:first-child { border-top: 0; }
.row .nm { font-weight: 700; font-size: 13.5px; }
.row .cap { font-size: 12px; color: var(--ink3); }
.row .val { text-align: right; font-size: 18px; font-weight: 800; white-space: nowrap; }
.row .val small { font-size: 12px; font-weight: 600; color: var(--ink2); display: block; }
.row .nm { grid-column: 1; grid-row: 1; }
.row .cap { grid-column: 1; grid-row: 2; }
.row .val { grid-column: 2; grid-row: 1 / span 2; align-self: start; }
.row .bar { grid-column: 1 / -1; grid-row: 3; }
.row .why { grid-column: 1 / -1; grid-row: 4; font-size: 12px; color: var(--ink2); }
.row .why.w { color: var(--warn-ink); font-weight: 600; }
.row.weakrow { opacity: .62; }
.row.weakrow .val { color: var(--ink3); }
.lab-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: var(--ink2); }
.lab-chip svg { width: 14px; height: 12px; }
.band svg { width: 100%; height: 16px; }
.pvline { margin: 0; font-size: 13.5px; }
.pvbox { padding: 9px 0; border-top: 1px solid var(--line2); }
.pvbox:first-of-type { border-top: 0; }
.pvbox .nm { font-weight: 700; }
.pvbox .note { font-size: 12px; color: var(--ink2); margin: 3px 0 0; }
.pvbox .note.w { color: var(--warn-ink); font-weight: 600; }
.pvx { display: inline-block; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); font-size: 12px; font-weight: 700; background: var(--card1); }
.plist { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; }
.plist li { display: flex; justify-content: space-between; gap: 12px; }
.plist li span:first-child { color: var(--ink2); }

/* recommended */
.rec-big { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.rec-big .big { font-size: 34px; font-weight: 800; color: var(--rec-ink); letter-spacing: -.015em; line-height: 1.1; }
.rec-big .what { font-size: 13px; color: var(--ink2); }
.cases { display: grid; gap: 6px; margin: 10px 0 2px; }
.case { display: grid; grid-template-columns: 112px 1fr 42px; align-items: center; gap: 8px; font-size: 12.5px; }
.case .tr { height: 12px; border: 1px solid var(--rec); border-radius: 3px; position: relative; background: transparent; }
.case .tr i { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(135deg, var(--rec) 0 3px, transparent 3px 6px); opacity: .85; }
.case.pick .tr i { background: var(--rec); opacity: 1; }
.case .tr u { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--floor); }
.case b { text-align: right; font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: 1fr; gap: 0; margin: 10px 0 0; }
.kv > div { padding: 8px 0; border-top: 1px solid color-mix(in srgb, var(--rec) 28%, transparent); }
.kv .k { font-size: 12px; color: var(--ink3); font-weight: 600; }
.kv .v { font-size: 15px; font-weight: 700; }
.kv .v small { font-size: 12px; font-weight: 500; color: var(--ink2); display: block; margin-top: 1px; }
.warnline { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--ink); background: var(--warn-w); border: 1px solid var(--warn-line); border-radius: 8px; padding: 6px 9px; margin-top: 8px; }
.warnline svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }
.apply { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--rec); }
.apply button { width: 100%; min-height: 44px; font-weight: 800; font-size: 14px; border-radius: 10px; border: 1.5px dashed var(--ink3); background: repeating-linear-gradient(135deg, transparent 0 7px, var(--line2) 7px 14px); color: var(--ink3); cursor: not-allowed; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
.apply button svg { width: 16px; height: 16px; }
.apply p { margin: 6px 0 0; font-size: 12px; color: var(--ink2); }

/* confidence */
.score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.score .w { font-size: 26px; font-weight: 800; }
.score .n { font-size: 14px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.meter { margin-top: 8px; position: relative; height: 12px; border: 1.5px solid var(--ink3); border-radius: 3px; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--ink); }
.meter u { position: absolute; top: -3px; bottom: -3px; width: 1.5px; background: var(--card1); box-shadow: 0 0 0 1px var(--ink3); text-decoration: none; }
.mlab { display: grid; grid-template-columns: repeat(4, 1fr); font-size: 11px; color: var(--ink3); margin-top: 4px; text-align: center; }
.mlab span.on { color: var(--ink); font-weight: 800; }
.subs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; font-size: 12px; color: var(--ink3); }
.subs b { display: block; font-size: 15px; color: var(--ink); }
.ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--ink); }
.ul li { margin: 3px 0; }
.ul.nb { list-style: none; padding: 0; }
.muted { color: var(--ink3); }

/* anomalies */
.anom { display: grid; gap: 6px; }
.an { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: baseline; font-size: 13px; }
.sev { font-size: 11.5px; font-weight: 800; padding: 1px 8px; border-radius: 5px; border: 1.5px solid var(--ink3); white-space: nowrap; }
.sev.watch { border-color: var(--warn-line); background: var(--warn-w); }
.sev.abn { border-color: var(--floor); background: var(--floor-w); }
.ok-line { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink2); }
.ok-line svg { width: 16px; height: 16px; flex: none; }

/* why */
.why2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px 24px; }
.reason { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; padding: 8px 0; border-top: 1px solid var(--line2); font-size: 13px; }
.reason:first-child { border-top: 0; }
.rcode { font-size: 11px; font-weight: 700; color: var(--ink3); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; height: fit-content; white-space: nowrap; font-family: var(--mono); }
details { border-top: 1px solid var(--line2); }
details > summary { cursor: pointer; padding: 9px 0; font-weight: 700; font-size: 13px; list-style: none; display: flex; align-items: center; gap: 8px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--ink2); border-bottom: 2px solid var(--ink2); transform: rotate(-45deg); transition: transform .15s; margin: 0 3px 0 2px; }
details[open] > summary::before { transform: rotate(45deg); }
details > .dbody { padding: 2px 0 12px; }
pre { margin: 0; padding: 10px; background: var(--sunk); border: 1px solid var(--line2); border-radius: 8px; overflow: auto; max-height: 260px; font: 11px/1.45 var(--mono); max-width: 100%; }
.dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 12.5px; margin: 0 0 10px; }
.dl dt { color: var(--ink3); }
.dl dd { margin: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }

/* learning */
.pillrow { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-bottom: 8px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 8px; }
.sbtn { font-size: 12px; font-weight: 600; padding: 5px 10px; min-height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--card1); cursor: pointer; }
.sbtn[aria-pressed="true"] { background: var(--ink); color: var(--card1); border-color: var(--ink); }
.flag { font-size: 12px; font-weight: 700; color: var(--warn-ink); display: inline-flex; gap: 4px; align-items: center; }
.insights { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; }
.insights li { padding-left: 12px; border-left: 3px solid var(--ink3); }
.empty { font-size: 13px; color: var(--ink3); padding: 6px 0; }

.tail { font-size: 11.5px; color: var(--ink3); margin: 14px 2px 0; }

@container ecco (min-width: 560px) {
  .ecco-in { padding: 0 20px 22px; }
  .tiles { grid-template-columns: 1.4fr repeat(3, minmax(0, 1fr)); }
  .banner { padding: 12px 20px; }
  .kv { grid-template-columns: 1fr 1fr; gap: 0 18px; }
  .why2 { grid-template-columns: 1fr 1fr; }
}
@container ecco (min-width: 760px) {
  .grid { grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
  .g-full { grid-column: 1 / -1; }
  .g-7 { grid-column: span 7; }
  .g-5 { grid-column: span 5; }
  .g-6 { grid-column: span 6; }
  .side { display: grid; gap: 16px; align-content: start; }
  .row { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.2fr) auto; align-items: center; }
  .row .nm { grid-column: 1; grid-row: 1; }
  .row .cap { grid-column: 1; grid-row: 2; }
  .row .bar { grid-column: 2; grid-row: 1 / span 2; }
  .row .val { grid-column: 3; grid-row: 1 / span 2; }
  .row .why { grid-column: 1 / -1; grid-row: 3; }
  .row .bar { align-self: center; }
  .kv { grid-template-columns: 1fr; }
  .expects .lead { font-size: 21px; }
}
@container ecco (min-width: 980px) {
  .kv { grid-template-columns: 1fr 1fr; }
}
.side { display: grid; gap: 14px; align-content: start; min-width: 0; }
.learn { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.learn .tw table { min-width: 0; }
.nw { white-space: nowrap; }
@container ecco (min-width: 900px) { .learn { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; } }
@media (forced-colors: active) {
  .c-hatch, .c-band { forced-color-adjust: none; }
}
@media print { .lab { display: none; } }
</style>
</head>

const TZ = 'Europe/London';
const fT = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const fWd = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'short' });
const fWdL = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'long' });
const fDM = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, day: 'numeric', month: 'short' });
const fKey = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const fH = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', hourCycle: 'h23' });
const ms = (iso) => Date.parse(iso);
const T = (x) => fT.format(typeof x === 'number' ? x : new Date(x));
const key = (x) => fKey.format(typeof x === 'number' ? x : new Date(x));
const hourOf = (x) => parseInt(fH.format(x), 10);
const DAY = 86400e3;
function dayWord(x, ref) {
  const k = key(x), kr = key(ref);
  if (k === kr) return 'today';
  if (k === key(ref + DAY)) return 'tomorrow';
  if (k === key(ref - DAY)) return 'yesterday';
  return fWd.format(x);
}
/* "07:46" if same day as ref, else "07:46 tomorrow" */
function when(x, ref) { const d = dayWord(x, ref); return d === 'today' ? T(x) : T(x) + ' ' + d; }
function ago(min) {
  if (min < 1) return 'just now';
  if (min < 90) return Math.round(min) + ' min ago';
  if (min < 48 * 60) return Math.round(min / 6) / 10 + ' h ago';
  return Math.round(min / 1440) + ' days ago';
}
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r1 = (n) => (Math.round(n * 10) / 10).toFixed(1);
const r0 = (n) => String(Math.round(n));
/* Precision rule: totals of 20 kWh or more are shown to the whole kWh (their typical error is several kWh);
   everything else to 0.1 kWh. */
const kw = (n, ref) => (Math.abs(ref == null ? n : ref) >= 20 ? r0(n) : r1(n));
const pc = (n) => r0(n) + '%';

function power(w) { return Math.abs(w) < 1000 ? { v: r0(w), u: 'W' } : { v: r1(w / 1000), u: 'kW' }; }

        f.label = 'MEDIUM'; f.confidence = 0.62; f.n_days = 20; f.n_residuals = Math.min(f.n_residuals, 13); f.empirical_coverage = null;
        f.notes = f.notes.concat(['only 20 days of history: ranges widened until 28']);
      });
      rec.uncertainty = (rec.uncertainty || []).concat([{ code: 'FEW_DAYS', severity: 'MEDIUM', text: 'Only 20 days of history: forecast ranges are widened until ECCO has 28.' }]);
      r.weekday_effect = { n: 20, explained_variance: null, f_stat: null, material: false };
      break;
    }
    case 'ABNORMAL_DAY': {
      r.status = 'ABNORMAL_DAY';
      r.actual.load_w = 3640;
      r.anomalies = {
        abnormal_load_now: true, excess_kw_now: 1.4, base_load_kw: 0.95, base_load_norm_kw: 0.7,
        anomalies: [
          { code: 'SUSTAINED_HIGH_LOAD', severity: 'ABNORMAL', text: 'House load has been about 1.4 kW above its normal level for the last 3 hours (since 18:30).', value: 1.4, since: new Date(gen - 3 * 3600e3).toISOString() },
          { code: 'HIGH_OVERNIGHT_BASE', severity: 'WATCH', text: "Last night's base load was 0.95 kW versus a normal 0.70 kW (+250 W).", value: 0.25, since: null },
        ],
      };
      r.confidence = { overall: 0.8, label: 'HIGH', usage: 1, pv: 1, history_days: r.confidence.history_days };
      const before = rec.safe_export.kwh;
      rec.safe_export = { kwh: Math.floor(before * 5) / 10, kwh_before_reductions: before, reduced_for: ['abnormal load'], assumes_refill_in_cheap_window: true };
      setExportReason(`About ${r1(rec.safe_export.kwh)} kWh could be exported now while the pessimistic path still stays above ${rec.desired_min_pct}% until the cheap window opens (reduced for abnormal load).`, 'EXPORT');
      r.notes = r.notes.concat(['the abnormal load is assumed to persist for the next hours']);
      break;
    }
    case 'DATA_STALE': {
      r.status = 'DATA_STALE';
      r.actual.soc_age_s = 42 * 60;
      r.confidence = { overall: 0.3, label: 'LOW', usage: 0.3, pv: r.confidence.pv, history_days: r.confidence.history_days };
      r.notes = r.notes.concat(['history is 8 h old']);
      rec.uncertainty = (rec.uncertainty || []).concat([{ code: 'STALE_SOC', severity: 'HIGH', text: 'SOC reading is 42 min old; export advice is withheld.' }]);
      rec.safe_export = { kwh: 0, withheld_because: 'SOC reading is stale', assumes_refill_in_cheap_window: true };
      setExportReason('No export advice: SOC reading is stale.', 'EXPORT_WITHHELD');
      break;
    }
    case 'PV_UNDERPERFORMING': {
      r.status = 'PV_UNDERPERFORMING';
      r.pv.today_reanchor = { live_ratio: 0.54, weight: 0.7, factor: 0.68 };
      r.notes = r.notes.concat(['PV is running at 54% of the corrected forecast so far today']);
      break;
    }
    case 'SESSION': {
      const s0 = new Date(gen + 22.5 * 3600e3).toISOString(), e0 = new Date(gen + 23.5 * 3600e3).toISOString();
      rec.saving_session = { start: s0, end: e0, soc_at_start_median: 84.4, covered_from_battery_pessimistic: false, min_soc_start_to_cover: 90 };
      rec.reasons = rec.reasons.concat([{ code: 'SESSION', text: `Saving Session ${T(s0)}-${T(e0)}: the battery may not cover it from 84%; retain at least 90% at the start.` }]);
      break;
    }
    default: break;
  }
  r._synthetic = state;
  return r;
}

/* ======================================================================================================
   Derived values
   ====================================================================================================== */
const usable = (f) => f && (f.label === 'HIGH' || f.label === 'MEDIUM');
const shown = (f) => f && f.label !== 'INSUFFICIENT';
const weak = (f) => !f || f.label === 'LOW' || f.label === 'INSUFFICIENT';
/* shift a daily-repeating time (sunrise, useful PV start) by whole days until it is at or after `after` */
function nextOccurrence(iso, after) { let t = ms(iso); while (t < after) t += DAY; while (t - DAY >= after) t -= DAY; return t; }
function derive(rep, nowMs) {
  const gen = ms(rep.generated_for);
  const win = rep.recommended.overnight_target ? rep.recommended.overnight_target.window.map(ms) : null;
  const ref = win ? win[0] : gen;
  const p = rep.predicted;
  return {
    gen, now: nowMs, win,
    sunrise: p.sunrise ? nextOccurrence(p.sunrise, ref) : null,
    usefulPv: p.useful_pv_start ? nextOccurrence(p.useful_pv_start.p50, ref) : null,
    todayKey: key(gen),
    sunsetToday: p.sunset ? nextOccurrence(p.sunset, gen - 12 * 3600e3) : null,
  };
}

/* ======================================================================================================
   The "ECCO expects..." sentences, generated from the report (never hardcoded per scenario)
   ====================================================================================================== */
function narrative(rep, d) {
  const P = rep.predicted, R = rep.recommended, ot = R.overnight_target, X = R.predicted || {};
  const np = (t) => `<span class="np">${t}</span>`;
  const nr = (t) => `<span class="nr">${t}</span>`;
  const out = { lead: [], advice: [], caveat: [] };
  const conf = rep.confidence.label;

  /* demand */
  const ov = P.overnight, tp = P.to_useful_pv_from_now;
  if (conf === 'INSUFFICIENT' || (!shown(ov) && !shown(tp))) {
    out.lead.push(`ECCO does not have enough history to forecast demand yet (${rep.confidence.history_days} days; it needs 7).`);
  } else {
    const parts = [];
    if (shown(ov)) parts.push(`the house to use ${weak(ov) ? 'roughly ' : 'about '}${np(kw(ov.p50) + ' kWh')} overnight (range ${kw(ov.p10)} to ${kw(ov.p90)})`);
    if (shown(tp)) {
      const tu = ms(tp.t1), mins = (tu - d.gen) / 60e3;
      parts.push(`${shown(ov) ? 'and ' : 'the house to use '}${weak(tp) ? 'roughly ' : 'about '}${np(kw(tp.p50) + ' kWh')} ${shown(ov) ? 'in total ' : ''}from now until useful solar starts around ${esc(when(tu, d.gen))}` + (mins > 0 && mins < 120 ? ` (${Math.round(mins)} min away)` : ''));
    }
    out.lead.push('ECCO expects ' + parts.join(', ') + '.');
  }
  /* SOC */
  if (conf !== 'INSUFFICIENT' && (num(X.soc_at_sunrise_median) || num(X.soc_at_useful_pv_median))) {
    const bits = [];
    if (num(X.soc_at_sunrise_median) && d.sunrise) bits.push(`about ${np(pc(X.soc_at_sunrise_median))} at ${dayWord(d.sunrise, d.gen) === 'today' ? '' : (dayWord(d.sunrise, d.gen) + "'s ").replace('tomorrow', 'tomorrow')}sunrise (${esc(T(d.sunrise))})`.replace("tomorrow's sunrise", "tomorrow's sunrise"));
    if (num(X.soc_at_useful_pv_median)) bits.push(`about ${np(pc(X.soc_at_useful_pv_median))} when useful solar starts` + (num(X.soc_at_useful_pv_pessimistic) ? ` (${np(pc(X.soc_at_useful_pv_pessimistic))} on a poor night)` : ''));
    out.lead.push(`If the advice below were followed, the battery would be at ${bits.join(' and ')}.`);
  } else if (conf === 'INSUFFICIENT') {
    out.lead.push('It cannot predict the battery level reliably yet.');
  }
  /* PV */
  const pv = pvDays(rep, d).find((x) => x.when === 'tomorrow') || pvDays(rep, d)[0];
  if (pv && pv.fc.source !== 'none' && shown(pv.fc)) {
    if (num(pv.fc.raw_kwh) && num(pv.fc.ratio)) {
      const lower = pv.fc.ratio < 0.9, higher = pv.fc.ratio > 1.1;
      out.lead.push(`Solar ${pv.when}: ${lower ? 'expect' : higher ? 'expect' : 'expect'} ${weak(pv.fc) ? 'roughly ' : 'about '}${np(r0(pv.fc.p50) + ' kWh')}${lower || higher ? `, not the ${r0(pv.fc.raw_kwh)} kWh ${esc(srcName(pv.fc.source))} says (learned correction x${pv.fc.ratio.toFixed(2)})` : `, in line with ${esc(srcName(pv.fc.source))}`}.`);
    } else {
      out.lead.push(`Solar ${pv.when}: roughly ${np(r0(pv.fc.p50) + ' kWh')}, from recent days only (no forecast source to correct).`);
    }
  }
  /* advice */
  if (ot) {
    const w = `${esc(T(ot.window[0]))} to ${esc(T(ot.window[1]))}`;
    if (ot.grid_charge_needed) {
      let s = `Charge to ${nr(pc(ot.recommended_target_soc_pct))} in the cheap window (${w}), about ${nr(kw(ot.grid_charge_kwh_median) + ' kWh')} from the grid.`;
      if (ot.median_case_target_soc_pct < ot.recommended_target_soc_pct - 0.5) s += ` ${pc(ot.median_case_target_soc_pct)} would do on a typical night; ${pc(ot.pessimistic_case_target_soc_pct)} covers a poor one.`;
      out.advice.push(s);
    } else {
      out.advice.push(`No grid charging is needed: the battery should stay above the ${rec45(R)}% comfort level on its own (${nr('target ' + pc(ot.recommended_target_soc_pct))}).`);
    }
    if (!ot.feasible_on_pessimistic_path) {
      out.advice.push(`Even a full battery may fall short on a poor night: about ${nr(kw(ot.expected_import_after_charge_kwh_pessimistic) + ' kWh')} of peak-rate import.`);
    }
    if (ot.expected_import_before_window_kwh_pessimistic > 0.2) {
      out.advice.push(`Before the window opens, a poor night could already need about ${nr(kw(ot.expected_import_before_window_kwh_pessimistic) + ' kWh')} of peak-rate import; that is a risk to watch, not something the target changes.`);
    }
  } else {
    out.advice.push('No charging advice: ' + esc((R.reasons[0] || {}).text || 'not available') );
  }
  const se = R.safe_export;
  if (R.saving_session) {
    const ss = R.saving_session;
    out.advice.push(`A Saving Session runs ${esc(T(ms(ss.start)))} to ${esc(T(ms(ss.end)))} ${esc(dayWord(ms(ss.start), d.gen))}: ` + (ss.covered_from_battery_pessimistic ? 'the battery should cover it.' : `the battery may not cover it; keep at least ${nr(pc(ss.min_soc_start_to_cover))} at the start.`));
  }
  if (se) {
    if (se.withheld_because) out.advice.push(`No export advice: ${esc(se.withheld_because)}.`);
    else if (se.kwh > 0) out.advice.push(`About ${nr(kw(se.kwh) + ' kWh')} could be exported safely now` + (se.reduced_for ? ` (reduced for ${esc(se.reduced_for.join(', '))})` : '') + '.');
    else out.advice.push('No safe export now: the battery is needed to cover the night.');
  }
  /* caveats */
  if (rep.status !== 'LEARNING_NORMALLY' && STATUS[rep.status] && STATUS[rep.status].title) out.caveat.push(`Status: ${STATUS[rep.status].title.toLowerCase()}. See the note above.`);
  return out;
}
const rec45 = (R) => r0(R.desired_min_pct);
const srcName = (s) => ({ solcast: 'Solcast', persistence: 'recent days', none: 'no source' }[s] || s);

function pvDays(rep, d) {
  const out = [];
  Object.keys(rep.pv || {}).filter((k) => /^\d{4}-/.test(k)).sort().forEach((k) => {
    const fc = rep.pv[k];
    const isToday = k === d.todayKey;
    const isTomorrow = k === key(d.gen + DAY);
    if (isToday && d.sunsetToday && d.gen > d.sunsetToday) return; // the sun has set: today's solar is history
    out.push({ k, fc, when: isToday ? 'today' : isTomorrow ? 'tomorrow' : fWd.format(Date.parse(k + 'T12:00:00Z')), isToday });
  });
  return out;
}

/* ======================================================================================================
   State
   ====================================================================================================== */
const S = { scen: 'normal', force: '', age: 'fresh', theme: 'auto', acc: 'load_kwh:day', table: false, step: null };
const AGE_MIN = { fresh: 2, aging: 40, old: 240 };
const card = document.getElementById('card');
let REP = null, CTX = null;

function build() {
  const sc = SCEN.find((s) => s.id === S.scen);
  let state = sc.state || null;
  let baseKey = sc.base;
  if (S.force) { if (S.force === 'INSUFFICIENT_HISTORY') baseKey = 'cold'; state = S.force === 'INSUFFICIENT_HISTORY' ? null : S.force; }
  let rep = REPORTS[baseKey];
  rep = state ? mutate(rep, state) : clone(rep);
  const gen = ms(rep.generated_for);
  const ageMin = Math.max(AGE_MIN[S.age], 0);
  REP = rep;
  CTX = { d: derive(rep, gen + ageMin * 60e3), ageMin, ageKey: S.age, synthetic: !!state, scen: sc };
}

/* ======================================================================================================
   Card sections (each returns an HTML string)
   ====================================================================================================== */
function secBanner() {

}
function secHeader(rep, d) {

    <span class="pill ${st.tone}" role="status">${ICON[st.icon]}${esc(st.pill)}</span></div>

}

  }

  } else if (CTX.ageKey === 'old') {
    h += `<div class="callout t-hold" role="alert">${ICON.clock}<div><b>Report is ${esc(ago(CTX.ageMin).replace(' ago', ''))} old</b><p>Predictions and advice are greyed because they may no longer apply. Check that the ECCO Intelligence job is still running.</p></div></div>`;

}
function secExpects(rep, d) {
  const n = narrative(rep, d);

  const adv = n.advice.length ? `<div class="adv"><span class="tag">${ICON.dia}Shadow advice, not applied</span><p class="lead">${n.advice.join(' ')}</p></div>` : '';

    <div class="legend-inline" aria-label="How to read numbers"><span><span class="na">62%</span> solid: measured now</span><span><span class="np">~9 kWh</span> dashed underline: predicted</span><span><span class="nr">100%</span> highlighted: recommended</span></div></section>`;
}
function secActual(rep, d) {
  const a = rep.actual;

   <div class="tiles">
    <div class="tile"><div class="k">Battery charge</div><div class="v"><span aria-label="${r0(a.soc_pct)} percent">${r0(a.soc_pct)}<small>%</small></span></div>
      <div class="socbar" role="img" aria-label="Battery ${r0(a.soc_pct)} percent; minimum reserve ${r0(floor)} percent"><i style="width:${Math.max(0, Math.min(100, a.soc_pct))}%"></i><u style="left:${floor}%"></u><u class="c" style="left:${comf}%"></u></div>
      <div class="socleg"><span>0</span><span>floor ${r0(floor)}</span><span>100</span></div></div>

    <div class="tile"><div class="k">Solar (PV)</div><div class="v">${pv.v}<small>${pv.u}</small></div><div class="s">${num(a.pv_so_far_kwh) ? r1(a.pv_so_far_kwh) + ' kWh so far today' : ''}</div></div>
    <div class="tile na-tile" title="The report has no grid power field. The real card reads it from the live sensor (sensor.ecco_grid_power); this mock has no live sensors."><div class="k">Grid</div><div class="v">Live sensor only</div><div class="s">not in the report; mock shows no value</div></div>
   </div>

}

/* ---------------------------------------------------------------------------------------------- chart */
function chartModel(rep, d) {
  const tr = (rep.recommended.trajectory || []).map((p) => ({ t: ms(p.t), m: p.soc_median, lo: p.soc_low, hi: p.soc_high }));
  return tr;
}
function describeChart(rep, d, tr) {
  if (!tr.length) return 'No predicted battery path in this report.';
  const lowest = tr.reduce((a, b) => (b.m < a.m ? b : a));
  const lowLow = tr.reduce((a, b) => (b.lo < a.lo ? b : a));
  return `Predicted battery charge, now ${pc(rep.actual.soc_pct)} actual. Median path lowest at ${pc(lowest.m)} around ${when(lowest.t, d.gen)}. Pessimistic path lowest at ${pc(lowLow.lo)} around ${when(lowLow.t, d.gen)}, against a ${pc(rep.recommended.floor_pct)} minimum reserve. Cheap charging window ${d.win ? T(d.win[0]) + ' to ' + T(d.win[1]) : 'unknown'}.`;
}
function secChart(rep, d) {
  const tr = chartModel(rep, d);
  const isWeak = ['LOW', 'INSUFFICIENT'].includes(rep.confidence.label);
  const body = S.table ? chartTable(rep, d, tr) : `<div class="chwrap" id="chwrap" tabindex="0" role="group" aria-label="Battery charge chart. Use left and right arrow keys to step through predicted hours.">
      <div id="chsvg"></div><div class="tip" id="tip" role="status" aria-live="polite"></div></div>`;
  return `<section class="blk b-chart" aria-labelledby="h-chart"><div class="bh">${vc('pred', 'Predicted', 'battery path')}<h3 id="h-chart" class="sr">Battery charge: predicted path</h3><span class="hint">If the advice were followed. The only real value is the solid dot.</span>
    <button class="tbtn" id="tbtn" type="button" aria-pressed="${S.table}">${S.table ? 'Show chart' : 'Show table'}</button></div>
    ${body}
    ${isWeak ? `<p class="weak-note">Confidence is ${esc(rep.confidence.label.toLowerCase())}: treat this path as a rough shape, not a forecast.</p>` : ''}
    <div class="keys" aria-label="Chart key">
      <span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="4.5" class="c-dot"/></svg>Actual now</span>
      <span><svg viewBox="0 0 24 12"><path d="M1 6h22" class="c-med"/></svg>Predicted median</span>
      <span><svg viewBox="0 0 24 12"><rect x="1" y="1" width="22" height="10" class="c-band"/><path d="M4 11 10 1M10 11 16 1M16 11 22 1" class="c-hatch"/></svg>Pessimistic to optimistic range</span>
      <span><svg viewBox="0 0 24 12"><path d="M1 6h22" class="c-floor"/></svg>${r0(rep.recommended.floor_pct)}% minimum reserve</span>
      <span><svg viewBox="0 0 24 12"><path d="M1 6h22" class="c-comfort"/></svg>${r0(rep.recommended.desired_min_pct)}% comfort</span>
      <span><svg viewBox="0 0 24 12"><rect x="2" y="1" width="20" height="10" class="c-window"/></svg>Cheap window</span>
      <span><svg viewBox="0 0 24 12"><path d="M12 1 18 6 12 11 6 6Z" class="c-rec"/></svg>Recommended target</span>
    </div></section>`;
}
function chartTable(rep, d, tr) {
  const rows = tr.map((p) => `<tr><td>${esc(fWd.format(p.t))} ${esc(T(p.t))}</td><td class="n">${pc(p.m)}</td><td class="n">${pc(p.lo)}</td><td class="n">${pc(p.hi)}</td></tr>`).join('');
  return `<div class="tw"><table><caption>Predicted battery charge by hour (all values predicted; the actual now is ${pc(rep.actual.soc_pct)}).</caption><thead><tr><th>Time</th><th class="n">Median</th><th class="n">Pessimistic</th><th class="n">Optimistic</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function drawChart() {
  const host = document.getElementById('chsvg');
  if (!host) return;
  const rep = REP, d = CTX.d;
  const tr0 = chartModel(rep, d);
  const W = Math.max(280, Math.floor(host.clientWidth || host.parentElement.clientWidth || 340));
  if (!tr0.length) { host.innerHTML = '<p class="empty">No predicted battery path in this report.</p>'; return; }
  const H = W < 520 ? 300 : 330;
  const M = { l: 38, r: 14, t: 30, b: 84 };
  const now = d.gen, soc = rep.actual.soc_pct;
  const pts = [{ t: now, m: soc, lo: soc, hi: soc }].concat(tr0.filter((p) => p.t > now));
  const t0 = now - 1.5 * 3600e3, t1 = pts[pts.length - 1].t;
  const floor = rep.recommended.floor_pct, comf = rep.recommended.desired_min_pct;
  const minV = Math.min(...pts.map((p) => p.lo), floor);
  const ymin = Math.max(0, Math.floor((minV - 4) / 10) * 10), ymax = 100;
  const X = (t) => M.l + (t - t0) / (t1 - t0) * (W - M.l - M.r);
  const Y = (v) => M.t + (ymax - v) / (ymax - ymin) * (H - M.t - M.b);
  const pb = H - M.b;
  const isWeak = ['LOW', 'INSUFFICIENT'].includes(rep.confidence.label);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(describeChart(rep, d, tr0))}" class="${isWeak ? 'weak' : ''}"><title>Predicted battery charge</title>
   <defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="c-hatch"/></pattern></defs>`;
  /* cheap window */
  if (d.win) {
    const x0 = Math.max(M.l, X(d.win[0])), x1 = Math.min(W - M.r, X(d.win[1]));
    if (x1 > x0) {
      s += `<rect x="${x0}" y="${M.t}" width="${x1 - x0}" height="${pb - M.t}" class="c-window"/>`;
      const lab = `Cheap window ${T(d.win[0])} to ${T(d.win[1])}`;
      const short = x1 - x0 < 130;
      s += `<text x="${(x0 + x1) / 2}" y="${pb - 7}" text-anchor="middle" class="c-lbl">${short ? 'Cheap window' : lab}</text>`;
    }
  }
  /* grid + y ticks */
  for (let v = Math.ceil(ymin / 20) * 20; v <= 100; v += 20) {
    s += `<line x1="${M.l}" x2="${W - M.r}" y1="${Y(v)}" y2="${Y(v)}" class="c-grid"/><text x="${M.l - 6}" y="${Y(v) + 4}" text-anchor="end" class="c-txt">${v}%</text>`;
  }
  s += `<line x1="${M.l}" x2="${W - M.r}" y1="${pb}" y2="${pb}" class="c-axis"/>`;
  /* x ticks every 6 local hours */
  let tk = Math.ceil(t0 / 3600e3) * 3600e3;
  for (; tk <= t1; tk += 3600e3) {
    const h = hourOf(tk);
    if (h % 6) continue;
    const x = X(tk);
    if (x < M.l + 8 || x > W - M.r + 2) continue;
    s += `<line x1="${x}" x2="${x}" y1="${pb}" y2="${pb + 4}" class="c-axis"/>`;
    if (h === 0) s += `<line x1="${x}" x2="${x}" y1="${M.t}" y2="${pb}" class="c-grid"/>`;
    s += `<text x="${x}" y="${pb + 16}" text-anchor="middle" class="c-txt">${String(h).padStart(2, '0')}:00</text>`;
    if (h === 0) s += `<text x="${x}" y="${pb + 28}" text-anchor="middle" class="c-txt2" font-weight="700">${esc(fWd.format(tk + 3600e3))}</text>`;
  }
  /* comfort + floor */
  s += `<line x1="${M.l}" x2="${W - M.r}" y1="${Y(comf)}" y2="${Y(comf)}" class="c-comfort"/>`;
  s += `<line x1="${M.l}" x2="${W - M.r}" y1="${Y(floor)}" y2="${Y(floor)}" class="c-floor"/>`;
  s += `<text x="${W - M.r - 3}" y="${Y(comf) - 5}" text-anchor="end" class="c-lbl">${r0(comf)}% comfort</text>`;
  s += `<text x="${W - M.r - 3}" y="${Y(floor) - 5}" text-anchor="end" class="c-lbl">${r0(floor)}% minimum reserve</text>`;
  /* ribbon */
  const up = pts.map((p) => `${X(p.t).toFixed(1)},${Y(p.hi).toFixed(1)}`).join(' L');
  const dn = pts.slice().reverse().map((p) => `${X(p.t).toFixed(1)},${Y(p.lo).toFixed(1)}`).join(' L');
  s += `<path d="M${up} L${dn}Z" class="c-band"/><path d="M${up} L${dn}Z" fill="url(#hatch)"/>`;
  /* median */
  s += `<path d="M${pts.map((p) => `${X(p.t).toFixed(1)},${Y(p.m).toFixed(1)}`).join(' L')}" class="c-med"/>`;
  /* low-case below floor marker */
  const lowest = pts.reduce((a, b) => (b.lo < a.lo ? b : a));
  if (lowest.lo < floor) {
    const lx = X(lowest.t), ly = Y(lowest.lo);
    const anchor = lx > W - 90 ? 'end' : 'start';
    s += `<path d="M${lx - 5},${ly + 7} L${lx + 5},${ly + 7} L${lx},${ly - 2}Z" fill="var(--floor)" stroke="var(--halo)" stroke-width="1.5"/><text x="${lx + (anchor === 'end' ? -9 : 9)}" y="${ly + 8}" text-anchor="${anchor}" class="c-lbl">poor case ${pc(lowest.lo)}</text>`;
  }
  /* recommended target diamond */
  const ot = rep.recommended.overnight_target;
  if (ot && d.win && X(d.win[1]) <= W - M.r) {
    const dx = X(d.win[1]), dy = Y(Math.min(100, ot.recommended_target_soc_pct));
    s += `<path d="M${dx},${dy - 7} L${dx + 7},${dy} L${dx},${dy + 7} L${dx - 7},${dy}Z" class="c-rec"/><text x="${dx + 11}" y="${dy + 4}" class="c-lbl">target ${pc(ot.recommended_target_soc_pct)}</text>`;
  }
  /* now marker, actual dot */
  const nx = X(now);
  s += `<line x1="${nx}" x2="${nx}" y1="${M.t - 8}" y2="${pb}" class="c-now"/><text x="${nx + 6}" y="${M.t - 12}" class="c-lbl">Now: actual</text>`;
  s += `<circle cx="${nx}" cy="${Y(soc)}" r="5.5" class="c-dot"/><text x="${nx + 9}" y="${Y(soc) - 8}" class="c-lbl">${pc(soc)}</text>`;
  /* lane A: sunrise / sunset */
  const laneA = pb + 46, laneB = pb + 66;
  const sun = (x, up2, lab) => `<g><path d="M${x - 7},${laneA + 3} a7,7 0 0 1 14,0" class="c-sun"/><path d="M${x - 9},${laneA + 3}h18" class="c-sun"/><path d="${up2 ? `M${x},${laneA - 11}v-0` : ''}" class="c-sun"/><path d="${up2 ? `M${x - 3},${laneA - 6}l3,-3l3,3` : `M${x - 3},${laneA - 8}l3,3l3,-3`}" class="c-sun"/><text x="${x}" y="${laneA + 16}" text-anchor="middle" class="c-txt2">${lab}</text></g>`;
  const p = rep.predicted;
  if (p.sunrise) for (let k = -2; k <= 4; k++) { const t = ms(p.sunrise) + k * DAY; if (t >= t0 && t <= t1) { const x = X(t); if (x > M.l + 14 && x < W - M.r - 14) s += sun(x, true, T(t)); } }
  if (p.sunset) for (let k = -2; k <= 4; k++) { const t = ms(p.sunset) + k * DAY; if (t >= t0 && t <= t1) { const x = X(t); if (x > M.l + 14 && x < W - M.r - 14) s += sun(x, false, T(t)); } }
  /* lane B: useful PV */
  const u = p.useful_pv_start;
  if (u) for (let k = -2; k <= 4; k++) {
    const tp = ms(u.p50) + k * DAY, te = ms(u.early_p10) + k * DAY, tl = ms(u.late_p90) + k * DAY;
    if (tp >= now && tp <= t1) {
      const x = X(tp), xe = Math.max(M.l, X(te)), xl = Math.min(W - M.r, X(tl));
      const y = laneB + 14;
      s += `<line x1="${xe}" x2="${xl}" y1="${y}" y2="${y}" class="c-pvbar"/><line x1="${xe}" x2="${xe}" y1="${y - 4}" y2="${y + 4}" class="c-pvbar"/><line x1="${xl}" x2="${xl}" y1="${y - 4}" y2="${y + 4}" class="c-pvbar"/><circle cx="${x}" cy="${y}" r="4" fill="var(--card1)" stroke="var(--ink2)" stroke-width="1.8"/>`;
      const txt = T(te) === T(tl) ? `useful solar ~${T(tp)}` : `useful solar ~${T(tp)} (${T(te)} to ${T(tl)})`;
      const right = x < W * 0.55;
      s += `<text x="${right ? xl + 6 : xe - 6}" y="${y + 4}" text-anchor="${right ? 'start' : 'end'}" class="c-txt2">${W < 420 ? 'useful solar ~' + T(tp) : txt}</text>`;
    }
  }
  s += `<line id="xh" x1="0" x2="0" y1="${M.t}" y2="${pb}" class="c-cross" style="display:none"/><circle id="xhd" r="5" fill="var(--card1)" stroke="var(--pred)" stroke-width="2" style="display:none"/></svg>`;
  host.innerHTML = s;
  /* interaction: nearest predicted point */
  const wrap = document.getElementById('chwrap'), tip = document.getElementById('tip');
  const hp = tr0.filter((q) => q.t > now);
  const show = (i) => {
    S.step = i;
    const q = hp[i];
    const xh = document.getElementById('xh'), xd = document.getElementById('xhd');
    const x = X(q.t);
    xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.style.display = '';
    xd.setAttribute('cx', x); xd.setAttribute('cy', Y(q.m)); xd.style.display = '';
    tip.innerHTML = `<span class="tl">${esc(fWd.format(q.t))} ${esc(T(q.t))}, predicted</span><b>${pc(q.m)} <span class="tl" style="font-weight:500;font-size:12px">median</span></b><span><span class="sw"></span>pessimistic ${pc(q.lo)}, optimistic ${pc(q.hi)}</span>${q.lo < floor ? `<br><span class="tl">below the ${r0(floor)}% floor in the poor case</span>` : ''}`;
    tip.style.display = 'block';
    const tw = tip.offsetWidth;
    let left = x + 12; if (left + tw > wrap.clientWidth) left = x - tw - 12;
    tip.style.left = Math.max(0, left) + 'px'; tip.style.top = (M.t + 6) + 'px';
  };
  const hide = () => { tip.style.display = 'none'; const xh = document.getElementById('xh'), xd = document.getElementById('xhd'); if (xh) { xh.style.display = 'none'; xd.style.display = 'none'; } };
  const near = (clientX) => {
    const r = host.getBoundingClientRect(); const px = (clientX - r.left) * (W / r.width);
    let bi = 0, bd = 1e9; hp.forEach((q, i) => { const dd = Math.abs(X(q.t) - px); if (dd < bd) { bd = dd; bi = i; } }); return bi;
  };
  wrap.onpointermove = (e) => { if (hp.length) show(near(e.clientX)); };
  wrap.onpointerleave = () => { if (document.activeElement !== wrap) hide(); };
  wrap.onblur = hide;
  wrap.onkeydown = (e) => {
    if (!hp.length) return;
    let i = S.step == null ? -1 : S.step;
    if (e.key === 'ArrowRight') i = Math.min(hp.length - 1, i + 1);
    else if (e.key === 'ArrowLeft') i = Math.max(0, i < 0 ? 0 : i - 1);
    else if (e.key === 'Home') i = 0; else if (e.key === 'End') i = hp.length - 1; else if (e.key === 'Escape') { hide(); return; } else return;
    e.preventDefault(); show(i);
  };
}

/* ------------------------------------------------------------------------------------------ predicted */
function bandGlyph(f, tone) {
  const hi = f.p90 * 1.1 || 1;
  const x = (v) => (v / hi) * 100;
  return `<svg viewBox="0 0 100 16" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="100" y1="8" y2="8" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <rect x="${x(f.p10)}" y="3" width="${Math.max(1, x(f.p90) - x(f.p10))}" height="10" fill="var(--pred-w)"/><rect x="${x(f.p10)}" y="3" width="${Math.max(1, x(f.p90) - x(f.p10))}" height="10" fill="url(#hatch2)"/></svg>`;
}
function bandRow(f, w) {
  /* HTML-drawn so the circle stays round at any width */
  const hi = f.p90 * 1.1 || 1;
  const x = (v) => Math.max(0, Math.min(100, (v / hi) * 100));
  return `<div class="bandh" style="position:relative;height:18px" aria-hidden="true">
   <div style="position:absolute;left:0;right:0;top:8px;border-top:1px solid var(--line)"></div>
   <div style="position:absolute;left:${x(f.p10)}%;width:${Math.max(1, x(f.p90) - x(f.p10))}%;top:3px;height:12px;background:repeating-linear-gradient(135deg, ${w ? 'var(--ink3)' : 'var(--pred)'} 0 1px, transparent 1px 5px), ${w ? 'var(--line2)' : 'var(--pred-w)'}"></div>
   <div style="position:absolute;left:${x(f.p50)}%;top:4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--card1);border:2px solid ${w ? 'var(--ink3)' : 'var(--pred)'}"></div></div>`;
}
function noteText(f, d, kindUsefulPv) {
  const out = [];
  (f.notes || []).forEach((n) => {
    let m;
    if (f.label === 'INSUFFICIENT' && /^(short-term|band includes)/.test(n)) return;
    if ((m = n.match(/^short-term persistence adjustment ([+-][\d.]+) kWh/))) out.push(`Nudged ${m[1]} kWh for the last hour's demand.`);
    else if (/^band includes uncertainty in WHEN/.test(n)) { const u = d.usefulPv; out.push(`Range includes uncertainty in when useful solar starts${kindUsefulPv && REP.predicted.useful_pv_start ? ` (${T(nextOccurrence(REP.predicted.useful_pv_start.early_p10, d.gen - 3 * 3600e3))} to ${T(nextOccurrence(REP.predicted.useful_pv_start.late_p90, d.gen - 3 * 3600e3))})` : ''}.`); }
    else if (/^only \d+ days of history/.test(n)) out.push(cap1(n) + '.');
    else if (/^uncertainty from prior/.test(n)) out.push('Range is a wide default, not learned from this house yet.');
    else out.push(cap1(n) + '.');
  });
  return out;
}
function predRow(f, name, capTxt, d, extra, kindUsefulPv) {
  const wk = weak(f), none = f.label === 'INSUFFICIENT';
  const notes = noteText(f, d, kindUsefulPv);
  const why = none
    ? `No estimate yet. ${notes.filter((n) => !/^Range is a wide/.test(n)).join(' ')}`
    : wk ? `Low confidence: shown greyed. ${notes.join(' ')}` : notes.join(' ');
  return `<div class="row${wk ? ' weakrow' : ''}">
   <div class="nm">${esc(name)}</div><div class="cap">${esc(capTxt)} ${labelChip(f.label)}</div>
   ${none ? '' : `<div class="bar">${bandRow(f, wk)}</div>`}
   <div class="val">${none ? '<small style="font-size:14px;font-weight:600">No estimate yet</small>' : `<span aria-label="about ${kw(f.p50)} kilowatt hours, range ${kw(f.p10)} to ${kw(f.p90)}">~${kw(f.p50)} kWh</span><small>${kw(f.p10)} to ${kw(f.p90)}</small>`}</div>
   ${(why || extra) ? `<div class="why${wk ? ' w' : ''}">${esc(why)}${extra ? ' ' + extra : ''}</div>` : ''}</div>`;
}
function secPredicted(rep, d) {
  const P = rep.predicted;
  const rows = [];
  if (P.next_1h) rows.push(predRow(P.next_1h, 'Next hour', `${T(P.next_1h.t0)} to ${T(P.next_1h.t1)}`, d));
  if (P.to_useful_pv_from_now) rows.push(predRow(P.to_useful_pv_from_now, 'Until useful solar', `now to ${when(ms(P.to_useful_pv_from_now.t1), d.gen)}`, d, '', true));
  if (P.overnight) rows.push(predRow(P.overnight, 'Overnight', `${T(P.overnight.t0)} to ${when(ms(P.overnight.t1), d.gen)}`, d));
  if (P.day) {
    const soFar = num(P.day_so_far_kwh) && shown(P.day) ? `${r1(P.day_so_far_kwh)} kWh used so far today (actual).` : '';
    rows.push(predRow(P.day, 'Whole day', `${T(P.day.t0)} to 24:00`, d, soFar));
  }
  const more = [];
  if (P.cheap_window) more.push(predRow(P.cheap_window, 'Cheap-window demand', `${T(P.cheap_window.t0)} to ${T(P.cheap_window.t1)}`, d));
  if (P.morning) more.push(predRow(P.morning, 'Morning', `${T(P.morning.t0)} to ${T(P.morning.t1)}`, d));
  if (P.to_next_cheap) more.push(predRow(P.to_next_cheap, 'Until next cheap window', `${T(P.to_next_cheap.t0)} to ${when(ms(P.to_next_cheap.t1), d.gen)}`, d));

  /* solar */
  const pvs = pvDays(rep, d).map((x) => pvBox(x, rep, d)).join('');
  const rea = rep.pv && rep.pv.today_reanchor && pvDays(rep, d).some((x) => x.isToday) ? rep.pv.today_reanchor : null;
  const reaTxt = rea ? `<p class="pvbox note">Live check: solar so far is running at ${r0(rea.live_ratio * 100)}% of the corrected forecast. ECCO scaled the rest of today by x${rea.factor.toFixed(2)} (blend weight ${rea.weight.toFixed(2)}).</p>` : '';

  /* predicted battery points */
  const X = rep.recommended.predicted || {};
  const bl = [];
  const wl = (k, v) => bl.push(`<li><span>${k}</span><span class="np">${v}</span></li>`);
  if (num(X.soc_at_charge_end_median) && d.win) wl(`Battery when charging ends (${T(d.win[1])})`, '~' + pc(X.soc_at_charge_end_median));
  if (num(X.soc_at_sunrise_median) && d.sunrise) wl(`At sunrise (${when(d.sunrise, d.gen)})`, '~' + pc(X.soc_at_sunrise_median));
  if (num(X.soc_at_useful_pv_median) && d.usefulPv) wl(`When useful solar starts (${when(d.usefulPv, d.gen)})`, '~' + pc(X.soc_at_useful_pv_median) + (num(X.soc_at_useful_pv_pessimistic) ? `, poor case ~${pc(X.soc_at_useful_pv_pessimistic)}` : ''));
  if (num(X.min_soc_after_charge_median)) wl(`Lowest after charging (${X.min_soc_after_charge_time ? when(ms(X.min_soc_after_charge_time), d.gen) : ''})`, '~' + pc(X.min_soc_after_charge_median) + (num(X.min_soc_after_charge_pessimistic) ? `, poor case ~${pc(X.min_soc_after_charge_pessimistic)}` : ''));
  const ttf = X.time_to_floor_without_grid_charging;
  bl.push(`<li><span>Without grid charging, the ${r0(rep.recommended.floor_pct)}% minimum reserve is reached</span><span class="np">${ttf ? '~' + esc(when(ms(ttf), d.gen)) : 'not reached'}</span></li>`);
  const batt = rep.confidence.label === 'INSUFFICIENT' ? '<p class="empty">Battery path predictions need at least 7 days of history.</p>' : `<ul class="plist">${bl.join('')}</ul>`;

  return `<section class="blk b-pred g-7" aria-labelledby="h-pred"><div class="bh">${vc('pred', 'Predicted', 'with 80% ranges')}<h3 id="h-pred" class="sr">Predicted</h3><span class="hint">ECCO's forecast. Dot is the middle estimate; hatched bar is the range. Each bar has its own scale.</span></div>
   <div class="rows">${rows.join('')}</div>
   <details><summary>More windows</summary><div class="dbody"><div class="rows">${more.join('')}</div></div></details>
   <h4>Solar</h4>${pvs}${reaTxt}
   <h4>Battery, if the advice were followed</h4>${batt}</section>`;
}
function pvBox(x, rep, d) {
  const f = x.fc;
  const nm = x.isToday ? 'Today' : cap1(x.when);
  let line, notes = [];
  const wk = weak(f);
  if (f.source === 'none') {
    line = `No solar estimate: ECCO has no forecast source and no solar history yet.`;
  } else if (num(f.raw_kwh) && num(f.ratio)) {
    line = `${esc(srcName(f.source))} says <b>${r0(f.raw_kwh)} kWh</b>; ECCO expects <span class="np">~${r0(f.p50)} kWh</span> <span class="pvx" title="Learned correction factor: ECCO's expected PV divided by the raw forecast">x${f.ratio.toFixed(2)} learned</span>`;
  } else {
    line = `ECCO expects <span class="np">~${r0(f.p50)} kWh</span> from recent days only (no forecast source to correct)`;
  }
  const range = f.source === 'none' ? '' : `<p class="note">Range ${r0(f.p10)} to ${r0(f.p90)} kWh. ${labelChip(f.label)}${x.isToday && num(rep.actual.pv_so_far_kwh) ? ` Actual so far today: ${r1(rep.actual.pv_so_far_kwh)} kWh.` : ''}</p>`;
  (f.notes || []).forEach((n) => {
    let m;
    if ((m = n.match(/^PV band widened x([\d.]+): it only held (\d+)% of the last (\d+) days/))) notes.push(`Range widened x${m[1]} because it only held ${m[2]}% of the last ${m[3]} days.`);
    else if ((m = n.match(/^raw (\w+) forecast is unreliable here: trailing raw MAE ([\d.]+) kWh vs ([\d.]+) kWh after correction/))) notes.push(`Raw ${cap1(m[1])} has been off by ${m[2]} kWh on average; corrected, ${m[3]} kWh.`);
    else notes.push(cap1(n) + '.');
  });
  return `<div class="pvbox${wk ? ' weakrow' : ''}"><div class="nm">${nm}</div><p class="pvline">${line}</p>${range}${notes.length ? `<p class="note ${wk ? 'w' : ''}">${esc(notes.join(' '))}</p>` : ''}</div>`;
}

/* ---------------------------------------------------------------------------------------- recommended */
function secRecommended(rep, d) {

      sv = `<div class="v">${ss.covered_from_battery_pessimistic ? 'Battery should cover it' : 'Battery may not cover it'}<small>Saving Session ${esc(sw)}. Predicted ${pc(ss.soc_at_start_median)} at the start${ss.covered_from_battery_pessimistic ? '.' : `; keep at least ${pc(ss.min_soc_start_to_cover)} to be covered on a poor night.`}</small></div>`;
    } else sv = `<div class="v" style="font-weight:500;color:var(--ink2)">No Saving Session in the next period</div>`;
    body += `<div><div class="k">Saving Session cover</div>${sv}</div></div>`;
  }
  body += `<div class="apply"><button type="button" id="applybtn" aria-disabled="true" aria-describedby="applywhy" title="Not connected: ECCO Intelligence never writes to the inverter. The deterministic ESP safety layer stays in charge.">${ICON.lock}Apply recommendation</button>
    <p id="applywhy">Not connected: ECCO Intelligence never writes to the inverter. The deterministic ESP safety layer stays in charge.</p></div>`;

}

/* ------------------------------------------------------------------------------------------ confidence */
function secConfidence(rep, d) {
  const c = rep.confidence, L = LABELS[c.label] || LABELS.INSUFFICIENT;
  const ord = ['INSUFFICIENT', 'LOW', 'MEDIUM', 'HIGH'];
  const why = [], keep = [];
  if (c.history_days < 28) why.push(`Only ${c.history_days} days of history. ECCO needs 7 to forecast at all and 28 for full confidence.`);
  if (rep.status === 'DATA_STALE') why.push(`Data is stale, which caps confidence at 0.30.`);
  if (rep.anomalies && rep.anomalies.abnormal_load_now) why.push('Abnormal load right now lowers confidence by a fifth.');
  if (c.pv < 0.75) { const f = Object.keys(rep.pv || {}).filter((k) => /^\d{4}-/.test(k)).map((k) => rep.pv[k]).find((x) => weak(x) || x.confidence < 0.75); why.push(`Solar forecast trust is ${c.pv.toFixed(2)}${f && f.notes && f.notes.length ? ': ' + cap1(f.notes[0]) : ''}.`); }
  if (c.usage < 0.75 && c.history_days >= 28 && rep.status !== 'DATA_STALE') why.push(`Demand forecast trust is ${c.usage.toFixed(2)}.`);
  const lowF = Object.values(rep.predicted).filter((v) => v && v.kind && weak(v));
  if (lowF.length && c.history_days >= 7) why.push(`${lowF.length} forecast${lowF.length > 1 ? 's are' : ' is'} rated low.`);
  /* things to keep in mind even at HIGH */
  Object.keys(rep.pv || {}).filter((k) => /^\d{4}-/.test(k)).forEach((k) => (rep.pv[k].notes || []).forEach((n) => { const m = n.match(/^PV band widened x([\d.]+): it only held (\d+)%/); if (m && !keep.some((q) => q.startsWith('Solar ranges'))) keep.push(`Solar ranges were widened x${m[1]}: they only held ${m[2]}% of recent days.`); }));
  keep.push('Ranges are 80% ranges: about one outcome in five lands outside them.');
  const pvAcc = ACC.accuracy_last_7_days['pv_kwh:day'];
  if (c.history_days >= 28 && pvAcc && pvAcc.coverage < pvAcc.band_nominal - 0.2) keep.push(`Last 7 days, solar ranges held ${r0(pvAcc.coverage * 100)}% of the time against 80% intended (see Learning and accuracy).`);
  const sub = (k, v) => `<div><b>${v}</b>${k}</div>`;
  return `<section class="blk b-conf" aria-labelledby="h-conf"><div class="bh">${vc('conf', 'Confidence')}<h3 id="h-conf" class="sr">Confidence</h3></div>
   <div class="score"><span class="w">${L.w}</span><span class="n">${c.overall.toFixed(2)} on a 0 to 1 scale</span></div>
   <div class="meter" role="img" aria-label="Confidence ${c.overall.toFixed(2)} out of 1, ${L.w}"><i style="width:${c.overall * 100}%"></i><u style="left:25%"></u><u style="left:50%"></u><u style="left:75%"></u></div>
   <div class="mlab" aria-hidden="true">${ord.map((o) => `<span class="${o === c.label ? 'on' : ''}">${LABELS[o].w}</span>`).join('')}</div>
   <div class="subs">${sub('Demand', c.usage.toFixed(2))}${sub('Solar', c.pv.toFixed(2))}${sub('History', c.history_days + ' days')}</div>
   ${why.length ? `<h4>Why it is not high</h4><ul class="ul">${why.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
   ${why.length ? '' : '<p class="foot" style="margin-top:10px">Nothing is lowering confidence.</p>'}<h4 style="margin-top:${why.length ? 14 : 4}px">${why.length ? 'Also worth knowing' : 'Still worth knowing'}</h4><ul class="ul">${keep.map((w) => `<li>${esc(w)}</li>`).join('')}</ul></section>`;
}

/* -------------------------------------------------------------------------------------------- anomalies */
function secAnomalies(rep, d) {
  const A = rep.anomalies;
  let body;
  if (!A.anomalies.length) {
    body = `<div class="ok-line">${ICON.check}<span>No unusual load pattern. Overnight base load ${num(A.base_load_kw) ? r1(A.base_load_kw) + ' kW against a normal ' + r1(A.base_load_norm_kw) + ' kW' : 'not measurable yet (needs 14 nights)'}.</span></div>`;
  } else {
    const nice = { INFO: ['Info', ''], WATCH: ['Watch', 'watch'], ABNORMAL: ['Abnormal', 'abn'] };
    body = `<div class="anom">${A.anomalies.map((a) => `<div class="an"><span class="sev ${nice[a.severity][1]}">${nice[a.severity][0]}</span><span>${esc(a.text)}</span></div>`).join('')}</div>

}

/* -------------------------------------------------------------------------------------------------- why */
const REASON_NAME = { SHORTFALL: 'Shortfall risk', EXPORT: 'Export', EXPORT_WITHHELD: 'Export withheld', TARGET: 'Target', PRE_WINDOW_RISK: 'Before the window', PRE_WINDOW_FLOOR: 'Before the window', FLOOR_ETA: 'Floor ETA', SESSION: 'Saving Session', INSUFFICIENT_HISTORY: 'History', NO_SOC: 'No SOC', NO_WINDOW: 'No window' };
function secWhy(rep, d) {

}
function technical(rep, d) {
