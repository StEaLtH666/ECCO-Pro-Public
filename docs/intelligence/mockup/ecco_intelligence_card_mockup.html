  const frows = fcs.map((k) => { const f = P[k]; const wts = f.weights ? Object.keys(f.weights).map((e) => `${e} ${f.weights[e].toFixed(2)}`).join(', ') : ''; return `<tr><td>${esc(k)}</td><td class="n">${f.p10.toFixed(2)}</td><td class="n">${f.p50.toFixed(2)}</td><td class="n">${f.p90.toFixed(2)}</td><td>${esc(f.label)}</td><td class="n">${f.n_residuals}</td><td class="n">${num(f.empirical_coverage) ? f.empirical_coverage.toFixed(2) : 'n/a'}</td><td>${esc(wts)}</td></tr>`; }).join('');
  const pk = Object.keys(rep.pv || {}).filter((k) => /^\d{4}-/.test(k));
  const prows = pk.map((k) => { const f = rep.pv[k]; const f2 = (v, dp = 2) => (num(v) ? v.toFixed(dp) : 'n/a'); return `<tr><td>${esc(k)}</td><td>${esc(f.source)}</td><td class="n">${f2(f.raw_kwh)}</td><td class="n">${f2(f.ratio, 3)}</td><td class="n">${f2(f.p10)} / ${f2(f.p50)} / ${f2(f.p90)}</td><td class="n">${f.n_pairs}</td><td class="n">${f2(f.mae_corrected)} / ${f2(f.mae_raw)}</td><td class="n">${f.inflation}</td><td>${esc(f.label)}</td></tr>`; }).join('');
  const w = rep.weekday_effect || {};
  return `<details><summary>Technical detail</summary><div class="dbody">
   <dl class="dl"><dt>Model version</dt><dd>${esc(rep.model_version)}</dd><dt>Feature hash</dt><dd>${esc(rep.feature_hash || 'not present')}</dd><dt>Config hash</dt><dd>${esc(rep.config_hash)}</dd>
    <dt>Minimum battery reserve</dt><dd>${(rv => rv ? `your setting ${rv.user_reserve_pct}% (default 40%), technical minimum ${rv.technical_min_pct}%, effective ${rv.effective_pct}%` + (rv.override_reason ? ' - ' + esc(rv.override_reason) : '') : 'n/a')(rep.recommended.reserve)}</dd>
    <dt>Mode</dt><dd>${esc(rep.mode)}, applies_nothing=${rep.applies_nothing}</dd><dt>Generated (UTC)</dt><dd>${esc(rep.generated_for)}</dd>
    <dt>History</dt><dd>${rep.confidence.history_days} days; forecast records ${rep.forecast_records == null ? 'n/a' : rep.forecast_records}</dd>
    <dt>Weekday effect</dt><dd>${w.n ? `n=${w.n}, explained variance ${num(w.explained_variance) ? w.explained_variance.toFixed(3) : 'n/a'}, ${w.material ? 'material' : 'not material'}` : 'n/a'}</dd></dl>
   <div class="tw"><table><caption>Forecasts in kWh, with the engine's own labels (weights are the expert blend: fast, slow, median14)</caption><thead><tr><th>Forecast</th><th class="n">p10</th><th class="n">p50</th><th class="n">p90</th><th>Label</th><th class="n">n resid.</th><th class="n">Coverage</th><th>Expert weights</th></tr></thead><tbody>${frows}</tbody></table></div>
   <div class="tw" style="margin-top:12px"><table><caption>Solar forecasts by day</caption><thead><tr><th>Day</th><th>Source</th><th class="n">Raw kWh</th><th class="n">Ratio</th><th class="n">p10 / p50 / p90</th><th class="n">Pairs</th><th class="n">MAE corr. / raw</th><th class="n">Widen</th><th>Label</th></tr></thead><tbody>${prows}</tbody></table></div>
   <details><summary>Raw report JSON</summary><div class="dbody"><pre tabindex="0" aria-label="Raw report JSON">${esc(JSON.stringify(stripTraj(rep), null, 1))}</pre></div></details></div></details>`;
}
function stripTraj(rep) { const c = clone(rep); if (c.recommended && c.recommended.trajectory) c.recommended.trajectory = `[${c.recommended.trajectory.length} hourly points omitted here]`; return c; }

/* ------------------------------------------------------------------------------------------ accuracy */
const ACC_NAMES = { 'load_kwh:day': 'Whole-day demand', 'load_kwh:cheap_window': 'Cheap-window demand', 'load_kwh:next_1h': 'Next-hour demand', 'pv_kwh:day': 'Solar for the day', 'load_kwh:morning': 'Morning demand', 'load_kwh:overnight': 'Overnight demand', 'load_kwh:to_next_cheap': 'Until next cheap window', 'load_kwh:to_useful_pv_from_now': 'Until useful solar' };
const ACC_MAIN = ['load_kwh:day', 'load_kwh:cheap_window', 'load_kwh:next_1h', 'pv_kwh:day'];
const ACC_MORE = ['load_kwh:morning', 'load_kwh:overnight', 'load_kwh:to_next_cheap', 'load_kwh:to_useful_pv_from_now'];
function accRow(k) {
  const m = ACC.accuracy_last_7_days[k];
  if (!m) return '';
  const nom = m.band_nominal;
  const low = m.coverage < nom - 0.2;
  const bias = m.bias;
  const biasW = Math.abs(bias) < m.mae * 0.25 ? 'about even' : bias > 0 ? 'under-forecast' : 'over-forecast';
  return `<tr><td>${esc(ACC_NAMES[k] || k)}</td><td class="n">${m.n}</td><td class="n">${m.mae.toFixed(1)}</td><td class="n">${bias > 0 ? '+' : ''}${bias.toFixed(1)}<br><span class="muted nw" style="font-size:11px">${biasW}</span></td><td class="n">${r0(m.coverage * 100)}%${low ? `<br><span class="flag">${ICON.tri.replace('<svg', '<svg width="12" height="12"')}misses often</span>` : ''}</td></tr>`;
}
function accChart(k, W) {
  const rows = ACC.series_last_14[k];
  const H = 210, M = { l: 34, r: 8, t: 12, b: 36 };
  const vals = rows.flatMap((r) => [r.band_low, r.band_high, r.actual]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const step = (hi - lo) > 20 ? 10 : (hi - lo) > 8 ? 5 : (hi - lo) > 4 ? 2 : 1;
  lo = Math.floor((lo - 0.5) / step) * step; hi = Math.ceil((hi + 0.5) / step) * step;
  const iw = W - M.l - M.r, ih = H - M.t - M.b, n = rows.length, cw = iw / n;
  const X = (i) => M.l + cw * (i + 0.5), Y = (v) => M.t + (hi - v) / (hi - lo) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(ACC_NAMES[k])}: predicted versus actual for the last 14 days. ${rows.filter((r) => !r.in_band).length} of 14 actuals fell outside the predicted range."><defs><pattern id="hatch3" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="c-hatch"/></pattern></defs>`;
  for (let v = lo; v <= hi + 1e-9; v += step) s += `<line x1="${M.l}" x2="${W - M.r}" y1="${Y(v)}" y2="${Y(v)}" class="c-grid"/><text x="${M.l - 5}" y="${Y(v) + 4}" text-anchor="end" class="c-txt">${v}</text>`;
  rows.forEach((r, i) => {
    const x = X(i), bw = Math.min(14, cw - 4);
    s += `<rect x="${x - bw / 2}" y="${Y(r.band_high)}" width="${bw}" height="${Math.max(2, Y(r.band_low) - Y(r.band_high))}" class="c-band"/><rect x="${x - bw / 2}" y="${Y(r.band_high)}" width="${bw}" height="${Math.max(2, Y(r.band_low) - Y(r.band_high))}" fill="url(#hatch3)"/>`;
    s += `<circle cx="${x}" cy="${Y(r.predicted)}" r="3.6" fill="var(--card1)" stroke="var(--pred)" stroke-width="1.8"/>`;
    if (r.in_band) s += `<rect x="${x - 4}" y="${Y(r.actual) - 4}" width="8" height="8" class="c-dot"/>`;
    else s += `<rect x="${x - 4.5}" y="${Y(r.actual) - 4.5}" width="9" height="9" class="c-dot"/><rect x="${x - 9}" y="${Y(r.actual) - 9}" width="18" height="18" rx="3" fill="none" stroke="var(--floor)" stroke-width="2"/>`;
    const lab = dayLabel(r, k);
    s += `<text x="${x}" y="${H - M.b + 14}" text-anchor="middle" class="c-txt" ${r.in_band ? '' : 'font-weight="800" style="fill:var(--ink)"'}>${lab.d}</text>`;
    if (i === 0 || lab.wd === 'Mon') s += `<text x="${x}" y="${H - M.b + 27}" text-anchor="middle" class="c-txt">${lab.m}</text>`;
  });
  s += `<line x1="${M.l}" x2="${W - M.r}" y1="${H - M.b}" y2="${H - M.b}" class="c-axis"/><line id="axh" x1="0" x2="0" y1="${M.t}" y2="${H - M.b}" class="c-cross" style="display:none"/></svg>`;
  return { s, X, cw, n, M };
}
function dayLabel(r, k) {
  const m = r.target_end_local.match(/^(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)$/);
  let dt = Date.UTC(+m[1], +m[2] - 1, +m[3]);
  if (m[4] === '00' && m[5] === '00') dt -= DAY; // a "day" series ends at midnight: it describes the day before
  const dd = new Date(dt);
  return { d: dd.getUTCDate(), m: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dd.getUTCMonth()], wd: dd.toLocaleString('en-GB', { weekday: 'short', timeZone: 'UTC' }), full: dd.toLocaleString('en-GB', { weekday: 'long', day: 'numeric', month: 'short', timeZone: 'UTC' }) };
}
function secLearning(rep, d) {
  const st = STATUS[rep.status] || STATUS.LEARNING_NORMALLY;
  const none = rep.status === 'INSUFFICIENT_HISTORY';
  const pillTxt = rep.status === 'LEARNING_NORMALLY' ? 'Learning normally' : rep.status === 'INSUFFICIENT_HISTORY' ? 'Insufficient history' : rep.status === 'ABNORMAL_DAY' ? 'Abnormal day' : st.pill;
  const lineTxt = { LEARNING_NORMALLY: `${rep.confidence.history_days} days of history, learning normally.`, LEARNING: `${rep.confidence.history_days} days of history. Scores below come from a short record and will settle.`, INSUFFICIENT_HISTORY: 'Scoring starts after 7 days of history.', ABNORMAL_DAY: "Today looks unusual, so ECCO treats today's figures with extra caution.", DATA_STALE: 'Learning is waiting for fresh data.', PV_UNDERPERFORMING: 'Solar has been below forecast today; ECCO is scaling the rest of today down.' }[rep.status];
  let table, chart, ins;
  if (none) {
    table = `<p class="empty">No scored forecasts yet. The 7-day accuracy table appears once ECCO has scored a week of its own forecasts.</p>`;
    chart = `<p class="empty">The predicted-versus-actual chart appears once forecasts have been scored.</p>`;
    ins = `<ul class="insights"><li>No systematic bias found yet.</li></ul>`;
  } else {
    table = `<div class="tw"><table><caption>Last 7 days, kWh. MAE is the typical miss. Bias is actual minus predicted. Ranges are meant to hold 80% of the time.</caption><thead><tr><th>Forecast</th><th class="n">Scored</th><th class="n">Miss (MAE)</th><th class="n">Bias</th><th class="n">Range held</th></tr></thead><tbody>${ACC_MAIN.map(accRow).join('')}</tbody></table></div>
      <details><summary>More forecasts</summary><div class="dbody"><div class="tw"><table><tbody>${ACC_MORE.map(accRow).join('')}</tbody></table></div></div></details>`;
    chart = `<div class="seg" role="group" aria-label="Choose forecast to chart">${['load_kwh:day', 'load_kwh:cheap_window', 'pv_kwh:day'].map((k) => `<button type="button" class="sbtn" data-acc="${k}" aria-pressed="${S.acc === k}">${esc(ACC_NAMES[k])}</button>`).join('')}</div>
      <div class="chwrap" id="accwrap" tabindex="0" role="group" aria-label="Last 14 days predicted versus actual. Use arrow keys to step through days."><div id="accsvg"></div><div class="tip" id="acctip" role="status" aria-live="polite"></div></div>
      <div class="keys"><span><svg viewBox="0 0 24 12"><rect x="6" y="1" width="12" height="10" class="c-band"/><path d="M6 11 12 1M12 11 18 1" class="c-hatch"/></svg>Predicted range</span><span><svg viewBox="0 0 24 12"><circle cx="12" cy="6" r="4" fill="var(--card1)" stroke="var(--pred)" stroke-width="1.8"/></svg>Predicted</span><span><svg viewBox="0 0 24 12"><rect x="8" y="2" width="8" height="8" class="c-dot"/></svg>Actual</span><span><svg viewBox="0 0 24 12"><rect x="8" y="2" width="8" height="8" class="c-dot"/><rect x="5" y="-1" width="14" height="14" rx="3" fill="none" stroke="var(--floor)" stroke-width="2"/></svg>Outside the range</span></div>`;
    const insights = ACC.insights || [];
    ins = insights.length ? `<ul class="insights">${insights.map((t) => `<li>${esc(typeof t === 'string' ? t : t.text || JSON.stringify(t))}</li>`).join('')}</ul>` : `<ul class="insights"><li>No systematic bias found yet.</li></ul>`;
  }
  return `<section class="blk b-plain g-full" aria-labelledby="h-learn"><div class="bh"><h3 id="h-learn">Learning and accuracy</h3><span class="hint">How well past forecasts matched what happened${none ? '' : ' (example scorecard, 21:30 shadow runs)'}</span></div>
   <div class="pillrow"><span class="pill ${st.tone}">${ICON[st.icon]}${esc(pillTxt)}</span><span class="muted" style="font-size:13px">${esc(lineTxt)}</span></div>
   <div class="learn"><div>${table}${ins}</div><div>${chart}</div></div></section>`;
}
function drawAcc() {
  const host = document.getElementById('accsvg'); if (!host) return;
  const W = Math.max(260, Math.floor(host.clientWidth || host.parentElement.clientWidth || 320));
  const { s, X, cw, n, M } = accChart(S.acc, W);
  host.innerHTML = s;
  const rows = ACC.series_last_14[S.acc];
  const wrap = document.getElementById('accwrap'), tip = document.getElementById('acctip');
  const unit = 'kWh';
  const show = (i) => {
    const r = rows[i], lab = dayLabel(r, S.acc), ax = document.getElementById('axh');
    const x = X(i); ax.setAttribute('x1', x); ax.setAttribute('x2', x); ax.style.display = '';
    const isWin = S.acc === 'load_kwh:cheap_window' ? 'Cheap window ending' : S.acc === 'load_kwh:morning' ? 'Morning of' : 'Day of';
    tip.innerHTML = `<span class="tl">${esc(isWin)} ${esc(lab.full)}</span><b>Actual ${r.actual.toFixed(1)} ${unit}</b><span>Predicted ${r.predicted.toFixed(1)} (range ${r.band_low.toFixed(1)} to ${r.band_high.toFixed(1)})</span><br><span class="${r.in_band ? 'tl' : ''}" style="${r.in_band ? '' : 'font-weight:700'}">${r.in_band ? 'Inside the range' : 'Outside the range'}, ${r.error > 0 ? 'actual higher by ' : 'actual lower by '}${Math.abs(r.error).toFixed(1)}</span>`;
    tip.style.display = 'block';
    const tw = tip.offsetWidth; let left = x + 12; if (left + tw > wrap.clientWidth) left = x - tw - 12;
    tip.style.left = Math.max(0, left) + 'px'; tip.style.top = '10px'; S.accStep = i;
  };
  const hide = () => { tip.style.display = 'none'; const ax = document.getElementById('axh'); if (ax) ax.style.display = 'none'; };
  wrap.onpointermove = (e) => { const r = host.getBoundingClientRect(); const px = (e.clientX - r.left) * (W / r.width); show(Math.max(0, Math.min(n - 1, Math.floor((px - M.l) / cw)))); };
  wrap.onpointerleave = () => { if (document.activeElement !== wrap) hide(); };
  wrap.onblur = hide;
  wrap.onkeydown = (e) => {
    let i = S.accStep == null ? -1 : S.accStep;
    if (e.key === 'ArrowRight') i = Math.min(n - 1, i + 1); else if (e.key === 'ArrowLeft') i = Math.max(0, i < 0 ? 0 : i - 1); else if (e.key === 'Home') i = 0; else if (e.key === 'End') i = n - 1; else if (e.key === 'Escape') { hide(); return; } else return;
    e.preventDefault(); show(i);
  };
}

/* ======================================================================================================
   Render

      <div class="g-full">${secChart(rep, d)}</div>
      ${secPredicted(rep, d)}
      <div class="side g-5">${secRecommended(rep, d)}${secConfidence(rep, d)}</div>
      ${secAnomalies(rep, d)}
      ${secWhy(rep, d)}
      ${secLearning(rep, d)}
    </div>`}
    <p class="tail">${CTX.scen.real ? 'Engine output on a synthetic household (docs/intelligence/examples).' : 'Synthetic state demo: an engine report edited in JavaScript to show this state.'} Layout and wording are a mock.</p></div>`;
  card.querySelectorAll('.g-full').forEach(() => {});
  wire();
  drawChart(); drawAcc();
  const ab = document.getElementById('applybtn');
  if (ab) { ab.addEventListener('click', (e) => e.preventDefault()); ab.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') e.preventDefault(); }); }
  syncLab();
}
function wire() {
  const tb = document.getElementById('tbtn');
  if (tb) tb.addEventListener('click', () => { S.table = !S.table; refreshChart(); });
  card.querySelectorAll('[data-acc]').forEach((b) => b.addEventListener('click', () => { S.acc = b.dataset.acc; S.accStep = null; card.querySelectorAll('[data-acc]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.acc === S.acc))); drawAcc(); }));
}
function refreshChart() {
  const old = card.querySelector('.b-chart');
  const holder = old.parentElement;
  holder.innerHTML = secChart(REP, CTX.d);
  const tb = document.getElementById('tbtn'); tb.addEventListener('click', () => { S.table = !S.table; refreshChart(); }); tb.focus();
  drawChart();
}

/* ---------------------------------------------------------------------------- mock controls (the lab) */
const lab = document.getElementById('lab');
function buildLab() {
  const mk = (arr) => arr.map((s) => `<button type="button" class="chipbtn${s.real ? '' : ' syn'}" data-scen="${s.id}" aria-pressed="false" title="${s.real ? 'Engine output (synthetic household)' : 'Synthetic state demo: an engine report edited in JS'}">${esc(s.label)}${s.sub ? ` <span style="font-weight:400;opacity:.75">${esc(s.sub)}</span>` : ''}</button>`).join('');
  lab.innerHTML = `<h1>Mock controls (not part of the card)</h1><p>Pick a scenario. Solid-outline buttons are engine output on a synthetic household; dashed ones are synthetic state demos made by editing a copy of an engine report.</p>
   <div class="grp" role="group" aria-label="Engine scenarios"><span class="gl">Engine output</span>${mk(SCEN.filter((s) => s.real))}</div>
   <div class="grp" role="group" aria-label="Synthetic state demos"><span class="gl">Synthetic state demo</span>${mk(SCEN.filter((s) => !s.real))}</div>
   <div class="grp"><label>Force state <select id="force">${FORCE.map((f) => `<option value="${f.v}">${esc(f.t)}</option>`).join('')}</select></label>
     <label>Report age <select id="age"><option value="fresh">2 min (fresh)</option><option value="aging">40 min</option><option value="old">4 hours</option></select></label>
     <label>Theme <select id="theme"><option value="auto">Follow system</option><option value="light">Light</option><option value="dark">Dark</option></select></label></div>`;
  lab.querySelectorAll('[data-scen]').forEach((b) => b.addEventListener('click', () => { S.scen = b.dataset.scen; S.force = ''; S.step = null; S.accStep = null; render(); }));
  document.getElementById('force').addEventListener('change', (e) => { S.force = e.target.value; render(); });
  document.getElementById('age').addEventListener('change', (e) => { S.age = e.target.value; render(); });
  document.getElementById('theme').addEventListener('change', (e) => { S.theme = e.target.value; applyTheme(); });
}
function syncLab() {
  lab.querySelectorAll('[data-scen]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.scen === S.scen)));
  document.getElementById('force').value = S.force;
  document.getElementById('age').value = S.age;
}
function applyTheme() {
  const r = document.documentElement;
  if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme);
  try { localStorage.setItem('ecco-intel-mock-theme', S.theme); } catch (e) { /* storage may be blocked */ }
  if (REP) { drawChart(); drawAcc(); }
}

/* redraw charts when the card width changes (container-style responsiveness) */
let lastW = 0, raf = 0;
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => {
    const w = Math.round(card.clientWidth);
    if (Math.abs(w - lastW) < 2) return; lastW = w;
    cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawChart(); drawAcc(); });
  }).observe(card);
}
try { const t = localStorage.getItem('ecco-intel-mock-theme'); if (t) S.theme = t; } catch (e) { /* ignore */ }
buildLab();
document.getElementById('theme').value = S.theme;
applyTheme();
const q = new URLSearchParams(location.search);
if (q.get('s') && SCEN.some((s) => s.id === q.get('s'))) S.scen = q.get('s');
if (q.get('force')) S.force = q.get('force');
if (q.get('age')) S.age = q.get('age');
if (q.get('theme')) { S.theme = q.get('theme'); document.getElementById('theme').value = S.theme; applyTheme(); }
render();
if (q.get('y')) { window.scrollTo(0, +q.get('y')); }
if (q.get('open')) { document.querySelectorAll('details').forEach((x) => { x.open = true; }); }
window.__ecco = { render, S, SCEN, REPORTS, ACC };
})();

</script>
</body>
