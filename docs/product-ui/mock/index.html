<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'">
<title>ECCO Energy Plan - offline design mock</title>
<!--
  ECCO Energy Plan: OFFLINE DESIGN MOCK (phase 1).
  - Static HTML/JS. No network access (the Content-Security-Policy above forbids every fetch, socket and external file).
  - Fictional, generic data only. It is not connected to Home Assistant, the controller or an inverter, and it cannot be.
  - Every widget is tagged: "Works today" (an existing feature, shown with fictional values), "Proposal" (not a working
    feature), "Derived" (read-only view) or "Simulation" (fake backend for the design's test cases).
  The plan model (script#plan-model) is pure: no DOM, no clock, no randomness. test/plan-model.test.mjs runs its checks
  under Node; the "Cross-card checks" panel in Advanced runs the same checks in the page.
-->
<style>
:root{
  --bg:#0e1420;--surface:#151d2e;--surface-2:#1b2539;--surface-3:#222e46;--line:#2b3956;--text:#e9eefb;--muted:#9fadca;
  --charge:#4cc79f;--charge-soft:rgba(76,199,159,.16);--export:#f2b450;--export-soft:rgba(242,180,80,.16);
  --gap:#8c98ba;--danger:#ff8080;--danger-soft:rgba(255,128,128,.14);--warn:#ffd36e;--warn-soft:rgba(255,211,110,.13);
  --ok:#5ad6a0;--info:#8fb5ff;--on-info:#0b1220;--info-soft:rgba(143,181,255,.14);--focus:#9cc0ff;--radius:16px;--shadow:0 6px 24px rgba(0,0,0,.28);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: light){:root{
  --bg:#f2f4f9;--surface:#ffffff;--surface-2:#f3f6fb;--surface-3:#e9eef7;--line:#d7deec;--text:#17213a;--muted:#55627f;
  --charge:#0f7f59;--charge-soft:rgba(15,127,89,.11);--export:#9a5c00;--export-soft:rgba(154,92,0,.11);
  --gap:#66729a;--danger:#b42318;--danger-soft:rgba(180,35,24,.08);--warn:#8a5a00;--warn-soft:rgba(255,190,60,.16);
  --ok:#11794f;--info:#2d5bd7;--on-info:#ffffff;--info-soft:rgba(45,91,215,.09);--focus:#2d5bd7;--shadow:0 6px 20px rgba(23,33,58,.10);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--font)}
body{padding-bottom:180px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mockbar{background:repeating-linear-gradient(135deg,var(--warn-soft) 0 12px,transparent 12px 24px),var(--surface);
  border-bottom:1px solid var(--line);padding:8px 16px;font-size:13px;color:var(--text);text-align:center}
.mockbar b{color:var(--warn)}
header.app{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.app-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;letter-spacing:.06em}
.brand small{display:block;font-weight:500;letter-spacing:0;color:var(--muted);font-size:12px}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--line);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.dot.warn{background:var(--warn)}.dot.bad{background:var(--danger)}
nav.tabs{display:none}
main{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:17px;margin:0}
h3{font-size:15px;margin:0}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.card.inset{background:var(--surface-2);box-shadow:none}
.card-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card-h .grow{flex:1;min-width:160px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.tag.exists{background:var(--info-soft);color:var(--info);border-color:transparent}
.tag.proposal{background:repeating-linear-gradient(135deg,var(--warn-soft) 0 6px,transparent 6px 12px);color:var(--warn);border-color:var(--warn)}
.tag.derived{background:var(--surface-3);color:var(--muted)}
.tag.sim{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-3);color:var(--text);margin:2px 4px 2px 0}
.chip.charge{background:var(--charge-soft);color:var(--charge)}.chip.export{background:var(--export-soft);color:var(--export)}
.chip.draft{background:var(--info-soft);color:var(--info)}.chip.bad{background:var(--danger-soft);color:var(--danger)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.master{border-top:4px solid var(--charge)}
.master.exp{border-top-color:var(--export)}
.icon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.icon.charge{background:var(--charge-soft);color:var(--charge)}.icon.export{background:var(--export-soft);color:var(--export)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:8px 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.field{margin:12px 0}
.field label,.field .lbl{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px;margin-bottom:4px}
.field output{font-variant-numeric:tabular-nums;color:var(--text);font-weight:700}
.field .hint{font-size:12px;color:var(--muted);margin-top:3px}
.field .err{font-size:13px;color:var(--danger);background:var(--danger-soft);border-radius:8px;padding:6px 8px;margin-top:6px}
input[type=range]{width:100%;accent-color:var(--charge);min-height:28px}
.exp input[type=range]{accent-color:var(--export)}
input[type=number],input[type=time],select{width:100%;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:6px 10px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600;min-height:42px}
.btn.primary{background:var(--info);border-color:var(--info);color:var(--on-info)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.kv{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;flex:1;min-width:180px}
.note{border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0;background:var(--surface-2)}
.note.warn{background:var(--warn-soft)}.note.bad{background:var(--danger-soft)}.note.info{background:var(--info-soft)}
details{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
summary{cursor:pointer;font-weight:600;padding:6px 0;list-style-position:inside}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.ring{--p:50;width:116px;height:116px;border-radius:50%;flex:none;
  background:conic-gradient(var(--charge) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center}
.ring>div{width:92px;height:92px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.ring b{font-size:26px;line-height:1}
.flowph{border:2px dashed var(--line);border-radius:var(--radius);min-height:160px;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted)}
/* timeline */
.tl{position:relative;margin-top:8px;user-select:none}
.tl-axis{position:relative;height:18px;font-size:11px;color:var(--muted)}
.tl-axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tl-axis span:first-child{transform:none}
.tl-row{position:relative;height:46px;border-radius:10px;background:var(--surface-2);margin:4px 0;overflow:hidden}
.tl-row.plan{height:30px}
.tl-slot{position:absolute;top:0;bottom:0;border:0;border-right:2px solid var(--surface);background:var(--surface-3);color:var(--text);
  font-size:12px;padding:3px 6px;text-align:left;cursor:pointer;overflow:hidden;line-height:1.2}
.tl-slot.gc{background:var(--charge-soft);color:var(--charge);font-weight:600}
.tl-slot[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--focus)}
.tl-slot small{display:block;color:var(--muted);font-weight:500}
.tl-seg{position:absolute;top:4px;bottom:4px;border-radius:6px;font-size:11px;padding:2px 6px;overflow:hidden;white-space:nowrap;color:var(--text)}
.tl-seg.export{background:var(--export-soft);border:1px solid var(--export);color:var(--export)}
.tl-seg.gap{background:repeating-linear-gradient(135deg,var(--surface-3) 0 5px,transparent 5px 10px);border:1px dashed var(--gap);color:var(--muted)}
.tl-seg.charge{background:linear-gradient(90deg,var(--charge-soft),color-mix(in srgb,var(--charge) 35%,transparent));border:1px solid var(--charge);color:var(--charge)}
.tl-seg.buffer{background:repeating-linear-gradient(135deg,var(--charge-soft) 0 5px,transparent 5px 10px);border:1px dashed var(--charge);color:var(--muted)}
.tl-now{position:absolute;top:18px;bottom:0;width:2px;background:var(--danger);pointer-events:none}
.tl-now::before{content:"now";position:absolute;top:-16px;left:-12px;font-size:10px;color:var(--danger)}
.tl-soc{display:block;width:100%;height:70px;background:var(--surface-2);border-radius:10px;margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cycle{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
.cycle>div{flex:1;min-width:120px;border-radius:12px;padding:8px 10px;background:var(--surface-2);font-size:13px}
.cycle>div b{display:block;font-size:14px}
.cycle .c-ex{border-left:4px solid var(--export)}.cycle .c-gap{border-left:4px dashed var(--gap)}
.cycle .c-ch{border-left:4px solid var(--charge)}.cycle .c-buf{border-left:4px dashed var(--charge)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--danger);font-weight:700}
.reviewbar{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:30;width:min(640px,calc(100% - 24px));
  background:var(--surface);border:1px solid var(--info);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;display:flex;gap:10px;align-items:center}
.reviewbar .grow{flex:1;font-size:14px}
.sheet-bg{position:fixed;inset:0;background:rgba(5,8,15,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(760px,100%);max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 24px;border:1px solid var(--line)}
@media (min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin-bottom:6px}
.sheet ol,.sheet ul{padding-left:20px;margin:6px 0}
.sheet li{margin:4px 0}
.three{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.state-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.state-h .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-weight:700;font-size:13px}
.meter{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin-top:4px}
.meter>i{display:block;height:100%;background:var(--info)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:6px max(8px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom))}
.bottomnav button{flex:1;border:0;background:transparent;padding:6px 2px;border-radius:12px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;min-height:52px}
.bottomnav button span{display:block;font-size:20px;line-height:1.1}
.bottomnav button[aria-current="page"]{color:var(--text);background:var(--surface-2)}
@media (min-width:900px){
  body{padding-bottom:130px}
  .bottomnav{display:none}
  nav.tabs{display:flex;gap:4px}
  nav.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600}
  nav.tabs button[aria-current="page"]{background:var(--surface-2);color:var(--text)}
  nav.tabs button span{margin-right:6px}
  .reviewbar{bottom:20px}
}
@media (prefers-reduced-motion:no-preference){.seg button,.btn,.tl-slot{transition:background .15s,box-shadow .15s}}
</style>

<body>
<div class="mockbar" role="note"><b>Offline design mock.</b> Fictional data. Not connected to Home Assistant or an inverter, and it cannot send anything. Items tagged <b>Proposal</b> are not working features.</div>
<div id="app"></div>

<script id="plan-model">
/* ECCO Energy Plan model: pure functions, no DOM, no clock, no randomness. Fictional example data. */
(function (root) {
  'use strict';

  var LIMITS = Object.freeze({
    slots: 6, gridMin: 5, minSlotMin: 5,
    bufferMin: 0, bufferMax: 120, bufferStep: 5,
    gapMin: 10, gapMax: 120, gapStep: 5,
    chargeTargetMin: 20, chargeTargetMax: 100,
    chargePowerMin: 500, chargePowerStep: 100,
    exportStopSocMin: 10, exportStopSocMax: 90,
    exportPowerMin: 500, exportDurationMax: 240,
    provenExportCeilingW: 3000,
    rateHysteresisW: 500,
    applySpacingMin: 5,
    minChargeMinutes: 30
  });

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function toMin(s) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(s));
    if (!m) return NaN;
    var h = +m[1], mm = +m[2];
    return (h > 23 || mm > 59) ? NaN : h * 60 + mm;
  }
  function norm(min) { return ((Math.round(min) % 1440) + 1440) % 1440; }
  function fmt(min) { var m = norm(min); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function span(a, b) { return norm(b - a); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function ceilTo(x, s) { return Math.ceil(x / s - 1e-9) * s; }
  function floorTo(x, s) { return Math.floor(x / s + 1e-9) * s; }
  function kwh(w, minutes) { return w * minutes / 60000; }
  function pct(k, cap) { return k / cap * 100; }
  function round1(x) { return Math.round(x * 10) / 10; }
  function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  function fw(v) { return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + ' W'; }

  function exampleTou() {
    return [
      { start: '23:30', power: 5000, soc: 90, source: 'Grid' },
      { start: '05:00', power: 5000, soc: 15, source: 'None' },
      { start: '09:00', power: 5000, soc: 15, source: 'None' },
      { start: '13:00', power: 5000, soc: 15, source: 'None' },
      { start: '16:00', power: 5000, soc: 15, source: 'None' },
      { start: '19:00', power: 5000, soc: 15, source: 'None' }
    ];
  }
  function exampleCtx() {
    return {
      nowMin: 19 * 60 + 40, socNow: 78, capacityKwh: 12.0, learnedCapacityKwh: 12.4,
      pvNowW: 0, houseLoadW: 450, overnightLoadW: 300, chargeEff: 0.95, dischargeEff: 0.95,
      maxExportW: 3680, inverterMaxChargeW: 5000, planningReserveSoc: 40, haReserveSoc: 20, shutdownSoc: 10,
      batteryV: 52, batteryMaxChargeA: 100, gridChargeA: 100, maxGridChargeW: 5000,
      clockChangeNight: false, telemetryFresh: true, haOnline: true, activeLease: null,
      prices: { nowP: 28.0, exportP: 15.0, cheapImportP: 7.5, wearP: 3.0 },
      solar: { forecastKwh: 18, confidence: 0.45, onsetMin: 10 * 60 + 45, dayLoadKwh: 6.0, morningLoadW: 400 }
    };
  }
  function defaultPlan() {
    return {
      profile: 'normal',
      charge: { strategy: 'gentle', targetSoc: 90, bufferMin: 60, maxChargeW: 5000, stepped: false,
        day: { targetSoc: 60, byTime: '17:00' } },
      export: { enabled: true, stopSoc: 30, finishMode: 'before_charge', gapMin: 30, finishAt: '22:30' },
      summer: { enabled: false, minReserveSoc: 40, confidenceMin: 0.7, maxPreSolarKwh: 5, gapBeforePvMin: 30 }
    };
  }
  var PROFILES = {
    normal: { 'charge.targetSoc': 90, 'summer.enabled': false },
    summer: { 'charge.targetSoc': 70, 'summer.enabled': true }
  };
  function newState() {
    var tou = exampleTou();
    return { ctx: exampleCtx(), readback: { tou: tou },
      saved: { revision: 7, plan: defaultPlan(), basisTou: clone(tou) },
      draft: null, outcome: null, partial: null, log: [] };
  }
  /* export plans use the smaller capacity (the firmware stops at Stop SOC anyway); charge plans use the larger, so that a
     finish-by plan is not too slow */
  function usableKwh(c) { return Math.min(c.capacityKwh, c.learnedCapacityKwh || c.capacityKwh); }
  function chargeKwh(c) { return Math.max(c.capacityKwh, c.learnedCapacityKwh || c.capacityKwh); }

  /* ---------- the six-slot table ---------- */
  function validateTou(tou) {
    if (!Array.isArray(tou) || tou.length !== LIMITS.slots) return { ok: false, why: 'the table does not have six slots' };
    var st = tou.map(function (s) { return toMin(s.start); });
    for (var i = 0; i < st.length; i++) if (!isFinite(st[i]) || st[i] % LIMITS.gridMin !== 0) return { ok: false, why: 'a slot start is unreadable or off the 5-minute grid' };
    var total = 0;
    for (var k = 0; k < 6; k++) {
      var d = span(st[k], st[(k + 1) % 6]);
      if (d < LIMITS.minSlotMin) return { ok: false, why: 'slot ' + (k + 1) + ' is shorter than 5 minutes' };
      total += d;
    }
    if (total !== 1440) return { ok: false, why: 'the six starts are not one 24-hour cycle in slot order' };
    return { ok: true };
  }
  function slotSpans(tou) {
    return tou.map(function (s, i) { var a = toMin(s.start), b = toMin(tou[(i + 1) % 6].start); return { i: i, start: a, end: b, minutes: span(a, b) }; });
  }
  function slotAt(tou, t) {
    var sp = slotSpans(tou);
    for (var i = 0; i < sp.length; i++) if (span(sp[i].start, t) < sp[i].minutes) return i;
    return -1;
  }
  function chargeRuns(tou) {
    var st = tou.map(function (s) { return toMin(s.start); });
    var g = tou.map(function (s) { return s.source === 'Grid'; });
    if (!g.some(Boolean)) return [];
    if (g.every(Boolean)) return [{ slots: [0, 1, 2, 3, 4, 5], start: st[0], minutes: 1440 }];
    var runs = [];
    for (var i = 0; i < 6; i++) {
      if (g[i] && !g[(i + 5) % 6]) {
        var slots = [], j = i;
        while (g[j % 6]) { slots.push(j % 6); j++; }
        runs.push({ slots: slots, start: st[i], minutes: span(st[i], st[j % 6]) });
      }
    }
    return runs;
  }
  function nextRun(runs, now) {
    var best = null, key = Infinity;
    runs.forEach(function (r) {
      var k = span(r.start, now) < r.minutes ? -1 : span(now, r.start);
      if (k < key) { key = k; best = r; }
    });
    if (!best) return null;
    var out = clone(best); out.inProgress = key === -1; return out;
  }
  function firstChargeSlotHit(tou, start, duration) {
    /* same shape as the firmware's START check: every minute from start to start + duration inclusive */
    for (var k = 0; k <= duration; k++) {
      var i = slotAt(tou, start + k);
      if (i >= 0 && tou[i].source !== 'None') return i + 1;
    }
    return 0;
  }
  function crossesClockChangeHours(start, duration) {
    for (var k = 0; k <= duration; k += 5) if (norm(start + k) < 180) return true;
    return false;
  }

  /* ---------- derived plan ---------- */
  function deriveExport(state, plan, run) {
    var c = state.ctx, ex = plan.export, cap = usableKwh(c);
    var r = { enabled: !!ex.enabled, refusals: [], notes: [], warnings: [] };
    if (!r.enabled) return r;

  function focusKey(el) {
    if (!el || el === document.body || !app.contains(el)) return null;
    if (el.id) return '#' + el.id;
    var attrs = ['data-view', 'data-seg', 'data-slot', 'data-action', 'data-sim', 'data-conf', 'data-goto'];

    return null;
  }
  function focusFirstVisible(sel) {
    var list = app.querySelectorAll(sel);
    for (var i = 0; i < list.length; i++) if (list[i].offsetParent !== null) { list[i].focus(); return true; }
    return false;
  }

    if (ui.sheet === 'review') { var b = app.querySelector('.sheet .btn'); if (b) b.focus(); }
    else if (fk) focusFirstVisible(fk);
  }
  function refresh() {
    var d = M.derive(S);
    app.querySelectorAll('[data-region]').forEach(function (el) {
      var n = el.getAttribute('data-region'); if (!R[n]) return;
      var h = R[n](d); if (el.__h !== h) { el.innerHTML = h; el.__h = h; }
    });
    app.querySelectorAll('output[data-out-for]').forEach(function (o) {
      var p = o.getAttribute('data-out-for'), f = M.FIELDS[p], v = val(p);
      o.textContent = p === 'charge.maxChargeW' ? W(v) : p === 'summer.confidenceMin' ? Math.round(v * 100) + ' %' : v + (f.unit ? ' ' + f.unit : '');
    });
  }

  function doEdit(path, value, live) {
    var r = M.edit(S, path, value);
    if (!r.ok) { ui.errors[path] = r.error; render(); var el = document.getElementById('f-' + path.replace(/\./g, '-')); if (el) el.focus(); return; }
    delete ui.errors[path]; S = r.state;
    if (live) refresh(); else render();
  }
  app.addEventListener('input', function (e) {
    var t = e.target; if (!t.matches('input[type=range][data-field]')) return;
    doEdit(t.getAttribute('data-field'), t.value, true);
  });
  app.addEventListener('change', function (e) {
    var t = e.target, path = t.getAttribute('data-field'); if (!path || t.type === 'time') return;
    var v = t.type === 'checkbox' ? t.checked : t.value;
    var focusId = t.id;
    doEdit(path, v, false);
    var el = focusId && document.getElementById(focusId); if (el && !ui.errors[path]) el.focus();
  });
  app.addEventListener('focusout', function (e) {
    var t = e.target; if (!t.matches || !t.matches('input[type=time][data-field]')) return;
    /* commit without a full re-render, so that a button clicked right after leaving the field still receives the click */
    var path = t.getAttribute('data-field'); if (t.value && t.value !== val(path)) doEdit(path, t.value, true);
  });
  app.addEventListener('toggle', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-open-key'); if (k) ui.open[k] = e.target.open;
  }, true);
  app.addEventListener('click', function (e) {
    var t = e.target.closest('button, .sheet-bg'); if (!t) return;
    if (t.classList.contains('sheet-bg') && e.target !== t) return;
    var a = t.getAttribute('data-action');
    if (t.hasAttribute('data-view')) { ui.view = t.getAttribute('data-view'); ui.slot = null; render(); window.scrollTo(0, 0); return; }
    if (t.hasAttribute('data-goto')) { ui.view = 'controls'; ui.chargeTab = 'smart'; ui.slot = null; render(); var h = document.getElementById('h-charge'); if (h) h.scrollIntoView(); return; }
    if (t.hasAttribute('data-seg')) {
      var n = t.getAttribute('data-seg'), v = t.getAttribute('data-val');
      if (n === 'Charge Battery mode') ui.chargeTab = v; else if (n === 'Export to Grid mode') ui.exportTab = v;
      else if (n === 'Export finish') return doEdit('export.finishMode', v, false);
      else if (n === 'Energy plan profile') return doEdit('profile', v, false);
      render(); return;
    }
    if (t.hasAttribute('data-slot')) { var i = +t.getAttribute('data-slot'); ui.slot = ui.slot === i ? null : i; render(); return; }
    if (t.hasAttribute('data-conf')) { S = M.setCtx(S, 'solar.confidence', +t.getAttribute('data-conf')); render(); return; }
    if (t.hasAttribute('data-sim')) { sim(t.getAttribute('data-sim')); return; }
    if (a === 'review') { ui.sheet = 'review'; render(); return; }
    if (a === 'close-review') { ui.sheet = null; ui.returnFocus = '[data-action="review"]'; render(); return; }
    if (a === 'save') { S = M.saveDraft(S); ui.sheet = null; render(); return; }
    if (a === 'discard') { S = M.discard(S); ui.sheet = null; ui.errors = {}; render(); return; }
    if (a === 'clear-outcome') { S.outcome = null; render(); return; }
    if (a === 'close-slot') { ui.slot = null; render(); return; }
    if (a === 'anchor') { ui.anchor = ui.anchor === 720 ? 0 : 720; render(); return; }
