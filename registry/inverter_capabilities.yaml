  write_policy_reason: Coordinated multi-register transaction with mandatory snapshot/restore and cross-register
    verification - the canonical W2 example.
  notes: 'The requested NEW ''manual Grid Charge Now'' feature (Task 005 section 9) should reuse this exact
    mechanism rather than invent a new one - see docs/FREE_POWER_MANUAL_TRANSACTION_SPEC.md. restoration_possible
    (yes_live_proven) reflects the pre-PR#13/#14 live proof recorded in CURRENT_STATE.md, predating the
    durable snapshot/recovery hardening added in PR #13/#14. See recovery_implementation_status: that
    the post-hardening path is now live-proven: after PR #18 merged to main (`0a72b03a`), the exact merged
    firmware completed a 500 W / 1-minute live start→automatic-restore round trip on 2026-09-22.
 The later
    20-register V4 path from PR #27 was independently live-proven on 2026-09-24 using the exact merged
    build (`a39c8d3c`): a 500 W / 1-minute Start reached ACTIVE with register 244 matching the captured
    lease context, automatic timeout restore returned all owned values exactly to their originals,
    register 232 passed full-word internal reread verification, the durable marker cleared, Recovery
    State returned NONE, both locks released, and failures remained 0. See
    docs/FREE_POWER_LIVE_PROOF_2026-09-24.md. The expiry
    encountered a real Modbus-busy condition, correctly deferred, retried via the watchdog, performed the
    fresh-state restore classifier, and finished with the original state verified, snapshot cleared,
    start_attempts=1, start_successes=1, restore_successes=1, failures=0. 2026-09-23 (PR 1 of 3,
    feature/free-power-recovery-evidence, uncommitted): added free_power_recovery_review, a purely
    READ-ONLY operator recovery review/evidence mechanism - fresh reads of all 20 owned registers plus 9
    context registers (244, 245, 248, 250-255), a 64-bit FNV-1a evidence fingerprint, and several new
    read-only Home Assistant entities. It adds ZERO new Modbus writes (the write surface above is
    unchanged) and never touches the durable marker/data record - see
    docs/FREE_POWER_MANUAL_TRANSACTION_SPEC.md "Operator recovery review" and
    registry/tests/test_free_power_recovery_evidence.py. Force Restore Original and Accept Current State
    (the two actions an operator would take on this evidence) are separate, not-yet-implemented future
    PRs (2 and 3). 2026-09-23 (PR 2 of 3, feature/free-power-recovery-force-restore, uncommitted): added
    Force Restore Original - the first real recovery ACTION, reachable ONLY through the ESPHome API
    (free_power_recovery_execute), gated by a one-shot Free Power Recovery Arm switch (default OFF, never
    restored ON across reboot), a freshly-reviewed unexpired (120s, independently re-checked) evidence ID
    matching the PR 1 fingerprint exactly, and an exact confirmation phrase
    ("FORCE RESTORE ORIGINAL <evidence_id>", no trimming/case-folding). Every execute attempt - refused or
    successful - disarms the switch and invalidates the reviewed evidence exactly once, so a second attempt
    always needs a fresh Review. Before any write, it performs its OWN fresh confirm-time read of all 20
    owned + 9 context registers and recomputes the SAME canonical fingerprint; any mismatch (live state
    changed since Review) refuses with zero writes. It may run even when the live state matched NEITHER the
    original snapshot nor Free Power''s own intended state (the case the automatic restore path fails closed
    on) - it never guesses, derives a new baseline, or adopts a live value: every write is the exact durable
    ORIGINAL snapshot value, in the SAME protected order/gating restore_free_power_snapshot_dispatch already
    uses (232, then 256-261, then a MANDATORY positive readback of 256-261 before 268-279/230 may be touched,
    then a final full 20-register verify), reusing the identical two-phase durable Phase C/D marker-clear
    semantics on success. Any write/readback/final-verify failure fails closed: the durable RESTORE_REQUIRED
    obligation is retained, the SAME operator-needed durable lockout the repeated-verify-mismatch path uses
    is set (no automatic Force retry exists - Force is reachable only via a brand-new explicit API call), and
    a human must Review again. Implemented and offline-validated only (261 structural/behavioural checks in
    registry/tests/test_free_power_recovery_force_restore.py, including exhaustive fault injection over
    "acknowledged but not applied" writes and a dedicated regression guard proving a definite 268-279 write
    failure stops register 230 from being dispatched) - NOT live-proven; see recovery_implementation_status
    (implemented_not_live_proven, unchanged from PR 1 - this PR does not upgrade that level). 2026-09-24 (PR 3
    of 3, feature/free-power-recovery-accept-current-state, staged): added Accept Current State, the second and
    final recovery action - extends the SAME free_power_recovery_execute API action with a second token,
    ACCEPT_CURRENT_STATE, routed alongside FORCE_RESTORE_ORIGINAL without modifying Force''s own wrapper script at
    all (verified byte-for-byte unchanged). Accept means "the current live inverter configuration is intentional -
    retire the old recovery obligation and leave the inverter exactly as it is now", and makes ZERO Modbus writes
    on any path. It performs its own fresh confirm-time read (identical ranges to Review/Force, into dedicated
    buffers) and fingerprint revalidation, then freshly reclassifies LIVE against the durable ORIGINAL/INTENDED
    targets: a fresh ORIGINAL or INTENDED result refuses outright (Accept exists specifically for the NEITHER
    case). It then scans all 20 owned registers for Free Power "residue" (RESIDUE(r) = LIVE(r)==INTENDED(r) &&
    LIVE(r)!=ORIGINAL(r)) and refuses if any is found, so a partially-stranded Free Power overlay can never become
    permanent when the obligation is discarded - a register whose durable ORIGINAL already equalled INTENDED is
    exempted. It then checks plausibility against the SAME existing domains the rest of the firmware already uses
    (TOU Power ceiling, SOC 0-100, the 274-279 mode-field mask) - no new bounds invented, and registers 230/232/
    context are deliberately not bounds-checked. Only if every check passes does it move ECCO''s own durable
    recovery marker through the EXACT SAME Phase C (MARKER_RESTORE_VERIFIED_PENDING_CLEAR) / Phase D
    (MARKER_CLEAR) transition Force already uses - no new marker value, no new durable tag, no schema change
    (firmware/include/ecco_durable_snapshot.h untouched). It never writes the durable ORIGINAL snapshot fields
    and never copies live values into the durable record - the old snapshot is retired, not transformed; a future
    Free Power lease takes its own fresh snapshot. One-shot arm/evidence semantics are identical to Force. No
    automatic Accept caller exists anywhere (checked structurally for both the YAML script.execute: form and the
    C++/lambda id(...).execute() form). Implemented and offline-validated only (332 structural/behavioural checks
    in registry/tests/test_free_power_recovery_accept_current_state.py, including exhaustive per-register residue
    coverage across all 20 owned registers; several checks additionally re-run a real firmware-text check''s own
    assertion function against a deliberately corrupted in-memory copy of the source, proving that specific check
    has real discriminating power - see the test file''s own docstring for which checks are firmware-anchored
    versus reference-model-only) - NOT live-proven; recovery_implementation_status remains implemented_not_live_proven,
    unchanged from PR 1/PR 2 - this PR does not upgrade that level either. After PR 3 the only executable recovery
    action tokens anywhere in the firmware are exactly FORCE_RESTORE_ORIGINAL and ACCEPT_CURRENT_STATE.'
- id: dump_to_grid_transaction
  name: Manual Dump to Grid V1 (temporary battery export override)
  category: energy_management
  description: 'Battery -> grid export sibling of free_power_transaction (grid -> battery charge), added
    2026-09-26. IMPLEMENTED AND LOCALLY VALIDATED (offline tests, write-surface analysis, ESPHome config
    validation and compile) - NOT YET LIVE-PROVEN; no OTA or live inverter write has been performed for
    this feature. See docs/DUMP_TO_GRID_V1.md for the full design writeup.
    Write surface is exactly {244, 256-261} - deliberately smaller than Free Power''s 20 registers.
    start_dump_to_grid_override snapshots registers 244 and 256-261, durably commits that snapshot (two-phase
    ecco_durable::commit_record(), exactly like Free Power/register 244), then writes 256-261 (all six TOU
    Power slots overlaid to the requested export wattage) FIRST while register 244 is still its ORIGINAL
    value, positively rereads 256-261, and only then - LAST - writes register 244 to 0 (Allow Export),
    positively rereading that too. restore_dump_to_grid_snapshot reverses this: register 244 restored to
    its exact original FIRST (so further export is governed by the original policy immediately), then
    256-261 restored to their exact originals LAST, each step positively reread. This ordering (cap before
    enable on activation; disable before cap on restore) mirrors
    docs/SAFE_TRANSACTION_ENGINE_AUDIT_2026-09-21.md section 10.2 item 6''s conclusion for a hypothetical
    244+245 transaction, applied here to 244+256-261 instead. Registers 268-279 (six per-slot charge-target
    SOC / charge-source-and-mode fields) are deliberately NOT owned or written - see the "Why 268-279 is
    untouched" section of docs/DUMP_TO_GRID_V1.md. Not writing them is the conservative minimum-write-surface
    choice; their effect during a discharge/export lease is NOT characterised (2026-09-26 independent
    review: CURRENT_STATE.md''s Free Power ceiling/floor invariant treats 268-273 as per-slot SOC floors, so
    "unrelated to discharge" is not established - see that doc section); since the 2026-09-26 pre-live
    hardening START instead REFUSES (zero I/O) any lease whose window overlaps a TOU slot with a charge
    source set (274-279 bits 0-1, from the cached fresh config readback). Stop SOC (the user''s minimum
    battery percentage) is a pure-software floor checked every 15s against the existing trusted
    ecco_battery_soc sensor (register 184), failing closed on stale (>90s), implausible or NaN telemetry -
    it is never written to any inverter register and is deliberately excluded
    from the durable snapshot, so a reboot mid-lease ends the lease (treats it exactly like an explicit End
    request) rather than resuming SOC enforcement blind. A single boundary-crossing check with no
    hysteresis is used (documented as sufficient because the request latches "already ending", so there is
    no repeated re-triggering to oscillate). Recovery model is a deliberately simplified V1 relative to Free
    Power''s PR2/PR3 typed-confirmation-phrase machinery: there is NO pre-restore ORIGINAL/INTENDED/NEITHER
    classifier - every restore writes the snapshot back and verifies it by reread - and Force Restore
    Original and Accept Current State are each a single
    arm-then-press action (Dump to Grid Recovery Arm, one-shot) rather than a shared arm plus a typed
    confirmation phrase - Force Restore always writes the one unambiguous known-original snapshot (nothing
    to mistype), and Accept Current State performs zero Modbus I/O, exactly like Free Power''s equivalent
    actions. Mutual exclusion with Free Power and the register 244 standalone proof harness is bidirectional
    and mechanically checked: start_dump_to_grid_override refuses while free_power_active_persisted,
    free_power_snapshot_valid, free_power_operation_in_progress, reg244_snapshot_valid or
    reg244_apply_in_progress is true (in addition to its own dump_active_persisted/dump_snapshot_valid
    reentrancy checks and the shared manual_write_in_progress/correction_in_progress mutex); conversely
    start_free_power_override, apply_reg244_settings, restore_reg244_snapshot and all six
    apply_manual_slotN button guards were extended to refuse while dump_active_persisted or
    dump_snapshot_valid is true - see registry/tests/test_write_surface_invariants.py [7] for the
    mechanically-derived confirmation of both directions.'
  entity_ha_raw:
