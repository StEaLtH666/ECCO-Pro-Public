    register_width_words: 1
    datatype: bitfield_uint16
    signed: false
    byte_order: n/a
    scale: 1
    unit: null
  current_access: read_write
  firmware_evidence: 'read: manual_cfg_reg274_raw, decode via tou_mode() lambda; write path shares apply_manual_slot1
