    registry/tests/test_write_surface_invariants.py [1], [2b], [7], [9]. Offline transaction-logic tests:
    registry/tests/test_dump_to_grid_v1.py.'
  ha_evidence: home-assistant/packages/ecco_dump_to_grid_schedule.yaml
  safe_min: 500
  bounds_note: safe_max is the same ${ecco_inverter_tou_power_ceiling_w} (8000W) hardware/site substitution
    Free Power and every TOU Power field already use, since Dump-to-Grid overlays the identical registers.
    Stop SOC is bounded 10-90% - a deliberate conservative UI guard, not a measured hardware limit (none is
    documented for this inverter/battery pair) - see docs/DUMP_TO_GRID_V1.md "Stop SOC".
  limits:
    hardware:
      value: 8000
      unit: W
      source: ESPHome number bound, firmware/ecco_clock_dongle_stage3_4_free_power.yaml, ${ecco_inverter_tou_power_ceiling_w}
    operating:
      note: duration 1-240 minutes and Stop SOC 10-90% are ESPHome number bounds, not power ceilings - see
        safe_min/bounds_note for the power range
    effective:
      rule: hardware_only
      note: Dump-to-Grid has no dedicated live operating-limit entity distinct from the shared hardware
        ceiling, unlike grid_charge_current's amp computation on the Free Power side (Dump-to-Grid writes
        TOU Power directly in watts, with no current/voltage conversion step)
  exact_reread_verification_possible: true
  verification_tolerance: 'exact for every owned register - 244 and 256-261 - gating both restore and
    activation completion. A third party (SmartDeye, front panel, another Modbus master) CAN still change
    244 or 256-261 mid-lease; ECCO''s own manual TOU/reg244 writers are locked out during a lease via the
    mutual-exclusion checks described above, but external actors are not. Such a change is owned-state
    drift. Since the 2026-09-26 pre-live hardening it IS detected while ACTIVE, with no extra Modbus
    traffic: the 15s watchdog compares the ordinary 60s configuration poll''s cached 244/256-261 readback
    - only a sample whose cfg_block_b_seq is newer than the ACTIVE commit and no older than 180s - with
    the lease (244 = 0, 256-261 = the latched power) and ends the lease (CONFIG DRIFT) through the common
    restore path on any mismatch; no post-activation readback for 180s ends it too (CONFIG READBACK
    STALE). The restore itself still does not pre-read - it writes the snapshot back and its reread only
    proves that write landed; a mismatch AFTER the restore write triggers the retry/lockout path.'
  multi_register_write: true
  snapshot_required: true
  restoration_possible: yes_via_dedicated_persisted_snapshot
  recovery_implementation_status: implemented_not_live_proven
  safety_impact: 'Second-highest-impact write capability after Free Power: temporarily forces the export
    policy to Allow Export and raises/lowers the native battery discharge/export ceiling (TOU Power,
    256-261) to the requested wattage. Guarded by: battery voltage sanity check (40-65V), a hard Stop SOC
    floor checked every 15s against the trusted battery SOC sensor (fails closed - triggers End & Restore -
    on stale, unavailable, implausible or NaN telemetry), mutual exclusion with Free Power, the register 244 standalone
    harness, manual TOU writes and RTC correction, a persisted snapshot-valid flag surviving reboot for
    recovery, and an interval-driven watchdog that auto-restores on timeout, on Stop SOC being reached, or
    on detecting an interrupted snapshot - with unbounded comms-backoff-paced retry for comms failures and a
    fail-closed operator lockout (Force Restore Original / Accept Current State) only after a second
    consecutive verify mismatch. Since the 2026-09-26 pre-live hardening also: a measured-power runaway
    guard (battery discharge, register 190, above requested + max(requested/2, 750W) for 3 consecutive
    fresh samples after a 30s settling grace -> POWER RUNAWAY end; evidence-based on the 2026-09-22/23
    flight recordings, gross-runaway only, inert near the inverter maximum), active drift detection, a
    START refusal for any lease overlapping a TOU slot with a charge source set, and an Accept Current
    State residue gate (zero I/O; refused while a fresh post-operation readback still shows Allow Export
    in a non-original configuration). An ESP that stays offline still leaves the export override in
    force with no ECCO end or Stop SOC until the ESP returns.'
  dependencies:
    capabilities:
    - grid_export_policy
    - tou_slot_1_power
    - tou_slot_2_power
    - tou_slot_3_power
    - tou_slot_4_power
    - tou_slot_5_power
    - tou_slot_6_power
    - battery_soc
  implementation_status: implemented
  live_proof_status: documented_not_live_proven
  write_policy: W2
  write_policy_reason: Coordinated multi-register transaction with mandatory snapshot/restore and
    cross-register verification - the same class as free_power_transaction, W2 for the same reason.
  notes: 'Supersedes the earlier registry/transaction_state_machine.py placeholder declaration
    "battery_export_NOT_IMPLEMENTED" (which named registers {244, 245}) - register 245 turned out not to
    be needed; see this record''s description for why. Built per the Manual Dump-to-Grid V1 task
