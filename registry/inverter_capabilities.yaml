# ECCO Pro - authoritative inverter capability registry (schema v2)
#
# One record per independently-addressable ECCO capability. This is a
# DESIGN/AUDIT artifact. It does not execute anything and nothing in
# this repository currently reads it to perform a write - see
# docs/INVERTER_CAPABILITY_REGISTRY.md for the full field schema,
# write policies, and evidence levels used below, and
# docs/SAFE_WRITE_TRANSACTION_ARCHITECTURE.md for how a W1/W2/W3
# capability would eventually be written safely.
#
# Schema v2 (Task 005A) replaced the original Task 005 schema after
# review: `write_policy` (R0/W1/W2/W3/WX) is now independent of
# `current_access` (read_only/read_write/write_only); `modbus.registers`
# is always a structured list of {address, bits?, shared_with?} entries
# rather than a free-text escape hatch; `limits` structures the
# hardware/operating/effective ceiling model where it genuinely
# applies; `dependencies` splits capability/entity/flag references.
# Several previously-grouped records (six-slot TOU fields, battery
# configuration, PV strings, grid protection thresholds, energy
# counters) were exploded into one record per independently-addressable
# value - see docs/INVERTER_CAPABILITY_REGISTRY.md "Grouped records"
# for what grouping remains and why.
#
# Evidence values used in this file: live_proven_read, live_proven_write,
# documented_not_live_proven, repository_inferred_read_only,
# inferred_do_not_write, unknown.
#
# Write policies: R0 (no ECCO write intended), W1 (simple manual write),
# W2 (coordinated multi-register write), W3 (known high-impact
# candidate, disabled until a write path is specifically proven - may
# be current_access: read_only today), WX (unknown/insufficient
# evidence/prohibited). Default is WX or R0 - nothing here is
# automatically writable, and no automatic control logic exists.
#
# Source: firmware/ecco_clock_dongle_stage3_4_free_power.yaml (Stage
# 3.4, the current live firmware per VERSION.yaml) unless noted
# otherwise. Register numbers are decimal Modbus holding-register
# addresses read via `modbus_client.read_holding_registers` /
# `write_multiple_registers` with slave address 0x01. This firmware's
# COMPLETE write surface (every write_multiple_registers start_address
# in the file) is registers 22-24, 230, 232, 244, 250-261, 268-279 and
# nothing else - see docs/INVERTER_CAPABILITY_REGISTRY.md "Full write
# surface" for how this was confirmed. Register 244 was added on
# 2026-09-21 (PR #12, live-hardware-proven). Register 245 (Export
# Limit) is NOT in this set and has no write path.
#
# This list is verified mechanically by
# registry/tests/test_write_surface_invariants.py against the firmware
# source, so it cannot go stale unnoticed again.
#
# entity_ha_raw follows the pattern sensor.ecco_clock_dongle_<slug>
# unless stated otherwise - "ecco_clock_dongle" is this specific
# installation's ESPHome device/area slug, not a portable constant.

schema_version: 2
capabilities:
- id: rtc_clock
  name: Inverter RTC (date/time)
  category: rtc
  description: Inverter's onboard real-time clock, corrected from NTP when drift exceeds a threshold.
    Registers 22-24 pack (year-2000,month), (day,hour), (minute,second) as big-endian byte pairs per register.
  entity_ha_raw:
  - text_sensor.ecco_clock_dongle_inverter_time
  esphome_component:
  - text_sensor.inverter_clock
  - button.sync_inverter_clock
  modbus:
    registers:
    - address: 22
    - address: 23
    - address: 24
    register_width_words: 3
    datatype: packed_uint16_pairs
    signed: false
    byte_order: unknown
    scale: 1
    unit: null
  current_access: read_write
  firmware_evidence: firmware/ecco_clock_dongle_stage3_4_free_power.yaml:2538-2546 (write), button.read_inverter_clock
    block (read)
  ha_evidence: home-assistant/packages/ecco_pro.yaml (RTC fields not separately canonicalised; text_sensor
    only)
  safe_min: null
  safe_max: null
  bounds_note: valid Gregorian date/time only (register packing supports year 2000-2255)
  field_bounds:
  - field: year_offset (register 22 high byte, actual year = 2000 + this value)
    min: 0
    max: 255
  - field: month (register 22 low byte)
    min: 1
    max: 12
  - field: day (register 23 high byte)
    min: 1
    max: 31
  - field: hour (register 23 low byte)
    min: 0
    max: 23
  - field: minute (register 24 high byte)
    min: 0
    max: 59
  - field: second (register 24 low byte)
    min: 0
    max: 59
  exact_reread_verification_possible: true
  verification_tolerance: drift threshold ~20s (CURRENT_STATE.md); exact reread of registers 22-24 after
    write
  multi_register_write: true
  snapshot_required: false
  restoration_possible: not_applicable
  recovery_implementation_status: not_required
  safety_impact: Low direct impact (does not affect power flow), but RTC accuracy gates the TOU schedule's
    time-of-day matching indirectly through the inverter's own scheduler - a badly wrong clock could shift
    when TOU slots are considered active. This is exactly why the RTC write has its own dedicated interlock
    (correction_in_progress) that blocks concurrent manual writes and vice versa.
  dependencies:
    flags:
    - manual_write_in_progress interlock (mutually exclusive with all other writes)
  implementation_status: implemented
  live_proof_status: live_proven_write
  write_policy: W2
  write_policy_reason: Multi-register (3), requires the retry-once/cooldown sequence already proven live.
    Classified W2 rather than W1 purely because it is a coordinated 3-register transaction, not because
    of value risk - this is the existing proven pattern the new transaction architecture (docs/SAFE_WRITE_TRANSACTION_ARCHITECTURE.md)
    is modelled on, not a new capability being proposed.
  notes: This capability's write path is NOT to be altered by this task's new transaction architecture
    - "preserve existing RTC behaviour" is an explicit constraint. Documented here for completeness and
    as the architecture's reference example, not as something up for change.
- id: tou_slot_1_start_time
  name: TOU Slot 1 Start Time
  category: tou_schedule
  description: 'Slot 1 grid-charge window start time (HHMM packed). Baseline (2026-09-15): 00:35.'
  entity_ha_raw:
  - text_sensor.ecco_clock_dongle_ecco_timezone1_time
  entity_ha_canonical:
  - sensor.ecco_tou_slot_1_start_minute (derived; see home-assistant/packages/ecco_tou_schedule.yaml)
  esphome_component:
  - number.manual_slot1_start_hhmm
  modbus:
    registers:
    - address: 250
      shared_with:
      - tou_slot_6_end_time
    register_width_words: 1
    datatype: uint16_hhmm
    signed: false
    byte_order: n/a
    scale: 1
    unit: HHMM
  current_access: read_write
  firmware_evidence: 'read: firmware/ecco_clock_dongle_stage3_4_free_power.yaml:5202-5207 (manual_cfg_reg250_raw,
    block 241-293); write: apply_manual_slot1 script, start_address 250 (live_proven_write; pre-existing
    production write path (Stage 3.3), independently re-verified 2026-09-15 (docs/stage3_3-six-slot-hardware-test.md
    baseline table))'
  ha_evidence: home-assistant/packages/ecco_tou_schedule.yaml
  safe_min: 0
  safe_max: 2359
  bounds_note: HHMM minute component must be a multiple of 5 (00, 05, ..., 55); Manual Controls V1 enforces this in the HA helper guard, ESPHome staging step, and apply-time validation.
  exact_reread_verification_possible: true
  verification_tolerance: exact
  multi_register_write: false
  snapshot_required: true
  restoration_possible: yes_via_cached_raw_registers
  recovery_implementation_status: partial
  safety_impact: 'Changes when grid-charging is scheduled to begin; wrong value could charge at an unintended
    time or miss the intended window. Register 250 is ALSO slot 6''s displayed ''end time'' - the six
    slots are a continuous ring, not independent windows with gaps (confirmed live: slot 6''s end_time
    publishes from register 250, wrapping back to slot 1''s start - firmware:5922-5923).'
  dependencies:
    capabilities:
    - tou_slot_6_end_time
    flags:
    - manual_config_write_enable switch (master arm)
    - manual_stage_grid_charge_enabled
  implementation_status: implemented
  live_proof_status: live_proven_write
  write_policy: W1
  write_policy_reason: Known single register, bounded 0-2359, exact reread verification proven live (live_proven_write).
- id: tou_slot_1_end_time
  name: TOU Slot 1 End Time
  category: tou_schedule
  description: 'Slot 1 window end time (HHMM packed) - implicitly slot 2''s start. Baseline: 05:25.'
  entity_ha_raw:
  - text_sensor.ecco_clock_dongle_ecco_timezone2_time
  esphome_component:
  - number.manual_slot1_end_hhmm
  modbus:
    registers:
    - address: 251
      shared_with:
      - tou_slot_2_start_time
    register_width_words: 1
    datatype: uint16_hhmm
    signed: false
    byte_order: n/a
    scale: 1
    unit: HHMM
  current_access: read_write
  firmware_evidence: same source as tou_slot_2_start_time - register 251 is one physical value with two
    UI-facing capability records
  safe_min: 0
  safe_max: 2359
  bounds_note: HHMM minute component must be a multiple of 5 (00, 05, ..., 55); Manual Controls V1 enforces this in the HA helper guard, ESPHome staging step, and apply-time validation.
  exact_reread_verification_possible: true
  verification_tolerance: exact
  multi_register_write: false
  snapshot_required: true
  restoration_possible: yes_via_cached_raw_registers
  recovery_implementation_status: partial
  safety_impact: This registry deliberately keeps slot_end and the next slot's start as separate capability
    records because they are separate UI-facing concepts even though the register is shared - declared
    explicitly via modbus.registers[].shared_with rather than hidden in prose (Task 005A section 2).
  dependencies:
    capabilities:
    - tou_slot_2_start_time
  implementation_status: implemented
  live_proof_status: live_proven_write
  write_policy: W1
  write_policy_reason: Single known register, bounded, exact-verifiable - see safety_impact for the shared-register
    relationship with tou_slot_2_start_time.
- id: tou_slot_1_power
  name: TOU Slot 1 Power
  category: tou_schedule
  description: 'Slot 1 grid-charge power setpoint. Baseline: 8000W.'
  entity_ha_raw:
  - text_sensor.ecco_clock_dongle_ecco_timezone1_power
  esphome_component:
  - number.manual_slot1_power
  modbus:
    registers:
    - address: 256
      shared_with:
      - free_power_transaction
      - dump_to_grid_transaction
    register_width_words: 1
    datatype: uint16
    signed: false
    byte_order: n/a
    scale: 1
    unit: W
  current_access: read_write
  firmware_evidence: 'read: manual_cfg_reg256_raw (block 241-293); write: apply_manual_slot1 script, start_address
    256 (live_proven_write; pre-existing production write path (Stage 3.3), independently re-verified
    2026-09-15 (docs/stage3_3-six-slot-hardware-test.md baseline table)). Free Power additionally
    overlays this register (all six of 256-261) to the requested/effective wattage as part of its own
    transaction - see free_power_transaction.'
  limits:
    hardware:
      value: 8000
      unit: W
      source: firmware_substitution (${ecco_inverter_tou_power_ceiling_w}, compile-time)
    operating:
      source_entity: input_number.ecco_max_grid_charge_power
    effective:
      rule: min(hardware, operating)
  exact_reread_verification_possible: true
  verification_tolerance: exact
  multi_register_write: false
  snapshot_required: true
  restoration_possible: yes_via_cached_raw_registers
  recovery_implementation_status: partial
  safety_impact: 'Directly sets grid-charge power target for this window, and - per the 2026-09-23
    post-reboot live characterisation in CURRENT_STATE.md - is also the inverter''s native battery
    charge/discharge power ceiling in both Zero Export and Allow Export Load Limit modes, not a
    cosmetic display field. NOTE (Free Power ownership, 2026-09-23): Free Power now OWNS this register
    as part of its own transaction - it overlays ALL SIX TOU Power registers (256-261) with the
    requested/effective override wattage for the duration of the lease (so a lease surviving a TOU
    slot boundary keeps the same ceiling in every slot), and restores this slot''s exact original
    value on restore. Register 230 (grid charge current) remains Free Power''s primary rate control;
    overlaying TOU Power additionally prevents whatever ceiling happens to be active in the current
    slot from silently capping the override - see free_power_transaction.'
  dependencies:
    capabilities:
    - tou_slot_1_charge_source
    - tou_slot_1_target_soc
  implementation_status: implemented
  live_proof_status: live_proven_write
  write_policy: W1
  write_policy_reason: Known single register, bounded by the same hardware-ceiling substitution as Free
    Power. live_proven_write; pre-existing production write path (Stage 3.3), independently re-verified
    2026-09-15 (docs/stage3_3-six-slot-hardware-test.md baseline table)
