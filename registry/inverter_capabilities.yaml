    config validation and compile) on branch feature/manual-dump-to-grid-v1. Do NOT treat any status field
    here as live proof - none exists yet for this feature. See docs/DUMP_TO_GRID_V1.md "Recommended live-proof
    plan" for the conservative staged sequence a future task should follow before any real activation.'
