  safe_min: 0
  safe_max: 100
  exact_reread_verification_possible: true
  verification_tolerance: exact
  multi_register_write: false
  snapshot_required: true
  restoration_possible: yes_via_cached_raw_registers
  recovery_implementation_status: partial
  safety_impact: Sets how far the battery is grid-charged in this slot. Free Power temporarily forces
    all six slots to 100 - see free_power_transaction.
  dependencies:
    capabilities:
    - tou_slot_1_charge_source
  implementation_status: implemented
  live_proof_status: live_proven_write
  write_policy: W1
  write_policy_reason: Known single register, bounded 0-100. live_proven_write; pre-existing production
    write path (Stage 3.3), independently re-verified 2026-09-15 (docs/stage3_3-six-slot-hardware-test.md
    baseline table)
- id: tou_slot_1_voltage
  name: TOU Slot 1 Voltage
  category: tou_schedule
  description: Slot voltage baseline reported by the inverter for this slot.
  entity_ha_raw:
  - text_sensor.ecco_clock_dongle_ecco_timezone1_voltage
  modbus:
    registers:
    - address: 262
    register_width_words: 1
    datatype: uint16
    signed: false
    byte_order: n/a
    scale: 0.01
    unit: V
  current_access: read_only
  firmware_evidence: 'read: manual_cfg block 241-293, register 262. NO write_multiple_registers call anywhere
    in this firmware targets registers 262-267 - confirmed by grepping every write call''s start_address
    in the firmware (full write surface: 22-24, 230, 232, 250-261, 268-279 only; see docs/INVERTER_CAPABILITY_REGISTRY.md).'
  safe_min: null
  safe_max: null
  exact_reread_verification_possible: true
  verification_tolerance: exact
  multi_register_write: false
  snapshot_required: false
  restoration_possible: not_applicable
  recovery_implementation_status: not_required
  safety_impact: None from ECCO's side - never written.
  implementation_status: implemented
  live_proof_status: live_proven_read
  write_policy: R0
  notes: CURRENT_STATE.md-class 'slot voltage baseline' notes refer to this reported value, not an ECCO-set
    value.
- id: tou_slot_1_charge_source
  name: TOU Slot 1 Charge Source
  category: tou_schedule
  description: 'Bits 0-1 of the slot''s source/mode register: None/Grid/Generator/Grid+Generator.'
  entity_ha_raw:
  - text_sensor.ecco_clock_dongle_ecco_timezone1_charge
  esphome_component:
  - select.manual_slot1_charge_source
  modbus:
    registers:
    - address: 274
      bits: 0-1
      shared_with:
      - tou_slot_1_mode
      - free_power_transaction
    register_width_words: 1
    datatype: bitfield_uint16
    signed: false
    byte_order: n/a
    scale: 1
    unit: null
  current_access: read_write
  firmware_evidence: 'read: manual_cfg_reg274_raw, decode via charge_source() lambda (block 241-293);
    write: apply_manual_slot1 script (bits 0-1 only, via read-modify-write against the cached raw register)
    (live_proven_write; pre-existing production write path (Stage 3.3), independently re-verified 2026-09-15
    (docs/stage3_3-six-slot-hardware-test.md baseline table))'
  safe_min: null
  safe_max: null
  exact_reread_verification_possible: true
  verification_tolerance: exact on bits 0-1; bits 2+ (mode) must be preserved unchanged
  multi_register_write: false
  snapshot_required: true
  restoration_possible: yes_via_cached_raw_registers
  recovery_implementation_status: partial
  safety_impact: Shares register 274 with tou_slot_1_mode - a write here must read-modify-write to avoid
    clobbering the mode bits, exactly as the firmware already does (declared via modbus.registers[].shared_with,
    not prose).
  dependencies:
    capabilities:
    - tou_slot_1_mode
  enum_mapping:
    0: None
    1: Grid
    2: Generator
    3: Grid + Generator
  implementation_status: implemented
  live_proof_status: live_proven_write
  write_policy: W1
  write_policy_reason: Known register and known bit range, enum-bounded. Classified W1 (not W2) because
    it is a single register even though it is a sub-field write. live_proven_write; pre-existing production
    write path (Stage 3.3), independently re-verified 2026-09-15 (docs/stage3_3-six-slot-hardware-test.md
    baseline table)
- id: tou_slot_1_mode
