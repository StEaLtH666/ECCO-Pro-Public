- id: free_power_transaction
  name: Free Power (temporary grid-charge override)
  category: free_power
  description: 'The complete 20-register transaction below is live-proven for the normal Start + automatic-restore path as of 2026-09-24; operator recovery actions remain separately classified below:
    snapshot registers 230/232/256-261/268-279, write 232 (enable grid charge), write 230 (computed
    current from requested watts/live voltage, capped at pre-existing 230 value), write 268-279 (force all
    6 slots to 100% SOC / Grid source), positively REREAD 268-279, then - LAST, and only if every
    earlier write succeeded AND that readback confirmed SOC 100 / the intended source words - write
    256-261 (all six TOU Power slots overlaid to the requested wattage, so a lease surviving a TOU slot
    boundary keeps the same ceiling in every slot - see the 2026-09-23 TOU Power ownership promotion
    below), verify every write by reread, then on timeout or manual end restore the exact snapshot (232,
    then 256-261, then positively REREAD 256-261, then - only if that restore write succeeded AND the
    readback confirmed all six exact originals - 268-279 and 230) and re-verify all 20 registers.
    Ceiling/floor safety invariant: the TOU Power ceiling may only differ from its original while all
    six SOC floors are 100, so a partial apply or restore can never leave a raised ceiling around the
    user''s own lower SOC floors; both boundaries require positive readback, not just a write
    acknowledgement. They narrow but do not eliminate third-party races between a readback and the next
    write.
    2026-09-23 TOU Power (256-261) ownership promotion: a post-reboot live characterisation
    (CURRENT_STATE.md) proved TOU Power is the inverter''s native battery charge/discharge power
    ceiling, not a cosmetic display field, so leaving it witness-only (as the 2026-09-22 pass below
    deliberately did) meant Free Power''s requested override power could be silently capped by whatever
    TOU Power ceiling was active in the current slot. Free Power now owns and writes 256-261 as
    described above, verifies them exactly like every other owned register on both activation and
    restore, and persists the intended wattage (reg_tou_power_intended, under a new versioned tag,
    ecco_free_power_snapshot_data_v3) so the restore-time recovery classifier can reason about it across
    a reboot. Registers 250-255 (TOU slot times), 244 (Load/Export policy), 245 (export ceiling) and 248
    (TOU master enable) remain untouched by Free Power. 2026-09-22 firmware hardening
    pass (targets tracked against docs/SAFE_TRANSACTION_ENGINE_AUDIT_2026-09-21.md F1/F3/F4/F5): a fresh,
    dedicated hardware read immediately precedes every restore write (never a stale poll-cache value);
    a durable END-request record and a durable second-verify-mismatch lockout both survive reboot; COMMS
    retries now use bounded backoff (15/30/60/120/300s) instead of an unbounded 15s loop, and a VERIFY
    MISMATCH gets at most one automatic repeat before requiring an operator decision; an invalid wall
    clock after reboot can no longer keep the lease active forever (bounded uptime-based grace fallback);
    config polling and the RTC write path both now re-check bus ownership at their own final Modbus
    dispatch point, not only at their callers. 2026-09-22 corrective pass (same branch, 4th commit,
    closing 5 reviewer-found gaps in the above): operator authorisation to retry/end is now a genuine
    one-shot flag, never inferred from the durable restore-requested lease flag; the durable
    operator-needed lockout is now durably cleared (not only durably set) on explicit operator retry,
    on verified restore success, and checked clean before a brand new Free Power start may write;
    restore now classifies fresh live state against BOTH the original snapshot and ECCO''s own intended
    override state (reg230_intended persisted under a new versioned tag, ecco_free_power_snapshot_data_v2)
    before ever writing, and fails closed with a durable operator-decision lockout if live matches
    neither - never blindly overwriting unexplained third-party drift or a partial/mixed landing;
    configuration_online is no longer a precondition of the restore/recovery path; and the config-poll
    bus-ownership guard now lives inside poll_inverter_configuration_dispatch itself, before its first
    Modbus call, not only in its caller.
    2026-09-24 PR #27 (register-244 active-lease context hardening; normal Start + automatic-restore path live-proven):
    register 244 (Load/Export Mode) changes what TOU Power MEANS, so a fresh register-244 value is now
    captured durably (reg244_lease_context_plus1, fail-closed plus-one encoded, under a new versioned
    tag, ecco_free_power_snapshot_data_v4 - mandatory tag bump: the field exactly fills V3''s existing 2
    bytes of tail padding, so sizeof is unchanged and a same-tag reuse would NOT have been caught by the
    length check) before the first inverter write of a new lease. Automatic restore now performs two
    additional fresh register-244 reads - immediately before the first restore write, and again
    immediately before lowering the SOC floors - and performs ZERO further inverter writes in that
    attempt if live 244 no longer matches the lease''s captured context (or that context is unknown),
    instead durably requiring an operator decision via the same FreePowerRetryState lockout a repeated
    verify mismatch already uses. 244/245 remain outside Free Power''s write surface - only read, never
    written, by this hardening. Force Restore Original deliberately does NOT require this match (it is
    the explicit operator escape hatch under an already-reviewed context) but gained its own independent
    fresh 244 recheck against that attempt''s own fingerprinted live value. See
    registry/tests/test_free_power_reg244_context_v4.py and CURRENT_STATE.md''s PR-A section.'
