- id: grid_charge_current
  name: Grid Charge Current
  category: grid_charge
  description: 'The actual grid-charge RATE control register - register 230 is what Free Power primarily
    manipulates to control charge rate, per the live-proven Free Power test findings already in
    CURRENT_STATE.md ("TOU Power alone does not regulate grid-charge rate"). TOU "power" (256-261) is
    NOT merely a display/config setting, however - a separate 2026-09-23 post-reboot live
    characterisation proved it is the inverter''s native battery charge/discharge power CEILING in both
    Zero Export and Allow Export Load Limit modes. Free Power therefore now owns and overlays both -
    230 sets the requested rate, and 256-261 (all six slots) are overlaid to the same requested/
    effective wattage - so no active TOU slot''s ceiling can silently cap the override; see
    free_power_transaction and tou_slot_N_power.'
  entity_ha_raw:
  - sensor.ecco_clock_dongle_ecco_cfg_grid_charge_current
  esphome_component:
  - switch.free_power_write_enable (arm)
  - button.start_free_power_button / end_free_power_button (act)
  modbus:
    registers:
    - address: 230
      shared_with:
      - free_power_transaction
    register_width_words: 1
    datatype: uint16
    signed: false
    byte_order: n/a
    scale: 1
    unit: A
  current_access: read_write
  firmware_evidence: 'read: block 200-240, values[30]; write: start_free_power_override (start_address
    230), restore path in restore_free_power_snapshot'
  ha_evidence: home-assistant/packages/ecco_free_power_schedule.yaml (HA scheduling wrapper around this
    firmware transaction)
  safe_min: 1
  bounds_note: safe_max is not a fixed number - see transaction_limit below. The inverter's absolute
    physical maximum current for this register is UNKNOWN; no value in this repository establishes
    it, and none is invented here.
  limits:
    hardware:
      source: 'ABSOLUTE HARDWARE MAXIMUM NOT ESTABLISHED - do not treat the 185A value recorded in
        transaction_limit.pre_transaction_snapshot_observed below as a verified physical ceiling; it
        is an OBSERVED pre-transaction register value, proven not to be exceeded by Free Power, not
        an independently-confirmed inverter maximum (Task 005B correction: schema v2''s first pass
        mislabelled this observation as limits.hardware.value, conflating a transaction-scoped
        snapshot cap with a hardware ceiling).'
    operating:
      note: derived at runtime from requested watts / live battery voltage, clamped to the pre-transaction
        snapshot value - no static HA entity
    effective:
      rule: not_applicable
  transaction_limit:
    rule: min(requested_current, pre_transaction_snapshot)
    pre_transaction_snapshot_observed:
      value: 185
      unit: A
      source: 'CURRENT_STATE.md - the register 230 value observed live immediately before a Free
        Power transaction began. Free Power is live-proven to never write a value higher than this
        snapshot (firmware:2716). This is a TRANSACTION-SCOPED cap tied to whatever register 230
        already held at that specific moment, not a general/absolute hardware current limit - a
        different pre-transaction snapshot would cap at a different value.'
  exact_reread_verification_possible: true
