# ECCO Pro - system health check registry (Task 006, hardened in Task 006A)
#
# One record per independently-evaluated health check. Read-only
# design artifact: nothing in this repository currently reads this
# file to drive a live sensor or make a control decision. See
# docs/SYSTEM_HEALTH_ARCHITECTURE.md for the full design and every
# threshold's evidence, docs/SYSTEM_HEALTH_REASON_CODES.md and
# registry/health_reason_codes.yaml for the reason-code catalog this
# file's `outcomes[].reason_code` values reference, and
# tools/validate_system_health_checks.py for what is mechanically
# enforced.
#
# Field schema per check:
#   id                    <snake_case, unique>
#   subsystem             <one of the 16 subsystems - see the architecture doc section 3>
#   description           <free text>
#   source:
#     entity              <HA entity id, firmware id, or a documented derived-condition description>
#     type                <esphome_sensor | ha_binary_sensor | ha_template_sensor |
#                           influx_diagnostic | repository_file | derived | cross_source>
#   expected_datatype     <bool | numeric | string | timestamp | enum | counter>
#   check_type            <entity_available | freshness | boolean_expected | numeric_range |
#                           failure_counter_delta | text_state | transaction_state |
#                           timestamp_age | cross_source_agreement | history_depth |
#                           version_match | conditional_presence>
#   parameters            <check_type-specific dict - see tools/validate_system_health_checks.py
#                           for exactly which keys each check_type requires. Threshold field
#                           names (warning_threshold_seconds / failure_threshold_seconds,
#                           warning_delta / failure_delta) denote ORDERING (first tier / second,
#                           more severe tier), not a literal WARNING/FAILED state guarantee - the
#                           actual state each tier produces comes from that outcome's reason_code
#                           severity in registry/health_reason_codes.yaml. A single-outcome check
#                           MUST set exactly one of the pair (never both - the validator rejects
#                           an ambiguous single-outcome check with two threshold tiers); a
#                           multi-outcome check MUST set both. thresholds_unresolved: true marks
#                           a check where no repository evidence supports ANY fixed threshold
#                           (see docs/SYSTEM_HEALTH_ARCHITECTURE.md section 5)>
#   applicability_condition  <free text, or null if the check always applies>
#   outcomes:             <list of {reason_code, condition} - a check may produce more than
#                           one outcome at different severities/thresholds (e.g. a freshness
#                           check's two tiers); every reason_code must exist in
#                           registry/health_reason_codes.yaml, which is the single source of
#                           truth for severity/blocks_manual_control/affects_forecast>
#   dependencies           <list of other check ids this check's own evaluation is informed
#                           by - validated to exist, no cycles>
#   evidence               <REQUIRED - firmware:line / HA package path / doc citation>
#   implementation_status  <designed | implemented_offline | not_implemented>
#   live_proof_status      <unknown | documented_not_live_proven | live_proven_read>
#   rollup_participation   <OPTIONAL, default "automatic" - one of:
#                             automatic       participates in evaluate_subsystem()/
#                                             evaluate_overall()'s automatic rollup (the default)
#                             diagnostic_only excluded from automatic rollup: a manual/ad-hoc
#                                             diagnostic (e.g. a Flux script) with no continuous
#                                             live signal or no evidenced fixed threshold
#                             manual_only     excluded from automatic rollup: a PERMANENT
#                                             repository-level limitation (e.g. "no live entity
#                                             exists to verify this") that would otherwise poison
#                                             the automatic overall state forever
#                           Task 006A section 3 - a diagnostic_only/manual_only check is still
#                           fully evaluated and visible (SubsystemResult.diagnostic_results), it
#                           just never contributes to sensor.ecco_system_health's automatic state.>
#   suppressed_is_safe_for_control  <OPTIONAL bool, default false - Task 006A section 1. A
#                           required (blocking-capable) check that evaluates SUPPRESSED still
#                           BLOCKS manual_control_ready by default (fail closed); set this true
#                           only when the check's applicability semantics genuinely make its
#                           absence safe for a new manual action (no current check in this
#                           registry sets this - see health/tests/test_system_health.py for a
#                           synthetic example of both branches).>
#
# `blocks_manual_control` and `affects_forecast` are deliberately NOT
# duplicated at the check level - they belong to each reason code in
# registry/health_reason_codes.yaml (a single check's different
# outcomes can have different blocking behaviour, e.g. telemetry
# DEGRADED does not block manual control but STALE does - a per-check
# flag could not represent that correctly).
#
# Do not build a generic framework merely for abstraction's sake: only
# the check_type values ECCO's real signals actually need are used
# here (see docs/SYSTEM_HEALTH_ARCHITECTURE.md section 4 for which
# ones - `hash_match` is defined in the validator's enum but
# deliberately unused by any check today, for the reason documented
# there).

schema_version: 1
checks:
- id: esphome_reachable
  subsystem: communications
  description: Home Assistant's own connection state to the ECCO ESPHome device (API/MQTT).
  source:
    entity: ESPHome device availability (HA-side, not a firmware entity)
    type: ha_binary_sensor
  expected_datatype: bool
  check_type: entity_available
  parameters: {}
  applicability_condition: null
  outcomes:
  - reason_code: INSUFFICIENT_EVIDENCE
    condition: The device has never reported any state to Home Assistant.
  - reason_code: ESPHOME_UNAVAILABLE
    condition: The device previously reported state but is now unavailable.
  dependencies: []
  evidence: No firmware self-report of HA connectivity exists; this is HA's own ESPHome integration availability
    state.
  implementation_status: designed
  live_proof_status: unknown
- id: wifi_signal_quality
  subsystem: communications
  description: ESP32 Wi-Fi RSSI plausibility range.
  source:
    entity: wifi_signal (platform wifi_signal sensor)
    type: esphome_sensor
  expected_datatype: numeric
  check_type: numeric_range
  parameters:
    min: -90
    max: 0
    unit: dBm
  applicability_condition: null
  outcomes:
  - reason_code: WIFI_SIGNAL_UNKNOWN
    condition: Value is outside -90..0 dBm - not a real RSSI reading, most likely the sensor has never
      reported.
  dependencies:
  - esphome_reachable
  evidence: 'firmware/ecco_clock_dongle_stage3_4_free_power.yaml:1430 (platform: wifi_signal). -90 to
    0 dBm is the conventional Wi-Fi RSSI plausibility range, not a project-specific measured threshold
    - documented as a plausibility bound, not a proven quality threshold. Task 006B: uses the dedicated
    non-blocking WIFI_SIGNAL_UNKNOWN reason code, not the blocking-by-default INSUFFICIENT_EVIDENCE,
    since Wi-Fi signal quality alone must never gate manual control - esphome_reachable is the separate,
    dedicated reachability check.'
  implementation_status: designed
  live_proof_status: unknown
- id: telemetry_freshness
  subsystem: inverter_telemetry
  description: Age of the last successful telemetry poll (registers block 59-116 and 150-196).
  source:
    entity: last_telemetry_update / telemetry_online
    type: esphome_sensor
  expected_datatype: timestamp
  check_type: freshness
  parameters:
    expected_interval_seconds: 10
    warning_threshold_seconds: 60
    failure_threshold_seconds: 180
  applicability_condition: live_telemetry switch is on (see telemetry_polling_enabled check for the off
    case)
  outcomes:
  - reason_code: MODBUS_TELEMETRY_DEGRADED
    condition: Age between 60s and 180s.
  - reason_code: MODBUS_TELEMETRY_STALE
    condition: Age at or beyond 180s.
  dependencies: []
  evidence: firmware/ecco_clock_dongle_stage3_4_free_power.yaml:6042-6051 (10s interval, 5s startup_delay,
    gated on live_telemetry/correction/manual-write); docs/SYSTEM_HEALTH_ARCHITECTURE.md section 5 threshold
    rationale.
  implementation_status: designed
  live_proof_status: unknown
- id: telemetry_failures_recent
  subsystem: inverter_telemetry
  description: Recent-vs-historical delta on the cumulative telemetry_failures counter.
  source:
    entity: telemetry_failures
    type: esphome_sensor
  expected_datatype: counter
  check_type: failure_counter_delta
  parameters:
    window_seconds: 600
    warning_delta: 1
    failure_delta: null
  applicability_condition: null
  outcomes:
  - reason_code: MODBUS_TELEMETRY_FAILURES_RECENT
    condition: delta > 0 within the 600s window while the most recent poll succeeded.
  dependencies:
  - telemetry_freshness
  evidence: firmware/ecco_clock_dongle_stage3_4_free_power.yaml:180 (counter id), incremented in poll_inverter_telemetry's
    on_error/on_no_response handlers; docs/SYSTEM_HEALTH_ARCHITECTURE.md section 6.
  implementation_status: designed
  live_proof_status: unknown
- id: inverter_alarm_fault
  subsystem: inverter_telemetry
  description: Inverter system-state register must not report alarm or fault.
  source:
    entity: ecco_inverter_system_state (register 59)
    type: esphome_sensor
  expected_datatype: enum
  check_type: text_state
  parameters:
    failure_values:
    - alarm
    - fault
    warning_values:
    - unknown (%u)
  applicability_condition: null
  outcomes:
  - reason_code: INVERTER_ALARM_OR_FAULT
    condition: State is alarm or fault.
  dependencies:
  - telemetry_freshness
  evidence: 'firmware/ecco_clock_dongle_stage3_4_free_power.yaml:4715-4739 (enum decode: 0=standby,1=self-check,2=normal,3=alarm,4=fault).'
  implementation_status: designed
  live_proof_status: unknown
- id: inverter_grid_connected
  subsystem: inverter_telemetry
  description: Inverter-reported grid-connected boolean.
  source:
    entity: ecco_grid_connected (register 194)
    type: esphome_sensor
  expected_datatype: bool
  check_type: boolean_expected
  parameters:
    expected_value: true
  applicability_condition: null
  outcomes:
  - reason_code: INVERTER_GRID_DISCONNECTED
    condition: Value is false.
  dependencies:
  - telemetry_freshness
  evidence: 'firmware/ecco_clock_dongle_stage3_4_free_power.yaml: block 150-196, values[44] -> register
    194.'
  implementation_status: designed
  live_proof_status: unknown
- id: configuration_freshness
  subsystem: inverter_configuration
  description: Age of the last successful configuration poll (register blocks 200-240 and 241-293).
  source:
    entity: last_configuration_update / configuration_online
    type: esphome_sensor
  expected_datatype: timestamp
  check_type: freshness
  parameters:
    expected_interval_seconds: 60
    warning_threshold_seconds: 180
    failure_threshold_seconds: 600
  applicability_condition: configuration_polling switch is on
  outcomes:
  - reason_code: MODBUS_CONFIG_DEGRADED
    condition: Age between 180s and 600s.
  - reason_code: MODBUS_CONFIG_STALE
    condition: Age at or beyond 600s.
  dependencies: []
  evidence: firmware/ecco_clock_dongle_stage3_4_free_power.yaml:6056-6065 (60s interval, 20s startup_delay,
    gated on configuration_polling/correction/manual-write); firmware:6053-6055 comment 'slow-changing
    data'.
  implementation_status: designed
  live_proof_status: unknown
- id: configuration_failures_recent
  subsystem: inverter_configuration
  description: Recent-vs-historical delta on the cumulative configuration_failures counter.
  source:
    entity: configuration_failures
    type: esphome_sensor
  expected_datatype: counter
  check_type: failure_counter_delta
  parameters:
    window_seconds: 600
    warning_delta: 1
    failure_delta: null
  applicability_condition: null
  outcomes:
  - reason_code: MODBUS_CONFIG_FAILURES_RECENT
    condition: delta > 0 within the 600s window while the most recent poll succeeded.
  dependencies:
  - configuration_freshness
  evidence: firmware/ecco_clock_dongle_stage3_4_free_power.yaml:184 (counter id), incremented in poll_inverter_configuration's
    on_error/on_no_response handlers.
  implementation_status: designed
  live_proof_status: unknown
- id: config_cache_valid
  subsystem: inverter_configuration
  description: Cached raw register values used for safe read-modify-write of shared TOU bitfields.
  source:
    entity: manual_config_raw_cache_valid
    type: esphome_sensor
  expected_datatype: bool
  check_type: boolean_expected
  parameters:
    expected_value: true
  applicability_condition: null
  outcomes:
  - reason_code: CONFIG_CACHE_INVALID
    condition: Value is false.
  dependencies:
  - configuration_freshness
  evidence: firmware/ecco_clock_dongle_stage3_4_free_power.yaml:5057/5069 (set false on poll failure),
    5226 (set true once block 241-293 has been read).
  implementation_status: designed
  live_proof_status: unknown
- id: rtc_ntp_synced
  subsystem: rtc_time
  description: ESP32 SNTP sync confirmation.
  source:
    entity: ntp_synced
    type: esphome_sensor
  expected_datatype: bool
  check_type: boolean_expected
  parameters:
    expected_value: true
  applicability_condition: null
  outcomes:
  - reason_code: RTC_NTP_UNSYNCED
    condition: Value is false.
  dependencies: []
  evidence: firmware/ecco_clock_dongle_stage3_4_free_power.yaml:100/1124, set true on first successful
    SNTP sync; update_interval 15min at firmware:75.
  implementation_status: designed
  live_proof_status: unknown
- id: rtc_read_freshness
  subsystem: rtc_time
  description: Age of the last successful inverter RTC read.
  source:
    entity: clock_difference_valid
    type: esphome_sensor
  expected_datatype: timestamp
  check_type: freshness
  parameters:
    expected_interval_seconds: 60
    warning_threshold_seconds: 180
    failure_threshold_seconds: null
  applicability_condition: null
  outcomes:
  - reason_code: RTC_READ_STALE
    condition: Age at or beyond 180s - shares gating conditions with configuration polling, so this check
      alone does not distinguish degraded vs failed; see inverter_configuration for the failed-tier signal
      on the same root cause.
  dependencies:
  - configuration_freshness
  evidence: firmware/ecco_clock_dongle_stage3_4_free_power.yaml:6031-6040 (60s interval, 30s startup_delay,
    same !correction_in_progress && !manual_write_in_progress gating as configuration polling).
  implementation_status: designed
  live_proof_status: unknown
- id: rtc_correction_duration
  subsystem: rtc_time
  description: Duration correction_in_progress has remained true.
  source:
    entity: correction_in_progress
    type: esphome_sensor
  expected_datatype: bool
  check_type: transaction_state
  parameters:
    warning_threshold_seconds: 0
    failure_threshold_seconds: 180
  applicability_condition: null
  outcomes:
  - reason_code: RTC_CORRECTION_ACTIVE
    condition: True for any duration below the stuck threshold.
  - reason_code: RTC_CORRECTION_STUCK
    condition: True for 180s or more.
  dependencies: []
  evidence: firmware/ecco_clock_dongle_stage3_4_free_power.yaml:116 (id); verification_due_ms = millis()+10000
    (firmware:2569); max 2 retries at 1s interval cadence (firmware:6067-6111); worst case well under
    30s.
  implementation_status: designed
  live_proof_status: unknown
- id: rtc_stall_detected
  subsystem: rtc_time
  description: Firmware's own RTC-vs-NTP elapsed-time stall detector.
  source:
    entity: rtc_stall_detected
    type: esphome_sensor
  expected_datatype: bool
  check_type: boolean_expected
  parameters:
    expected_value: false
  applicability_condition: null
  outcomes:
  - reason_code: RTC_STALL_DETECTED
    condition: Value is true.
  dependencies:
  - rtc_read_freshness
  evidence: firmware/ecco_clock_dongle_stage3_4_free_power.yaml:5500-5521 (45-90s NTP-elapsed comparison
    window, stall = inverter advanced less than ntp_elapsed-15s).
  implementation_status: designed
  live_proof_status: unknown
- id: rtc_correction_failures_recent
  subsystem: rtc_time
  description: Recent-vs-historical delta on the cumulative failed_corrections counter.
  source:
    entity: failed_corrections
    type: esphome_sensor
  expected_datatype: counter
  check_type: failure_counter_delta
  parameters:
    window_seconds: 1800
    warning_delta: 1
    failure_delta: null
  applicability_condition: null
  outcomes:
  - reason_code: RTC_CORRECTION_FAILURES_RECENT
    condition: delta > 0 within the 1800s (30 min) window - wider than the comms counters since the 5-minute
      post-failure cooldown means a retry cannot occur sooner than 300s.
  dependencies:
  - rtc_correction_duration
  evidence: firmware/ecco_clock_dongle_stage3_4_free_power.yaml:5476/6101 (increment), 5482/6106 (5-minute
    cooldown_until_ms after failure).
  implementation_status: designed
  live_proof_status: unknown
- id: rtc_drift_uncorrected
  subsystem: rtc_time
  description: Measured clock difference exceeds correction_threshold with no correction in progress or
    cooldown.
  source:
    entity: latest_clock_difference vs. correction_threshold, correction_in_progress, cooldown_until_ms
      (derived condition)
    type: derived
  expected_datatype: bool
  check_type: boolean_expected
  parameters:
    expected_value: false
  applicability_condition: automatic_clock_sync switch is on
  outcomes:
  - reason_code: RTC_DRIFT_UNCORRECTED
    condition: abs_difference >= threshold, automatic_clock_sync is on, but neither correction_in_progress
      nor cooldown_active is true.
  dependencies:
  - rtc_read_freshness
  - rtc_ntp_synced
  evidence: 'firmware/ecco_clock_dongle_stage3_4_free_power.yaml:5542-5566 (automatic correction trigger
    condition: automatic_clock_sync.state && !correction_in_progress && !cooldown_active && (date_mismatch
    || abs_difference >= threshold)).'
  implementation_status: designed
  live_proof_status: unknown
- id: manual_write_duration
  subsystem: manual_write_system
  description: Duration manual_write_in_progress has remained true.
  source:
    entity: manual_write_in_progress
    type: esphome_sensor
  expected_datatype: bool
  check_type: transaction_state
  parameters:
    warning_threshold_seconds: 0
    failure_threshold_seconds: 180
  applicability_condition: null
  outcomes:
  - reason_code: MANUAL_WRITE_ACTIVE
    condition: True for any duration below the stuck threshold.
  - reason_code: MANUAL_WRITE_STUCK
    condition: True for 180s or more.
  dependencies: []
  evidence: firmware/ecco_clock_dongle_stage3_4_free_power.yaml:301 (id); per-write delay pattern of 700ms-1200ms
    across up to ~5 registers per slot apply (e.g. firmware:3479-3546); worst case well under 30s.
  implementation_status: designed
  live_proof_status: unknown
- id: manual_write_failures_recent
  subsystem: manual_write_system
  description: Recent-vs-historical delta on the cumulative manual_write_failures counter.
  source:
    entity: manual_write_failures
    type: esphome_sensor
  expected_datatype: counter
  check_type: failure_counter_delta
  parameters:
    window_seconds: 600
    warning_delta: 1
    failure_delta: null
  applicability_condition: null
  outcomes:
  - reason_code: MANUAL_WRITE_FAILURES_RECENT
    condition: delta > 0 within the 600s window.
  dependencies:
  - manual_write_duration
  evidence: firmware/ecco_clock_dongle_stage3_4_free_power.yaml:450 (id), incremented throughout every
    apply-slot script's rejection/failure paths.
  implementation_status: designed
  live_proof_status: unknown
- id: manual_write_arm_unexpected
  subsystem: manual_write_system
  description: Master write-enable arm observed on for longer than one poll interval with no write starting.
  source:
    entity: manual_config_write_enable vs. manual_write_in_progress (derived condition)
    type: derived
  expected_datatype: bool
  check_type: transaction_state
  parameters:
    warning_threshold_seconds: 60
    failure_threshold_seconds: null
  applicability_condition: null
  outcomes:
  - reason_code: MANUAL_WRITE_ARM_UNEXPECTED
    condition: manual_config_write_enable has been true for 60s+ with manual_write_in_progress never having
      become true in that window.
  dependencies:
  - manual_write_duration
  evidence: 'firmware/ecco_clock_dongle_stage3_4_free_power.yaml:949-950 (comment: master safety arm,
    auto-disarms after every Apply attempt - a timer-based auto-disarm does not exist, only an attempt-based
    one).'
  implementation_status: designed
  live_proof_status: unknown
- id: free_power_active_state
  subsystem: free_power
  description: Free Power override currently active.
  source:
    entity: free_power_active_persisted
    type: esphome_sensor
  expected_datatype: bool
  check_type: boolean_expected
  parameters:
    expected_value: false
  applicability_condition: null
  outcomes:
  - reason_code: FREE_POWER_ACTIVE
    condition: Value is true.
  dependencies: []
  evidence: firmware/ecco_clock_dongle_stage3_4_free_power.yaml:461/1192-1195 (persisted across reboot).
  implementation_status: designed
  live_proof_status: unknown
- id: free_power_operation_duration
  subsystem: free_power
  description: Duration free_power_operation_in_progress has remained true.
  source:
    entity: free_power_operation_in_progress
    type: esphome_sensor
  expected_datatype: bool
  check_type: transaction_state
  parameters:
    warning_threshold_seconds: 0
    failure_threshold_seconds: 180
  applicability_condition: null
  outcomes:
  - reason_code: FREE_POWER_OPERATION_ACTIVE
    condition: True for any duration below the stuck threshold.
  - reason_code: FREE_POWER_OPERATION_STUCK
    condition: True for 180s or more.
  dependencies: []
  evidence: Referenced throughout the start/end scripts' preconditions; goes through the same per-write
    delay pattern as manual_write_duration.
  implementation_status: designed
  live_proof_status: unknown
- id: free_power_snapshot_recovery
  subsystem: free_power
  description: Snapshot valid but not active - activation/restore was interrupted.
  source:
    entity: free_power_snapshot_valid && !free_power_active_persisted (derived condition)
    type: derived
  expected_datatype: bool
  check_type: transaction_state
  parameters:
    warning_threshold_seconds: 0
    failure_threshold_seconds: 60
  applicability_condition: null
  outcomes:
  - reason_code: FREE_POWER_RECOVERY_REQUIRED
    condition: Condition true for less than 60s - within the watchdog's reasonable resolution window (4
      x 15s cycles).
  - reason_code: FREE_POWER_RECOVERY_FAILED
    condition: Condition true for 60s or more, or free_power_failures increased during a restore attempt
      while still unresolved.
  dependencies:
  - free_power_active_state
  evidence: 'firmware/ecco_clock_dongle_stage3_4_free_power.yaml:6011-6029 (15s watchdog interval; comment
    at firmware:6022 ''Snapshot valid but not active means activation/restore was interrupted: fail safe
    by restoring'').'
  implementation_status: designed
  live_proof_status: unknown
- id: free_power_failures_recent
  subsystem: free_power
  description: Recent-vs-historical delta on the cumulative free_power_failures counter.
  source:
    entity: free_power_failures
    type: esphome_sensor
  expected_datatype: counter
  check_type: failure_counter_delta
  parameters:
    window_seconds: 600
    warning_delta: 1
    failure_delta: null
  applicability_condition: null
  outcomes:
  - reason_code: FREE_POWER_FAILURES_RECENT
    condition: delta > 0 within the 600s window.
  dependencies:
  - free_power_operation_duration
  evidence: firmware/ecco_clock_dongle_stage3_4_free_power.yaml:599 (id), incremented throughout the start/restore
    write/verify blocks.
  implementation_status: designed
  live_proof_status: unknown
- id: free_power_state_consistency
  subsystem: free_power
  description: Derived active-state boolean vs. free_power_status text agreement.
  source:
    entity: free_power_active_sensor vs. free_power_status
    type: derived
  expected_datatype: bool
  check_type: cross_source_agreement
  parameters:
    value_tolerance: 0
    timestamp_tolerance_seconds: null
  applicability_condition: null
  outcomes:
  - reason_code: FREE_POWER_STATE_INCONSISTENT
    condition: The boolean and the text status describe different active/inactive states.
  dependencies:
  - free_power_active_state
  evidence: firmware/ecco_clock_dongle_stage3_4_free_power.yaml:1192-1195 (free_power_active_sensor derived
    from free_power_active_persisted); firmware:2897-2901,3068-3071 (free_power_status text states).
  implementation_status: designed
  live_proof_status: unknown
- id: runtime_config_ready
  subsystem: runtime_configuration
  description: Reuses the existing binary_sensor.ecco_runtime_configuration_ready readiness gate.
  source:
    entity: binary_sensor.ecco_runtime_configuration_ready
    type: ha_binary_sensor
  expected_datatype: bool
  check_type: entity_available
  parameters:
    expected_value: true
  applicability_condition: null
  outcomes:
  - reason_code: RUNTIME_CONFIG_UNAVAILABLE
    condition: The entity does not exist or has never reported a state.
  - reason_code: RUNTIME_CONFIG_NOT_READY
    condition: The entity reports false.
  dependencies: []
  evidence: home-assistant/packages/ecco_runtime_config.yaml:193-206 (already-existing pre-Task-006 HA
    signal, reused directly rather than re-implemented).
  implementation_status: designed
  live_proof_status: unknown
- id: ha_entity_availability_generic
  subsystem: home_assistant
  description: 'Generic pattern check: an ECCO-related HA entity another check depends on is unavailable.'
  source:
    entity: varies - see the dependent check's own source_entity
    type: ha_template_sensor
  expected_datatype: bool
  check_type: entity_available
  parameters: {}
  applicability_condition: null
  outcomes:
  - reason_code: HA_ENTITY_UNAVAILABLE
