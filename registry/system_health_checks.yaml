- id: fallback_blocked_by_lease
  subsystem: fallback
  description: Recovery domain blocks the profile.
  source:
    entity: sensor.ecco_fallback_status_code
    type: ha_template_sensor
  expected_datatype: enum
  check_type: text_state
  parameters:
    failure_values:
    - lease_unreadable
    - lease_lockout
    - lease_restoring
  applicability_condition: null
  outcomes:
  - reason_code: FALLBACK_BLOCKED_BY_LEASE
    condition: Status code is lease_unreadable, lease_lockout or lease_restoring.
  dependencies: []
  evidence: Live Match obligation vector shows an unreadable, operator-needed or restoring recovery domain. The HA sensor shows DEGRADED for lease_restoring until it has lasted 10 minutes; this registry check is the conservative WARNING form.
  implementation_status: implemented_offline
  live_proof_status: unknown
  rollup_participation: automatic
- id: fallback_shadow_episode
  subsystem: fallback
  description: A supervision-loss shadow episode is open.
  source:
    entity: sensor.ecco_fallback_status_code
    type: ha_template_sensor
  expected_datatype: enum
  check_type: text_state
  parameters:
    failure_values:
    - shadow_episode
  applicability_condition: null
  outcomes:
  - reason_code: FAILBACK_SHADOW_EPISODE
    condition: Status code is shadow_episode.
  dependencies: []
  evidence: The dongle's Failback Shadow State is SHADOW_EPISODE or SHADOW_EPISODE_HA_BACK. Diagnostic only; a shadow verdict never changes the status code and nothing was written.
  implementation_status: implemented_offline
  live_proof_status: unknown
  rollup_participation: automatic
