script:
  - id: write_inverter_rtc
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return id(ntp_synced) && id(ntp_time).now().is_valid();
          then:
            - lambda: |-
                id(write_attempts_since_boot)++;
                ESP_LOGI("ecco", "Starting RTC write attempt %d", id(correction_attempt));
            - modbus_client.write_multiple_registers:
                modbus_id: inverter_modbus
                address: 0x01
                start_address: 0x0016
                values: !lambda |-
                  auto now = id(ntp_time).now();
                  uint16_t reg22 = ((now.year - 2000) << 8) | now.month;
                  uint16_t reg23 = (now.day_of_month << 8) | now.hour;
                  uint16_t reg24 = (now.minute << 8) | now.second;
                  ESP_LOGI(
                    "ecco",
                    "Writing inverter RTC from NTP: %04d-%02d-%02d %02d:%02d:%02d",
                    now.year,
                    now.month,
                    now.day_of_month,
                    now.hour,
                    now.minute,
                    now.second
                  );
                  return std::vector<uint16_t>{reg22, reg23, reg24};
                on_response:
                  then:
                    - lambda: |-
                        char result[96];
                        snprintf(
                          result,
                          sizeof(result),
                          "Write acknowledged - verifying attempt %d",
                          id(correction_attempt)
                        );
                        id(last_correction_result).publish_state(result);
                        id(verification_due_ms) = millis() + 10000;
                        id(verification_pending) = true;
                        ESP_LOGI("ecco", "RTC write acknowledged - verification scheduled in 10 seconds");
                on_error:
                  then:
                    - lambda: |-
                        ESP_LOGW("ecco", "RTC write Modbus exception: 0x%02X", (uint8_t) exception_code);
                        id(verification_pending) = false;
                        id(verification_read_active) = false;
                        id(comm_failure_pending) = true;
                        id(last_correction_result).publish_state("Modbus write error - processing retry");
                on_no_response:
                  then:
                    - lambda: |-
                        ESP_LOGW("ecco", "No response to RTC write");
                        id(verification_pending) = false;
                        id(verification_read_active) = false;
                        id(comm_failure_pending) = true;
                        id(last_correction_result).publish_state("No response to write - processing retry");
          else:
            - logger.log:
                level: WARN
                format: "RTC sync aborted - confirmed NTP time unavailable"

  - id: apply_manual_slot1
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              int start = (int) lroundf(id(manual_slot1_start_hhmm).state);
              int end = (int) lroundf(id(manual_slot1_end_hhmm).state);
              int power = (int) lroundf(id(manual_slot1_power).state);
              int soc = (int) lroundf(id(manual_slot1_soc).state);

              auto valid_hhmm = [](int raw) -> bool {
                if (raw < 0 || raw > 2359) return false;
                int hh = raw / 100;
                int mm = raw % 100;
                return hh <= 23 && mm <= 59;
              };

              return
                id(manual_config_write_enable).state &&
                id(manual_config_raw_cache_valid) &&
                id(configuration_online).state &&
                !id(correction_in_progress) &&
                !id(manual_write_in_progress) &&
                valid_hhmm(start) &&
                valid_hhmm(end) &&
                start != end &&
                power >= 0 && power <= 8000 &&
                soc >= 5 && soc <= 100;
          then:
            - lambda: |-
                int start = (int) lroundf(id(manual_slot1_start_hhmm).state);
                int end = (int) lroundf(id(manual_slot1_end_hhmm).state);
                int power = (int) lroundf(id(manual_slot1_power).state);
                int soc = (int) lroundf(id(manual_slot1_soc).state);

                uint16_t source_bits = 0;
                auto source = id(manual_slot1_charge_source).current_option();
                if (source == "Grid") source_bits = 1;
                else if (source == "Generator") source_bits = 2;
                else if (source == "Grid + Generator") source_bits = 3;

                uint16_t mode_bits = 0;
                auto mode = id(manual_slot1_mode).current_option();
                if (mode == "General") mode_bits = 0x04;
                else if (mode == "Backup") mode_bits = 0x08;
                else if (mode == "Charge") mode_bits = 0x10;

                id(manual_expected_reg232) =
                  (id(manual_cfg_reg232_raw) & 0xFFFE) |
                  (id(manual_stage_grid_charge_enabled).state ? 0x0001 : 0x0000);

                id(manual_expected_reg250) = (uint16_t) start;
                id(manual_expected_reg251) = (uint16_t) end;
                id(manual_expected_reg256) = (uint16_t) power;
                id(manual_expected_reg268) = (uint16_t) soc;

                // Register 274: preserve all unknown/reserved bits;
                // only replace charge source bits 0-1 and mode bits 2-4.
                id(manual_expected_reg274) =
                  (id(manual_cfg_reg274_raw) & 0xFFE0) |
                  source_bits |
                  mode_bits;

                id(manual_write_failed) = false;
                id(manual_verify_reg232_ok) = false;
                id(manual_write_in_progress) = true;
                id(manual_write_attempts)++;

                char msg[160];
                snprintf(
                  msg, sizeof(msg),
                  "Writing Slot1 %04d-%04d, %dW, %d%%, %s/%s, grid charge %s",
                  start, end, power, soc,
                  source.c_str(), mode.c_str(),
                  id(manual_stage_grid_charge_enabled).state ? "ON" : "OFF"
                );
                id(manual_config_last_result).publish_state(msg);
                ESP_LOGW("manual_config", "%s", msg);

            # Register 232 - global grid-charge enable bit, other bits preserved.
            - modbus_client.write_multiple_registers:
                modbus_id: inverter_modbus
                address: 0x01
                start_address: 232
                values: !lambda |-
                  return std::vector<uint16_t>{id(manual_expected_reg232)};
                on_error:
                  then:
                    - lambda: |-
                        id(manual_write_failed) = true;
                        ESP_LOGE("manual_config", "Register 232 write Modbus error 0x%02X", (uint8_t) exception_code);
                on_no_response:
                  then:
                    - lambda: |-
                        id(manual_write_failed) = true;
                        ESP_LOGE("manual_config", "Register 232 write timed out");

            - delay: 700ms

            # Registers 250-251 - Slot 1 start and end/Slot 2 boundary.
            - modbus_client.write_multiple_registers:
                modbus_id: inverter_modbus
                address: 0x01
                start_address: 250
                values: !lambda |-
                  return std::vector<uint16_t>{
                    id(manual_expected_reg250),
                    id(manual_expected_reg251)
                  };
                on_error:
                  then:
                    - lambda: |-
                        id(manual_write_failed) = true;
                        ESP_LOGE("manual_config", "Registers 250-251 write Modbus error 0x%02X", (uint8_t) exception_code);
                on_no_response:
                  then:
                    - lambda: |-
                        id(manual_write_failed) = true;
                        ESP_LOGE("manual_config", "Registers 250-251 write timed out");

            - delay: 700ms

            # Register 256 - Slot 1 power.
            - modbus_client.write_multiple_registers:
                modbus_id: inverter_modbus
                address: 0x01
                start_address: 256
                values: !lambda |-
                  return std::vector<uint16_t>{id(manual_expected_reg256)};
                on_error:
                  then:
                    - lambda: |-
                        id(manual_write_failed) = true;
                        ESP_LOGE("manual_config", "Register 256 write Modbus error 0x%02X", (uint8_t) exception_code);
                on_no_response:
                  then:
                    - lambda: |-
                        id(manual_write_failed) = true;
                        ESP_LOGE("manual_config", "Register 256 write timed out");

            - delay: 700ms

            # Register 268 - Slot 1 SOC target.
            - modbus_client.write_multiple_registers:
                modbus_id: inverter_modbus
                address: 0x01
                start_address: 268
                values: !lambda |-
                  return std::vector<uint16_t>{id(manual_expected_reg268)};
                on_error:
                  then:
                    - lambda: |-
                        id(manual_write_failed) = true;
                        ESP_LOGE("manual_config", "Register 268 write Modbus error 0x%02X", (uint8_t) exception_code);
                on_no_response:
                  then:
                    - lambda: |-
                        id(manual_write_failed) = true;
                        ESP_LOGE("manual_config", "Register 268 write timed out");

            - delay: 700ms

            # Register 274 - Slot 1 charge source/mode; unknown bits preserved.
            - modbus_client.write_multiple_registers:
                modbus_id: inverter_modbus
                address: 0x01
                start_address: 274
                values: !lambda |-
                  return std::vector<uint16_t>{id(manual_expected_reg274)};
                on_error:
                  then:
                    - lambda: |-
                        id(manual_write_failed) = true;
                        ESP_LOGE("manual_config", "Register 274 write Modbus error 0x%02X", (uint8_t) exception_code);
                on_no_response:
                  then:
                    - lambda: |-
                        id(manual_write_failed) = true;
                        ESP_LOGE("manual_config", "Register 274 write timed out");

            - delay: 1200ms

            - if:
                condition:
                  lambda: |-
                    return id(manual_write_failed);
                then:
                  - lambda: |-
                      id(manual_write_failures)++;
                      id(manual_write_in_progress) = false;
                      id(manual_config_last_result).publish_state(
                        "FAILED - one or more write transactions failed; no automatic retry"
                      );
                      id(manual_config_write_enable).turn_off();
                      ESP_LOGE("manual_config", "Manual Slot 1 apply failed during write phase");
                else:
                  # Verify reg232 first.
                  - modbus_client.read_holding_registers:
                      modbus_id: inverter_modbus
                      address: 0x01
                      start_address: 232
                      count: 1
                      on_response:
                        then:
                          - lambda: |-
                              id(manual_cfg_reg232_raw) = values[0];
                              id(manual_verify_reg232_ok) =
                                ((values[0] & 0x0001) == (id(manual_expected_reg232) & 0x0001));
                              if (!id(manual_verify_reg232_ok)) {
                                ESP_LOGE(
                                  "manual_config",
                                  "Verification mismatch reg232: read 0x%04X expected bit0=%u",
                                  values[0],
                                  id(manual_expected_reg232) & 0x0001
                                );
                              }
                      on_error:
                        then:
                          - lambda: |-
                              id(manual_write_failed) = true;
                              ESP_LOGE("manual_config", "Verification read reg232 Modbus error 0x%02X", (uint8_t) exception_code);
                      on_no_response:
                        then:
                          - lambda: |-
                              id(manual_write_failed) = true;
                              ESP_LOGE("manual_config", "Verification read reg232 timed out");

                  - delay: 700ms

                  # Verify Slot 1 values in a single read from 250 through 274.
                  - modbus_client.read_holding_registers:
                      modbus_id: inverter_modbus
                      address: 0x01
                      start_address: 250
                      count: 25
                      on_response:
                        then:
                          - lambda: |-
                              bool ok =
                                !id(manual_write_failed) &&
                                id(manual_verify_reg232_ok) &&
                                values[0]  == id(manual_expected_reg250) &&
                                values[1]  == id(manual_expected_reg251) &&
                                values[6]  == id(manual_expected_reg256) &&
                                values[18] == id(manual_expected_reg268) &&
                                values[24] == id(manual_expected_reg274);

                              if (ok) {
                                id(manual_write_successes)++;
                                id(manual_config_last_result).publish_state(
                                  "VERIFIED OK - manual Slot 1 settings match inverter readback"
                                );
                                ESP_LOGI("manual_config", "Manual Slot 1 write VERIFIED OK");
                              } else {
                                id(manual_write_failures)++;
                                char msg[200];
                                snprintf(
                                  msg, sizeof(msg),
                                  "VERIFY FAILED read T1/T2/P/SOC/FLAG=%u/%u/%u/%u/0x%04X expected=%u/%u/%u/%u/0x%04X",
                                  values[0], values[1], values[6], values[18], values[24],
                                  id(manual_expected_reg250), id(manual_expected_reg251),
                                  id(manual_expected_reg256), id(manual_expected_reg268),
                                  id(manual_expected_reg274)
                                );
                                id(manual_config_last_result).publish_state(msg);
                                ESP_LOGE("manual_config", "%s", msg);
                              }

                              // Refresh cached values from the verified read.
                              id(manual_cfg_reg250_raw) = values[0];
                              id(manual_cfg_reg251_raw) = values[1];
                              id(manual_cfg_reg256_raw) = values[6];
                              id(manual_cfg_reg268_raw) = values[18];
                              id(manual_cfg_reg274_raw) = values[24];

                              id(manual_write_in_progress) = false;
                              id(manual_config_write_enable).turn_off();
                      on_error:
                        then:
                          - lambda: |-
                              id(manual_write_failures)++;
                              id(manual_write_in_progress) = false;
                              id(manual_config_write_enable).turn_off();
                              id(manual_config_last_result).publish_state(
                                "VERIFY FAILED - Slot 1 verification Modbus error"
                              );
                              ESP_LOGE("manual_config", "Slot 1 verification Modbus error 0x%02X", (uint8_t) exception_code);
                      on_no_response:
                        then:
                          - lambda: |-
                              id(manual_write_failures)++;
                              id(manual_write_in_progress) = false;
                              id(manual_config_write_enable).turn_off();
                              id(manual_config_last_result).publish_state(
                                "VERIFY FAILED - Slot 1 verification timed out"
                              );
                              ESP_LOGE("manual_config", "Slot 1 verification timed out");

                  - delay: 900ms
                  - if:
                      condition:
                        lambda: |-
                          return !id(manual_write_in_progress);
                      then:
                        - script.execute:
                            id: poll_inverter_configuration
          else:
            - lambda: |-
                bool was_armed = id(manual_config_write_enable).state;
                if (!id(manual_config_raw_cache_valid)) {
                  id(manual_config_last_result).publish_state(
                    "REJECTED - no fresh configuration raw cache; refresh configuration first"
                  );
                } else if (!id(configuration_online).state) {
                  id(manual_config_last_result).publish_state(
                    "REJECTED - inverter configuration is offline"
                  );
                } else if (id(correction_in_progress)) {
                  id(manual_config_last_result).publish_state(
                    "REJECTED - RTC correction currently active"
                  );
                } else if (id(manual_write_in_progress)) {
                  id(manual_config_last_result).publish_state(
                    "REJECTED - manual configuration write already active"
                  );
                } else if (!was_armed) {
                  id(manual_config_last_result).publish_state(
                    "REJECTED - arm Manual Configuration Write Enable first"
                  );
                } else {
                  id(manual_config_last_result).publish_state(
                    "REJECTED - staged Slot 1 values failed safety validation"
                  );
                }
                id(manual_config_write_enable).turn_off();

  - id: poll_inverter_telemetry
    mode: single
    then:
      - modbus_client.read_holding_registers:
          modbus_id: inverter_modbus
          address: 0x01
          start_address: 59
          count: 58
          on_response:
            then:
              - lambda: |-
                  // 59 - inverter system state
                  uint16_t state = values[0];
                  switch (state) {
                    case 0:
                      id(ecco_inverter_system_state).publish_state("standby");
                      break;
                    case 1:
                      id(ecco_inverter_system_state).publish_state("self-check");
                      break;
                    case 2:
                      id(ecco_inverter_system_state).publish_state("normal");
                      break;
                    case 3:
                      id(ecco_inverter_system_state).publish_state("alarm");
                      break;
                    case 4:
                      id(ecco_inverter_system_state).publish_state("fault");
                      break;
                    default: {
                      char buffer[32];
                      snprintf(buffer, sizeof(buffer), "unknown (%u)", state);
                      id(ecco_inverter_system_state).publish_state(buffer);
                      break;
                    }
                  }

                  // Stage 2 daily energy counters
                  id(ecco_day_battery_charge).publish_state(values[11] * 0.1f);   // reg 70
                  id(ecco_day_battery_discharge).publish_state(values[12] * 0.1f); // reg 71
                  id(ecco_day_grid_import).publish_state(values[17] * 0.1f);       // reg 76
                  id(ecco_day_grid_export).publish_state(values[18] * 0.1f);       // reg 77
                  id(ecco_day_load_energy).publish_state(values[25] * 0.1f);       // reg 84
                  id(ecco_day_pv_energy).publish_state(values[49] * 0.1f);         // reg 108

                  // Stage 2 lifetime counters that are unambiguous on this map.
                  // Deye DWORD order is low word first, then high word.
                  uint32_t total_battery_charge_raw =
                    (static_cast<uint32_t>(values[14]) << 16) |
                    static_cast<uint32_t>(values[13]); // regs 72-73

                  uint32_t total_battery_discharge_raw =
                    (static_cast<uint32_t>(values[16]) << 16) |
                    static_cast<uint32_t>(values[15]); // regs 74-75

                  // Grid import total is unusual on this single-phase map:
                  // low word = reg 78, high word = reg 80, with grid frequency
                  // living between them at reg 79.
                  uint32_t total_grid_import_raw =
                    (static_cast<uint32_t>(values[21]) << 16) |
                    static_cast<uint32_t>(values[19]); // regs 78 + 80

                  // Grid export total is the normal consecutive pair 81-82.
                  uint32_t total_grid_export_raw =
                    (static_cast<uint32_t>(values[23]) << 16) |
                    static_cast<uint32_t>(values[22]); // regs 81-82

                  uint32_t total_load_raw =
                    (static_cast<uint32_t>(values[27]) << 16) |
                    static_cast<uint32_t>(values[26]); // regs 85-86

                  uint32_t total_pv_raw =
                    (static_cast<uint32_t>(values[38]) << 16) |
                    static_cast<uint32_t>(values[37]); // regs 96-97

                  id(ecco_total_battery_charge).publish_state(total_battery_charge_raw * 0.1f);
                  id(ecco_total_battery_discharge).publish_state(total_battery_discharge_raw * 0.1f);
                  id(ecco_total_grid_import).publish_state(total_grid_import_raw * 0.1f);
                  id(ecco_total_grid_export).publish_state(total_grid_export_raw * 0.1f);
                  id(ecco_total_load_energy).publish_state(total_load_raw * 0.1f);
                  id(ecco_total_pv_energy).publish_state(total_pv_raw * 0.1f);

                  // Existing Stage 1 telemetry
                  id(ecco_grid_frequency).publish_state(values[20] * 0.01f); // reg 79 on this inverter

                  id(ecco_dc_temperature).publish_state(
                    (static_cast<int16_t>(values[31]) - 1000) * 0.1f
                  );
                  id(ecco_ac_temperature).publish_state(
                    (static_cast<int16_t>(values[32]) - 1000) * 0.1f
                  );

                  char warning[9];
                  snprintf(warning, sizeof(warning), "%04X%04X", values[42], values[43]);
                  id(ecco_inverter_warning).publish_state(warning);

                  char fault[17];
                  snprintf(
                    fault,
                    sizeof(fault),
                    "%04X%04X%04X%04X",
                    values[44],
                    values[45],
                    values[46],
                    values[47]
                  );
                  id(ecco_inverter_fault).publish_state(fault);

                  id(ecco_pv1_voltage).publish_state(values[50] * 0.1f);
                  id(ecco_pv1_current).publish_state(values[51] * 0.1f);
                  id(ecco_pv2_voltage).publish_state(values[52] * 0.1f);
                  id(ecco_pv2_current).publish_state(values[53] * 0.1f);
                  id(ecco_pv3_voltage).publish_state(values[54] * 0.1f);
                  id(ecco_pv3_current).publish_state(values[55] * 0.1f);
                  id(ecco_pv4_voltage).publish_state(values[56] * 0.1f);
                  id(ecco_pv4_current).publish_state(values[57] * 0.1f);

                  ESP_LOGI(
                    "energy",
                    "Day: PV %.1f | Load %.1f | Batt +%.1f / -%.1f | Grid in %.1f / out %.1f kWh",
                    values[49] * 0.1f,
                    values[25] * 0.1f,
                    values[11] * 0.1f,
                    values[12] * 0.1f,
                    values[17] * 0.1f,
                    values[18] * 0.1f
                  );
          on_error:
            then:
              - lambda: |-
                  id(telemetry_failures)++;
                  ESP_LOGW(
                    "telemetry",
                    "Telemetry block 59-116 Modbus exception: 0x%02X",
                    (uint8_t) exception_code
                  );
          on_no_response:
            then:
              - lambda: |-
                  id(telemetry_failures)++;
                  ESP_LOGW("telemetry", "No response to telemetry block 59-116");

      - delay: 2500ms

      - modbus_client.read_holding_registers:
          modbus_id: inverter_modbus
          address: 0x01
          start_address: 150
          count: 47
          on_response:
            then:
              - lambda: |-
                  id(ecco_grid_voltage_l1).publish_state(values[0] * 0.1f);
                  id(ecco_grid_voltage_l2).publish_state(values[1] * 0.1f);
                  id(ecco_grid_voltage_l1_l2).publish_state(values[2] * 0.1f);
                  id(ecco_mid_relay_voltage).publish_state(values[3] * 0.1f);

                  id(ecco_inverter_voltage_l1).publish_state(values[4] * 0.1f);
                  id(ecco_inverter_voltage_l2).publish_state(values[5] * 0.1f);
                  id(ecco_inverter_voltage_l1_l2).publish_state(values[6] * 0.1f);

                  id(ecco_load_voltage_l1).publish_state(values[7] * 0.1f);
                  id(ecco_load_voltage_l2).publish_state(values[8] * 0.1f);

                  id(ecco_grid_current_l1).publish_state(static_cast<int16_t>(values[10]) * 0.01f);
                  id(ecco_grid_current_l2).publish_state(static_cast<int16_t>(values[11]) * 0.01f);
                  id(ecco_grid_external_current_l1).publish_state(static_cast<int16_t>(values[12]) * 0.01f);
                  id(ecco_grid_external_current_l2).publish_state(static_cast<int16_t>(values[13]) * 0.01f);

                  id(ecco_inverter_current_l1).publish_state(static_cast<int16_t>(values[14]) * 0.01f);
                  id(ecco_inverter_current_l2).publish_state(static_cast<int16_t>(values[15]) * 0.01f);

                  id(ecco_generator_power).publish_state(static_cast<int16_t>(values[16]));

                  id(ecco_grid_power_l1).publish_state(static_cast<int16_t>(values[17]));
                  id(ecco_grid_power_l2).publish_state(static_cast<int16_t>(values[18]));
                  id(ecco_grid_power).publish_state(static_cast<int16_t>(values[19]));

                  id(ecco_grid_ct_power_l1).publish_state(static_cast<int16_t>(values[20]));
                  id(ecco_grid_ct_power_l2).publish_state(static_cast<int16_t>(values[21]));
                  id(ecco_grid_ct_power).publish_state(static_cast<int16_t>(values[22]));

                  id(ecco_inverter_power_l1).publish_state(static_cast<int16_t>(values[23]));
                  id(ecco_inverter_power_l2).publish_state(static_cast<int16_t>(values[24]));
                  id(ecco_inverter_power).publish_state(static_cast<int16_t>(values[25]));

                  id(ecco_load_power_l1).publish_state(static_cast<int16_t>(values[26]));
                  id(ecco_load_power_l2).publish_state(static_cast<int16_t>(values[27]));
                  id(ecco_load_power).publish_state(static_cast<int16_t>(values[28]));

                  id(ecco_load_current_l1).publish_state(static_cast<int16_t>(values[29]) * 0.01f);
                  id(ecco_load_current_l2).publish_state(static_cast<int16_t>(values[30]) * 0.01f);

                  id(ecco_battery_temperature).publish_state(
                    (static_cast<int16_t>(values[32]) - 1000) * 0.1f
                  );
                  id(ecco_battery_voltage).publish_state(values[33] * 0.01f);
                  id(ecco_battery_soc).publish_state(values[34]);

                  float pv1 = static_cast<int16_t>(values[36]);
                  float pv2 = static_cast<int16_t>(values[37]);
                  float pv3 = static_cast<int16_t>(values[38]);
                  float pv4 = static_cast<int16_t>(values[39]);
                  id(ecco_pv1_power).publish_state(pv1);
                  id(ecco_pv2_power).publish_state(pv2);
                  id(ecco_pv3_power).publish_state(pv3);
                  id(ecco_pv4_power).publish_state(pv4);
                  id(ecco_pv_power).publish_state(pv1 + pv2 + pv3 + pv4);

                  id(ecco_battery_power).publish_state(static_cast<int16_t>(values[40]));
                  id(ecco_battery_current).publish_state(static_cast<int16_t>(values[41]) * 0.01f);

                  id(ecco_load_frequency).publish_state(values[42] * 0.01f);
                  id(ecco_inverter_frequency).publish_state(values[43] * 0.01f);

                  id(ecco_grid_connected).publish_state(values[44] != 0);
                  id(ecco_generator_connected).publish_state((values[45] & 0x000F) != 0);

                  id(telemetry_online).publish_state(true);
                  auto now = id(ntp_time).now();
                  if (now.is_valid()) {
                    id(last_telemetry_update).publish_state(now.strftime("%Y-%m-%d %H:%M:%S"));
                  }
          on_error:
            then:
              - lambda: |-
                  id(telemetry_failures)++;
                  id(telemetry_online).publish_state(false);
                  ESP_LOGW(
                    "telemetry",
                    "Telemetry block 150-196 Modbus exception: 0x%02X",
                    (uint8_t) exception_code
                  );
          on_no_response:
            then:
              - lambda: |-
                  id(telemetry_failures)++;
                  id(telemetry_online).publish_state(false);
                  ESP_LOGW("telemetry", "No response to telemetry block 150-196");

  # ==========================================================
  # STAGE 3 - READ-ONLY CONFIGURATION POLL
  #
  # IMPORTANT: this script contains READ HOLDING REGISTER calls only.
  # It never writes inverter configuration. The only inverter write in
  # this complete firmware remains the established RTC write at 22-24.
  # ==========================================================
  - id: poll_inverter_configuration
    mode: single
    then:
      - lambda: |-
          id(configuration_block1_ok) = false;

      # Block A: battery / generator / grid-charge / AUX settings
      # Registers 200-240 inclusive
      - modbus_client.read_holding_registers:
          modbus_id: inverter_modbus
          address: 0x01
          start_address: 200
          count: 41
          on_response:
            then:
              - lambda: |-
                  id(configuration_block1_ok) = true;

                  // Battery type / control mode, register 200
                  switch (values[0]) {
                    case 0: id(ecco_battery_control_mode).publish_state("Lead-acid"); break;
                    case 1: id(ecco_battery_control_mode).publish_state("Lithium"); break;
                    default: {
                      char b[32]; snprintf(b, sizeof(b), "Unknown (%u)", values[0]);
                      id(ecco_battery_control_mode).publish_state(b);
                      break;
                    }
                  }

                  id(ecco_cfg_battery_equalization_voltage).publish_state(values[1] * 0.01f);
                  id(ecco_cfg_battery_absorption_voltage).publish_state(values[2] * 0.01f);
                  id(ecco_cfg_battery_float_voltage).publish_state(values[3] * 0.01f);
                  id(ecco_cfg_battery_capacity_ah).publish_state(values[4]);

                  // Register 206 is signed on some firmware and presented as
                  // a positive trickle-feed magnitude by SmartDeye.
                  int trickle = static_cast<int16_t>(values[6]);
                  if (trickle < 0) trickle = -trickle;
                  id(ecco_cfg_zero_export_grid_feed).publish_state(trickle);

                  id(ecco_cfg_battery_max_charge).publish_state(values[10]);
                  id(ecco_cfg_battery_max_discharge).publish_state(values[11]);

                  // Battery operating basis, register 213
                  switch (values[13]) {
                    case 0: id(ecco_battery_operation_mode).publish_state("Voltage"); break;
                    case 1: id(ecco_battery_operation_mode).publish_state("Capacity"); break;
                    case 2: id(ecco_battery_operation_mode).publish_state("No Battery"); break;
                    default: {
                      char b[32]; snprintf(b, sizeof(b), "Unknown (%u)", values[13]);
                      id(ecco_battery_operation_mode).publish_state(b);
                      break;
                    }
                  }

                  // Register 214 - Lithium wake-up bit. Deye protocol: 0=Enable, 1=Disable.
                  // Keep the raw word visible as a diagnostic because SmartDeye currently
                  // reports the opposite text state on this inverter.
                  id(ecco_cfg_battery_wake_up_raw).publish_state(values[14]);
                  id(ecco_battery_wake_up_lithium).publish_state(
                    (values[14] & 0x0001) ? "Disable" : "Enable"
                  );

                  id(ecco_cfg_battery_shutdown).publish_state(values[17]);
                  id(ecco_cfg_battery_restart).publish_state(values[18]);
                  id(ecco_cfg_battery_low_warning).publish_state(values[19]);

                  // Generator settings: 223-227
                  id(ecco_cfg_generator_run_time).publish_state(values[23] * 0.1f);
                  id(ecco_cfg_generator_down_time).publish_state(values[24] * 0.1f);
                  id(ecco_cfg_generator_start_charge).publish_state(values[26]);
                  id(ecco_cfg_generator_charge_current).publish_state(values[27]);

                  // Grid-charge current and charge-enable states
                  id(ecco_cfg_grid_charge_current).publish_state(values[30]);
                  id(ecco_generator_charge_enabled).publish_state((values[31] & 0x0001) != 0);
                  id(ecco_grid_charge_enabled).publish_state((values[32] & 0x0001) != 0);
                  id(manual_cfg_reg232_raw) = values[32];

                  id(ecco_force_generator).publish_state((values[34] & 0x0001) != 0);

                  // AUX/GEN port function, register 235
                  switch (values[35]) {
                    case 0: id(ecco_aux_port_function).publish_state("Generator input"); break;
                    case 1: id(ecco_aux_port_function).publish_state("Smart Load output"); break;
                    case 2: id(ecco_aux_port_function).publish_state("Micro Inverter input"); break;
                    default: {
                      char b[32]; snprintf(b, sizeof(b), "Unknown (%u)", values[35]);
                      id(ecco_aux_port_function).publish_state(b);
                      break;
                    }
                  }

                  id(ecco_cfg_smart_load_off).publish_state(values[37]);
                  id(ecco_cfg_smart_load_on).publish_state(values[39]);

                  ESP_LOGI(
                    "config",
                    "Config A: batt %uAh, charge/discharge %u/%uA, shutdown/restart/low %u/%u/%u%%, wake raw=%u",
                    values[4], values[10], values[11], values[17], values[18], values[19], values[14]
                  );
          on_error:
            then:
              - lambda: |-
                  id(configuration_failures)++;
                  id(configuration_block1_ok) = false;
                  id(manual_config_raw_cache_valid) = false;
                  id(configuration_online).publish_state(false);
                  ESP_LOGW(
                    "config",
                    "Configuration block 200-240 Modbus exception: 0x%02X",
                    (uint8_t) exception_code
                  );
          on_no_response:
            then:
              - lambda: |-
                  id(configuration_failures)++;
                  id(configuration_block1_ok) = false;
                  id(manual_config_raw_cache_valid) = false;
                  id(configuration_online).publish_state(false);
                  ESP_LOGW("config", "No response to configuration block 200-240");

      - delay: 2500ms

      # Block B: energy management / TOU / grid protection
      # Registers 241-293 inclusive
      - modbus_client.read_holding_registers:
          modbus_id: inverter_modbus
          address: 0x01
          start_address: 241
          count: 53
          on_response:
            then:
              - lambda: |-
                  id(ecco_cfg_smart_load_power).publish_state(values[0]);

                  // Register 242 - Gen_Grid_Signal_On flags.
                  // Bit0 = grid signal, bit1 = generator signal.
                  uint16_t signal_flags = values[1];
                  id(ecco_cfg_gen_grid_signal_raw).publish_state(signal_flags);
                  id(ecco_grid_signal).publish_state(
                    (signal_flags & 0x0001) ? "Enable" : "Disable"
                  );
                  id(ecco_generator_signal).publish_state(
                    (signal_flags & 0x0002) ? "Enable" : "Disable"
                  );

                  switch (values[2]) {
                    case 0: id(ecco_energy_management_model).publish_state("Battery First Mode"); break;
                    case 1: id(ecco_energy_management_model).publish_state("Load First Mode"); break;
                    default: {
                      char b[32]; snprintf(b, sizeof(b), "Unknown (%u)", values[2]);
                      id(ecco_energy_management_model).publish_state(b);
                      break;
                    }
                  }

                  switch (values[3]) {
                    case 0: id(ecco_load_limit).publish_state("Allow Export"); break;
                    case 1: id(ecco_load_limit).publish_state("Essentials"); break;
                    case 2: id(ecco_load_limit).publish_state("Zero Export"); break;
                    default: {
                      char b[32]; snprintf(b, sizeof(b), "Unknown (%u)", values[3]);
                      id(ecco_load_limit).publish_state(b);
                      break;
                    }
                  }

                  id(ecco_cfg_export_limit).publish_state(values[4]);
                  id(ecco_export_solar_enabled).publish_state((values[6] & 0x0001) != 0);
                  id(ecco_time_of_use_enabled).publish_state((values[7] & 0x0001) != 0);

                  auto format_time = [](uint16_t raw) -> std::string {
                    int hh = raw / 100;
                    int mm = raw % 100;
                    char t[8];
                    if (hh > 23 || mm > 59) {
                      snprintf(t, sizeof(t), "?%u", raw);
                    } else {
                      snprintf(t, sizeof(t), "%02d:%02d", hh, mm);
                    }
                    return std::string(t);
                  };

                  id(ecco_tou1_time).publish_state(format_time(values[9]));
                  id(ecco_tou2_time).publish_state(format_time(values[10]));
                  id(ecco_tou3_time).publish_state(format_time(values[11]));
                  id(ecco_tou4_time).publish_state(format_time(values[12]));
                  id(ecco_tou5_time).publish_state(format_time(values[13]));
                  id(ecco_tou6_time).publish_state(format_time(values[14]));

                  id(ecco_tou1_power).publish_state(values[15]);
                  id(ecco_tou2_power).publish_state(values[16]);
                  id(ecco_tou3_power).publish_state(values[17]);
                  id(ecco_tou4_power).publish_state(values[18]);
                  id(ecco_tou5_power).publish_state(values[19]);
                  id(ecco_tou6_power).publish_state(values[20]);

                  id(ecco_tou1_voltage).publish_state(values[21] * 0.01f);
                  id(ecco_tou2_voltage).publish_state(values[22] * 0.01f);
                  id(ecco_tou3_voltage).publish_state(values[23] * 0.01f);
                  id(ecco_tou4_voltage).publish_state(values[24] * 0.01f);
                  id(ecco_tou5_voltage).publish_state(values[25] * 0.01f);
                  id(ecco_tou6_voltage).publish_state(values[26] * 0.01f);

                  id(ecco_tou1_soc).publish_state(values[27]);
                  id(ecco_tou2_soc).publish_state(values[28]);
                  id(ecco_tou3_soc).publish_state(values[29]);
                  id(ecco_tou4_soc).publish_state(values[30]);
                  id(ecco_tou5_soc).publish_state(values[31]);
                  id(ecco_tou6_soc).publish_state(values[32]);

                  auto charge_source = [](uint16_t raw) -> std::string {
                    switch (raw & 0x0003) {
                      case 0: return std::string("None");
                      case 1: return std::string("Grid");
                      case 2: return std::string("Generator");
                      case 3: return std::string("Grid + Generator");
                    }
                    return std::string("Unknown");
                  };

                  auto tou_mode = [](uint16_t raw) -> std::string {
                    switch (raw & 0x001C) {
                      case 0x00: return std::string("None");
                      case 0x04: return std::string("General");
                      case 0x08: return std::string("Backup");
                      case 0x10: return std::string("Charge");
                      default: {
                        char b[24];
                        snprintf(b, sizeof(b), "Unknown 0x%02X", raw & 0x001C);
                        return std::string(b);
                      }
                    }
                  };

                  id(ecco_tou1_charge).publish_state(charge_source(values[33]));
                  id(ecco_tou2_charge).publish_state(charge_source(values[34]));
                  id(ecco_tou3_charge).publish_state(charge_source(values[35]));
                  id(ecco_tou4_charge).publish_state(charge_source(values[36]));
                  id(ecco_tou5_charge).publish_state(charge_source(values[37]));
                  id(ecco_tou6_charge).publish_state(charge_source(values[38]));

                  id(ecco_tou1_mode).publish_state(tou_mode(values[33]));
                  id(ecco_tou2_mode).publish_state(tou_mode(values[34]));
                  id(ecco_tou3_mode).publish_state(tou_mode(values[35]));
                  id(ecco_tou4_mode).publish_state(tou_mode(values[36]));
                  id(ecco_tou5_mode).publish_state(tou_mode(values[37]));
                  id(ecco_tou6_mode).publish_state(tou_mode(values[38]));

                  // Cache only the raw registers Stage 3.2 is allowed to write.
                  id(manual_cfg_reg250_raw) = values[9];
                  id(manual_cfg_reg251_raw) = values[10];
                  id(manual_cfg_reg256_raw) = values[15];
                  id(manual_cfg_reg268_raw) = values[27];
                  id(manual_cfg_reg274_raw) = values[33];
                  id(manual_config_raw_cache_valid) = id(configuration_block1_ok);

                  uint16_t system_bits = values[39]; // register 280
                  id(ecco_generator_peak_shaving).publish_state((system_bits & 0x00F0) == 0x0010);
                  id(ecco_grid_peak_shaving).publish_state((system_bits & 0x0F00) == 0x0100);
                  id(ecco_on_grid_always_on).publish_state((system_bits & 0x1000) != 0);

                  id(ecco_cfg_grid_max_voltage).publish_state(values[46] * 0.1f);
                  id(ecco_cfg_grid_min_voltage).publish_state(values[47] * 0.1f);
                  id(ecco_cfg_grid_max_frequency).publish_state(values[48] * 0.01f);
                  id(ecco_cfg_grid_min_frequency).publish_state(values[49] * 0.01f);
                  id(ecco_cfg_generator_peak_shaving_power).publish_state(values[51]);
                  id(ecco_cfg_grid_peak_shaving_power).publish_state(values[52]);

                  bool ok = id(configuration_block1_ok);
                  id(configuration_online).publish_state(ok);

                  auto now = id(ntp_time).now();
                  if (now.is_valid()) {
                    id(last_configuration_update).publish_state(
                      now.strftime("%Y-%m-%d %H:%M:%S")
                    );
                  }

                  ESP_LOGI(
                    "config",
                    "Config B: export %uW, TOU %s, slot1 %s %uW %u%%, signal raw=0x%04X",
                    values[4],
                    (values[7] & 0x0001) ? "ON" : "OFF",
                    format_time(values[9]).c_str(),
                    values[15],
                    values[27],
                    signal_flags
                  );
          on_error:
            then:
              - lambda: |-
                  id(configuration_failures)++;
                  id(manual_config_raw_cache_valid) = false;
                  id(configuration_online).publish_state(false);
                  ESP_LOGW(
                    "config",
                    "Configuration block 241-293 Modbus exception: 0x%02X",
                    (uint8_t) exception_code
                  );
          on_no_response:
            then:
              - lambda: |-
                  id(configuration_failures)++;
                  id(manual_config_raw_cache_valid) = false;
                  id(configuration_online).publish_state(false);
                  ESP_LOGW("config", "No response to configuration block 241-293");

      - delay: 2500ms

      # Block C: communication-board basic-setting flags.
      # Register 330 packs Time Sync in bits 0-1 and Beep in bits 2-3.
      # Pair value 2 = Disable, 3 = Enable; 0/1 are no-action/reserved states.
      - modbus_client.read_holding_registers:
          modbus_id: inverter_modbus
          address: 0x01
          start_address: 330
          count: 1
          on_response:
            then:
              - lambda: |-
                  uint16_t basic = values[0];
                  id(ecco_cfg_basic_settings_raw).publish_state(basic);

                  auto decode_basic_pair = [](uint16_t pair) -> std::string {
                    switch (pair & 0x0003) {
                      case 2: return std::string("Disable");
                      case 3: return std::string("Enable");
                      case 0: return std::string("No action (0)");
                      case 1: return std::string("No action (1)");
                    }
                    return std::string("Unknown");
                  };

                  id(ecco_basic_sync_clock).publish_state(
                    decode_basic_pair(basic & 0x0003)
                  );
                  id(ecco_basic_beep).publish_state(
                    decode_basic_pair((basic >> 2) & 0x0003)
                  );

                  ESP_LOGI(
                    "config",
                    "Config C: basic raw=0x%04X, Sync Clock=%s, Beep=%s",
                    basic,
                    decode_basic_pair(basic & 0x0003).c_str(),
                    decode_basic_pair((basic >> 2) & 0x0003).c_str()
                  );
          on_error:
            then:
              - lambda: |-
                  id(configuration_failures)++;
                  id(configuration_online).publish_state(false);
                  ESP_LOGW(
                    "config",
                    "Configuration register 330 Modbus exception: 0x%02X",
                    (uint8_t) exception_code
                  );
          on_no_response:
            then:
              - lambda: |-
                  id(configuration_failures)++;
                  id(configuration_online).publish_state(false);
                  ESP_LOGW("config", "No response to configuration register 330");

button:
  - platform: restart
    name: "Restart"

  - platform: template
    name: "Read Inverter Clock"
    id: read_inverter_clock
    on_press:
      - modbus_client.read_holding_registers:
          modbus_id: inverter_modbus
          address: 0x01
          start_address: 0x0016
          count: 3
          on_response:
            then:
              - lambda: |-
                  id(clock_difference_valid) = false;

                  int year = 2000 + ((values[0] >> 8) & 0xFF);
                  int month = values[0] & 0xFF;
                  int day = (values[1] >> 8) & 0xFF;
                  int hour = values[1] & 0xFF;
                  int minute = (values[2] >> 8) & 0xFF;
                  int second = values[2] & 0xFF;

                  if (
                    year < 2020 || year > 2099 ||
                    month < 1 || month > 12 ||
                    day < 1 || day > 31 ||
                    hour > 23 || minute > 59 || second > 59
                  ) {
                    ESP_LOGW("ecco", "Invalid inverter RTC data received");
                    return;
                  }

                  char buffer[32];
                  snprintf(
                    buffer,
                    sizeof(buffer),
                    "%04d-%02d-%02d %02d:%02d:%02d",
                    year, month, day, hour, minute, second
                  );
                  id(inverter_clock).publish_state(buffer);

                  if (!id(ntp_synced)) {
                    ESP_LOGI("ecco", "Inverter RTC: %s | Waiting for confirmed NTP", buffer);
                    return;
                  }

                  auto now = id(ntp_time).now();
                  if (!now.is_valid()) {
                    ESP_LOGW("ecco", "Inverter RTC: %s | NTP currently invalid", buffer);
                    return;
                  }

                  int inverter_seconds = hour * 3600 + minute * 60 + second;
                  int ntp_seconds = now.hour * 3600 + now.minute * 60 + now.second;
                  int difference = inverter_seconds - ntp_seconds;

                  if (difference > 43200) difference -= 86400;
                  if (difference < -43200) difference += 86400;

                  int abs_difference = difference < 0 ? -difference : difference;
                  bool date_mismatch =
                    year != now.year ||
                    month != now.month ||
                    day != now.day_of_month;

                  id(latest_clock_difference) = difference;
                  id(clock_difference_valid) = true;
                  id(clock_difference).publish_state(difference);

                  if (abs_difference > id(max_clock_error)) {
                    id(max_clock_error) = abs_difference;
                  }

                  ESP_LOGI(
                    "ecco",
                    "Inverter RTC: %s | Difference from NTP: %d s",
                    buffer,
                    difference
                  );

                  if (id(verification_read_active)) {
                    id(verification_read_active) = false;
                    int threshold = (int) id(correction_threshold).state;
                    bool verified = !date_mismatch && abs_difference <= threshold;

                    if (verified) {
                      id(corrections_since_boot)++;
                      id(correction_in_progress) = false;
                      id(correction_is_manual) = false;
                      id(correction_attempt) = 0;
                      id(have_rtc_baseline) = false;
                      id(rtc_stall_detected).publish_state(false);

                      auto verified_time = id(ntp_time).now();
                      if (verified_time.is_valid()) {
                        char timestamp[32];
                        snprintf(
                          timestamp,
                          sizeof(timestamp),
                          "%04d-%02d-%02d %02d:%02d:%02d",
                          verified_time.year,
                          verified_time.month,
                          verified_time.day_of_month,
                          verified_time.hour,
                          verified_time.minute,
                          verified_time.second
                        );
                        id(last_correction).publish_state(timestamp);
                      }

                      char result[96];
                      snprintf(result, sizeof(result), "Verified OK - error now %d s", difference);
                      id(last_correction_result).publish_state(result);
                      ESP_LOGI("ecco", "RTC correction VERIFIED - error now %d seconds", difference);
                    } else {
                      bool retry_allowed =
                        id(correction_attempt) < 2 &&
                        (id(correction_is_manual) || id(automatic_clock_sync).state);

                      if (retry_allowed) {
                        id(correction_attempt)++;
                        id(auto_sync_pending) = true;
                        char result[96];
                        snprintf(
                          result,
                          sizeof(result),
                          "Verification failed (%d s) - retry %d queued",
                          difference,
                          id(correction_attempt)
                        );
                        id(last_correction_result).publish_state(result);
                        ESP_LOGW(
                          "ecco",
                          "RTC verification failed at %d seconds - retry queued",
                          difference
                        );
                      } else {
                        id(failed_corrections)++;
                        id(correction_in_progress) = false;
                        id(correction_is_manual) = false;
                        id(correction_attempt) = 0;
                        id(verification_pending) = false;
                        id(have_rtc_baseline) = false;
                        id(cooldown_until_ms) = millis() + 300000;
                        char result[112];
                        snprintf(
                          result,
                          sizeof(result),
                          "FAILED after retries - error %d s - 5 min cooldown",
                          difference
                        );
                        id(last_correction_result).publish_state(result);
                        ESP_LOGE(
                          "ecco",
                          "RTC correction failed after retries - entering 5 minute cooldown"
                        );
                      }
                    }
                    return;
                  }

                  if (id(have_rtc_baseline)) {
                    int ntp_elapsed = ntp_seconds - id(previous_ntp_sod);
                    int inverter_elapsed = inverter_seconds - id(previous_inverter_sod);

                    if (ntp_elapsed < 0) ntp_elapsed += 86400;
                    if (inverter_elapsed < 0) inverter_elapsed += 86400;

                    if (ntp_elapsed >= 45 && ntp_elapsed <= 90) {
                      bool stalled = inverter_elapsed < (ntp_elapsed - 15);
                      id(rtc_stall_detected).publish_state(stalled);
                      if (stalled) {
                        id(rtc_stall_count)++;
                        ESP_LOGW(
                          "ecco",
                          "RTC STALL detected - inverter advanced %d s while NTP advanced %d s",
                          inverter_elapsed,
                          ntp_elapsed
                        );
                      }
                    } else {
                      id(rtc_stall_detected).publish_state(false);
                    }
                  }

                  id(previous_inverter_sod) = inverter_seconds;
                  id(previous_ntp_sod) = ntp_seconds;
                  id(have_rtc_baseline) = true;

                  int threshold = (int) id(correction_threshold).state;

                  if (
                    id(cooldown_until_ms) != 0 &&
                    (int32_t)(millis() - id(cooldown_until_ms)) >= 0
                  ) {
                    id(cooldown_until_ms) = 0;
                    ESP_LOGI("ecco", "RTC correction cooldown expired");
                  }

                  bool cooldown_active =
                    id(cooldown_until_ms) != 0 &&
                    (int32_t)(millis() - id(cooldown_until_ms)) < 0;

                  if (
                    id(automatic_clock_sync).state &&
                    !id(correction_in_progress) &&
                    !cooldown_active &&
                    (date_mismatch || abs_difference >= threshold)
                  ) {
                    id(correction_in_progress) = true;
                    id(correction_is_manual) = false;
                    id(correction_attempt) = 1;
                    id(auto_sync_pending) = true;

                    char result[96];
                    snprintf(
                      result,
                      sizeof(result),
                      "Automatic correction queued - error %d s",
                      difference
                    );
                    id(last_correction_result).publish_state(result);
                    ESP_LOGW(
                      "ecco",
                      "RTC correction queued - clock difference: %d seconds",
                      difference
                    );
                  }
          on_error:
            then:
              - lambda: |-
                  ESP_LOGW(
                    "ecco",
                    "Modbus exception while reading RTC: 0x%02X",
                    (uint8_t) exception_code
                  );
                  if (id(verification_read_active)) {
                    id(verification_read_active) = false;
                    id(comm_failure_pending) = true;
                    id(last_correction_result).publish_state(
                      "Verification read error - processing retry"
                    );
                  }
          on_no_response:
            then:
              - lambda: |-
                  ESP_LOGW("ecco", "No response while reading inverter RTC");
                  if (id(verification_read_active)) {
                    id(verification_read_active) = false;
                    id(comm_failure_pending) = true;
                    id(last_correction_result).publish_state(
                      "Verification read timed out - processing retry"
                    );
                  }

  - platform: template
    name: "Sync Inverter Clock"
    id: sync_inverter_clock
    on_press:
      - if:
          condition:
            lambda: |-
              return
                !id(correction_in_progress) &&
                !id(manual_write_in_progress) &&
                id(ntp_synced) &&
                id(ntp_time).now().is_valid();
          then:
            - lambda: |-
                id(cooldown_until_ms) = 0;
                id(correction_in_progress) = true;
                id(correction_is_manual) = true;
                id(correction_attempt) = 1;
                id(last_correction_result).publish_state("Manual correction started");
            - script.execute:
                id: write_inverter_rtc
          else:
            - logger.log:
                level: WARN
                format: "Manual RTC sync unavailable - correction already active or NTP not ready"

  - platform: template
    name: "Load Current Slot 1 To Manual Staging"
    id: load_manual_slot1_staging
    icon: "mdi:tray-arrow-down"
    on_press:
      - if:
          condition:
            lambda: |-
              return id(manual_config_raw_cache_valid) && !id(manual_write_in_progress);
          then:
            - lambda: |-
                id(manual_slot1_start_hhmm).publish_state(id(manual_cfg_reg250_raw));
                id(manual_slot1_end_hhmm).publish_state(id(manual_cfg_reg251_raw));
                id(manual_slot1_power).publish_state(id(manual_cfg_reg256_raw));
                id(manual_slot1_soc).publish_state(id(manual_cfg_reg268_raw));
                id(manual_stage_grid_charge_enabled).publish_state(
                  (id(manual_cfg_reg232_raw) & 0x0001) != 0
                );

                switch (id(manual_cfg_reg274_raw) & 0x0003) {
                  case 0: id(manual_slot1_charge_source).publish_state("None"); break;
                  case 1: id(manual_slot1_charge_source).publish_state("Grid"); break;
                  case 2: id(manual_slot1_charge_source).publish_state("Generator"); break;
                  case 3: id(manual_slot1_charge_source).publish_state("Grid + Generator"); break;
                }

                switch (id(manual_cfg_reg274_raw) & 0x001C) {
                  case 0x00: id(manual_slot1_mode).publish_state("None"); break;
                  case 0x04: id(manual_slot1_mode).publish_state("General"); break;
                  case 0x08: id(manual_slot1_mode).publish_state("Backup"); break;
                  case 0x10: id(manual_slot1_mode).publish_state("Charge"); break;
                  default: id(manual_slot1_mode).publish_state("None"); break;
                }

                id(manual_config_last_result).publish_state(
                  "Manual staging loaded from current inverter Slot 1 readback"
                );
          else:
            - lambda: |-
                id(manual_config_last_result).publish_state(
                  "Cannot load staging - refresh configuration first"
                );

  - platform: template
    name: "Apply Manual Slot 1 Settings"
    id: apply_manual_slot1_button
    icon: "mdi:content-save-alert-outline"
    on_press:
      - script.execute:
          id: apply_manual_slot1

  - platform: template
    name: "Refresh Inverter Telemetry"
    on_press:
      - if:
          condition:
            lambda: |-
              return !id(correction_in_progress) && !id(manual_write_in_progress);
          then:
            - script.execute:
                id: poll_inverter_telemetry

  - platform: template
    name: "Refresh Inverter Configuration"
    id: refresh_inverter_configuration
    icon: "mdi:refresh"
    on_press:
      - if:
          condition:
            lambda: |-
              return !id(correction_in_progress) && !id(manual_write_in_progress);
          then:
            - script.execute:
                id: poll_inverter_configuration

interval:
  - interval: 60s
    startup_delay: 30s
    then:
      - if:
          condition:
            lambda: |-
              return !id(correction_in_progress) && !id(manual_write_in_progress);
          then:
            - button.press:
                id: read_inverter_clock

  - interval: 10s
    startup_delay: 5s
    then:
      - if:
          condition:
            lambda: |-
              return id(live_telemetry).state && !id(correction_in_progress) && !id(manual_write_in_progress);
          then:
            - script.execute:
                id: poll_inverter_telemetry

  # Stage 3 configuration is slow-changing data, so only two block reads
  # per minute. The 20-second phase keeps it away from the normal RTC read
  # at 30s and the 10-second telemetry cadence.
  - interval: 60s
    startup_delay: 20s
    then:
      - if:
          condition:
            lambda: |-
              return id(configuration_polling).state && !id(correction_in_progress) && !id(manual_write_in_progress);
          then:
            - script.execute:
                id: poll_inverter_configuration

  - interval: 1s
    startup_delay: 5s
    then:
      - if:
          condition:
            lambda: |-
              return id(comm_failure_pending);
          then:
            - lambda: |-
                id(comm_failure_pending) = false;
                id(verification_pending) = false;
                id(verification_read_active) = false;

                bool retry_allowed =
                  id(correction_attempt) < 2 &&
                  (id(correction_is_manual) || id(automatic_clock_sync).state);

                if (retry_allowed) {
                  id(correction_attempt)++;
                  id(auto_sync_pending) = true;
                  char result[96];
                  snprintf(
                    result,
                    sizeof(result),
                    "Communication failure - retry %d queued",
                    id(correction_attempt)
                  );
                  id(last_correction_result).publish_state(result);
                  ESP_LOGW(
                    "ecco",
                    "Communication failure - retry %d queued",
                    id(correction_attempt)
                  );
                } else {
                  id(failed_corrections)++;
                  id(correction_in_progress) = false;
                  id(correction_is_manual) = false;
                  id(correction_attempt) = 0;
                  id(have_rtc_baseline) = false;
                  id(cooldown_until_ms) = millis() + 300000;
                  id(last_correction_result).publish_state(
                    "FAILED after communication errors - 5 min cooldown"
                  );
                  ESP_LOGE("ecco", "RTC correction failed after communication errors");
                }

      - if:
          condition:
            lambda: |-
              return id(auto_sync_pending);
          then:
            - lambda: |-
                id(auto_sync_pending) = false;
            - if:
                condition:
                  lambda: |-
                    return
                      id(ntp_synced) &&
                      id(ntp_time).now().is_valid() &&
                      (id(correction_is_manual) || id(automatic_clock_sync).state);
                then:
                  - logger.log:
                      level: INFO
                      format: "Processing queued NTP clock correction"
                  - script.execute:
                      id: write_inverter_rtc
                else:
                  - lambda: |-
                      id(correction_in_progress) = false;
                      id(correction_is_manual) = false;
                      id(correction_attempt) = 0;
                      id(verification_pending) = false;
                      id(last_correction_result).publish_state("Correction cancelled");
                  - logger.log:
                      level: WARN
                      format: "Queued RTC correction cancelled"

      - if:
          condition:
            lambda: |-
              return
                id(verification_pending) &&
                !id(verification_read_active) &&
                (int32_t)(millis() - id(verification_due_ms)) >= 0;
          then:
            - lambda: |-
                id(verification_pending) = false;
                id(verification_read_active) = true;
                ESP_LOGI("ecco", "Performing post-write RTC verification");
            - button.press:
                id: read_inverter_clock
