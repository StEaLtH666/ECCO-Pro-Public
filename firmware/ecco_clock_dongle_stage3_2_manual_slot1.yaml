    entity_category: diagnostic

  - platform: template
    name: "Manual Configuration Last Result"
    id: manual_config_last_result
    update_interval: never
    icon: "mdi:clipboard-check-outline"

  # Stage 3 - read-only configuration text states
  - platform: template
    name: "ECCO Battery Control Mode"
    id: ecco_battery_control_mode
    update_interval: never

  - platform: template
    name: "ECCO Battery Operation Mode"
    id: ecco_battery_operation_mode
    update_interval: never

  - platform: template
    name: "ECCO Battery Wake Up Lithium"
    id: ecco_battery_wake_up_lithium
    update_interval: never

  # Register 242 signal flags, exposed read-only.
  - platform: template
    name: "ECCO Grid Signal"
    id: ecco_grid_signal
    update_interval: never

  - platform: template
    name: "ECCO Generator Signal"
    id: ecco_generator_signal
    update_interval: never

  - platform: template
    name: "ECCO Inverter Basic Settings Sync Clock"
    id: ecco_basic_sync_clock
    update_interval: never

  - platform: template
    name: "ECCO Inverter Basic Settings Beep"
    id: ecco_basic_beep
    update_interval: never

  - platform: template
    name: "ECCO AUX Port Function"
    id: ecco_aux_port_function
    update_interval: never

  - platform: template
    name: "ECCO Energy Management Model"
    id: ecco_energy_management_model
    update_interval: never

  - platform: template
    name: "ECCO Load Limit Exp Ess Non-Ess"
    id: ecco_load_limit
    update_interval: never

  # Time-of-use display values - deliberately text/read-only
  - platform: template
    name: "ECCO Timezone1 Time"
    id: ecco_tou1_time
    update_interval: never
  - platform: template
    name: "ECCO Timezone2 Time"
    id: ecco_tou2_time
    update_interval: never
  - platform: template
    name: "ECCO Timezone3 Time"
    id: ecco_tou3_time
    update_interval: never
  - platform: template
    name: "ECCO Timezone4 Time"
    id: ecco_tou4_time
    update_interval: never
  - platform: template
    name: "ECCO Timezone5 Time"
    id: ecco_tou5_time
    update_interval: never
  - platform: template
    name: "ECCO Timezone6 Time"
    id: ecco_tou6_time
    update_interval: never

  - platform: template
    name: "ECCO Timezone1 Charge"
    id: ecco_tou1_charge
    update_interval: never
  - platform: template
    name: "ECCO Timezone2 Charge"
    id: ecco_tou2_charge
    update_interval: never
  - platform: template
    name: "ECCO Timezone3 Charge"
    id: ecco_tou3_charge
    update_interval: never
  - platform: template
    name: "ECCO Timezone4 Charge"
    id: ecco_tou4_charge
    update_interval: never
  - platform: template
    name: "ECCO Timezone5 Charge"
    id: ecco_tou5_charge
    update_interval: never
  - platform: template
    name: "ECCO Timezone6 Charge"
    id: ecco_tou6_charge
    update_interval: never

  # Extra ECCO diagnostics: Deye also stores a mode in each TOU flag register.
