# ECCO Clock Dongle - Stage 3.2 MANUAL Slot 1 Control
# Stage 1 live telemetry + Stage 2b energy + Stage 3 config/TOU reads
# Stage 3.1 mapping diagnostics retained (register 242 signals + register 330 basic flags).
# Stage 3.2 adds USER-TRIGGERED, ARMED, VERIFIED manual writes for TOU Slot 1 only.
# NO automatic optimiser writes are enabled. RTC correction remains independent.
# Safety: writes require Manual Configuration Write Enable = ON; switch auto-disarms after Apply.

esphome:
  name: ecco-clock-dongle
  friendly_name: ECCO Clock Dongle
  min_version: 2026.4.0
  name_add_mac_suffix: false

  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(ntp_synced_sensor).publish_state(false);
          id(rtc_stall_detected).publish_state(false);
          id(telemetry_online).publish_state(false);
          id(configuration_online).publish_state(false);
          id(last_correction).publish_state("Never");
          id(last_correction_result).publish_state("None since boot");
          id(last_telemetry_update).publish_state("Waiting");
          id(last_configuration_update).publish_state("Waiting");
          id(configuration_access_mode).publish_state("Manual Slot 1 writes available - master arm required; automatic writes disabled");
          id(manual_config_last_result).publish_state("No manual write since boot");

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret ecco_api_key

ota:
  - platform: esphome
    password: !secret ecco_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: sntp
    id: ntp_time
    timezone: Europe/London
    servers:
      - 0.uk.pool.ntp.org
      - 1.uk.pool.ntp.org
      - 2.uk.pool.ntp.org
    update_interval: 15min
    on_time_sync:
      then:
        - lambda: |-
            id(ntp_synced) = true;
            id(ntp_synced_sensor).publish_state(true);
        - logger.log:
            level: INFO
            format: "NTP synchronised - RTC correction system enabled"

uart:
  id: inverter_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: inverter_modbus
  uart_id: inverter_uart
  role: client

globals:
  - id: ntp_synced
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: latest_clock_difference
    type: int
    restore_value: no
    initial_value: '0'
  - id: clock_difference_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: auto_sync_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: correction_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: correction_is_manual
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: correction_attempt
    type: int
    restore_value: no
    initial_value: '0'
  - id: verification_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: verification_read_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: verification_due_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: comm_failure_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: cooldown_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: corrections_since_boot
    type: int
    restore_value: no
    initial_value: '0'
  - id: failed_corrections
    type: int
    restore_value: no
    initial_value: '0'
  - id: write_attempts_since_boot
    type: int
    restore_value: no
    initial_value: '0'
  - id: rtc_stall_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: max_clock_error
    type: int
    restore_value: no
    initial_value: '0'
  - id: have_rtc_baseline
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: previous_inverter_sod
    type: int
    restore_value: no
    initial_value: '0'
  - id: previous_ntp_sod
    type: int
    restore_value: no
    initial_value: '0'
  - id: telemetry_failures
    type: int
    restore_value: no
    initial_value: '0'
  - id: configuration_failures
    type: int
    restore_value: no
    initial_value: '0'
  - id: configuration_block1_ok
    type: bool
    restore_value: no
    initial_value: 'false'

  # Stage 3.2 manual Slot 1 control - raw cache and verification state
  - id: manual_config_raw_cache_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: manual_cfg_reg232_raw
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: manual_cfg_reg250_raw
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: manual_cfg_reg251_raw
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: manual_cfg_reg256_raw
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: manual_cfg_reg268_raw
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: manual_cfg_reg274_raw
    type: uint16_t
    restore_value: no
    initial_value: '0'

  - id: manual_write_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: manual_write_failed
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: manual_verify_reg232_ok
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: manual_expected_reg232
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: manual_expected_reg250
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: manual_expected_reg251
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: manual_expected_reg256
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: manual_expected_reg268
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: manual_expected_reg274
    type: uint16_t
    restore_value: no
    initial_value: '0'

  - id: manual_write_attempts
    type: int
    restore_value: no
    initial_value: '0'
  - id: manual_write_successes
    type: int
    restore_value: no
    initial_value: '0'
  - id: manual_write_failures
    type: int
    restore_value: no
    initial_value: '0'

number:
  - platform: template
    name: "Clock Correction Threshold"
    id: correction_threshold
    optimistic: true
    restore_value: true
    initial_value: 20
    min_value: 10
    max_value: 120
    step: 5
    unit_of_measurement: "s"
    icon: "mdi:timer-cog-outline"

  # Stage 3.2 staging values. Editing these NEVER writes the inverter.
  # Slot 1 end is the Timezone2 boundary (register 251).
  - platform: template
    name: "Manual Slot 1 Start HHMM"
    id: manual_slot1_start_hhmm
    optimistic: true
    restore_value: false
    initial_value: 35
    min_value: 0
    max_value: 2359
    step: 1
    icon: "mdi:clock-start"

  - platform: template
    name: "Manual Slot 1 End HHMM"
    id: manual_slot1_end_hhmm
    optimistic: true
    restore_value: false
    initial_value: 525
    min_value: 0
    max_value: 2359
    step: 1
    icon: "mdi:clock-end"

  - platform: template
    name: "Manual Slot 1 Power"
    id: manual_slot1_power
    optimistic: true
    restore_value: false
    initial_value: 8000
    min_value: 0
    max_value: 8000
    step: 100
    unit_of_measurement: "W"
    icon: "mdi:flash"

  - platform: template
    name: "Manual Slot 1 Target SOC"
    id: manual_slot1_soc
    optimistic: true
    restore_value: false
    initial_value: 100
    min_value: 5
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    icon: "mdi:battery-charging-100"

switch:
  - platform: template
    name: "Automatic Clock Sync"
    id: automatic_clock_sync
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:clock-check-outline"

  - platform: template
    name: "Live Inverter Telemetry"
    id: live_telemetry
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:solar-power-variant"

  # Local ECCO control only: enables/disables READS of inverter settings.
  # This does not write any inverter setting.
  - platform: template
    name: "Read-Only Configuration Polling"
    id: configuration_polling
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:eye-outline"

  # Master safety arm. Turning this ON does not itself write anything.
  # It automatically turns OFF after every Apply attempt.
  - platform: template
    name: "Manual Configuration Write Enable"
    id: manual_config_write_enable
    optimistic: true
    restore_mode: ALWAYS_OFF
    icon: "mdi:shield-key-outline"

  # Staged value only. Use Apply Manual Slot 1 Settings to write it.
  - platform: template
    name: "Manual Stage Grid Charge Enabled"
    id: manual_stage_grid_charge_enabled
    optimistic: true
    restore_mode: ALWAYS_OFF
    icon: "mdi:transmission-tower-import"

select:
  # Staged values only - these do not write until Apply is pressed.
  - platform: template
    name: "Manual Slot 1 Charge Source"
    id: manual_slot1_charge_source
    optimistic: true
    options:
      - "None"
      - "Grid"
      - "Generator"
      - "Grid + Generator"
    initial_option: "None"
    icon: "mdi:transmission-tower"

  - platform: template
    name: "Manual Slot 1 Mode"
    id: manual_slot1_mode
    optimistic: true
    options:
      - "None"
      - "General"
      - "Backup"
      - "Charge"
    initial_option: "General"
    icon: "mdi:battery-cog-outline"

binary_sensor:
  - platform: template
    name: "NTP Synced"
    id: ntp_synced_sensor
    entity_category: diagnostic
    icon: "mdi:clock-check"

  - platform: template
    name: "RTC Stall Detected"
    id: rtc_stall_detected
    entity_category: diagnostic
    icon: "mdi:clock-alert-outline"

  - platform: template
    name: "ECCO Grid Connected"
    id: ecco_grid_connected
    device_class: connectivity

  - platform: template
    name: "ECCO Generator Connected"
    id: ecco_generator_connected
    device_class: connectivity

  - platform: template
    name: "Telemetry Online"
    id: telemetry_online
    device_class: connectivity
    entity_category: diagnostic

  - platform: template
    name: "Configuration Online"
    id: configuration_online
    device_class: connectivity
    entity_category: diagnostic

  # Stage 3 - read-only inverter configuration states
  - platform: template
    name: "ECCO Battery Generator Charge Enabled"
    id: ecco_generator_charge_enabled

  - platform: template
    name: "ECCO Battery Grid Charge Enabled"
    id: ecco_grid_charge_enabled

  - platform: template
    name: "ECCO Force Generator"
    id: ecco_force_generator

  - platform: template
    name: "ECCO Export Solar Enabled"
    id: ecco_export_solar_enabled

  - platform: template
    name: "ECCO Time Of Use Enabled"
    id: ecco_time_of_use_enabled

  - platform: template
    name: "ECCO Generator Peak Shaving"
    id: ecco_generator_peak_shaving

  - platform: template
    name: "ECCO Grid Peak Shaving"
    id: ecco_grid_peak_shaving

  - platform: template
    name: "ECCO On Grid Always On"
    id: ecco_on_grid_always_on

text_sensor:
  - platform: template
    name: "NTP Time"
    id: ntp_clock
    update_interval: 60s
    lambda: |-
      if (!id(ntp_synced)) {
        return std::string("Waiting for NTP");
      }
      auto now = id(ntp_time).now();
      if (!now.is_valid()) {
        return std::string("NTP time invalid");
      }
      return now.strftime("%Y-%m-%d %H:%M:%S");

  - platform: template
    name: "Inverter Time"
    id: inverter_clock
    update_interval: never

  - platform: template
    name: "Last Correction"
    id: last_correction
    update_interval: never
    entity_category: diagnostic

  - platform: template
    name: "Last Correction Result"
    id: last_correction_result
    update_interval: never
    entity_category: diagnostic

  - platform: template
    name: "ECCO Inverter System State"
    id: ecco_inverter_system_state
    update_interval: never
    icon: "mdi:state-machine"

  - platform: template
    name: "ECCO Inverter Warning"
    id: ecco_inverter_warning
    update_interval: never
    icon: "mdi:alert-outline"

  - platform: template
    name: "ECCO Inverter Fault"
    id: ecco_inverter_fault
    update_interval: never
    icon: "mdi:alert-octagon-outline"

  - platform: template
