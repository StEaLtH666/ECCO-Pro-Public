# ECCO firmware area map (S2a): which review/navigation AREA every list item of the production firmware belongs to.
#
# Read by tools/assemble_firmware.py (--map, --where, --lookup, --xref, --plan, --diff-regions, --validate-map) and pinned
# by tools/tests/test_firmware_assembly.py. It changes nothing in the firmware and is not read by ESPHome, the
# write-surface analyser, the S0 equivalence checker or the proof chain.
#
# Rules
# - `runs` cover every item of every list section exactly once, in monolith order; `n` is the run's item count.
#   `first` / `last` name an item by its `id:`, or `name:<name>`, or `index:<0-based index in the section>`.
# - Everything that is not a list item (substitutions, esphome incl. on_boot, api, ota, wifi, time, uart, modbus and the
#   section key lines) is `core`.
# - A firmware change that adds, removes or reorders items must update the affected run (the suite fails otherwise).
#   `monolith_sha256_lf` records the monolith this map was reviewed against; a different monolith only warns.
# - Two runs (81 globals and 5 text sensors of the FB-C failback evaluator, in the fallback area) are anchored by index
#   instead of id: the FB-C core suite's Z5 non-authority pin (registry/tests, "Z5 no ... tools file references ...")
#   requires that no tools/ file spells that evaluator's id prefix. The tool still prints the real ids at run time.
# - `core_sections` lists the list sections whose items all stay in core (they get no runs).
#
# Provenance: classified by reading each item's id AND body (what it writes and reads), starting from the S1 research
# module map, against public main e7a265b8 (monolith LF sha256 9cb4bd6c...); every run was re-verified against the source
# order and counts. `# why:` notes record the non-obvious calls. Review boundaries only: see `warning`.
schema: ecco-firmware-areas/1
monolith: firmware/ecco_clock_dongle_stage3_4_free_power.yaml
monolith_sha256_lf: 9cb4bd6c4f4d2dc9a95af8a7a4af2fa770c582d62a7545649dff0895ffef9b8d
reviewed_at: e7a265b8d8779b7c15a47a6716f61d6a2227bc6f
core_sections: [ota, time]  # one platform item each (OTA password, SNTP clock with on_time_sync)
warning: >-
  Areas are review and navigation boundaries, NOT SAFETY ISOLATION. Areas share state (the write mutex
  manual_write_in_progress, the configuration cache, snapshot flags, the 14 ordered intervals), and every safety argument
  must still be made over the whole monolith. An item's area says where to read first, not what it may affect.
areas:
  core: Platform and configuration skeleton (substitutions, esphome incl. on_boot and the header includes, api actions, ota, wifi, time, uart, modbus, section keys)
  telemetry: Read-only live telemetry, inverter configuration readback sinks and the capability profile entities (no writes)
  diagnostics: Wi-Fi signal, lock-age and lock-held diagnostics, debug heap and reset reason, build identity
  modbus: Telemetry and configuration polling, the configuration cache (manual_cfg_reg*_raw) and the Block-B fence
  rtc: NTP and inverter clock reading, the clock correction write and its policy state
  arbitration: The shared write mutex, safety census, lock escalation and the restart arm
  tou: Manual TOU slots and the register-244 export-mode policy
  free_power: Free Power override, its snapshot, verified restore and operator recovery
  dump: Dump to Grid, its operating limits and the three Dump-coupled sensors whose on_value feeds the Dump guards
  fallback: HA supervision heartbeat, the FB-C failback evaluator, the boot-time marker loads and the fallback profile (review, save, invalidate)
runs:
  - {section: globals, first: ntp_synced, last: previous_ntp_sod, area: rtc, n: 20}  # why: ntp_synced is written only by time on_time_sync (core) but is RTC state read by rtc/free_power/dump/fallback
  - {section: globals, first: telemetry_failures, last: configuration_block1_ok, area: modbus, n: 3}
  - {section: globals, first: rtc_txn_since_ms, last: rtc_policy_reason, area: rtc, n: 9}
  - {section: globals, first: cfg_poll_owed, last: manual_cfg_reg279_raw, area: modbus, n: 28}  # why: configuration cache owned by the poll dispatch; also written by the TOU apply readback, the reg244 scripts and the RTC 1 s interval (cfg_poll_owed)
  - {section: globals, first: manual_write_in_progress, last: manual_write_in_progress, area: arbitration, n: 1}  # why: the shared write mutex; acquired by free_power, tou, dump and fallback (22 sites)
  - {section: globals, first: manual_write_failed, last: manual_write_failures, area: tou, n: 38}
  - {section: globals, first: free_power_snapshot_valid, last: free_power_recovery_accept_successes, area: free_power, n: 192}  # why: snapshot/marker state is also loaded by core on_boot (NVS read only)
  - {section: globals, first: reg244_staging_loaded, last: reg244_failures, area: tou, n: 16}  # why: reg244 is part of tou; its snapshot is also loaded by core on_boot
  - {section: globals, first: dump_snapshot_valid, last: dump_soc_last_update_ms, area: dump, n: 72}  # why: includes the 7 operating-limit globals and the guard globals written by the 3 Dump-coupled sensors
  - {section: globals, first: cfg_block_b_seq, last: cfg_block_b_response_dispatch_seq, area: modbus, n: 4}  # why: Block-B fence, written only by poll_inverter_configuration_dispatch; read by dump/fallback/tou
  - {section: globals, first: dump_active_cfg_seq, last: dump_restore_failed_ms, area: dump, n: 50}
  - {section: globals, first: ecco_unsafe_reason, last: ecco_lock_escalated, area: arbitration, n: 6}  # why: written only by ecco_safety_census, ecco_restart_arm and the 5 s interval
  - {section: globals, first: dump_export_trip, last: dump_containment_cfg_fence_seq, area: dump, n: 46}  # why: includes the operating-limit global dump_limits_reconfirm
  - {section: globals, first: supervision_state, last: supervision_last_invalid_reason, area: fallback, n: 19}  # why: supervision state; written by core on_boot, the api heartbeat action and the supervision tick
  - {section: globals, first: diag_write_lock_held, last: diag_correction_lock_max_ms, area: diagnostics, n: 6}  # why: diag_* by the area rule; their only writer is the lock-sampling block of the supervision tick (fallback)
  - {section: globals, first: "index:510", last: fallback_profile_live_fence_flags, area: fallback, n: 155}  # why: 81 FB-C failback evaluator globals (index anchor, see the header: Z5), the 3 boot-time marker load results free_power_/dump_/reg244_marker_boot_load (written only by core on_boot, read only by the fallback profile review; S1 had put them in arbitration) and the 71 fallback profile globals incl. fbc_raw_* (written by the poll dispatch, read only by fallback)
  - {section: number, first: correction_threshold, last: correction_threshold, area: rtc, n: 1}
  - {section: number, first: free_power_duration_minutes, last: free_power_max_power, area: free_power, n: 2}
  - {section: number, first: dump_export_power, last: dump_duration_minutes, area: dump, n: 5}  # why: includes the durable operating-limit numbers dump_op_ceiling_number and dump_max_export_number
  - {section: number, first: manual_slot1_start_hhmm, last: manual_slot6_soc, area: tou, n: 24}
  - {section: switch, first: automatic_clock_sync, last: automatic_clock_sync, area: rtc, n: 1}
