cross_area:
  - {id: manual_write_in_progress, owner: arbitration, written_by: [free_power, tou, dump, fallback], read_by: [diagnostics, rtc, free_power, tou, modbus, dump, arbitration, fallback], note: "the shared write mutex; 22 '= true' acquisitions (free_power 8, tou 8 incl. reg244 2, dump 4, fallback 2); arbitration itself never takes it"}
  - {id: correction_in_progress, owner: rtc, written_by: [rtc], read_by: [diagnostics, free_power, tou, modbus, dump, arbitration, fallback], note: "set true only by read_inverter_clock and sync_inverter_clock; every other writer line is rtc"}
  - {id: "manual_cfg_reg*_raw", owner: modbus, written_by: [modbus, tou], read_by: [tou, dump, fallback, rtc], note: "26 cache globals; the poll dispatch writes them, the TOU apply readback and reg244 scripts also write; companion manual_config_raw_cache_valid"}
  - {id: "cfg_block_b_*", owner: modbus, written_by: [modbus], read_by: [dump, fallback, tou], note: "declared between Dump globals; written only by poll_inverter_configuration_dispatch"}
  - {id: cfg_poll_owed, owner: modbus, written_by: [modbus, rtc], read_by: [modbus], note: "written by the poll dispatch and the RTC 1 s interval; read only by the 2 s catch-up interval"}
  - {id: "fbc_raw_*", owner: fallback, written_by: [modbus], read_by: [fallback], note: "declared inside the fallback profile globals; written only by the poll dispatch"}
  - {id: "dump guard globals (45)", owner: dump, written_by: [dump], read_by: [dump], note: "written in on_value of ecco_battery_soc (3), ecco_battery_power (30) and ecco_grid_ct_power (13), and by Dump scripts and intervals; nothing outside dump reads them"}
  - {id: supervision_state, owner: fallback, written_by: [core, fallback], read_by: [core, fallback], note: "written by core on_boot, the api heartbeat action and the supervision tick"}
  - {id: ecco_inverter_power, owner: telemetry, written_by: [modbus], read_by: [dump], note: "published by poll_inverter_telemetry; read by dump_controller_tick (feasibility / house estimate)"}
  - {id: ntp_synced, owner: rtc, written_by: [core], read_by: [rtc, free_power, dump, fallback], note: "written only by time on_time_sync (core)"}
  - {id: free_power_snapshot_valid, owner: free_power, written_by: [core, free_power], read_by: [core, free_power, tou, modbus, dump, arbitration, fallback], note: "loaded by core on_boot; read by every write path as a cross-domain START gate"}
  - {id: dump_snapshot_valid, owner: dump, written_by: [core, dump], read_by: [core, dump, free_power, tou, arbitration, fallback], note: "loaded by core on_boot; a cross-domain START gate"}
  - {id: reg244_snapshot_valid, owner: tou, written_by: [core, tou], read_by: [core, free_power, tou, dump, arbitration, fallback], note: "loaded by core on_boot; a cross-domain START gate"}
